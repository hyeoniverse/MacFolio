<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<!-- API 문서 앱: 밝은 바탕에 'API'와 그 아래 엔드포인트 목록 (메서드 색 알약 + 경로 줄) -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#e6eefb"/>
		</linearGradient>
	</defs>
	<!-- 칸을 꽉 채운다 (둥근 모서리는 Dock·Launchpad가 깎는다, 다른 아이콘과 같게) -->
	<rect width="1024" height="1024" fill="url(#bg)"/>
	<text x="512" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="260" font-weight="600" letter-spacing="6" fill="#1f6fe5">API</text>
	<!-- 엔드포인트: GET · POST · DELETE -->
	<g>
		<rect x="250" y="548" width="112" height="48" rx="24" fill="#34c759"/>
		<rect x="390" y="561" width="384" height="22" rx="11" fill="#c9d4e6"/>
		<rect x="250" y="636" width="112" height="48" rx="24" fill="#0a84ff"/>
		<rect x="390" y="649" width="300" height="22" rx="11" fill="#c9d4e6"/>
		<rect x="250" y="724" width="112" height="48" rx="24" fill="#ff9f0a"/>
		<rect x="390" y="737" width="344" height="22" rx="11" fill="#c9d4e6"/>
	</g>
</svg>
