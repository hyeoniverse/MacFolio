<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c6b"/>
      <stop offset="1" stop-color="#0e0f2e"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd4ff"/>
      <stop offset="1" stop-color="#2f5bff"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6aa0"/>
      <stop offset="1" stop-color="#e2327a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- 겹쳐 쌓인 두 장의 판 (아래: 파랑, 위: 분홍). 꼭짓점을 둥글게 하려고 같은 색 굵은 선을 둘렀다 -->
  <path d="M64 58 L98 76 L64 94 L30 76 Z" fill="url(#bottom)" stroke="url(#bottom)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M64 34 L98 52 L64 70 L30 52 Z" fill="url(#top)" stroke="url(#top)" stroke-width="12" stroke-linejoin="round"/>
</svg>
