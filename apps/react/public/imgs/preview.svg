<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
	<!-- 미리보기 앱 (macOS 26): 파란 둥근 네모 위에 보석 감정용 루페. 검은 테 위쪽에 청록 렌즈, 아래는 빛이 비치는 유리 통 -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#b6d0ff"/>
			<stop offset="0.45" stop-color="#7aa6ff"/>
			<stop offset="1" stop-color="#2f6cf0"/>
		</linearGradient>
		<radialGradient id="shine" cx="0.5" cy="0" r="0.75">
			<stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#fff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#0e0e10"/>
			<stop offset="0.22" stop-color="#3b3b40"/>
			<stop offset="0.35" stop-color="#18181b"/>
			<stop offset="0.78" stop-color="#121214"/>
			<stop offset="0.9" stop-color="#34343a"/>
			<stop offset="1" stop-color="#0c0c0e"/>
		</linearGradient>
		<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4a4a50"/>
			<stop offset="1" stop-color="#1b1b1e"/>
		</linearGradient>
		<radialGradient id="lens" cx="0.45" cy="0.35" r="0.75">
			<stop offset="0" stop-color="#c9f6ff"/>
			<stop offset="0.45" stop-color="#4fc3dc"/>
			<stop offset="1" stop-color="#0f4d63"/>
		</radialGradient>
		<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#fff" stop-opacity="0.38"/>
		</linearGradient>
		<radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
			<stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
		</radialGradient>
		<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="14"/>
		</filter>
	</defs>

	<!-- 바탕 -->
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
	<rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="3"/>

	<!-- 루페 그림자 -->
	<ellipse cx="512" cy="742" rx="250" ry="62" fill="#1a3f9e" opacity="0.35" filter="url(#soft)"/>

	<!-- 유리 통: 테 아래에서 넓어지며 바닥에 빛이 고인다 -->
	<path d="M322 440 L282 700 A230 72 0 0 0 742 700 L702 440 Z" fill="url(#glass)"/>
	<ellipse cx="512" cy="700" rx="230" ry="72" fill="url(#pool)"/>
	<path d="M322 440 L282 700 M702 440 L742 700" stroke="#fff" stroke-opacity="0.6" stroke-width="5" fill="none"/>
	<ellipse cx="512" cy="700" rx="230" ry="72" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4"/>
	<path d="M360 470 L330 680" stroke="#fff" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round"/>

	<!-- 검은 테 -->
	<path d="M322 320 L322 440 A190 66 0 0 0 702 440 L702 320 Z" fill="url(#ring)"/>
	<ellipse cx="512" cy="320" rx="190" ry="66" fill="url(#rim)"/>
	<ellipse cx="512" cy="320" rx="190" ry="66" fill="none" stroke="#6a6a72" stroke-width="3"/>

	<!-- 렌즈 -->
	<ellipse cx="512" cy="322" rx="132" ry="44" fill="url(#lens)"/>
	<ellipse cx="512" cy="322" rx="132" ry="44" fill="none" stroke="#071d26" stroke-opacity="0.6" stroke-width="4"/>
	<ellipse cx="470" cy="308" rx="44" ry="11" fill="#fff" opacity="0.75"/>
</svg>
