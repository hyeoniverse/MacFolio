<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<!-- 미리보기 앱: 겹친 사진 두 장 위에 돋보기 (macOS 미리보기처럼) -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f4f6fa"/>
			<stop offset="1" stop-color="#d9dee7"/>
		</linearGradient>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4aa3f0"/>
			<stop offset="1" stop-color="#a9d8ff"/>
		</linearGradient>
		<linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#5cc46a"/>
			<stop offset="1" stop-color="#2f8f45"/>
		</linearGradient>
		<radialGradient id="glass" cx="0.4" cy="0.35" r="0.7">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
			<stop offset="1" stop-color="#cfe6ff" stop-opacity="0.35"/>
		</radialGradient>
	</defs>
	<!-- 칸을 꽉 채운다 (둥근 모서리는 Dock·Launchpad가 깎는다, 다른 아이콘과 같게) -->
	<rect width="1024" height="1024" fill="url(#bg)"/>
	<!-- 뒤 사진 -->
	<g transform="rotate(-10 470 470)">
		<rect x="190" y="230" width="520" height="400" rx="18" fill="#ffffff"/>
		<rect x="220" y="260" width="460" height="340" rx="6" fill="#f2b56b"/>
		<circle cx="580" cy="340" r="44" fill="#fff1c9"/>
	</g>
	<!-- 앞 사진 -->
	<g transform="rotate(6 520 560)">
		<rect x="250" y="340" width="540" height="420" rx="18" fill="#ffffff"/>
		<rect x="280" y="370" width="480" height="360" rx="6" fill="url(#sky)"/>
		<circle cx="660" cy="450" r="40" fill="#fff6c2"/>
		<path d="M280 730 L280 620 Q380 520 480 600 Q580 520 760 640 L760 730 Z" fill="url(#hill)"/>
	</g>
	<!-- 돋보기 -->
	<line x1="770" y1="790" x2="900" y2="920" stroke="#3a3f4a" stroke-width="56" stroke-linecap="round"/>
	<circle cx="660" cy="680" r="170" fill="url(#glass)" stroke="#5a6170" stroke-width="40"/>
</svg>
