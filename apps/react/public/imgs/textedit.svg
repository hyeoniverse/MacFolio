<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
	<!-- 텍스트 편집기 앱 (macOS 26): 밝은 둥근 네모 위에 줄이 그어진 종이 한 장과 비스듬한 만년필 -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#dcdde3"/>
		</linearGradient>
		<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#f1f2f6"/>
		</linearGradient>
		<linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#1c1c20"/>
			<stop offset="0.45" stop-color="#4a4a52"/>
			<stop offset="1" stop-color="#18181b"/>
		</linearGradient>
		<linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f3d9a0"/>
			<stop offset="1" stop-color="#b8892e"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
		</filter>
	</defs>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
	<g filter="url(#shadow)">
		<rect x="262" y="196" width="460" height="600" rx="28" fill="url(#paper)" stroke="#d5d7de" stroke-width="4"/>
	</g>
	<g stroke="#b9c3d6" stroke-width="10" stroke-linecap="round">
		<line x1="322" y1="300" x2="662" y2="300"/>
		<line x1="322" y1="370" x2="662" y2="370"/>
		<line x1="322" y1="440" x2="620" y2="440"/>
		<line x1="322" y1="510" x2="662" y2="510"/>
		<line x1="322" y1="580" x2="560" y2="580"/>
		<line x1="322" y1="650" x2="500" y2="650"/>
	</g>
	<line x1="322" y1="240" x2="420" y2="240" stroke="#3478f6" stroke-width="14" stroke-linecap="round"/>
	<g transform="rotate(38 640 560)" filter="url(#shadow)">
		<rect x="610" y="300" width="60" height="380" rx="30" fill="url(#pen)"/>
		<rect x="610" y="430" width="60" height="22" fill="#c9a24a"/>
		<path d="M610 680 L670 680 L640 770 Z" fill="url(#nib)"/>
		<line x1="640" y1="700" x2="640" y2="760" stroke="#6b4e14" stroke-width="4"/>
	</g>
</svg>
