<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
	<!-- QuickTime Player: 짙은 남색 둥근 네모 위에 은빛 Q (고리와 오른쪽 아래로 빠진 꼬리), 고리 안에 파란 빛 -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3a4a6b"/>
			<stop offset="1" stop-color="#0d1426"/>
		</linearGradient>
		<radialGradient id="shine" cx="0.5" cy="0" r="0.8">
			<stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
			<stop offset="1" stop-color="#fff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.45" stop-color="#c9d1dc"/>
			<stop offset="1" stop-color="#7c8797"/>
		</linearGradient>
		<radialGradient id="core" cx="0.42" cy="0.38" r="0.7">
			<stop offset="0" stop-color="#9fdcff"/>
			<stop offset="0.55" stop-color="#2a7fe0"/>
			<stop offset="1" stop-color="#0a2a66"/>
		</radialGradient>
	</defs>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
	<circle cx="500" cy="490" r="210" fill="url(#core)"/>
	<circle cx="500" cy="490" r="230" fill="none" stroke="url(#silver)" stroke-width="74"/>
	<path d="M610 600 L760 760" stroke="url(#silver)" stroke-width="84" stroke-linecap="round"/>
	<ellipse cx="440" cy="400" rx="90" ry="40" fill="#fff" opacity="0.35" transform="rotate(-30 440 400)"/>
</svg>
