<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
	<!-- QuickTime Player (macOS Big Sur 이후): 네모 판 없이 떠 있는 Q. 짙은 남색 금속 고리, 안은 위가 밝고 아래가 깊은 파란 렌즈, 오른쪽 아래로 빠진 은빛 꼬리 -->
	<defs>
		<linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#5b6a86"/>
			<stop offset="0.35" stop-color="#26324a"/>
			<stop offset="1" stop-color="#070b14"/>
		</linearGradient>
		<linearGradient id="ringEdge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#c7d2e4"/>
			<stop offset="1" stop-color="#3a465c"/>
		</linearGradient>
		<radialGradient id="lens" cx="0.5" cy="0.32" r="0.78">
			<stop offset="0" stop-color="#d7f3ff"/>
			<stop offset="0.28" stop-color="#6cc3ff"/>
			<stop offset="0.7" stop-color="#1663d6"/>
			<stop offset="1" stop-color="#0a2b74"/>
		</radialGradient>
		<linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f4f6fa"/>
			<stop offset="0.5" stop-color="#b8c1cf"/>
			<stop offset="1" stop-color="#6d7788"/>
		</linearGradient>
		<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
			<stop offset="1" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
		</filter>
	</defs>

	<g filter="url(#shadow)">
		<!-- 꼬리: 고리 뒤에서 오른쪽 아래로 -->
		<path d="M640 640 L800 800 Q824 824 800 848 L776 872 Q752 896 728 872 L568 712 Z" fill="url(#tail)"/>
		<path d="M800 800 Q824 824 800 848 L776 872" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="6"/>
		<!-- 고리 -->
		<circle cx="490" cy="490" r="330" fill="url(#ring)"/>
		<circle cx="490" cy="490" r="327" fill="none" stroke="url(#ringEdge)" stroke-width="6"/>
		<!-- 렌즈 -->
		<circle cx="490" cy="490" r="246" fill="url(#lens)"/>
		<circle cx="490" cy="490" r="246" fill="none" stroke="#04122e" stroke-opacity="0.65" stroke-width="10"/>
		<!-- 렌즈 안쪽의 빛 고리와 위쪽 윤기 -->
		<circle cx="490" cy="520" r="170" fill="none" stroke="#bfe8ff" stroke-opacity="0.35" stroke-width="18"/>
		<ellipse cx="490" cy="350" rx="190" ry="90" fill="url(#gloss)"/>
		<!-- 고리 위쪽 금속 빛 -->
		<path d="M230 360 A300 300 0 0 1 750 360" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="14" stroke-linecap="round"/>
	</g>
</svg>
