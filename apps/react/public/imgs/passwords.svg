<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- iOS 암호 앱: 흰 바탕에 노랑·초록·파랑 열쇠 세 개가 겹쳐 있다 -->
  <defs>
    <linearGradient id="yellow" gradientUnits="userSpaceOnUse" x1="0" y1="-17" x2="0" y2="64">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="-17" x2="0" y2="64">
      <stop offset="0" stop-color="#63de74"/>
      <stop offset="1" stop-color="#1fae45"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="-17" x2="0" y2="64">
      <stop offset="0" stop-color="#6cc7ff"/>
      <stop offset="1" stop-color="#0a72f0"/>
    </linearGradient>
    <!-- 열쇠 모양: 머리(원) + 몸통(끝이 비스듬). 색은 머리부터 끝까지 한 번에 이어지도록 좌표로 칠한다 -->
    <g id="key">
      <circle cx="0" cy="0" r="17"/>
      <path d="M-6 10 H6 V58 L0 64 L-6 58 Z"/>
    </g>
  </defs>
  <rect width="128" height="128" rx="29" fill="#ffffff"/>
  <!-- 뒤쪽 열쇠부터. 흰 테두리를 먼저 그려 앞 열쇠와 떨어져 보이게 한다 -->
  <g transform="translate(41 42)">
    <use href="#key" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <use href="#key" fill="url(#yellow)"/>
  </g>
  <g transform="translate(58 42)">
    <use href="#key" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <use href="#key" fill="url(#green)"/>
  </g>
  <g transform="translate(77 40) scale(1.08)">
    <use href="#key" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <use href="#key" fill="url(#blue)"/>
    <!-- 앞 열쇠의 이 (오른쪽 톱니) -->
    <path d="M4 34 H12 V39 L6 42 H4 Z M4 45 H12 V50 L6 53 H4 Z" fill="url(#blue)"/>
    <!-- 머리의 구멍 -->
    <circle cx="0" cy="-5" r="5" fill="#ffffff"/>
  </g>
</svg>
