<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">리바인딩 공격의 목표: 방화벽 안 서버에 바깥에서 접근</text>
  <!-- 내부망 -->
  <rect x="16" y="46" width="350" height="270" rx="10" fill="#f5f5f7" stroke="#6e6e73" stroke-dasharray="5 4"/>
  <text x="30" y="68" font-size="12" fill="#6e6e73">내부망</text>
  <!-- 방화벽 -->
  <rect x="384" y="46" width="30" height="270" fill="#e8f2ff" stroke="#0a84ff"/>
  <g stroke="#0a84ff" stroke-width="1"><line x1="384" y1="100" x2="414" y2="100"/><line x1="384" y1="154" x2="414" y2="154"/><line x1="384" y1="208" x2="414" y2="208"/><line x1="384" y1="262" x2="414" y2="262"/><line x1="399" y1="46" x2="399" y2="316"/></g>
  <text x="399" y="336" text-anchor="middle" font-size="12" fill="#0a84ff">방화벽</text>
  <!-- 사용자 -->
  <rect x="40" y="84" width="150" height="70" rx="8" fill="#fff" stroke="#1d1d1f"/>
  <text x="115" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">사용자 브라우저</text>
  <rect x="68" y="120" width="94" height="24" rx="5" fill="#ff9f0a"/>
  <text x="115" y="137" text-anchor="middle" font-size="12" fill="#1d1d1f">공격자 스크립트</text>
  <!-- 내부 서버 -->
  <rect x="40" y="232" width="150" height="62" rx="8" fill="#1d1d1f"/>
  <text x="115" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">내부 서버(취약)</text>
  <text x="115" y="278" text-anchor="middle" font-size="12" fill="#d1d1d6">공유기·IoT 관리 페이지</text>
  <!-- 공격자 -->
  <rect x="470" y="150" width="150" height="62" rx="8" fill="#1d1d1f"/>
  <text x="545" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">공격자 서버</text>
  <text x="545" y="196" text-anchor="middle" font-size="12" fill="#d1d1d6">www.attacker32.com</text>
  <!-- 화살표 -->
  <path d="M470 164 C430 130 300 112 192 112" stroke="#34c759" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="272" y="96" text-anchor="middle" font-size="12" fill="#248a3d">JavaScript가 든 웹 페이지</text>
  <text x="272" y="80" text-anchor="middle" font-size="12" fill="#6e6e73">(사용자가 요청했으므로 통과)</text>
  <path d="M470 200 C440 220 330 260 194 262" stroke="#ff9f0a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <circle cx="399" cy="228" r="13" fill="#ff9f0a"/><text x="399" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">×</text>
  <text x="470" y="260" font-size="12" fill="#c46f00">직접 접속: 방화벽이 차단</text>
  <line x1="115" y1="146" x2="115" y2="230" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <circle cx="115" cy="188" r="13" fill="#ff9f0a"/><text x="115" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">×</text>
  <text x="136" y="186" font-size="12" fill="#c46f00">스크립트 요청: 출처가</text>
  <text x="136" y="202" font-size="12" fill="#c46f00">달라 SOP가 차단</text>
</svg>
