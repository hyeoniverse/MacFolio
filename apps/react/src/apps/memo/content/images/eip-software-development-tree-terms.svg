<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>트리 용어</title><rect width="640" height="365" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">트리 용어: 예제 트리의 근 노드, 차수, 단말 노드, 레벨</text><line x1="230.0" y1="70" x2="155.0" y2="140" stroke="#c7c7cc" stroke-width="2"/><line x1="230.0" y1="70" x2="305.0" y2="140" stroke="#c7c7cc" stroke-width="2"/><line x1="155.0" y1="140" x2="117.5" y2="210" stroke="#c7c7cc" stroke-width="2"/><line x1="305.0" y1="140" x2="267.5" y2="210" stroke="#c7c7cc" stroke-width="2"/><line x1="305.0" y1="140" x2="350.0" y2="210" stroke="#c7c7cc" stroke-width="2"/><line x1="267.5" y1="210" x2="230.0" y2="280" stroke="#c7c7cc" stroke-width="2"/><line x1="267.5" y1="210" x2="305.0" y2="280" stroke="#c7c7cc" stroke-width="2"/><circle cx="230.0" cy="70" r="18" fill="#0a84ff" stroke="#6e6e73" stroke-width="1"/><text x="230.0" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">A</text><circle cx="155.0" cy="140" r="18" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1"/><text x="155.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">B</text><circle cx="305.0" cy="140" r="18" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1"/><text x="305.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">C</text><circle cx="117.5" cy="210" r="18" fill="#30d158" stroke="#6e6e73" stroke-width="1"/><text x="117.5" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">D</text><circle cx="267.5" cy="210" r="18" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1"/><text x="267.5" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">E</text><circle cx="350.0" cy="210" r="18" fill="#30d158" stroke="#6e6e73" stroke-width="1"/><text x="350.0" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">F</text><circle cx="230.0" cy="280" r="18" fill="#30d158" stroke="#6e6e73" stroke-width="1"/><text x="230.0" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">G</text><circle cx="305.0" cy="280" r="18" fill="#30d158" stroke="#6e6e73" stroke-width="1"/><text x="305.0" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">H</text><text x="30" y="75" font-size="12" fill="#6e6e73">레벨 1</text><text x="30" y="145" font-size="12" fill="#6e6e73">레벨 2</text><text x="30" y="215" font-size="12" fill="#6e6e73">레벨 3</text><text x="30" y="285" font-size="12" fill="#6e6e73">레벨 4</text><rect x="390" y="46" width="236" height="32" rx="6" fill="#e8f2ff"/><text x="400" y="67" font-size="12" font-weight="600" fill="#1d1d1f">근 노드(Root)</text><text x="616" y="67" text-anchor="end" font-size="12" fill="#6e6e73">A (부모가 없는 맨 위 노드)</text><rect x="390" y="84" width="236" height="32" rx="6" fill="#f2f2f7"/><text x="400" y="105" font-size="12" font-weight="600" fill="#1d1d1f">노드 차수(Degree)</text><text x="616" y="105" text-anchor="end" font-size="12" fill="#6e6e73">A=2, B=1, D=0</text><rect x="390" y="122" width="236" height="32" rx="6" fill="#f2f2f7"/><text x="400" y="143" font-size="12" font-weight="600" fill="#1d1d1f">트리의 차수</text><text x="616" y="143" text-anchor="end" font-size="12" fill="#6e6e73">2 (노드 차수의 최댓값)</text><rect x="390" y="160" width="236" height="32" rx="6" fill="#e9f9ee"/><text x="400" y="181" font-size="12" font-weight="600" fill="#1d1d1f">단말 노드(Leaf)</text><text x="616" y="181" text-anchor="end" font-size="12" fill="#6e6e73">D, F, G, H (차수 0)</text><rect x="390" y="198" width="236" height="32" rx="6" fill="#f2f2f7"/><text x="400" y="219" font-size="12" font-weight="600" fill="#1d1d1f">비단말 노드</text><text x="616" y="219" text-anchor="end" font-size="12" fill="#6e6e73">A, B, C, E</text><rect x="390" y="236" width="236" height="32" rx="6" fill="#f2f2f7"/><text x="400" y="257" font-size="12" font-weight="600" fill="#1d1d1f">깊이(Depth, 높이)</text><text x="616" y="257" text-anchor="end" font-size="12" fill="#6e6e73">4 (가장 큰 레벨)</text><rect x="390" y="274" width="236" height="32" rx="6" fill="#f2f2f7"/><text x="400" y="295" font-size="12" font-weight="600" fill="#1d1d1f">형제(Sibling)</text><text x="616" y="295" text-anchor="end" font-size="12" fill="#6e6e73">B와 C, G와 H</text><text x="320" y="345" text-anchor="middle" font-size="12" fill="#6e6e73">레벨은 근 노드를 1로 매기는 방식이 시험에서 쓰인다. 책에 따라 0부터 매기기도 한다</text></svg>
