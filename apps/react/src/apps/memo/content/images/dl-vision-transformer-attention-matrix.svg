  <text x="235" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#e8743b" font-style="italic">K<tspan font-size="10" dy="-6">T</tspan></text>
  <line x1="112" y1="124" x2="290" y2="124" stroke="#1d1d1f" stroke-width="2"/>
  <text x="201" y="154" text-anchor="middle" font-size="18" font-weight="400" fill="#1d1d1f" >√<tspan font-style="italic">d</tspan><tspan font-size="10" dy="4" font-style="italic">k</tspan></text>
  <text x="308" y="152" font-size="56" font-weight="300" fill="#1d1d1f" text-anchor="middle">)</text>
  <text x="334" y="134" text-anchor="middle" font-size="18" font-weight="400" fill="#1d1d1f" >×</text>
  <rect x="352" y="96" width="40" height="72" fill="#d2efc8" stroke="#5aa84a"/>
  <line x1="372" y1="96" x2="372" y2="168" stroke="#5aa84a"/>
  <line x1="352" y1="114" x2="392" y2="114" stroke="#5aa84a"/>
  <line x1="352" y1="132" x2="392" y2="132" stroke="#5aa84a"/>
  <line x1="352" y1="150" x2="392" y2="150" stroke="#5aa84a"/>
  <text x="372" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#3f8f33" font-style="italic">V</text>
  <text x="420" y="134" text-anchor="middle" font-size="20" font-weight="400" fill="#1d1d1f" >=</text>
  <rect x="450" y="96" width="40" height="72" fill="#d6e2ff" stroke="#3b5bdb"/>
  <line x1="470" y1="96" x2="470" y2="168" stroke="#3b5bdb"/>
  <line x1="450" y1="114" x2="490" y2="114" stroke="#3b5bdb"/>
  <line x1="450" y1="132" x2="490" y2="132" stroke="#3b5bdb"/>
