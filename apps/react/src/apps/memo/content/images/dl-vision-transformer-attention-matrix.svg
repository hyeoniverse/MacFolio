<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="230" fill="#fff"/>
  <g transform="translate(40,0)">
  <text x="48" y="142" text-anchor="middle" font-size="15" font-weight="400" fill="#1d1d1f" >softmax</text>
  <text x="92" y="152" font-size="56" font-weight="300" fill="#1d1d1f" text-anchor="middle">(</text>
  <rect x="120" y="44" width="40" height="72" fill="#ffe9a8" stroke="#d4a72c"/>
  <line x1="140" y1="44" x2="140" y2="116" stroke="#d4a72c"/>
  <line x1="120" y1="62" x2="160" y2="62" stroke="#d4a72c"/>
