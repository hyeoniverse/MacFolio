  <text x="490" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a8a" >어텐션 값 행렬</text>
  <text x="490" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a8a" >(attention value matrix) α</text>
  <g font-size="11.5" fill="#6e6e73">
    <text x="20" y="200">Q·Kᵀ로 토큰 사이 유사도를 구하고 √dₖ로 나눠 softmax로 가중치를 만든 뒤, 그 가중치로 V를 섞는다</text>
