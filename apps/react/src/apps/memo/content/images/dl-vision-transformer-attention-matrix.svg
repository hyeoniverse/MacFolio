  <text x="178" y="80" text-anchor="middle" font-size="18" font-weight="400" fill="#1d1d1f" >×</text>
  <rect x="195" y="58" width="80" height="36" fill="#ffd2bd" stroke="#e8743b"/>
  <line x1="215" y1="58" x2="215" y2="94" stroke="#e8743b"/>
