<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>창 밖으로 나가는 세 갈래: 요청 저장소에 적고, 받는 앱이 읽고 비운다</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">창 밖으로 나가는 세 갈래: 요청 저장소에 적고, 받는 앱이 읽고 비운다</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">이 Mac에 관하여 창은 다른 앱을 직접 부르지 않는다. 작은 저장소에 값을 적고 openApp만 부른다</text>
<rect x="32" y="90" width="190" height="270" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="127.0" y="186.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">이 Mac에 관하여</text>
<text x="127.0" y="203.5" font-size="11" fill="#374151" text-anchor="middle">AboutThisMac.tsx</text>
<text x="127.0" y="220.5" font-size="11" fill="#374151" text-anchor="middle"></text>
<text x="127.0" y="237.5" font-size="11" fill="#374151" text-anchor="middle">추가 정보…</text>
<text x="127.0" y="254.5" font-size="11" fill="#374151" text-anchor="middle">이메일 (ProfileLink)</text>
<text x="127.0" y="271.5" font-size="11" fill="#374151" text-anchor="middle">개인정보 처리 방침</text>
<line x1="222" y1="137" x2="330" y2="137" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="276.0" y="131.0" font-size="11" fill="#4f46e5" text-anchor="middle">setState</text>
<rect x="334" y="110" width="220" height="54" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="444.0" y="132.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">requestedSection</text>
<text x="444.0" y="149.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">{ section: &quot;about&quot; }</text>
<line x1="554" y1="137" x2="640" y2="137" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="597.0" y="131.0" font-size="11" fill="#374151" text-anchor="middle">읽고 비움</text>
<rect x="644" y="110" width="190" height="54" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="739.0" y="132.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">시스템 설정</text>
<text x="739.0" y="149.5" font-size="11" fill="#374151" text-anchor="middle">구독 → 정보 항목으로</text>
<line x1="222" y1="227" x2="330" y2="227" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="276.0" y="221.0" font-size="11" fill="#4f46e5" text-anchor="middle">setState</text>
<rect x="334" y="200" width="220" height="54" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="444.0" y="222.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">composeRequest</text>
<text x="444.0" y="239.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">{ pending: true }</text>
<line x1="554" y1="227" x2="640" y2="227" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="597.0" y="221.0" font-size="11" fill="#374151" text-anchor="middle">읽고 비움</text>
<rect x="644" y="200" width="190" height="54" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="739.0" y="222.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">메일</text>
<text x="739.0" y="239.5" font-size="11" fill="#374151" text-anchor="middle">takeComposeRequest → 쓰기</text>
<line x1="222" y1="317" x2="330" y2="317" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="276.0" y="311.0" font-size="11" fill="#4f46e5" text-anchor="middle">setState</text>
<rect x="334" y="290" width="220" height="54" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="444.0" y="312.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">finderDocRequest</text>
<text x="444.0" y="329.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">{ path: &quot;docs/privacy.md&quot; }</text>
<line x1="554" y1="317" x2="640" y2="317" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="597.0" y="311.0" font-size="11" fill="#374151" text-anchor="middle">읽고 비움</text>
<rect x="644" y="290" width="190" height="54" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="739.0" y="312.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Finder</text>
<text x="739.0" y="329.5" font-size="11" fill="#374151" text-anchor="middle">마운트되며 가져가 문서 열기</text>
<text x="334" y="385" font-size="11" fill="#6b7280" text-anchor="start">세 저장소 모두 @macfolio/desktop-core의 createStore. 앱이 이미 열려 있어도 subscribe로 바로 받는다</text>
</svg>
