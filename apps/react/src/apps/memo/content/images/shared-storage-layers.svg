<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>브라우저 저장소: 사용처 일곱 곳이 storage.ts 하나를 거친다</title>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
</defs>
<rect width="640" height="290" rx="16" fill="#ffffff"/>
<text x="32" y="38" font-size="17" font-weight="700" fill="#1f2937">세 층: 쓰는 곳 → storage.ts → 브라우저</text>
<g font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">
<rect x="32" y="62" width="92" height="30" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="78" y="81">settingsStore</text>
<rect x="132" y="62" width="92" height="30" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="178" y="81">memoStorage</text>
<rect x="232" y="62" width="92" height="30" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="278" y="81">weather/places</text>
<rect x="332" y="62" width="92" height="30" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="378" y="81">useWindowFrame</text>
<rect x="432" y="62" width="92" height="30" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="478" y="81">messages</text>
<rect x="532" y="62" width="76" height="30" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="570" y="81">siteStorage</text>
</g>
<text x="320" y="110" font-size="10.5" fill="#6b7280" text-anchor="middle">모양 검사(parseSettings · parseArrangement …)만 한다. try/catch 없음</text>
<g stroke="#4f46e5" stroke-width="1.5" fill="none">
<path d="M78 92 L250 136" marker-end="url(#ok)"/><path d="M178 92 L280 136" marker-end="url(#ok)"/><path d="M278 92 L305 136" marker-end="url(#ok)"/>
<path d="M378 92 L335 136" marker-end="url(#ok)"/><path d="M478 92 L360 136" marker-end="url(#ok)"/><path d="M570 92 L390 136" marker-end="url(#ok)"/>
</g>
<rect x="190" y="140" width="260" height="62" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="320" y="162" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">shared/lib/storage.ts</text>
<text x="320" y="179" font-size="10.5" fill="#374151" text-anchor="middle">STORAGE_KEYS · readJson/writeJson · readString/writeString</text>
<text x="320" y="194" font-size="10.5" fill="#6b7280" text-anchor="middle">없으면 null, JSON 아니면 null, 못 쓰면 false. 던지지 않는다</text>
<path d="M260 202 L200 236" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gray)"/>
<path d="M380 202 L440 236" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gray)"/>
<rect x="120" y="240" width="160" height="30" rx="8" fill="#f3f4f6"/><text x="200" y="259" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">localStorage</text>
<rect x="360" y="240" width="160" height="30" rx="8" fill="#f3f4f6"/><text x="440" y="259" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">sessionStorage</text>
<text x="320" y="284" font-size="10.5" fill="#6b7280" text-anchor="middle">사생활 보호 창·용량 초과·접근 거부(SecurityError)는 여기서 끝난다</text>
</svg>
