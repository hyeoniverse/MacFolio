<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="345" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>

  <!-- 시퀀스 -->
  <g font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle"><text x="40" y="26">A</text><text x="220" y="26">B</text></g>
  <g font-size="12" fill="#6e6e73" text-anchor="middle"><text x="40" y="44">클라이언트</text><text x="220" y="44">서버</text></g>
  <g stroke="#1d1d1f" stroke-width="1.5"><line x1="40" y1="54" x2="40" y2="320"/><line x1="220" y1="54" x2="220" y2="320"/></g>

  <line x1="40" y1="70" x2="218" y2="104" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="125" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">SYN</text>

  <line x1="220" y1="130" x2="42" y2="170" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="130" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">SYN+ACK</text>
  <text x="130" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">seqno = f(data)</text>
  <text x="130" y="214" text-anchor="middle" font-size="12" fill="#6e6e73">상태를 seqno 안에 담는다</text>

  <line x1="40" y1="236" x2="218" y2="270" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="125" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">ACK f(data)+1</text>

  <rect x="228" y="270" width="100" height="40" rx="5" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="278" y="287" text-anchor="middle" font-size="12" fill="#1d1d1f">IP/포트,</text>
  <text x="278" y="302" text-anchor="middle" font-size="12" fill="#1d1d1f">MSS, …</text>
  <text x="228" y="330" font-size="12" fill="#6e6e73">ACK 검증 후 상태 복원</text>
  <text x="228" y="100" font-size="12" fill="#6e6e73">상태 저장 안 함</text>

  <!-- f(.) 구성 -->
  <rect x="330" y="20" width="294" height="214" rx="12" fill="#fff" stroke="#34c759" stroke-width="2"/>
  <text x="346" y="48" font-size="15" font-weight="600" fill="#1d1d1f">f(.) =</text>
  <text x="608" y="48" text-anchor="end" font-size="13" font-weight="600" fill="#34c759">32비트 seqno</text>
  <g font-size="12" fill="#6e6e73" text-anchor="middle"><text x="389" y="76">5비트</text><text x="479" y="76">3비트</text><text x="569" y="76">24비트</text></g>
  <g fill="#0a84ff"><rect x="344" y="84" width="88" height="52" rx="3"/><rect x="436" y="84" width="88" height="52" rx="3"/><rect x="526" y="84" width="88" height="52" rx="3"/></g>
  <g font-size="13" fill="#fff" text-anchor="middle">
    <text x="389" y="106">느리게 바뀌는</text><text x="389" y="123">타임스탬프</text>
    <text x="479" y="115">MSS</text>
    <text x="569" y="115">보안 해시</text>
  </g>
  <g font-size="12" fill="#1d1d1f" text-anchor="middle">
    <text x="389" y="158">재전송 공격</text><text x="389" y="174">방지</text>
    <text x="479" y="158">이 연결에</text><text x="479" y="174">필요한 정보</text>
    <text x="569" y="158">입력: IP·포트,</text><text x="569" y="174">MSS, 타임스탬프</text>
  </g>
  <text x="477" y="214" text-anchor="middle" font-size="12" fill="#6e6e73">해시에는 서버만 아는 비밀 키가 들어간다</text>
</svg>
