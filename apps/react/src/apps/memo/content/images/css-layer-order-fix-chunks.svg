<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>Vite 빌드가 여러 앱이 함께 쓰는 Button을 공용 청크로 분리하고, 그 CSS를 진입점 CSS보다 먼저 연결하는 과정</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6e6e73"/></marker>
  </defs>
  <rect width="640" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">빌드가 CSS 파일을 나누는 방식</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">여러 곳에서 import하는 모듈은 공용 청크로 분리되고, CSS도 청크 단위로 별도 파일이 된다</text>

  <!-- 소스 -->
  <text x="24" y="90" font-size="13" font-weight="600" fill="#1d1d1f">소스 코드 (import 관계)</text>
  <rect x="24" y="102" width="150" height="58" rx="8" fill="#f2f2f7"/>
  <text x="36" y="124" font-size="13" font-weight="600" fill="#1d1d1f">main.tsx</text>
  <text x="36" y="146" font-size="12" fill="#6e6e73">layers.css, index.css</text>
  <rect x="24" y="176" width="150" height="40" rx="8" fill="#f2f2f7"/>
  <text x="36" y="201" font-size="13" fill="#1d1d1f">메일 앱</text>
  <rect x="24" y="226" width="150" height="40" rx="8" fill="#f2f2f7"/>
  <text x="36" y="251" font-size="13" fill="#1d1d1f">메모 앱 외 여러 앱</text>
  <rect x="226" y="176" width="150" height="90" rx="8" fill="#e5f1ff" stroke="#0a84ff"/>
  <text x="238" y="200" font-size="13" font-weight="600" fill="#1d1d1f">공통 Button</text>
  <text x="238" y="222" font-size="12" fill="#6e6e73">Button.css</text>
  <text x="238" y="242" font-size="12" fill="#0a84ff">@layer components</text>
  <path d="M174 196 H222" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <path d="M174 246 H222" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <path d="M174 131 H300 V172" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <text x="186" y="124" font-size="12" fill="#6e6e73">직간접 import</text>

  <!-- 빌드 결과 -->
  <text x="420" y="90" font-size="13" font-weight="600" fill="#1d1d1f">빌드 결과 (dist/assets)</text>
  <rect x="420" y="102" width="196" height="58" rx="8" fill="#e5f1ff" stroke="#0a84ff"/>
  <text x="432" y="124" font-size="12" font-weight="600" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">repository-….css</text>
  <text x="432" y="146" font-size="12" fill="#0a84ff">공용 청크: components 층</text>
  <rect x="420" y="170" width="196" height="58" rx="8" fill="#f2f2f7"/>
  <text x="432" y="192" font-size="12" font-weight="600" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">main-….css</text>
  <text x="432" y="214" font-size="12" fill="#6e6e73">진입점: 순서 선언, reset 층</text>
  <rect x="420" y="238" width="196" height="40" rx="8" fill="#f2f2f7"/>
  <text x="432" y="263" font-size="12" fill="#6e6e73">앱별 청크 (Mail-….js 등)</text>
  <path d="M380 200 H398 V131 H416" fill="none" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#m)"/>

  <!-- HTML -->
  <text x="24" y="314" font-size="13" font-weight="600" fill="#1d1d1f">빌드한 index.html의 &lt;head&gt;</text>
  <rect x="24" y="326" width="592" height="64" rx="8" fill="#1d1d1f"/>
  <text x="40" y="352" font-size="12" fill="#ffffff" font-family="ui-monospace, Menlo, monospace">① &lt;link rel="stylesheet" href="/assets/repository-….css"&gt;</text>
  <text x="40" y="374" font-size="12" fill="#c7c7cc" font-family="ui-monospace, Menlo, monospace">② &lt;link rel="stylesheet" href="/assets/main-….css"&gt;</text>
  <text x="24" y="414" font-size="12" fill="#1d1d1f">진입점이 의존하는 공용 청크의 CSS가 먼저 연결되어, 문서에 처음 나오는 층 이름이 components가 된다</text>
</svg>
