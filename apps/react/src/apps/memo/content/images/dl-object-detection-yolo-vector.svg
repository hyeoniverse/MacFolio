<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<rect width="640" height="300" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">YOLO 격자 한 칸이 출력하는 90차원 벡터 (COCO 80부류 기준)</text>
<!-- grid -->
<g stroke="#6e6e73" stroke-width="1">
<line x1="30" y1="60" x2="30" y2="200"/><line x1="30" y1="60" x2="170" y2="60"/>
<line x1="50" y1="60" x2="50" y2="200"/><line x1="30" y1="80" x2="170" y2="80"/>
<line x1="70" y1="60" x2="70" y2="200"/><line x1="30" y1="100" x2="170" y2="100"/>
<line x1="90" y1="60" x2="90" y2="200"/><line x1="30" y1="120" x2="170" y2="120"/>
<line x1="110" y1="60" x2="110" y2="200"/><line x1="30" y1="140" x2="170" y2="140"/>
<line x1="130" y1="60" x2="130" y2="200"/><line x1="30" y1="160" x2="170" y2="160"/>
<line x1="150" y1="60" x2="150" y2="200"/><line x1="30" y1="180" x2="170" y2="180"/>
<line x1="170" y1="60" x2="170" y2="200"/><line x1="30" y1="200" x2="170" y2="200"/>
</g>
<rect x="90" y="120" width="20" height="20" fill="#1d1d1f"/>
<text x="100" y="222" text-anchor="middle" font-size="12" fill="#1d1d1f">7 × 7 = 49칸</text>
<text x="100" y="240" text-anchor="middle" font-size="12" fill="#6e6e73">물체 중심이 놓인 칸이 책임</text>
<path d="M110,130 C150,130 160,100 196,100" fill="none" stroke="#6e6e73" stroke-width="1.5"/>
<!-- vector -->
<g font-size="12" fill="#1d1d1f" text-anchor="middle">
<rect x="200" y="80" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="220" y="105">x</text>
<rect x="240" y="80" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="260" y="105">y</text>
<rect x="280" y="80" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="300" y="105">w</text>
<rect x="320" y="80" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="340" y="105">h</text>
<rect x="360" y="80" width="40" height="40" fill="#ff9f0a" opacity="0.25" stroke="#ff9f0a"/><text x="380" y="105">o</text>
<rect x="200" y="140" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="220" y="165">x</text>
<rect x="240" y="140" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="260" y="165">y</text>
<rect x="280" y="140" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="300" y="165">w</text>
<rect x="320" y="140" width="40" height="40" fill="#0a84ff" opacity="0.15" stroke="#0a84ff"/><text x="340" y="165">h</text>
<rect x="360" y="140" width="40" height="40" fill="#ff9f0a" opacity="0.25" stroke="#ff9f0a"/><text x="380" y="165">o</text>
<rect x="420" y="80" width="200" height="100" fill="#34c759" opacity="0.15" stroke="#34c759"/><text x="520" y="125">p1, p2, …, p80</text><text x="520" y="145" fill="#6e6e73">부류 확률 80개 (칸당 한 벌)</text>
</g>
<g font-size="12" fill="#1d1d1f">
<text x="200" y="74">박스 1: 위치 4 + 신뢰도 1 = 5</text>
<text x="200" y="196">박스 2: 5</text>
<text x="200" y="232">2 × 5 + 80 = 90차원.  49칸 × 90 = 출력 텐서 7 × 7 × 90</text>
<text x="200" y="254" fill="#6e6e73">x, y는 칸 안의 중심 위치, w, h는 영상 크기에 대한 비율, o는 물체가 있을 신뢰도</text>
<text x="200" y="276" fill="#6e6e73">원 논문의 PASCAL VOC(20부류)는 2 × 5 + 20 = 30차원, 7 × 7 × 30</text>
</g>
</svg>
