<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>있는 파일은 Cloudflare가 바로 주고, 없는 주소만 Worker가 받아 앱 주소면 index.html, assets나 확장자가 있는 주소면 404를 준다</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">없는 주소만 Worker가 나눈다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">not_found_handling: "none" · main: apps/react/worker/index.ts</text>
<rect x="32" y="120" width="150" height="56" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="107.0" y="139" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">요청</text>
<text x="107.0" y="156" font-size="10.5" fill="#374151" text-anchor="middle">GET /…</text>
<rect x="222" y="120" width="170" height="56" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="307.0" y="139" font-size="12" fill="#4f46e5" font-weight="600" text-anchor="middle">정적 자산에 있나?</text>
<text x="307.0" y="156" font-size="10.5" fill="#374151" text-anchor="middle">dist/ 안의 파일</text>
<path d="M182 148 H218" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<rect x="436" y="76" width="392" height="50" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
<text x="448" y="95" font-size="12" fill="#15803d" font-weight="600">있다 → Cloudflare가 바로 준다</text>
<text x="448" y="112" font-size="10.5" fill="#374151">/assets/main-….js · /robots.txt  (_headers의 immutable 1년)</text>
<path d="M392 135 C414 135 414 101 432 101" stroke="#15803d" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<rect x="436" y="150" width="170" height="120" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="448" y="169" font-size="12" fill="#4f46e5" font-weight="600">Worker: isAppRoute</text>
<text x="448" y="186" font-size="10.5" fill="#374151">/assets/ 로 시작?</text>
<text x="448" y="201.0" font-size="10.5" fill="#374151">마지막 조각에 점?</text>
<text x="448" y="216.0" font-size="10.5" fill="#374151"></text>
<text x="448" y="231.0" font-size="10.5" fill="#374151">요청이 늘지 않는다</text>
<text x="448" y="246.0" font-size="10.5" fill="#374151">(없는 주소에만 불림)</text>
<path d="M392 160 C414 160 414 200 432 200" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<text x="410" y="192" font-size="10" fill="#4f46e5" font-weight="600" text-anchor="middle">없다</text>
<rect x="624" y="150" width="204" height="52" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
<text x="636" y="169" font-size="12" fill="#15803d" font-weight="600">앱 주소 → 200</text>
<text x="636" y="186" font-size="10.5" fill="#374151">/memo/db-backup → index.html</text>
<rect x="624" y="218" width="204" height="52" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="636" y="237" font-size="12" fill="#b91c1c" font-weight="600">그 밖 → 404</text>
<text x="636" y="254" font-size="10.5" fill="#374151">/assets/Memo-old.css · /imgs/nope.png</text>
<path d="M606 176 H620" stroke="#15803d" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<path d="M606 244 H620" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#a-red)"/>
<text x="32" y="220" font-size="10.5" fill="#b91c1c" font-weight="600">전: 없는 코드 파일에도</text>
<text x="32" y="236" font-size="10.5" fill="#b91c1c">200 text/html + immutable 1년</text>
<text x="32" y="252" font-size="10.5" fill="#b91c1c">→ 옛 탭이 HTML을 1년 들고 있을 수 있다</text>
</svg>
