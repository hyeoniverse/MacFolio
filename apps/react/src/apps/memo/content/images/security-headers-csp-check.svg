<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>브라우저는 응답의 CSP 헤더를 기억해 두고, 페이지가 리소스를 요청할 때마다 그 종류의 지시어 목록과 출처를 비교한다. 목록에 있으면 요청하고, 없으면 요청하지 않고 콘솔에 위반 메시지를 출력한다</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker>
<marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker>
</defs>
<rect width="640" height="350" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">브라우저가 요청마다 CSP 목록과 출처를 비교한다</text>
<rect x="24" y="50" width="592" height="52" rx="8" fill="#f2f2f7"/>
<text x="36" y="70" font-size="12" fill="#6e6e73">응답 헤더</text>
<text x="36" y="90" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">script-src 'self' https://challenges.cloudflare.com; connect-src 'self' …</text>
<rect x="24" y="126" width="196" height="40" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="122" y="144" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&lt;script src=</text>
<text x="122" y="159" font-size="12" fill="#6e6e73" text-anchor="middle">/assets/index.js</text>
<rect x="24" y="186" width="196" height="40" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="122" y="204" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&lt;script src=</text>
<text x="122" y="219" font-size="12" fill="#6e6e73" text-anchor="middle">https://evil.example/x.js</text>
<rect x="24" y="246" width="196" height="40" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="122" y="264" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&lt;script&gt;…&lt;/script&gt;</text>
<text x="122" y="279" font-size="12" fill="#6e6e73" text-anchor="middle">HTML 안의 인라인 스크립트</text>
<rect x="260" y="126" width="120" height="160" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="320" y="196" font-size="12" font-weight="700" fill="#0a84ff" text-anchor="middle">script-src와</text>
<text x="320" y="214" font-size="12" font-weight="700" fill="#0a84ff" text-anchor="middle">비교</text>
<path d="M220 146 H258" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#k)"/>
<path d="M220 206 H258" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#k)"/>
<path d="M220 266 H258" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#k)"/>
<path d="M380 146 H418" stroke="#34c759" stroke-width="1.5" marker-end="url(#gr)"/>
<path d="M380 206 H418" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#rd)"/>
<path d="M380 266 H418" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#rd)"/>
<rect x="420" y="126" width="196" height="40" rx="8" fill="#34c759" fill-opacity="0.15" stroke="#34c759"/>
<text x="518" y="144" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">'self'에 해당 → 실행</text>
<text x="518" y="159" font-size="12" fill="#6e6e73" text-anchor="middle">같은 출처의 파일</text>
<rect x="420" y="186" width="196" height="40" rx="8" fill="#ff3b30" fill-opacity="0.1" stroke="#ff3b30"/>
<text x="518" y="204" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">목록에 없음 → 차단</text>
<text x="518" y="219" font-size="12" fill="#6e6e73" text-anchor="middle">요청 자체를 보내지 않는다</text>
<rect x="420" y="246" width="196" height="40" rx="8" fill="#ff3b30" fill-opacity="0.1" stroke="#ff3b30"/>
<text x="518" y="264" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">'unsafe-inline' 없음 → 차단</text>
<text x="518" y="279" font-size="12" fill="#6e6e73" text-anchor="middle">해시·nonce가 맞으면 허용</text>
<rect x="24" y="304" width="592" height="34" rx="8" fill="#ffffff" stroke="#ff3b30" stroke-dasharray="4 3"/>
<text x="36" y="325" font-size="12" fill="#ff3b30" font-family="ui-monospace, Menlo, monospace">콘솔: Refused to load the script 'https://evil.example/x.js' …</text>
</svg>
