<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="170" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">IP 헤더의 소스 라우트 옵션 형식</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <line x1="22" y1="56" x2="618" y2="56" stroke="#6e6e73" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="290" y="46" width="60" height="18" fill="#fff"/>
  <text x="320" y="60" text-anchor="middle" font-size="12.5" fill="#1d1d1f">39바이트</text>
  <g stroke="#1d1d1f" stroke-width="1.2">
    <rect x="20" y="76" width="60" height="40" fill="#e5f1ff"/>
    <rect x="80" y="76" width="60" height="40" fill="#e5f1ff"/>
    <rect x="140" y="76" width="60" height="40" fill="#e5f1ff"/>
    <rect x="200" y="76" width="110" height="40" fill="#f2f2f7"/>
    <rect x="310" y="76" width="110" height="40" fill="#f2f2f7"/>
    <rect x="420" y="76" width="90" height="40" fill="#fff"/>
    <rect x="510" y="76" width="110" height="40" fill="#f2f2f7"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1d1d1f">
    <text x="50" y="101">코드</text>
    <text x="110" y="101">길이</text>
    <text x="170" y="101">포인터</text>
    <text x="255" y="101">IP 주소 #1</text>
    <text x="365" y="101">IP 주소 #2</text>
    <text x="465" y="101">⋯</text>
    <text x="565" y="101">IP 주소 #9</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#6e6e73">
    <text x="50" y="136">1</text>
    <text x="110" y="136">1</text>
    <text x="170" y="136">1</text>
    <text x="255" y="136">4바이트</text>
    <text x="365" y="136">4바이트</text>
    <text x="565" y="136">4바이트</text>
  </g>
  <text x="320" y="160" text-anchor="middle" font-size="11.5" fill="#6e6e73">코드·길이·포인터 각 1바이트 + 주소 9개 × 4바이트 = 39바이트</text>
</svg>
