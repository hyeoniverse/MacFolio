<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">동일 출처 정책(SOP)이 막는 것과 막지 않는 것</text>
  <!-- 내 사이트 -->
  <rect x="16" y="46" width="370" height="200" rx="10" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="30" y="68" font-size="13" font-weight="600" fill="#1d1d1f">출처 A: https://www.example.com</text>
  <!-- 다른 출처 -->
  <rect x="460" y="46" width="164" height="200" rx="10" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="474" y="68" font-size="13" font-weight="600" fill="#1d1d1f">출처 B</text>
  <text x="474" y="84" font-size="12" fill="#6e6e73">https://other.example</text>
  <g font-size="12.5" fill="#1d1d1f" text-anchor="middle">
    <rect x="34" y="96" width="140" height="96" rx="10" fill="#fff" stroke="#0a84ff"/>
    <text x="104" y="118">스크립트 1</text>
    <rect x="58" y="132" width="92" height="46" rx="6" fill="#e8f2ff"/><text x="104" y="152" font-size="12">DOM·데이터</text><text x="104" y="168" font-size="12">메서드</text>
    <rect x="228" y="96" width="140" height="96" rx="10" fill="#fff" stroke="#0a84ff"/>
    <text x="298" y="118">스크립트 2</text>
    <rect x="252" y="132" width="92" height="46" rx="6" fill="#e8f2ff"/><text x="298" y="152" font-size="12">DOM·데이터</text><text x="298" y="168" font-size="12">메서드</text>
    <rect x="478" y="96" width="128" height="96" rx="10" fill="#fff" stroke="#0a84ff"/>
    <text x="542" y="118">스크립트 3</text>
    <rect x="496" y="132" width="92" height="46" rx="6" fill="#e8f2ff"/><text x="542" y="152" font-size="12">DOM·데이터</text><text x="542" y="168" font-size="12">메서드</text>
  </g>
  <line x1="176" y1="144" x2="226" y2="144" stroke="#34c759" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="201" y="226" text-anchor="middle" font-size="12" fill="#248a3d">같은 출처: 서로의 데이터와 메서드에 접근</text>
  <line x1="370" y1="144" x2="476" y2="144" stroke="#ff9f0a" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#o)" marker-end="url(#o)"/>
  <g stroke="#ff9f0a" stroke-width="4" stroke-linecap="round"><line x1="410" y1="128" x2="436" y2="160"/><line x1="436" y1="128" x2="410" y2="160"/></g>
  <text x="423" y="208" text-anchor="middle" font-size="12" fill="#c46f00">출처가 다르면</text>
  <text x="423" y="224" text-anchor="middle" font-size="12" fill="#c46f00">응답을 읽지 못함</text>
  <!-- 서버 -->
  <rect x="120" y="300" width="160" height="40" rx="8" fill="#1d1d1f"/><text x="200" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">www.example.com 서버</text>
  <rect x="440" y="300" width="160" height="40" rx="8" fill="#1d1d1f"/><text x="520" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">other.example 서버</text>
  <line x1="200" y1="248" x2="200" y2="298" stroke="#6e6e73" stroke-width="1.4" marker-start="url(#k)" marker-end="url(#k)"/>
  <line x1="520" y1="248" x2="520" y2="298" stroke="#6e6e73" stroke-width="1.4" marker-start="url(#k)" marker-end="url(#k)"/>
  <line x1="282" y1="320" x2="438" y2="320" stroke="#6e6e73" stroke-width="1.4" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#6e6e73">서버 간 API 호출</text>
  <text x="360" y="356" text-anchor="middle" font-size="12" fill="#6e6e73">(브라우저 밖이라 SOP와 무관)</text>
  <text x="320" y="386" text-anchor="middle" font-size="12" fill="#6e6e73">출처 = 스킴 + 호스트 이름 + 포트. 브라우저는 IP 주소가 아니라 이름으로 출처를 판단한다</text>
</svg>
