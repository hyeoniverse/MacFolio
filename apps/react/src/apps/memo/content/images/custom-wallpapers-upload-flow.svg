<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 218" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>브라우저가 사진을 두 장으로 줄여 올리고, 서버는 Upload와 Wallpaper에 저장하고, 방문자는 목록을 받는다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="880" height="218" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">배경화면 하나가 올라가는 길</text>
<text x="32" y="56" font-size="11" fill="#6b7280">관리자만 올리고, 모든 방문자가 받는다</text>
<rect x="32.0" y="80" width="183.0" height="108" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="123.5" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">브라우저 (관리자)</text><text x="123.5" y="122" font-size="10.5" fill="#374151" text-anchor="middle">사진 고르기</text><text x="123.5" y="138" font-size="10.5" fill="#374151" text-anchor="middle">createImageBitmap</text><text x="123.5" y="154" font-size="10.5" fill="#374151" text-anchor="middle">캔버스로 두 장 JPEG</text><text x="123.5" y="170" font-size="10.5" fill="#374151" text-anchor="middle">2560px q0.86 · 640px q0.8</text><line x1="217.0" y1="134.0" x2="241.0" y2="134.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="243.0" y="80" width="183.0" height="108" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="334.5" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">POST /wallpapers</text><text x="334.5" y="122" font-size="10.5" fill="#374151" text-anchor="middle">관리자 확인 (아니면 401)</text><text x="334.5" y="138" font-size="10.5" fill="#374151" text-anchor="middle">앞부분으로 형식 확인</text><text x="334.5" y="154" font-size="10.5" fill="#374151" text-anchor="middle">이름 다듬기 (40자)</text><line x1="428.0" y1="134.0" x2="452.0" y2="134.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="454.0" y="80" width="183.0" height="108" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="545.5" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">DB</text><text x="545.5" y="122" font-size="10.5" fill="#374151" text-anchor="middle">Upload 두 줄 (원본·썸네일)</text><text x="545.5" y="138" font-size="10.5" fill="#374151" text-anchor="middle">Wallpaper 한 줄</text><text x="545.5" y="154" font-size="10.5" fill="#374151" text-anchor="middle">(이름, 두 Upload id)</text><line x1="639.0" y1="134.0" x2="663.0" y2="134.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="665.0" y="80" width="183.0" height="108" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="756.5" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">모든 방문자</text><text x="756.5" y="122" font-size="10.5" fill="#374151" text-anchor="middle">GET /wallpapers</text><text x="756.5" y="138" font-size="10.5" fill="#374151" text-anchor="middle">썸네일은 /files/:id</text><text x="756.5" y="154" font-size="10.5" fill="#374151" text-anchor="middle">고르면 localStorage에</text><text x="756.5" y="170" font-size="10.5" fill="#374151" text-anchor="middle">custom:id + 주소</text>
</svg>
