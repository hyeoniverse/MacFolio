<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>첨부 파일 링크에서 여는 앱을 고르는 순서</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker></defs>
<rect width="640" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1d1d1f">글에 저장된 첨부 파일 링크 한 줄</text>
<rect x="24" y="52" width="592" height="40" rx="8" fill="#f2f2f7"/>
<g font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace">
<text x="36" y="77" fill="#1d1d1f">[</text>
<text x="46" y="77" fill="#0a84ff" font-weight="700">notes.md</text>
<text x="112" y="77" fill="#1d1d1f">](</text>
<text x="130" y="77" fill="#6e6e73">https://…/files/&lt;id&gt;</text>
<text x="314" y="77" fill="#ff9f0a" font-weight="700">"첨부 파일 · 1 KB"</text>
<text x="456" y="77" fill="#1d1d1f">)</text>
</g>
<path d="M46 98 V106 H110 V98" fill="none" stroke="#0a84ff" stroke-width="1.5"/>
<text x="30" y="124" font-size="12" fill="#0a84ff" font-weight="600">링크 글자 = 파일 이름</text>
<path d="M130 98 V106 H300 V98" fill="none" stroke="#6e6e73" stroke-width="1.5"/>
<text x="166" y="124" font-size="12" fill="#6e6e73">주소: 확장자 없음</text>
<path d="M314 98 V106 H448 V98" fill="none" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="318" y="124" font-size="12" fill="#ff9f0a" font-weight="600">링크 제목 = 첨부 표시</text>
<rect x="24" y="148" width="270" height="56" rx="10" fill="#fff7eb" stroke="#ff9f0a"/>
<text x="38" y="171" font-size="12.5" font-weight="600" fill="#1d1d1f">① 링크 제목이 '첨부 파일'로</text>
<text x="38" y="190" font-size="12.5" font-weight="600" fill="#1d1d1f">시작하는가</text>
<line x1="294" y1="176" x2="350" y2="176" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="302" y="168" font-size="12" fill="#6e6e73">아니오</text>
<rect x="356" y="152" width="260" height="48" rx="10" fill="#f2f2f7" stroke="#d2d2d7"/>
<text x="370" y="181" font-size="12.5" fill="#1d1d1f">일반 링크로 처리</text>
<line x1="159" y1="204" x2="159" y2="228" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="168" y="221" font-size="12" fill="#ff9f0a">예</text>
<rect x="24" y="234" width="270" height="56" rx="10" fill="#e5f1ff" stroke="#0a84ff"/>
<text x="38" y="257" font-size="12.5" font-weight="600" fill="#1d1d1f">② 파일 이름의 확장자로</text>
<text x="38" y="276" font-size="12.5" font-weight="600" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">fileAppOf('notes.md')</text>
<line x1="294" y1="262" x2="330" y2="262" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
<g font-size="12.5">
<rect x="336" y="220" width="280" height="200" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
<text x="350" y="244" font-weight="600" fill="#1d1d1f">파일 이름 → 여는 앱</text>
<text x="350" y="272" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">report.pdf</text><text x="496" y="272" fill="#0a84ff">미리보기</text>
<text x="350" y="298" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">photo.png</text><text x="496" y="298" fill="#0a84ff">미리보기</text>
<text x="350" y="324" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">notes.md</text><text x="496" y="324" fill="#0a84ff">텍스트 편집기</text>
<text x="350" y="350" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">server.log.txt</text><text x="496" y="350" fill="#0a84ff">텍스트 편집기</text>
<text x="350" y="376" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">demo.html</text><text x="496" y="376" fill="#0a84ff">Safari 새 탭</text>
<text x="350" y="402" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">archive.zip</text><text x="496" y="402" fill="#6e6e73">null → 새 탭</text>
</g>
<text x="24" y="326" font-size="12" fill="#6e6e73">확장자는 마지막 점 뒤의 글자이고 대소문자를</text>
<text x="24" y="344" font-size="12" fill="#6e6e73">구분하지 않는다. server.log.txt는 txt,</text>
<text x="24" y="362" font-size="12" fill="#6e6e73">REPORT.PDF는 pdf로 판별한다.</text>
<text x="24" y="440" font-size="12" fill="#6e6e73">⌘·Ctrl·Shift를 누르거나 가운데 버튼으로 누르면 이 판별을 건너뛰고 브라우저 기본 동작(새 탭)을 따른다.</text>
</svg>
