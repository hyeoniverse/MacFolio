<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>층 순서가 바뀌면 같은 두 규칙의 승패가 바뀐다: reset, components 순서와 components, reset 순서 비교</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">층 순서가 승패를 정한다</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">층끼리는 나중에 정해진 층이 이긴다. 선택자 명시도는 같은 층 안에서만 비교한다</text>

  <!-- 왼쪽: 의도한 순서 -->
  <text x="24" y="92" font-size="13" font-weight="600" fill="#34c759">의도한 순서: @layer reset, components;</text>
  <rect x="24" y="104" width="280" height="44" rx="8" fill="#f2f2f7"/>
  <text x="36" y="124" font-size="12" fill="#6e6e73">우선순위 높음</text>
  <text x="36" y="141" font-size="12" fill="#1d1d1f">층 밖의 규칙 (앱 CSS)</text>
  <rect x="24" y="154" width="280" height="56" rx="8" fill="#e5f1ff" stroke="#0a84ff" stroke-width="2"/>
  <text x="36" y="176" font-size="13" font-weight="600" fill="#0a84ff">components 층</text>
  <text x="36" y="198" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.ui-button { padding: 5px 14px }</text>
  <rect x="24" y="216" width="280" height="56" rx="8" fill="#ffffff" stroke="#c7c7cc"/>
  <text x="36" y="238" font-size="13" font-weight="600" fill="#6e6e73">reset 층</text>
  <text x="36" y="260" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">* { padding: 0 }</text>
  <text x="36" y="292" font-size="12" fill="#6e6e73">우선순위 낮음</text>
  <rect x="24" y="304" width="280" height="40" rx="8" fill="#e8f8ec"/>
  <text x="164" y="329" font-size="13" text-anchor="middle" fill="#1d1d1f">버튼 padding = 5px 14px</text>

  <!-- 오른쪽: 빌드에서 정해진 순서 -->
  <text x="336" y="92" font-size="13" font-weight="600" fill="#ff3b30">빌드에서 정해진 순서: components, reset</text>
  <rect x="336" y="104" width="280" height="44" rx="8" fill="#f2f2f7"/>
  <text x="348" y="124" font-size="12" fill="#6e6e73">우선순위 높음</text>
  <text x="348" y="141" font-size="12" fill="#1d1d1f">층 밖의 규칙 (앱 CSS)</text>
  <rect x="336" y="154" width="280" height="56" rx="8" fill="#ffecea" stroke="#ff3b30" stroke-width="2"/>
  <text x="348" y="176" font-size="13" font-weight="600" fill="#ff3b30">reset 층</text>
  <text x="348" y="198" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">* { padding: 0 }</text>
  <rect x="336" y="216" width="280" height="56" rx="8" fill="#ffffff" stroke="#c7c7cc"/>
  <text x="348" y="238" font-size="13" font-weight="600" fill="#6e6e73">components 층</text>
  <text x="348" y="260" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">.ui-button { padding: 5px 14px }</text>
  <text x="348" y="292" font-size="12" fill="#6e6e73">우선순위 낮음</text>
  <rect x="336" y="304" width="280" height="40" rx="8" fill="#ffecea"/>
  <text x="476" y="329" font-size="13" text-anchor="middle" fill="#ff3b30">버튼 padding = 0px</text>

  <text x="24" y="376" font-size="12" fill="#1d1d1f">.ui-button의 명시도 (0,1,0)은 *의 (0,0,0)보다 높지만, 두 규칙은 다른 층에 있어 명시도를 비교하지 않는다.</text>
  <text x="24" y="398" font-size="12" fill="#1d1d1f">그래서 오른쪽처럼 층 순서가 뒤집히면 명시도가 낮은 * 규칙이 이긴다.</text>
</svg>
