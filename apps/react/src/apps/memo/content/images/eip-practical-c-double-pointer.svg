<text x="535" y="190" font-size="13" fill="#6e6e73" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">b (int)</text>
<rect x="480" y="200" width="110" height="46" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1"/>
<text x="535.0" y="228.4" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">20 → 21</text>
<text x="535" y="264" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0x1004</text>
<path d="M370 115 C420 160 430 210 474 222" fill="none" stroke="#30d158" stroke-width="2" marker-end="url(#m30d158)" stroke-dasharray="5 4"/>
<text x="330" y="196" font-size="12" fill="#30d158" text-anchor="end" font-weight="600">*pp = &amp;b 이후</text>
<text x="330" y="212" font-size="12" fill="#30d158" text-anchor="end">p가 b를 가리키게 바뀐다</text>
<text x="40" y="230" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">pp   → p의 주소</text>
<text x="40" y="252" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*pp  → p 자체</text>
<text x="40" y="274" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">**pp → p가 가리키는 int</text>
<text x="320" y="316" font-size="13" fill="#ff9f0a" text-anchor="middle" font-weight="600">* 하나마다 화살표를 하나씩 따라간다</text>
</svg>
