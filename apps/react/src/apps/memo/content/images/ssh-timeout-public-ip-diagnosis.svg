<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>SSH 시간 초과 원인 좁히기. 집 인터넷, 휴대폰 핫스팟, Oracle Cloud Shell에서 알고 있던 IP의 22번은 모두 시간 초과였고, GitHub Actions는 배포에 성공했다. 다른 서버의 22번은 연결되었다. 네트워크와 서버 설정을 배제하자 남은 원인은 주소였고, VNIC에서 조회한 공인 IP로 접속하자 연결되었다. 알고 있던 IP는 삭제한 임시 VM의 주소였다</title>
<rect width="860" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">SSH 시간 초과: 어디서 시도했고 무엇을 배제했나</text>
<text x="32" y="56" font-size="11.5" fill="#6b7280">IP는 문서용 예시 주소. 알고 있던 IP 198.51.100.10, 서버의 실제 IP 203.0.113.20</text>

<g font-size="12">
<rect x="32" y="74" width="796" height="30" rx="6" fill="#f3f4f6"/>
<text x="46" y="94" fill="#374151" font-weight="700">시도한 곳</text>
<text x="250" y="94" fill="#374151" font-weight="700">대상</text>
<text x="470" y="94" fill="#374151" font-weight="700">결과</text>
<text x="590" y="94" fill="#374151" font-weight="700">배제한 원인</text>

<text x="46" y="128" fill="#111827">집 인터넷 (Mac)</text><text x="250" y="128" fill="#111827">198.51.100.10:22</text><text x="470" y="128" fill="#b91c1c">시간 초과</text><text x="590" y="128" fill="#6b7280">-</text>
<text x="46" y="158" fill="#111827">집 인터넷 (Mac)</text><text x="250" y="158" fill="#111827">github.com:22</text><text x="470" y="158" fill="#15803d">연결됨</text><text x="590" y="158" fill="#6b7280">이 네트워크가 22번을 막는 경우</text>
<text x="46" y="188" fill="#111827">휴대폰 핫스팟</text><text x="250" y="188" fill="#111827">198.51.100.10:22</text><text x="470" y="188" fill="#b91c1c">시간 초과</text><text x="590" y="188" fill="#6b7280">특정 통신사 경로 문제</text>
<text x="46" y="218" fill="#111827">Oracle Cloud Shell</text><text x="250" y="218" fill="#111827">198.51.100.10:22</text><text x="470" y="218" fill="#b91c1c">시간 초과</text><text x="590" y="218" fill="#6b7280">한국에서 Oracle까지의 경로</text>
<text x="46" y="248" fill="#111827">GitHub Actions</text><text x="250" y="248" fill="#111827">DEPLOY_HOST:22</text><text x="470" y="248" fill="#15803d">배포 성공</text><text x="590" y="248" fill="#6b7280">sshd·보안 목록·서버 방화벽</text>
<path d="M32 262 H828" stroke="#e5e7eb"/>
<text x="46" y="288" fill="#111827" font-weight="700">Mac (VNIC에서 조회한 IP)</text><text x="250" y="288" fill="#111827" font-weight="700">203.0.113.20:22</text><text x="470" y="288" fill="#15803d" font-weight="700">연결됨</text><text x="590" y="288" fill="#111827" font-weight="700">→ 원인은 접속 주소</text>
</g>

<rect x="32" y="314" width="796" height="62" rx="10" fill="#fefce8" stroke="#fde68a"/>
<text x="48" y="338" font-size="12.5" fill="#713f12" font-weight="700">결론: 알고 있던 IP는 SSH 키를 복구하면서 만들고 삭제한 임시 VM의 주소였다</text>
<text x="48" y="360" font-size="11.5" fill="#854d0e">서버 IP는 바뀌지 않았다. Actions는 Secrets의 DEPLOY_HOST(실제 IP)로 접속해 성공했다. 기억한 IP 대신 VNIC 정보를 조회해 확인한다</text>
</svg>
