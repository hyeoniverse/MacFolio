<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>프로젝트 앱의 로딩 상태</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="700">iframe 로딩 상태와 8초 안내</text>
<text x="20" y="50" font-size="12" fill="#6e6e73" text-anchor="start">로딩 화면은 load 이벤트가 오면 사라지고, 8초(SLOW_MS)가 지나도 오지 않으면 링크를 추가한다</text>
<line x1="120" y1="86" x2="600" y2="86" stroke="#6e6e73" stroke-width="1.4"/>
<line x1="120.0" y1="82" x2="120.0" y2="90" stroke="#6e6e73" stroke-width="1.4"/>
<text x="120.0" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">0초</text>
<line x1="216.0" y1="82" x2="216.0" y2="90" stroke="#6e6e73" stroke-width="1.4"/>
<text x="216.0" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">2초</text>
<line x1="312.0" y1="82" x2="312.0" y2="90" stroke="#6e6e73" stroke-width="1.4"/>
<text x="312.0" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">4초</text>
<line x1="408.0" y1="82" x2="408.0" y2="90" stroke="#6e6e73" stroke-width="1.4"/>
<text x="408.0" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">6초</text>
<line x1="504.0" y1="82" x2="504.0" y2="90" stroke="#6e6e73" stroke-width="1.4"/>
<text x="504.0" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">8초 (SLOW_MS)</text>
<line x1="600.0" y1="82" x2="600.0" y2="90" stroke="#6e6e73" stroke-width="1.4"/>
<text x="600.0" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">10초</text>
<line x1="504.0" y1="92" x2="504.0" y2="214" stroke="#ff9f0a" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="20" y="124" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">정상 응답</text>
<rect x="120.0" y="106" width="144.0" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="192.0" y="126" font-size="12" fill="#1d1d1f" text-anchor="middle">로딩 화면</text>
<rect x="264.0" y="106" width="336.0" height="30" rx="6" fill="#ecf9ef" stroke="#34c759" stroke-width="1.2"/>
<text x="432.0" y="126" font-size="12" fill="#1d1d1f" text-anchor="middle">onLoad → loaded = true, 사이트 표시</text>
<text x="20" y="142" font-size="12" fill="#6e6e73" text-anchor="start">(예: 3초)</text>
<text x="20" y="190" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">로드가 끝나지</text>
<text x="20" y="206" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">않음</text>
<rect x="120.0" y="180" width="384.0" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="312.0" y="200" font-size="12" fill="#1d1d1f" text-anchor="middle">로딩 화면: 아이콘과 "불러오는 중…"</text>
<rect x="504.0" y="180" width="96.0" height="30" rx="6" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.2"/>
<text x="552.0" y="200" font-size="12" fill="#1d1d1f" text-anchor="middle">링크 추가</text>
<rect x="120.0" y="226" width="480" height="56" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="132.0" y="248" font-size="12" fill="#1d1d1f" text-anchor="start">8초 뒤 로딩 화면에 "열리지 않으면 새 탭에서 열기" 링크를 표시한다.</text>
<text x="132.0" y="268" font-size="12" fill="#6e6e73" text-anchor="start">삽입이 차단된 이유는 바깥 문서에서 읽을 수 없으므로, 시간 기준으로만 판단한다.</text>
</svg>
