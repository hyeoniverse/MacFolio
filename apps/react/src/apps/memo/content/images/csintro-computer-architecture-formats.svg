<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>주소 필드 수에 따른 명령어 형식</title><rect width="640" height="360" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">X = A + B를 계산하는 명령어 형식</text>
<g font-size="13">
<text x="30" y="80" fill="#1d1d1f" font-weight="600">0-주소</text><rect x="120" y="62" width="120" height="28" fill="#0a84ff"/><text x="180" y="81" text-anchor="middle" fill="#fff">연산 코드</text><text x="270" y="81" fill="#6e6e73">PUSH A · PUSH B · ADD · POP X (4개)</text>
<text x="30" y="150" fill="#1d1d1f" font-weight="600">1-주소</text><rect x="120" y="132" width="120" height="28" fill="#0a84ff"/><text x="180" y="151" text-anchor="middle" fill="#fff">연산 코드</text><rect x="240" y="132" width="100" height="28" fill="#ff9f0a"/><text x="290" y="151" text-anchor="middle" fill="#fff">주소</text><text x="360" y="151" fill="#6e6e73">LOAD A · ADD B · STORE X (3개)</text>
<text x="30" y="220" fill="#1d1d1f" font-weight="600">2-주소</text><rect x="120" y="202" width="120" height="28" fill="#0a84ff"/><text x="180" y="221" text-anchor="middle" fill="#fff">연산 코드</text><rect x="240" y="202" width="100" height="28" fill="#ff9f0a"/><text x="290" y="221" text-anchor="middle" fill="#fff">주소 1</text><rect x="340" y="202" width="100" height="28" fill="#34c759"/><text x="390" y="221" text-anchor="middle" fill="#fff">주소 2</text><text x="455" y="221" fill="#6e6e73">MOV·ADD·MOV (3개)</text>
<text x="30" y="290" fill="#1d1d1f" font-weight="600">3-주소</text><rect x="120" y="272" width="120" height="28" fill="#0a84ff"/><text x="180" y="291" text-anchor="middle" fill="#fff">연산 코드</text><rect x="240" y="272" width="100" height="28" fill="#ff9f0a"/><text x="290" y="291" text-anchor="middle" fill="#fff">주소 1</text><rect x="340" y="272" width="100" height="28" fill="#34c759"/><text x="390" y="291" text-anchor="middle" fill="#fff">주소 2</text><rect x="440" y="272" width="100" height="28" fill="#6e6e73"/><text x="490" y="291" text-anchor="middle" fill="#fff">주소 3</text><text x="555" y="291" fill="#6e6e73">ADD (1개)</text>
</g>
<text x="320" y="340" text-anchor="middle" font-size="12" fill="#6e6e73">주소 필드가 늘수록 명령어 하나는 길어지고 프로그램의 명령어 수는 줄어든다</text>
</svg>
