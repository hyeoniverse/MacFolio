<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 370" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>같은 문장을 두 규칙으로 파싱한 mdast 비교</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="370" fill="#ffffff"/>
<text x="24" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="600">같은 문장의 구문 트리(mdast)</text>
<text x="24" y="50" font-size="12" fill="#6e6e73" text-anchor="start">원문: 이번엔 실패가 아니라 **취소(cancelled)**가 떴다.</text>
<rect x="24" y="70" width="288" height="250" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="38" y="94" font-size="14" fill="#ff3b30" text-anchor="start" font-weight="600">CommonMark 규칙</text>
<rect x="38" y="108" width="96" height="28" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4"/>
<text x="48" y="127" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">paragraph</text>
<path d="M52 136 L52 166 L70 166" fill="none" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="72" y="152" width="226" height="82" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1.4"/>
<text x="82" y="172" font-size="12" fill="#ff3b30" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">text</text>
<text x="82" y="194" font-size="12" fill="#1d1d1f" text-anchor="start">이번엔 실패가 아니라</text>
<text x="82" y="214" font-size="12" fill="#1d1d1f" text-anchor="start">**취소(cancelled)**가 떴다.</text>
<text x="38" y="262" font-size="12" fill="#6e6e73" text-anchor="start">** 네 개가 글자 그대로 text 안에</text>
<text x="38" y="282" font-size="12" fill="#6e6e73" text-anchor="start">남는다. 강조 노드가 없다</text>
<rect x="328" y="70" width="288" height="250" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="342" y="94" font-size="14" fill="#34c759" text-anchor="start" font-weight="600">remark-cjk-friendly</text>
<rect x="342" y="108" width="96" height="28" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4"/>
<text x="352" y="127" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">paragraph</text>
<line x1="356" y1="136" x2="356" y2="280" stroke="#6e6e73" stroke-width="1.6"/>
<line x1="356" y1="160" x2="372" y2="160" stroke="#6e6e73" stroke-width="1.6"/>
<rect x="374" y="146" width="226" height="28" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4"/>
<text x="384" y="165" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">text "이번엔 실패가 아니라 "</text>
<line x1="356" y1="200" x2="372" y2="200" stroke="#6e6e73" stroke-width="1.6"/>
<rect x="374" y="186" width="72" height="28" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.4"/>
<text x="384" y="205" font-size="12" fill="#34c759" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">strong</text>
<path d="M388 214 L388 240 L404 240" fill="none" stroke="#6e6e73" stroke-width="1.6"/>
<rect x="406" y="226" width="180" height="28" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4"/>
<text x="416" y="245" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">text "취소(cancelled)"</text>
<line x1="356" y1="280" x2="372" y2="280" stroke="#6e6e73" stroke-width="1.6"/>
<rect x="374" y="266" width="120" height="28" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4"/>
<text x="384" y="285" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">text "가 떴다."</text>
<text x="24" y="344" font-size="12" fill="#1d1d1f" text-anchor="start">화면: 이번엔 실패가 아니라 **취소(cancelled)**가 떴다.</text>
<text x="328" y="344" font-size="12" fill="#1d1d1f">화면: 이번엔 실패가 아니라 <tspan font-weight="600">취소(cancelled)</tspan>가 떴다.</text>
</svg>
