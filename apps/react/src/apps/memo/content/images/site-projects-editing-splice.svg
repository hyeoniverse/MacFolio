<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>새 배열을 만들면 먼저 PROJECTS를 import한 모듈은 옛 배열을 계속 가리키고, splice로 내용을 바꾸면 모든 모듈이 같은 배열 객체에서 새 내용을 읽는다</title>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">서버 값을 합칠 때 배열을 바꾸는 두 방법</text>
<text x="24" y="66" font-size="13" font-weight="700" fill="#ff3b30">새 배열을 만든다</text>
<text x="336" y="66" font-size="13" font-weight="700" fill="#34c759">splice로 내용만 바꾼다 (채택)</text>
<g font-size="12" fill="#1d1d1f">
<rect x="24" y="84" width="112" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="80" y="104" text-anchor="middle">Safari 모듈</text>
