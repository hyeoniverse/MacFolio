<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>모바일 판단 두 기준. innerWidth 768 미만만 보면 가로로 눕힌 휴대폰 844 x 390은 데스크톱으로 셌다. isMobileViewport는 폭 767 이하이거나, 폭 1023 이하이면서 높이 499 이하면 모바일이다</title>
<rect width="800" height="270" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">모바일인가: 기준이 둘이었다</text>
<line x1="80" y1="230" x2="760" y2="230" stroke="#9ca3af"/>
<line x1="80" y1="230" x2="80" y2="60" stroke="#9ca3af"/>
<text x="760" y="250" font-size="10" fill="#6b7280" text-anchor="end">폭 (px)</text>
<text x="70" y="62" font-size="10" fill="#6b7280" text-anchor="end">높이</text>
<rect x="80" y="60" width="255" height="170" fill="#4f46e5" fill-opacity="0.15" stroke="#4f46e5"/>
<text x="207" y="100" font-size="11" fill="#3730a3" text-anchor="middle">폭 ≤ 767 → 모바일</text>
<rect x="335" y="164" width="85" height="66" fill="#059669" fill-opacity="0.2" stroke="#059669"/>
<text x="377" y="156" font-size="10" fill="#047857" text-anchor="middle">≤1023 · 높이 ≤499</text>
<text x="335" y="246" font-size="10" fill="#6b7280" text-anchor="middle">767</text>
<text x="420" y="246" font-size="10" fill="#6b7280" text-anchor="middle">1023</text>
<circle cx="361" cy="200" r="6" fill="#dc2626"/>
<text x="440" y="196" font-size="10.5" fill="#1f2937">눕힌 휴대폰 844×390</text>
<text x="440" y="212" font-size="10.5" fill="#b91c1c">innerWidth &lt; 768만 보면: 데스크톱으로 셌다</text>
<text x="440" y="100" font-size="10.5" fill="#374151">셸·분석 모두 isMobileViewport 하나로</text>
<text x="440" y="116" font-size="10.5" fill="#374151">(desktop/layout.ts)</text>
</svg>
