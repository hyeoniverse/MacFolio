<path d="M320 360 L320 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M320 360 L435 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M320 360 L550 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M435 360 L90 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M435 360 L205 300" stroke="#c7c7cc" stroke-width="1"/>
