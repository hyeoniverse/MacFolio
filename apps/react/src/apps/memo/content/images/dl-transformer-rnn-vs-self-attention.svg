<path d="M435 360 L435 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M435 360 L550 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M550 360 L90 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M550 360 L205 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M550 360 L320 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M550 360 L435 300" stroke="#c7c7cc" stroke-width="1"/>
<path d="M550 360 L550 300" stroke="#c7c7cc" stroke-width="1"/>
<rect x="45" y="360" width="90" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="90" y="380" text-anchor="middle" font-size="13" fill="#1d1d1f">저게</text>
<rect x="60" y="270" width="60" height="30" rx="6" fill="#0a84ff" stroke="#0a84ff" fill-opacity="0.12"/>
<text x="90" y="290" text-anchor="middle" font-size="13" fill="#1d1d1f">c1</text>
<rect x="160" y="360" width="90" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="205" y="380" text-anchor="middle" font-size="13" fill="#1d1d1f">저절로</text>
<rect x="175" y="270" width="60" height="30" rx="6" fill="#0a84ff" stroke="#0a84ff" fill-opacity="0.12"/>
<text x="205" y="290" text-anchor="middle" font-size="13" fill="#1d1d1f">c2</text>
<rect x="275" y="360" width="90" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="320" y="380" text-anchor="middle" font-size="13" fill="#1d1d1f">붉어질</text>
<rect x="290" y="270" width="60" height="30" rx="6" fill="#0a84ff" stroke="#0a84ff" fill-opacity="0.12"/>
<text x="320" y="290" text-anchor="middle" font-size="13" fill="#1d1d1f">c3</text>
<rect x="390" y="360" width="90" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="435" y="380" text-anchor="middle" font-size="13" fill="#1d1d1f">리</text>
<rect x="405" y="270" width="60" height="30" rx="6" fill="#0a84ff" stroke="#0a84ff" fill-opacity="0.12"/>
<text x="435" y="290" text-anchor="middle" font-size="13" fill="#1d1d1f">c4</text>
<rect x="505" y="360" width="90" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="550" y="380" text-anchor="middle" font-size="13" fill="#1d1d1f">없다</text>
<rect x="520" y="270" width="60" height="30" rx="6" fill="#0a84ff" stroke="#0a84ff" fill-opacity="0.12"/>
<text x="550" y="290" text-anchor="middle" font-size="13" fill="#1d1d1f">c5</text>
<text x="320" y="418" text-anchor="middle" font-size="12" fill="#6e6e73">'없다'의 출력 c5는 '저게'를 선 하나(파란 선)로 직접 참조한다. 25개 연결을 행렬 곱 한 번으로 계산한다</text>
