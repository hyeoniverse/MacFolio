<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>스택과 큐의 삽입·삭제 위치</title><rect width="640" height="290" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="160" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">스택: 후입선출(LIFO)</text><text x="480" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">큐: 선입선출(FIFO)</text><line x1="320" y1="15" x2="320" y2="285" stroke="#f2f2f7" stroke-width="2"/><path d="M100 70 V240 H220 V70" fill="none" stroke="#6e6e73" stroke-width="2"/><rect x="108" y="196" width="104" height="38" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="160.0" y="219.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">10</text><rect x="108" y="154" width="104" height="38" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="160.0" y="177.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">20</text><rect x="108" y="112" width="104" height="38" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="160.0" y="135.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">30</text><text x="250" y="136" text-anchor="start" font-size="13" font-weight="600" fill="#0a84ff">← Top</text><line x1="60" y1="60" x2="104" y2="104" stroke="#30d158" stroke-width="2" marker-end="url(#a)"/><text x="40" y="52" text-anchor="start" font-size="13" font-weight="600" fill="#30d158">Push</text><line x1="216" y1="104" x2="270" y2="64" stroke="#ff453a" stroke-width="2" marker-end="url(#a)"/><text x="262" y="54" text-anchor="start" font-size="13" font-weight="600" fill="#ff453a">Pop → 30</text><text x="160" y="266" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">Push 10, 20, 30 다음 Pop 하면 30이 나온다</text><path d="M360 120 H600 M360 176 H600" stroke="#6e6e73" stroke-width="2"/><rect x="380" y="128" width="64" height="40" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="412.0" y="152.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">10</text><rect x="450" y="128" width="64" height="40" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="482.0" y="152.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">20</text><rect x="520" y="128" width="64" height="40" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="552.0" y="152.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f">30</text><text x="412" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">Front</text><text x="552" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">Rear</text><line x1="630" y1="148" x2="590" y2="148" stroke="#30d158" stroke-width="2" marker-end="url(#a)"/><text x="610" y="206" text-anchor="end" font-size="13" font-weight="600" fill="#30d158">Enqueue</text><line x1="374" y1="148" x2="334" y2="148" stroke="#ff453a" stroke-width="2" marker-end="url(#a)"/><text x="360" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#ff453a">Dequeue → 10</text><text x="480" y="266" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">Enqueue 10, 20, 30 다음 Dequeue 하면 10이 나온다</text></svg>
