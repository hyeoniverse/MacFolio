<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">시트가 올라오는 동안 앱 화면(.music)의 스크롤 위치</text>
  <!-- axes: x 0..400ms -> 80..560, y 0..343px -> 240..70 -->
  <line x1="80" y1="240" x2="580" y2="240" stroke="#6b7280"/>
  <line x1="80" y1="60" x2="80" y2="240" stroke="#6b7280"/>
  <g font-size="10.5" fill="#6b7280" text-anchor="middle">
    <text x="80" y="256">0ms</text><text x="140" y="256">50</text><text x="260" y="256">150</text><text x="560" y="256">400</text>
  </g>
  <g font-size="10.5" fill="#6b7280" text-anchor="end">
    <text x="72" y="244">0</text><text x="72" y="74">343px</text>
  </g>
  <line x1="80" y1="70" x2="580" y2="70" stroke="#f3f4f6" stroke-dasharray="3 3"/>
  <!-- bug: 0,0 -> 50,343 -> 150,47 -> 400,0 -->
  <polyline points="80,240 140,70 260,217 560,240" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="140" cy="70" r="4" fill="#ef4444"/><circle cx="260" cy="217" r="4" fill="#ef4444"/>
  <text x="148" y="66" font-size="11" fill="#ef4444">343px</text>
  <text x="268" y="212" font-size="11" fill="#ef4444">47px</text>
  <!-- fixed: flat 0 -->
  <line x1="80" y1="238" x2="560" y2="238" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- legend -->
  <rect x="360" y="96" width="14" height="4" fill="#ef4444"/><text x="380" y="102" font-size="11.5" fill="#374151">수정 전: 열 때 준 포커스가 화면을 끌어당김</text>
  <rect x="360" y="120" width="14" height="4" fill="#4f46e5"/><text x="380" y="126" font-size="11.5" fill="#374151">수정 후: focus({ preventScroll: true })</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#6b7280">iPhone 13 크기, 움직임을 켠 상태에서 Playwright로 측정</text>
</svg>
