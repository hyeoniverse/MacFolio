<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>ARP 스푸핑 전후의 ARP 캐시와 트래픽 경로</title>
<defs><marker id="a34c759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker><marker id="aff3b30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker><marker id="aff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="30" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600">ARP 스푸핑 전후의 트래픽 경로</text>
<rect x="30" y="60" width="140" height="50" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="100.0" y="80.5" font-size="13" fill="#1d1d1f" text-anchor="middle">피해자 PC</text>
<text x="100.0" y="98.5" font-size="13" fill="#1d1d1f" text-anchor="middle">192.168.0.100</text>
<rect x="470" y="60" width="140" height="50" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="540.0" y="80.7" font-size="12" fill="#1d1d1f" text-anchor="middle">게이트웨이</text>
<text x="540.0" y="97.7" font-size="12" fill="#1d1d1f" text-anchor="middle">192.168.0.1 / MAC …2c:ea</text>
<rect x="215" y="175" width="210" height="50" rx="8" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="320.0" y="195.7" font-size="12" fill="#ff3b30" text-anchor="middle">공격자</text>
<text x="320.0" y="212.7" font-size="12" fill="#ff3b30" text-anchor="middle">192.168.0.201 / MAC …25:88</text>
<line x1="172" y1="75" x2="466" y2="75" stroke="#34c759" stroke-width="1.6" marker-end="url(#a34c759)"/>
<text x="320" y="68" font-size="12" fill="#34c759" text-anchor="middle">① 정상: 피해자 → 게이트웨이 직접</text>
<path d="M70 112 Q90 200 211 205" fill="none" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#aff3b30)"/>
<path d="M428 205 Q560 200 560 114" fill="none" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#aff3b30)"/>
<text x="112" y="172" font-size="12" fill="#ff3b30" text-anchor="start">③ 피해자의 프레임</text>
<text x="500" y="160" font-size="12" fill="#ff3b30" text-anchor="start">④ 릴레이</text>
<path d="M300 172 L175 112" fill="none" stroke="#ff9f0a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aff9f0a)"/>
<text x="250" y="130" font-size="12" fill="#ff9f0a" text-anchor="start">② 위조 ARP 응답</text>
<text x="30" y="268" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="600">피해자 PC의 ARP 캐시 (arp -a)</text>
<text x="30" y="295" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600"></text>
<text x="130" y="295" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">IP 주소</text>
<text x="290" y="295" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">MAC 주소</text>
<text x="470" y="295" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">유형</text>
<text x="30" y="319" font-size="12" fill="#1d1d1f" text-anchor="start">공격 전</text>
<text x="130" y="319" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="ui-monospace, Menlo, monospace">192.168.0.1</text>
<text x="290" y="319" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="ui-monospace, Menlo, monospace">00-0c-29-44-2c-ea</text>
<text x="470" y="319" font-size="12" fill="#1d1d1f" text-anchor="start">동적</text>
<text x="30" y="343" font-size="12" fill="#1d1d1f" text-anchor="start">공격 후</text>
<text x="130" y="343" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="ui-monospace, Menlo, monospace">192.168.0.1</text>
<text x="290" y="343" font-size="12" fill="#ff3b30" text-anchor="start" font-family="ui-monospace, Menlo, monospace">00-0c-29-ad-25-88</text>
<text x="470" y="343" font-size="12" fill="#1d1d1f" text-anchor="start">동적</text>
<text x="30" y="367" font-size="12" fill="#1d1d1f" text-anchor="start"></text>
<text x="130" y="367" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="ui-monospace, Menlo, monospace">192.168.0.201</text>
<text x="290" y="367" font-size="12" fill="#ff3b30" text-anchor="start" font-family="ui-monospace, Menlo, monospace">00-0c-29-ad-25-88</text>
<text x="470" y="367" font-size="12" fill="#1d1d1f" text-anchor="start">동적</text>
<text x="30" y="392" font-size="12" fill="#6e6e73" text-anchor="start">게이트웨이 IP가 공격자의 MAC(…25:88)을 가리키고, 서로 다른 IP 두 개의 MAC이 같아진다</text>
</svg>
