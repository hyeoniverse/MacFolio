<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>연재 더보기 높이 변화의 진행률, 바꾸기 전과 후</title>
<rect width="640" height="360" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">연재 더보기를 펼칠 때 잰 높이의 진행률 (처음 높이 0%, 마지막 높이 100%)</text>
<line x1="70" y1="280.0" x2="590" y2="280.0" stroke="#e5e5ea"/>
<text x="62" y="284.0" font-size="12" fill="#6e6e73" text-anchor="end">0%</text>
<line x1="70" y1="225.0" x2="590" y2="225.0" stroke="#e5e5ea"/>
<text x="62" y="229.0" font-size="12" fill="#6e6e73" text-anchor="end">25%</text>
<line x1="70" y1="170.0" x2="590" y2="170.0" stroke="#e5e5ea"/>
<text x="62" y="174.0" font-size="12" fill="#6e6e73" text-anchor="end">50%</text>
<line x1="70" y1="115.0" x2="590" y2="115.0" stroke="#e5e5ea"/>
<text x="62" y="119.0" font-size="12" fill="#6e6e73" text-anchor="end">75%</text>
<line x1="70" y1="60.0" x2="590" y2="60.0" stroke="#e5e5ea"/>
<text x="62" y="64.0" font-size="12" fill="#6e6e73" text-anchor="end">100%</text>
<text x="70.0" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">0</text>
<text x="156.7" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">40</text>
<text x="243.3" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">80</text>
<text x="330.0" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">120</text>
<text x="416.7" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">160</text>
<text x="503.3" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">200</text>
<text x="590.0" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">240</text>
<text x="590" y="318" font-size="12" fill="#6e6e73" text-anchor="end">펼치기 시작부터 지난 시간 (ms)</text>
<line x1="70" y1="280" x2="590" y2="280" stroke="#6e6e73"/>
<polyline points="70.0,280.0 135.0,110.2 200.0,78.3 265.0,60.0" fill="none" stroke="#ff9f0a" stroke-width="2.5"/>
<circle cx="70.0" cy="280.0" r="4" fill="#ff9f0a"/>
<circle cx="135.0" cy="110.2" r="4" fill="#ff9f0a"/>
<circle cx="200.0" cy="78.3" r="4" fill="#ff9f0a"/>
<circle cx="265.0" cy="60.0" r="4" fill="#ff9f0a"/>
<polyline points="70.0,280.0 156.7,266.2 243.3,218.1 330.0,123.6 416.7,83.2 503.3,63.4 590.0,60.0" fill="none" stroke="#0a84ff" stroke-width="2.5"/>
<circle cx="70.0" cy="280.0" r="4" fill="#0a84ff"/>
<circle cx="156.7" cy="266.2" r="4" fill="#0a84ff"/>
<circle cx="243.3" cy="218.1" r="4" fill="#0a84ff"/>
<circle cx="330.0" cy="123.6" r="4" fill="#0a84ff"/>
<circle cx="416.7" cy="83.2" r="4" fill="#0a84ff"/>
<circle cx="503.3" cy="63.4" r="4" fill="#0a84ff"/>
<circle cx="590.0" cy="60.0" r="4" fill="#0a84ff"/>
<text x="143.0" y="126.2" font-size="12" fill="#ff9f0a" font-weight="700">30ms에 77%</text>
<rect x="70" y="318" width="14" height="4" fill="#ff9f0a"/><text x="92" y="324" font-size="12" fill="#1d1d1f">전: 280ms, --ease-out (30ms 간격, 403 → 579 → 612 → 631px)</text>
<rect x="70" y="340" width="14" height="4" fill="#0a84ff"/><text x="92" y="346" font-size="12" fill="#1d1d1f">후: 400ms, --ease-in-out (40ms 간격, 375 → 391 → 447 → 557 → 604 → 627 → 631px)</text>
</svg>