<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 270"><title>NTFS 권한 규칙 세 가지: 그룹 권한의 누적, 파일 권한 우선, 거부 우선</title><rect width="640" height="270" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker></defs>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<text x="110" y="28" font-weight="600">① 누적</text><text x="320" y="28" font-weight="600">② 파일 권한 우선</text><text x="530" y="28" font-weight="600">③ 거부 우선</text>
<rect x="20" y="45" width="85" height="40" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="62" y="62" font-size="12">그룹 1</text><text x="62" y="78" font-size="12">읽기 허용</text>
<rect x="115" y="45" width="85" height="40" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="157" y="62" font-size="12">그룹 2</text><text x="157" y="78" font-size="12">쓰기 허용</text>
<line x1="62" y1="87" x2="100" y2="140" stroke="#6e6e73" marker-end="url(#a)"/><line x1="157" y1="87" x2="120" y2="140" stroke="#6e6e73" marker-end="url(#a)"/>
<rect x="45" y="145" width="130" height="44" rx="6" fill="#34c759"/><text x="110" y="172" fill="#fff">읽기 + 쓰기</text>
<rect x="250" y="45" width="140" height="40" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="320" y="62" font-size="12">폴더 D</text><text x="320" y="78" font-size="12">읽기만 허용</text>
<rect x="250" y="100" width="140" height="40" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="320" y="117" font-size="12">D 안의 파일 F</text><text x="320" y="133" font-size="12">쓰기 직접 허용</text>
<line x1="320" y1="142" x2="320" y2="142" /><line x1="320" y1="142" x2="320" y2="142"/>
<line x1="320" y1="141" x2="320" y2="143" stroke="#6e6e73"/>
<rect x="255" y="150" width="130" height="44" rx="6" fill="#34c759"/><text x="320" y="170" fill="#fff" font-size="12">F는 쓰기 가능</text><text x="320" y="186" fill="#fff" font-size="12">(D의 다른 파일은 불가)</text>
<rect x="440" y="45" width="85" height="40" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="482" y="62" font-size="12">그룹 1</text><text x="482" y="78" font-size="12">쓰기 허용</text>
<rect x="535" y="45" width="85" height="40" rx="6" fill="#f2f2f7" stroke="#ff3b30"/><text x="577" y="62" font-size="12">그룹 2</text><text x="577" y="78" font-size="12">쓰기 거부</text>
<line x1="482" y1="87" x2="520" y2="140" stroke="#6e6e73" marker-end="url(#a)"/><line x1="577" y1="87" x2="540" y2="140" stroke="#6e6e73" marker-end="url(#a)"/>
<rect x="465" y="145" width="130" height="44" rx="6" fill="#ff3b30"/><text x="530" y="172" fill="#fff">쓰기 불가</text>
<text x="320" y="240" font-size="12" fill="#6e6e73">사용자 A가 두 그룹에 동시에 속한 경우의 최종 권한</text>
</g></svg>
