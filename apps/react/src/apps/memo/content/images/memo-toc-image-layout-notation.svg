<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>이미지 주소 끝의 배치 표기 하나가 읽기 화면, 편집기, GitHub, 휴대폰에서 어떻게 쓰이는가</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker></defs>
<rect width="860" height="380" fill="#fff"/>
<text x="430" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">배치는 이미지 주소의 # 조각 하나에 적는다</text>
<rect x="20" y="150" width="270" height="86" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="155" y="176" font-size="12" fill="#6b7280" text-anchor="middle">저장소 글 · 서버 글 (Markdown)</text>
<text x="155" y="202" font-size="12.5" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">![설명](./images/a.jpg</text>
<text x="155" y="222" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"><tspan fill="#b45309" font-weight="700">#float-right</tspan><tspan fill="#111827"> "캡션")</tspan></text>
<g font-size="12.5" fill="#1f2937">
<rect x="380" y="56" width="460" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="396" y="80" font-weight="600">읽기 화면 (MarkdownImage)</text>
<text x="396" y="102" fill="#374151">imageLayoutOf → data-layout="float-right" · 본문 40% 폭, 문단이 옆으로 흐름</text>
<rect x="380" y="132" width="460" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="396" y="156" font-weight="600">편집기 (Milkdown image_block)</text>
<text x="396" y="178" fill="#374151">src에 그대로 보관 · 배치 버튼은 # 조각만 바꿈 · 저장해도 같은 줄</text>
<rect x="380" y="208" width="460" height="62" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="396" y="232" font-weight="600">GitHub · 다른 Markdown 뷰어</text>
<text x="396" y="254" fill="#374151"># 조각은 요청에 포함되지 않아 이미지는 그대로 보임 · 배치만 무시(가운데)</text>
<rect x="380" y="284" width="460" height="62" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
<text x="396" y="308" font-weight="600">휴대폰 · 좁은 창 (한 칸 보기)</text>
<text x="396" y="330" fill="#374151">띄우지 않고 본문 폭 · 정렬(#left·#right)은 그대로</text>
</g>
<g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M290 175 C 330 175, 340 87, 376 87"/>
<path d="M290 188 C 330 188, 340 163, 376 163"/>
<path d="M290 200 C 330 200, 340 239, 376 239"/>
<path d="M290 212 C 330 212, 340 315, 376 315"/>
</g>
</svg>
