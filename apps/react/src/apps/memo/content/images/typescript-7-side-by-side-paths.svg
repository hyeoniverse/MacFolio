<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>baseUrl을 쓰던 설정은 paths의 src/*를 baseUrl 기준으로 해석했고, TS 7에서는 paths를 tsconfig.json 위치 기준의 ./src/*로 적는다. 두 경우 모두 @/apps/memo/Memo는 apps/react/src/apps/memo/Memo로 해석된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">별칭 @/의 경로 해석: baseUrl 삭제 전후</text>
<rect x="24" y="52" width="592" height="40" rx="8" fill="#f2f2f7"/>
<text x="40" y="77" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">import Memo from '@/apps/memo/Memo';</text>
<text x="24" y="124" font-size="13" font-weight="700" fill="#1d1d1f">전 (TS 5.9)</text>
<rect x="24" y="134" width="280" height="70" rx="8" fill="#ffffff" stroke="#c7c7cc"/>
<text x="38" y="158" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"baseUrl": ".",</text>
<text x="38" y="178" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"paths": { "@/*": ["src/*"] }</text>
<text x="38" y="196" font-size="12" fill="#6e6e73">src/*를 baseUrl(.) 기준으로 해석</text>
<text x="336" y="124" font-size="13" font-weight="700" fill="#1d1d1f">후 (TS 7.0)</text>
<rect x="336" y="134" width="280" height="70" rx="8" fill="#ffffff" stroke="#34c759"/>
<text x="350" y="158" font-size="12" fill="#ff3b30" font-family="ui-monospace, Menlo, monospace" text-decoration="line-through">"baseUrl": ".",</text>
<text x="350" y="178" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"paths": { "@/*": ["./src/*"] }</text>
<text x="350" y="196" font-size="12" fill="#6e6e73">./src/*를 tsconfig.json 위치 기준으로</text>
<path d="M164 208 L300 244" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M476 208 L340 244" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="248" width="340" height="36" rx="8" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff"/>
<text x="320" y="271" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">apps/react/src/apps/memo/Memo.tsx</text>
</svg>
