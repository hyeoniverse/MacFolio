<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>'Merged'인데 main에 없던 PR</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="900" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">'Merged'인데 main에 없던 PR</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">#27은 #26 브랜치를 base로 쌓은 PR이었다. #26이 먼저 main에 들어간 5초 뒤 #27이 병합됐다</text>
<line x1="250" y1="100" x2="870" y2="100" stroke="#374151" stroke-width="3" opacity="0.35"/>
<text x="32" y="104" font-size="11.5" fill="#374151" text-anchor="start" font-weight="600">main</text>
<line x1="250" y1="170" x2="870" y2="170" stroke="#4f46e5" stroke-width="3" opacity="0.35"/>
<text x="32" y="174" font-size="11.5" fill="#4f46e5" text-anchor="start" font-weight="600">feat/phase4-api-client (#26)</text>
<line x1="250" y1="240" x2="870" y2="240" stroke="#b45309" stroke-width="3" opacity="0.35"/>
<text x="32" y="244" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="600">refactor/phase4-data-fetching (#27)</text>
<circle cx="270" cy="100" r="8" fill="#374151"/>
<circle cx="340" cy="170" r="8" fill="#4f46e5"/>
<text x="340" y="156" font-size="10.5" fill="#4f46e5" text-anchor="middle">#26 커밋</text>
<circle cx="420" cy="240" r="8" fill="#b45309"/>
<text x="420" y="264" font-size="10.5" fill="#b45309" text-anchor="middle">#27 커밋 2개</text>
<line x1="340" y1="170" x2="520" y2="108" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="530" cy="100" r="8" fill="#4f46e5"/>
<text x="530" y="86" font-size="10.5" fill="#4f46e5" text-anchor="middle">04:31:13 #26 → main</text>
<line x1="420" y1="240" x2="600" y2="178" stroke="#b45309" stroke-width="1.6" marker-end="url(#a-amber)"/>
<circle cx="610" cy="170" r="8" fill="#b45309"/>
<text x="626" y="196" font-size="10.5" fill="#b45309" text-anchor="start">04:31:18 #27 → #26 브랜치</text>
<circle cx="700" cy="100" r="8" fill="#374151"/>
<text x="700" y="86" font-size="10.5" fill="#374151" text-anchor="middle">#29 · #30</text>
<circle cx="820" cy="100" r="8" fill="#15803d"/>
<text x="820" y="86" font-size="10.5" fill="#15803d" text-anchor="middle">#32 cherry-pick</text>
<line x1="610" y1="160" x2="610" y2="120" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="622" y="140" font-size="10.5" fill="#b91c1c" text-anchor="start">main으로 이어지지 않음</text>
</svg>
