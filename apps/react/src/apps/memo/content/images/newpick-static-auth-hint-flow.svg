<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>정적 HTML에서 로그인 상태를 먼저 정하는 순서</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="900" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">정적 HTML에서 로그인 상태를 먼저 정하는 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">토큰은 HttpOnly 그대로. 스크립트가 읽는 것은 '로그인했다'는 표시뿐</text>
<rect x="32" y="96" width="182" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="123.0" y="123.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">① CDN</text>
<text x="123.0" y="139.0" font-size="10.5" fill="#6b7280" text-anchor="middle">미리 만든 HTML</text>
<text x="123" y="178" font-size="10.5" fill="#6b7280" text-anchor="middle">로그인 버튼과 프로필 자리를 둘 다 담음</text>
<rect x="250" y="96" width="182" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="341.0" y="123.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">② &lt;head&gt; 인라인 스크립트</text>
<text x="341.0" y="139.0" font-size="10.5" fill="#6b7280" text-anchor="middle">logged_in=1 확인</text>
<text x="341" y="178" font-size="10.5" fill="#6b7280" text-anchor="middle">&lt;html data-auth="in|out"&gt;</text>
<rect x="468" y="96" width="182" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="559.0" y="123.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">③ CSS</text>
<text x="559.0" y="139.0" font-size="10.5" fill="#6b7280" text-anchor="middle">첫 페인트</text>
<text x="559" y="178" font-size="10.5" fill="#6b7280" text-anchor="middle">data-auth에 맞는 쪽만 보임</text>
<rect x="686" y="96" width="182" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="777.0" y="123.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">④ 하이드레이션 후</text>
<text x="777.0" y="139.0" font-size="10.5" fill="#6b7280" text-anchor="middle">session 상태</text>
<text x="777" y="178" font-size="10.5" fill="#6b7280" text-anchor="middle">in이면 프로필 조회</text>
<line x1="214" y1="126" x2="250" y2="126" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a-line)"/>
<line x1="432" y1="126" x2="468" y2="126" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a-line)"/>
<line x1="650" y1="126" x2="686" y2="126" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a-line)"/>
<text x="32" y="222" font-size="12" fill="#374151" text-anchor="start" font-weight="700">표시 쿠키 logged_in</text>
<circle cx="40" cy="240" r="5" fill="#15803d"/>
<text x="54" y="244" font-size="11" fill="#374151" text-anchor="start" font-weight="600">로그인 · 토큰 갱신 성공</text>
<text x="260" y="244" font-size="11" fill="#374151" text-anchor="start">발급 (refresh token과 같은 12시간)</text>
<circle cx="40" cy="264" r="5" fill="#b91c1c"/>
<text x="54" y="268" font-size="11" fill="#374151" text-anchor="start" font-weight="600">로그아웃 · 갱신 실패</text>
<text x="260" y="268" font-size="11" fill="#374151" text-anchor="start">삭제 (api가 자기 쿠키 옵션으로)</text>
<circle cx="40" cy="288" r="5" fill="#b45309"/>
<text x="54" y="292" font-size="11" fill="#374151" text-anchor="start" font-weight="600">토큰은 있는데 표시가 없음</text>
<text x="260" y="292" font-size="11" fill="#374151" text-anchor="start">middleware가 채움 (이 기능 전에 로그인한 사용자)</text>
</svg>
