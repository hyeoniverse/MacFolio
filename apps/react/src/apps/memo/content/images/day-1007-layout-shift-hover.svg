<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>정지한 마우스 아래로 메뉴 제목이 이동해 오는 상황</title>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker>
<symbol id="cur" viewBox="0 0 16 24"><path d="M1 1 L1 19 L6 14 L9.5 22 L12.5 20.7 L9 13 L15 13 Z" fill="#1d1d1f" stroke="#ffffff" stroke-width="1.2"/></symbol></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="13" font-weight="700" fill="#1d1d1f">① 시험이 마우스를 '윈도우' 위에 올린다 (메모 앱이 열리기 직전)</text>
<rect x="20" y="44" width="600" height="34" fill="#f2f2f7"/>
<text x="40" y="66" font-size="13" font-weight="700" fill="#1d1d1f">Finder</text>
<text x="110" y="66" font-size="13" fill="#1d1d1f">보기</text>
<rect x="152" y="48" width="56" height="26" rx="5" fill="#0a84ff" opacity="0.18"/>
<text x="160" y="66" font-size="13" fill="#1d1d1f">윈도우</text>
<text x="224" y="66" font-size="13" fill="#1d1d1f">도움말</text>
<use href="#cur" x="176" y="62" width="16" height="24"/>
<line x1="184" y1="92" x2="184" y2="200" stroke="#ff9f0a" stroke-dasharray="4 4"/>
<text x="192" y="104" font-size="12" fill="#ff9f0a">마우스 x 좌표 (움직이지 않음)</text>
<text x="20" y="140" font-size="13" font-weight="700" fill="#1d1d1f">② 메모 앱이 메뉴를 등록하자 제목들이 오른쪽으로 밀린다</text>
<rect x="20" y="154" width="600" height="34" fill="#f2f2f7"/>
<text x="40" y="176" font-size="13" font-weight="700" fill="#1d1d1f">메모</text>
<text x="96" y="176" font-size="13" fill="#1d1d1f">파일</text>
<rect x="152" y="158" width="44" height="26" rx="5" fill="#ff3b30" opacity="0.18"/>
<text x="160" y="176" font-size="13" fill="#1d1d1f">편집</text>
<text x="212" y="176" font-size="13" fill="#1d1d1f">보기</text>
<text x="262" y="176" font-size="13" fill="#1d1d1f">윈도우</text>
<text x="326" y="176" font-size="13" fill="#1d1d1f">도움말</text>
<use href="#cur" x="176" y="172" width="16" height="24"/>
<text x="20" y="226" font-size="12" fill="#1d1d1f">③ 마우스는 그대로인데 아래 요소가 '윈도우'에서 '편집'으로 바뀐다</text>
<text x="20" y="248" font-size="12" fill="#1d1d1f">④ 브라우저는 이것도 '편집'에 진입한 것으로 보고 진입 이벤트(pointerenter 등)를 발생시킨다</text>
<text x="20" y="270" font-size="12" fill="#ff3b30">⑤ 진입 이벤트로 메뉴를 전환하던 코드가 '편집' 메뉴를 연다 → 시험 실패</text>
<text x="20" y="292" font-size="12" fill="#6e6e73">제목 배치는 설명을 위한 예시다</text>
</svg>
