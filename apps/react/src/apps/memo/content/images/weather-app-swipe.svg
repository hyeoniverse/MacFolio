<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>장소 카드를 왼쪽으로 밀어 삭제 버튼을 여는 포인터 이벤트 처리. 수정 전에는 iOS Safari가 보낸 pointercancel을 닫기로 처리해 카드가 열리지 않았다. 수정 후에는 pointerup과 pointercancel 모두 민 거리가 42px(84px의 절반)를 넘으면 84px만큼 열고, 아니면 닫는다</title>
<defs><marker id="sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="820" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">카드 밀어 삭제: pointercancel 처리 전후</text>
<rect x="32" y="64" width="150" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="107" y="87" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">pointerdown</text>
<text x="107" y="105" font-size="10" fill="#6b7280" text-anchor="middle">시작 좌표 기록</text>
<rect x="222" y="64" width="190" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="317" y="87" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">pointermove</text>
<text x="317" y="105" font-size="10" fill="#6b7280" text-anchor="middle">가로 8px 이상 · 세로보다 크면</text>
<rect x="452" y="64" width="336" height="56" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="620" y="87" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">setPointerCapture + offset 갱신</text>
<text x="620" y="105" font-size="10" fill="#374151" text-anchor="middle">카드가 손가락을 따라 이동 (최대 84 + 24px)</text>
<path d="M184 92 L220 92" stroke="#6b7280" stroke-width="1.5" marker-end="url(#sw)"/>
<path d="M414 92 L450 92" stroke="#6b7280" stroke-width="1.5" marker-end="url(#sw)"/>
<text x="32" y="156" font-size="12" fill="#1f2937" font-weight="700">손가락을 떼는 시각 (iOS Safari는 세로로 조금만 흔들려도 pointercancel)</text>
<rect x="32" y="172" width="370" height="130" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
<text x="52" y="196" font-size="12" fill="#b91c1c" font-weight="700">수정 전</text>
<text x="52" y="222" font-size="11" fill="#1f2937">pointerup → 민 거리로 열기·닫기 결정</text>
<text x="52" y="246" font-size="11" fill="#1f2937">pointercancel → 무조건 닫기 (offset 0)</text>
<text x="52" y="278" font-size="11" fill="#b91c1c">실제 iPhone에서는 거의 항상 cancel → 열리지 않음</text>
<rect x="418" y="172" width="370" height="130" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="438" y="196" font-size="12" fill="#047857" font-weight="700">수정 후</text>
<text x="438" y="222" font-size="11" fill="#1f2937">pointerup · pointercancel 같은 규칙</text>
<text x="438" y="246" font-size="11" fill="#1f2937">offset &lt; −42px(84의 절반) → −84px로 열기</text>
<text x="438" y="268" font-size="11" fill="#1f2937">그 밖 → 0으로 닫기</text>
<text x="438" y="290" font-size="10" fill="#6b7280">목록은 touch-action: pan-y로 세로 스크롤만 브라우저에 맡김</text>
</svg>
