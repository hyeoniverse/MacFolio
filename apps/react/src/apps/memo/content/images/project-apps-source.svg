<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>앱 목록은 PROJECTS에서 생성된다</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker></defs>
<rect width="860" height="380" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">앱 목록은 PROJECTS에서 생성된다</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">app 칸과 데모 주소가 있는 프로젝트만 앱이 되고, 앱을 쓰는 화면은 모두 같은 목록을 읽는다</text>
<rect x="32" y="100" width="210" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="137.0" y="129.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">PROJECTS</text>
<text x="137.0" y="146.5" font-size="11" fill="#374151" text-anchor="middle">shared/profile.ts</text>
<text x="137.0" y="163.5" font-size="11" fill="#374151" text-anchor="middle">id · demo · app</text>
<text x="137.0" y="180.5" font-size="11" fill="#374151" text-anchor="middle">app = 이름 · 아이콘 · 창 크기</text>
<text x="137.0" y="197.5" font-size="11" fill="#374151" text-anchor="middle">· 게임 여부 · inDock</text>
<line x1="242" y1="160" x2="318" y2="160" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="280.0" y="150" font-size="10" fill="#4f46e5" text-anchor="middle">app &amp;&amp; demo</text>
<rect x="322" y="110" width="210" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="427.0" y="138.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">PROJECT_APPS</text>
<text x="427.0" y="155.0" font-size="11" fill="#374151" text-anchor="middle">apps/manifest.ts</text>
<text x="427.0" y="172.0" font-size="11" fill="#374151" text-anchor="middle">내장 앱 뒤, 시스템 설정 다음에</text>
<text x="427.0" y="189.0" font-size="11" fill="#374151" text-anchor="middle">PROJECTS 순서로 추가</text>
<rect x="600" y="84" width="228" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="714.0" y="104.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Dock</text>
<text x="714.0" y="121.0" font-size="11" fill="#374151" text-anchor="middle">폭에 들어가면 고정 표시</text>
<line x1="532" y1="160" x2="596" y2="109" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="600" y="146" width="228" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="714.0" y="166.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Launchpad</text>
<text x="714.0" y="183.0" font-size="11" fill="#374151" text-anchor="middle">Dock에서 넘친 앱</text>
<line x1="532" y1="160" x2="596" y2="171" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="600" y="208" width="228" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="714.0" y="228.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">터미널 open</text>
<text x="714.0" y="245.0" font-size="11" fill="#374151" text-anchor="middle">open newpick</text>
<line x1="532" y1="160" x2="596" y2="233" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="600" y="270" width="228" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="714.0" y="290.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Safari 프로젝트 페이지</text>
<text x="714.0" y="307.0" font-size="11" fill="#374151" text-anchor="middle">"여기서 열기" 버튼</text>
<line x1="532" y1="160" x2="596" y2="295" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="322" y="270" width="210" height="70" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="427.0" y="300.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">ProjectApp · WebFrame</text>
<text x="427.0" y="317.0" font-size="11" fill="#374151" text-anchor="middle">프로젝트 id로 iframe 창 생성</text>
<line x1="427" y1="210" x2="427" y2="266" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="462" y="244" font-size="10" fill="#374151" text-anchor="middle">registry</text>
<text x="32" y="260" font-size="11" fill="#6b7280" text-anchor="start">MacFolio(이 사이트)·DevCourse(데모 없음)</text>
<text x="32" y="277" font-size="11" fill="#6b7280" text-anchor="start">는 PROJECTS에 있지만 앱이 아니다</text>
</svg>
