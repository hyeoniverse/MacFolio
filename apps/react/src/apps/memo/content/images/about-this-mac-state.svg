<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>창 하나의 상태: 열림은 저장소, 위치는 컴포넌트</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">창 하나의 상태: 열림은 저장소, 위치는 컴포넌트</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">Apple 메뉴가 열고, 닫기 버튼·Esc·다른 앱으로 넘어갈 때 닫는다</text>
<rect x="32" y="100" width="160" height="64" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="112.0" y="127.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">Apple 메뉴</text>
<text x="112.0" y="144.5" font-size="11" fill="#374151" text-anchor="middle">첫 항목 · openAbout</text>
<line x1="192" y1="132" x2="262" y2="132" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="266" y="90" width="220" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="376.0" y="119.0" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">aboutStore</text>
<text x="376.0" y="136.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">{ open: boolean }</text>
<text x="376.0" y="153.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">useSyncExternalStore</text>
<line x1="486" y1="132" x2="556" y2="132" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="560" y="80" width="268" height="104" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="694.0" y="110.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">AboutThisMac</text>
<text x="694.0" y="127.5" font-size="11" fill="#374151" text-anchor="middle">열리면 닫기 버튼에 초점</text>
<text x="694.0" y="144.5" font-size="11" fill="#374151" text-anchor="middle">열려 있을 때만 Esc 듣기</text>
<text x="694.0" y="161.5" font-size="11" fill="#374151" text-anchor="middle">offset {x,y} → translate</text>
<rect x="266" y="210" width="220" height="64" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="376.0" y="237.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">closeAbout</text>
<text x="376.0" y="254.5" font-size="11" fill="#374151" text-anchor="middle">닫기 · Esc · 링크 누름</text>
<line x1="376" y1="210" x2="376" y2="178" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="560" y="210" width="268" height="64" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="694.0" y="237.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">끌기</text>
<text x="694.0" y="254.5" font-size="11" fill="#374151" text-anchor="middle">button · a · dd 위에서는 시작 안 함</text>
<line x1="694" y1="210" x2="694" y2="188" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
</svg>
