    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <!-- 오른쪽 스택 -->
  <g fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2">
