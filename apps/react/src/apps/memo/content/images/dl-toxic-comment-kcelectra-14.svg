<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="290" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">테스트 세트 3,109문장의 혼동 행렬 (평가 지표에서 역산)</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#6e6e73">예측</text>
  <text x="300" y="80" text-anchor="middle" font-size="13" fill="#1d1d1f">악성(0)</text>
  <text x="460" y="80" text-anchor="middle" font-size="13" fill="#1d1d1f">정상(1)</text>
  <text x="90" y="170" text-anchor="middle" font-size="13" fill="#6e6e73">실제</text>
  <text x="180" y="133" text-anchor="middle" font-size="13" fill="#1d1d1f">악성(0)</text>
  <text x="180" y="210" text-anchor="middle" font-size="13" fill="#1d1d1f">정상(1)</text>
  <rect x="230" y="92" width="150" height="76" fill="#e8f2ff" stroke="#0a84ff"/>
  <text x="305" y="128" text-anchor="middle" font-size="20" font-weight="600" fill="#0a84ff">1,218</text>
  <text x="305" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">악성을 악성으로</text>
  <rect x="380" y="92" width="150" height="76" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="455" y="128" text-anchor="middle" font-size="20" font-weight="600" fill="#1d1d1f">131</text>
  <text x="455" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">악성을 놓침 (FP)</text>
  <rect x="230" y="168" width="150" height="76" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="305" y="204" text-anchor="middle" font-size="20" font-weight="600" fill="#1d1d1f">107</text>
  <text x="305" y="226" text-anchor="middle" font-size="11" fill="#6e6e73">정상을 차단 (FN)</text>
  <rect x="380" y="168" width="150" height="76" fill="#e8f2ff" stroke="#0a84ff"/>
  <text x="455" y="204" text-anchor="middle" font-size="20" font-weight="600" fill="#0a84ff">1,653</text>
  <text x="455" y="226" text-anchor="middle" font-size="11" fill="#6e6e73">정상을 정상으로 (TP)</text>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#6e6e73">양성 클래스는 라벨 1(정상). 정확도 2,871/3,109 = 0.9234, 정밀도 1,653/1,784, 재현율 1,653/1,760</text>
</svg>
