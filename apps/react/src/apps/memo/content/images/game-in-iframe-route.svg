<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>page.route로 게임 사이트 요청을 가짜 응답으로 바꾸는 시험</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1d1d1f">E2E 시험에서 iframe 요청이 지나는 길</text>
<rect x="24" y="56" width="180" height="120" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="38" y="80" font-size="13" font-weight="600" fill="#1d1d1f">시험 중인 브라우저</text>
<text x="38" y="102" font-size="12" fill="#1d1d1f">MacFolio 새싹 농장 창</text>
<rect x="38" y="114" width="152" height="48" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="50" y="136" font-size="12" fill="#0a84ff" font-family="'SF Mono', Menlo, Consolas, monospace">iframe</text>
<text x="50" y="152" font-size="11.5" fill="#6e6e73">START 단추가 보이는가</text>
<line x1="204" y1="116" x2="282" y2="116" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="288" y="56" width="150" height="120" rx="10" fill="#e5f1ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="300" y="80" font-size="13" font-weight="600" fill="#0a84ff">page.route</text>
<text x="300" y="102" font-size="12" fill="#1d1d1f">주소가</text>
<text x="300" y="118" font-size="11.5" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">sprout-farm-beta</text>
<text x="300" y="134" font-size="11.5" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">.vercel.app/**</text>
<text x="300" y="152" font-size="12" fill="#1d1d1f">이면 가로챈다</text>
<line x1="438" y1="96" x2="510" y2="96" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="462" y="90" font-size="15" font-weight="700" fill="#ff3b30">✕</text>
<rect x="516" y="56" width="100" height="80" rx="10" fill="#ffffff" stroke="#6e6e73" stroke-dasharray="5 4"/>
<text x="530" y="84" font-size="12.5" fill="#6e6e73">실제 게임</text>
<text x="530" y="102" font-size="12.5" fill="#6e6e73">사이트</text>
<text x="530" y="120" font-size="11.5" fill="#ff3b30">요청하지 않음</text>
<path d="M363 176 C 363 230, 200 230, 140 182" fill="none" stroke="#34c759" stroke-width="1.5" marker-end="url(#agr)"/>
<text x="254" y="214" font-size="12" font-weight="600" fill="#34c759">route.fulfill</text>
<rect x="24" y="242" width="592" height="66" rx="10" fill="#f2f2f7"/>
<text x="38" y="266" font-size="12" fill="#1d1d1f">가짜 응답</text>
<text x="110" y="266" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">contentType: 'text/html'</text>
<text x="110" y="290" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">body: '&lt;button&gt;START&lt;/button&gt;'</text>
<text x="380" y="278" font-size="12" fill="#6e6e73">게임 서버가 느리거나 바뀌어도</text>
<text x="380" y="296" font-size="12" fill="#6e6e73">시험 결과는 같다</text>
</svg>
