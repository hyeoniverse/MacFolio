<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>SQL 실행 순서와 단계별 행 수</title><rect width="640" height="420" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">작성 순서와 실행 순서가 다르다: 실행 순서대로 행 수를 적는다</text>
<g font-size="13" font-weight="600" fill="#6e6e73"><text x="20" y="60">실행 순서</text><text x="120" y="60">절</text><text x="400" y="60">남은 행</text><text x="490" y="60">작성 순서</text></g>
<g font-size="13">
<rect x="20" y="72" width="600" height="46" rx="8" fill="#f2f2f7"/><text x="34" y="100" font-weight="600" fill="#0a84ff">1</text><text x="120" y="100" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">FROM 사원</text><text x="400" y="100" fill="#1d1d1f">6행</text><text x="490" y="100" fill="#6e6e73">2번째로 씀</text>
<rect x="20" y="126" width="600" height="46" rx="8" fill="#f2f2f7"/><text x="34" y="154" font-weight="600" fill="#0a84ff">2</text><text x="120" y="154" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">WHERE 급여 &gt;= 300</text><text x="400" y="154" fill="#1d1d1f">4행</text><text x="490" y="154" fill="#6e6e73">3번째로 씀</text>
<rect x="20" y="180" width="600" height="46" rx="8" fill="#f2f2f7"/><text x="34" y="208" font-weight="600" fill="#0a84ff">3</text><text x="120" y="208" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">GROUP BY 부서</text><text x="400" y="208" fill="#1d1d1f">3그룹</text><text x="490" y="208" fill="#6e6e73">4번째로 씀</text>
<rect x="20" y="234" width="600" height="46" rx="8" fill="#f2f2f7"/><text x="34" y="262" font-weight="600" fill="#0a84ff">4</text><text x="120" y="262" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">HAVING COUNT(*) &gt;= 2</text><text x="400" y="262" fill="#1d1d1f">1그룹</text><text x="490" y="262" fill="#6e6e73">5번째로 씀</text>
<rect x="20" y="288" width="600" height="46" rx="8" fill="#e8f2ff"/><text x="34" y="316" font-weight="600" fill="#0a84ff">5</text><text x="120" y="316" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">SELECT 부서, COUNT(*)</text><text x="400" y="316" fill="#0a84ff" font-weight="600">1행</text><text x="490" y="316" fill="#ff453a">1번째로 씀</text>
<rect x="20" y="342" width="600" height="46" rx="8" fill="#f2f2f7"/><text x="34" y="370" font-weight="600" fill="#0a84ff">6</text><text x="120" y="370" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">ORDER BY</text><text x="400" y="370" fill="#6e6e73">행 수 그대로</text><text x="490" y="370" fill="#6e6e73">6번째로 씀</text>
</g>
<text x="320" y="410" text-anchor="middle" font-size="12" fill="#6e6e73">ORDER BY는 행의 순서만 바꾸고 행 수는 바꾸지 않는다. 이 예제에는 ORDER BY가 없다</text>
</svg>
