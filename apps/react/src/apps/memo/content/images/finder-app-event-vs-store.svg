<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>메모가 아직 마운트되지 않았을 때 이벤트와 store의 차이</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
</defs>
<rect width="640" height="360" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">Finder에서 글을 더블 클릭한 뒤의 시간 순서</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">메모 창은 처음 열 때 코드 청크를 내려받은 뒤에 마운트된다</text>

<line x1="120" y1="88" x2="612" y2="88" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="612" y="78" font-size="12" fill="#6e6e73" text-anchor="end">시간</text>
<circle cx="170" cy="88" r="5" fill="#1d1d1f"/>
<text x="170" y="110" font-size="12" fill="#1d1d1f" text-anchor="middle">t0 요청</text>
<rect x="230" y="80" width="230" height="16" rx="4" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="345" y="122" font-size="12" fill="#6e6e73" text-anchor="middle">메모 청크 내려받기·평가</text>
<circle cx="510" cy="88" r="5" fill="#1d1d1f"/>
<text x="510" y="110" font-size="12" fill="#1d1d1f" text-anchor="middle">t1 메모 마운트</text>

<rect x="24" y="142" width="592" height="88" rx="10" fill="#f2f2f7"/>
<text x="40" y="166" font-size="13" font-weight="700" fill="#1d1d1f">이벤트</text>
<text x="40" y="184" font-size="12" fill="#6e6e73">dispatchEvent</text>
<rect x="130" y="158" width="150" height="40" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<text x="205" y="176" font-size="12" fill="#1d1d1f" text-anchor="middle">t0: 이벤트 발생</text>
<text x="205" y="192" font-size="12" fill="#ff3b30" text-anchor="middle">리스너 0개 → 유실</text>
<rect x="430" y="158" width="170" height="40" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<text x="515" y="176" font-size="12" fill="#1d1d1f" text-anchor="middle">t1: 리스너 등록</text>
<text x="515" y="192" font-size="12" fill="#ff3b30" text-anchor="middle">받을 이벤트가 없다</text>
<text x="40" y="218" font-size="12" fill="#ff3b30" font-weight="700">결과: 메모는 열리지만 글은 선택되지 않는다</text>

<rect x="24" y="246" width="592" height="98" rx="10" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="40" y="270" font-size="13" font-weight="700" fill="#0a84ff">store</text>
<text x="40" y="288" font-size="12" fill="#6e6e73">openRequest</text>
<rect x="130" y="262" width="150" height="40" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="205" y="280" font-size="12" fill="#1d1d1f" text-anchor="middle">t0: requestOpen</text>
<text x="205" y="296" font-size="12" fill="#1d1d1f" text-anchor="middle">{ app: 'memo', id }</text>
<line x1="282" y1="282" x2="426" y2="282" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="354" y="274" font-size="12" fill="#0a84ff" text-anchor="middle">값이 남아 있다</text>
<rect x="430" y="262" width="170" height="40" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="515" y="280" font-size="12" fill="#1d1d1f" text-anchor="middle">t1: take()가 읽고</text>
<text x="515" y="296" font-size="12" fill="#1d1d1f" text-anchor="middle">request를 null로</text>
<text x="40" y="330" font-size="12" fill="#34c759" font-weight="700">결과: 메모가 열리고 그 글이 선택된다</text>
</svg>
