<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="30" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="middle">카드 안의 남는 높이를 누가 차지하는가 (세로 flex)</text>

  <text x="160" y="62" font-size="13" font-weight="600" fill="#ff3b30" text-anchor="middle">전: 설명에 flex: 1</text>
  <text x="480" y="62" font-size="13" font-weight="600" fill="#34c759" text-anchor="middle">후: 언어 줄에 margin-top: auto</text>

  <!-- before: with desc -->
  <rect x="20" y="76" width="136" height="200" rx="8" fill="#fff" stroke="#c7c7cc"/>
  <rect x="30" y="86" width="116" height="22" rx="4" fill="#eaf3ff"/><text x="88" y="101" font-size="12" fill="#0a84ff" text-anchor="middle">제목</text>
  <rect x="30" y="114" width="116" height="118" rx="4" fill="#f2f2f7" stroke="#6e6e73" stroke-dasharray="3 3"/><text x="88" y="168" font-size="12" fill="#1d1d1f" text-anchor="middle">설명 (늘어남)</text>
  <rect x="30" y="240" width="116" height="26" rx="4" fill="#eafaef"/><text x="88" y="257" font-size="12" fill="#1d1d1f" text-anchor="middle">언어·별·데모</text>
  <text x="88" y="296" font-size="12" fill="#6e6e73" text-anchor="middle">설명 있음: 정상</text>
  <!-- before: no desc -->
  <rect x="166" y="76" width="136" height="200" rx="8" fill="#fff" stroke="#ff3b30"/>
  <rect x="176" y="86" width="116" height="22" rx="4" fill="#eaf3ff"/><text x="234" y="101" font-size="12" fill="#0a84ff" text-anchor="middle">제목</text>
  <rect x="176" y="114" width="116" height="26" rx="4" fill="#eafaef"/><text x="234" y="131" font-size="12" fill="#1d1d1f" text-anchor="middle">언어·별·데모</text>
  <text x="234" y="210" font-size="12" fill="#ff3b30" text-anchor="middle">빈 공간</text>
  <text x="234" y="296" font-size="12" fill="#ff3b30" text-anchor="middle">설명 없음: &lt;p&gt;가 없어</text>
  <text x="234" y="312" font-size="12" fill="#ff3b30" text-anchor="middle">늘어날 요소가 없다</text>

  <line x1="320" y1="70" x2="320" y2="320" stroke="#e5e5ea"/>

  <!-- after: with desc -->
  <rect x="338" y="76" width="136" height="200" rx="8" fill="#fff" stroke="#c7c7cc"/>
  <rect x="348" y="86" width="116" height="22" rx="4" fill="#eaf3ff"/><text x="406" y="101" font-size="12" fill="#0a84ff" text-anchor="middle">제목</text>
  <rect x="348" y="114" width="116" height="52" rx="4" fill="#f2f2f7"/><text x="406" y="136" font-size="12" fill="#1d1d1f" text-anchor="middle">설명</text><text x="406" y="154" font-size="12" fill="#6e6e73" text-anchor="middle">(최대 세 줄)</text>
  <rect x="348" y="172" width="116" height="62" rx="4" fill="#fff6e8" stroke="#ff9f0a" stroke-dasharray="3 3"/><text x="406" y="207" font-size="12" fill="#ff9f0a" text-anchor="middle">auto 여백</text>
  <rect x="348" y="240" width="116" height="26" rx="4" fill="#eafaef"/><text x="406" y="257" font-size="12" fill="#1d1d1f" text-anchor="middle">언어·별·데모</text>
  <text x="406" y="296" font-size="12" fill="#6e6e73" text-anchor="middle">설명 있음</text>
  <!-- after: no desc -->
  <rect x="484" y="76" width="136" height="200" rx="8" fill="#fff" stroke="#34c759"/>
  <rect x="494" y="86" width="116" height="22" rx="4" fill="#eaf3ff"/><text x="552" y="101" font-size="12" fill="#0a84ff" text-anchor="middle">제목</text>
  <rect x="494" y="114" width="116" height="120" rx="4" fill="#fff6e8" stroke="#ff9f0a" stroke-dasharray="3 3"/><text x="552" y="178" font-size="12" fill="#ff9f0a" text-anchor="middle">auto 여백</text>
  <rect x="494" y="240" width="116" height="26" rx="4" fill="#eafaef"/><text x="552" y="257" font-size="12" fill="#1d1d1f" text-anchor="middle">언어·별·데모</text>
  <text x="552" y="296" font-size="12" fill="#34c759" text-anchor="middle">설명 없음: 언어 줄이</text>
  <text x="552" y="312" font-size="12" fill="#34c759" text-anchor="middle">카드 아래에 붙는다</text>

  <text x="320" y="344" font-size="12" fill="#6e6e73" text-anchor="middle">늘어나는 대상을 없을 수도 있는 설명에서, 항상 있는 언어 줄 위의 여백으로 옮겼다</text>
</svg>
