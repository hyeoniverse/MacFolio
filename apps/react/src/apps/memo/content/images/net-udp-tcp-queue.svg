<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">LISTEN 소켓의 두 수신 연결 큐 (Linux)</text>
  <g font-size="12" fill="#1d1d1f">
    <text x="20" y="98">클라이언트</text>
    <text x="20" y="114" fill="#6e6e73">SYN</text>
    <line x1="72" y1="104" x2="122" y2="104" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="126" y="62" width="190" height="84" rx="8" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.5"/>
    <text x="221" y="84" text-anchor="middle" font-weight="600">(1) SYN 큐</text>
    <text x="221" y="104" text-anchor="middle">SYN_RCVD 상태</text>
    <text x="221" y="122" text-anchor="middle" fill="#6e6e73">SYN+ACK 보냄, ACK 대기</text>
    <text x="221" y="166" text-anchor="middle" fill="#ff9f0a">상한 tcp_max_syn_backlog</text>
    <line x1="316" y1="104" x2="366" y2="104" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="341" y="94" text-anchor="middle" fill="#6e6e73">ACK</text>
    <rect x="370" y="62" width="160" height="84" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="450" y="84" text-anchor="middle" font-weight="600">(2) accept 큐</text>
    <text x="450" y="104" text-anchor="middle">ESTABLISHED</text>
    <text x="450" y="122" text-anchor="middle" fill="#6e6e73">핸드셰이크 완료</text>
    <text x="450" y="166" text-anchor="middle" fill="#0a84ff">크기 min(backlog, somaxconn)</text>
    <line x1="530" y1="104" x2="580" y2="104" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="586" y="100">응용</text>
    <text x="586" y="116" fill="#6e6e73">accept()</text>
  </g>
  <g font-size="12" fill="#1d1d1f">
    <rect x="20" y="196" width="600" height="86" rx="8" fill="#f2f2f7"/>
    <text x="36" y="220">(1)이 가득 차면 새 SYN을 거절한다. 위조 SYN으로 (1)을 채우는 공격이 SYN 플러딩이다.</text>
    <text x="36" y="244">(2)가 가득 차면 SYN+ACK 응답을 지연시킨다. tcp_abort_on_overflow = 1이면 RST를 보낸다.</text>
    <text x="36" y="268">accept()가 연결을 꺼내는 시각에는 3방향 핸드셰이크가 이미 끝나 있다.</text>
  </g>
</svg>
