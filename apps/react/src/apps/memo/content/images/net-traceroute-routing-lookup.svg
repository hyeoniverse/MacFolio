<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">라우팅 테이블 검색 순서: 호스트 경로 → 네트워크 경로 → 기본 경로(default)</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <g font-size="12.5" text-anchor="middle" fill="#1d1d1f">
    <rect x="70" y="44" width="200" height="34" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="170" y="66">데이터그램의 목적지 IP 주소</text>
    <rect x="70" y="104" width="200" height="40" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="170" y="122">① 목적지와 같은 호스트 항목(H)?</text>
    <text x="170" y="137" fill="#6e6e73" font-size="11">32비트 전체 일치</text>
    <rect x="70" y="170" width="200" height="40" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="170" y="188">② 네트워크 항목과 일치?</text>
    <text x="170" y="203" fill="#6e6e73" font-size="11">목적지 AND 마스크 = 목적지 네트워크</text>
    <rect x="70" y="236" width="200" height="40" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="170" y="254">③ 기본(default) 항목이 있는가?</text>
    <text x="170" y="269" fill="#6e6e73" font-size="11">네트워크 ID 0.0.0.0</text>
    <rect x="70" y="302" width="200" height="40" rx="6" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="170" y="320">폐기</text>
    <text x="170" y="335" fill="#6e6e73" font-size="11">도달 불가(unreachable) 통지</text>
    <rect x="360" y="138" width="250" height="104" rx="6" fill="#eaf8ee" stroke="#34c759"/>
    <text x="485" y="162">그 항목의 인터페이스로 전송</text>
    <text x="485" y="186" font-size="11.5" fill="#1d1d1f">G 있음: 게이트웨이(다음 홉)의 MAC으로</text>
    <text x="485" y="206" font-size="11.5" fill="#1d1d1f">G 없음: 목적지 호스트의 MAC으로</text>
    <text x="485" y="228" font-size="11" fill="#6e6e73">MAC 주소는 ARP로 구한다</text>
  </g>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="170" y1="78" x2="170" y2="102"/>
    <line x1="170" y1="144" x2="170" y2="168"/>
    <line x1="170" y1="210" x2="170" y2="234"/>
    <line x1="170" y1="276" x2="170" y2="300"/>
    <path d="M270 124 H330 V170 H358"/>
    <path d="M270 190 H358"/>
    <path d="M270 256 H330 V210 H358"/>
  </g>
  <g font-size="11.5" fill="#34c759">
    <text x="282" y="118">예</text><text x="282" y="184">예</text><text x="282" y="250">예</text>
  </g>
  <g font-size="11.5" fill="#ff9f0a">
    <text x="178" y="160">아니오</text><text x="178" y="226">아니오</text><text x="178" y="292">아니오</text>
  </g>
</svg>
