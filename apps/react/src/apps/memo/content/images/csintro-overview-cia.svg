<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>정보보호의 3요소 CIA와 각 요소를 침해하는 공격, 대표 대책</title>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">정보보호의 3요소(CIA)</text>
<polygon points="320,70 120,330 520,330" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="320" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">정보 자산</text>
<text x="320" y="270" text-anchor="middle" font-size="12" fill="#6e6e73">파일·DB·서비스</text>
<circle cx="320" cy="80" r="40" fill="#0a84ff"/><text x="320" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">기밀성</text><text x="320" y="95" text-anchor="middle" font-size="12" fill="#fff">C</text>
<circle cx="120" cy="320" r="40" fill="#34c759"/><text x="120" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">무결성</text><text x="120" y="335" text-anchor="middle" font-size="12" fill="#fff">I</text>
<circle cx="520" cy="320" r="40" fill="#ff9f0a"/><text x="520" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">가용성</text><text x="520" y="335" text-anchor="middle" font-size="12" fill="#fff">A</text>
<g font-size="12">
<text x="375" y="70" fill="#1d1d1f">허가된 주체만 읽는다</text><text x="375" y="88" fill="#ff3b30">침해: 스니핑, 유출</text><text x="375" y="106" fill="#6e6e73">대책: 암호화, 접근 통제</text>
<text x="20" y="200" fill="#1d1d1f">허가된 방법으로만 바뀐다</text><text x="20" y="218" fill="#ff3b30">침해: 위변조, 랜섬웨어</text><text x="20" y="236" fill="#6e6e73">대책: 해시, 전자서명</text>
<text x="460" y="200" fill="#1d1d1f">필요한 시각에 쓸 수 있다</text><text x="460" y="218" fill="#ff3b30">침해: DoS·DDoS, 장애</text><text x="460" y="236" fill="#6e6e73">대책: 이중화, 백업</text>
</g>
<text x="320" y="385" text-anchor="middle" font-size="12" fill="#6e6e73">근거: NIST SP 800-12 Rev.1, 44 U.S.C. § 3552</text>
</svg>
