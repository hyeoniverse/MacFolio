<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 400">
<title>컴퓨터의 부팅 과정</title>
<rect width="640" height="400" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<rect x="40" y="20" width="300" height="40" rx="8" fill="#f2f2f7"/><text x="190" y="45">① 전원 공급</text>
<rect x="40" y="80" width="300" height="40" rx="8" fill="#f2f2f7"/><text x="190" y="105">② 펌웨어 실행 (UEFI, 이전에는 BIOS)</text>
<rect x="40" y="140" width="300" height="40" rx="8" fill="#ff9f0a"/><text x="190" y="165" fill="#fff">③ 자체 진단 POST (메모리·장치 점검)</text>
<rect x="40" y="200" width="300" height="40" rx="8" fill="#f2f2f7"/><text x="190" y="225">④ 부트 로더를 주기억장치에 적재</text>
<rect x="40" y="260" width="300" height="40" rx="8" fill="#f2f2f7"/><text x="190" y="285">⑤ 부트 로더가 커널을 적재·실행</text>
<rect x="40" y="320" width="300" height="40" rx="8" fill="#0a84ff"/><text x="190" y="345" fill="#fff">⑥ 커널이 첫 프로세스 실행 (launchd, systemd)</text>
<g stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"><line x1="190" y1="60" x2="190" y2="78"/><line x1="190" y1="120" x2="190" y2="138"/><line x1="190" y1="180" x2="190" y2="198"/><line x1="190" y1="240" x2="190" y2="258"/><line x1="190" y1="300" x2="190" y2="318"/><line x1="340" y1="160" x2="418" y2="160"/></g>
<text x="380" y="152" font-size="12" fill="#6e6e73">오류</text>
<rect x="420" y="135" width="200" height="50" rx="8" fill="#ff3b30"/><text x="520" y="157" fill="#fff">오류 메시지·경고음 출력</text><text x="520" y="175" fill="#fff" font-size="12">부팅 중단</text>
<rect x="420" y="215" width="200" height="110" rx="8" fill="none" stroke="#34c759" stroke-width="2" stroke-dasharray="6 4"/>
<text x="520" y="240" fill="#34c759" font-weight="700">보안 부팅 (Secure Boot)</text>
<text x="520" y="262" font-size="12" fill="#6e6e73">각 단계가 다음 단계의</text><text x="520" y="280" font-size="12" fill="#6e6e73">전자 서명을 검증한 뒤 실행</text><text x="520" y="298" font-size="12" fill="#6e6e73">변조된 부트 로더·커널 차단</text>
<text x="320" y="390" font-size="12" fill="#6e6e73">ROM(플래시)에 있는 펌웨어가 첫 프로그램이고, 운영체제는 디스크에서 메모리로 단계적으로 적재된다</text>
</g></svg>
