<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>커밋의 한 줄이 정규식에 맞고, 엔트로피가 기준 이상이고, 예외 목록에 없을 때만 걸린다. 반복 글자 A1b2는 엔트로피 2.0으로 3.0 기준에 못 미쳐 넘어가고, macfolio:macfolio는 예외 목록에 걸려 넘어간다</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">gitleaks가 한 줄을 걸기까지 거치는 세 관문</text>
<rect x="32" y="74" width="150" height="58" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="107.0" y="99.5" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">커밋의 한 줄</text>
<text x="107.0" y="114.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">기록 전체, fetch-depth 0</text>
<rect x="222" y="74" width="170" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="307.0" y="99.5" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">정규식</text>
<text x="307.0" y="114.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">re_ · gsk_ · ://user:pw@</text>
<rect x="432" y="74" width="170" height="58" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="517.0" y="99.5" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">엔트로피</text>
<text x="517.0" y="114.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">Resend·Groq 3.0, 주소 2.5</text>
<rect x="642" y="74" width="186" height="58" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="735.0" y="99.5" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">예외 목록</text>
<text x="735.0" y="114.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">시험용 키 두 파일, 로컬 기본값</text>
<path d="M182 103 L220 103" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<path d="M392 103 L430 103" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<text x="411.0" y="97.0" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">맞음</text>
<path d="M602 103 L640 103" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<text x="621.0" y="97.0" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">넘음</text>
<rect x="642" y="190" width="186" height="50" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
<text x="735.0" y="211.5" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">걸림 → exit 1</text>
<text x="735.0" y="226.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">값은 --redact로 가림</text>
<path d="M735 132 L735 188" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#bad)"/>
<text x="735.0" y="154.0" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">없음</text>
<text x="432" y="172" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="start">re_A1b2A1b2… 엔트로피 2.0</text>
<text x="432" y="190" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">→ 3.0 아래라 넘어간다</text>
<text x="432" y="214" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="start">re_Xk9pQ2vL… 엔트로피 4.6</text>
<text x="432" y="232" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">→ 다음 관문으로</text>
<text x="32" y="182" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start">://macfolio:macfolio@</text>
<text x="32" y="200" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">비밀번호 부분 엔트로피 2.75 &gt; 2.5,</text>
<text x="32" y="218" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">예외는 regexTarget = "line"으로 줄 전체에 대 본다</text>
<text x="32" y="278" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">엔트로피는 글자 분포로 계산한 섀넌 엔트로피(비트/글자). 예시 값은 직접 계산한 것이다.</text>
</svg>
