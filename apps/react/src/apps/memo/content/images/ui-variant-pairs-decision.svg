<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>모양 분기 방식을 고르는 순서</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">데스크톱·휴대폰 모양 차이를 처리하는 방식 고르기</text>
  <g font-size="12">
    <rect x="20" y="52" width="330" height="50" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="185" y="73" text-anchor="middle" fill="#1d1d1f">① 탭 막대·내비게이션 막대처럼</text><text x="185" y="91" text-anchor="middle" fill="#1d1d1f">화면 전체 구성이 다른가?</text>
    <rect x="400" y="52" width="220" height="50" rx="10" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
    <text x="510" y="73" text-anchor="middle" font-weight="600" fill="#1d1d1f">화면 단위 컴포넌트</text><text x="510" y="91" text-anchor="middle" fill="#6e6e73">FinderMobile · SafariMobile</text>
    <line x1="350" y1="77" x2="398" y2="77" stroke="#6e6e73" marker-end="url(#a)"/><text x="374" y="70" text-anchor="middle" fill="#6e6e73">예</text>
    <line x1="185" y1="102" x2="185" y2="148" stroke="#6e6e73" marker-end="url(#a)"/><text x="200" y="130" fill="#6e6e73">아니요</text>

    <rect x="20" y="150" width="330" height="50" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="185" y="171" text-anchor="middle" fill="#1d1d1f">② 나타나는 방향·오버레이·높이·닫는 동작이</text><text x="185" y="189" text-anchor="middle" fill="#1d1d1f">다른가?</text>
    <rect x="400" y="150" width="220" height="50" rx="10" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
    <text x="510" y="171" text-anchor="middle" font-weight="600" fill="#1d1d1f">별도 부품</text><text x="510" y="189" text-anchor="middle" fill="#6e6e73">Sheet(휴대폰) · Modal(데스크톱)</text>
    <line x1="350" y1="175" x2="398" y2="175" stroke="#6e6e73" marker-end="url(#a)"/><text x="374" y="168" text-anchor="middle" fill="#6e6e73">예</text>
    <line x1="185" y1="200" x2="185" y2="246" stroke="#6e6e73" marker-end="url(#a)"/><text x="200" y="228" fill="#6e6e73">아니요</text>

    <rect x="20" y="248" width="330" height="50" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="185" y="269" text-anchor="middle" fill="#1d1d1f">③ 휴대폰에서 크기·간격·모서리 반지름이</text><text x="185" y="287" text-anchor="middle" fill="#1d1d1f">달라지는가?</text>
    <rect x="400" y="248" width="220" height="50" rx="10" fill="#eaf3ff" stroke="#0a84ff" stroke-width="2"/>
    <text x="510" y="269" text-anchor="middle" font-weight="600" fill="#1d1d1f">variant prop</text><text x="510" y="287" text-anchor="middle" fill="#6e6e73">Menu(mac·ios) · IconButton</text>
    <line x1="350" y1="273" x2="398" y2="273" stroke="#6e6e73" marker-end="url(#a)"/><text x="374" y="266" text-anchor="middle" fill="#6e6e73">예</text>
    <line x1="185" y1="298" x2="185" y2="334" stroke="#6e6e73" marker-end="url(#a)"/><text x="200" y="322" fill="#6e6e73">아니요</text>

    <rect x="20" y="336" width="330" height="50" rx="10" fill="#fff" stroke="#34c759" stroke-width="2"/>
    <text x="185" y="357" text-anchor="middle" font-weight="600" fill="#1d1d1f">부품 하나 그대로</text><text x="185" y="375" text-anchor="middle" fill="#6e6e73">SearchField (앱별 크기만 className으로)</text>
  </g>
</svg>
