<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>짝일 때만 이름으로: 라이트 선언과 다크 선언을 같이 본다</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="340" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">짝일 때만 이름으로: 라이트 선언과 다크 선언을 같이 본다</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">같은 선택자의 두 값이 이름의 라이트·다크 값과 정확히 같아야 두 줄을 함께 바꾼다</text>
<rect x="32" y="86" width="250" height="64" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="113.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">[data-app=&#x27;mail&#x27;]</text>
<text x="157.0" y="130.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">--mail-text: #1d1d1f</text>
<rect x="32" y="166" width="250" height="64" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="193.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">dark [data-app=&#x27;mail&#x27;]</text>
<text x="157.0" y="210.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">--mail-text: #f5f5f7</text>
<rect x="330" y="110" width="200" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="430.0" y="142.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">--color-label</text>
<text x="430.0" y="159.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">라이트 #1d1d1f</text>
<text x="430.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">다크 #f5f5f7</text>
<line x1="282" y1="118" x2="326" y2="140" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<line x1="282" y1="198" x2="326" y2="170" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="578" y="110" width="250" height="90" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="703.0" y="142.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">두 줄 모두</text>
<text x="703.0" y="159.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">var(--color-label)</text>
<text x="703.0" y="176.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">→ 계산된 색은 그대로</text>
<line x1="530" y1="155" x2="574" y2="155" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="32" y="256" width="250" height="56" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="279.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">터미널 흐린 글자</text>
<text x="157.0" y="296.5" font-size="11" fill="#374151" text-anchor="middle">라이트 #6e6e73 · 다크 #9a9aa0</text>
<rect x="330" y="256" width="200" height="56" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="430.0" y="279.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">--color-text-secondary</text>
<text x="430.0" y="296.5" font-size="11" fill="#374151" text-anchor="middle">다크는 #98989d</text>
<rect x="578" y="256" width="250" height="56" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="703.0" y="279.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">짝이 아니다 → 그대로 둠</text>
<text x="703.0" y="296.5" font-size="11" fill="#374151" text-anchor="middle">바꾸면 다크 색이 바뀐다</text>
<line x1="282" y1="284" x2="326" y2="284" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<line x1="530" y1="284" x2="574" y2="284" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
</svg>
