<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>openRequestStore가 요청을 전달하는 두 경우</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">요청 { app: 'messages', id: 'report-issue' }이 도착하는 두 경로</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">openRequestStore에는 요청이 최대 하나 보관된다 (request: null 또는 객체)</text>
  <text x="24" y="92" font-size="13" font-weight="700" fill="#0a84ff">A. 메시지 앱이 아직 열리지 않았다</text>
  <g font-size="12" fill="#1d1d1f">
    <rect x="24" y="104" width="180" height="60" rx="8" fill="#f2f2f7"/>
    <text x="114" y="128" text-anchor="middle">requestOpen()</text>
    <text x="114" y="148" text-anchor="middle" fill="#6e6e73">store에 요청 저장</text>
    <rect x="230" y="104" width="180" height="60" rx="8" fill="#f2f2f7"/>
    <text x="320" y="128" text-anchor="middle">openApp('messages')</text>
    <text x="320" y="148" text-anchor="middle" fill="#6e6e73">창 생성 → 마운트</text>
    <rect x="436" y="104" width="180" height="60" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
    <text x="526" y="128" text-anchor="middle">useOpenRequest의 effect</text>
    <text x="526" y="148" text-anchor="middle" fill="#6e6e73">take(): 꺼내고 null로</text>
  </g>
  <path d="M204 134 H222 M410 134 H428" stroke="#1d1d1f" stroke-width="2"/>
  <path d="M230 134 l-8 -4 v8z M436 134 l-8 -4 v8z" fill="#1d1d1f"/>
  <text x="24" y="206" font-size="13" font-weight="700" fill="#ff9f0a">B. 메시지 앱이 이미 열려 있다 (다른 창 뒤에)</text>
  <g font-size="12" fill="#1d1d1f">
    <rect x="24" y="218" width="180" height="60" rx="8" fill="#f2f2f7"/>
    <text x="114" y="242" text-anchor="middle">requestOpen()</text>
    <text x="114" y="262" text-anchor="middle" fill="#6e6e73">store에 요청 저장</text>
    <rect x="230" y="218" width="180" height="60" rx="8" fill="#ffffff" stroke="#ff9f0a" stroke-width="2"/>
    <text x="320" y="242" text-anchor="middle">subscribe 콜백</text>
    <text x="320" y="262" text-anchor="middle" fill="#6e6e73">take(): 즉시 꺼냄</text>
    <rect x="436" y="218" width="180" height="60" rx="8" fill="#f2f2f7"/>
    <text x="526" y="242" text-anchor="middle">openApp('messages')</text>
    <text x="526" y="262" text-anchor="middle" fill="#6e6e73">창을 맨 앞으로</text>
  </g>
  <path d="M204 248 H222 M410 248 H428" stroke="#1d1d1f" stroke-width="2"/>
  <path d="M230 248 l-8 -4 v8z M436 248 l-8 -4 v8z" fill="#1d1d1f"/>
  <rect x="24" y="298" width="592" height="46" rx="8" fill="#ffffff" stroke="#6e6e73"/>
  <text x="40" y="318" font-size="12" fill="#1d1d1f">두 경우 모두 핸들러는 한 번만 실행된다: setNav('forward') → conversations.compose()</text>
  <text x="40" y="336" font-size="12" fill="#6e6e73">app이 다른 요청('photos' 등)은 꺼내지 않고 남겨 두어, 해당 앱이 처리한다</text>
</svg>
