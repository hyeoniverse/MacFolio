<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>SDN의 제어부 분리와 클라우드·포그·엣지 계층</title><rect width="640" height="320" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs><g font-size="13">
<text x="150" y="28" text-anchor="middle" font-weight="600" fill="#1d1d1f">SDN</text><text x="470" y="28" text-anchor="middle" font-weight="600" fill="#1d1d1f">클라우드 · 포그 · 엣지</text>
<line x1="300" y1="40" x2="300" y2="300" stroke="#f2f2f7" stroke-width="2"/>
<rect x="40" y="44" width="220" height="40" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="150" y="69" text-anchor="middle" fill="#1d1d1f">응용(경로 정책, 보안 정책)</text>
<rect x="40" y="114" width="220" height="44" rx="6" fill="#0a84ff"/><text x="150" y="134" text-anchor="middle" fill="#fff">SDN 컨트롤러</text><text x="150" y="150" text-anchor="middle" font-size="11" fill="#e8f2ff">제어부(Control Plane)</text>
<path d="M150 84 V110" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="158" y="102" font-size="11" fill="#6e6e73">북향 API</text>
<rect x="30" y="220" width="70" height="36" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="65" y="243" text-anchor="middle" font-size="12" fill="#1d1d1f">스위치</text>
<rect x="115" y="220" width="70" height="36" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="150" y="243" text-anchor="middle" font-size="12" fill="#1d1d1f">스위치</text>
<rect x="200" y="220" width="70" height="36" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="235" y="243" text-anchor="middle" font-size="12" fill="#1d1d1f">스위치</text>
<path d="M110 158 L70 216" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><path d="M150 158 V216" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><path d="M190 158 L230 216" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/>
<text x="20" y="192" font-size="11" fill="#0a84ff">OpenFlow</text>
<text x="150" y="276" text-anchor="middle" font-size="12" fill="#ff9f0a">데이터부(Data Plane): 전달만</text>
<text x="150" y="298" text-anchor="middle" font-size="11" fill="#6e6e73">NFV는 이 장비 기능 자체를 범용 서버 소프트웨어로</text>
<rect x="330" y="44" width="280" height="50" rx="8" fill="#e8f2ff" stroke="#0a84ff"/><text x="470" y="66" text-anchor="middle" fill="#1d1d1f">클라우드 데이터센터</text><text x="470" y="84" text-anchor="middle" font-size="11" fill="#6e6e73">대규모 저장·분석, 지연 수십~수백 ms</text>
<rect x="360" y="124" width="220" height="50" rx="8" fill="#fff4e5" stroke="#ff9f0a"/><text x="470" y="146" text-anchor="middle" fill="#1d1d1f">포그 노드(지역 게이트웨이)</text><text x="470" y="164" text-anchor="middle" font-size="11" fill="#6e6e73">여러 엣지 데이터를 모아 1차 처리</text>
<rect x="330" y="204" width="80" height="50" rx="8" fill="#30d158"/><text x="370" y="226" text-anchor="middle" fill="#fff" font-size="12">엣지</text><text x="370" y="242" text-anchor="middle" fill="#fff" font-size="11">CCTV</text>
<rect x="430" y="204" width="80" height="50" rx="8" fill="#30d158"/><text x="470" y="226" text-anchor="middle" fill="#fff" font-size="12">엣지</text><text x="470" y="242" text-anchor="middle" fill="#fff" font-size="11">공장 센서</text>
<rect x="530" y="204" width="80" height="50" rx="8" fill="#30d158"/><text x="570" y="226" text-anchor="middle" fill="#fff" font-size="12">엣지</text><text x="570" y="242" text-anchor="middle" fill="#fff" font-size="11">자율주행차</text>
<path d="M470 124 V98" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M370 204 L430 178" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M470 204 V178" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M570 204 L510 178" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="282" text-anchor="middle" font-size="12" fill="#30d158">데이터가 생기는 곳 가까이에서 처리할수록 지연이 짧다</text>
</g></svg>
