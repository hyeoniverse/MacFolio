<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
	<rect width="640" height="300" fill="#ffffff" />
	<defs>
		<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10z" fill="#1d1d1f" />
		</marker>
		<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10z" fill="#0a84ff" />
		</marker>
	</defs>
	<text x="160" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">FCN: 부류 맵을 더한다</text>
	<text x="480" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">U-Net: 특징 맵을 이어 붙인다</text>
	<line x1="320" y1="45" x2="320" y2="285" stroke="#d2d2d7" />
	<!-- FCN -->
	<rect x="30" y="60" width="70" height="36" rx="6" fill="#f5f5f7" stroke="#6e6e73" />
	<text x="65" y="83" font-size="13" fill="#1d1d1f" text-anchor="middle">pool4</text>
	<rect x="30" y="200" width="70" height="36" rx="6" fill="#f5f5f7" stroke="#6e6e73" />
	<text x="65" y="223" font-size="13" fill="#1d1d1f" text-anchor="middle">conv7</text>
	<line x1="100" y1="78" x2="150" y2="78" stroke="#1d1d1f" marker-end="url(#a)" />
	<text x="125" y="70" font-size="11" fill="#6e6e73" text-anchor="middle">1×1</text>
	<rect x="152" y="62" width="58" height="32" rx="6" fill="#ffffff" stroke="#1d1d1f" />
	<text x="181" y="83" font-size="12" fill="#1d1d1f" text-anchor="middle">C+1</text>
	<line x1="100" y1="218" x2="150" y2="218" stroke="#1d1d1f" marker-end="url(#a)" />
	<text x="125" y="210" font-size="11" fill="#6e6e73" text-anchor="middle">1×1</text>
	<rect x="152" y="202" width="58" height="32" rx="6" fill="#ffffff" stroke="#1d1d1f" />
	<text x="181" y="223" font-size="12" fill="#1d1d1f" text-anchor="middle">C+1</text>
	<line x1="181" y1="202" x2="181" y2="160" stroke="#0a84ff" marker-end="url(#b)" />
	<text x="190" y="185" font-size="11" fill="#0a84ff">2배 업 샘플링</text>
	<circle cx="181" cy="146" r="12" fill="#ffffff" stroke="#0a84ff" stroke-width="2" />
	<text x="181" y="151" font-size="15" fill="#0a84ff" text-anchor="middle">+</text>
	<line x1="181" y1="94" x2="181" y2="132" stroke="#1d1d1f" marker-end="url(#a)" />
	<line x1="193" y1="146" x2="250" y2="146" stroke="#1d1d1f" marker-end="url(#a)" />
	<rect x="252" y="130" width="58" height="32" rx="6" fill="#ffffff" stroke="#1d1d1f" />
	<text x="281" y="151" font-size="12" fill="#1d1d1f" text-anchor="middle">C+1</text>
	<text x="160" y="270" font-size="12" fill="#6e6e73" text-anchor="middle">채널 수가 그대로 C+1 (원소별 합)</text>
	<!-- U-Net -->
	<rect x="350" y="60" width="80" height="36" rx="6" fill="#f5f5f7" stroke="#6e6e73" />
	<text x="390" y="83" font-size="13" fill="#1d1d1f" text-anchor="middle">f4 (512)</text>
	<rect x="350" y="200" width="80" height="36" rx="6" fill="#f5f5f7" stroke="#6e6e73" />
	<text x="390" y="223" font-size="13" fill="#1d1d1f" text-anchor="middle">병목 (1024)</text>
	<line x1="430" y1="218" x2="470" y2="218" stroke="#0a84ff" marker-end="url(#b)" />
	<text x="452" y="210" font-size="11" fill="#0a84ff" text-anchor="middle">전치</text>
	<rect x="472" y="202" width="60" height="32" rx="6" fill="#ffffff" stroke="#1d1d1f" />
	<text x="502" y="223" font-size="12" fill="#1d1d1f" text-anchor="middle">512</text>
	<line x1="430" y1="78" x2="520" y2="78" stroke="#1d1d1f" stroke-dasharray="4 3" />
	<line x1="520" y1="78" x2="520" y2="128" stroke="#1d1d1f" stroke-dasharray="4 3" marker-end="url(#a)" />
	<line x1="502" y1="202" x2="502" y2="164" stroke="#1d1d1f" marker-end="url(#a)" />
	<rect x="478" y="130" width="70" height="32" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="2" />
	<text x="513" y="151" font-size="12" fill="#0a84ff" text-anchor="middle">이어 붙임</text>
	<line x1="548" y1="146" x2="572" y2="146" stroke="#1d1d1f" marker-end="url(#a)" />
	<rect x="574" y="130" width="50" height="32" rx="6" fill="#ffffff" stroke="#1d1d1f" />
	<text x="599" y="151" font-size="12" fill="#1d1d1f" text-anchor="middle">1024</text>
	<text x="480" y="270" font-size="12" fill="#6e6e73" text-anchor="middle">채널이 합쳐진 뒤 컨볼루션으로 다시 줄인다</text>
</svg>
