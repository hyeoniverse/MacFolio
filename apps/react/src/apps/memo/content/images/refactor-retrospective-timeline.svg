<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>일곱 단계의 머지 날짜를 가로 막대로 나타낸 그림. 보안이 10월 9일부터 11일로 가장 먼저, 1~3단계는 11일 하루, 4단계는 12일부터 18일, 5·6단계는 17~18일</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="840" height="360" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">일곱 단계를 실제로 한 날 (머지 날짜, KST)</text>
<text x="249.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">09일</text>
<path d="M220 72 L220 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="307.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">10일</text>
<path d="M278 72 L278 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="365.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">11일</text>
<path d="M336 72 L336 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="423.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">12일</text>
<path d="M394 72 L394 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="481.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">13일</text>
<path d="M452 72 L452 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="539.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">14일</text>
<path d="M510 72 L510 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="597.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">15일</text>
<path d="M568 72 L568 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="655.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">16일</text>
<path d="M626 72 L626 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="713.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">17일</text>
<path d="M684 72 L684 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="771.0" y="64" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">18일</text>
<path d="M742 72 L742 300" stroke="#f3f4f6" stroke-width="1" fill="none"/>
<text x="210" y="95" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">7 보안</text>
<rect x="223" y="82" width="168" height="18" rx="5" fill="#fda4af"/>
<text x="398" y="95" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">PR 12개</text>
<text x="210" y="126" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">2 폴더 구조와 의존</text>
<rect x="339" y="113" width="52" height="18" rx="5" fill="#a5b4fc"/>
<text x="398" y="126" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">PR 5개</text>
<text x="210" y="157" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">3 공통 기반 코드</text>
<rect x="339" y="144" width="52" height="18" rx="5" fill="#a5b4fc"/>
<text x="398" y="157" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">PR 3개</text>
<text x="210" y="188" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">1 타입과 데이터 구조</text>
<rect x="339" y="175" width="52" height="18" rx="5" fill="#a5b4fc"/>
<text x="398" y="188" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">PR 10개</text>
<text x="210" y="219" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">4 공통 컴포넌트</text>
<rect x="397" y="206" width="400" height="18" rx="5" fill="#6ee7b7"/>
<text x="386" y="219" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="end">PR 11개</text>
<text x="210" y="250" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">6 서버</text>
<rect x="687" y="237" width="52" height="18" rx="5" fill="#fcd34d"/>
<text x="746" y="250" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="start">PR 3개</text>
<text x="210" y="281" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">5 스타일</text>
<rect x="687" y="268" width="110" height="18" rx="5" fill="#fcd34d"/>
<text x="676" y="281" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="end">PR 8개</text>
<text x="32" y="316" font-size="10.5" font-weight="500" fill="#374151" text-anchor="start">계획 이슈 #150은 10월 10일 새벽에 열려 18일 오후에 닫혔다. 단계 번호는 주제 순서이고, 실제로는 보안 → 2·3·1 → 4 → 6·5 순서로 했다.</text>
<text x="32" y="336" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">PR 수는 각 단계 글의 표 기준. 7단계의 #152~#160은 PR을 거치지 않고 main에 바로 들어간 커밋도 있어 날짜는 커밋 날짜로 잡았다.</text>
</svg>
