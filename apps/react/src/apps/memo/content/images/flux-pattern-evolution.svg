<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="760" height="360" fill="#fff"/>
  <text x="380" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">Flux 이후 무엇이 빠지고 무엇이 남았나</text>
  <line x1="40" y1="70" x2="720" y2="70" stroke="#d1d5db" stroke-width="2"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <circle cx="115" cy="70" r="6" fill="#4f46e5"/><text x="115" y="56">2014-05 · React 블로그</text>
    <circle cx="295" cy="70" r="6" fill="#7c3aed"/><text x="295" y="56">2015-08 · redux 1.0.0</text>
    <circle cx="475" cy="70" r="6" fill="#059669"/><text x="475" y="56">2019-06 · zustand 1.0.0</text>
    <circle cx="655" cy="70" r="6" fill="#0369a1"/><text x="655" y="56">2022-03 · React 18</text>
  </g>

  <g font-size="11">
    <rect x="30" y="88" width="170" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="115" y="112" font-size="13" text-anchor="middle" fill="#312e81" font-weight="600">Flux</text>
    <text x="44" y="138" fill="#312e81" font-weight="600">도입한 것</text>
    <text x="44" y="158" fill="#1f2937">· Action 객체</text>
    <text x="44" y="176" fill="#1f2937">· Dispatcher (중앙 허브)</text>
    <text x="44" y="194" fill="#1f2937">· 도메인마다 Store</text>
    <text x="44" y="212" fill="#1f2937">· waitFor로 Store 순서</text>
    <text x="44" y="230" fill="#1f2937">· change 이벤트 구독</text>

    <rect x="210" y="88" width="170" height="200" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="295" y="112" font-size="13" text-anchor="middle" fill="#5b21b6" font-weight="600">Redux</text>
    <text x="224" y="138" fill="#b91c1c" font-weight="600">뺀 것</text>
    <text x="224" y="158" fill="#1f2937">· Dispatcher</text>
    <text x="224" y="176" fill="#1f2937">· 여러 Store와 waitFor</text>
    <text x="224" y="194" fill="#1f2937">· 상태를 직접 수정</text>
    <text x="224" y="222" fill="#047857" font-weight="600">바꾼 것</text>
    <text x="224" y="242" fill="#1f2937">· store 하나</text>
    <text x="224" y="260" fill="#1f2937">· 순수 reducer</text>
    <text x="224" y="278" fill="#1f2937">· 새 객체를 돌려줌</text>

    <rect x="390" y="88" width="170" height="200" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="475" y="112" font-size="13" text-anchor="middle" fill="#065f46" font-weight="600">Zustand</text>
    <text x="404" y="138" fill="#b91c1c" font-weight="600">뺀 것</text>
    <text x="404" y="158" fill="#1f2937">· dispatch되는 Action</text>
    <text x="404" y="176" fill="#1f2937">· reducer (필요하면 직접)</text>
    <text x="404" y="204" fill="#047857" font-weight="600">남긴 것</text>
    <text x="404" y="224" fill="#1f2937">· store 하나 권장</text>
    <text x="404" y="242" fill="#1f2937">· set으로만 갱신</text>
    <text x="404" y="260" fill="#1f2937">· 바뀌면 구독자에게 알림</text>

    <rect x="570" y="88" width="170" height="200" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="655" y="112" font-size="13" text-anchor="middle" fill="#0c4a6e" font-weight="600">useSyncExternalStore</text>
    <text x="584" y="138" fill="#047857" font-weight="600">더한 것</text>
    <text x="584" y="158" fill="#1f2937">· 외부 store 구독의 표준</text>
    <text x="594" y="176" fill="#1f2937">subscribe + getSnapshot</text>
    <text x="584" y="194" fill="#1f2937">· Transition 중 변경 시</text>
    <text x="594" y="212" fill="#1f2937">blocking으로 다시 렌더링</text>
    <text x="594" y="230" fill="#1f2937">(화면이 같은 버전을 보임)</text>
  </g>

  <rect x="30" y="298" width="710" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="385" y="320" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">네 단계 모두 남은 것</text>
  <text x="385" y="339" font-size="11.5" fill="#374151" text-anchor="middle">View는 상태를 직접 바꾸지 않는다. 정해진 입구로 변경을 요청하고, 바뀌었다는 알림을 받아 다시 읽는다</text>
</svg>
