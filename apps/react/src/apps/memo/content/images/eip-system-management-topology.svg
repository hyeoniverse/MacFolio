<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>네트워크 토폴로지 다섯 가지</title><rect width="640" height="250" fill="#fff"/><g font-size="13">
