<text x="576" y="180" text-anchor="middle" font-weight="600" fill="#1d1d1f">망형(Mesh)</text><text x="576" y="198" text-anchor="middle" font-size="12" fill="#6e6e73">노드 5개 → 회선 10개</text>
<text x="320" y="234" text-anchor="middle" font-size="12" fill="#6e6e73">망형 회선 수 = n(n−1)/2, 노드당 포트 수 = n−1</text>
</g></svg>
