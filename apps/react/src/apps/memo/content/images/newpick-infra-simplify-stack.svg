<rect x="472" y="266" width="400" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="672.0" y="290.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">docker compose up → api + MySQL + MongoDB</text>
