<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>XSS와 CSRF의 공격 흐름 비교</title><rect width="640" height="320" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs><g font-size="13">
<text x="160" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">XSS: 사용자 브라우저에서 스크립트 실행</text>
<text x="480" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">CSRF: 사용자 권한으로 요청 위조</text>
<line x1="320" y1="44" x2="320" y2="300" stroke="#f2f2f7" stroke-width="2"/>
<rect x="20" y="56" width="90" height="40" rx="6" fill="#ff453a"/><text x="65" y="81" text-anchor="middle" fill="#fff">공격자</text>
<rect x="200" y="56" width="100" height="40" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="250" y="81" text-anchor="middle" fill="#1d1d1f">게시판 서버</text>
<rect x="110" y="196" width="110" height="40" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="165" y="221" text-anchor="middle" fill="#1d1d1f">피해자 브라우저</text>
<path d="M110 76 H196" stroke="#ff453a" stroke-width="2" marker-end="url(#r)"/><text x="153" y="50" text-anchor="middle" font-size="12" fill="#ff453a">① 스크립트 글</text>
<path d="M240 96 L190 192" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="232" y="150" font-size="12" fill="#1d1d1f">② 글 조회</text>
<path d="M120 196 L70 100" stroke="#ff453a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#r)"/><text x="20" y="160" font-size="12" fill="#ff453a">③ 쿠키 전송</text>
<text x="165" y="262" text-anchor="middle" font-size="12" fill="#6e6e73">스크립트가 피해자 브라우저에서 실행된다</text>
<text x="165" y="280" text-anchor="middle" font-size="12" fill="#6e6e73">대책: 출력 시 &lt; &gt; 등을 HTML 엔티티로 변환</text>
<rect x="340" y="56" width="90" height="40" rx="6" fill="#ff453a"/><text x="385" y="81" text-anchor="middle" fill="#fff">공격자</text>
<rect x="520" y="56" width="100" height="40" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="570" y="81" text-anchor="middle" fill="#1d1d1f">은행 서버</text>
<rect x="420" y="196" width="140" height="40" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="490" y="214" text-anchor="middle" fill="#1d1d1f">피해자 브라우저</text><text x="490" y="230" text-anchor="middle" font-size="12" fill="#0a84ff">로그인 상태</text>
<path d="M395 96 L450 192" stroke="#ff453a" stroke-width="2" marker-end="url(#r)"/><text x="350" y="150" font-size="12" fill="#ff453a">① 함정 링크</text>
<path d="M530 196 L568 100" stroke="#ff453a" stroke-width="2" marker-end="url(#r)"/><text x="556" y="150" font-size="12" fill="#ff453a">② 송금 요청</text>
<text x="480" y="262" text-anchor="middle" font-size="12" fill="#6e6e73">서버는 정상 사용자의 요청으로 처리한다</text>
<text x="480" y="280" text-anchor="middle" font-size="12" fill="#6e6e73">대책: CSRF 토큰, SameSite 쿠키, 재인증</text>
</g></svg>
