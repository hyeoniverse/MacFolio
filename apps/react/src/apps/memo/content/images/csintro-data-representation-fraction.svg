<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>0.625를 2진수로: 2를 곱해 생긴 정수부를 순서대로 읽는다</title><rect width="640" height="300" fill="#fff"/><text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">0.625를 2진수로: 2를 곱해 생긴 정수부를 순서대로 읽는다</text>
<text x="120" y="80" font-size="15" fill="#1d1d1f">0.625 × 2 = 1.25</text><rect x="330" y="62" width="40" height="26" rx="5" fill="#fff4e5" stroke="#ff9f0a"/><text x="350" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">1</text><text x="385" y="80" font-size="12" fill="#6e6e73">정수부</text>
<text x="120" y="130" font-size="15" fill="#1d1d1f">0.25 × 2 = 0.5</text><rect x="330" y="112" width="40" height="26" rx="5" fill="#fff4e5" stroke="#ff9f0a"/><text x="350" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">0</text><text x="385" y="130" font-size="12" fill="#6e6e73">정수부</text>
<text x="120" y="180" font-size="15" fill="#1d1d1f">0.5 × 2 = 1.0</text><rect x="330" y="162" width="40" height="26" rx="5" fill="#fff4e5" stroke="#ff9f0a"/><text x="350" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">1</text><text x="385" y="180" font-size="12" fill="#6e6e73">정수부</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs><path d="M470 60 L470 190" stroke="#0a84ff" stroke-width="3" marker-end="url(#a)"/><text x="485" y="130" font-size="13" fill="#0a84ff">위에서 아래로</text><text x="320" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#0a84ff">0.625 = 0.101(2)</text><text x="320" y="272" text-anchor="middle" font-size="12" fill="#6e6e73">소수부가 0이 되면 멈춘다. 0.1처럼 끝나지 않는 수는 원하는 자릿수에서 자른다</text></svg>
