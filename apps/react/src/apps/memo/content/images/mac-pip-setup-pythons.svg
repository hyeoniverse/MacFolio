<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="680" height="440" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Mac의 python3와 pip3, 패키지 설치 위치</text>

  <!-- 왼쪽: 시스템 python3 -->
  <rect x="20" y="50" width="200" height="250" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="32" y="74" font-size="13" font-weight="600" fill="#1f2937">/usr/bin/python3</text>
  <text x="32" y="92" font-size="11" fill="#6b7280">Xcode Command Line Tools</text>
  <text x="32" y="122" font-size="12" fill="#1f2937">Python 3.9.6, pip 21.2.4</text>
  <text x="32" y="146" font-size="11" fill="#6b7280">버전이 고정되어 있다</text>
  <text x="32" y="164" font-size="11" fill="#6b7280">CLT 업데이트로 교체될 수 있다</text>
  <rect x="32" y="190" width="176" height="40" rx="6" fill="#fff" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <text x="44" y="215" font-size="11" fill="#b91c1c">개발용으로 사용하지 않는다</text>

  <!-- 가운데: Homebrew python3 -->
  <rect x="240" y="50" width="200" height="250" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="252" y="74" font-size="13" font-weight="600" fill="#4f46e5">/opt/homebrew/bin/python3</text>
  <text x="252" y="92" font-size="11" fill="#6b7280">brew install python</text>
  <text x="252" y="122" font-size="12" fill="#1f2937">Python 3.15.0, pip 26.2.2</text>
  <text x="252" y="146" font-size="11" fill="#6b7280">PATH에서 /usr/bin보다 우선</text>
  <rect x="252" y="172" width="176" height="58" rx="6" fill="#fff" stroke="#fca5a5"/>
  <text x="264" y="194" font-size="11" font-weight="600" fill="#b91c1c">pip3 install → 오류</text>
  <text x="264" y="212" font-size="10" fill="#b91c1c">externally-managed-environment</text>
  <text x="252" y="256" font-size="11" fill="#6b7280">EXTERNALLY-MANAGED 파일이</text>
  <text x="252" y="272" font-size="11" fill="#6b7280">설치를 막는다 (PEP 668)</text>

  <!-- 오른쪽: 설치할 곳 -->
  <rect x="460" y="50" width="200" height="250" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="472" y="74" font-size="13" font-weight="600" fill="#047857">패키지를 설치할 곳</text>
  <rect x="472" y="90" width="176" height="60" rx="6" fill="#fff" stroke="#6ee7b7"/>
  <text x="484" y="112" font-size="12" font-weight="600" fill="#1f2937">.venv/ (가상 환경)</text>
  <text x="484" y="130" font-size="11" fill="#6b7280">프로젝트에서 쓰는 라이브러리</text>
  <rect x="472" y="160" width="176" height="60" rx="6" fill="#fff" stroke="#6ee7b7"/>
  <text x="484" y="182" font-size="12" font-weight="600" fill="#1f2937">pipx</text>
  <text x="484" y="200" font-size="11" fill="#6b7280">명령줄 도구 (앱마다 venv)</text>
  <rect x="472" y="230" width="176" height="60" rx="6" fill="#fff" stroke="#6ee7b7"/>
  <text x="484" y="252" font-size="12" font-weight="600" fill="#1f2937">brew install &lt;이름&gt;</text>
  <text x="484" y="270" font-size="11" fill="#6b7280">Homebrew에 있는 도구</text>

  <!-- 아래: 비권장 -->
  <rect x="20" y="320" width="640" height="100" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="32" y="344" font-size="13" font-weight="600" fill="#b91c1c">권장하지 않는 우회</text>
  <text x="32" y="368" font-size="12" fill="#1f2937">--break-system-packages: Homebrew Python에 직접 설치. brew 패키지와 충돌할 수 있다</text>
  <text x="32" y="390" font-size="12" fill="#1f2937">sudo pip3 install: root 소유 파일 생성, 이후 brew·pip 작업에서 권한 오류</text>
  <text x="32" y="410" font-size="12" fill="#1f2937">/usr/bin/pip3로 설치: CLT의 Python 3.9에 설치되어 brew의 python3에서 보이지 않는다</text>
</svg>
