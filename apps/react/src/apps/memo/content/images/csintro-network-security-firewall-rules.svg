<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>방화벽은 위에서부터 규칙을 비교해 처음 일치한 규칙을 적용하고 마지막 규칙은 모두 거부다</title>
<defs><marker id="a6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="360" fill="#fff"/>
<text x="320" y="30" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600">방화벽 규칙셋은 위에서부터 비교한다</text>
<text x="40" y="70" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">순서</text>
<text x="100" y="70" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">출발지</text>
<text x="250" y="70" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">목적지</text>
<text x="380" y="70" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">포트</text>
<text x="490" y="70" font-size="12" fill="#6e6e73" text-anchor="start" font-weight="600">동작</text>
<rect x="30" y="82" width="520" height="28" rx="4" fill="#f2f2f7" stroke="#e5e5ea" stroke-width="1.5"/>
<text x="290.0" y="100.5" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="40" y="101" font-size="12" fill="#1d1d1f" text-anchor="start">1</text>
<text x="100" y="101" font-size="12" fill="#1d1d1f" text-anchor="start">내부 대역 위조</text>
<text x="250" y="101" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="380" y="101" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="490" y="101" font-size="12" fill="#ff3b30" text-anchor="start" font-weight="600">거부</text>
<rect x="30" y="116" width="520" height="28" rx="4" fill="#fff" stroke="#e5e5ea" stroke-width="1.5"/>
<text x="290.0" y="134.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="40" y="135" font-size="12" fill="#1d1d1f" text-anchor="start">2</text>
<text x="100" y="135" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="250" y="135" font-size="12" fill="#1d1d1f" text-anchor="start">웹 서버</text>
<text x="380" y="135" font-size="12" fill="#1d1d1f" text-anchor="start">TCP 443</text>
<text x="490" y="135" font-size="12" fill="#34c759" text-anchor="start" font-weight="600">허용</text>
<rect x="30" y="150" width="520" height="28" rx="4" fill="#f2f2f7" stroke="#e5e5ea" stroke-width="1.5"/>
<text x="290.0" y="168.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="40" y="169" font-size="12" fill="#1d1d1f" text-anchor="start">3</text>
<text x="100" y="169" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="250" y="169" font-size="12" fill="#1d1d1f" text-anchor="start">웹 서버</text>
<text x="380" y="169" font-size="12" fill="#1d1d1f" text-anchor="start">TCP 80</text>
<text x="490" y="169" font-size="12" fill="#34c759" text-anchor="start" font-weight="600">허용</text>
<rect x="30" y="184" width="520" height="28" rx="4" fill="#fff" stroke="#e5e5ea" stroke-width="1.5"/>
<text x="290.0" y="202.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="40" y="203" font-size="12" fill="#1d1d1f" text-anchor="start">4</text>
<text x="100" y="203" font-size="12" fill="#1d1d1f" text-anchor="start">관리자 PC</text>
<text x="250" y="203" font-size="12" fill="#1d1d1f" text-anchor="start">웹 서버</text>
<text x="380" y="203" font-size="12" fill="#1d1d1f" text-anchor="start">TCP 22</text>
<text x="490" y="203" font-size="12" fill="#34c759" text-anchor="start" font-weight="600">허용</text>
<rect x="30" y="218" width="520" height="28" rx="4" fill="#f2f2f7" stroke="#e5e5ea" stroke-width="1.5"/>
<text x="290.0" y="236.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="40" y="237" font-size="12" fill="#1d1d1f" text-anchor="start">5</text>
<text x="100" y="237" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="250" y="237" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="380" y="237" font-size="12" fill="#1d1d1f" text-anchor="start">*</text>
<text x="490" y="237" font-size="12" fill="#ff3b30" text-anchor="start" font-weight="600">거부</text>
<rect x="30" y="270" width="250" height="64" rx="8" fill="#fff" stroke="#34c759" stroke-width="1.5"/>
<text x="155.0" y="297.7" font-size="12" fill="#1d1d1f" text-anchor="middle">패킷: 외부 → 웹 서버 TCP 443</text>
<text x="155.0" y="314.7" font-size="12" fill="#1d1d1f" text-anchor="middle">1번 불일치 → 2번 일치 → 허용</text>
<rect x="300" y="270" width="250" height="64" rx="8" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="425.0" y="297.7" font-size="12" fill="#1d1d1f" text-anchor="middle">패킷: 외부 → 웹 서버 TCP 3389</text>
<text x="425.0" y="314.7" font-size="12" fill="#1d1d1f" text-anchor="middle">1~4번 불일치 → 5번 → 거부</text>
<line x1="560" y1="100" x2="560" y2="250" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a6e6e73)"/>
<text x="570" y="175" font-size="12" fill="#6e6e73" text-anchor="start">위→아래</text>
</svg>
