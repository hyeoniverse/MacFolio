<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>정규화 단계와 제거하는 종속</title><rect width="640" height="462" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">정규화 단계: 화살표마다 하나씩 제거한다</text><rect x="40" y="56" width="140" height="32" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="110" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">비정규 릴레이션</text><rect x="40" y="110" width="140" height="32" rx="6" fill="#0a84ff" stroke="#0a84ff"/><text x="110" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">1NF</text><path d="M110 88 V108" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><circle cx="215" cy="99.0" r="11" fill="#fff4e5" stroke="#ff9f0a"/><text x="215" y="104.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">도</text><text x="236" y="104.0" text-anchor="start" font-size="13" fill="#1d1d1f">도메인이 원자값이 아닌 속성(반복 그룹) 제거</text><rect x="40" y="164" width="140" height="32" rx="6" fill="#0a84ff" stroke="#0a84ff"/><text x="110" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">2NF</text><path d="M110 142 V162" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><circle cx="215" cy="153.0" r="11" fill="#fff4e5" stroke="#ff9f0a"/><text x="215" y="158.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">부</text><text x="236" y="158.0" text-anchor="start" font-size="13" fill="#1d1d1f">부분 함수 종속 제거</text><rect x="40" y="218" width="140" height="32" rx="6" fill="#0a84ff" stroke="#0a84ff"/><text x="110" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">3NF</text><path d="M110 196 V216" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><circle cx="215" cy="207.0" r="11" fill="#fff4e5" stroke="#ff9f0a"/><text x="215" y="212.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">이</text><text x="236" y="212.0" text-anchor="start" font-size="13" fill="#1d1d1f">이행적 함수 종속 제거</text><rect x="40" y="272" width="140" height="32" rx="6" fill="#0a84ff" stroke="#0a84ff"/><text x="110" y="293" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">BCNF</text><path d="M110 250 V270" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><circle cx="215" cy="261.0" r="11" fill="#fff4e5" stroke="#ff9f0a"/><text x="215" y="266.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">결</text><text x="236" y="266.0" text-anchor="start" font-size="13" fill="#1d1d1f">결정자이면서 후보키가 아닌 것 제거</text><rect x="40" y="326" width="140" height="32" rx="6" fill="#0a84ff" stroke="#0a84ff"/><text x="110" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">4NF</text><path d="M110 304 V324" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><circle cx="215" cy="315.0" r="11" fill="#fff4e5" stroke="#ff9f0a"/><text x="215" y="320.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">다</text><text x="236" y="320.0" text-anchor="start" font-size="13" fill="#1d1d1f">다치 종속 제거</text><rect x="40" y="380" width="140" height="32" rx="6" fill="#0a84ff" stroke="#0a84ff"/><text x="110" y="401" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">5NF</text><path d="M110 358 V378" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><circle cx="215" cy="369.0" r="11" fill="#fff4e5" stroke="#ff9f0a"/><text x="215" y="374.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">조</text><text x="236" y="374.0" text-anchor="start" font-size="13" fill="#1d1d1f">후보키를 통하지 않는 조인 종속 제거</text><text x="320" y="444" text-anchor="middle" font-size="13" fill="#6e6e73">머리글자를 이으면 도부이결다조 · 정규화는 논리적 설계 단계에서 한다</text></svg>
