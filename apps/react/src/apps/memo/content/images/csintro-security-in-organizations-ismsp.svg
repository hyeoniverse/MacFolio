<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>ISMS-P 인증기준 101개 항목의 구성</title>
<rect width="640" height="330" fill="#fff"/>
<g font-size="13">
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">ISMS-P 인증기준 구성 (총 101개)</text>
<rect x="20" y="55" width="600" height="60" rx="10" fill="#f2f2f7" stroke="#0a84ff" stroke-width="2"/>
<text x="40" y="80" font-weight="600" fill="#0a84ff">1. 관리체계 수립 및 운영 · 16개</text>
<text x="40" y="102" fill="#1d1d1f">경영진 참여, 범위 설정, 위험 관리, 운영 점검과 개선</text>
<rect x="20" y="130" width="600" height="60" rx="10" fill="#f2f2f7" stroke="#34c759" stroke-width="2"/>
<text x="40" y="155" font-weight="600" fill="#34c759">2. 보호대책 요구사항 · 64개</text>
<text x="40" y="177" fill="#1d1d1f">인적 보안, 접근 통제, 암호화, 시스템·서비스 개발, 사고 대응, 재해 복구</text>
<rect x="20" y="205" width="600" height="60" rx="10" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
<text x="40" y="230" font-weight="600" fill="#ff9f0a">3. 개인정보 처리 단계별 요구사항 · 21개</text>
<text x="40" y="252" fill="#1d1d1f">수집 7 · 보유·이용 5 · 제공 4 · 파기 2 · 정보주체 권리보호 3</text>
<path d="M600 60 h10 v130 h-10" stroke="#1d1d1f" fill="none"/>
<text x="560" y="300" text-anchor="middle" fill="#1d1d1f">ISMS = 1 + 2 (80개)</text>
<text x="160" y="300" text-anchor="middle" fill="#1d1d1f">ISMS-P = 1 + 2 + 3 (101개)</text>
</g></svg>
