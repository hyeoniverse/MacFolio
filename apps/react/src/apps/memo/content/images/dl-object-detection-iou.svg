<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">IoU 계산 예: 6×6 박스 두 개가 4×4만큼 겹칠 때</text>
  <!-- grid: unit 22px, origin (40,50) -->
  <g stroke="#e5e5ea" stroke-width="1">
    <line x1="40" y1="50" x2="40" y2="270"/><line x1="62" y1="50" x2="62" y2="270"/><line x1="84" y1="50" x2="84" y2="270"/><line x1="106" y1="50" x2="106" y2="270"/><line x1="128" y1="50" x2="128" y2="270"/><line x1="150" y1="50" x2="150" y2="270"/><line x1="172" y1="50" x2="172" y2="270"/><line x1="194" y1="50" x2="194" y2="270"/><line x1="216" y1="50" x2="216" y2="270"/><line x1="238" y1="50" x2="238" y2="270"/><line x1="260" y1="50" x2="260" y2="270"/>
    <line x1="40" y1="50" x2="260" y2="50"/><line x1="40" y1="72" x2="260" y2="72"/><line x1="40" y1="94" x2="260" y2="94"/><line x1="40" y1="116" x2="260" y2="116"/><line x1="40" y1="138" x2="260" y2="138"/><line x1="40" y1="160" x2="260" y2="160"/><line x1="40" y1="182" x2="260" y2="182"/><line x1="40" y1="204" x2="260" y2="204"/><line x1="40" y1="226" x2="260" y2="226"/><line x1="40" y1="248" x2="260" y2="248"/><line x1="40" y1="270" x2="260" y2="270"/>
  </g>
  <rect x="128" y="138" width="88" height="88" fill="#0a84ff" fill-opacity="0.25"/>
  <rect x="84" y="94" width="132" height="132" fill="none" stroke="#1d1d1f" stroke-width="2.5"/>
  <rect x="128" y="138" width="132" height="132" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="86" y="88" font-size="12" fill="#1d1d1f">참값 B_GT (2,2)–(8,8)</text>
  <text x="140" y="288" font-size="12" fill="#0a84ff">예측 B_predict (4,4)–(10,10)</text>
  <text x="172" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">교집합 16</text>
  <g font-size="14" fill="#1d1d1f">
    <text x="300" y="90">참값 넓이 = 6 × 6 = 36</text>
    <text x="300" y="118">예측 넓이 = 6 × 6 = 36</text>
    <text x="300" y="146">교집합 = (8 − 4) × (8 − 4) = 16</text>
    <text x="300" y="174">합집합 = 36 + 36 − 16 = 56</text>
  </g>
  <text x="300" y="214" font-size="17" font-weight="600" fill="#0a84ff">IoU = 16 / 56 ≈ 0.29</text>
  <text x="300" y="242" font-size="13" fill="#6e6e73">IoU 임계값 0.5 기준이면 거짓 긍정(FP)</text>
</svg>
