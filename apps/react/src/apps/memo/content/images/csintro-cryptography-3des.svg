<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>3DES는 DES 암호화, 복호화, 암호화를 차례로 적용하는 EDE 방식이다</title>
<defs><marker id="a6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="aff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker></defs>
<rect width="640" height="240" fill="#fff"/>
<text x="320" y="30" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600">3DES의 EDE 구성</text>
<rect x="15" y="80" width="110" height="44" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="70.0" y="106.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">평문</text>
<line x1="127" y1="102" x2="138" y2="102" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a6e6e73)"/>
<rect x="140" y="80" width="110" height="44" rx="8" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="195.0" y="106.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">DES 암호화</text>
<line x1="252" y1="102" x2="263" y2="102" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a6e6e73)"/>
<rect x="265" y="80" width="110" height="44" rx="8" fill="#f2f2f7" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="320.0" y="106.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">DES 복호화</text>
<line x1="377" y1="102" x2="388" y2="102" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a6e6e73)"/>
<rect x="390" y="80" width="110" height="44" rx="8" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="445.0" y="106.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">DES 암호화</text>
<line x1="502" y1="102" x2="513" y2="102" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a6e6e73)"/>
<rect x="515" y="80" width="110" height="44" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="570.0" y="106.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">암호문</text>
<rect x="170" y="150" width="50" height="28" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="195.0" y="168.2" font-size="12" fill="#ff9f0a" text-anchor="middle">K1</text>
<line x1="195" y1="148" x2="195" y2="127" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#aff9f0a)"/>
<rect x="295" y="150" width="50" height="28" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="320.0" y="168.2" font-size="12" fill="#ff9f0a" text-anchor="middle">K2</text>
<line x1="320" y1="148" x2="320" y2="127" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#aff9f0a)"/>
<rect x="420" y="150" width="50" height="28" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="445.0" y="168.2" font-size="12" fill="#ff9f0a" text-anchor="middle">K3</text>
<line x1="445" y1="148" x2="445" y2="127" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#aff9f0a)"/>
<text x="320" y="210" font-size="12" fill="#6e6e73" text-anchor="middle">K1 = K2 = K3이면 단일 DES와 같아져 옛 장비와 호환된다. 2키 방식은 K3 = K1.</text>
</svg>
