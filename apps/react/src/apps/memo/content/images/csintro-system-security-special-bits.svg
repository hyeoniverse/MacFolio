<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 230"><title>setuid, setgid, sticky 비트가 ls -l 출력의 실행 권한 자리에 s와 t로 나타나는 위치</title><rect width="640" height="230" fill="#fff"/>
<g font-size="13" fill="#1d1d1f">
<g font-family="ui-monospace, Menlo, monospace" font-size="18">
<text x="30" y="50">-rw<tspan fill="#ff3b30" font-weight="700">s</tspan>r-xr-x  root  /usr/bin/passwd</text>
<text x="30" y="110">-rwxr-<tspan fill="#ff9f0a" font-weight="700">s</tspan>r-x  root  /usr/bin/wall</text>
<text x="30" y="170">drwxrwxrw<tspan fill="#0a84ff" font-weight="700">t</tspan>  root  /tmp</text></g>
<text x="420" y="45" fill="#ff3b30">setuid (4000)</text><text x="420" y="62" font-size="12" fill="#6e6e73">실행하면 소유자(root) 권한으로 동작</text>
<text x="420" y="105" fill="#ff9f0a">setgid (2000)</text><text x="420" y="122" font-size="12" fill="#6e6e73">실행하면 소유 그룹 권한으로 동작</text>
<text x="420" y="165" fill="#0a84ff">sticky (1000)</text><text x="420" y="182" font-size="12" fill="#6e6e73">누구나 쓰되 자기 파일만 삭제 가능</text>
<text x="30" y="215" font-size="12" fill="#6e6e73">소문자 s·t는 그 자리의 x도 켜져 있다는 뜻, 대문자 S·T는 x가 꺼져 있다는 뜻</text>
</g></svg>
