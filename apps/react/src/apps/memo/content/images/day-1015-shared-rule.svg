<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>같은 검증 규칙을 편집기와 저장소 시험에서 사용하기</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="280" fill="#ffffff"/>
<rect x="20" y="20" width="180" height="56" rx="10" fill="#f2f2f7"/>
<text x="110" y="44" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">편집기에서 게시</text>
<text x="110" y="62" font-size="12" fill="#6e6e73" text-anchor="middle">관리자가 메모 앱에서 작성</text>
<rect x="20" y="180" width="180" height="56" rx="10" fill="#f2f2f7"/>
<text x="110" y="204" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">저장소 글 (.md)</text>
<text x="110" y="222" font-size="12" fill="#6e6e73" text-anchor="middle">git으로 머지한 140편</text>
<rect x="250" y="96" width="160" height="72" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="330" y="120" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">validateDraft</text>
<text x="330" y="140" font-size="12" fill="#1d1d1f" text-anchor="middle">게시 전 검증 규칙</text>
<text x="330" y="156" font-size="12" fill="#1d1d1f" text-anchor="middle">예: 요약 200자 이하</text>
<line x1="200" y1="56" x2="248" y2="112" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="200" y1="200" x2="248" y2="154" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="30" y="160" font-size="12" fill="#0a84ff">추가: content.test.ts</text>
<rect x="450" y="20" width="170" height="56" rx="10" fill="#ecfaef" stroke="#34c759"/>
<text x="535" y="44" font-size="12" fill="#1d1d1f" text-anchor="middle">통과하면 게시</text>
<text x="535" y="62" font-size="12" fill="#6e6e73" text-anchor="middle">실패하면 경고 문구</text>
<rect x="450" y="180" width="170" height="56" rx="10" fill="#fff1f0" stroke="#ff3b30"/>
<text x="535" y="204" font-size="12" fill="#1d1d1f" text-anchor="middle">실패하면 시험 실패</text>
<text x="535" y="222" font-size="12" fill="#6e6e73" text-anchor="middle">머지 전에 CI에서 차단</text>
<line x1="410" y1="116" x2="448" y2="60" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="410" y1="150" x2="448" y2="200" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="266" font-size="12" fill="#6e6e73">수정 전에는 아래 경로(점선)가 없어 요약이 200자를 넘는 글 18편이 저장소에 들어와 있었다</text>
</svg>
