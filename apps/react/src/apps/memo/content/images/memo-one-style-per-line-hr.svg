<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="780" height="300" fill="#fff"/>
<text x="390.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">구분선 (---) 전후</text>
<text x="195" y="60" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">전: 브라우저 기본값</text>
<rect x="40" y="75" width="310" height="170" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<rect x="60" y="95" width="250" height="8" rx="2" fill="#e5e7eb" stroke="#e5e7eb"/>
<rect x="60" y="110" width="200" height="8" rx="2" fill="#e5e7eb" stroke="#e5e7eb"/>
<line x1="60" y1="150" x2="330" y2="150" stroke="#9ca3af" stroke-width="2"/><line x1="60" y1="152" x2="330" y2="152" stroke="#e5e7eb" stroke-width="1"/>
<text x="345" y="150" font-size="10" fill="#6b7280" text-anchor="end">2px 입체 선</text>
<rect x="60" y="154" width="250" height="8" rx="2" fill="#e5e7eb" stroke="#e5e7eb"/>
<text x="195" y="185" font-size="10.5" fill="#b91c1c" text-anchor="middle">위 여백만 있고 아래 여백 0</text>
<text x="195" y="205" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">저장: ***</text>
<text x="585" y="60" font-size="12" fill="#047857" text-anchor="middle" font-weight="600">후: .memo-markdown hr</text>
<rect x="430" y="75" width="310" height="170" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<rect x="450" y="95" width="250" height="8" rx="2" fill="#e5e7eb" stroke="#e5e7eb"/>
<rect x="450" y="110" width="200" height="8" rx="2" fill="#e5e7eb" stroke="#e5e7eb"/>
<line x1="450" y1="145" x2="720" y2="145" stroke="#d1d5db" stroke-width="1"/>
<rect x="450" y="172" width="250" height="8" rx="2" fill="#e5e7eb" stroke="#e5e7eb"/>
<text x="585" y="205" font-size="10.5" fill="#047857" text-anchor="middle">1px 테두리색, 위아래 1.8em</text>
<text x="585" y="225" font-size="10.5" fill="#047857" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">저장: --- (rule: '-')</text>
<text x="390" y="280" font-size="11" fill="#6b7280" text-anchor="middle">다크 모드에서는 --memo-border를 따라 어두운 선이 된다. 편집기도 같은 규칙을 쓴다</text>
</svg>
