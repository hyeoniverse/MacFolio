<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>화면 질문 25곳이 두 모듈을 거친다</title>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="640" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="38" font-size="17" font-weight="700" fill="#1f2937">전: 질문을 파일마다 직접</text>
<text x="352" y="38" font-size="17" font-weight="700" fill="#1f2937">후: 질문 종류마다 한 함수</text>
<g font-size="10.5" fill="#374151">
<rect x="32" y="58" width="280" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="40" y="73">matchMedia('(prefers-reduced-motion: reduce)').matches</text>
<rect x="32" y="86" width="280" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="40" y="101">matchMedia?.('(prefers-reduced-motion…)').matches ?? false</text>
<rect x="32" y="114" width="280" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="40" y="129">resolveTheme(theme, matchMedia('(prefers-color-scheme…)').matches) ×3</text>
<rect x="32" y="142" width="280" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="40" y="157">isMobileViewport({ width: innerWidth, height: innerHeight })</text>
<rect x="32" y="170" width="280" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="40" y="185">innerWidth &lt; 768 ? 'mobile' : 'desktop'   ← 기준이 달랐다</text>
<rect x="32" y="198" width="280" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="40" y="213">innerHeight / 2, innerWidth * 0.66 …</text>
</g>
<text x="172" y="246" font-size="11" fill="#6b7280" text-anchor="middle">파일 20개 · 25곳 · 같은 질문을 네 가지로 적었다</text>
<!-- after -->
<rect x="360" y="58" width="250" height="78" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="485" y="78" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">shared/lib/media.ts</text>
<text x="485" y="96" font-size="10.5" fill="#374151" text-anchor="middle">prefersReducedMotion() · prefersDarkScheme()</text>
<text x="485" y="110" font-size="10.5" fill="#374151" text-anchor="middle">hasCoarsePointer() · useMediaQuery(query)</text>
<text x="485" y="126" font-size="10" fill="#6b7280" text-anchor="middle">matchMedia가 없으면 false</text>
<rect x="360" y="150" width="250" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="485" y="170" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">shared/hooks/useViewport.ts</text>
<text x="485" y="188" font-size="10.5" fill="#374151" text-anchor="middle">useViewport() · getViewport()</text>
<text x="485" y="202" font-size="10" fill="#6b7280" text-anchor="middle">→ isMobileViewport() · useIsMobile()</text>
<path d="M485 210 V230" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="400" y="234" width="170" height="26" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="485" y="251" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">useResolvedTheme()</text>
<text x="485" y="282" font-size="10.5" fill="#6b7280" text-anchor="middle">설정 + 시스템 값 → 'light' | 'dark', 바뀌면 다시 그린다</text>
</svg>
