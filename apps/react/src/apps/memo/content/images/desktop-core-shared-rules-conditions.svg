<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>읽는 도구마다 exports 조건을 위에서부터 대조해 파일을 고른다</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">import '@macfolio/desktop-core/memo'가 가리키는 파일</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">"./memo" 항목의 키를 위에서부터 확인해, 자기가 켠 조건과 처음 맞는 키의 경로를 쓴다</text>

<rect x="24" y="70" width="592" height="92" rx="10" fill="#f2f2f7"/>
<text x="40" y="94" font-size="12" fill="#6e6e73">packages/desktop-core/package.json</text>
<text x="40" y="114" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">① "source":  "./src/memo/index.ts"</text>
<text x="40" y="132" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">② "types":   "./dist/memo/index.d.ts"</text>
<text x="40" y="150" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">③ "default": "./dist/memo/index.js"</text>
<text x="600" y="132" font-size="12" fill="#6e6e73" text-anchor="end">키 순서가 우선순위</text>

<text x="24" y="190" font-size="12" font-weight="700" fill="#1d1d1f">읽는 도구</text>
<text x="196" y="190" font-size="12" font-weight="700" fill="#1d1d1f">켠 조건</text>
<text x="352" y="190" font-size="12" font-weight="700" fill="#1d1d1f">①</text>
<text x="388" y="190" font-size="12" font-weight="700" fill="#1d1d1f">②</text>
<text x="424" y="190" font-size="12" font-weight="700" fill="#1d1d1f">③</text>
<text x="460" y="190" font-size="12" font-weight="700" fill="#1d1d1f">고른 파일</text>
<line x1="24" y1="198" x2="616" y2="198" stroke="#6e6e73"/>

<text x="24" y="224" font-size="12" fill="#1d1d1f">Vite (React 앱, Vitest)</text>
<text x="196" y="224" font-size="12" fill="#6e6e73">source, module, browser …</text>
<text x="352" y="224" font-size="13" font-weight="700" fill="#34c759">✓</text>
<text x="460" y="224" font-size="12" fill="#0a84ff" font-family="ui-monospace, Menlo, monospace">src/memo/index.ts</text>
<line x1="24" y1="238" x2="616" y2="238" stroke="#f2f2f7"/>

<text x="24" y="264" font-size="12" fill="#1d1d1f">tsc (React 앱)</text>
<text x="196" y="264" font-size="12" fill="#6e6e73">source (customConditions)</text>
<text x="352" y="264" font-size="13" font-weight="700" fill="#34c759">✓</text>
<text x="460" y="264" font-size="12" fill="#0a84ff" font-family="ui-monospace, Menlo, monospace">src/memo/index.ts</text>
<line x1="24" y1="278" x2="616" y2="278" stroke="#f2f2f7"/>

<text x="24" y="304" font-size="12" fill="#1d1d1f">tsc (API, NodeNext)</text>
<text x="196" y="304" font-size="12" fill="#6e6e73">types, import, node</text>
<text x="352" y="304" font-size="13" fill="#6e6e73">–</text>
<text x="388" y="304" font-size="13" font-weight="700" fill="#34c759">✓</text>
<text x="460" y="304" font-size="12" fill="#ff9f0a" font-family="ui-monospace, Menlo, monospace">dist/memo/index.d.ts</text>
<line x1="24" y1="318" x2="616" y2="318" stroke="#f2f2f7"/>

<text x="24" y="344" font-size="12" fill="#1d1d1f">Node (API 실행)</text>
<text x="196" y="344" font-size="12" fill="#6e6e73">node, import, default</text>
<text x="352" y="344" font-size="13" fill="#6e6e73">–</text>
<text x="388" y="344" font-size="13" fill="#6e6e73">–</text>
<text x="424" y="344" font-size="13" font-weight="700" fill="#34c759">✓</text>
<text x="460" y="344" font-size="12" fill="#ff9f0a" font-family="ui-monospace, Menlo, monospace">dist/memo/index.js</text>
<line x1="24" y1="358" x2="616" y2="358" stroke="#6e6e73"/>

<text x="24" y="384" font-size="12" fill="#6e6e73">– 는 그 조건을 모르는 도구가 건너뛴 키. source를 켜지 않은 쪽은 빌드 결과(dist)만 읽는다</text>
</svg>
