<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>서비스 계정 JWT의 구조와 토큰 교환</title>
  <rect width="640" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">서비스 계정 JWT의 세 부분과 접근 토큰 교환</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">serviceAccountAssertion이 만드는 문자열. 각 부분은 base64url로 인코딩해 점(.)으로 잇는다</text>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6e6e73"/></marker></defs>
  <!-- encoded bar -->
  <rect x="24" y="72" width="150" height="34" rx="6" fill="#eaf3ff" stroke="#0a84ff"/>
  <text x="99" y="94" font-size="12" fill="#0a84ff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">eyJhbGciOiJSUzI1…</text>
  <text x="182" y="95" font-size="16" font-weight="700" fill="#1d1d1f">.</text>
  <rect x="192" y="72" width="250" height="34" rx="6" fill="#fff6e8" stroke="#ff9f0a"/>
  <text x="317" y="94" font-size="12" fill="#c46f00" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">eyJpc3MiOiJtYWNmb2xpby1z…</text>
  <text x="450" y="95" font-size="16" font-weight="700" fill="#1d1d1f">.</text>
  <rect x="460" y="72" width="156" height="34" rx="6" fill="#eaf8ee" stroke="#34c759"/>
  <text x="538" y="94" font-size="12" fill="#1f8a3d" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">kQ3v9…(서명)</text>
  <!-- decoded -->
  <rect x="24" y="120" width="150" height="128" rx="8" fill="#f2f2f7"/>
  <text x="36" y="142" font-size="12" font-weight="700" fill="#0a84ff">헤더</text>
  <text x="36" y="164" font-size="12" fill="#1d1d1f">alg: RS256</text>
  <text x="36" y="184" font-size="12" fill="#1d1d1f">typ: JWT</text>
  <rect x="192" y="120" width="250" height="128" rx="8" fill="#f2f2f7"/>
  <text x="204" y="142" font-size="12" font-weight="700" fill="#c46f00">페이로드</text>
  <text x="204" y="162" font-size="12" fill="#1d1d1f">iss: 서비스 계정 이메일</text>
  <text x="204" y="180" font-size="12" fill="#1d1d1f">scope: …/auth/webmasters.readonly</text>
  <text x="204" y="198" font-size="12" fill="#1d1d1f">aud: oauth2.googleapis.com/token</text>
  <text x="204" y="216" font-size="12" fill="#1d1d1f">iat: 지금 (초)</text>
  <text x="204" y="234" font-size="12" fill="#1d1d1f">exp: iat + 3600</text>
  <rect x="460" y="120" width="156" height="128" rx="8" fill="#f2f2f7"/>
  <text x="472" y="142" font-size="12" font-weight="700" fill="#1f8a3d">서명</text>
  <text x="472" y="164" font-size="12" fill="#1d1d1f">RSA-SHA256(</text>
  <text x="472" y="182" font-size="12" fill="#1d1d1f">  개인 키,</text>
  <text x="472" y="200" font-size="12" fill="#1d1d1f">  헤더.페이로드)</text>
  <text x="472" y="230" font-size="12" fill="#6e6e73">공개 키로 검증</text>
  <!-- exchange -->
  <g font-size="12">
    <rect x="24" y="276" width="176" height="62" rx="8" fill="#ffffff" stroke="#1d1d1f"/>
    <text x="36" y="300" font-weight="600" fill="#1d1d1f">MacFolio API</text>
    <text x="36" y="320" fill="#6e6e73">6시간마다 실행</text>
    <rect x="232" y="276" width="176" height="62" rx="8" fill="#ffffff" stroke="#1d1d1f"/>
    <text x="244" y="300" font-weight="600" fill="#1d1d1f">Google 토큰 엔드포인트</text>
    <text x="244" y="320" fill="#6e6e73">서명·만료 시각 검증</text>
    <rect x="440" y="276" width="176" height="62" rx="8" fill="#ffffff" stroke="#1d1d1f"/>
    <text x="452" y="300" font-weight="600" fill="#1d1d1f">Search Console API</text>
    <text x="452" y="320" fill="#6e6e73">searchAnalytics/query</text>
  </g>
  <path d="M200 296 H226" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#h)"/>
  <path d="M232 318 H206" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#h)"/>
  <path d="M112 338 V414 H520 V344" stroke="#0a84ff" stroke-width="1.5" fill="none" marker-end="url(#h)"/>
  <text x="124" y="362" font-size="12" fill="#1d1d1f">① assertion=JWT, grant_type=…:jwt-bearer</text>
  <text x="124" y="382" font-size="12" fill="#0a84ff">② access_token (1시간 유효)</text>
  <text x="200" y="406" font-size="12" fill="#0a84ff">③ Authorization: Bearer &lt;access_token&gt;</text>
</svg>
