<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>홈 인디케이터 색을 정할 때 읽는 지점의 범위 전후</title>
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7fd6d0"/><stop offset="0.3" stop-color="#2b4a8b"/><stop offset="0.7" stop-color="#2b4a8b"/><stop offset="1" stop-color="#7fd6d0"/></linearGradient></defs>
<rect width="640" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="14" font-weight="700" fill="#1d1d1f">화면 아래 배경 (예시 색: 양 끝 청록 #7fd6d0, 가운데 남색 #2b4a8b)</text>
<text x="20" y="62" font-size="13" font-weight="700" fill="#ff3b30">수정 전: 터치 영역(화면 폭 전체)의 15·50·85% 지점</text>
<rect x="20" y="74" width="600" height="56" rx="6" fill="url(#g)"/>
<rect x="253" y="110" width="134" height="6" rx="3" fill="#1c1c1e"/>
<circle cx="110" cy="96" r="7" fill="none" stroke="#ff3b30" stroke-width="2.5"/>
<circle cx="320" cy="96" r="7" fill="none" stroke="#ff3b30" stroke-width="2.5"/>
<circle cx="530" cy="96" r="7" fill="none" stroke="#ff3b30" stroke-width="2.5"/>
<text x="20" y="152" font-size="12" fill="#1d1d1f">읽은 색: 청록, 남색, 청록</text>
<text x="20" y="172" font-size="12" fill="#1d1d1f">흰색과의 평균 대비 (1.69 + 8.55 + 1.69) ÷ 3 = 3.98, 가중치 1.3을 곱해 5.17</text>
<text x="20" y="192" font-size="12" fill="#1d1d1f">검은색과의 평균 대비 (10.07 + 1.99 + 10.07) ÷ 3 = 7.38</text>
<text x="20" y="212" font-size="12" fill="#ff3b30">검은색 선택: 남색 위에 검은 막대가 그려져 잘 보이지 않는다</text>
<text x="20" y="250" font-size="13" font-weight="700" fill="#34c759">수정 후: 보이는 막대(134px) 바로 아래만</text>
<rect x="20" y="262" width="600" height="56" rx="6" fill="url(#g)"/>
<rect x="253" y="298" width="134" height="6" rx="3" fill="#ffffff"/>
<line x1="253" y1="262" x2="253" y2="318" stroke="#ffffff" stroke-dasharray="3 3"/>
<line x1="387" y1="262" x2="387" y2="318" stroke="#ffffff" stroke-dasharray="3 3"/>
<circle cx="273" cy="284" r="7" fill="none" stroke="#34c759" stroke-width="2.5"/>
<circle cx="320" cy="284" r="7" fill="none" stroke="#34c759" stroke-width="2.5"/>
<circle cx="367" cy="284" r="7" fill="none" stroke="#34c759" stroke-width="2.5"/>
<text x="20" y="340" font-size="12" fill="#1d1d1f">읽은 색: 남색, 남색, 남색</text>
<text x="20" y="360" font-size="12" fill="#1d1d1f">흰색 8.55 × 1.3 = 11.1, 검은색 1.99</text>
<text x="20" y="380" font-size="12" fill="#34c759">흰색 선택: 남색 위에 흰 막대</text>
</svg>
