<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>desktop-core store와 React 구독, 음악 플레이어의 결과 값</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="290" fill="#ffffff"/>
<rect x="20" y="20" width="280" height="250" rx="12" fill="#f2f2f7"/>
<text x="36" y="44" font-size="13" font-weight="700" fill="#1d1d1f">desktop-core (React 없음)</text>
<rect x="36" y="58" width="248" height="88" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="50" y="80" font-size="12" font-weight="600" fill="#1d1d1f">창 store</text>
<text x="50" y="100" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">getState() → 창 상태</text>
<text x="50" y="118" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">subscribe(listener)</text>
<text x="50" y="136" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">open('memo') 등 동작</text>
<rect x="36" y="160" width="248" height="96" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="50" y="182" font-size="12" font-weight="600" fill="#1d1d1f">음악 플레이어 store</text>
<text x="50" y="202" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">next(): moved|stopped</text>
<text x="50" y="220" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">previous(초): moved|restart</text>
<text x="50" y="240" font-size="12" fill="#6e6e73">대기열·셔플·반복만 계산</text>
<rect x="400" y="20" width="220" height="250" rx="12" fill="#eef6ff"/>
<text x="416" y="44" font-size="13" font-weight="700" fill="#1d1d1f">apps/react</text>
<rect x="416" y="58" width="188" height="88" rx="8" fill="#ffffff" stroke="#0a84ff"/>
<text x="430" y="82" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">useSyncExternalStore(</text>
<text x="440" y="100" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">subscribe,</text>
<text x="440" y="118" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">getState)</text>
<text x="430" y="138" font-size="12" fill="#6e6e73">바뀌면 다시 렌더링</text>
<rect x="416" y="160" width="188" height="96" rx="8" fill="#ffffff" stroke="#0a84ff"/>
<text x="430" y="184" font-size="12" fill="#1d1d1f">결과에 따라 audio 제어</text>
<text x="430" y="206" font-size="12" fill="#6e6e73">'moved' → 새 곡 play()</text>
<text x="430" y="226" font-size="12" fill="#6e6e73">'stopped' → pause()</text>
<text x="430" y="246" font-size="12" fill="#6e6e73">'restart' → 처음부터</text>
<line x1="284" y1="92" x2="412" y2="92" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<text x="348" y="84" font-size="12" fill="#0a84ff" text-anchor="middle">변경 알림</text>
<line x1="412" y1="124" x2="288" y2="124" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="348" y="140" font-size="12" fill="#6e6e73" text-anchor="middle">동작 호출</text>
<line x1="284" y1="208" x2="412" y2="208" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<text x="348" y="200" font-size="12" fill="#0a84ff" text-anchor="middle">결과 값</text>
</svg>
