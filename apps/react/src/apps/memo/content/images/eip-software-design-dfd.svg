<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>자료 흐름도의 네 가지 구성 요소</title><rect width="640" height="350" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">수강 신청 시스템의 자료 흐름도(DFD)</text><rect x="20" y="120" width="100" height="50" rx="0" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><text x="70.0" y="149.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">학생</text><circle cx="270" cy="145" r="52" fill="#e8f2ff" stroke="#0a84ff" stroke-width="2"/><text x="270" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#0a84ff">1.0</text><text x="270" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">수강 신청</text><circle cx="470" cy="145" r="52" fill="#e8f2ff" stroke="#0a84ff" stroke-width="2"/><text x="470" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#0a84ff">2.0</text><text x="470" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">정원 확인</text><line x1="380" y1="250" x2="560" y2="250" stroke="#1d1d1f" stroke-width="1.5"/><line x1="380" y1="284" x2="560" y2="284" stroke="#1d1d1f" stroke-width="1.5"/><text x="470" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">강의 정보</text><line x1="160" y1="250" x2="320" y2="250" stroke="#1d1d1f" stroke-width="1.5"/><line x1="160" y1="284" x2="320" y2="284" stroke="#1d1d1f" stroke-width="1.5"/><text x="240" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">수강 내역</text><line x1="120" y1="138" x2="216" y2="138" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="168" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">신청 과목</text><line x1="218" y1="158" x2="122" y2="158" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="168" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">신청 결과</text><line x1="322" y1="138" x2="416" y2="138" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="370" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">과목 코드</text><line x1="418" y1="156" x2="324" y2="156" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="370" y="176" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">가능 여부</text><line x1="470" y1="248" x2="470" y2="199" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="478" y="226" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">정원·현원</text><line x1="262" y1="197" x2="248" y2="247" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="212" y="226" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">신청 기록</text><text x="30" y="322" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">사각형 = 단말(Terminator): 시스템 밖의 사람·조직</text><text x="330" y="322" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">원 = 프로세스(Process): 자료를 변환</text><text x="30" y="342" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">화살표 = 자료 흐름(Data Flow)</text><text x="330" y="342" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">평행선 = 자료 저장소(Data Store)</text></svg>
