<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">위조 RST 패킷으로 연결 끊기</text>
  <!-- A and B boxes -->
  <rect x="60" y="70" width="110" height="46" rx="6" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
  <text x="115" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">A</text>
  <text x="115" y="108" text-anchor="middle" font-size="11" fill="#6e6e73">10.0.2.18:46712</text>
  <rect x="470" y="70" width="110" height="46" rx="6" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
  <text x="525" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">B</text>
  <text x="525" y="108" text-anchor="middle" font-size="11" fill="#6e6e73">10.0.2.17:23</text>
  <!-- established connection -->
  <line x1="170" y1="93" x2="470" y2="93" stroke="#34c759" stroke-width="2.5"/>
  <text x="320" y="86" text-anchor="middle" font-size="12" fill="#34c759">수립된(ESTABLISHED) TCP 연결</text>
  <!-- attacker -->
  <rect x="265" y="190" width="110" height="46" rx="6" fill="#ff3b30" fill-opacity="0.1" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">공격자</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="#6e6e73">스니핑 후 스푸핑</text>
  <!-- spoofed RST arrow -->
  <line x1="320" y1="190" x2="460" y2="112" stroke="#ff3b30" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="410" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#ff3b30">위조 RST</text>
  <!-- fields -->
  <g font-size="11.5" fill="#1d1d1f">
    <text x="60" y="268">RST 패킷에 맞춰야 할 필드: 출발지 IP(A), 출발지 포트(46712), 목적지 IP(B), 목적지 포트(23),</text>
    <text x="60" y="286">시퀀스 번호(수신 창 RCV.NXT ~ RCV.NXT+RCV.WND−1 안)</text>
  </g>
  <defs><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ff3b30"/></marker></defs>
</svg>
