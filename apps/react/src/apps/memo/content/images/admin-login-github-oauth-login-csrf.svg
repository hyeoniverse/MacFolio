<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>공격자가 자기 code를 붙인 콜백 주소로 피해자 브라우저를 보낼 때, state 검사가 없으면 공격자 계정으로 로그인되고 state 검사가 있으면 400으로 끝나는 비교</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="420" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">login CSRF와 state 쿠키</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">공격자가 자기 계정의 code를 피해자 브라우저에 대신 제출하게 만드는 공격</text>

<g font-size="12" fill="#1d1d1f">
<rect x="24" y="72" width="592" height="44" rx="8" fill="#f2f2f7"/>
<text x="40" y="90">① 공격자가 자기 브라우저에서 로그인을 시작해 GitHub로 가고, 돌아오는 주소의</text>
<text x="40" y="107">code=ATTACKER_CODE를 콜백에 쓰기 전에 가로채 보관한다</text>
<line x1="320" y1="116" x2="320" y2="132" stroke="#6e6e73" marker-end="url(#a)"/>
<rect x="24" y="136" width="592" height="44" rx="8" fill="#f2f2f7"/>
<text x="40" y="154">② 피해자가 공격자 페이지를 열면, 그 페이지가 피해자 브라우저를 아래 주소로 보낸다</text>
<text x="40" y="171" font-family="ui-monospace, Menlo, monospace">/auth/github/callback?code=ATTACKER_CODE&amp;state=…</text>
</g>
<line x1="170" y1="180" x2="170" y2="204" stroke="#6e6e73" marker-end="url(#a)"/>
<line x1="470" y1="180" x2="470" y2="204" stroke="#6e6e73" marker-end="url(#a)"/>

<!-- 왼쪽 -->
<rect x="24" y="208" width="292" height="176" rx="10" fill="#ffebea" stroke="#ff3b30"/>
<text x="40" y="232" font-size="13" font-weight="700" fill="#ff3b30">state 검사가 없으면</text>
<g font-size="12" fill="#1d1d1f">
<text x="40" y="258">③ 서버가 code를 토큰으로 교환한다</text>
<text x="40" y="280">④ GitHub가 공격자 계정을 돌려준다</text>
<text x="40" y="302">⑤ 피해자 브라우저에 공격자 계정의</text>
<text x="56" y="320">세션 쿠키가 발급된다</text>
<text x="40" y="350" fill="#6e6e73">피해자가 그 뒤 입력하는 내용이</text>
<text x="40" y="368" fill="#6e6e73">공격자 계정에 저장된다</text>
</g>

<!-- 오른쪽 -->
<rect x="324" y="208" width="292" height="176" rx="10" fill="#e8f8ec" stroke="#34c759"/>
<text x="340" y="232" font-size="13" font-weight="700" fill="#248a3d">state 검사가 있으면 (MacFolio)</text>
<g font-size="12" fill="#1d1d1f">
<text x="340" y="258">③ 쿠키 macfolio_oauth_state와</text>
<text x="356" y="276">주소의 state를 safeEqual로 비교한다</text>
<text x="340" y="298">④ 피해자 브라우저는 로그인을 시작하지</text>
<text x="356" y="316">않았으므로 쿠키가 없거나 값이 다르다</text>
<text x="340" y="342" font-weight="600" fill="#248a3d">⑤ 400으로 끝난다. code는 교환하지</text>
<text x="356" y="360" font-weight="600" fill="#248a3d">않고 세션도 만들지 않는다</text>
</g>
<text x="24" y="406" font-size="12" fill="#6e6e73">state 쿠키는 10분(STATE_TTL_MS) 동안만 유지되고, 로그인을 시작한 브라우저에만 있다</text>
</svg>
