<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>페이지가 보내는 요청은 네트워크로 나가기 전에 page.route 처리기를 먼저 거친다. API 주소는 fakeApi의 state로 응답하고, GitHub 아바타 주소는 로컬 avatar.png로 응답하며, 패턴에 맞지 않는 요청은 그대로 실제 서버로 간다</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
</defs>
<rect width="640" height="340" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">page.route: 요청이 네트워크로 나가기 전에 가로챈다</text>
<rect x="24" y="56" width="168" height="252" rx="12" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="108" y="80" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">브라우저 페이지</text>
<rect x="40" y="96" width="136" height="44" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="108" y="115" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">fetch</text>
<text x="108" y="131" font-size="12" fill="#6e6e73" text-anchor="middle">api.test/auth/me</text>
<rect x="40" y="164" width="136" height="44" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="108" y="183" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&lt;img src&gt;</text>
<text x="108" y="199" font-size="12" fill="#6e6e73" text-anchor="middle">github.com/계정.png</text>
<rect x="40" y="232" width="136" height="44" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="108" y="251" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&lt;script src&gt;</text>
<text x="108" y="267" font-size="12" fill="#6e6e73" text-anchor="middle">/assets/index.js</text>
<rect x="232" y="56" width="168" height="252" rx="12" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="316" y="80" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">page.route 처리기</text>
<text x="316" y="99" font-size="12" fill="#6e6e73" text-anchor="middle">주소 패턴으로 분기</text>
<path d="M176 118 H230" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M176 186 H230" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M176 254 H230" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="316" y="122" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">route.fulfill()</text>
<text x="316" y="190" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">route.fulfill()</text>
<text x="316" y="258" font-size="12" fill="#6e6e73" text-anchor="middle">맞는 패턴 없음</text>
<rect x="440" y="96" width="176" height="44" rx="8" fill="#0a84ff" fill-opacity="0.1" stroke="#0a84ff"/>
<text x="528" y="115" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">fakeApi의 state로 응답</text>
<text x="528" y="131" font-size="12" fill="#6e6e73" text-anchor="middle">{ login: 'hyeoniverse' }</text>
<rect x="440" y="164" width="176" height="44" rx="8" fill="#0a84ff" fill-opacity="0.1" stroke="#0a84ff"/>
<text x="528" y="183" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">로컬 avatar.png로 응답</text>
<text x="528" y="199" font-size="12" fill="#6e6e73" text-anchor="middle">외부 요청 없음</text>
<rect x="440" y="232" width="176" height="44" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="528" y="251" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">실제 서버로 전송</text>
<text x="528" y="267" font-size="12" fill="#6e6e73" text-anchor="middle">vite preview의 빌드 파일</text>
<path d="M400 118 H438" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<path d="M400 186 H438" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<path d="M400 254 H438" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#g)"/>
<text x="24" y="330" font-size="12" fill="#6e6e73">파란 경로는 응답을 시험 코드가 만든다. 서버가 없어도 화면은 로그인한 관리자 상태로 그려진다</text>
</svg>
