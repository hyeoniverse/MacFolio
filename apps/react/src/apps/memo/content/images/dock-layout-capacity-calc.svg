<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>900px 화면에서 Dock 앱 칸 수를 계산하는 순서</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="320" y="30" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">900px 화면의 dockAppCapacity 계산</text>

  <!-- 화면 폭 막대 -->
  <rect x="20" y="52" width="600" height="56" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="320" y="46" font-size="12" fill="#6e6e73" text-anchor="middle">화면 폭 900px</text>
  <!-- margin -->
  <rect x="20" y="52" width="21" height="56" fill="#ff9f0a" fill-opacity="0.35"/>
  <rect x="599" y="52" width="21" height="56" fill="#ff9f0a" fill-opacity="0.35"/>
  <!-- dock -->
  <rect x="41" y="60" width="558" height="40" rx="10" fill="#ffffff" stroke="#0a84ff"/>
  <rect x="41" y="60" width="21" height="40" fill="#34c759" fill-opacity="0.3"/>
  <rect x="578" y="60" width="21" height="40" fill="#34c759" fill-opacity="0.3"/>
  <!-- slots: inner 836 => scale 0.667 ; slot 80 => 53.3 -->
  <g fill="#0a84ff" fill-opacity="0.75">
    <rect x="66" y="66" width="43" height="28" rx="6"/>
    <rect x="119" y="66" width="43" height="28" rx="6"/>
    <rect x="173" y="66" width="43" height="28" rx="6"/>
    <rect x="226" y="66" width="43" height="28" rx="6"/>
    <rect x="279" y="66" width="43" height="28" rx="6"/>
    <rect x="333" y="66" width="43" height="28" rx="6"/>
    <rect x="386" y="66" width="43" height="28" rx="6"/>
    <rect x="439" y="66" width="43" height="28" rx="6"/>
  </g>
  <rect x="493" y="66" width="43" height="28" rx="6" fill="#6e6e73" fill-opacity="0.6"/>
  <rect x="541" y="64" width="2" height="32" fill="#1d1d1f"/>
  <rect x="548" y="66" width="28" height="28" rx="6" fill="#6e6e73" fill-opacity="0.6"/>
  <text x="514" y="85" font-size="12" fill="#ffffff" text-anchor="middle">LP</text>

  <text x="30" y="128" font-size="12" fill="#ff9f0a">여백 16</text>
  <text x="52" y="144" font-size="12" fill="#34c759">안쪽 16</text>
  <text x="270" y="128" font-size="12" fill="#0a84ff" text-anchor="middle">앱 칸 8개 (아이콘 64 + 간격 16 = 80)</text>
  <text x="560" y="128" font-size="12" fill="#6e6e73" text-anchor="middle">Launchpad · 구분선 · 휴지통</text>

  <!-- 계산 단계 -->
  <g font-size="13" fill="#1d1d1f">
    <rect x="20" y="164" width="600" height="148" rx="10" fill="#f2f2f7"/>
    <text x="36" y="190">① 한 칸 = 아이콘 64 + 간격 16 = <tspan font-weight="700">80px</tspan></text>
    <text x="36" y="216">② 안쪽 폭 = 900 − 2×16(여백) − 2×16(안쪽 여백) = <tspan font-weight="700">836px</tspan></text>
    <text x="36" y="242">③ 들어가는 칸 = ⌊(836 − 구분선 2) ÷ 80⌋ = ⌊10.4⌋ = <tspan font-weight="700">10칸</tspan></text>
    <text x="36" y="268">④ 앱 칸 = 10 − 2(Launchpad, 휴지통) = <tspan font-weight="700" fill="#0a84ff">8칸</tspan></text>
    <text x="36" y="294" fill="#6e6e73" font-size="12">같은 값(64·16·16·2)을 CSS 변수로 넘겨 Dock.css도 이 치수로 그린다</text>
  </g>
</svg>
