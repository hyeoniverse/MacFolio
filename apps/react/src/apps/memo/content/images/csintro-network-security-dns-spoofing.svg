<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>클라이언트의 DNS 질의에 공격자의 위조 응답이 정상 응답보다 먼저 도착하는 과정</title>
<defs><marker id="a0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="aff3b30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker><marker id="a6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="370" fill="#fff"/>
<text x="320" y="30" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600">DNS 스푸핑: 먼저 도착한 응답이 이긴다</text>
<rect x="15" y="50" width="150" height="34" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="90.0" y="71.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">클라이언트</text>
<line x1="90" y1="86" x2="90" y2="315" stroke="#c7c7cc" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="245" y="50" width="150" height="34" rx="8" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="320.0" y="71.5" font-size="13" fill="#ff3b30" text-anchor="middle" font-weight="600">공격자 (같은 LAN)</text>
<line x1="320" y1="86" x2="320" y2="315" stroke="#c7c7cc" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="475" y="50" width="150" height="34" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="550.0" y="71.5" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">DNS 서버</text>
<line x1="550" y1="86" x2="550" y2="315" stroke="#c7c7cc" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="92" y1="115" x2="546" y2="135" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#a0a84ff)"/>
<text x="300" y="113" font-size="12" fill="#0a84ff" text-anchor="middle">① 질의: www.bank.example의 A 레코드?</text>
<path d="M320 125 L320 150" fill="none" stroke="#ff9f0a" stroke-width="1.6"/>
<text x="330" y="150" font-size="12" fill="#ff9f0a" text-anchor="start">질의를 엿봄 (ARP 스푸핑으로 경유)</text>
<line x1="318" y1="185" x2="94" y2="205" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#aff3b30)"/>
<text x="205" y="182" font-size="12" fill="#ff3b30" text-anchor="middle">② 위조 응답: 203.0.113.66</text>
<text x="30" y="235" font-size="12" fill="#ff3b30" text-anchor="start">트랜잭션 ID·포트 일치</text>
<line x1="548" y1="245" x2="94" y2="285" stroke="#6e6e73" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a6e6e73)"/>
<text x="330" y="255" font-size="12" fill="#6e6e73" text-anchor="middle">③ 정상 응답: 198.51.100.10</text>
<text x="110" y="300" font-size="12" fill="#6e6e73" text-anchor="start">이미 응답을 받았으므로 버림</text>
<text x="320" y="350" font-size="12" fill="#6e6e73" text-anchor="middle">클라이언트는 가장 먼저 도착한, ID가 맞는 응답을 채택하고 203.0.113.66(공격자 서버)에 접속한다</text>
</svg>
