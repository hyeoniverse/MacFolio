<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="250" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">RCNN의 처리 흐름</text>
  <!-- 1 input -->
  <rect x="20" y="64" width="100" height="110" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="70" y="114" text-anchor="middle" font-size="12" fill="#6e6e73">영상</text>
  <text x="70" y="130" text-anchor="middle" font-size="11" fill="#6e6e73">(말 탄 사람)</text>
  <!-- 2 proposals -->
  <rect x="146" y="64" width="100" height="110" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
  <g fill="none" stroke="#ffcc00" stroke-width="2.5">
    <rect x="166" y="70" width="48" height="56"/>
    <rect x="150" y="90" width="26" height="76"/>
    <rect x="168" y="112" width="58" height="56"/>
    <rect x="220" y="146" width="20" height="18"/>
  </g>
  <line x1="128" y1="119" x2="140" y2="119" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- warped region -->
  <g stroke-dasharray="6 4" stroke-width="1.8" marker-end="url(#g)">
    <line x1="214" y1="94" x2="276" y2="108" stroke="#1d1d1f"/>
    <line x1="226" y1="136" x2="276" y2="124" stroke="#8e8e93"/>
    <line x1="240" y1="156" x2="276" y2="136" stroke="#8e8e93"/>
  </g>
  <rect x="280" y="98" width="44" height="44" fill="#f2f2f7" stroke="#ffcc00" stroke-width="2.5"/>
  <text x="302" y="76" text-anchor="middle" font-size="11" fill="#1d1d1f">변형한 영역</text>
  <text x="302" y="90" text-anchor="middle" font-size="10.5" fill="#6e6e73">(227×227)</text>
  <!-- CNN -->
  <rect x="336" y="76" width="108" height="92" fill="none" stroke="#6e6e73" stroke-dasharray="4 3"/>
  <g fill="#fff" stroke="#1d1d1f">
    <rect x="344" y="88" width="34" height="58"/>
    <rect x="352" y="94" width="34" height="58"/>
    <rect x="392" y="102" width="18" height="30"/>
    <rect x="398" y="106" width="18" height="30"/>
    <path d="M422,104 l8,-6 v40 l-8,6 z"/>
    <path d="M432,104 l8,-6 v40 l-8,6 z"/>
  </g>
  <text x="390" y="162" text-anchor="middle" font-size="11" fill="#6e6e73">CNN</text>
  <line x1="326" y1="120" x2="338" y2="120" stroke="#1d1d1f" stroke-width="1.5"/>
  <!-- classify -->
  <g stroke="#1d1d1f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)">
    <line x1="446" y1="114" x2="490" y2="66"/>
    <line x1="446" y1="120" x2="490" y2="120"/>
    <line x1="446" y1="126" x2="490" y2="174"/>
  </g>
  <g font-size="11.5" fill="#1d1d1f">
    <rect x="494" y="52" width="130" height="26" fill="#fff" stroke="#1d1d1f"/>
    <text x="502" y="70">비행기? 아니오</text>
    <text x="559" y="96" text-anchor="middle">⋮</text>
    <rect x="494" y="107" width="130" height="26" fill="#e5f0ff" stroke="#0a84ff"/>
    <text x="502" y="125" fill="#0a84ff" font-weight="600">사람? 예</text>
    <text x="559" y="151" text-anchor="middle">⋮</text>
    <rect x="494" y="161" width="130" height="26" fill="#fff" stroke="#1d1d1f"/>
    <text x="502" y="179">TV 모니터? 아니오</text>
  </g>
  <!-- step labels -->
  <g font-size="12.5" fill="#1d1d1f" text-anchor="middle">
    <text x="70" y="214"><tspan font-weight="700">1.</tspan> 입력 영상</text>
    <text x="196" y="214"><tspan font-weight="700">2.</tspan> 영역 제안 추출</text>
    <text x="196" y="232" fill="#6e6e73" font-size="11.5">(약 2000개)</text>
    <text x="364" y="214"><tspan font-weight="700">3.</tspan> CNN 특징 계산</text>
    <text x="559" y="214"><tspan font-weight="700">4.</tspan> 영역 분류</text>
  </g>
</svg>
