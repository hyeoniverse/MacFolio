<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="560" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">같은 PR(커밋 A·B·C)을 세 방식으로 병합했을 때 main의 기록</text>
  <!-- 공통: 병합 전 -->
  <text x="20" y="60" font-size="12" font-weight="600" fill="#6b7280">병합 전</text>
  <line x1="60" y1="90" x2="300" y2="90" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="80" cy="90" r="7" fill="#9ca3af"/><text x="80" y="112" text-anchor="middle" font-size="11" fill="#374151">M1</text>
  <circle cx="160" cy="90" r="7" fill="#9ca3af"/><text x="160" y="112" text-anchor="middle" font-size="11" fill="#374151">M2</text>
  <text x="310" y="94" font-size="11" fill="#6b7280">main</text>
  <path d="M160 90 L200 60" stroke="#4f46e5" stroke-width="2" fill="none"/>
  <line x1="200" y1="60" x2="340" y2="60" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="220" cy="60" r="7" fill="#4f46e5"/><text x="220" y="48" text-anchor="middle" font-size="11" fill="#4f46e5">A</text>
  <circle cx="270" cy="60" r="7" fill="#4f46e5"/><text x="270" y="48" text-anchor="middle" font-size="11" fill="#4f46e5">B</text>
  <circle cx="320" cy="60" r="7" fill="#4f46e5"/><text x="320" y="48" text-anchor="middle" font-size="11" fill="#4f46e5">C</text>
  <text x="350" y="64" font-size="11" fill="#4f46e5">feature 브랜치 (PR)</text>
  <!-- 1. merge commit -->
  <rect x="20" y="130" width="600" height="125" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="32" y="152" font-size="13" font-weight="600" fill="#4f46e5">1. Create a merge commit</text>
  <text x="32" y="170" font-size="11" fill="#374151">A·B·C는 SHA 그대로, 머지 커밋 M3가 두 부모(M2·C)를 가진다. 기록이 갈라졌다 합쳐진다</text>
  <line x1="60" y1="225" x2="560" y2="225" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="80" cy="225" r="7" fill="#9ca3af"/><text x="80" y="246" text-anchor="middle" font-size="11" fill="#374151">M1</text>
  <circle cx="160" cy="225" r="7" fill="#9ca3af"/><text x="160" y="246" text-anchor="middle" font-size="11" fill="#374151">M2</text>
  <path d="M160 225 L200 195" stroke="#4f46e5" stroke-width="2" fill="none"/>
  <line x1="200" y1="195" x2="340" y2="195" stroke="#4f46e5" stroke-width="2"/>
  <path d="M340 195 L400 225" stroke="#4f46e5" stroke-width="2" fill="none"/>
  <circle cx="220" cy="195" r="7" fill="#4f46e5"/><text x="220" y="184" text-anchor="middle" font-size="11" fill="#4f46e5">A</text>
  <circle cx="270" cy="195" r="7" fill="#4f46e5"/><text x="270" y="184" text-anchor="middle" font-size="11" fill="#4f46e5">B</text>
  <circle cx="320" cy="195" r="7" fill="#4f46e5"/><text x="320" y="184" text-anchor="middle" font-size="11" fill="#4f46e5">C</text>
  <circle cx="400" cy="225" r="8" fill="#1f2937"/><text x="400" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">M3 (머지 커밋)</text>
  <!-- 2. squash -->
  <rect x="20" y="270" width="600" height="125" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="32" y="292" font-size="13" font-weight="600" fill="#1f2937">2. Squash and merge</text>
  <text x="32" y="310" font-size="11" fill="#374151">A·B·C의 변경을 합친 새 커밋 S 하나만 main에 생긴다. A·B·C는 main 기록에 없다</text>
  <line x1="60" y1="365" x2="560" y2="365" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="80" cy="365" r="7" fill="#9ca3af"/><text x="80" y="386" text-anchor="middle" font-size="11" fill="#374151">M1</text>
  <circle cx="160" cy="365" r="7" fill="#9ca3af"/><text x="160" y="386" text-anchor="middle" font-size="11" fill="#374151">M2</text>
  <circle cx="240" cy="365" r="8" fill="#4f46e5"/><text x="240" y="386" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">S = A+B+C</text>
  <g opacity="0.35">
    <circle cx="220" cy="335" r="6" fill="#4f46e5"/><circle cx="270" cy="335" r="6" fill="#4f46e5"/><circle cx="320" cy="335" r="6" fill="#4f46e5"/>
    <text x="360" y="339" font-size="11" fill="#4f46e5">A·B·C (브랜치에만 남고, 브랜치를 지우면 사라진다)</text>
  </g>
  <!-- 3. rebase -->
  <rect x="20" y="410" width="600" height="125" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="32" y="432" font-size="13" font-weight="600" fill="#ef4444">3. Rebase and merge</text>
  <text x="32" y="450" font-size="11" fill="#374151">A·B·C를 M2 뒤에 하나씩 다시 만들어 붙인다. 내용은 같지만 SHA가 A'·B'·C'로 바뀌고 머지 커밋은 없다</text>
  <line x1="60" y1="505" x2="560" y2="505" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="80" cy="505" r="7" fill="#9ca3af"/><text x="80" y="526" text-anchor="middle" font-size="11" fill="#374151">M1</text>
  <circle cx="160" cy="505" r="7" fill="#9ca3af"/><text x="160" y="526" text-anchor="middle" font-size="11" fill="#374151">M2</text>
  <circle cx="240" cy="505" r="7" fill="#ef4444"/><text x="240" y="526" text-anchor="middle" font-size="11" fill="#ef4444">A'</text>
  <circle cx="300" cy="505" r="7" fill="#ef4444"/><text x="300" y="526" text-anchor="middle" font-size="11" fill="#ef4444">B'</text>
  <circle cx="360" cy="505" r="7" fill="#ef4444"/><text x="360" y="526" text-anchor="middle" font-size="11" fill="#ef4444">C'</text>
  <text x="390" y="526" font-size="11" fill="#6b7280">A·B·C와 내용은 같고 SHA만 다른 새 커밋</text>
</svg>
