<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<title>정의되지 않은 CSS 변수를 참조하면 오류 없이 속성의 초기값이 적용되어 모서리 반경이 0이 되는 과정</title>
<rect width="640" height="280" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">이름이 바뀐 토큰을 참조하면</text>
<text x="20" y="50" font-size="12" fill="#6e6e73">브라우저는 오류를 내지 않고, 빌드와 타입 검사도 통과한다</text>
<rect x="20" y="66" width="190" height="92" rx="10" fill="#f2f2f7"/>
<text x="34" y="90" font-size="12" fill="#6e6e73">정의 (이름 변경 뒤)</text>
<text x="34" y="116" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">--radius-xs</text>
<text x="34" y="136" font-size="12" fill="#6e6e73">→ 다른 이름으로 바뀜</text>
<rect x="225" y="66" width="190" height="92" rx="10" fill="#f2f2f7"/>
<text x="239" y="90" font-size="12" fill="#6e6e73">사용처 (같은 날 다른 작업)</text>
<text x="239" y="116" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">border-radius:</text>
<text x="239" y="136" font-size="12" fill="#ff3b30" font-family="ui-monospace, Menlo, monospace">  var(--radius-xs)</text>
<rect x="430" y="66" width="190" height="92" rx="10" fill="#f2f2f7"/>
<text x="444" y="90" font-size="12" fill="#6e6e73">계산된 값</text>
<text x="444" y="116" font-size="12" fill="#1d1d1f">참조 실패 → 초기값</text>
<text x="444" y="136" font-size="12" fill="#ff3b30" font-family="ui-monospace, Menlo, monospace">border-radius: 0</text>
<line x1="210" y1="112" x2="222" y2="112" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<line x1="415" y1="112" x2="427" y2="112" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="190" font-size="13" font-weight="700" fill="#1d1d1f">화면에서 보이는 결과</text>
<rect x="40" y="206" width="160" height="56" rx="12" fill="#ffffff" stroke="#34c759" stroke-width="2"/>
<text x="120" y="239" font-size="12" fill="#1d1d1f" text-anchor="middle">의도한 둥근 모서리</text>
<rect x="240" y="206" width="160" height="56" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
<text x="320" y="239" font-size="12" fill="#1d1d1f" text-anchor="middle">실제: 각진 모서리</text>
<text x="420" y="226" font-size="12" fill="#6e6e73">대체값을 적으면</text>
<text x="420" y="246" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">var(--x, 4px)</text>
<text x="420" y="264" font-size="12" fill="#6e6e73">처럼 4px가 쓰인다</text>
</svg>
