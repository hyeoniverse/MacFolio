<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="470" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">위조 DNS 응답의 IP·UDP·DNS 헤더 (32비트 폭)</text>
  <g stroke="#1d1d1f" stroke-width="1" font-size="12.5" text-anchor="middle">
    <!-- IP -->
    <rect x="40" y="44" width="60" height="34" fill="#fff"/><rect x="100" y="44" width="60" height="34" fill="#fff"/><rect x="160" y="44" width="120" height="34" fill="#fff"/><rect x="280" y="44" width="240" height="34" fill="#fff"/>
    <rect x="40" y="78" width="240" height="34" fill="#fff"/><rect x="280" y="78" width="60" height="34" fill="#fff"/><rect x="340" y="78" width="180" height="34" fill="#fff"/>
    <rect x="40" y="112" width="120" height="34" fill="#fff"/><rect x="160" y="112" width="120" height="34" fill="#fff"/><rect x="280" y="112" width="240" height="34" fill="#fff"/>
    <rect x="40" y="146" width="480" height="34" fill="#0a84ff"/>
    <rect x="40" y="180" width="480" height="34" fill="#0a84ff"/>
    <!-- UDP -->
    <rect x="40" y="222" width="240" height="34" fill="#0a84ff"/><rect x="280" y="222" width="240" height="34" fill="#0a84ff"/>
    <rect x="40" y="256" width="240" height="34" fill="#fff"/><rect x="280" y="256" width="240" height="34" fill="#fff"/>
    <!-- DNS -->
    <rect x="40" y="298" width="240" height="34" fill="#0a84ff"/><rect x="280" y="298" width="240" height="34" fill="#e8f2ff"/>
    <rect x="40" y="332" width="240" height="34" fill="#fff"/><rect x="280" y="332" width="240" height="34" fill="#fff"/>
    <rect x="40" y="366" width="240" height="34" fill="#fff"/><rect x="280" y="366" width="240" height="34" fill="#fff"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#1d1d1f">
    <text x="70" y="66">버전</text><text x="130" y="66">헤더 길이</text><text x="220" y="66">서비스 유형</text><text x="400" y="66">전체 길이</text>
    <text x="160" y="100">식별자</text><text x="310" y="100">플래그</text><text x="430" y="100">조각 오프셋</text>
    <text x="100" y="134">TTL</text><text x="220" y="134">프로토콜 = 17(UDP)</text><text x="400" y="134">헤더 체크섬</text>
    <text x="160" y="278">UDP 길이</text><text x="400" y="278">UDP 체크섬</text>
    <text x="400" y="320">플래그 0x8400 (QR=1, AA=1)</text>
    <text x="160" y="354">질문 수 1</text><text x="400" y="354">답 수 1</text>
    <text x="160" y="388">권한 레코드 수 1</text><text x="400" y="388">추가 레코드 수 0</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#fff" font-weight="600">
    <text x="280" y="168">출발지 IP = 권한 서버 주소</text>
    <text x="280" y="202">목적지 IP = 리졸버 주소</text>
    <text x="160" y="244">출발지 포트 = 53</text>
    <text x="400" y="244">목적지 포트 = 질의의 출발지 포트</text>
    <text x="160" y="320">트랜잭션 ID</text>
  </g>
  <!-- 묶음 표시 -->
  <g stroke="#6e6e73" stroke-width="1.2" fill="none">
    <path d="M528 46 h8 v168 h-8"/><path d="M528 224 h8 v64 h-8"/><path d="M528 300 h8 v98 h-8"/>
  </g>
  <g font-size="12.5" fill="#1d1d1f">
    <text x="544" y="134">IP 헤더</text><text x="544" y="148" font-size="11" fill="#6e6e73">20바이트</text>
    <text x="544" y="254">UDP 헤더</text><text x="544" y="268" font-size="11" fill="#6e6e73">8바이트</text>
    <text x="544" y="348">DNS 헤더</text><text x="544" y="362" font-size="11" fill="#6e6e73">12바이트</text>
  </g>
  <text x="40" y="420" font-size="12" fill="#1d1d1f">뒤에 Question, Answer, Authority, Additional 섹션이 이어진다.</text>
  <rect x="40" y="436" width="14" height="14" fill="#0a84ff"/>
  <text x="62" y="448" font-size="12" fill="#6e6e73">리졸버가 질의와 대조하는 필드. 원격 공격자가 모르는 값은 목적지 포트와 트랜잭션 ID</text>
</svg>
