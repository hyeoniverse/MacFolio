<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>주소 한 줄을 임베드로 그릴지 정하는 순서</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">문단 하나를 임베드로 그릴지 정하는 순서</text>
<g font-size="13">
<rect x="20" y="48" width="400" height="44" rx="8" fill="#f2f2f7"/>
<text x="36" y="75" fill="#1d1d1f">① 문단에 링크 하나만 있고, 링크 글자가 주소 그대로인가</text>
<rect x="20" y="114" width="400" height="44" rx="8" fill="#f2f2f7"/>
<text x="36" y="141" fill="#1d1d1f">② https이고, 호스트가 지원하는 21곳 중 하나인가</text>
<rect x="20" y="180" width="400" height="44" rx="8" fill="#f2f2f7"/>
<text x="36" y="207" fill="#1d1d1f">③ 주소에서 뽑은 ID가 [\w-]만으로 되어 있는가</text>
<rect x="20" y="246" width="400" height="44" rx="8" fill="#e8f2ff" stroke="#0a84ff"/>
<text x="36" y="273" fill="#0a84ff" font-weight="700">④ ID로 iframe 주소를 새로 만들어 임베드</text>
<line x1="220" y1="92" x2="220" y2="112" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="220" y1="158" x2="220" y2="178" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="220" y1="224" x2="220" y2="244" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="228" y="106" font-size="12" fill="#6e6e73">예</text><text x="228" y="172" font-size="12" fill="#6e6e73">예</text><text x="228" y="238" font-size="12" fill="#6e6e73">예</text>
<rect x="470" y="114" width="150" height="44" rx="8" fill="#ffffff" stroke="#ff9f0a"/>
<text x="545" y="141" text-anchor="middle" fill="#1d1d1f">보통 링크로 그린다</text>
<path d="M420 70 H545 V112" fill="none" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="420" y1="136" x2="468" y2="136" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M420 202 H545 V160" fill="none" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440" y="64" font-size="12" fill="#ff9f0a">아니오</text>
<text x="428" y="130" font-size="12" fill="#ff9f0a">아니오</text>
<text x="440" y="196" font-size="12" fill="#ff9f0a">아니오</text>
</g>
<text x="20" y="324" font-size="14" font-weight="700" fill="#1d1d1f">예: YouTube 공유 주소</text>
<g font-size="12" font-family="SFMono-Regular, Menlo, monospace">
<text x="20" y="350" fill="#1d1d1f">https://www.youtube.com/watch?v=nYkdrAPrdcw</text>
<text x="20" y="372" fill="#6e6e73">→ ID nYkdrAPrdcw</text>
<text x="20" y="394" fill="#0a84ff">→ https://www.youtube-nocookie.com/embed/nYkdrAPrdcw</text>
</g>
</svg>
