<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
	<rect width="640" height="330" fill="#ffffff" />
	<defs>
		<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10z" fill="#1d1d1f" />
		</marker>
		<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10z" fill="#0a84ff" />
		</marker>
	</defs>
	<text x="20" y="30" font-size="15" font-weight="600" fill="#1d1d1f">seq2seq: 마지막 은닉 상태 하나가 문맥 벡터</text>
	<g font-size="13" fill="#1d1d1f" text-anchor="middle">
		<circle cx="60" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="60" y="85">h1</text>
		<circle cx="120" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="120" y="85">h2</text>
		<circle cx="180" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="180" y="85">h3</text>
		<circle cx="240" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="240" y="85">h4</text>
		<circle cx="300" cy="80" r="18" fill="#ffffff" stroke="#0a84ff" stroke-width="2" /><text x="300" y="85" fill="#0a84ff">h5</text>
	</g>
	<g stroke="#6e6e73">
		<line x1="78" y1="80" x2="100" y2="80" marker-end="url(#a)" />
		<line x1="138" y1="80" x2="160" y2="80" marker-end="url(#a)" />
		<line x1="198" y1="80" x2="220" y2="80" marker-end="url(#a)" />
		<line x1="258" y1="80" x2="280" y2="80" marker-end="url(#a)" />
	</g>
	<line x1="318" y1="80" x2="388" y2="80" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)" />
	<text x="353" y="70" font-size="11" fill="#0a84ff" text-anchor="middle">고정</text>
	<g font-size="13" fill="#1d1d1f" text-anchor="middle">
		<circle cx="410" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="410" y="85">g1</text>
		<circle cx="470" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="470" y="85">g2</text>
		<circle cx="530" cy="80" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="530" y="85">g3</text>
		<text x="590" y="85" fill="#6e6e73">…</text>
	</g>
	<g stroke="#6e6e73">
		<line x1="428" y1="80" x2="450" y2="80" marker-end="url(#a)" />
		<line x1="488" y1="80" x2="510" y2="80" marker-end="url(#a)" />
		<line x1="548" y1="80" x2="575" y2="80" marker-end="url(#a)" />
	</g>
	<text x="320" y="128" font-size="12" fill="#6e6e73" text-anchor="middle">문장이 길어도 h5 하나에 모든 정보를 압축해야 한다</text>
	<line x1="20" y1="150" x2="620" y2="150" stroke="#d2d2d7" />
	<text x="20" y="180" font-size="15" font-weight="600" fill="#1d1d1f">seq2seq + 어텐션: 시점마다 새 문맥 벡터</text>
	<g font-size="13" fill="#1d1d1f" text-anchor="middle">
		<circle cx="60" cy="280" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="60" y="285">h1</text>
		<circle cx="120" cy="280" r="18" fill="#ffffff" stroke="#0a84ff" stroke-width="2" /><text x="120" y="285" fill="#0a84ff">h2</text>
		<circle cx="180" cy="280" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="180" y="285">h3</text>
		<circle cx="240" cy="280" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="240" y="285">h4</text>
		<circle cx="300" cy="280" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="300" y="285">h5</text>
	</g>
	<circle cx="180" cy="210" r="14" fill="#ffffff" stroke="#1d1d1f" />
	<text x="180" y="215" font-size="14" fill="#1d1d1f" text-anchor="middle">Σ</text>
	<g stroke="#6e6e73">
		<line x1="66" y1="263" x2="168" y2="218" />
		<line x1="126" y1="263" x2="172" y2="221" stroke="#0a84ff" stroke-width="3" />
		<line x1="180" y1="262" x2="180" y2="224" />
		<line x1="234" y1="263" x2="188" y2="221" />
		<line x1="294" y1="263" x2="192" y2="218" />
	</g>
	<text x="92" y="238" font-size="11" fill="#6e6e73">a1</text>
	<text x="152" y="258" font-size="11" fill="#0a84ff">a2</text>
	<text x="252" y="238" font-size="11" fill="#6e6e73">a5</text>
	<line x1="194" y1="210" x2="452" y2="210" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)" />
	<text x="320" y="202" font-size="12" fill="#0a84ff" text-anchor="middle">문맥 벡터 c = Σ a·h</text>
	<g font-size="13" fill="#1d1d1f" text-anchor="middle">
		<circle cx="410" cy="280" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="410" y="285">g5</text>
		<circle cx="470" cy="280" r="18" fill="#f5f5f7" stroke="#6e6e73" /><text x="470" y="285">g6</text>
	</g>
	<line x1="428" y1="280" x2="450" y2="280" stroke="#6e6e73" marker-end="url(#a)" />
	<line x1="470" y1="214" x2="470" y2="260" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)" />
	<text x="628" y="250" font-size="12" fill="#6e6e73" text-anchor="end">query g5와 key h1~h5의</text>
	<text x="628" y="266" font-size="12" fill="#6e6e73" text-anchor="end">유사도로 가중치 a를 구한다</text>
	<text x="520" y="300" font-size="12" fill="#1d1d1f">g6가 'itself' 생성</text>
</svg>
