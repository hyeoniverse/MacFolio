<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>pageerror fixture</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="380" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="700">자동 fixture가 모든 시험을 감싸 처리되지 않은 에러를 실패로 바꾼다</text>
<text x="20" y="50" font-size="12" fill="#6e6e73" text-anchor="start">{ auto: true }인 fixture는 시험이 요청하지 않아도 시험마다 실행된다</text>
<text x="130" y="82" font-size="13" fill="#0a84ff" text-anchor="middle" font-weight="700">pageErrors fixture</text>
<text x="470" y="82" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">시험 본문</text>
<line x1="130" y1="92" x2="130" y2="340" stroke="#0a84ff" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="470" y1="92" x2="470" y2="340" stroke="#c7c7cc" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="20.0" y="100" width="220" height="44" rx="6" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.4"/>
<text x="130" y="119" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">page.on('pageerror', push)</text>
<text x="130" y="136" font-size="12" fill="#6e6e73" text-anchor="middle">에러를 errors 배열에 모은다</text>
<line x1="240" y1="122" x2="360" y2="122" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="300" y="114" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">use(errors)</text>
<rect x="360.0" y="100" width="220" height="30" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.4"/>
<text x="470" y="119" font-size="12" fill="#1d1d1f" text-anchor="middle">Dock에서 Music 열기·닫기</text>
<rect x="360.0" y="150" width="220" height="44" rx="6" fill="#ffe5e3" stroke="#ff3b30" stroke-width="1.4"/>
<text x="470" y="169" font-size="12" fill="#1d1d1f" text-anchor="middle">처리되지 않은 에러</text>
<text x="470" y="186" font-size="12" fill="#6e6e73" text-anchor="middle">예: hook 개수 불일치</text>
<line x1="358" y1="172" x2="244" y2="172" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="300" y="164" font-size="12" fill="#ff3b30" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">pageerror</text>
<rect x="20.0" y="156" width="220" height="30" rx="6" fill="#ffe5e3" stroke="#ff3b30" stroke-width="1.4"/>
<text x="130" y="175" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">errors = [Error]</text>
<rect x="360.0" y="214" width="220" height="44" rx="6" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.4"/>
<text x="470" y="233" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">expect(...) 확인</text>
<text x="470" y="250" font-size="12" fill="#6e6e73" text-anchor="middle">화면만 보는 확인은 통과할 수도 있다</text>
<line x1="360" y1="276" x2="244" y2="276" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="300" y="268" font-size="12" fill="#6e6e73" text-anchor="middle">본문 종료</text>
<rect x="20.0" y="260" width="220" height="44" rx="6" fill="#ffe5e3" stroke="#ff3b30" stroke-width="1.4"/>
<text x="130" y="279" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">expect(errors).toEqual([])</text>
<text x="130" y="296" font-size="12" fill="#6e6e73" text-anchor="middle">정리 단계에서 확인</text>
<rect x="20" y="320" width="600" height="44" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="34" y="340" font-size="13" fill="#ff3b30" text-anchor="start" font-weight="700">결과: 시험 실패. "페이지에서 처리되지 않은 에러가 발생했습니다"</text>
<text x="34" y="356" font-size="12" fill="#6e6e73" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">apps/react/e2e/fixtures.ts</text>
</svg>
