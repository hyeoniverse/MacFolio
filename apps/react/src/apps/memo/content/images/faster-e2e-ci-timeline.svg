<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>전에는 check, e2e 3칸, 배포 순서였고, 후에는 같은 트리면 check, e2e-reuse, 배포로 간다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="740" height="240" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">main에 머지한 뒤 배포까지</text>
<text x="32" y="56" font-size="11" fill="#6b7280">같은 트리가 PR에서 통과했으면 e2e 자리가 기록 찾기로 바뀐다</text>
<text x="32" y="98" font-size="12" font-weight="600" fill="#1f2937">전</text><rect x="80" y="80" width="90" height="30" rx="6" fill="#9ca3af"/><text x="125.0" y="99" font-size="10.5" fill="#ffffff" text-anchor="middle">check</text><rect x="176" y="80" width="380" height="30" rx="6" fill="#9ca3af"/><text x="366.0" y="99" font-size="10.5" fill="#ffffff" text-anchor="middle">e2e 3칸 (8~9분, 칸마다 준비 1분 포함)</text><rect x="562" y="80" width="150" height="30" rx="6" fill="#9ca3af"/><text x="637.0" y="99" font-size="10.5" fill="#ffffff" text-anchor="middle">API 이미지 · 배포</text><text x="32" y="158" font-size="12" font-weight="600" fill="#4f46e5">후</text><rect x="80" y="140" width="90" height="30" rx="6" fill="#4f46e5"/><text x="125.0" y="159" font-size="10.5" fill="#ffffff" text-anchor="middle">check</text><rect x="176" y="140" width="90" height="30" rx="6" fill="#4f46e5"/><text x="221.0" y="159" font-size="10.5" fill="#ffffff" text-anchor="middle">e2e-reuse</text><rect x="272" y="140" width="150" height="30" rx="6" fill="#4f46e5"/><text x="347.0" y="159" font-size="10.5" fill="#ffffff" text-anchor="middle">API 이미지 · 배포</text><text x="432" y="159" font-size="10.5" fill="#6b7280">트리가 같은 통과 기록 6개가 있을 때</text><text x="80" y="200" font-size="10.5" fill="#374151">기록이 하나라도 없으면 e2e-reuse 뒤에 e2e 6칸이 돈다. 6칸은 3칸보다 기다리는 시간이 반쯤</text><text x="80" y="218" font-size="10.5" fill="#6b7280">막대 길이는 대략의 비율. 시험(check·e2e)은 PR에서 이미 같은 트리로 모두 통과했다</text>
</svg>
