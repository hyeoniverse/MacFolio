<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>창이 보이는 동안만 1분마다 조회하는 시간표</title>
<rect width="900" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">창이 보이는 동안만 1분마다 조회한다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">활동 상태 보기의 개요 탭, 0~10분. 점 하나가 GET /analytics/summary 요청 하나</text>
<text x="32" y="101" font-size="12" fill="#374151" font-weight="600">브라우저 탭</text>
<text x="32" y="145" font-size="12" fill="#374151" font-weight="600">앱 창</text>
<text x="32" y="201" font-size="12" fill="#374151" font-weight="600">요청</text>
<rect x="150" y="85" width="245.0" height="22" rx="5" fill="#15803d"/>
<text x="272.5" y="100" font-size="11" fill="#ffffff" text-anchor="middle">보임</text>
<rect x="395.0" y="85" width="189.0" height="22" rx="5" fill="#e5e7eb"/>
<text x="489.5" y="100" font-size="11" fill="#374151" text-anchor="middle">숨김 (다른 탭)</text>
<rect x="584.0" y="85" width="266.0" height="22" rx="5" fill="#15803d"/>
<text x="717.0" y="100" font-size="11" fill="#ffffff" text-anchor="middle">보임</text>
<rect x="150" y="129" width="581.0" height="22" rx="5" fill="#4f46e5"/>
<text x="440.5" y="144" font-size="11" fill="#ffffff" text-anchor="middle">열림</text>
<rect x="731.0" y="129" width="118.99999999999994" height="22" rx="5" fill="#e5e7eb"/>
<text x="790.5" y="144" font-size="11" fill="#374151" text-anchor="middle">최소화</text>
<line x1="150" y1="236" x2="850" y2="236" stroke="#9ca3af" stroke-width="1"/>
<line x1="150" y1="232" x2="150" y2="240" stroke="#9ca3af"/>
<text x="150" y="254" font-size="10" fill="#6b7280" text-anchor="middle">0분</text>
<line x1="220" y1="232" x2="220" y2="240" stroke="#9ca3af"/>
<text x="220" y="254" font-size="10" fill="#6b7280" text-anchor="middle">1분</text>
<line x1="290" y1="232" x2="290" y2="240" stroke="#9ca3af"/>
<text x="290" y="254" font-size="10" fill="#6b7280" text-anchor="middle">2분</text>
<line x1="360" y1="232" x2="360" y2="240" stroke="#9ca3af"/>
<text x="360" y="254" font-size="10" fill="#6b7280" text-anchor="middle">3분</text>
<line x1="430" y1="232" x2="430" y2="240" stroke="#9ca3af"/>
<text x="430" y="254" font-size="10" fill="#6b7280" text-anchor="middle">4분</text>
<line x1="500" y1="232" x2="500" y2="240" stroke="#9ca3af"/>
<text x="500" y="254" font-size="10" fill="#6b7280" text-anchor="middle">5분</text>
<line x1="570" y1="232" x2="570" y2="240" stroke="#9ca3af"/>
<text x="570" y="254" font-size="10" fill="#6b7280" text-anchor="middle">6분</text>
<line x1="640" y1="232" x2="640" y2="240" stroke="#9ca3af"/>
<text x="640" y="254" font-size="10" fill="#6b7280" text-anchor="middle">7분</text>
<line x1="710" y1="232" x2="710" y2="240" stroke="#9ca3af"/>
<text x="710" y="254" font-size="10" fill="#6b7280" text-anchor="middle">8분</text>
<line x1="780" y1="232" x2="780" y2="240" stroke="#9ca3af"/>
<text x="780" y="254" font-size="10" fill="#6b7280" text-anchor="middle">9분</text>
<line x1="850" y1="232" x2="850" y2="240" stroke="#9ca3af"/>
<text x="850" y="254" font-size="10" fill="#6b7280" text-anchor="middle">10분</text>
<circle cx="150" cy="196" r="7" fill="#15803d"/>
<circle cx="220" cy="196" r="7" fill="#15803d"/>
<circle cx="290" cy="196" r="7" fill="#15803d"/>
<circle cx="360" cy="196" r="7" fill="#15803d"/>
<circle cx="584.0" cy="196" r="7" fill="#15803d"/>
<circle cx="654.0" cy="196" r="7" fill="#b91c1c"/>
<text x="489.5" y="190" font-size="11" fill="#6b7280" text-anchor="middle">조회하지 않음</text>
<text x="489.5" y="204" font-size="11" fill="#6b7280" text-anchor="middle">(예약 취소)</text>
<text x="584.0" y="178" font-size="11" fill="#15803d" text-anchor="middle">다시 보이면 바로</text>
<text x="654.0" y="178" font-size="11" fill="#b91c1c" text-anchor="middle">실패</text>
<line x1="654.0" y1="212" x2="727.5" y2="212" stroke="#b91c1c" stroke-dasharray="4 3" stroke-width="1.5"/>
<text x="692.5" y="225" font-size="11" fill="#b91c1c" text-anchor="middle">다음은 2분 뒤 (백오프)</text>
<text x="790.5" y="200" font-size="11" fill="#6b7280" text-anchor="middle">창을 내려 멈춤</text>
<circle cx="40" cy="290" r="6" fill="#15803d"/><text x="52" y="294" font-size="11" fill="#374151">성공한 요청 (다음 요청은 응답이 끝난 시각부터 60초 뒤)</text>
<circle cx="440" cy="290" r="6" fill="#b91c1c"/><text x="452" y="294" font-size="11" fill="#374151">실패한 요청 (간격 2배, 최대 10분. 화면의 값은 그대로)</text>
<text x="32" y="316" font-size="11" fill="#6b7280">새로 고침 버튼(⌥R)은 언제든 바로 조회한다. 진행 중이면 요청을 더 보내지 않는다.</text>
</svg>