<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>웹 개발자용 VS Code 확장을 목적별 일곱 묶음으로 나눈 도식</title>
<rect width="860" height="470" fill="#ffffff"/>
<text x="430" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">목적별 확장 묶음</text>
<text x="430" y="56" font-size="12" fill="#6b7280" text-anchor="middle">위 줄은 저장소 설정 파일과 바로 연결되는 확장, 아래 줄은 작업 환경을 넓히는 확장</text>

<g font-size="12.5">
  <rect x="20" y="80" width="260" height="160" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text x="36" y="106" font-size="14" font-weight="700" fill="#3730a3">① 코드 품질</text>
  <text x="36" y="132" fill="#1f2937">ESLint · Prettier · Stylelint</text>
  <text x="36" y="154" fill="#1f2937">Error Lens · Code Spell Checker</text>
  <text x="36" y="186" font-size="11.5" fill="#4b5563">설정: eslint.config.js, .prettierrc,</text>
  <text x="36" y="204" font-size="11.5" fill="#4b5563">stylelint.config.mjs</text>
  <text x="36" y="226" font-size="11.5" fill="#4b5563">저장 시각에 포맷·자동 수정</text>

  <rect x="300" y="80" width="260" height="160" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="316" y="106" font-size="14" font-weight="700" fill="#065f46">② 테스트</text>
  <text x="316" y="132" fill="#1f2937">Playwright Test for VSCode</text>
  <text x="316" y="154" fill="#1f2937">Vitest</text>
  <text x="316" y="186" font-size="11.5" fill="#4b5563">설정: playwright.config.ts,</text>
  <text x="316" y="204" font-size="11.5" fill="#4b5563">vitest.config.ts</text>
  <text x="316" y="226" font-size="11.5" fill="#4b5563">테스트 탐색기에서 실행·디버그</text>

  <rect x="580" y="80" width="260" height="160" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="596" y="106" font-size="14" font-weight="700" fill="#9a3412">③ API·데이터</text>
  <text x="596" y="132" fill="#1f2937">REST Client · Prisma</text>
  <text x="596" y="154" fill="#1f2937">Container Tools</text>
  <text x="596" y="186" font-size="11.5" fill="#4b5563">설정: schema.prisma,</text>
  <text x="596" y="204" font-size="11.5" fill="#4b5563">docker-compose.yml, *.http</text>
  <text x="596" y="226" font-size="11.5" fill="#4b5563">요청·스키마·컨테이너를 편집기 안에서</text>

  <rect x="20" y="268" width="196" height="170" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="36" y="294" font-size="14" font-weight="700" fill="#5b21b6">④ 언어·프레임워크</text>
  <text x="36" y="320" fill="#1f2937">Tailwind CSS</text>
  <text x="36" y="340" fill="#1f2937">IntelliSense</text>
  <text x="36" y="362" fill="#1f2937">Vue (Official)</text>
  <text x="36" y="392" font-size="11.5" fill="#4b5563">쓰는 프레임워크가</text>
  <text x="36" y="410" font-size="11.5" fill="#4b5563">있을 때만 설치</text>

  <rect x="232" y="268" width="196" height="170" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <text x="248" y="294" font-size="14" font-weight="700" fill="#991b1b">⑤ Git</text>
  <text x="248" y="320" fill="#1f2937">GitLens</text>
  <text x="248" y="342" fill="#1f2937">Git Graph</text>
  <text x="248" y="392" font-size="11.5" fill="#4b5563">줄마다 작성자·커밋,</text>
  <text x="248" y="410" font-size="11.5" fill="#4b5563">브랜치 그래프</text>

  <rect x="444" y="268" width="196" height="170" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/>
  <text x="460" y="294" font-size="14" font-weight="700" fill="#075985">⑥ 원격·협업</text>
  <text x="460" y="320" fill="#1f2937">Dev Containers</text>
  <text x="460" y="342" fill="#1f2937">Remote - SSH</text>
  <text x="460" y="364" fill="#1f2937">Live Share</text>
  <text x="460" y="392" font-size="11.5" fill="#4b5563">컨테이너·서버 안의</text>
  <text x="460" y="410" font-size="11.5" fill="#4b5563">폴더를 그대로 편집</text>

  <rect x="656" y="268" width="184" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="672" y="294" font-size="14" font-weight="700" fill="#374151">⑦ 편의</text>
  <text x="672" y="320" fill="#1f2937">EditorConfig</text>
  <text x="672" y="342" fill="#1f2937">Path Intellisense</text>
  <text x="672" y="364" fill="#1f2937">Markdown All in One</text>
  <text x="672" y="386" fill="#1f2937">markdownlint</text>
  <text x="672" y="408" fill="#1f2937">Material Icon Theme</text>
</g>
<text x="430" y="460" font-size="11.5" fill="#6b7280" text-anchor="middle">TypeScript 언어 지원은 VS Code에 기본 포함 — 별도 확장 없이 동작한다</text>
</svg>
