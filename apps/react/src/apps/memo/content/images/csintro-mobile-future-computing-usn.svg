<circle cx="160" cy="125" r="18" fill="#0a84ff"/><text x="160" y="160" font-size="12">싱크 노드</text><text x="70" y="115" font-size="12" fill="#34c759">센서 노드</text>
<rect x="240" y="100" width="110" height="50" rx="6" fill="#ff9f0a"/><text x="295" y="122" fill="#fff">USN 게이트웨이</text><text x="295" y="139" fill="#fff" font-size="12">(라우터)</text>
<rect x="380" y="100" width="110" height="50" rx="6" fill="#0a84ff"/><text x="435" y="122" fill="#fff">USN 미들웨어</text><text x="435" y="139" fill="#fff" font-size="12">걸러 내고 가공</text>
<rect x="520" y="100" width="110" height="50" rx="6" fill="#1d1d1f"/><text x="575" y="122" fill="#fff">응용 서비스</text><text x="575" y="139" fill="#fff" font-size="12">산불 경보 등</text>
<line x1="180" y1="125" x2="237" y2="125" stroke="#6e6e73" marker-end="url(#a)"/><line x1="352" y1="125" x2="377" y2="125" stroke="#6e6e73" marker-end="url(#a)"/><line x1="492" y1="125" x2="517" y2="125" stroke="#6e6e73" marker-end="url(#a)"/>
<text x="300" y="185" font-size="12" fill="#6e6e73">저전력 무선 (Zigbee 등)</text><text x="400" y="205" font-size="12" fill="#6e6e73">→ 인터넷</text>
