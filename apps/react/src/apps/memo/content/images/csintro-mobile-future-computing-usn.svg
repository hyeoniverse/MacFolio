<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 260"><title>유비쿼터스 센서 네트워크 구성: 센서 노드, 싱크 노드, USN 게이트웨이, 미들웨어, 응용 서비스</title><rect width="640" height="260" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<rect x="10" y="20" width="200" height="200" rx="10" fill="#f2f2f7" stroke="#6e6e73" stroke-dasharray="4 3"/><text x="110" y="40" font-size="12" fill="#6e6e73">센서 필드 (숲, 공장, 다리)</text>
