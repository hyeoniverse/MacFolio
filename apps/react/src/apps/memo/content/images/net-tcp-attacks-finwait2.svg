<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>

  <!-- 왼쪽: 정상 종료 -->
  <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">정상 종료</text>
  <text x="90" y="50" text-anchor="middle" font-size="12" fill="#1d1d1f">먼저 닫는 쪽</text>
  <text x="250" y="50" text-anchor="middle" font-size="12" fill="#1d1d1f">상대</text>
  <g stroke="#1d1d1f" stroke-width="1.4">
    <line x1="90" y1="60" x2="90" y2="300"/>
    <line x1="250" y1="60" x2="250" y2="300"/>
  </g>
  <g stroke-width="1.6" fill="none">
    <line x1="90" y1="95" x2="248" y2="122" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="250" y1="132" x2="92" y2="157" stroke="#ff9f0a" marker-end="url(#o)"/>
    <line x1="250" y1="175" x2="92" y2="200" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="90" y1="212" x2="248" y2="237" stroke="#ff9f0a" marker-end="url(#o)"/>
  </g>
  <g font-size="11" font-weight="600" text-anchor="middle">
    <text x="170" y="101" fill="#0a84ff">FIN</text>
    <text x="170" y="137" fill="#ff9f0a">ACK</text>
    <text x="170" y="180" fill="#0a84ff">FIN</text>
    <text x="170" y="217" fill="#ff9f0a">ACK</text>
  </g>
  <g font-size="11" fill="#6e6e73" text-anchor="end">
    <text x="84" y="80">연결됨</text>
    <text x="84" y="112">FIN_WAIT1</text>
    <text x="84" y="166" fill="#1d1d1f" font-weight="600">FIN_WAIT2</text>
    <text x="84" y="214">TIME_WAIT</text>
    <text x="84" y="296">CLOSED</text>
  </g>
  <g font-size="11" fill="#6e6e73">
    <text x="256" y="80">연결됨</text>
    <text x="256" y="142">CLOSE_WAIT</text>
    <text x="256" y="185">LAST_ACK</text>
    <text x="256" y="250">CLOSED</text>
  </g>

  <line x1="320" y1="40" x2="320" y2="320" stroke="#d1d1d6"/>

  <!-- 오른쪽: LAST_ACK를 건너뛴 경우 -->
  <text x="480" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">상대가 FIN을 보내지 않는 경우</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#1d1d1f">서버</text>
  <text x="560" y="50" text-anchor="middle" font-size="12" fill="#1d1d1f">공격자</text>
  <g stroke="#1d1d1f" stroke-width="1.4">
    <line x1="400" y1="60" x2="400" y2="166"/>
    <line x1="560" y1="60" x2="560" y2="300"/>
  </g>
  <line x1="400" y1="166" x2="400" y2="296" stroke="#6e6e73" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#k)"/>
  <g stroke-width="1.6" fill="none">
    <line x1="400" y1="95" x2="558" y2="122" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="560" y1="132" x2="402" y2="157" stroke="#ff9f0a" marker-end="url(#o)"/>
  </g>
  <g font-size="11" font-weight="600" text-anchor="middle">
    <text x="480" y="101" fill="#0a84ff">FIN</text>
    <text x="480" y="137" fill="#ff9f0a">ACK</text>
  </g>
  <g font-size="11" fill="#6e6e73" text-anchor="end">
    <text x="394" y="80">연결됨</text>
    <text x="394" y="112">FIN_WAIT1</text>
    <text x="394" y="166" fill="#1d1d1f" font-weight="600">FIN_WAIT2</text>
  </g>
  <g font-size="11" fill="#6e6e73">
    <text x="566" y="80">연결됨</text>
    <text x="566" y="142">CLOSE_WAIT</text>
    <text x="566" y="190">FIN 전송 없음</text>
  </g>
  <text x="412" y="232" font-size="11" fill="#1d1d1f">FIN이 오지 않아</text>
  <text x="412" y="248" font-size="11" fill="#1d1d1f">FIN_WAIT2 상태가</text>
  <text x="412" y="264" font-size="11" fill="#1d1d1f">커널에 남는다</text>
</svg>
