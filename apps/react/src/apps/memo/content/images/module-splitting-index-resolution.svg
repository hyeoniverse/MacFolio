<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>디렉터리 import의 해석</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="700">같은 import 문자열이 가리키는 파일</text>
<text x="20" y="50" font-size="12" fill="#6e6e73" text-anchor="start">'@/shared/profile' 문자열은 그대로 두고, 해석 결과만 파일에서 폴더의 index.ts로 바뀐다</text>
<rect x="120" y="66" width="400" height="44" rx="6" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="320" y="85" font-size="12" fill="#6e6e73" text-anchor="middle">외부 파일 27곳 (수정하지 않음)</text>
<text x="320" y="102" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">import { PROJECTS } from '@/shared/profile'</text>
<text x="20" y="140" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">분리 전</text>
<line x1="200" y1="110" x2="120" y2="152" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="20" y="156" width="200" height="50" rx="6" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.2"/>
<text x="120" y="177" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">shared/profile.ts</text>
<text x="120" y="196" font-size="12" fill="#6e6e73" text-anchor="middle">1,629줄 한 파일</text>
<text x="120" y="230" font-size="12" fill="#6e6e73" text-anchor="middle">profile.ts가 있으므로</text>
<text x="120" y="247" font-size="12" fill="#6e6e73" text-anchor="middle">이 파일로 해석</text>
<text x="300" y="140" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">분리 후</text>
<line x1="440" y1="110" x2="440" y2="152" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="310" y="156" width="260" height="50" rx="6" fill="#e8f1ff" stroke="#0a84ff" stroke-width="1.2"/>
<text x="440" y="177" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">shared/profile/index.ts</text>
<text x="440" y="196" font-size="12" fill="#0a84ff" text-anchor="middle">profile.ts가 없어 폴더의 index.ts로</text>
<line x1="440" y1="206" x2="300" y2="258" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="256" y="262" width="88" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="300" y="282" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">profile.ts</text>
<line x1="440" y1="206" x2="400" y2="258" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="356" y="262" width="88" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="400" y="282" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">skills.ts</text>
<line x1="440" y1="206" x2="500" y2="258" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="456" y="262" width="88" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="500" y="282" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">types.ts</text>
<line x1="440" y1="206" x2="590" y2="258" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="546" y="262" width="88" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="590" y="282" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">projects/</text>
<line x1="590" y1="292" x2="590" y2="312" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="440" y="316" width="190" height="44" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="535" y="334" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">index.ts + hyeoniverse.ts</text>
<text x="535" y="351" font-size="12" fill="#1d1d1f" text-anchor="middle">등 프로젝트 파일 7개</text>
<text x="20" y="300" font-size="12" fill="#6e6e73" text-anchor="start">index.ts는 내용 없이</text>
<text x="20" y="317" font-size="12" fill="#6e6e73" text-anchor="start">다시 내보내기만 한다</text>
<rect x="20" y="330" width="410" height="52" rx="4" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="30" y="351" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">export { PROFILE } from './profile';</text>
<text x="30" y="370" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">export { PROJECTS } from './projects';</text>
</svg>
