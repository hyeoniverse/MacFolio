<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">CORS 헤더와 관리자 가드는 서로 다른 것을 막는다</text>
  <text x="24" y="54" font-size="12" fill="#6e6e73">CORS는 응답을 페이지 스크립트에 넘길지 정하고, 가드는 서버가 요청을 처리할지 정한다</text>

  <!-- browser -->
  <rect x="24" y="80" width="170" height="210" rx="10" fill="#f2f2f7"/>
  <text x="109" y="106" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">브라우저</text>
  <text x="109" y="126" font-size="12" fill="#6e6e73" text-anchor="middle">미리보기 페이지의 fetch</text>
  <rect x="40" y="142" width="138" height="62" rx="6" fill="#fff" stroke="#c7c7cc"/>
  <text x="52" y="164" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">GET /auth/me</text>
  <text x="52" y="184" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">Origin: https://</text>
  <text x="52" y="198" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace"> feat-x-…dev</text>
  <rect x="40" y="218" width="138" height="56" rx="6" fill="#fff" stroke="#0a84ff"/>
  <text x="109" y="240" font-size="12" font-weight="600" fill="#0a84ff" text-anchor="middle">② CORS 검사</text>
  <text x="109" y="260" font-size="12" fill="#1d1d1f" text-anchor="middle">응답 헤더를 확인</text>

  <!-- server -->
  <rect x="300" y="80" width="316" height="210" rx="10" fill="#f2f2f7"/>
  <text x="458" y="106" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">API 서버 (NestJS)</text>
  <rect x="316" y="122" width="284" height="62" rx="6" fill="#fff" stroke="#ff9f0a"/>
  <text x="328" y="144" font-size="12" font-weight="600" fill="#c77700">① AdminGuard</text>
  <text x="328" y="164" font-size="12" fill="#1d1d1f">Origin이 exact가 아니면 세션과 관계없이</text>
  <text x="328" y="178" font-size="12" fill="#1d1d1f">403. 관리자 동작은 실행되지 않는다</text>
  <rect x="316" y="196" width="284" height="78" rx="6" fill="#fff" stroke="#0a84ff"/>
  <text x="328" y="218" font-size="12" font-weight="600" fill="#0a84ff">enableCors 응답 헤더</text>
  <text x="328" y="236" font-size="12" fill="#1d1d1f">exact: Allow-Origin + Allow-Credentials</text>
  <text x="328" y="253" font-size="12" fill="#1d1d1f">pattern: Allow-Origin만</text>
  <text x="328" y="270" font-size="12" fill="#1d1d1f">null: CORS 헤더 없음</text>

  <line x1="178" y1="168" x2="312" y2="152" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="196" y="148" font-size="12" fill="#6e6e73">요청은 서버에 도착</text>
  <line x1="312" y1="236" x2="182" y2="246" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="232" font-size="12" fill="#6e6e73">응답 + 헤더</text>

  <!-- notes -->
  <rect x="24" y="306" width="592" height="80" rx="8" fill="#fff" stroke="#c7c7cc"/>
  <text x="38" y="330" font-size="12" fill="#1d1d1f">• 단순 요청(GET, form 형식 POST 등)은 사전 요청 없이 서버에 바로 도착한다. CORS 검사는 그 뒤에 일어난다.</text>
  <text x="38" y="352" font-size="12" fill="#1d1d1f">• 그래서 CORS 헤더만으로는 "요청이 처리되었는가"를 막지 못하고, 서버의 가드가 따로 필요하다.</text>
  <text x="38" y="374" font-size="12" fill="#1d1d1f">• Origin이 없는 요청(주소창 이동, curl)은 CORS 대상이 아니므로 가드가 세션만 확인한다.</text>
</svg>
