<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>수정 전 빌드에서는 공통 컴포넌트 CSS가 먼저 붙어 components 레이어가 먼저 선언되고 reset이 나중이라 reset의 padding 0이 우선했다. 수정 후에는 index.html 인라인 style 맨 앞의 @layer reset, components 선언이 순서를 고정해 components가 우선한다</title>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">캐스케이드 레이어 순서는 처음 등장한 위치에서 정해진다</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">나중에 선언된 레이어가 우선한다. 같은 요소에 두 레이어의 규칙이 겹칠 때의 결과</text>

<text x="24" y="86" font-size="13" font-weight="700" fill="#ff3b30">수정 전 빌드</text>
<rect x="24" y="98" width="284" height="40" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="36" y="116" font-size="12" fill="#6e6e73">① 공통 컴포넌트 CSS 파일</text>
<text x="36" y="131" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">@layer components { … }</text>
<rect x="24" y="146" width="284" height="40" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="36" y="164" font-size="12" fill="#6e6e73">② main CSS 파일</text>
<text x="36" y="179" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">@layer reset { * { padding: 0 } }</text>
<text x="24" y="208" font-size="12" fill="#1d1d1f">순서: components → reset</text>
<rect x="24" y="218" width="284" height="44" rx="8" fill="#fff5f4" stroke="#ff3b30"/>
<text x="36" y="236" font-size="12" font-weight="700" fill="#ff3b30">reset이 우선</text>
<text x="36" y="253" font-size="12" fill="#1d1d1f">경고창 버튼의 여백이 0</text>

<text x="332" y="86" font-size="13" font-weight="700" fill="#248a3d">수정 후</text>
<rect x="332" y="98" width="284" height="40" rx="8" fill="#eef6ff" stroke="#0a84ff"/>
<text x="344" y="116" font-size="12" fill="#6e6e73">⓪ index.html 인라인 &lt;style&gt; 맨 앞</text>
<text x="344" y="131" font-size="12" fill="#0a84ff" font-family="ui-monospace, Menlo, monospace">@layer reset, components;</text>
<rect x="332" y="146" width="284" height="40" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="344" y="164" font-size="12" fill="#6e6e73">①② CSS 파일 (붙는 순서와 무관)</text>
<text x="344" y="179" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">@layer components / reset { … }</text>
<text x="332" y="208" font-size="12" fill="#1d1d1f">순서: reset → components</text>
<rect x="332" y="218" width="284" height="44" rx="8" fill="#f0faf2" stroke="#34c759"/>
<text x="344" y="236" font-size="12" font-weight="700" fill="#248a3d">components가 우선</text>
<text x="344" y="253" font-size="12" fill="#1d1d1f">공통 컴포넌트의 여백 유지</text>

<text x="24" y="296" font-size="12" fill="#6e6e73">레이어 우선순위는 선택자 구체성보다 먼저 비교된다. 그래서 단순한 * 선택자도</text>
<text x="24" y="314" font-size="12" fill="#6e6e73">나중 레이어에 있으면 앞 레이어의 클래스 선택자를 이긴다</text>
</svg>
