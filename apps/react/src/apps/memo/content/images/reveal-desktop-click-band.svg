<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs>
<rect width="640" height="300" fill="#fff"/>
<text x="320" y="26" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">pointerup에서 시작점과의 거리로 두 동작을 구분한다</text>
<text x="320" y="46" font-size="12" fill="#6e6e73" text-anchor="middle">DRAG_THRESHOLD = 4px (아이콘 끌기와 같은 기준). 왼쪽 그림은 10배로 확대</text>
<text x="160" y="80" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">2px 움직이고 뗌</text>
<circle cx="160" cy="160" r="40" fill="#e5f1ff" stroke="#0a84ff" stroke-dasharray="4 3"/>
<circle cx="160" cy="160" r="5" fill="#1d1d1f"/>
<circle cx="180" cy="160" r="5" fill="#0a84ff"/>
<text x="160" y="104" font-size="12" fill="#0a84ff" text-anchor="middle">반지름 4px</text>
<text x="160" y="226" font-size="12" font-weight="600" fill="#0a84ff" text-anchor="middle">누르기 → toggleDesktopRevealed()</text>
<text x="160" y="244" font-size="12" fill="#6e6e73" text-anchor="middle">⌘·⇧를 누른 채면 실행하지 않음</text>
<text x="470" y="80" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">30px 끌고 뗌</text>
<rect x="390" y="120" width="160" height="80" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff"/>
<circle cx="390" cy="120" r="40" fill="none" stroke="#0a84ff" stroke-dasharray="4 3"/>
<circle cx="390" cy="120" r="5" fill="#1d1d1f"/>
<line x1="390" y1="120" x2="547" y2="197" stroke="#1d1d1f" stroke-width="1.2" marker-end="url(#ar)"/>
<circle cx="550" cy="200" r="5" fill="#0a84ff"/>
<text x="470" y="226" font-size="12" font-weight="600" fill="#c46f00" text-anchor="middle">밴드 선택 → 창은 그대로</text>
<text x="470" y="244" font-size="12" fill="#6e6e73" text-anchor="middle">사각형 안의 바탕화면 아이콘 선택</text>
<g font-size="12" fill="#6e6e73"><circle cx="210" cy="278" r="5" fill="#1d1d1f"/><text x="220" y="282">pointerdown 시작점</text>
<circle cx="370" cy="278" r="5" fill="#0a84ff"/><text x="380" y="282">pointerup 지점</text></g>
</svg>
