<text x="320" y="168" text-anchor="middle" font-size="11" fill="#6e6e73">P1 → R2 → P2 → R1 → P1</text>
<text x="320" y="288" text-anchor="middle" font-size="12" fill="#6e6e73">P1은 R1을 가진 채 R2를, P2는 R2를 가진 채 R1을 기다린다</text></svg>
