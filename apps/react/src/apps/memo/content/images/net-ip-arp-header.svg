    <text x="560" y="22" text-anchor="end">31</text>
  </g>
  <g fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2">
    <rect x="40" y="30" width="65" height="50"/>
    <rect x="105" y="30" width="65" height="50"/>
    <rect x="170" y="30" width="130" height="50"/>
    <rect x="300" y="30" width="260" height="50"/>
    <rect x="40" y="80" width="260" height="46"/>
    <rect x="300" y="80" width="49" height="46"/>
    <rect x="349" y="80" width="211" height="46"/>
    <rect x="40" y="126" width="130" height="46"/>
    <rect x="170" y="126" width="130" height="46"/>
    <rect x="300" y="126" width="260" height="46"/>
    <rect x="40" y="172" width="520" height="44"/>
    <rect x="40" y="216" width="520" height="44"/>
  </g>
  <g fill="#fff" stroke="#1d1d1f" stroke-width="1.2">
    <path d="M40,268 L560,268 L552,280 L568,296 L560,308 L40,308 L48,296 L32,280 Z"/>
    <path d="M40,316 L560,316 L552,328 L568,344 L560,356 L40,356 L48,344 L32,328 Z"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <text x="72.5" y="47" font-size="10.5" fill="#6e6e73">4비트</text>
    <text x="72.5" y="62">버전</text>
    <text x="72.5" y="75" font-size="10.5">(version)</text>
    <text x="137.5" y="47" font-size="10.5" fill="#6e6e73">4비트</text>
    <text x="137.5" y="62">헤더 길이</text>
    <text x="137.5" y="75" font-size="10.5">(IHL)</text>
    <text x="235" y="52" font-size="10.5" fill="#6e6e73">8비트</text>
    <text x="235" y="69">서비스 유형(TOS)</text>
    <text x="430" y="52" font-size="10.5" fill="#6e6e73">16비트</text>
    <text x="430" y="69">전체 길이(total length, 바이트)</text>

    <text x="170" y="99" font-size="10.5" fill="#6e6e73">16비트</text>
    <text x="170" y="116">식별자(identification)</text>
    <text x="324.5" y="99" font-size="10.5" fill="#6e6e73">3비트</text>
    <text x="324.5" y="116">플래그</text>
    <text x="454.5" y="99" font-size="10.5" fill="#6e6e73">13비트</text>
    <text x="454.5" y="116">단편 오프셋(fragment offset)</text>

    <text x="105" y="145" font-size="10.5" fill="#6e6e73">8비트</text>
    <text x="105" y="162">생존 시간(TTL)</text>
    <text x="235" y="145" font-size="10.5" fill="#6e6e73">8비트</text>
    <text x="235" y="162">프로토콜(protocol)</text>
    <text x="430" y="145" font-size="10.5" fill="#6e6e73">16비트</text>
    <text x="430" y="162">헤더 체크섬(header checksum)</text>

    <text x="300" y="199">32비트 발신지 IP 주소(source IP address)</text>
    <text x="300" y="243">32비트 목적지 IP 주소(destination IP address)</text>
    <text x="300" y="292">옵션(있을 때만)</text>
    <text x="300" y="340">데이터</text>
