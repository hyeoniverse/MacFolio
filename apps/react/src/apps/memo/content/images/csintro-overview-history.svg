<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>해킹과 보안 사고의 연표: 1918 에니그마부터 2017 워너크라이까지 공격 대상의 확대</title>
<rect width="640" height="360" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">해킹과 보안 사고의 흐름</text>
<line x1="40" y1="180" x2="610" y2="180" stroke="#6e6e73" stroke-width="2"/>
<g font-size="12" text-anchor="middle">
<rect x="40" y="166" width="110" height="28" fill="#f2f2f7"/><text x="95" y="185" fill="#1d1d1f">~1950 암호 기계</text>
<rect x="155" y="166" width="110" height="28" fill="#ffe7c2"/><text x="210" y="185" fill="#1d1d1f">1960~70 전화망</text>
<rect x="270" y="166" width="110" height="28" fill="#d6eaff"/><text x="325" y="185" fill="#1d1d1f">1980 네트워크</text>
<rect x="385" y="166" width="110" height="28" fill="#d6eaff"/><text x="440" y="185" fill="#1d1d1f">1990 인터넷</text>
<rect x="500" y="166" width="110" height="28" fill="#ffd6d3"/><text x="555" y="185" fill="#1d1d1f">2000~ 대규모</text>
</g>
<g font-size="12" fill="#1d1d1f">
<text x="40" y="70">1918 에니그마 특허</text><text x="40" y="88">1932 폴란드 해독</text><text x="40" y="106">1940 봄브</text><text x="40" y="124">1944 콜로서스</text>
<text x="160" y="70">1971 블루 박스</text><text x="160" y="88">2600Hz 프리킹</text>
<text x="270" y="70">1983 414s</text><text x="275" y="88">1983 WarGames</text><text x="275" y="106">1984 『2600』</text><text x="275" y="124" fill="#ff3b30">1988 모리스 웜, CERT</text>
<text x="405" y="70">1991 리눅스 0.01</text><text x="405" y="88">1993 DEF CON</text><text x="405" y="106">1997 AOHell</text><text x="405" y="124">1998 백 오리피스</text>
<text x="505" y="230">2000 DDoS, 러브 버그</text><text x="505" y="248" fill="#ff3b30">2003 슬래머</text><text x="505" y="266">2009 7·7 DDoS</text><text x="505" y="284">2011 농협 전산망</text><text x="505" y="302">2014 카드사 유출</text><text x="505" y="320" fill="#ff3b30">2017 워너크라이</text>
</g>
<g font-size="12" fill="#6e6e73">
<text x="40" y="240">공격 대상</text>
<text x="40" y="262">기계 하나 → 전화망 → 연결된 컴퓨터</text>
<text x="40" y="284">→ 인터넷 전체 → 개인정보·금융·기반 시설</text>
<text x="40" y="320">빨간 글자: 인터넷 전체 규모의 감염 사건</text>
</g>
</svg>
