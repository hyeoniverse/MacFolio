<text x="321.13684210526316" y="293" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">337줄</text>
<text x="32" y="316" font-size="10" font-weight="400" fill="#374151" text-anchor="start">줄 수는 머지 커밋 기준(wc -l). FolderSidebar는 계획을 세울 때 675줄, PR 직전에는 697줄이었다.</text>
</svg>
