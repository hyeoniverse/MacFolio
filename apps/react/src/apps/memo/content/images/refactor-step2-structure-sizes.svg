<text x="706.1473684210526" y="83" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">1,861줄</text>
<text x="218" y="107" font-size="10" font-weight="400" fill="#374151" text-anchor="end">→ 가장 큰 조각 Wave.tsx</text>
<rect x="230" y="94" width="101.3" height="16" rx="3" fill="#a5b4fc"/>
<text x="337.30526315789473" y="107" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">401줄 · 새 파일 16개</text>
<text x="218" y="145" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">CreativeCms.tsx (#193)</text>
<rect x="230" y="132" width="245.1" height="16" rx="3" fill="#fda4af"/>
<text x="481.0526315789474" y="145" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">970줄</text>
<text x="218" y="169" font-size="10" font-weight="400" fill="#374151" text-anchor="end">→ 가장 큰 조각 cms/Providers.tsx</text>
<rect x="230" y="156" width="85.1" height="16" rx="3" fill="#a5b4fc"/>
<text x="321.13684210526316" y="169" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">337줄 · 새 파일 8개</text>
<text x="218" y="207" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">FolderSidebar.tsx (#190)</text>
<rect x="230" y="194" width="176.1" height="16" rx="3" fill="#fda4af"/>
<text x="412.0842105263158" y="207" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">697줄</text>
<text x="218" y="231" font-size="10" font-weight="400" fill="#374151" text-anchor="end">→ 가장 큰 조각 FolderSidebar.tsx</text>
<rect x="230" y="218" width="87.2" height="16" rx="3" fill="#a5b4fc"/>
<text x="323.1578947368421" y="231" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">345줄</text>
<text x="218" y="269" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="end">PhotosMobile.tsx (#190)</text>
<rect x="230" y="256" width="167.2" height="16" rx="3" fill="#fda4af"/>
<text x="403.2421052631579" y="269" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">662줄</text>
<text x="218" y="293" font-size="10" font-weight="400" fill="#374151" text-anchor="end">→ 가장 큰 조각 PhotosMobile.tsx</text>
