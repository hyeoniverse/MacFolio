<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>NestJS 요청 처리 순서</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="700">NestJS가 요청을 처리하는 순서와 응답 코드가 정해지는 자리</text>
<text x="20" y="50" font-size="12" fill="#6e6e73" text-anchor="start">가드는 파이프와 처리 함수보다 먼저 실행된다. 그래서 관리자 경로는 본문이 틀려도 401이 먼저 나와야 한다</text>
<rect x="20" y="76" width="88" height="58" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.5"/>
<text x="64.0" y="110" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">요청</text>
<line x1="108" y1="105" x2="116" y2="105" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="116" y="76" width="88" height="58" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.5"/>
<text x="160.0" y="100" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">미들웨어</text>
<text x="160.0" y="120" font-size="12" fill="#6e6e73" text-anchor="middle">쿠키 해석 등</text>
<line x1="204" y1="105" x2="212" y2="105" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="212" y="76" width="88" height="58" rx="6" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="256.0" y="100" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">가드</text>
<text x="256.0" y="120" font-size="12" fill="#6e6e73" text-anchor="middle">AdminGuard</text>
<line x1="300" y1="105" x2="308" y2="105" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="308" y="76" width="88" height="58" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.5"/>
<text x="352.0" y="110" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">인터셉터</text>
<line x1="396" y1="105" x2="404" y2="105" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="404" y="76" width="88" height="58" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.5"/>
<text x="448.0" y="100" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">파이프</text>
<text x="448.0" y="120" font-size="12" fill="#6e6e73" text-anchor="middle">ValidationPipe</text>
<line x1="492" y1="105" x2="500" y2="105" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="500" y="76" width="88" height="58" rx="6" fill="#fff3e0" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="544.0" y="100" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">처리 함수</text>
<text x="544.0" y="120" font-size="12" fill="#6e6e73" text-anchor="middle">검사 함수</text>
<line x1="256.0" y1="136" x2="256.0" y2="176" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="186.0" y="180" width="140" height="46" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="256.0" y="200" font-size="14" fill="#0a84ff" text-anchor="middle" font-weight="700">401</text>
<text x="256.0" y="218" font-size="12" fill="#6e6e73" text-anchor="middle">로그인하지 않음</text>
<line x1="544.0" y1="136" x2="544.0" y2="176" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#aro)"/>
<rect x="472.0" y="180" width="144" height="46" rx="6" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="544.0" y="200" font-size="14" fill="#ff9f0a" text-anchor="middle" font-weight="700">400</text>
<text x="544.0" y="218" font-size="12" fill="#6e6e73" text-anchor="middle">검사 함수가 거절</text>
<rect x="472.0" y="236" width="144" height="46" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="544.0" y="256" font-size="14" fill="#ff3b30" text-anchor="middle" font-weight="700">500</text>
<text x="544.0" y="274" font-size="12" fill="#6e6e73" text-anchor="middle">검사 없이 처리 중 예외</text>
<rect x="20" y="244" width="360" height="70" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="34" y="266" font-size="12" fill="#1d1d1f" text-anchor="start">시험 3: 관리자 경로에 틀린 본문 + 쿠키 없음 → 401</text>
<text x="34" y="286" font-size="12" fill="#1d1d1f" text-anchor="start">시험 4: 본문 경로에 타입이 틀린 값 → 400</text>
<text x="34" y="306" font-size="12" fill="#ff3b30" text-anchor="start">500이나 2xx가 나오면 검사가 빠진 경로다</text>
</svg>
