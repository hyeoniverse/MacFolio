<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 260"><title>로그인할 때 입력한 비밀번호와 솔트를 해시해 /etc/shadow에 저장된 해시와 비교하는 과정</title><rect width="640" height="260" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker></defs>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<rect x="20" y="30" width="150" height="44" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="95" y="50">입력한 비밀번호</text><text x="95" y="66" font-size="12" fill="#6e6e73">correct horse</text>
<rect x="20" y="110" width="150" height="44" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="95" y="130">shadow의 솔트</text><text x="95" y="146" font-size="12" fill="#6e6e73">Qw8z1kLp</text>
<rect x="230" y="65" width="140" height="54" rx="6" fill="#0a84ff"/><text x="300" y="88" fill="#fff">해시 함수</text><text x="300" y="106" font-size="12" fill="#fff">SHA-512, yescrypt 등</text>
<line x1="172" y1="52" x2="228" y2="80" stroke="#6e6e73" marker-end="url(#a)"/><line x1="172" y1="132" x2="228" y2="104" stroke="#6e6e73" marker-end="url(#a)"/>
<rect x="430" y="65" width="190" height="54" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="525" y="88">계산한 해시</text><text x="525" y="106" font-size="12" fill="#6e6e73">9fT2...a1</text>
<line x1="372" y1="92" x2="427" y2="92" stroke="#0a84ff" marker-end="url(#b)"/>
<rect x="430" y="170" width="190" height="54" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="525" y="193">저장된 해시</text><text x="525" y="211" font-size="12" fill="#6e6e73">/etc/shadow 둘째 필드</text>
<text x="525" y="150" font-size="14" font-weight="600" fill="#34c759">같으면 로그인 성공</text>
<text x="230" y="200" font-size="12" fill="#6e6e73">비밀번호 원문은 어디에도 저장하지 않는다.</text><text x="230" y="218" font-size="12" fill="#6e6e73">솔트가 계정마다 달라 같은 비밀번호도 해시가 다르다.</text>
</g></svg>
