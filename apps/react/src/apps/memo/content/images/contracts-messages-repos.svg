<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>화면은 ConversationRepository 하나만 알고, 서버 저장소와 로컬 저장소가 contracts의 같은 Thread·Message 모양을 돌려준다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="760" height="500" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">저장소는 둘, 모양은 하나</text>
<text x="32" y="56" font-size="11" fill="#6b7280">화면은 어느 저장소인지 모른다. 점선: 같은 스키마를 가져다 쓴다</text>
