<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>OAuth 2.0 인가 코드 흐름</title><rect width="640" height="320" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs><g font-size="13">
<text x="70" y="34" text-anchor="middle" font-weight="600" fill="#1d1d1f">사용자</text><text x="240" y="34" text-anchor="middle" font-weight="600" fill="#1d1d1f">클라이언트 앱</text><text x="420" y="34" text-anchor="middle" font-weight="600" fill="#1d1d1f">인가 서버</text><text x="580" y="34" text-anchor="middle" font-weight="600" fill="#1d1d1f">자원 서버</text>
<text x="420" y="50" text-anchor="middle" font-size="11" fill="#6e6e73">예: 구글 로그인</text><text x="580" y="50" text-anchor="middle" font-size="11" fill="#6e6e73">예: 캘린더 API</text>
<line x1="70" y1="58" x2="70" y2="276" stroke="#c7c7cc" stroke-width="2"/><line x1="240" y1="58" x2="240" y2="276" stroke="#c7c7cc" stroke-width="2"/><line x1="420" y1="58" x2="420" y2="276" stroke="#c7c7cc" stroke-width="2"/><line x1="580" y1="58" x2="580" y2="276" stroke="#c7c7cc" stroke-width="2"/>
<path d="M70 80 H236" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="80" y="74" font-size="12" fill="#1d1d1f">① 로그인 버튼 클릭</text>
<path d="M240 110 H416" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="250" y="104" font-size="12" fill="#1d1d1f">② 인가 요청으로 이동</text>
<path d="M70 140 H416" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><text x="80" y="134" font-size="12" fill="#0a84ff">③ 인가 서버에서 직접 로그인·동의 (비밀번호는 앱에 주지 않음)</text>
<path d="M420 170 H244" stroke="#ff9f0a" stroke-width="2" marker-end="url(#a)"/><text x="270" y="164" font-size="12" fill="#ff9f0a">④ 인가 코드 전달</text>
<path d="M240 200 H416" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="250" y="194" font-size="12" fill="#1d1d1f">⑤ 코드 + 앱 비밀로 교환</text>
<path d="M420 230 H244" stroke="#30d158" stroke-width="2" marker-end="url(#a)"/><text x="270" y="224" font-size="12" fill="#30d158">⑥ 접근 토큰 발급</text>
<path d="M240 264 H576" stroke="#30d158" stroke-width="2" marker-end="url(#a)"/><text x="250" y="258" font-size="12" fill="#30d158">⑦ 토큰으로 허락된 범위(scope)의 API 호출</text>
<text x="320" y="302" text-anchor="middle" font-size="12" fill="#6e6e73">OAuth는 인증 자체보다 "권한 위임(인가)"을 위한 표준이다 (RFC 6749)</text>
</g></svg>
