<rect x="518" y="242" width="108" height="5" rx="2.5" fill="#475569"/>
<rect x="518" y="256" width="144" height="5" rx="2.5" fill="#475569"/>
<rect x="506" y="316" width="168" height="48" fill="#334155"/>
<text x="590.0" y="336" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="middle">홈 · 검색 · 프로필</text>
<rect x="556.0" y="356" width="68" height="4" rx="2" fill="#ffffff"/>
</g>
<rect x="564.0" y="112" width="52" height="14" rx="7" fill="#111827"/>
</svg>
