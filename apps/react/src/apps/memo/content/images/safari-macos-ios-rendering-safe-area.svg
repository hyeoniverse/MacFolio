<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>여백이 없으면 상단 메뉴가 카메라 영역에, 하단 탭 막대가 홈 표시줄에 가려진다. env(safe-area-inset-*)로 여백을 주면 가리지 않는다</title>
<rect width="860" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">노치와 홈 표시줄은 화면을 가린다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">viewport-fit=cover로 화면 끝까지 그리면, 여백을 주지 않은 부분이 카메라 영역과 홈 표시줄에 가려진다 (도식)</text>
<text x="250" y="88" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">여백 없음</text>
<text x="250" y="384" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">padding: 0;</text>
<rect x="160" y="100" width="180" height="270" rx="26" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<clipPath id="s160"><rect x="166" y="106" width="168" height="258" rx="21"/></clipPath>
<g clip-path="url(#s160)">
<rect x="166" y="106" width="168" height="258" fill="#1e293b"/>
<text x="174" y="122" font-size="10" fill="#ffffff" font-weight="700" text-anchor="start">메뉴</text>
<text x="326" y="122" font-size="10" fill="#ffffff" font-weight="700" text-anchor="end">설정</text>
<rect x="178" y="156" width="144" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="170" width="126" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="184" width="108" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="198" width="144" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="212" width="126" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="226" width="108" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="240" width="144" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="254" width="126" height="5" rx="2.5" fill="#475569"/>
<rect x="178" y="268" width="108" height="5" rx="2.5" fill="#475569"/>
<rect x="166" y="338" width="168" height="26" fill="#334155"/>
<text x="250.0" y="358" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="middle">홈 · 검색 · 프로필</text>
<rect x="216.0" y="356" width="68" height="4" rx="2" fill="#ffffff"/>
<circle cx="182" cy="118" r="15" fill="none" stroke="#b91c1c" stroke-width="2"/>
<rect x="200.0" y="342" width="100" height="20" rx="6" fill="none" stroke="#b91c1c" stroke-width="2"/>
</g>
<rect x="224.0" y="112" width="52" height="14" rx="7" fill="#111827"/>
<text x="590" y="88" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">safe-area 여백</text>
<text x="590" y="384" font-size="10.5" fill="#15803d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">padding: env(safe-area-inset-*);</text>
<rect x="500" y="100" width="180" height="270" rx="26" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<clipPath id="s500"><rect x="506" y="106" width="168" height="258" rx="21"/></clipPath>
<g clip-path="url(#s500)">
<rect x="506" y="106" width="168" height="258" fill="#1e293b"/>
<text x="520" y="150" font-size="10" fill="#ffffff" font-weight="700" text-anchor="start">메뉴</text>
<text x="660" y="150" font-size="10" fill="#ffffff" font-weight="700" text-anchor="end">설정</text>
<rect x="518" y="172" width="144" height="5" rx="2.5" fill="#475569"/>
<rect x="518" y="186" width="126" height="5" rx="2.5" fill="#475569"/>
<rect x="518" y="200" width="108" height="5" rx="2.5" fill="#475569"/>
