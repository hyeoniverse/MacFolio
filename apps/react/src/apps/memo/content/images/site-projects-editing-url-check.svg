<text x="452" y="66" font-size="12" font-weight="700" fill="#6e6e73">결과</text>
<line x1="24" y1="76" x2="616" y2="76" stroke="#d1d1d6"/>
<g font-size="12" fill="#1d1d1f">
<text x="40" y="102">저장소</text><text x="40" y="142">데모</text><text x="40" y="182">데모</text><text x="40" y="222">데모</text>
<text x="40" y="262">대표 화면</text><text x="40" y="302">대표 화면</text><text x="40" y="342">대표 화면</text>
</g>
<g font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f">
<text x="120" y="102">https://github.com/hyeoniverse/…</text>
<text x="120" y="142">javascript:alert(1)</text>
<text x="120" y="182">data:text/html,&lt;script&gt;…</text>
<text x="120" y="222">http://newpick.example.com</text>
<text x="120" y="262">/imgs/projects/qru/cover.png</text>
<text x="120" y="302">/imgs/a.png" onerror="…</text>
<text x="120" y="342">http://localhost:4000/files/&lt;id&gt;</text>
</g>
<g stroke-width="1.5" fill="#ffffff">
<rect x="444" y="86" width="164" height="24" rx="6" stroke="#34c759"/>
<rect x="444" y="126" width="164" height="24" rx="6" stroke="#ff3b30"/>
<rect x="444" y="166" width="164" height="24" rx="6" stroke="#ff3b30"/>
<rect x="444" y="206" width="164" height="24" rx="6" stroke="#ff3b30"/>
