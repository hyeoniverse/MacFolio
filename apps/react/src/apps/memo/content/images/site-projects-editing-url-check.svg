<rect x="444" y="326" width="164" height="24" rx="6" stroke="#34c759"/>
</g>
<g font-size="12" fill="#1d1d1f">
<text x="454" y="103">통과 (https)</text>
<text x="454" y="143">거절: https가 아님</text>
<text x="454" y="183">거절: https가 아님</text>
<text x="454" y="223">거절: https가 아님</text>
<text x="454" y="263">통과 (사이트 안 경로)</text>
