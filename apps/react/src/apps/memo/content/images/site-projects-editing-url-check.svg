<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>링크 칸과 그림 칸에 넣은 값이 parseProjects 검사에서 통과하거나 거절되는 예. https와 사이트 안 경로, 자기 API 출처는 통과하고 javascript:, data:, http, 따옴표가 든 경로는 거절된다</title>
<rect width="640" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">parseProjects가 주소 칸을 검사하는 예</text>
