<text x="420" y="260" font-size="10.5" fill="#6b7280" text-anchor="middle">서버는 Nest와 DB에 의존하지 않는 activity.ts에서 HTML·이벤트를 다듬고, 화면은 githubActivityApi.ts에서 주 묶음과 푸시 합치기만 한다</text>
<text x="420" y="282" font-size="10.5" fill="#6b7280" text-anchor="middle">한쪽이 실패하면 그쪽만 이전 값(peek), 둘 다 실패하면 Cached가 마지막 값을 준다</text>
