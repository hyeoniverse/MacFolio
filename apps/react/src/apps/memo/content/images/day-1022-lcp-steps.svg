<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">휴대폰 첫 방문: 차수별 LCP와 전송량</text>
  <text x="20" y="50" font-size="12" fill="#6e6e73">로컬 Lighthouse, 5회 중앙값. 막대 길이는 개선 전 값 대비 비율</text>

  <!-- LCP group -->
  <text x="20" y="84" font-size="13" font-weight="700" fill="#1d1d1f">LCP (가장 큰 요소가 그려진 시각)</text>
  <g font-size="12" fill="#1d1d1f">
    <text x="20" y="110">개선 전</text>
    <rect x="80" y="98" width="440" height="16" rx="3" fill="#ff3b30"/>
    <text x="528" y="110">25.7초</text>
    <text x="20" y="134">1차</text>
    <rect x="80" y="122" width="106" height="16" rx="3" fill="#0a84ff" opacity="0.55"/>
    <text x="194" y="134">6.2초</text>
    <text x="20" y="158">2차</text>
    <rect x="80" y="146" width="99" height="16" rx="3" fill="#0a84ff" opacity="0.75"/>
    <text x="187" y="158">5.8초</text>
    <text x="20" y="182">3차</text>
    <rect x="80" y="170" width="55" height="16" rx="3" fill="#0a84ff"/>
    <text x="143" y="182" font-weight="700">3.2초</text>
  </g>

  <!-- transfer group -->
  <text x="20" y="218" font-size="13" font-weight="700" fill="#1d1d1f">첫 방문 전송량</text>
  <g font-size="12" fill="#1d1d1f">
    <text x="20" y="244">개선 전</text>
    <rect x="80" y="232" width="440" height="16" rx="3" fill="#ff9f0a"/>
    <text x="528" y="244">4,893KB</text>
    <text x="20" y="268">1차</text>
    <rect x="80" y="256" width="91" height="16" rx="3" fill="#34c759" opacity="0.55"/>
    <text x="179" y="268">1,011KB</text>
    <text x="20" y="292">2차</text>
    <rect x="80" y="280" width="65" height="16" rx="3" fill="#34c759" opacity="0.75"/>
    <text x="153" y="292">725KB</text>
    <text x="20" y="316">3차</text>
    <rect x="80" y="304" width="43" height="16" rx="3" fill="#34c759"/>
    <text x="131" y="316" font-weight="700">483KB</text>
  </g>
</svg>
