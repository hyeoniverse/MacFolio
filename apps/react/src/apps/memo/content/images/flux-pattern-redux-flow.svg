<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="760" height="430" fill="#fff"/>
  <text x="380" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">Redux: Dispatcher 대신 순수 reducer, 바꾸지 않고 새 상태</text>

  <text x="36" y="62" font-size="13" fill="#5b21b6" font-weight="600">흐름</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="76" width="130" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="95" y="100" fill="#1f2937" font-weight="600">UI</text><text x="95" y="118" fill="#6b7280" font-size="10.5">dispatch(action)</text>
    <rect x="200" y="76" width="160" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="280" y="100" fill="#1f2937" font-weight="600">store (하나)</text><text x="280" y="118" fill="#6b7280" font-size="10.5">현재 state 보관</text>
    <rect x="400" y="76" width="160" height="58" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="480" y="100" fill="#1f2937" font-weight="600">reducer(state, action)</text><text x="480" y="118" fill="#6b7280" font-size="10.5">순수 함수 → 새 state</text>
    <rect x="600" y="76" width="130" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="665" y="100" fill="#1f2937" font-weight="600">구독자</text><text x="665" y="118" fill="#6b7280" font-size="10.5">react-redux 등</text>
  </g>
  <line x1="162" y1="105" x2="196" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="362" y1="98" x2="396" y2="98" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="398" y1="114" x2="364" y2="114" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <path d="M280,134 C280,170 665,170 665,138" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <text x="472" y="178" font-size="11" fill="#5b21b6" text-anchor="middle">새 state를 저장하고 구독자에게 알린다 → 구독자가 다시 읽고 렌더링</text>

  <text x="36" y="222" font-size="13" fill="#5b21b6" font-weight="600">상태 스냅숏: 이전 객체를 고치지 않는다</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="238" width="190" height="96" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="125" y="258" fill="#1f2937" font-weight="600">state₀</text>
    <text x="125" y="280" fill="#374151">todos: [ ]</text>
    <text x="125" y="298" fill="#374151">filter: 'all'</text>
    <text x="125" y="320" fill="#9ca3af">객체 #1</text>
    <rect x="285" y="238" width="190" height="96" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="380" y="258" fill="#1f2937" font-weight="600">state₁</text>
    <text x="380" y="280" fill="#374151">todos: [ '우유' ]</text>
    <text x="380" y="298" fill="#374151">filter: 'all'</text>
    <text x="380" y="320" fill="#9ca3af">객체 #2 (filter는 #1과 같은 값)</text>
    <rect x="540" y="238" width="190" height="96" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="635" y="258" fill="#1f2937" font-weight="600">state₂</text>
    <text x="635" y="280" fill="#374151">todos: [ '우유' ]</text>
    <text x="635" y="298" fill="#374151">filter: 'done'</text>
    <text x="635" y="320" fill="#9ca3af">객체 #3</text>
    <line x1="222" y1="286" x2="281" y2="286" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
    <text x="252" y="276" fill="#5b21b6">todo/add</text>
    <line x1="477" y1="286" x2="536" y2="286" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
    <text x="507" y="276" fill="#5b21b6">filter/set</text>
  </g>
  <rect x="30" y="352" width="700" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="380" y="376" font-size="11.5" fill="#374151" text-anchor="middle">reducer가 기존 객체를 수정하지 않고 새 객체를 돌려주므로 state₀·state₁·state₂가 모두 남는다.</text>
  <text x="380" y="396" font-size="11.5" fill="#374151" text-anchor="middle">Action마다 앞뒤 상태를 기록해 되돌아가 보는 것(time travel)은 이 전제 위에서 동작한다</text>
</svg>
