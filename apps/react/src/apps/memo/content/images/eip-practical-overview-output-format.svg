<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>출력 형식에서 공백과 줄바꿈을 확인하는 방법</title><rect width="640" height="380" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">출력은 글자 한 칸씩: 공백(주황 칸)과 줄바꿈(↵)도 답의 일부다</text>
<g font-size="13" fill="#6e6e73"><text x="20" y="66" font-family="ui-monospace, Menlo, monospace">printf("%d ", i); 를 1~3 반복 뒤 printf("|\n");</text></g>
<g font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="middle">
<g fill="#f2f2f7" stroke="#c7c7cc"><rect x="20" y="78" width="26" height="30"/><rect x="72" y="78" width="26" height="30"/><rect x="124" y="78" width="26" height="30"/><rect x="176" y="78" width="26" height="30"/></g>
<g fill="#fff4e5" stroke="#ff9f0a"><rect x="46" y="78" width="26" height="30"/><rect x="98" y="78" width="26" height="30"/><rect x="150" y="78" width="26" height="30"/></g>
<g fill="#1d1d1f"><text x="33" y="99">1</text><text x="85" y="99">2</text><text x="137" y="99">3</text><text x="189" y="99">|</text></g><text x="216" y="99" fill="#6e6e73">↵</text>
</g>
<text x="250" y="98" font-size="13" fill="#1d1d1f">3 뒤에도 공백이 하나 있다</text>
<g font-size="13" fill="#6e6e73"><text x="20" y="150" font-family="ui-monospace, Menlo, monospace">print([1, 2, 3])</text></g>
<g font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="middle">
<g fill="#f2f2f7" stroke="#c7c7cc"><rect x="20" y="162" width="26" height="30"/><rect x="46" y="162" width="26" height="30"/><rect x="72" y="162" width="26" height="30"/><rect x="124" y="162" width="26" height="30"/><rect x="150" y="162" width="26" height="30"/><rect x="202" y="162" width="26" height="30"/><rect x="228" y="162" width="26" height="30"/></g>
<g fill="#fff4e5" stroke="#ff9f0a"><rect x="98" y="162" width="26" height="30"/><rect x="176" y="162" width="26" height="30"/></g>
<g fill="#1d1d1f"><text x="33" y="183">[</text><text x="59" y="183">1</text><text x="85" y="183">,</text><text x="137" y="183">2</text><text x="163" y="183">,</text><text x="215" y="183">3</text><text x="241" y="183">]</text></g><text x="268" y="183" fill="#6e6e73">↵</text>
</g>
<text x="300" y="182" font-size="13" fill="#1d1d1f">쉼표 뒤마다 공백, 대괄호까지 쓴다</text>
<g font-size="13" fill="#6e6e73"><text x="20" y="234" font-family="ui-monospace, Menlo, monospace">System.out.println("A" + 1 + 2);  System.out.println(1 + 2 + "A");</text></g>
<g font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="middle">
<g fill="#f2f2f7" stroke="#c7c7cc"><rect x="20" y="246" width="26" height="30"/><rect x="46" y="246" width="26" height="30"/><rect x="72" y="246" width="26" height="30"/><rect x="330" y="246" width="26" height="30"/><rect x="356" y="246" width="26" height="30"/></g>
<g fill="#1d1d1f"><text x="33" y="267">A</text><text x="59" y="267">1</text><text x="85" y="267">2</text><text x="343" y="267">3</text><text x="369" y="267">A</text></g><text x="112" y="267" fill="#6e6e73">↵</text><text x="396" y="267" fill="#6e6e73">↵</text>
</g>
<g font-size="12" fill="#6e6e73"><text x="20" y="298">왼쪽부터 문자열이 먼저 나오면</text><text x="20" y="314">뒤의 숫자도 문자열로 이어 붙는다</text><text x="330" y="298">숫자끼리 먼저 더한 3에</text><text x="330" y="314">문자열 A가 붙는다</text></g>
<rect x="20" y="334" width="600" height="34" rx="8" fill="#e8f2ff"/><text x="320" y="356" text-anchor="middle" font-size="13" fill="#0a84ff">모든 출력은 gcc, java, python3로 실제 실행한 결과다</text>
</svg>
