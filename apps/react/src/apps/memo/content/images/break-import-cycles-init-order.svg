<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>순환 의존이 undefined를 만드는 순서</title>
<rect width="640" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="700" fill="#1f2937">값을 가져오면 왜 깨지나: 모듈이 읽히는 순서</text>
<text x="32" y="62" font-size="12" fill="#6b7280">a.ts가 b.ts를 import하고, b.ts가 a.ts의 LABEL을 쓰는 경우</text>
<!-- a.ts column -->
<rect x="32" y="84" width="270" height="200" rx="12" fill="#f9fafb"/>
<text x="48" y="108" font-size="13" font-weight="700" fill="#1f2937">a.ts</text>
<text x="48" y="136" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">import { draw } from './b';</text>
<text x="48" y="160" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">export const LABEL = '받은 편지함';</text>
<text x="48" y="184" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">draw();</text>
<!-- b.ts column -->
<rect x="338" y="84" width="270" height="200" rx="12" fill="#f9fafb"/>
<text x="354" y="108" font-size="13" font-weight="700" fill="#1f2937">b.ts</text>
<text x="354" y="136" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">import { LABEL } from './a';</text>
<text x="354" y="160" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">const title = LABEL + '!';</text>
<text x="354" y="184" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">export const draw = () =&gt; title;</text>
<!-- step badges -->
<circle cx="292" cy="131" r="10" fill="#4f46e5"/><text x="292" y="135" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="598" cy="131" r="10" fill="#4f46e5"/><text x="598" y="135" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="598" cy="155" r="10" fill="#ef4444"/><text x="598" y="159" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="292" cy="155" r="10" fill="#9ca3af"/><text x="292" y="159" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<!-- captions -->
<text x="48" y="222" font-size="11.5" fill="#374151">1  a.ts를 읽다가 첫 줄에서 b.ts로 들어간다</text>
<text x="48" y="240" font-size="11.5" fill="#374151">2  b.ts가 a.ts를 다시 찾지만 a.ts는 "읽는 중"이라 되돌아오지 않는다</text>
<text x="48" y="258" font-size="11.5" fill="#ef4444">3  LABEL은 아직 만들어지기 전 → undefined + '!' = "undefined!"</text>
<text x="48" y="276" font-size="11.5" fill="#374151">4  그제야 a.ts의 LABEL이 만들어진다. 이미 늦었다</text>
<text x="32" y="310" font-size="11.5" fill="#6b7280">타입만 가져올 때는 실행 시 사라져서 괜찮지만, 상수·함수를 가져오면 import 순서에 따라 이렇게 된다</text>
</svg>
