<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>같은 화면을 여러 번 고친 곳</title>
<rect width="760" height="384" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="18" font-weight="700" fill="#1f2937">한 PR 안에서 여러 번 수정한 곳</text>
<text x="32" y="62" font-size="12.5" fill="#6b7280">점 하나가 커밋 하나, 위 숫자는 커밋한 시각. 화면을 확인한 결과에 따라 방향을 바꿨다</text>
<text x="32" y="102" font-size="13" font-weight="600" fill="#374151">상태 표시줄 밑 사진·팁 (#335)</text>
<path d="M100 128 H520.0" stroke="#d1d5db" stroke-width="2"/>
<circle cx="100.0" cy="128" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="100.0" y="116" font-size="10.5" fill="#6b7280" text-anchor="middle">11:12</text>
<text x="100.0" y="152" font-size="11" fill="#374151" text-anchor="middle">여백 추가</text>
<circle cx="240.0" cy="128" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="240.0" y="116" font-size="10.5" fill="#6b7280" text-anchor="middle">11:46</text>
<text x="240.0" y="152" font-size="11" fill="#374151" text-anchor="middle">탭을 밑 버튼에 전달</text>
<circle cx="380.0" cy="128" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="380.0" y="116" font-size="10.5" fill="#6b7280" text-anchor="middle">12:09</text>
<text x="380.0" y="152" font-size="11" fill="#374151" text-anchor="middle">앱 화면을 아래로</text>
<circle cx="520.0" cy="128" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="520.0" y="116" font-size="10.5" fill="#6b7280" text-anchor="middle">12:28</text>
<text x="520.0" y="152" font-size="11" fill="#374151" text-anchor="middle">구조 되돌림, 보관함만 여백</text>
<text x="32" y="194" font-size="13" font-weight="600" fill="#374151">스크롤 가장자리 흐림 (#335)</text>
<path d="M100 220 H660.0" stroke="#d1d5db" stroke-width="2"/>
<circle cx="100.0" cy="220" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="100.0" y="208" font-size="10.5" fill="#6b7280" text-anchor="middle">13:40</text>
<text x="100.0" y="244" font-size="11" fill="#374151" text-anchor="middle">흐림 추가</text>
<circle cx="240.0" cy="220" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="240.0" y="208" font-size="10.5" fill="#6b7280" text-anchor="middle">13:54</text>
<text x="240.0" y="244" font-size="11" fill="#374151" text-anchor="middle">범위 축소</text>
<circle cx="380.0" cy="220" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="380.0" y="208" font-size="10.5" fill="#6b7280" text-anchor="middle">14:10</text>
<text x="380.0" y="244" font-size="11" fill="#374151" text-anchor="middle">3층</text>
<circle cx="520.0" cy="220" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="520.0" y="208" font-size="10.5" fill="#6b7280" text-anchor="middle">14:35</text>
<text x="520.0" y="244" font-size="11" fill="#374151" text-anchor="middle">약하게 + 곡선 마스크</text>
<circle cx="660.0" cy="220" r="6" fill="#fde68a" stroke="#9ca3af"/>
<text x="660.0" y="208" font-size="10.5" fill="#6b7280" text-anchor="middle">14:56</text>
<text x="660.0" y="244" font-size="11" fill="#374151" text-anchor="middle">5층, 색 보정 제거</text>
<text x="32" y="286" font-size="13" font-weight="600" fill="#374151">편집기 링크 이동 상자 (#339)</text>
<path d="M100 312 H660.0" stroke="#d1d5db" stroke-width="2"/>
<circle cx="100.0" cy="312" r="6" fill="#fbcfe8" stroke="#9ca3af"/>
<text x="100.0" y="300" font-size="10.5" fill="#6b7280" text-anchor="middle">14:31</text>
<text x="100.0" y="336" font-size="11" fill="#374151" text-anchor="middle">링크 위 상자</text>
<circle cx="240.0" cy="312" r="6" fill="#fbcfe8" stroke="#9ca3af"/>
<text x="240.0" y="300" font-size="10.5" fill="#6b7280" text-anchor="middle">14:48</text>
<text x="240.0" y="336" font-size="11" fill="#374151" text-anchor="middle">링크 끝 글줄 안</text>
<circle cx="380.0" cy="312" r="6" fill="#fbcfe8" stroke="#9ca3af"/>
<text x="380.0" y="300" font-size="10.5" fill="#6b7280" text-anchor="middle">14:59</text>
<text x="380.0" y="336" font-size="11" fill="#374151" text-anchor="middle">다시 링크 위, 간격 18px</text>
<circle cx="520.0" cy="312" r="6" fill="#fbcfe8" stroke="#9ca3af"/>
<text x="520.0" y="300" font-size="10.5" fill="#6b7280" text-anchor="middle">15:10</text>
<text x="520.0" y="336" font-size="11" fill="#374151" text-anchor="middle">편집기 안쪽으로 밀기</text>
<circle cx="660.0" cy="312" r="6" fill="#fbcfe8" stroke="#9ca3af"/>
<text x="660.0" y="300" font-size="10.5" fill="#6b7280" text-anchor="middle">15:11</text>
<text x="660.0" y="336" font-size="11" fill="#374151" text-anchor="middle">옅은 그림자</text>
</svg>
