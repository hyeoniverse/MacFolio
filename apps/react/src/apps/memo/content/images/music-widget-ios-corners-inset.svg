<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>블러 배경 의사 요소를 위젯보다 크게 배치하는 이유</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="350" fill="#ffffff"/>
<text x="24" y="30" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">filter: blur(28px)는 가장자리를 투명하게 번지게 한다 (위젯 안쪽만 보이게 자른 결과)</text>
<text x="150" y="62" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">inset: 0 (위젯과 같은 크기)</text>
<defs><filter id="g20" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<defs><clipPath id="cg20"><rect x="60" y="100" width="180" height="150" rx="22"/></clipPath></defs>
<rect x="60" y="100" width="180" height="150" rx="22" fill="#ffffff"/>
<g clip-path="url(#cg20)"><rect x="60" y="100" width="180" height="150" fill="#5e4b8b" filter="url(#g20)"/></g>
<rect x="60" y="100" width="180" height="150" fill="none" stroke="#ff9f0a" stroke-width="1.4" stroke-dasharray="5 3"/>
<rect x="60" y="100" width="180" height="150" rx="22" fill="none" stroke="#0a84ff" stroke-width="2.2"/>
<text x="470" y="62" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">inset: -30px (사방으로 30px 확장)</text>
<defs><filter id="g340" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<defs><clipPath id="cg340"><rect x="380" y="100" width="180" height="150" rx="22"/></clipPath></defs>
<rect x="380" y="100" width="180" height="150" rx="22" fill="#ffffff"/>
<g clip-path="url(#cg340)"><rect x="350" y="70" width="240" height="210" fill="#5e4b8b" filter="url(#g340)"/></g>
<rect x="350" y="70" width="240" height="210" fill="none" stroke="#ff9f0a" stroke-width="1.4" stroke-dasharray="5 3"/>
<rect x="380" y="100" width="180" height="150" rx="22" fill="none" stroke="#0a84ff" stroke-width="2.2"/>
<text x="150" y="300" font-size="12" fill="#ff3b30" text-anchor="middle">위젯 안쪽 가장자리가 흐려져 밝게 비친다</text>
<text x="470" y="300" font-size="12" fill="#34c759" text-anchor="middle">흐려진 가장자리는 위젯 바깥에 놓인다</text>
<rect x="24" y="318" width="14" height="14" rx="3" fill="none" stroke="#0a84ff" stroke-width="2"/>
<text x="44" y="330" font-size="12" fill="#6e6e73" text-anchor="start">위젯 경계(border-radius, overflow: hidden)</text>
<rect x="330" y="318" width="14" height="14" rx="0" fill="none" stroke="#ff9f0a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="350" y="330" font-size="12" fill="#6e6e73" text-anchor="start">::before 상자(블러 전)</text>
</svg>
