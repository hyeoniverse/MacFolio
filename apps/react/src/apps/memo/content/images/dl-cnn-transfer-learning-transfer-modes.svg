<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">같은 신경망을 학습하는 세 가지 방식</text>
  <g font-size="12" fill="#1d1d1f" text-anchor="middle">
    <!-- 열 제목 -->
    <text x="115" y="56" font-size="13" font-weight="600">처음부터 학습</text>
    <text x="320" y="56" font-size="13" font-weight="600">특징 추출</text>
    <text x="525" y="56" font-size="13" font-weight="600">미세 조정</text>
    <text x="115" y="74" fill="#6e6e73">무작위 초기 가중치</text>
    <text x="320" y="74" fill="#6e6e73">ImageNet 가중치</text>
    <text x="525" y="74" fill="#6e6e73">ImageNet 가중치</text>
    <!-- 분류층 -->
    <rect x="30" y="88" width="170" height="54" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="115" y="110">분류층</text><text x="115" y="128" fill="#0a84ff">학습</text>
    <rect x="235" y="88" width="170" height="54" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="320" y="110">새 분류층</text><text x="320" y="128" fill="#0a84ff">학습</text>
    <rect x="440" y="88" width="170" height="54" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="525" y="110">Dense 1024 → Dense 120</text><text x="525" y="128" fill="#0a84ff">학습</text>
    <!-- 백본 -->
    <rect x="30" y="152" width="170" height="110" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="115" y="196">컨볼루션 백본</text><text x="115" y="216" fill="#0a84ff">전부 학습</text>
    <rect x="235" y="152" width="170" height="110" rx="8" fill="#f2f2f7" stroke="#6e6e73" stroke-dasharray="5 4"/>
    <text x="320" y="196">컨볼루션 백본</text><text x="320" y="216" fill="#6e6e73">동결 (trainable=False)</text>
    <rect x="440" y="152" width="170" height="110" rx="8" fill="#eaf8ee" stroke="#34c759" stroke-width="1.5"/>
    <text x="525" y="188">DenseNet121 백본</text><text x="525" y="208" fill="#248a3d">아주 작은 학습률로</text><text x="525" y="226" fill="#248a3d">함께 학습 (1e-6)</text>
    <!-- 설명 -->
    <text x="115" y="290">대규모 데이터가 필요하다</text>
    <text x="115" y="308" fill="#6e6e73">ImageNet 훈련 영상 약 128만 장</text>
    <text x="320" y="290">학습이 가장 빠르다</text>
    <text x="320" y="308" fill="#6e6e73">백본 특징은 바뀌지 않는다</text>
    <text x="525" y="290">본문의 견종 인식 예제</text>
    <text x="525" y="308" fill="#6e6e73">200세대, 검증 정확률 82.73%</text>
  </g>
</svg>
