<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>int 배열에서 포인터에 1을 더하면 주소가 4바이트씩 증가하는 모습</title><rect width="640" height="330" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="320" y="28" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">int arr[5] = {10, 20, 30, 40, 50};  int *q = arr;</text>
<rect x="80" y="110" width="96" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="128.0" y="137.8" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">10</text>
<text x="128" y="174" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0x100</text>
<text x="128" y="194" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">arr[0]</text>
<text x="128" y="212" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*(arr+0)</text>
<rect x="176" y="110" width="96" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="224.0" y="137.8" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">20</text>
<text x="224" y="174" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0x104</text>
<text x="224" y="194" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">arr[1]</text>
<text x="224" y="212" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*(arr+1)</text>
<rect x="272" y="110" width="96" height="44" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="320.0" y="137.8" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">30</text>
<text x="320" y="174" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0x108</text>
<text x="320" y="194" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">arr[2]</text>
<text x="320" y="212" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*(arr+2)</text>
<rect x="368" y="110" width="96" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="416.0" y="137.8" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">40</text>
<text x="416" y="174" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0x10C</text>
<text x="416" y="194" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">arr[3]</text>
<text x="416" y="212" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*(arr+3)</text>
<rect x="464" y="110" width="96" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="512.0" y="137.8" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">50</text>
<text x="512" y="174" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0x110</text>
<text x="512" y="194" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">arr[4]</text>
<text x="512" y="212" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*(arr+4)</text>
<text x="128" y="64" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">q</text>
<path d="M128 72 V104" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)"/>
<text x="224" y="64" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">q+1</text>
<path d="M224 72 V104" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)"/>
<text x="320" y="64" font-size="13" fill="#ff9f0a" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">q+2</text>
<path d="M320 72 V104" fill="none" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#mff9f0a)"/>
<text x="416" y="64" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">q+3</text>
<path d="M416 72 V104" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)"/>
<text x="512" y="64" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">q+4</text>
<path d="M512 72 V104" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)"/>
<text x="320" y="248" font-size="13" fill="#ff9f0a" text-anchor="middle" font-weight="600">q + 2 는 0x100 + 2 × sizeof(int) = 0x108, 따라서 *(q + 2) = 30</text>
<text x="320" y="272" font-size="13" fill="#1d1d1f" text-anchor="middle">*q + 2 는 (*q) + 2 = 12: 역참조가 덧셈보다 먼저</text>
<text x="320" y="296" font-size="13" fill="#1d1d1f" text-anchor="middle">q[3] 은 *(q + 3) 과 같은 뜻 = 40</text>
</svg>
