<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="450" fill="#fff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  </defs>
  <!-- 계층 배경 -->
  <g fill="#f2f2f7">
    <rect x="10" y="14" width="530" height="62" rx="8"/>
    <rect x="10" y="104" width="530" height="62" rx="8"/>
    <rect x="10" y="194" width="530" height="62" rx="8"/>
    <rect x="10" y="296" width="530" height="62" rx="8"/>
  </g>
  <line x1="10" y1="276" x2="630" y2="276" stroke="#6e6e73" stroke-width="1.2" stroke-dasharray="8 5"/>
  <g font-size="14" font-weight="600" fill="#6e6e73">
    <text x="556" y="50">응용</text>
    <text x="556" y="140">트랜스포트</text>
    <text x="556" y="230">네트워크</text>
    <text x="556" y="332">링크</text>
  </g>
  <g fill="#fff" stroke="#1d1d1f" stroke-width="1.2">
    <rect x="24" y="24" width="110" height="42" rx="5"/>
    <rect x="152" y="24" width="110" height="42" rx="5"/>
    <rect x="280" y="24" width="110" height="42" rx="5"/>
    <rect x="408" y="24" width="110" height="42" rx="5"/>
    <rect x="150" y="114" width="110" height="42" rx="5" stroke="#0a84ff" stroke-width="1.6"/>
    <rect x="370" y="114" width="110" height="42" rx="5" stroke="#0a84ff" stroke-width="1.6"/>
    <rect x="40" y="204" width="110" height="42" rx="5"/>
    <rect x="220" y="204" width="110" height="42" rx="5" stroke="#ff9f0a" stroke-width="2"/>
    <rect x="400" y="204" width="110" height="42" rx="5"/>
    <rect x="40" y="306" width="110" height="42" rx="5"/>
    <rect x="220" y="306" width="110" height="42" rx="5"/>
    <rect x="400" y="306" width="110" height="42" rx="5"/>
  </g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <text x="79" y="50">사용자 프로세스</text>
    <text x="207" y="50">사용자 프로세스</text>
    <text x="335" y="50">사용자 프로세스</text>
    <text x="463" y="50">사용자 프로세스</text>
    <text x="205" y="140" font-weight="600">TCP</text>
    <text x="425" y="140" font-weight="600">UDP</text>
    <text x="95" y="230" font-weight="600">ICMP</text>
    <text x="275" y="230" font-weight="600">IP</text>
    <text x="455" y="230" font-weight="600">IGMP</text>
    <text x="95" y="332" font-weight="600">ARP</text>
    <text x="275" y="324">하드웨어</text>
    <text x="275" y="340">인터페이스</text>
    <text x="455" y="332" font-weight="600">RARP</text>
    <text x="275" y="438" fill="#6e6e73">매체</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.4" fill="none" marker-start="url(#k)" marker-end="url(#k)">
    <!-- 응용 ↔ 트랜스포트·네트워크 -->
    <line x1="79" y1="70" x2="95" y2="200"/>
    <line x1="207" y1="70" x2="205" y2="110"/>
    <line x1="335" y1="70" x2="290" y2="200"/>
    <line x1="463" y1="70" x2="432" y2="110"/>
    <!-- 트랜스포트 ↔ IP -->
    <line x1="215" y1="160" x2="255" y2="200"/>
    <line x1="410" y1="160" x2="310" y2="200"/>
    <!-- 네트워크 내부 -->
    <line x1="154" y1="225" x2="216" y2="225"/>
    <line x1="334" y1="225" x2="396" y2="225"/>
    <!-- IP ↔ 하드웨어 -->
    <line x1="275" y1="250" x2="275" y2="302"/>
    <!-- 링크 내부 -->
    <line x1="154" y1="327" x2="216" y2="327"/>
    <line x1="334" y1="327" x2="396" y2="327"/>
    <!-- 매체 -->
    <line x1="275" y1="352" x2="275" y2="420"/>
  </g>
</svg>
