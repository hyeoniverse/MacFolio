<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>pathLength 1과 stroke-dasharray 1로 그린 선이 non-scaling-stroke 때문에 화면 픽셀 기준으로 계산되어, 600 폭 SVG를 950px로 늘리면 600/950, 약 63%에서 끝난다</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="840" height="260" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">그래프 선이 63%에서 끊긴 까닭</text>
<rect x="32" y="64" width="240" height="70" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="152.0" y="88.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">SVG viewBox 폭 600</text>
<text x="152.0" y="103.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">pathLength="1"</text>
<text x="152.0" y="118.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">stroke-dasharray: 1</text>
<rect x="300" y="64" width="240" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="420.0" y="88.0" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">vector-effect:</text>
<text x="420.0" y="103.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">non-scaling-stroke</text>
<text x="420.0" y="118.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">점선 길이를 화면 기준으로</text>
<rect x="568" y="64" width="240" height="70" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="688.0" y="88.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">화면 폭 약 950px로</text>
<text x="688.0" y="103.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">가로로 늘림</text>
<text x="688.0" y="118.0" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">preserveAspectRatio="none"</text>
<path d="M272 99 L298 99" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<path d="M540 99 L566 99" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<text x="32" y="162" font-size="11" font-weight="700" fill="#9f1239" text-anchor="start">전</text>
<path d="M60 190 C 200 160, 300 200, 470 175" stroke="#4f46e5" stroke-width="2.5" fill="none"/>
<path d="M470 175 C 600 155, 700 195, 800 170" stroke="#c7d2fe" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>
<path d="M470 146 L470 210" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
<text x="476" y="156" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">600/950 ≈ 63%에서 끝</text>
<text x="32" y="236" font-size="10.5" font-weight="500" fill="#065f46" text-anchor="start">후: 점선 길이 대신 clip-path: inset(0 100% 0 0) → inset(0 0 0 0)으로 왼쪽부터 드러낸다. pathLength를 빼자 순방문자 점선(4 3)도 돌아왔다.</text>
</svg>
