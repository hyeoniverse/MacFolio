<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>손잡이 끌기의 흐름</title>
  <rect width="760" height="300" rx="16" fill="#ffffff"/>
  <text x="32" y="42" font-size="18" font-weight="700" fill="#1f2937">끄는 동안은 화면만, 손을 뗄 때 한 번 저장</text>
  <text x="32" y="64" font-size="12" fill="#6b7280">PaneResizer의 포인터 이벤트와 Memo.tsx 상태</text>
  <g font-size="13" text-anchor="middle">
    <rect x="32" y="96" width="160" height="78" rx="10" fill="#eef0ff"/>
    <text x="112" y="122" font-weight="600" fill="#3f46c7">pointerdown</text>
    <text x="112" y="142" font-size="11" fill="#374151">setPointerCapture</text>
    <text x="112" y="158" font-size="11" fill="#374151">max = roomFor() 한 번 계산</text>
    <rect x="222" y="96" width="160" height="78" rx="10" fill="#f3f4f6"/>
    <text x="302" y="122" font-weight="600" fill="#1f2937">pointermove</text>
    <text x="302" y="142" font-size="11" fill="#374151">시작 너비 + 이동 거리</text>
    <text x="302" y="158" font-size="11" fill="#374151">→ 범위·max로 자름 → onResize</text>
    <rect x="412" y="96" width="150" height="78" rx="10" fill="#dcfce7"/>
    <text x="487" y="122" font-weight="600" fill="#15803d">pointerup</text>
    <text x="487" y="142" font-size="11" fill="#374151">onCommit</text>
    <text x="487" y="158" font-size="11" fill="#374151">→ localStorage 저장</text>
    <rect x="592" y="96" width="136" height="78" rx="10" fill="#fee2e2"/>
    <text x="660" y="122" font-weight="600" fill="#b91c1c">pointercancel</text>
    <text x="660" y="142" font-size="11" fill="#374151">처음 너비로 되돌림</text>
    <text x="660" y="158" font-size="11" fill="#374151">저장하지 않음</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <path d="M192 135 H218"/><path d="M382 135 H408"/>
    <path d="M302 174 V196 H660 V178"/>
  </g>
  <rect x="32" y="214" width="696" height="58" rx="10" fill="#fff7ed"/>
  <text x="48" y="238" font-size="12" fill="#9a3412" font-weight="600">down~up/cancel 사이: .memo[data-resizing]</text>
  <text x="48" y="258" font-size="12" fill="#374151">grid-template-columns transition 끔 · 커서 col-resize 고정 · 글자 선택 막음</text>
</svg>
