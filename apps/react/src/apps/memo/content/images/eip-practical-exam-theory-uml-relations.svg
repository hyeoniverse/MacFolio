<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>UML 관계 표기</title><rect width="640" height="300" fill="#fff"/><defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12z" fill="#fff" stroke="#1d1d1f"/></marker><marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1 5L8 0L15 5L8 10z" fill="#1d1d1f"/></marker><marker id="odia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1 5L8 0L15 5L8 10z" fill="#fff" stroke="#1d1d1f"/></marker></defs>
<g font-size="13">
<text x="160" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">합성 (Composition)</text>
<rect x="40" y="50" width="90" height="34" fill="#e8f2ff" stroke="#0a84ff"/><text x="85" y="72" text-anchor="middle" fill="#1d1d1f">대학교</text>
<rect x="200" y="50" width="90" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="245" y="72" text-anchor="middle" fill="#1d1d1f">학과</text>
<line x1="130" y1="67" x2="200" y2="67" stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#dia)"/>
<text x="165" y="110" text-anchor="middle" fill="#6e6e73">채운 마름모, 전체와 함께 삭제</text>
<text x="480" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">집약 (Aggregation)</text>
<rect x="360" y="50" width="90" height="34" fill="#e8f2ff" stroke="#0a84ff"/><text x="405" y="72" text-anchor="middle" fill="#1d1d1f">동아리</text>
<rect x="520" y="50" width="90" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="565" y="72" text-anchor="middle" fill="#1d1d1f">학생</text>
<line x1="450" y1="67" x2="520" y2="67" stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#odia)"/>
<text x="485" y="110" text-anchor="middle" fill="#6e6e73">빈 마름모, 부분은 독립 존재</text>
<line x1="40" y1="135" x2="600" y2="135" stroke="#f2f2f7" stroke-width="2"/>
<text x="160" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">일반화 (Generalization)</text>
<rect x="115" y="180" width="90" height="34" fill="#e8f2ff" stroke="#0a84ff"/><text x="160" y="202" text-anchor="middle" fill="#1d1d1f">결제</text>
<rect x="115" y="246" width="90" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="160" y="268" text-anchor="middle" fill="#1d1d1f">카드결제</text>
<line x1="160" y1="246" x2="160" y2="216" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#tri)"/>
<text x="215" y="236" fill="#6e6e73">실선 + 빈 삼각형</text>
<text x="480" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">실체화 (Realization)</text>
<rect x="400" y="180" width="160" height="34" fill="#e8f2ff" stroke="#0a84ff"/><text x="480" y="202" text-anchor="middle" fill="#1d1d1f">«interface» 결제수단</text>
<rect x="435" y="246" width="90" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="480" y="268" text-anchor="middle" fill="#1d1d1f">카드</text>
<line x1="480" y1="246" x2="480" y2="216" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tri)"/>
<text x="535" y="236" fill="#6e6e73">점선 + 빈 삼각형</text>
</g></svg>
