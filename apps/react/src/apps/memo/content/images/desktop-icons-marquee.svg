<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>1440×900 화면 오른쪽 위에서 (1430,180)부터 (1300,250)까지 왼쪽 아래로 끌면 rectFrom이 left 1300, top 180, right 1430, bottom 250 사각형을 만들고, 이 사각형과 겹치는 두 번째·세 번째 아이콘이 선택된다</title>
<rect width="640" height="400" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">끄는 방향과 관계없이 같은 사각형</text>
<text x="24" y="56" font-size="12" fill="#6e6e73">1440×900 화면의 오른쪽 위 일부 (x 1240~1440, y 0~340). 가로 1.6배, 세로 0.9배로 그림</text>
<!-- region: x 1240..1440 -> 40..360 (scale 1.6); y 0..340 -> 70..? scale 1 -> use 0.9? use same 1 for simplicity: y*0.9+70 -->
<rect x="40" y="70" width="320" height="306" fill="#f2f2f7" stroke="#6e6e73"/>
<rect x="40" y="70" width="320" height="30.6" fill="#6e6e73" opacity="0.25"/>
<text x="200" y="90" font-size="12" fill="#1d1d1f" text-anchor="middle">메뉴 막대 (34px)</text>
<!-- icon hit rects: x 1346..1414 -> 40+(106*1.6)=209.6 .. 40+174*1.6=318.4 ; y 36..126 ->102.4..183.4 ; 136..226->192.4..273.4; 236..326 ->282.4..363.4 -->
<g fill="#ffffff" stroke="#6e6e73">
<rect x="209.6" y="102.4" width="108.8" height="81"/>
<rect x="209.6" y="192.4" width="108.8" height="81"/>
<rect x="209.6" y="282.4" width="108.8" height="81"/>
</g>
<text x="264" y="148" font-size="12" fill="#6e6e73" text-anchor="middle">아이콘 1</text>
<!-- selected -->
<rect x="209.6" y="192.4" width="108.8" height="81" fill="#0a84ff" opacity="0.18"/>
<rect x="209.6" y="282.4" width="108.8" height="81" fill="#0a84ff" opacity="0.18"/>
<text x="264" y="238" font-size="12" fill="#0a84ff" font-weight="600" text-anchor="middle">아이콘 2 선택</text>
<text x="264" y="330" font-size="12" fill="#0a84ff" font-weight="600" text-anchor="middle">아이콘 3 선택</text>
<!-- band: x 1300..1430 -> 136..344 ; y 180..250 -> 232..295 -->
<rect x="136" y="232" width="208" height="63" fill="#0a84ff" opacity="0.15" stroke="#0a84ff" stroke-width="2" stroke-dasharray="5 3"/>
<circle cx="344" cy="232" r="5" fill="#ff9f0a"/>
<circle cx="136" cy="295" r="5" fill="#ff9f0a"/>
<text x="344" y="222" font-size="12" font-weight="600" fill="#ff9f0a" text-anchor="middle">시작</text>
<text x="128" y="312" font-size="12" font-weight="600" fill="#ff9f0a" text-anchor="end">끝</text>
<!-- right explanation -->
<rect x="384" y="70" width="232" height="306" rx="10" fill="#ffffff" stroke="#f2f2f7" stroke-width="2"/>
<text x="398" y="94" font-size="12" fill="#ff9f0a">시작 (1430, 180) → 끝 (1300, 250)</text><text x="398" y="114" font-size="13" font-weight="700" fill="#1d1d1f">rectFrom(시작, 끝)</text>
<text x="398" y="136" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">left   = min(1430, 1300)</text>
<text x="398" y="152" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">       = 1300</text>
<text x="398" y="170" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">top    = min(180, 250) = 180</text>
<text x="398" y="188" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">right  = 1430</text>
<text x="398" y="206" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">bottom = 250</text>
<text x="398" y="228" font-size="13" font-weight="700" fill="#1d1d1f">아이콘이 보이는 영역</text>
<text x="398" y="250" font-size="12" fill="#1d1d1f">아이콘 1: y 36~126 → 겹치지 않음</text>
<text x="398" y="270" font-size="12" fill="#0a84ff">아이콘 2: y 136~226 → 겹침</text>
<text x="398" y="290" font-size="12" fill="#0a84ff">아이콘 3: y 236~326 → 겹침</text>
<text x="398" y="320" font-size="12" fill="#6e6e73">세 아이콘 모두 x 1346~1414</text>
<text x="398" y="340" font-size="12" fill="#6e6e73">(칸 96px에서 좌우 14px 제외)</text>
</svg>
