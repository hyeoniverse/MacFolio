<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>ESLint는 typescript-eslint 파서를 거쳐 typescript 패키지의 JavaScript API를 호출해 구문 트리와 타입 정보를 얻는다. TS 7은 이 API를 제공하지 않아 린트가 시작되지 않는다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">린트가 typescript 패키지를 사용하는 경로</text>
<rect x="24" y="60" width="120" height="64" rx="10" fill="#f2f2f7"/>
<text x="84" y="88" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">ESLint</text>
<text x="84" y="108" font-size="12" fill="#6e6e73" text-anchor="middle">pnpm lint</text>
<path d="M146 92 L176 92" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="180" y="60" width="170" height="64" rx="10" fill="#f2f2f7"/>
<text x="265" y="88" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">typescript-eslint</text>
<text x="265" y="108" font-size="12" fill="#6e6e73" text-anchor="middle">파서 · 타입 정보 규칙</text>
<path d="M352 92 L382 92" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="367" y="76" font-size="12" fill="#6e6e73" text-anchor="middle">import</text>
<rect x="386" y="60" width="230" height="64" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="400" y="86" font-size="13" font-weight="700" fill="#1d1d1f">typescript (JavaScript API)</text>
<text x="400" y="108" font-size="12" fill="#1d1d1f">ts.createProgram, getTypeChecker …</text>
<text x="24" y="166" font-size="13" font-weight="700" fill="#1d1d1f">typescript 이름에 설치된 버전에 따라</text>
<rect x="24" y="180" width="284" height="124" rx="10" fill="#f2f2f7" stroke="#34c759" stroke-width="2"/>
<text x="40" y="206" font-size="13" font-weight="700" fill="#1d1d1f">5.9 · 6.0</text>
<text x="40" y="230" font-size="12" fill="#1d1d1f">컴파일러가 JavaScript로 작성되어</text>
<text x="40" y="250" font-size="12" fill="#1d1d1f">import한 모듈의 함수를 바로 호출한다</text>
<text x="40" y="282" font-size="12" fill="#34c759">구문 트리 · 타입 정보 반환 → 린트 실행</text>
<rect x="332" y="180" width="284" height="124" rx="10" fill="#f2f2f7" stroke="#ff3b30" stroke-width="2"/>
<text x="348" y="206" font-size="13" font-weight="700" fill="#1d1d1f">7.0</text>
<text x="348" y="230" font-size="12" fill="#1d1d1f">컴파일러가 Go 실행 파일(tsc)이고</text>
<text x="348" y="250" font-size="12" fill="#1d1d1f">JavaScript API를 제공하지 않는다</text>
<text x="348" y="282" font-size="12" fill="#ff3b30">does not support TS 7.0 → 린트 중단</text>
</svg>
