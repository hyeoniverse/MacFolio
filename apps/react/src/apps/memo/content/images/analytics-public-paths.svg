<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>방문자 요청과 관리자 요청이 거치는 길</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="280" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">방문자 요청과 관리자 요청이 거치는 길</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">같은 GET /analytics/summary, 세션 여부로 갈린다</text>
<rect x="32" y="110" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="117.0" y="135.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">GET /summary</text>
<text x="117.0" y="152.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">from, to</text>
<line x1="202" y1="125" x2="300" y2="95" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="251.0" y="104.0" font-size="11" fill="#4f46e5" text-anchor="middle">관리자</text>
<line x1="202" y1="155" x2="300" y2="190" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<text x="251.0" y="190" font-size="11" fill="#b45309" text-anchor="middle">방문자</text>
<rect x="304" y="66" width="250" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="429.0" y="90.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">maintain(now)</text>
<text x="429.0" y="107.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">열 때마다 지난 날 모으기</text>
<rect x="304" y="166" width="250" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="429.0" y="190.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">cached(1분) + maintainIfStale</text>
<text x="429.0" y="207.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">5분에 한 번 모으기</text>
<line x1="554" y1="95" x2="640" y2="95" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<line x1="554" y1="195" x2="640" y2="195" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="644" y="66" width="186" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="737.0" y="90.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">scope: admin</text>
<text x="737.0" y="107.5" font-size="11" fill="#374151" text-anchor="middle">주소·utm 포함</text>
<rect x="644" y="166" width="186" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="737.0" y="190.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">scope: public</text>
<text x="737.0" y="207.5" font-size="11" fill="#374151" text-anchor="middle">ADMIN_ONLY 표는 빔</text>
</svg>
