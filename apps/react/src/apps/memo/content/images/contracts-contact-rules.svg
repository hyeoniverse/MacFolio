<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>연락 메일 규칙: 화면과 서버가 따로 적던 것을 스키마 하나로, 칸마다 처음 어긋난 문구 하나</title>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="640" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">연락 메일의 규칙은 한 벌, 문구도 한 벌</text>
<!-- before -->
<text x="32" y="66" font-size="12" font-weight="600" fill="#ef4444">전</text>
<g font-size="10.5" fill="#374151">
<rect x="56" y="50" width="264" height="58" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="68" y="68" font-weight="600">react · validateContact</text>
<text x="68" y="84">trim · 비었나 · 길이 · 이메일 모양 → 칸마다 문구</text>
<text x="68" y="99">"이름은 30자까지 입력할 수 있습니다."</text>
<rect x="344" y="50" width="264" height="58" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="356" y="68" font-weight="600">api · parseContact</text>
<text x="356" y="84">+ 줄바꿈 통일 · 한 줄 · 제어 문자 · 254자 → 배열</text>
<text x="356" y="99">"이름은 30자까지입니다."  ← 같은 뜻, 다른 문구</text>
</g>
<!-- after -->
<text x="32" y="150" font-size="12" font-weight="600" fill="#4f46e5">후</text>
<rect x="56" y="126" width="232" height="96" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="172" y="148" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">contracts/contact.ts</text>
<text x="172" y="166" font-size="10.5" fill="#374151" text-anchor="middle">ContactInput · ReplyInput</text>
<text x="172" y="181" font-size="10.5" fill="#374151" text-anchor="middle">ContactMail · ContactStatus · ContactSent</text>
<text x="172" y="196" font-size="10.5" fill="#374151" text-anchor="middle">CONTACT_LIMITS · contactText</text>
<text x="172" y="212" font-size="10" fill="#6b7280" text-anchor="middle">칸마다 규칙 목록, 처음 어긋난 것 하나만</text>
<g stroke="#4f46e5" stroke-width="2" fill="none">
<path d="M288 156 H334" marker-end="url(#ok)"/>
<path d="M288 192 H334" marker-end="url(#ok)"/>
</g>
<g font-size="10" fill="#374151">
<rect x="336" y="138" width="272" height="36" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="348" y="153" font-weight="600" fill="#1f2937">apps/react · validateContact</text>
<text x="348" y="167">safeParse → issue.path[0]마다 첫 문구 → 칸 아래에</text>
<rect x="336" y="180" width="272" height="36" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="348" y="195" font-weight="600" fill="#1f2937">apps/api · parse(ContactInput, body)</text>
<text x="348" y="209">같은 issue를 문구 배열로 → 400의 message</text>
</g>
<!-- rule rows -->
<text x="32" y="250" font-size="12" font-weight="600" fill="#1f2937">칸 하나의 규칙 목록 (name)</text>
<g font-size="10" fill="#374151">
<rect x="32" y="260" width="118" height="24" rx="6" fill="#f3f4f6"/><text x="91" y="276" text-anchor="middle">비었나</text>
<rect x="158" y="260" width="118" height="24" rx="6" fill="#f3f4f6"/><text x="217" y="276" text-anchor="middle">30자 이하인가</text>
<rect x="284" y="260" width="118" height="24" rx="6" fill="#f3f4f6"/><text x="343" y="276" text-anchor="middle">한 줄인가</text>
<rect x="410" y="260" width="118" height="24" rx="6" fill="#f3f4f6"/><text x="469" y="276" text-anchor="middle">제어 문자 없나</text>
</g>
<text x="32" y="306" font-size="10.5" fill="#6b7280">순서대로 보다가 처음 어긋난 규칙의 문구만 낸다. 빈 이름에 "30자" 문구가 같이 붙지 않는다</text>
</svg>
