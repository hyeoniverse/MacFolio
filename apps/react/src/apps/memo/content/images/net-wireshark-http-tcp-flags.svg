  <rect x="398" y="264" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="418.0" y="283.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="442" y="264" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="462.0" y="283.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="486" y="264" width="40" height="30" rx="4" fill="#0a84ff"/>
  <text x="506.0" y="283.0" text-anchor="middle" font-size="12" fill="#fff">1</text>
  <text x="588" y="283.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">0x029</text>
  <text x="16" y="320" font-size="12" fill="#1d1d1f">켜진 비트의 값을 더하면 필터 값이 된다. SYN+ACK = 0x10 + 0x02 = 0x012</text>
  <text x="16" y="340" font-size="12" fill="#1d1d1f">XMAS = URG 0x20 + PSH 0x08 + FIN 0x01 = 0x029</text>
  <text x="16" y="360" font-size="12" fill="#6e6e73">CWR·ECE는 혼잡 알림(ECN)용 비트로, 일반 연결 설정·스캔에서는 0이다.</text>
