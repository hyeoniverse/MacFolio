  <text x="374.0" y="64" text-anchor="middle" font-size="12" fill="#6e6e73">0x08</text>
  <text x="418.0" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f">RST</text>
  <text x="418.0" y="64" text-anchor="middle" font-size="12" fill="#6e6e73">0x04</text>
  <text x="462.0" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f">SYN</text>
  <text x="462.0" y="64" text-anchor="middle" font-size="12" fill="#6e6e73">0x02</text>
