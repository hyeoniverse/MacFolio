  <text x="588" y="207.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">0x014</text>
  <text x="16" y="239" font-size="13" font-weight="700" fill="#1d1d1f">NULL 스캔</text>
  <text x="16" y="254" font-size="12" fill="#6e6e73">플래그 없음</text>
  <rect x="178" y="226" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="198.0" y="245.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="222" y="226" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="242.0" y="245.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="266" y="226" width="40" height="30" rx="4" fill="#f2f2f7"/>
