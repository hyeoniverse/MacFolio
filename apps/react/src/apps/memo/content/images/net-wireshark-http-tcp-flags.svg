  <rect x="398" y="226" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="418.0" y="245.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="442" y="226" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="462.0" y="245.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="486" y="226" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="506.0" y="245.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <text x="588" y="245.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">0x000</text>
  <text x="16" y="277" font-size="13" font-weight="700" fill="#1d1d1f">XMAS 스캔</text>
  <text x="16" y="292" font-size="12" fill="#6e6e73">FIN+PSH+URG</text>
  <rect x="178" y="264" width="40" height="30" rx="4" fill="#f2f2f7"/>
