<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="368" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">TCP 플래그 비트와 Wireshark tcp.flags 값</text>
