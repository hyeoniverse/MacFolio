  <rect x="442" y="150" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="462.0" y="169.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="486" y="150" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="506.0" y="169.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <text x="588" y="169.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">0x010</text>
  <text x="16" y="201" font-size="13" font-weight="700" fill="#1d1d1f">RST+ACK</text>
  <text x="16" y="216" font-size="12" fill="#6e6e73">닫힌 포트의 응답</text>
  <rect x="178" y="188" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="198.0" y="207.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
