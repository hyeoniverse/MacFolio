  <text x="588" y="131.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">0x012</text>
  <text x="16" y="163" font-size="13" font-weight="700" fill="#1d1d1f">ACK</text>
  <text x="16" y="178" font-size="12" fill="#6e6e73">핸드셰이크 3단계</text>
  <rect x="178" y="150" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="198.0" y="169.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
