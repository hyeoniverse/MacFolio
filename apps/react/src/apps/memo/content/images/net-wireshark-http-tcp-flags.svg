  <rect x="310" y="264" width="40" height="30" rx="4" fill="#f2f2f7"/>
  <text x="330.0" y="283.0" text-anchor="middle" font-size="12" fill="#6e6e73">0</text>
  <rect x="354" y="264" width="40" height="30" rx="4" fill="#0a84ff"/>
