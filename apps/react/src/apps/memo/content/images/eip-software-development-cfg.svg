<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>제어 흐름 그래프와 순환 복잡도</title><rect width="640" height="400" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">코드의 제어 흐름 그래프와 순환 복잡도</text><rect x="20" y="44" width="300" height="250" rx="8" fill="#f2f2f7"/><text x="34" y="70" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">def grade(scores):</text><text x="300" y="70" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff"></text><text x="34" y="92" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">    total = 0</text><text x="300" y="92" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">①</text><text x="34" y="114" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">    for s in scores:</text><text x="300" y="114" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">②</text><text x="34" y="136" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">        if s &lt; 0:</text><text x="300" y="136" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">③</text><text x="34" y="158" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">            continue</text><text x="300" y="158" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">④</text><text x="34" y="180" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">        total += s</text><text x="300" y="180" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">⑤</text><text x="34" y="202" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">    if total &gt;= 60:</text><text x="300" y="202" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">⑥</text><text x="34" y="224" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">        return "합격"</text><text x="300" y="224" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">⑦</text><text x="34" y="246" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">    return "불합격"</text><text x="300" y="246" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">⑧</text><text x="34" y="268" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" xml:space="preserve">    (함수 끝)</text><text x="300" y="268" text-anchor="end" font-size="14" font-weight="600" fill="#0a84ff">⑨</text><line x1="470" y1="71" x2="470" y2="89" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="459" y1="117" x2="432" y2="144" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="480" y1="117" x2="553" y2="194" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="409" y1="167" x2="382" y2="194" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="428" y1="169" x2="441" y2="191" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><path d="M360 196 Q340 110 452 106" fill="none" stroke="#ff9f0a" stroke-width="1.8" marker-end="url(#a)"/><path d="M454 191 Q480 150 476 120" fill="none" stroke="#ff9f0a" stroke-width="1.8" marker-end="url(#a)"/><line x1="556" y1="218" x2="540" y2="242" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="574" y1="218" x2="590" y2="242" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="539" y1="268" x2="554" y2="287" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><line x1="591" y1="268" x2="576" y2="287" stroke="#6e6e73" stroke-width="1.8" marker-end="url(#a)"/><circle cx="470" cy="56" r="14" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><text x="470" y="61" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">1</text><circle cx="470" cy="106" r="14" fill="#0a84ff" stroke="#6e6e73" stroke-width="1.5"/><text x="470" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">2</text><circle cx="420" cy="156" r="14" fill="#0a84ff" stroke="#6e6e73" stroke-width="1.5"/><text x="420" y="161" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><circle cx="370" cy="206" r="14" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><text x="370" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">4</text><circle cx="450" cy="206" r="14" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><text x="450" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">5</text><circle cx="565" cy="206" r="14" fill="#0a84ff" stroke="#6e6e73" stroke-width="1.5"/><text x="565" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">6</text><circle cx="530" cy="256" r="14" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><text x="530" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">7</text><circle cx="600" cy="256" r="14" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><text x="600" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">8</text><circle cx="565" cy="300" r="14" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><text x="565" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">9</text><text x="340" y="262" text-anchor="start" font-size="12" font-weight="400" fill="#0a84ff">파란 노드: 분기</text><text x="340" y="280" text-anchor="start" font-size="12" font-weight="400" fill="#ff9f0a">주황 간선: 반복 복귀</text><rect x="20" y="316" width="600" height="64" rx="8" fill="#e8f2ff"/><text x="320" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">간선 E = 11, 노드 N = 9 이므로 V(G) = E − N + 2 = 11 − 9 + 2 = 4</text><text x="320" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">분기 노드 3개(②③⑥) + 1 = 4 로 구해도 같다. 독립 경로 4개를 테스트하면 된다</text></svg>
