<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">삽입 SQL과 동적 SQL이 컴파일되는 시각</text>
  <!-- 시간 축 구분 -->
  <rect x="120" y="44" width="250" height="240" fill="#f2f2f7"/>
  <rect x="370" y="44" width="250" height="240" fill="#e8f2ff"/>
  <text x="245" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#6e6e73">프로그램 빌드 시각</text>
  <text x="495" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">프로그램 실행 시각</text>
  <g font-size="12" fill="#1d1d1f">
    <text x="20" y="114" font-weight="600">삽입 SQL</text>
    <text x="20" y="132" fill="#6e6e73">SQL 문 고정</text>
    <rect x="132" y="92" width="106" height="52" rx="6" fill="#fff" stroke="#6e6e73"/>
    <text x="185" y="114" text-anchor="middle">예비 컴파일러</text>
    <text x="185" y="132" text-anchor="middle" fill="#6e6e73">EXEC SQL 추출</text>
    <rect x="254" y="92" width="106" height="52" rx="6" fill="#fff" stroke="#6e6e73"/>
    <text x="307" y="114" text-anchor="middle">호스트 언어</text>
    <text x="307" y="132" text-anchor="middle">컴파일러</text>
    <rect x="390" y="92" width="210" height="52" rx="6" fill="#fff" stroke="#6e6e73"/>
    <text x="495" y="114" text-anchor="middle">미리 만든 목적 코드 실행</text>
    <text x="495" y="132" text-anchor="middle" fill="#6e6e73">호스트 변수 값만 바뀐다</text>

    <text x="20" y="214" font-weight="600" fill="#0a84ff">동적 SQL</text>
    <text x="20" y="232" fill="#6e6e73">문자열로 구성</text>
    <rect x="132" y="192" width="228" height="52" rx="6" fill="#fff" stroke="#6e6e73"/>
    <text x="246" y="214" text-anchor="middle">SQL 문이 아직 없다</text>
    <text x="246" y="232" text-anchor="middle" fill="#6e6e73">호스트 변수 dynamicSQL만 선언</text>
    <rect x="390" y="180" width="210" height="36" rx="6" fill="#fff" stroke="#0a84ff"/>
    <text x="495" y="203" text-anchor="middle">PREPARE: 문자열을 컴파일</text>
    <rect x="390" y="230" width="210" height="36" rx="6" fill="#fff" stroke="#0a84ff"/>
    <text x="495" y="253" text-anchor="middle">EXECUTE … USING 반복 실행</text>
  </g>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="238" y1="118" x2="252" y2="118"/>
    <line x1="360" y1="118" x2="388" y2="118"/>
    <line x1="360" y1="218" x2="388" y2="200"/>
    <line x1="495" y1="216" x2="495" y2="228"/>
  </g>
</svg>
