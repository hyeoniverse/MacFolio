<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">지금 읽는 절: 기준선(96px)을 지난 마지막 제목</text>
  <rect x="40" y="70" width="300" height="250" rx="8" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
  <text x="340" y="338" text-anchor="end" font-size="12" fill="#6e6e73">읽기 칸 (보이는 부분)</text>
  <line x1="30" y1="166" x2="350" y2="166" stroke="#0a84ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="356" y="170" font-size="12" fill="#0a84ff">기준선: 칸 위에서 96px</text>
  <g font-size="12">
    <text x="56" y="56" fill="#6e6e73">## 배경   top −820 (화면 위로 지나감)</text>
    <rect x="56" y="100" width="200" height="12" rx="3" fill="#d1d1d6"/>
    <text x="56" y="132" fill="#6e6e73">… 본문 …</text>
    <rect x="56" y="200" width="150" height="16" rx="3" fill="#ff9f0a"/>
    <text x="214" y="213" font-weight="600" fill="#1d1d1f">## 원인  top 130</text>
    <rect x="56" y="230" width="230" height="10" rx="3" fill="#e5e5ea"/>
    <rect x="56" y="248" width="210" height="10" rx="3" fill="#e5e5ea"/>
    <rect x="56" y="286" width="150" height="16" rx="3" fill="#d1d1d6"/>
    <text x="214" y="299" fill="#6e6e73">## 해결  top 216</text>
    <text x="56" y="350" fill="#6e6e73">## 확인   top 640 (아직 아래)</text>
  </g>
  <rect x="56" y="80" width="150" height="16" rx="3" fill="#34c759"/>
  <text x="214" y="93" font-size="12" font-weight="600" fill="#1d1d1f">## 증상  top 10</text>
  <rect x="380" y="200" width="230" height="130" rx="8" fill="#fff" stroke="#d1d1d6"/>
  <text x="396" y="224" font-size="12" font-weight="600" fill="#1d1d1f">activeHeading(tops, 96)</text>
  <text x="396" y="246" font-size="12" fill="#1d1d1f">tops = [−820, 10, 130, 216, 640]</text>
  <text x="396" y="268" font-size="12" fill="#34c759">−820 ≤ 96, 10 ≤ 96 → 후보</text>
  <text x="396" y="290" font-size="12" fill="#ff3b30">130 &gt; 96 → 여기서 멈춤</text>
  <text x="396" y="316" font-size="13" font-weight="600" fill="#0a84ff">결과 1 (## 증상)</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#6e6e73">top은 제목의 위쪽 끝에서 읽기 칸 위쪽 끝을 뺀 값이다. 칸 위로 지나간 제목은 음수가 된다</text>
</svg>
