<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>helmet 기본값 CORP same-origin에서는 Safari가 다른 출처 API의 sendBeacon 응답을 취소하고, 이벤트 경로만 cross-origin으로 지정한 뒤에는 응답을 받는다</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#374151"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#16a34a"/></marker>
</defs>
<rect width="760" height="440" fill="#fff"/>
<text x="24" y="32" font-size="16" fill="#1f2937" font-weight="700">sendBeacon 응답과 Cross-Origin-Resource-Policy</text>
<text x="24" y="52" font-size="11" fill="#6b7280">사이트와 API는 출처가 다르다 (같은 사이트 hyeoniverse.com, 다른 호스트). 요청은 5초마다(FLUSH_MS) 전송된다</text>

<text x="24" y="90" font-size="13" fill="#1f2937" font-weight="600">전: helmet() 기본값, 모든 응답에 same-origin</text>
<rect x="24" y="104" width="200" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="124" y="129" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Safari</text>
<text x="124" y="148" font-size="10.5" fill="#6b7280" text-anchor="middle">macfolio.hyeoniverse.com</text>
<rect x="536" y="104" width="200" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="636" y="129" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">API (NestJS)</text>
<text x="636" y="148" font-size="10.5" fill="#6b7280" text-anchor="middle">macfolio-api.hyeoniverse.com</text>
<line x1="228" y1="120" x2="532" y2="120" stroke="#374151" stroke-width="1.5" marker-end="url(#k)"/>
<text x="380" y="113" font-size="10.5" fill="#374151" text-anchor="middle">POST /analytics/events · text/plain · no-cors</text>
<line x1="532" y1="148" x2="228" y2="148" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
<text x="380" y="166" font-size="10.5" fill="#dc2626" text-anchor="middle">204 · Cross-Origin-Resource-Policy: same-origin</text>
<rect x="24" y="180" width="712" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="40" y="198" font-size="11.5" fill="#991b1b" font-weight="600">출처가 달라 Safari가 응답을 취소 → 콘솔에 5초마다 에러 3줄</text>
<text x="40" y="214" font-size="10.5" fill="#4b5563">CORS(Access-Control-Allow-Origin)는 허용 목록으로 통과했지만, CORP는 별개의 검사다</text>

<text x="24" y="270" font-size="13" fill="#1f2937" font-weight="600">후: POST /analytics/events 한 경로만 cross-origin</text>
<rect x="24" y="284" width="200" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="124" y="309" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Safari</text>
<text x="124" y="328" font-size="10.5" fill="#6b7280" text-anchor="middle">macfolio.hyeoniverse.com</text>
<rect x="536" y="284" width="200" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="636" y="309" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">API (NestJS)</text>
<text x="636" y="328" font-size="10.5" fill="#6b7280" text-anchor="middle">macfolio-api.hyeoniverse.com</text>
<line x1="228" y1="300" x2="532" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#k)"/>
<text x="380" y="293" font-size="10.5" fill="#374151" text-anchor="middle">POST /analytics/events · text/plain · no-cors</text>
<line x1="532" y1="328" x2="228" y2="328" stroke="#16a34a" stroke-width="1.5" marker-end="url(#g)"/>
<text x="380" y="346" font-size="10.5" fill="#16a34a" text-anchor="middle">204 · Cross-Origin-Resource-Policy: cross-origin</text>
<rect x="24" y="360" width="712" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="40" y="378" font-size="11.5" fill="#065f46" font-weight="600">Safari가 응답을 받는다. 본문 없는 204라 다른 출처로 전달되는 정보가 없다</text>
<text x="40" y="394" font-size="10.5" fill="#4b5563">/health 등 나머지 경로는 same-origin 유지. /files/*, /posts/:slug/og.png는 이전부터 cross-origin</text>
<text x="24" y="426" font-size="10.5" fill="#6b7280">@Header('Cross-Origin-Resource-Policy', 'cross-origin') · apps/api/src/analytics/analytics.controller.ts</text>
</svg>
