<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>SJF와 SRT 간트 차트</title><rect width="640" height="280" fill="#fff"/>
<g font-size="13">
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">같은 입력의 SJF와 SRT 실행 순서</text>
