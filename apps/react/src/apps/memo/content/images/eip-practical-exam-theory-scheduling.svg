<text x="78" y="194" text-anchor="end" font-weight="600" fill="#1d1d1f">SRT</text>
<rect x="90" y="170" width="26" height="36" fill="#0a84ff" stroke="#fff" stroke-width="2"/><text x="103.0" y="193" text-anchor="middle" fill="#fff" font-weight="600">P1</text>
<rect x="116" y="170" width="78" height="36" fill="#30d158" stroke="#fff" stroke-width="2"/><text x="155.0" y="193" text-anchor="middle" fill="#fff" font-weight="600">P2</text>
<rect x="194" y="170" width="52" height="36" fill="#ff453a" stroke="#fff" stroke-width="2"/><text x="220.0" y="193" text-anchor="middle" fill="#fff" font-weight="600">P4</text>
<rect x="246" y="170" width="130" height="36" fill="#0a84ff" stroke="#fff" stroke-width="2"/><text x="311.0" y="193" text-anchor="middle" fill="#fff" font-weight="600">P1</text>
<rect x="376" y="170" width="208" height="36" fill="#ff9f0a" stroke="#fff" stroke-width="2"/><text x="480.0" y="193" text-anchor="middle" fill="#fff" font-weight="600">P3</text>
<text x="90" y="224" text-anchor="middle" fill="#6e6e73" font-size="12">0</text>
<text x="116" y="224" text-anchor="middle" fill="#6e6e73" font-size="12">1</text>
