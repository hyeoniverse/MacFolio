<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>사진 하나를 가리키는 요청 id</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="350" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="700">앨범 id와 파일 주소를 문자열 하나로 만드는 두 방법</text>
<text x="20" y="50" font-size="12" fill="#6e6e73" text-anchor="start">openRequest는 { app, id } 문자열 하나만 전달하므로 두 값을 하나로 합쳐야 한다</text>
<rect x="20" y="64" width="600" height="52" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="32" y="84" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">album = 'finder:folder:widget01'</text>
<text x="32" y="104" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">src   = '/files/&lt;key&gt;'</text>
<text x="608" y="84" font-size="12" fill="#6e6e73" text-anchor="end">그림 폴더 안에 만든 폴더</text>
<text x="608" y="104" font-size="12" fill="#6e6e73" text-anchor="end">그 폴더의 파일 주소</text>
<text x="20" y="146" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">A. 구분 문자 :로 이어 붙이기</text>
<rect x="20" y="156" width="600" height="30" rx="4" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="32" y="176" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">'finder:folder:widget01:/files/&lt;key&gt;'</text>
<line x1="60" y1="186" x2="60" y2="204" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="20" y="208" width="600" height="44" rx="6" fill="#fff0ef" stroke="#ff3b30" stroke-width="1.2"/>
<text x="32" y="227" font-size="12" fill="#ff3b30" text-anchor="start" font-weight="700">첫 : 에서 나누면 album = 'finder' (틀림)</text>
<text x="32" y="244" font-size="12" fill="#1d1d1f" text-anchor="start">앨범 id에도 :가 들어 있어 어디가 경계인지 문자열만으로 알 수 없다</text>
<text x="20" y="282" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">B. JSON.stringify([album, src]) (채택)</text>
<rect x="20" y="292" width="600" height="30" rx="4" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="32" y="312" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">'["finder:folder:widget01","/files/&lt;key&gt;"]'</text>
<text x="608" y="312" font-size="12" fill="#34c759" text-anchor="end" font-weight="700">JSON.parse로 그대로 복원</text>
</svg>
