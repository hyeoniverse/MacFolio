<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">모듈 ID가 같으면 청크도 같다</text>
  <text x="24" y="54" font-size="12" fill="#6e6e73">번들러는 같은 모듈 ID를 한 번만 넣는다. 쿼리 문자열까지 모듈 ID에 포함된다</text>

  <!-- left: same id -->
  <text x="24" y="88" font-size="13" font-weight="700" fill="#ff3b30">?raw로 두 번 가져오면</text>
  <rect x="24" y="100" width="284" height="44" rx="6" fill="#f2f2f7"/>
  <text x="36" y="119" font-size="12" fill="#1d1d1f">contentFiles.ts: 정적 import</text>
  <text x="36" y="136" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">flux-pattern.md?raw</text>
  <rect x="24" y="152" width="284" height="44" rx="6" fill="#f2f2f7"/>
  <text x="36" y="171" font-size="12" fill="#1d1d1f">postBody.ts: 동적 import()</text>
  <text x="36" y="188" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">flux-pattern.md?raw</text>
  <line x1="166" y1="198" x2="166" y2="228" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="24" y="232" width="284" height="64" rx="8" fill="#fff5f4" stroke="#ff3b30"/>
  <text x="36" y="254" font-size="12" font-weight="600" fill="#1d1d1f">모듈 하나 → contentFiles 청크 안</text>
  <text x="36" y="274" font-size="12" fill="#1d1d1f">글 하나를 열어도 contentFiles 전체(brotli</text>
  <text x="36" y="290" font-size="12" fill="#1d1d1f">805KB)를 받는다</text>

  <!-- right: different id -->
  <text x="332" y="88" font-size="13" font-weight="700" fill="#248a3d">?raw&amp;single로 나누면</text>
  <rect x="332" y="100" width="284" height="44" rx="6" fill="#f2f2f7"/>
  <text x="344" y="119" font-size="12" fill="#1d1d1f">contentFiles.ts: 정적 import</text>
  <text x="344" y="136" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">flux-pattern.md?raw</text>
  <rect x="332" y="152" width="284" height="44" rx="6" fill="#f2f2f7"/>
  <text x="344" y="171" font-size="12" fill="#1d1d1f">postBody.ts: 동적 import()</text>
  <text x="344" y="188" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">flux-pattern.md?raw&amp;single</text>
  <line x1="420" y1="198" x2="420" y2="228" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="198" x2="540" y2="228" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="332" y="232" width="138" height="64" rx="8" fill="#f2f2f7"/>
  <text x="344" y="254" font-size="12" font-weight="600" fill="#1d1d1f">contentFiles</text>
  <text x="344" y="274" font-size="12" fill="#1d1d1f">247편 원문</text>
  <text x="344" y="290" font-size="12" fill="#1d1d1f">뒤에서 받음</text>
  <rect x="478" y="232" width="138" height="64" rx="8" fill="#f0fbf3" stroke="#34c759"/>
  <text x="490" y="254" font-size="12" font-weight="600" fill="#1d1d1f">글별 청크</text>
  <text x="490" y="274" font-size="12" fill="#1d1d1f">33KB (brotli 10KB)</text>
  <text x="490" y="290" font-size="12" fill="#1d1d1f">연 글만 받음</text>

  <rect x="24" y="314" width="592" height="72" rx="8" fill="#fff" stroke="#c7c7cc"/>
  <text x="40" y="338" font-size="12" fill="#1d1d1f">• Vite의 ?raw 처리는 쿼리에 raw가 있는지만 확인하므로 &amp;single을 붙여도 원문 문자열을 돌려준다</text>
  <text x="40" y="358" font-size="12" fill="#1d1d1f">• 빌드 결과 JS 파일 325개 → 572개 (글 247편마다 청크 하나)</text>
  <text x="40" y="378" font-size="12" fill="#6e6e73">  예시 글: flux-pattern</text>
</svg>
