<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>스크럼의 스프린트 흐름</title><rect width="640" height="340" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">스크럼의 한 스프린트</text><rect x="20" y="70" width="120" height="56" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="80.0" y="102.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="80" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">제품 백로그</text><text x="80" y="113" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">PO가 우선순위 관리</text><rect x="170" y="70" width="110" height="56" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="225.0" y="102.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="225" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">스프린트 계획</text><text x="225" y="113" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">이번에 할 항목 선택</text><rect x="310" y="70" width="120" height="56" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="370.0" y="102.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="370" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">스프린트 백로그</text><text x="370" y="113" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">작업 단위로 분해</text><line x1="140" y1="98" x2="166" y2="98" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="98" x2="306" y2="98" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="430" y1="98" x2="466" y2="98" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><circle cx="530" cy="98" r="58" fill="none" stroke="#0a84ff" stroke-width="3"/><text x="530" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#0a84ff">스프린트</text><text x="530" y="106" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">1개월 이하</text><text x="530" y="122" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">(보통 2~4주)</text><circle cx="530" cy="30" r="16" fill="#ff9f0a"/><text x="530" y="35" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">24h</text><text x="506" y="35" text-anchor="end" font-size="11" font-weight="600" fill="#ff9f0a">일일 스크럼 15분</text><line x1="530" y1="158" x2="530" y2="196" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="200" width="160" height="44" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="530.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">증분 (동작하는 결과물)</text><line x1="446" y1="222" x2="330" y2="222" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="200" width="146" height="44" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="253.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">스프린트 리뷰</text><text x="253" y="262" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">이해관계자에게 시연</text><line x1="176" y1="222" x2="140" y2="222" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="200" width="116" height="44" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="78.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">회고</text><text x="78" y="262" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">일하는 방식 개선</text><path d="M78 200 V140" stroke="#6e6e73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="86" y="176" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">다음 스프린트</text><rect x="20" y="282" width="600" height="44" rx="8" fill="#f2f2f7"/><text x="320" y="300" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">역할: 제품 책임자(PO) 백로그 우선순위 · 스크럼 마스터(SM) 규칙 안내와 장애 제거 · 개발자 증분 제작</text><text x="320" y="318" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">진척 조회: 번다운 차트 (남은 작업량을 날짜별로 그린 그래프)</text></svg>
