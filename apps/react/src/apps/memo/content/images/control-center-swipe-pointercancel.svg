<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>휴대폰에서 손가락으로 쓸면 브라우저가 스크롤을 시작하는 순간 pointercancel이 발생하고 포인터 이벤트가 끊기지만, Touch Events는 touchmove에서 preventDefault로 스크롤을 막아 touchend까지 이어진다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<rect width="640" height="360" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">손가락으로 아래로 쓸 때 수신되는 이벤트</text>
<!-- axis -->
<text x="140" y="66" font-size="12" fill="#6e6e73">손가락 이동 거리 →</text>
<line x1="140" y1="76" x2="616" y2="76" stroke="#1d1d1f" stroke-width="1.2" marker-end="url(#a)"/>
<text x="150" y="94" font-size="12" fill="#6e6e73" text-anchor="middle">누름</text>
<text x="250" y="94" font-size="12" fill="#6e6e73" text-anchor="middle">움직임</text>
<text x="360" y="94" font-size="12" fill="#6e6e73" text-anchor="middle">브라우저 스크롤 시작</text>
<text x="560" y="94" font-size="12" fill="#6e6e73" text-anchor="middle">손을 뗌</text>
<!-- pointer row -->
<rect x="24" y="112" width="592" height="92" rx="10" fill="#f2f2f7"/>
<text x="36" y="140" font-size="13" font-weight="700" fill="#1d1d1f">Pointer Events</text>
<text x="36" y="158" font-size="12" fill="#6e6e73">(데스크톱 마우스에서는</text>
<text x="36" y="174" font-size="12" fill="#6e6e73">끝까지 정상)</text>
<rect x="150" y="128" width="88" height="24" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<text x="194" y="145" font-size="12" fill="#1d1d1f" text-anchor="middle">pointerdown</text>
<rect x="246" y="128" width="88" height="24" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<text x="290" y="145" font-size="12" fill="#1d1d1f" text-anchor="middle">pointermove</text>
<rect x="342" y="128" width="104" height="24" rx="6" fill="#ff3b30"/>
<text x="394" y="145" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">pointercancel</text>
<line x1="456" y1="140" x2="604" y2="140" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="530" y="168" font-size="12" fill="#ff3b30" text-anchor="middle">이후 이벤트 없음</text>
<text x="394" y="190" font-size="12" fill="#6e6e73" text-anchor="middle">브라우저가 스크롤로 가져감</text>
<!-- touch row -->
<rect x="24" y="220" width="592" height="92" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="36" y="248" font-size="13" font-weight="700" fill="#0a84ff">Touch Events</text>
<text x="36" y="266" font-size="12" fill="#6e6e73">(채택)</text>
<rect x="150" y="236" width="88" height="24" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="194" y="253" font-size="12" fill="#1d1d1f" text-anchor="middle">touchstart</text>
<rect x="246" y="236" width="88" height="24" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="290" y="253" font-size="12" fill="#1d1d1f" text-anchor="middle">touchmove</text>
<rect x="342" y="236" width="104" height="24" rx="6" fill="#0a84ff"/>
<text x="394" y="253" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">touchmove …</text>
<rect x="516" y="236" width="88" height="24" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="560" y="253" font-size="12" fill="#1d1d1f" text-anchor="middle">touchend</text>
<line x1="446" y1="248" x2="514" y2="248" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#a)"/>
<text x="290" y="282" font-size="12" fill="#6e6e73" text-anchor="middle">판정 보류</text>
<text x="394" y="282" font-size="12" fill="#0a84ff" text-anchor="middle">swipe 판정 →</text>
<text x="394" y="298" font-size="12" fill="#0a84ff" text-anchor="middle">preventDefault()</text>
<text x="560" y="282" font-size="12" fill="#6e6e73" text-anchor="middle">onEnd(거리)</text>
<text x="24" y="340" font-size="12" fill="#6e6e73">touchmove를 passive: false로 등록해야 preventDefault()로 브라우저 스크롤을 막을 수 있다</text>
</svg>
