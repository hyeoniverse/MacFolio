<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>요청 하나가 관리자로 인정되기까지 (AdminGuard)</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">요청 하나가 관리자로 인정되기까지 (AdminGuard)</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">Origin → 쿠키 → 해시 → DB 행 → 만료·관리자 ID. 하나라도 어긋나면 거기서 끝난다</text>
<rect x="32" y="100" width="140" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="102.0" y="130.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">Origin 확인</text>
<text x="102.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle">허용한 사이트 주소인가</text>
<line x1="172" y1="135" x2="192" y2="135" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="196" y="100" width="140" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="266.0" y="130.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">쿠키 읽기</text>
<text x="266.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">macfolio_session</text>
<line x1="336" y1="135" x2="356" y2="135" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="360" y="100" width="140" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="430.0" y="130.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">hashToken</text>
<text x="430.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">SHA-256 → 64자 hex</text>
<line x1="500" y1="135" x2="520" y2="135" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="524" y="100" width="140" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="594.0" y="130.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">DB에서 찾기</text>
<text x="594.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">adminSession.tokenHash</text>
<line x1="664" y1="135" x2="684" y2="135" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="688" y="100" width="140" height="84" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="758.0" y="129.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">행 검사</text>
<text x="758.0" y="146.0" font-size="11" fill="#374151" text-anchor="middle">expiresAt &gt; 지금</text>
<text x="758.0" y="163.0" font-size="11" fill="#374151" text-anchor="middle">githubId = 관리자 ID</text>
<line x1="102" y1="170" x2="102" y2="240" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="52" y="244" width="100" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="102.0" y="268.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">403</text>
<line x1="266" y1="170" x2="266" y2="240" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="216" y="244" width="100" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="266.0" y="268.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">401</text>
<line x1="594" y1="170" x2="594" y2="240" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="544" y="244" width="100" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="594.0" y="268.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">401</text>
<line x1="758" y1="184" x2="758" y2="240" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="708" y="244" width="100" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="758.0" y="268.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">401</text>
<text x="32" y="310" font-size="11" fill="#6b7280" text-anchor="start">해시가 같으면 토큰도 같다. DB가 새어도 거기서 쿠키를 거꾸로 만들 수 없다. 로그아웃은 행을 지운다(deleteMany)</text>
</svg>
