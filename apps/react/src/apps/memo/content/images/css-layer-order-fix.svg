<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">CSS 파일이 붙는 순서가 층 순서를 정한다</text>
  <!-- before -->
  <text x="160" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444">수정 전</text>
  <rect x="30" y="70" width="260" height="40" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="44" y="88" font-size="11" fill="#374151">① repository-….css</text>
  <text x="44" y="103" font-size="10.5" fill="#ef4444">@layer components { .ui-button … }</text>
  <rect x="30" y="118" width="260" height="40" rx="8" fill="#f3f4f6"/>
  <text x="44" y="136" font-size="11" fill="#374151">② main-….css</text>
  <text x="44" y="151" font-size="10.5" fill="#6b7280">@layer reset { * { padding: 0 } }</text>
  <text x="160" y="186" text-anchor="middle" font-size="11" fill="#374151">층 순서: components → reset</text>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#ef4444">reset이 이겨 단추 여백이 0</text>
  <!-- after -->
  <text x="480" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">수정 후</text>
  <rect x="350" y="70" width="260" height="40" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="364" y="88" font-size="11" fill="#374151">⓪ index.html의 &lt;style&gt;</text>
  <text x="364" y="103" font-size="10.5" fill="#4f46e5">@layer reset, components;</text>
  <rect x="350" y="118" width="260" height="40" rx="8" fill="#f3f4f6"/>
  <text x="364" y="136" font-size="11" fill="#374151">① repository-….css  ② main-….css</text>
  <text x="364" y="151" font-size="10.5" fill="#6b7280">붙는 순서와 상관없음</text>
  <text x="480" y="186" text-anchor="middle" font-size="11" fill="#374151">층 순서: reset → components</text>
  <text x="480" y="204" text-anchor="middle" font-size="11" fill="#4f46e5">components가 이겨 여백 5px 14px</text>
  <line x1="320" y1="50" x2="320" y2="215" stroke="#e5e7eb"/>
  <rect x="30" y="232" width="580" height="48" rx="8" fill="#f3f4f6"/>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#374151">층끼리는 나중에 정해진 층이 이긴다. 층 순서는 문서에서 그 이름이 처음 나온 순서로 정해진다</text>
  <text x="320" y="270" text-anchor="middle" font-size="10.5" fill="#6b7280">그래서 순서 선언은 어떤 CSS 파일보다도 앞에 있어야 한다</text>
</svg>
