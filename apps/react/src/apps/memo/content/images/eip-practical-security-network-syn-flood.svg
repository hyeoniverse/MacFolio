<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>정상 3단계 연결과 SYN 플러딩</title><rect width="640" height="300" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs><g font-size="13">
<text x="160" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">정상 연결</text><text x="480" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">SYN 플러딩</text>
<line x1="320" y1="44" x2="320" y2="290" stroke="#f2f2f7" stroke-width="2"/>
<text x="60" y="58" text-anchor="middle" fill="#1d1d1f">클라이언트</text><text x="260" y="58" text-anchor="middle" fill="#1d1d1f">서버</text>
<line x1="60" y1="66" x2="60" y2="240" stroke="#c7c7cc" stroke-width="2"/><line x1="260" y1="66" x2="260" y2="240" stroke="#c7c7cc" stroke-width="2"/>
<path d="M60 90 L256 120" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><text x="150" y="96" font-size="12" fill="#0a84ff">SYN</text>
<path d="M260 140 L64 170" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="150" y="146" font-size="12" fill="#6e6e73">SYN + ACK</text>
<path d="M60 190 L256 220" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><text x="150" y="196" font-size="12" fill="#0a84ff">ACK</text>
<text x="160" y="270" text-anchor="middle" font-size="12" fill="#30d158">연결 완료(ESTABLISHED)</text>
<text x="380" y="58" text-anchor="middle" fill="#ff453a">공격자(위조 IP)</text><text x="580" y="58" text-anchor="middle" fill="#1d1d1f">서버</text>
<line x1="380" y1="66" x2="380" y2="240" stroke="#c7c7cc" stroke-width="2"/><line x1="580" y1="66" x2="580" y2="240" stroke="#c7c7cc" stroke-width="2"/>
<path d="M380 80 L576 95" stroke="#ff453a" stroke-width="1.5" marker-end="url(#r)"/><path d="M380 100 L576 115" stroke="#ff453a" stroke-width="1.5" marker-end="url(#r)"/><path d="M380 120 L576 135" stroke="#ff453a" stroke-width="1.5" marker-end="url(#r)"/><path d="M380 140 L576 155" stroke="#ff453a" stroke-width="1.5" marker-end="url(#r)"/>
<text x="440" y="75" font-size="12" fill="#ff453a">SYN × 수천 개</text>
<rect x="500" y="170" width="120" height="70" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="560" y="190" text-anchor="middle" font-size="12" fill="#1d1d1f">대기 큐(backlog)</text>
<rect x="510" y="198" width="22" height="14" fill="#ff453a"/><rect x="536" y="198" width="22" height="14" fill="#ff453a"/><rect x="562" y="198" width="22" height="14" fill="#ff453a"/><rect x="588" y="198" width="22" height="14" fill="#ff453a"/>
<text x="560" y="230" text-anchor="middle" font-size="12" fill="#ff453a">가득 참</text>
<text x="400" y="200" font-size="12" fill="#6e6e73">ACK가 오지 않아</text><text x="400" y="216" font-size="12" fill="#6e6e73">반쯤 열린 연결</text>
<text x="480" y="270" text-anchor="middle" font-size="12" fill="#ff453a">정상 사용자의 SYN은 거부된다</text>
</g></svg>
