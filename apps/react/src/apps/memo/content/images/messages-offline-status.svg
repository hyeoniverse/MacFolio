<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>메시지 앱의 목록 상태</title>
  <rect width="760" height="300" rx="16" fill="#ffffff"/>
  <text x="32" y="42" font-size="18" font-weight="700" fill="#1f2937">error는 처음 불러올 때만 — 쓰는 도중에는 앱을 닫지 않는다</text>
  <text x="32" y="64" font-size="12" fill="#6b7280">useConversations.ts의 status: 'loading' | 'ready' | 'error'</text>
  <g text-anchor="middle">
    <rect x="40" y="110" width="150" height="70" rx="12" fill="#f3f4f6"/>
    <text x="115" y="140" font-size="15" font-weight="700" fill="#1f2937">loading</text>
    <text x="115" y="162" font-size="11" fill="#374151">GET /messages/threads</text>
    <rect x="300" y="96" width="170" height="60" rx="12" fill="#dcfce7"/>
    <text x="385" y="122" font-size="15" font-weight="700" fill="#15803d">ready</text>
    <text x="385" y="142" font-size="11" fill="#374151">목록·대화를 그린다</text>
    <rect x="300" y="196" width="170" height="64" rx="12" fill="#fee2e2"/>
    <text x="385" y="222" font-size="15" font-weight="700" fill="#b91c1c">error</text>
    <text x="385" y="242" font-size="11" fill="#374151">"메시지를 열 수 없습니다"</text>
    <rect x="560" y="196" width="170" height="64" rx="12" fill="#f3f4f6"/>
    <text x="645" y="222" font-size="13" font-weight="600" fill="#1f2937">[확인] → 앱 끄기</text>
    <text x="645" y="242" font-size="11" fill="#374151">휴대폰은 홈 화면으로</text>
    <rect x="560" y="90" width="170" height="72" rx="12" fill="#fff7ed"/>
    <text x="645" y="114" font-size="12" font-weight="600" fill="#9a3412">새로고침·보내기 실패</text>
    <text x="645" y="134" font-size="11" fill="#374151">상태는 ready 그대로</text>
    <text x="645" y="150" font-size="11" fill="#374151">보내기만 경고창, 글은 남는다</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.6" fill="none">
    <path d="M190 135 L294 126"/><path d="M190 155 L294 222"/>
    <path d="M470 228 H554"/>
    <path d="M470 126 H554"/>
  </g>
  <g font-size="11" fill="#6b7280">
    <text x="214" y="120">성공</text>
    <text x="214" y="200">실패</text>
  </g>
</svg>
