<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>빌드 변수는 vite build가 JS에 문자열로 넣고, 실행 변수는 Worker 코드만 읽는다. 정적 사이트는 빌드 변수에 넣어야 한다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="760" height="254" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">VITE_API_URL은 언제 읽히나</text>
<text x="32" y="56" font-size="11" fill="#6b7280">Cloudflare 대시보드의 두 변수 자리</text>
<rect x="32.0" y="76" width="336.0" height="130" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="46.0" y="100" font-size="12.5" font-weight="600" fill="#4f46e5">Build → Variables and secrets</text><text x="46.0" y="122" font-size="10.5" fill="#374151">빌드 단계에서 vite build가 읽는다</text><text x="46.0" y="140" font-size="10.5" fill="#374151">import.meta.env.VITE_API_URL</text><text x="46.0" y="158" font-size="10.5" fill="#374151">→ JS 파일 안의 문자열이 된다</text><text x="46.0" y="176" font-size="10.5" fill="#374151">배포된 assets/*.js에 주소가 보인다</text><text x="46.0" y="194" font-size="10.5" fill="#374151">✓ 정적 사이트는 여기</text><rect x="392.0" y="76" width="336.0" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="406.0" y="100" font-size="12.5" font-weight="600" fill="#1f2937">Settings → Variables and Secrets</text><text x="406.0" y="122" font-size="10.5" fill="#374151">Worker 스크립트가 실행 중에 읽는다</text><text x="406.0" y="140" font-size="10.5" fill="#374151">env.MY_VAR (fetch 처리기 인자)</text><text x="406.0" y="158" font-size="10.5" fill="#374151">이 사이트는 Worker 스크립트가 없다</text><text x="406.0" y="176" font-size="10.5" fill="#374151">정적 자산만 서빙한다</text><text x="406.0" y="194" font-size="10.5" fill="#374151">✗ 읽을 코드가 없다</text><text x="32" y="234" font-size="11" fill="#6b7280">확인: curl -s …/assets/index-….js | grep -o &quot;https://macfolio-api.hyeoniverse.com&quot;</text>
</svg>
