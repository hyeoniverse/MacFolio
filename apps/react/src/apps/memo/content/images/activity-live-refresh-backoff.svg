<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>실패할 때마다 다음 요청까지의 대기 시간이 2배씩 늘고 10분에서 멈추며, 성공하면 60초로 돌아오는 막대 그래프</title>
<rect width="640" height="340" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">지수 백오프: 다음 요청까지 기다리는 시간</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">간격 60초인 화면. nextDelay = min(60초 × 2^실패 횟수, 10분)</text>

<!-- 축: y=270이 0, 10분=600초가 높이 180 → y=90 -->
<line x1="70" y1="270" x2="616" y2="270" stroke="#1d1d1f"/>
<g font-size="12" fill="#6e6e73" text-anchor="end">
<text x="62" y="274">0</text>
<text x="62" y="184">5분</text>
<text x="62" y="94">10분</text>
</g>
<line x1="70" y1="90" x2="616" y2="90" stroke="#ff3b30" stroke-dasharray="5 4"/>
<text x="612" y="84" font-size="12" fill="#ff3b30" text-anchor="end">상한 10분</text>

<!-- 막대: 너비 52, 간격 78, 시작 x=88 -->
<g font-size="12" text-anchor="middle">
<rect x="88" y="252" width="52" height="18" rx="3" fill="#34c759"/><text x="114" y="244" fill="#1d1d1f">60초</text>
<rect x="166" y="234" width="52" height="36" rx="3" fill="#ff9f0a"/><text x="192" y="226" fill="#1d1d1f">2분</text>
<rect x="244" y="198" width="52" height="72" rx="3" fill="#ff9f0a"/><text x="270" y="190" fill="#1d1d1f">4분</text>
<rect x="322" y="126" width="52" height="144" rx="3" fill="#ff9f0a"/><text x="348" y="118" fill="#1d1d1f">8분</text>
<rect x="400" y="90" width="52" height="180" rx="3" fill="#ff9f0a"/><text x="426" y="110" fill="#ffffff">10분</text>
<rect x="478" y="90" width="52" height="180" rx="3" fill="#ff9f0a"/><text x="504" y="110" fill="#ffffff">10분</text>
<rect x="556" y="252" width="52" height="18" rx="3" fill="#34c759"/><text x="582" y="244" fill="#1d1d1f">60초</text>
<text x="114" y="290" fill="#6e6e73">성공</text>
<text x="192" y="290" fill="#6e6e73">실패 1</text>
<text x="270" y="290" fill="#6e6e73">실패 2</text>
<text x="348" y="290" fill="#6e6e73">실패 3</text>
<text x="426" y="290" fill="#6e6e73">실패 4</text>
<text x="504" y="290" fill="#6e6e73">실패 5</text>
<text x="582" y="290" fill="#6e6e73">성공</text>
</g>
<text x="24" y="322" font-size="12" fill="#6e6e73">실패 4번째에 계산값 16분이 상한 10분으로 잘린다. 한 번 성공하면 실패 횟수가 0이 되어 60초로 돌아온다</text>
</svg>
