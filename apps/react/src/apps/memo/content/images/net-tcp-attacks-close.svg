<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="310" fill="#fff"/>
  <defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker></defs>
  <g font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">
    <text x="110" y="22">4-방향 종료</text><text x="330" y="22">3-방향 종료</text><text x="540" y="22">즉시 종료(abrupt)</text>
  </g>
  <g font-size="11.5" fill="#6e6e73" text-anchor="middle">
    <text x="30" y="44">호스트 A</text><text x="190" y="44">호스트 B</text>
    <text x="250" y="44">호스트 A</text><text x="410" y="44">호스트 B</text>
    <text x="470" y="44">호스트 A</text><text x="608" y="44">호스트 B</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.3">
    <line x1="30" y1="52" x2="30" y2="300"/><line x1="190" y1="52" x2="190" y2="300"/>
    <line x1="250" y1="52" x2="250" y2="250"/><line x1="410" y1="52" x2="410" y2="250"/>
    <line x1="470" y1="52" x2="470" y2="150"/><line x1="608" y1="52" x2="608" y2="150"/>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.3" marker-end="url(#k)">
    <line x1="30" y1="66" x2="187" y2="108"/>
    <line x1="190" y1="118" x2="33" y2="160"/>
    <line x1="190" y1="150" x2="33" y2="192"/>
    <line x1="30" y1="204" x2="187" y2="246"/>
    <line x1="250" y1="66" x2="407" y2="108"/>
    <line x1="410" y1="118" x2="253" y2="160"/>
    <line x1="250" y1="164" x2="407" y2="206"/>
  </g>
  <line x1="470" y1="66" x2="605" y2="104" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#r)"/>
  <g font-size="10.5" fill="#1d1d1f" text-anchor="middle">
    <text x="110" y="82" transform="rotate(15 110 82)">FIN, SEQ#=X</text>
    <text x="110" y="134" transform="rotate(-15 110 134)">ACK, ACK#=X+1</text>
    <text x="110" y="166" transform="rotate(-15 110 166)">FIN, SEQ#=Y, ACK#=X+1</text>
    <text x="110" y="220" transform="rotate(15 110 220)">ACK, ACK#=Y+1</text>
    <text x="330" y="82" transform="rotate(15 330 82)">FIN, SEQ#=X</text>
    <text x="330" y="134" transform="rotate(-15 330 134)">FIN, ACK, SEQ#=Y, ACK#=X+1</text>
    <text x="330" y="180" transform="rotate(15 330 180)">ACK, ACK#=Y+1</text>
    <text x="538" y="78" transform="rotate(15.7 538 78)" fill="#ff9f0a" font-weight="600">RST</text>
  </g>
  <g stroke="#6e6e73" stroke-dasharray="6 4" stroke-width="1.2">
    <line x1="30" y1="262" x2="190" y2="262"/><line x1="250" y1="222" x2="410" y2="222"/><line x1="470" y1="114" x2="608" y2="114"/>
  </g>
  <g font-size="11" fill="#6e6e73" text-anchor="middle">
    <text x="110" y="282">연결 종료</text><text x="330" y="240">연결 종료</text><text x="540" y="132">연결 종료</text>
