<rect x="440" y="97" width="220" height="32" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="550.0" y="117.0" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">있음 (지금 이름)</text>
<rect x="60" y="139" width="360" height="32" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="240.0" y="159.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">"Font Awesome 5 Free" / "5 Brands"</text>
