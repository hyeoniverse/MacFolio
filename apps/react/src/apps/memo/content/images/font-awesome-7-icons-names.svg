  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="720" height="300" fill="#fff"/>
<text x="360.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">Font Awesome 7.3.1의 all.min.css가 선언하는 글꼴 이름</text>
<rect x="60" y="55" width="360" height="32" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="240.0" y="75.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">"Font Awesome 7 Free"</text>
<rect x="440" y="55" width="220" height="32" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
