<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="470" fill="#fff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  </defs>
  <g font-size="14" font-weight="600" fill="#6e6e73" text-anchor="middle">
    <text x="440" y="24">4.x BSD 릴리스</text>
    <text x="140" y="24">BSD 네트워킹 릴리스</text>
  </g>
  <line x1="290" y1="36" x2="290" y2="460" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- 오른쪽 본류 -->
  <g fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2">
    <rect x="320" y="40" width="240" height="52" rx="6"/>
    <rect x="320" y="114" width="240" height="52" rx="6"/>
    <rect x="320" y="188" width="240" height="68" rx="6"/>
    <rect x="320" y="278" width="240" height="84" rx="6"/>
    <rect x="320" y="384" width="240" height="68" rx="6"/>
  </g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <text x="440" y="60" font-weight="600">4.2BSD (1983)</text>
    <text x="440" y="80">일반에 처음 공개된 릴리스</text>
    <text x="440" y="134" font-weight="600">4.3BSD (1986)</text>
    <text x="440" y="154">TCP 성능 개선</text>
    <text x="440" y="208" font-weight="600">4.3BSD Tahoe (1988)</text>
    <text x="440" y="227">느린 시작, 혼잡 회피,</text>
    <text x="440" y="245">빠른 재전송</text>
    <text x="440" y="298" font-weight="600">4.3BSD Reno (1990)</text>
    <text x="440" y="317">빠른 회복, TCP 헤더 예측,</text>
    <text x="440" y="335">SLIP 헤더 압축,</text>
    <text x="440" y="353">라우팅 테이블 변경</text>
    <text x="440" y="404" font-weight="600">4.4BSD (1993)</text>
    <text x="440" y="423">멀티캐스팅,</text>
    <text x="440" y="441">long fat pipe 대응</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#k)">
    <line x1="440" y1="92" x2="440" y2="110"/>
    <line x1="440" y1="166" x2="440" y2="184"/>
    <line x1="440" y1="256" x2="440" y2="274"/>
    <line x1="440" y1="362" x2="440" y2="380"/>
  </g>
  <!-- 왼쪽 네트워킹 릴리스 -->
  <g fill="#e3f0ff" stroke="#0a84ff" stroke-width="1.3">
    <rect x="30" y="230" width="220" height="44" rx="6"/>
    <rect x="30" y="320" width="220" height="44" rx="6"/>
    <rect x="30" y="406" width="220" height="44" rx="6"/>
  </g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <text x="140" y="249" font-weight="600">Net/1 (1989)</text>
    <text x="140" y="266">BSD 네트워킹 릴리스 1.0</text>
    <text x="140" y="339" font-weight="600">Net/2 (1991)</text>
    <text x="140" y="356">BSD 네트워킹 릴리스 2.0</text>
    <text x="140" y="425" font-weight="600">4.4BSD-Lite (1994)</text>
    <text x="140" y="442">Net/3라고도 한다</text>
  </g>
  <g stroke="#0a84ff" stroke-width="1.4" marker-end="url(#b)">
    <line x1="318" y1="222" x2="254" y2="248"/>
    <line x1="318" y1="320" x2="254" y2="340"/>
    <line x1="318" y1="420" x2="254" y2="426"/>
  </g>
</svg>
