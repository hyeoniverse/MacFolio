<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="800" height="300" fill="#fff"/>
<text x="400.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">점수 예: 조회 × 1 + 좋아요 × 3 + 댓글 × 5 (숫자는 설명용)</text>
<text x="282" y="76.0" font-size="11" fill="#374151" text-anchor="end">글 A: 조회 40</text>
<rect x="290" y="60" width="382.22222222222223" height="24" rx="4" fill="#d1d5db"/>
<text x="678.2222222222222" y="76.0" font-size="11" fill="#374151" text-anchor="start" font-weight="600">40</text>
<text x="282" y="114.0" font-size="11" fill="#374151" text-anchor="end">글 B: 조회 10 · 좋아요 4 · 댓글 3</text>
<rect x="290" y="98" width="353.55555555555554" height="24" rx="4" fill="#a5b4fc"/>
<text x="649.5555555555555" y="114.0" font-size="11" fill="#4f46e5" text-anchor="start" font-weight="600">37</text>
<text x="282" y="152.0" font-size="11" fill="#374151" text-anchor="end">글 C: 조회 20 · 좋아요 5</text>
<rect x="290" y="136" width="334.44444444444446" height="24" rx="4" fill="#7dd3fc"/>
<text x="630.4444444444445" y="152.0" font-size="11" fill="#0369a1" text-anchor="start" font-weight="600">35</text>
<text x="282" y="190.0" font-size="11" fill="#374151" text-anchor="end">글 D: 조회 0</text>
<rect x="290" y="174" width="2" height="24" rx="4" fill="#fca5a5"/>
<text x="298" y="190.0" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="600">0</text>
<text x="400" y="250" font-size="11" fill="#6b7280" text-anchor="middle">B는 조회가 A의 4분의 1이지만 반응이 있어 A 바로 뒤에 온다. 점수가 0인 D는 인기글에 넣지 않는다</text>
<text x="400" y="272" font-size="11" fill="#6b7280" text-anchor="middle">같은 점수면 좋아요 → 댓글 → 조회 → 최근 글 순서 (desktop-core의 popularPosts)</text>
</svg>
