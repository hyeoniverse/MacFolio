<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"><title>프로젝트를 고치고 저장하는 흐름: 프로젝트 편집의 완료는 검사만, 목록의 완료가 PUT /site/projects로 한 번에 저장하고, 화면은 PROJECTS를 다시 채운다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs><rect width="860" height="360" rx="16" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#1f2937">고치고 저장하기까지</text><rect x="28" y="60" width="180" height="92" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="118.0" y="82" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">프로젝트 편집</text><text x="118.0" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">소개·그림·내용·앱·JSON</text><text x="118.0" y="115" font-size="10.5" fill="#4b5563" text-anchor="middle">완료: parseProjects로 검사</text><text x="118.0" y="130" font-size="10.5" fill="#4b5563" text-anchor="middle">틀리면 경로와 함께 알림</text><rect x="250" y="60" width="170" height="92" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="335.0" y="82" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">프로젝트 목록</text><text x="335.0" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">순서(≡)·숨김(스위치)·더하기</text><text x="335.0" y="115" font-size="10.5" fill="#4b5563" text-anchor="middle">완료 = 한 번에 저장</text><text x="335.0" y="130" font-size="10.5" fill="#4b5563" text-anchor="middle">overrideOf: 다른 필드만</text><rect x="462" y="60" width="180" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="552.0" y="82" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">PUT /site/projects</text><text x="552.0" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">AdminGuard·쓰기 횟수 제한</text><text x="552.0" y="115" font-size="10.5" fill="#4b5563" text-anchor="middle">parseProjects 다시 검사</text><text x="552.0" y="130" font-size="10.5" fill="#4b5563" text-anchor="middle">siteContent 한 줄 upsert</text><rect x="684" y="60" width="150" height="92" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="759.0" y="82" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">응답: 사이트 콘텐츠</text><text x="759.0" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">profile·projects</text><text x="759.0" y="115" font-size="10.5" fill="#4b5563" text-anchor="middle">updatedAt</text><path d="M208 106 L248 106" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M420 106 L460 106" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M642 106 L682 106" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="250" y="200" width="260" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="380.0" y="222" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">곧바로 다시 그리는 곳</text><text x="380.0" y="240" font-size="10.5" fill="#4b5563" text-anchor="middle">PROJECTS 배열을 splice로 다시 채움</text><text x="380.0" y="255" font-size="10.5" fill="#4b5563" text-anchor="middle">변경 횟수 저장소 → Safari 탭·Finder</text><rect x="540" y="200" width="294" height="80" rx="10" fill="#fff1f2" stroke="#fda4af"/><text x="687.0" y="222" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">시작할 때 한 번 정해지는 곳</text><text x="687.0" y="240" font-size="10.5" fill="#4b5563" text-anchor="middle">Dock·Launchpad 앱 목록, 사진 앨범</text><text x="687.0" y="255" font-size="10.5" fill="#4b5563" text-anchor="middle">바뀌었을 때만 "지금 새로고침" 권함</text><path d="M740 152 L420 198" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M760 152 L690 198" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="28" y="316" font-size="10.5" fill="#6b7280">검사 규칙(parseProjects)은 packages/desktop-core에 하나뿐이라 화면과 서버가 같은 말로 거절한다.</text><text x="28" y="336" font-size="10.5" fill="#6b7280">DELETE /site/projects는 저장한 값을 지워 코드의 기본값으로 돌아간다 (기본값으로 되돌리기).</text></svg>