<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>HyeoniversePage.css가 먼저, CreativeParts.css가 나중에 실린다. 같은 규칙이 두 번 있으면 나중 것이 이긴다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="680" height="322" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">두 파일이 실리는 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">HyeoniversePage.tsx의 import 순서 기준</text>
<rect x="32" y="76" width="616" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="340.0" y="98" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">1. HyeoniversePage.css  (페이지 전용, 1,444줄)</text><text x="340.0" y="118" font-size="10.5" fill="#374151" text-anchor="middle">.hy-* 페이지 고유 규칙  +  .cr-* 부품 규칙 103개 (복사본)</text><line x1="340.0" y1="130" x2="340.0" y2="150" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="152" width="616" height="52" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="340.0" y="174" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">2. CreativeParts.css  (부품, CreativeParts.tsx가 부른다)</text><text x="340.0" y="194" font-size="10.5" fill="#374151" text-anchor="middle">.cr-compare · .cr-lay · .cr-build · .cr-zoom … 같은 규칙이 한 번 더</text><line x1="340.0" y1="206" x2="340.0" y2="226" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="228" width="616" height="68" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="340.0" y="250" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">결과</text><text x="340.0" y="270" font-size="10.5" fill="#374151" text-anchor="middle">같은 선택자·같은 값 → 나중 것이 이기지만 값이 같아 화면은 그대로</text><text x="340.0" y="286" font-size="10.5" fill="#374151" text-anchor="middle">복사본을 지워도 같아야 한다 → 계산된 스타일로 확인</text>
</svg>
