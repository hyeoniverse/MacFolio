<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>서버에는 7일, R2에는 30일 남기고, R2 전체가 상한 8GB를 넘게 되면 올리지 않는다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="760" height="336" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">백업을 남기는 기간과 크기</text>
<text x="32" y="56" font-size="11" fill="#6b7280">하루 한 번 cron. 백업 하나는 처음 1007KB</text>
<text x="32" y="86" font-size="11" fill="#6b7280">오늘 ← 지난 날 수</text><line x1="60.0" y1="96" x2="60.0" y2="200" stroke="#e5e7eb"/><text x="60.0" y="214" font-size="10" fill="#6b7280" text-anchor="middle">0일</text><line x1="209.33333333333331" y1="96" x2="209.33333333333331" y2="200" stroke="#e5e7eb"/><text x="209.33333333333331" y="214" font-size="10" fill="#6b7280" text-anchor="middle">7일</text><line x1="358.66666666666663" y1="96" x2="358.66666666666663" y2="200" stroke="#e5e7eb"/><text x="358.66666666666663" y="214" font-size="10" fill="#6b7280" text-anchor="middle">14일</text><line x1="508.0" y1="96" x2="508.0" y2="200" stroke="#e5e7eb"/><text x="508.0" y="214" font-size="10" fill="#6b7280" text-anchor="middle">21일</text><line x1="700.0" y1="96" x2="700.0" y2="200" stroke="#e5e7eb"/><text x="700.0" y="214" font-size="10" fill="#6b7280" text-anchor="middle">30일</text><rect x="60" y="108" width="149.33333333333331" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/><text x="68" y="130" font-size="11.5" font-weight="600" fill="#1f2937">서버 ~/backups · 7일</text><rect x="60" y="154" width="640.0" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5"/><text x="68" y="176" font-size="11.5" font-weight="600" fill="#4f46e5">Cloudflare R2 · 30일 (rclone delete --min-age 30d)</text><text x="32" y="240" font-size="12" font-weight="600" fill="#1f2937">R2 크기</text><rect x="60" y="250" width="640" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db"/><rect x="60" y="250" width="512.0" height="22" rx="4" fill="#e0e7ff"/><rect x="60" y="250" width="3" height="22" fill="#4f46e5"/><line x1="572.0" y1="244" x2="572.0" y2="278" stroke="#dc2626" stroke-width="2"/><text x="572.0" y="292" font-size="10.5" fill="#dc2626" text-anchor="middle">상한 8GB</text><text x="700" y="292" font-size="10.5" fill="#6b7280" text-anchor="end">무료 10GB</text><text x="68" y="292" font-size="10.5" fill="#4f46e5">지금 30일치 ≈ 30MB</text>

<text x="60" y="314" font-size="10.5" fill="#dc2626">오늘 백업을 더해 8GB를 넘게 되면 올리지 않고 알림 주소의 /fail을 부른다 (서버에는 남는다)</text>
</svg>
