<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>파이썬에서 인스턴스 속성이 클래스 속성을 가리는 조회 순서</title><rect width="640" height="340" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="320" y="28" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600">self.rate 조회 순서: 인스턴스 → 클래스 → 부모 클래스</text>
<rect x="60" y="60" width="200" height="64" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="160.0" y="88.2" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Account 클래스</text>
<text x="160.0" y="105.2" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">rate = 0.1, count = 2</text>
<rect x="380" y="60" width="200" height="64" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="480.0" y="88.2" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Saving(Account) 클래스</text>
<text x="480.0" y="105.2" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">rate = 0.2</text>
<path d="M376 92 H264" fill="none" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#mff9f0a)"/>
<text x="320" y="84" font-size="11" fill="#ff9f0a" text-anchor="middle">상속</text>
<rect x="40" y="200" width="240" height="64" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="160.0" y="220.3" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">a 인스턴스</text>
<text x="160.0" y="236.3" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">owner=&quot;kim&quot;, balance=1501</text>
<text x="160.0" y="252.3" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">rate=0.5 (a.rate = 0.5로 추가)</text>
<rect x="380" y="200" width="200" height="64" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="480.0" y="228.3" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">b 인스턴스</text>
<text x="480.0" y="244.3" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">owner=&quot;lee&quot;, balance=600</text>
<path d="M160 198 V128" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)" stroke-dasharray="5 4"/>
<path d="M480 198 V128" fill="none" stroke="#0a84ff" stroke-width="2" marker-end="url(#m0a84ff)"/>
<text x="172" y="160" font-size="11" fill="#6e6e73">a.rate는 인스턴스 속성에서</text>
<text x="172" y="176" font-size="11" fill="#6e6e73">찾으므로 클래스까지 가지 않는다</text>
<text x="492" y="160" font-size="11" fill="#0a84ff" font-weight="600">b.rate →</text>
<text x="492" y="176" font-size="11" fill="#0a84ff" font-weight="600">Saving.rate = 0.2</text>
<text x="320" y="300" font-size="13" fill="#1d1d1f" text-anchor="middle">a.rate = 0.5 는 클래스 속성을 바꾸지 않고 a에만 새 속성을 만든다 → Account.rate 는 그대로 0.1</text>
<text x="320" y="322" font-size="12" fill="#6e6e73" text-anchor="middle">클래스 속성을 바꾸려면 Account.rate = 값 처럼 클래스 이름으로 대입한다</text>
</svg>
