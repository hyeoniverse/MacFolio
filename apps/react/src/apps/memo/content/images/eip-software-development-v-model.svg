<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>V 모델</title><rect width="640" height="410" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">V 모델: 개발 단계마다 짝이 되는 테스트 레벨</text><rect x="20" y="48" width="150" height="40" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="95.0" y="72.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">요구사항 분석</text><line x1="80" y1="88" x2="106" y2="108" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="110" width="150" height="40" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="125.0" y="134.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">시스템(기능) 설계</text><line x1="110" y1="150" x2="136" y2="170" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="80" y="172" width="150" height="40" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="155.0" y="196.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">아키텍처 설계</text><line x1="140" y1="212" x2="166" y2="232" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="234" width="150" height="40" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="185.0" y="258.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">상세 설계</text><rect x="470" y="48" width="150" height="40" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="545.0" y="72.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">인수 테스트</text><line x1="172" y1="68" x2="466" y2="68" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="320.0" y="60" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">사용자 요구 충족</text><line x1="530" y1="108" x2="556" y2="90" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="110" width="150" height="40" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="515.0" y="134.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">시스템 테스트</text><line x1="202" y1="130" x2="436" y2="130" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="320.0" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">기능·비기능 요구</text><line x1="500" y1="170" x2="526" y2="152" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="172" width="150" height="40" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="485.0" y="196.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">통합 테스트</text><line x1="232" y1="192" x2="406" y2="192" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="320.0" y="184" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">모듈 간 인터페이스</text><line x1="470" y1="232" x2="496" y2="214" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="380" y="234" width="150" height="40" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="455.0" y="258.7" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">단위 테스트</text><line x1="262" y1="254" x2="376" y2="254" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="320.0" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">모듈 하나의 동작</text><rect x="245" y="300" width="150" height="40" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="320.0" y="324.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">구현(코딩)</text><line x1="210" y1="274" x2="262" y2="298" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="380" y1="298" x2="430" y2="276" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="160" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">왼쪽: 위에서 아래로 상세해지는 개발 단계</text><text x="160" y="392" text-anchor="middle" font-size="12" font-weight="400" fill="#0a84ff">검증(Verification): 명세대로 만들었는가</text><text x="480" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">오른쪽: 아래에서 위로 실행하는 테스트</text><text x="480" y="392" text-anchor="middle" font-size="12" font-weight="400" fill="#ff9f0a">확인(Validation): 원한 것을 만들었는가</text></svg>
