<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>바깥으로 나가는 길을 openExternal 하나로</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">바깥으로 나가는 길을 openExternal 하나로</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">흩어진 window.open 호출을 한 함수로 모아, 여는 일과 남기는 일을 같이 한다</text>
<rect x="32" y="76" width="250" height="34" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="97.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">Dock의 링크 앱</text>
<line x1="282" y1="93" x2="400" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="118" width="250" height="34" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="139.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">Apple 메뉴의 GitHub 저장소</text>
<line x1="282" y1="135" x2="400" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="160" width="250" height="34" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="181.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">터미널 open</text>
<line x1="282" y1="177" x2="400" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="202" width="250" height="34" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="223.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">웹 창의 새 탭에서 열기</text>
<line x1="282" y1="219" x2="400" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="244" width="250" height="34" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="157.0" y="265.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">이 Mac에 관하여의 GitHub</text>
<line x1="282" y1="261" x2="400" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="404" y="120" width="200" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="504.0" y="155.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">openExternal(url)</text>
<text x="504.0" y="172.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">trackLink → window.open</text>
<line x1="604" y1="160" x2="660" y2="160" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="664" y="100" width="170" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="749.0" y="120.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">link 이벤트</text>
<text x="749.0" y="137.5" font-size="11" fill="#374151" text-anchor="middle">호스트 + 경로만</text>
<rect x="664" y="170" width="170" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="749.0" y="190.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">새 탭</text>
<text x="749.0" y="207.5" font-size="11" fill="#374151" text-anchor="middle">noopener,noreferrer</text>
<text x="404" y="240" font-size="11" fill="#6b7280" text-anchor="start">글 안의 &lt;a target=_blank&gt;는 문서 click 리스너(캡처 단계)가 잡는다</text>
</svg>
