<rect x="140" y="236" width="330" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="305.0" y="253.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">하루 상한</text>
<text x="305.0" y="270.5" font-size="11" fill="#374151" text-anchor="middle">IP 해시마다 5통, 전체 50통</text>
<line x1="305" y1="280" x2="305" y2="290" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<line x1="470" y1="258" x2="530" y2="258" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="534" y="240" width="290" height="36" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="679.0" y="262.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">429</text>
<rect x="140" y="290" width="330" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="305.0" y="307.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">Resend로 보내기</text>
<text x="305.0" y="324.5" font-size="11" fill="#374151" text-anchor="middle">from 내 도메인, reply_to 방문자</text>
<line x1="305" y1="334" x2="305" y2="344" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<line x1="470" y1="312" x2="530" y2="312" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="534" y="294" width="290" height="36" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="679.0" y="316.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">502 + 횟수 돌려줌</text>
<rect x="140" y="344" width="330" height="44" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="305.0" y="361.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">저장</text>
<text x="305.0" y="378.5" font-size="11" fill="#374151" text-anchor="middle">보낸 편지함용 (방문자 쿠키 해시)</text>
