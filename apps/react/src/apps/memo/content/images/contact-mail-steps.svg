<text x="305.0" y="145.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">입력 검사</text>
<text x="305.0" y="162.5" font-size="11" fill="#374151" text-anchor="middle">한 줄 이름·제목, 제어 문자</text>
