<line x1="470" y1="204" x2="530" y2="204" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="534" y="186" width="290" height="36" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
