<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker>
  </defs>
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">탭 A·B에서 메모를 열었을 때 기록이 보관되는 범위</text>

  <!-- 메모리 -->
  <rect x="12" y="46" width="196" height="236" rx="10" fill="#f2f2f7"/>
  <text x="110" y="70" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">메모리 (변수)</text>
  <rect x="26" y="86" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="65" y="111" font-size="12" fill="#1d1d1f" text-anchor="middle">탭 A</text>
  <rect x="116" y="86" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="155" y="111" font-size="12" fill="#1d1d1f" text-anchor="middle">탭 B</text>
  <rect x="26" y="156" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="65" y="181" font-size="12" fill="#1d1d1f" text-anchor="middle">기록 A</text>
  <rect x="116" y="156" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="155" y="181" font-size="12" fill="#1d1d1f" text-anchor="middle">기록 B</text>
  <line x1="65" y1="126" x2="65" y2="154" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="155" y1="126" x2="155" y2="154" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="110" y="226" font-size="12" fill="#ff3b30" text-anchor="middle">새로 고침 → 기록 삭제</text>
  <text x="110" y="248" font-size="12" fill="#6e6e73" text-anchor="middle">탭마다 따로</text>

  <!-- localStorage -->
  <rect x="222" y="46" width="196" height="236" rx="10" fill="#f2f2f7"/>
  <text x="320" y="70" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">localStorage</text>
  <rect x="236" y="86" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="275" y="111" font-size="12" fill="#1d1d1f" text-anchor="middle">탭 A</text>
  <rect x="326" y="86" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="365" y="111" font-size="12" fill="#1d1d1f" text-anchor="middle">탭 B</text>
  <rect x="256" y="156" width="128" height="40" rx="6" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="320" y="181" font-size="12" fill="#1d1d1f" text-anchor="middle">기록 하나 (출처 공용)</text>
  <line x1="275" y1="126" x2="300" y2="154" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="365" y1="126" x2="340" y2="154" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="320" y="226" font-size="12" fill="#ff3b30" text-anchor="middle">두 탭이 서로 덮어쓴다</text>
  <text x="320" y="248" font-size="12" fill="#6e6e73" text-anchor="middle">브라우저를 닫아도 남는다</text>

  <!-- sessionStorage -->
  <rect x="432" y="46" width="196" height="236" rx="10" fill="#fff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="530" y="70" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">sessionStorage (선택)</text>
  <rect x="446" y="86" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="485" y="111" font-size="12" fill="#1d1d1f" text-anchor="middle">탭 A</text>
  <rect x="536" y="86" width="78" height="40" rx="6" fill="#fff" stroke="#6e6e73"/>
  <text x="575" y="111" font-size="12" fill="#1d1d1f" text-anchor="middle">탭 B</text>
  <rect x="446" y="156" width="78" height="40" rx="6" fill="#f2f2f7" stroke="#0a84ff"/>
  <text x="485" y="181" font-size="12" fill="#1d1d1f" text-anchor="middle">기록 A</text>
  <rect x="536" y="156" width="78" height="40" rx="6" fill="#f2f2f7" stroke="#0a84ff"/>
  <text x="575" y="181" font-size="12" fill="#1d1d1f" text-anchor="middle">기록 B</text>
  <line x1="485" y1="126" x2="485" y2="154" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="575" y1="126" x2="575" y2="154" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="530" y="226" font-size="12" fill="#34c759" text-anchor="middle">새로 고침해도 남는다</text>
  <text x="530" y="248" font-size="12" fill="#6e6e73" text-anchor="middle">탭을 닫으면 삭제</text>

  <text x="320" y="312" font-size="12" fill="#6e6e73" text-anchor="middle">sessionStorage의 보관 범위(탭 하나, 탭을 닫을 때까지)는 브라우저 뒤로 가기 기록의 범위와 같다</text>
</svg>
