<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 352" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>자동 저장은 임시 저장에만 쓰고, 게시하면 게시한 내용이 되며 버전이 하나 쌓인다. 버전을 되돌리면 임시 저장으로 들어간다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="822" height="352" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">한 글의 두 벌과 버전</text>
<text x="32" y="56" font-size="11" fill="#6b7280">Post 한 행에 게시한 내용과 임시 저장을 나란히</text>
<rect x="32" y="90" width="200" height="74" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="132.0" y="112" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">편집기</text><text x="132.0" y="132" font-size="10.5" fill="#374151" text-anchor="middle">글을 누르면 바로 고친다</text><text x="132.0" y="148" font-size="10.5" fill="#374151" text-anchor="middle">멈추면 자동 저장</text><rect x="290" y="90" width="220" height="74" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="400.0" y="112" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">임시 저장 (draft*)</text><text x="400.0" y="132" font-size="10.5" fill="#374151" text-anchor="middle">PUT /posts/:slug/draft</text><text x="400.0" y="148" font-size="10.5" fill="#374151" text-anchor="middle">관리자만 본다</text><rect x="570" y="90" width="220" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="680.0" y="112" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">게시한 내용</text><text x="680.0" y="132" font-size="10.5" fill="#374151" text-anchor="middle">title·…·body·publishedAt</text><text x="680.0" y="148" font-size="10.5" fill="#374151" text-anchor="middle">방문자가 본다 (날짜가 되면)</text><line x1="234" y1="127" x2="288" y2="127" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="261.0" y="121.0" font-size="10" fill="#6b7280" text-anchor="middle">자동 저장</text><line x1="512" y1="120" x2="568" y2="120" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="540.0" y="114.0" font-size="10" fill="#6b7280" text-anchor="middle">게시</text><path d="M570 150 C 540 175, 540 175, 512 150" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="541" y="186" font-size="10" fill="#6b7280" text-anchor="middle">변경 사항 버리기</text><rect x="570" y="226" width="220" height="74" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="680.0" y="248" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">PostRevision</text><text x="680.0" y="268" font-size="10.5" fill="#374151" text-anchor="middle">게시할 때마다 한 줄</text><text x="680.0" y="284" font-size="10.5" fill="#374151" text-anchor="middle">글마다 최근 50개</text><line x1="680" y1="166" x2="680" y2="224" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><path d="M570 263 C 420 263, 400 200, 400 168" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="470" y="286" font-size="10" fill="#6b7280" text-anchor="middle">이 버전으로 되돌리기 → 임시 저장으로</text><text x="32" y="330" font-size="11" fill="#6b7280">예약: 게시한 날짜가 오늘(서울)보다 뒤면 GET /posts가 뺀다. 날짜가 되면 다음 요청부터 보인다</text>
</svg>
