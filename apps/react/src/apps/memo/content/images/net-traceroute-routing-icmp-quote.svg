<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">bsdi가 svr4에 보낸 ICMP time exceeded 56바이트</text>

  <!-- 바깥 IP 헤더 -->
  <text x="16" y="62" font-size="12" fill="#6e6e73">바깥 IP 헤더 20</text>
  <rect x="140" y="46" width="160" height="40" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
  <text x="220" y="63" text-anchor="middle" font-size="12" fill="#6e6e73">발신지</text>
  <text x="220" y="79" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f">172.16.13.35 (bsdi)</text>
  <rect x="300" y="46" width="160" height="40" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
  <text x="380" y="63" text-anchor="middle" font-size="12" fill="#6e6e73">목적지</text>
  <text x="380" y="79" text-anchor="middle" font-size="12" fill="#1d1d1f">172.16.13.34 (svr4)</text>
  <rect x="460" y="46" width="164" height="40" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
  <text x="542" y="63" text-anchor="middle" font-size="12" fill="#6e6e73">protocol</text>
  <text x="542" y="79" text-anchor="middle" font-size="12" fill="#1d1d1f">1 (ICMP)</text>

  <!-- ICMP 헤더 -->
  <text x="16" y="116" font-size="12" fill="#6e6e73">ICMP 헤더 8</text>
  <rect x="140" y="100" width="120" height="40" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="200" y="117" text-anchor="middle" font-size="12" fill="#6e6e73">유형</text>
  <text x="200" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f">11 time exceeded</text>
  <rect x="260" y="100" width="90" height="40" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="305" y="117" text-anchor="middle" font-size="12" fill="#6e6e73">코드</text>
  <text x="305" y="133" text-anchor="middle" font-size="12" fill="#1d1d1f">0</text>
  <rect x="350" y="100" width="110" height="40" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="405" y="125" text-anchor="middle" font-size="12" fill="#1d1d1f">체크섬</text>
  <rect x="460" y="100" width="164" height="40" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="542" y="125" text-anchor="middle" font-size="12" fill="#1d1d1f">사용 안 함(0) 4바이트</text>

  <!-- 인용 구간 -->
  <rect x="132" y="158" width="500" height="132" fill="none" stroke="#0a84ff" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
  <text x="140" y="176" font-size="12" font-weight="700" fill="#0a84ff">원래 데이터그램에서 그대로 복사한 28바이트</text>

  <text x="16" y="202" font-size="12" fill="#6e6e73">원래 IP 헤더 20</text>
  <rect x="140" y="186" width="160" height="40" fill="#fff" stroke="#6e6e73"/>
  <text x="220" y="203" text-anchor="middle" font-size="12" fill="#6e6e73">발신지</text>
  <text x="220" y="219" text-anchor="middle" font-size="12" fill="#1d1d1f">172.16.13.34 (svr4)</text>
  <rect x="300" y="186" width="160" height="40" fill="#fff" stroke="#6e6e73"/>
  <text x="380" y="203" text-anchor="middle" font-size="12" fill="#6e6e73">목적지</text>
  <text x="380" y="219" text-anchor="middle" font-size="12" fill="#1d1d1f">172.16.13.65 (slip)</text>
  <rect x="460" y="186" width="164" height="40" fill="#fff" stroke="#6e6e73"/>
  <text x="542" y="203" text-anchor="middle" font-size="12" fill="#6e6e73">protocol</text>
  <text x="542" y="219" text-anchor="middle" font-size="12" fill="#1d1d1f">17 (UDP)</text>

  <text x="16" y="256" font-size="12" fill="#6e6e73">UDP 헤더 8</text>
  <rect x="140" y="240" width="120" height="40" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="200" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">발신지 포트</text>
  <text x="200" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#0a84ff">42804</text>
  <rect x="260" y="240" width="120" height="40" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="320" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">목적지 포트</text>
  <text x="320" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#0a84ff">33435</text>
  <rect x="380" y="240" width="122" height="40" fill="#fff" stroke="#6e6e73"/>
  <text x="441" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">길이</text>
  <text x="441" y="273" text-anchor="middle" font-size="12" fill="#1d1d1f">20 (8 + 12)</text>
  <rect x="502" y="240" width="122" height="40" fill="#fff" stroke="#6e6e73"/>
  <text x="563" y="265" text-anchor="middle" font-size="12" fill="#1d1d1f">체크섬</text>

  <!-- 해석 -->
  <rect x="16" y="310" width="608" height="74" rx="8" fill="#f2f2f7"/>
  <text x="30" y="334" font-size="12" fill="#1d1d1f"><tspan font-weight="700">바깥 발신지 주소</tspan>가 1번째 홉 라우터의 주소다(TTL 1 프로브에 대한 응답).</text>
  <text x="30" y="354" font-size="12" fill="#1d1d1f"><tspan font-weight="700" fill="#0a84ff">인용된 포트 42804 → 33435</tspan>로 traceroute는 자기가 보낸 첫 프로브의 응답임을 대조한다.</text>
  <text x="30" y="374" font-size="12" fill="#1d1d1f">20 + 8 + 20 + 8 = 56바이트. 오류에 원래 헤더가 들어 있지 않으면 어느 통신의 오류인지 알 수 없다.</text>
</svg>
