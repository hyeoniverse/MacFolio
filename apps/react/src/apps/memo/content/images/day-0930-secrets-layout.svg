<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>저장소 폴더와 비밀 값 폴더를 나눈 서버 구성</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="350" fill="#ffffff"/>
<text x="24" y="34" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="700">서버 홈 폴더(/home/ubuntu)의 구성</text>
<rect x="24" y="56" width="280" height="220" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/>
<text x="40" y="82" font-size="15" fill="#0a84ff" text-anchor="start" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">~/macfolio</text>
<text x="40" y="102" font-size="12" fill="#6e6e73" text-anchor="start">코드: Git 저장소</text>
<text x="48" y="132" font-size="13" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">apps/  packages/  ops/</text>
<text x="48" y="156" font-size="13" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">docs/  README.md</text>
<text x="48" y="180" font-size="13" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">(git clone으로 받은 코드)</text>
<rect x="40" y="206" width="248" height="54" rx="6" fill="#e5f1ff" stroke="none" stroke-width="1.2"/>
<text x="52" y="228" font-size="12" fill="#1d1d1f" text-anchor="start">git pull은 이 폴더 안의</text>
<text x="52" y="246" font-size="12" fill="#1d1d1f" text-anchor="start">추적 파일만 갱신한다</text>
<rect x="336" y="56" width="280" height="220" rx="10" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.6"/>
<text x="352" y="82" font-size="15" fill="#c27400" text-anchor="start" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">~/deploy</text>
<text x="352" y="102" font-size="12" fill="#6e6e73" text-anchor="start">배포 설정: Git 밖, 서버에만</text>
<text x="360" y="132" font-size="13" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">.env     DB 비밀번호·터널 토큰</text>
<text x="360" y="156" font-size="13" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">api.env  API 환경 변수</text>
<text x="360" y="180" font-size="13" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">compose.yml</text>
<rect x="352" y="206" width="248" height="54" rx="6" fill="#fff4e5" stroke="none" stroke-width="1.2"/>
<text x="364" y="228" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">chmod 600 (-rw-------)</text>
<text x="364" y="246" font-size="12" fill="#1d1d1f" text-anchor="start">소유자 ubuntu만 읽고 쓴다</text>
<text x="24" y="306" font-size="13" fill="#1d1d1f" text-anchor="start">docker compose가 ~/deploy의 .env·api.env를 읽어 컨테이너 환경 변수로 넘긴다.</text>
<text x="24" y="328" font-size="13" fill="#1d1d1f" text-anchor="start">저장소를 다시 받거나 git pull을 실행해도 비밀 값 파일은 바뀌지 않는다.</text>
</svg>
