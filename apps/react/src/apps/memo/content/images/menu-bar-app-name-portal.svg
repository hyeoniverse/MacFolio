<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">메모 창의 '정렬과 그룹화' 메뉴를 눌렀을 때 두 트리에서의 위치</text>

  <!-- DOM 트리 -->
  <rect x="12" y="46" width="300" height="290" rx="10" fill="#f2f2f7"/>
  <text x="162" y="70" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">DOM 트리 (브라우저가 그리는 구조)</text>
  <g font-size="12.5" fill="#1d1d1f">
    <rect x="32" y="86" width="90" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="77" y="106" text-anchor="middle">body</text>
    <rect x="52" y="134" width="120" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="112" y="154" text-anchor="middle">#root</text>
    <rect x="72" y="182" width="150" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="147" y="202" text-anchor="middle">.desktop-surface</text>
    <rect x="92" y="230" width="120" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="152" y="250" text-anchor="middle">메모 창</text>
    <rect x="182" y="134" width="114" height="30" rx="6" fill="#fff" stroke="#ff9f0a" stroke-width="2"/><text x="239" y="154" text-anchor="middle">.ui-menu</text>
  </g>
  <path d="M60,116 V149 H52" fill="none" stroke="#6e6e73"/>
  <path d="M80,164 V197 H72" fill="none" stroke="#6e6e73"/>
  <path d="M100,212 V245 H92" fill="none" stroke="#6e6e73"/>
  <path d="M110,116 V124 H239 V134" fill="none" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="162" y="290" font-size="12" fill="#ff9f0a" text-anchor="middle">메뉴는 body의 자식: 창 요소 밖</text>
  <text x="162" y="310" font-size="12" fill="#6e6e73" text-anchor="middle">DOM으로 판별하면 '창 밖을 누름'</text>

  <!-- React 트리 -->
  <rect x="328" y="46" width="300" height="290" rx="10" fill="#fff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="478" y="70" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">React 트리 (컴포넌트 구조)</text>
  <g font-size="12.5" fill="#1d1d1f">
    <rect x="348" y="86" width="190" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="443" y="106" text-anchor="middle">바탕화면 레이어 (캡처 ①)</text>
    <rect x="368" y="134" width="190" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="463" y="154" text-anchor="middle">메모 창 (캡처 ②)</text>
    <rect x="388" y="182" width="190" height="30" rx="6" fill="#fff" stroke="#6e6e73"/><text x="483" y="202" text-anchor="middle">정렬 메뉴 버튼</text>
    <rect x="408" y="230" width="190" height="30" rx="6" fill="#fff" stroke="#ff9f0a" stroke-width="2"/><text x="503" y="250" text-anchor="middle">createPortal → Menu</text>
  </g>
  <path d="M356,116 V149 H368" fill="none" stroke="#6e6e73"/>
  <path d="M376,164 V197 H388" fill="none" stroke="#6e6e73"/>
  <path d="M396,212 V245 H408" fill="none" stroke="#6e6e73"/>
  <text x="478" y="290" font-size="12" fill="#0a84ff" text-anchor="middle">① focusDesktop → ② bringAppToFront('memo')</text>
  <text x="478" y="310" font-size="12" fill="#1d1d1f" text-anchor="middle">결과: 활성 앱은 메모로 유지</text>

  <text x="320" y="364" font-size="12" fill="#6e6e73" text-anchor="middle">React는 포털 안에서 발생한 이벤트를 DOM 위치가 아니라 React 트리의 조상 순서로 전파한다</text>
  <text x="320" y="384" font-size="12" fill="#6e6e73" text-anchor="middle">그래서 창이 연 메뉴를 눌러도 창의 onPointerDownCapture가 호출된다</text>
</svg>
