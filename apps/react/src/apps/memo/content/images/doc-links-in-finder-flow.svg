<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>글 본문의 저장소 문서 링크 처리</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0369a1"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker></defs>
<rect width="860" height="380" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">글 본문의 저장소 문서 링크 처리</text>
<text x="32" y="56" font-size="11" fill="#6b7280">MarkdownLink의 클릭 처리. 링크 주소(href)는 GitHub 주소 그대로 둔다</text>
<rect x="32" y="150" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="117.0" y="177.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">링크 클릭</text>
<text x="117.0" y="194.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">github.com/…/blob/main/</text>
<text x="117.0" y="210.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/backend-design.md</text>
<rect x="250" y="90" width="200" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="350.0" y="120.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">보조 키 · 가운데 버튼?</text>
<text x="350.0" y="137.5" font-size="11" fill="#374151" text-anchor="middle">⌘ · Ctrl · Shift</text>
<rect x="236" y="220" width="240" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="356.0" y="244.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">bundledDocOf(href)</text>
<text x="356.0" y="261.5" font-size="11" fill="#374151" text-anchor="middle">blob/main/ 으로 시작</text>
<text x="356.0" y="277.5" font-size="11" fill="#374151" text-anchor="middle">README · CONTRIBUTING · docs/*.md</text>
<text x="356.0" y="293.5" font-size="11" fill="#374151" text-anchor="middle"># · ? 없음</text>
<line x1="202" y1="175" x2="246" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<line x1="350" y1="160" x2="350" y2="216" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="375" y="192" font-size="11" fill="#374151" text-anchor="middle">아니요</text>
<rect x="530" y="70" width="300" height="60" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="680.0" y="95.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">GitHub 새 탭</text>
<text x="680.0" y="112.5" font-size="11" fill="#374151" text-anchor="middle">브라우저 기본 동작</text>
<line x1="450" y1="112" x2="526" y2="100" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="488" y="98" font-size="11" fill="#374151" text-anchor="middle">예</text>
<line x1="476" y1="240" x2="526" y2="120" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="515" y="190" font-size="11" fill="#374151" text-anchor="middle">null</text>
<rect x="530" y="230" width="300" height="100" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="680.0" y="259.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Finder에서 열기</text>
<text x="680.0" y="276.5" font-size="11" fill="#374151" text-anchor="middle">preventDefault()</text>
<text x="680.0" y="292.5" font-size="11" fill="#374151" text-anchor="middle">requestFinderDoc(경로)</text>
<text x="680.0" y="308.5" font-size="11" fill="#374151" text-anchor="middle">openApp(&#x27;finder&#x27;)</text>
<line x1="476" y1="280" x2="526" y2="280" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<text x="501" y="272" font-size="11" fill="#15803d" text-anchor="middle">경로 반환</text>
</svg>
