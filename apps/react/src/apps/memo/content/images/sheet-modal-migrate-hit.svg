<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>메모 이미지 크게 보기를 Modal로 옮길 때: 상자는 덮개 안을 다 채우되 pointer-events none, 이미지에서 닫기를 부르고 이미지 바깥 누름은 덮개가 받는다</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs>
<rect width="760" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">어디를 눌러도 닫히게: 누름이 닿는 곳</text>
<text x="32" y="66" font-size="13" fill="#1f2937" font-weight="700">전: 직접 만든 덮개</text>
<rect x="32" y="78" width="328" height="150" rx="10" fill="#374151" stroke="none"/>
<rect x="106" y="100" width="180" height="106" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="196" y="158" font-size="12" fill="#374151" font-weight="600" text-anchor="middle">이미지</text>
<text x="44" y="96" font-size="10" fill="#e5e7eb">rgba(0,0,0,.75) 덮개</text>
<text x="32" y="250" font-size="10.5" fill="#374151">· 덮개 하나가 role=&quot;dialog&quot;</text>
<text x="32" y="266" font-size="10.5" fill="#374151">· 이미지·바깥 어디를 눌러도 덮개가 받음</text>
<text x="32" y="282" font-size="10.5" fill="#374151">· Esc·흐려짐을 직접 적음</text>
<text x="400" y="66" font-size="13" fill="#1f2937" font-weight="700">후: Modal scope=&quot;screen&quot;</text>
<rect x="400" y="78" width="328" height="150" rx="10" fill="#374151" stroke="none"/>
<rect x="474" y="100" width="180" height="106" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="564" y="158" font-size="12" fill="#374151" font-weight="600" text-anchor="middle">이미지</text>
<text x="412" y="96" font-size="10" fill="#e5e7eb">rgba(0,0,0,.75) 덮개</text>
<text x="400" y="250" font-size="10.5" fill="#374151">· 덮개(.ui-modal-backdrop): 바깥 누름</text>
<text x="400" y="266" font-size="10.5" fill="#374151">· 상자: pointer-events: none</text>
<text x="400" y="282" font-size="10.5" fill="#374151">· 이미지: pointer-events 켜고 onClick=닫기</text>
</svg>
