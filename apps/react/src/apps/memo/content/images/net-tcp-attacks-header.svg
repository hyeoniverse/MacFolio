<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">TCP 헤더 구조 (32비트 단위, 괄호 안은 비트 수)</text>
  <g font-size="11" fill="#6e6e73">
    <text x="40" y="48">비트 0</text>
    <text x="318" y="48" text-anchor="end">15</text>
    <text x="322" y="48">16</text>
    <text x="600" y="48" text-anchor="end">31</text>
  </g>
  <g fill="#fff" stroke="#1d1d1f" stroke-width="1.2">
    <rect x="40" y="54" width="280" height="40"/>
    <rect x="320" y="54" width="280" height="40"/>
    <rect x="40" y="94" width="560" height="40"/>
    <rect x="40" y="134" width="560" height="40"/>
    <rect x="40" y="174" width="70" height="64" fill="#f2f2f7"/>
    <rect x="110" y="174" width="70" height="64" fill="#f2f2f7"/>
    <rect x="180" y="174" width="23.3" height="64" fill="#e5f0ff"/>
    <rect x="203.3" y="174" width="23.3" height="64" fill="#e5f0ff"/>
    <rect x="226.6" y="174" width="23.3" height="64" fill="#e5f0ff"/>
    <rect x="250" y="174" width="23.3" height="64" fill="#e5f0ff"/>
    <rect x="273.3" y="174" width="23.3" height="64" fill="#e5f0ff"/>
    <rect x="296.6" y="174" width="23.4" height="64" fill="#e5f0ff"/>
    <rect x="320" y="174" width="280" height="64"/>
    <rect x="40" y="238" width="280" height="40"/>
    <rect x="320" y="238" width="280" height="40"/>
    <rect x="40" y="278" width="560" height="40" fill="#f2f2f7"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#1d1d1f">
    <text x="180" y="78">출발지 포트(source port) (16)</text>
    <text x="460" y="78">목적지 포트(destination port) (16)</text>
    <text x="320" y="118">시퀀스 번호(sequence number) (32)</text>
    <text x="320" y="158">확인 응답 번호(ACK number) (32)</text>
    <text x="460" y="210">윈도우 크기(window size) (16)</text>
    <text x="180" y="262">체크섬(checksum) (16)</text>
    <text x="460" y="262">긴급 포인터(urgent pointer) (16)</text>
    <text x="320" y="302">옵션(options) (0 또는 32비트 단위)</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#1d1d1f">
    <text x="75" y="196">헤더 길이</text>
    <text x="75" y="211" fill="#6e6e73">(header</text>
    <text x="75" y="224" fill="#6e6e73">length) (4)</text>
    <text x="145" y="203">예약</text>
    <text x="145" y="218" fill="#6e6e73">(reserved) (6)</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#0a84ff" font-weight="600">
    <text x="191.6" y="200">URG</text>
    <text x="214.9" y="200">ACK</text>
    <text x="238.2" y="200">PSH</text>
    <text x="261.6" y="200">RST</text>
    <text x="284.9" y="200">SYN</text>
    <text x="308.3" y="200">FIN</text>
  </g>
</svg>
