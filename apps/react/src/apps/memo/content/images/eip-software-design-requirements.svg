<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>요구사항 개발 프로세스</title><rect width="640" height="334" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">요구사항 개발 프로세스</text><rect x="30" y="48" width="140" height="46" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="100.0" y="75.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="100" y="69" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">도출</text><text x="100" y="86" text-anchor="middle" font-size="11" font-weight="400" fill="#e8f2ff">Elicitation</text><rect x="190" y="48" width="420" height="46" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="400.0" y="75.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">인터뷰, 설문, 브레인스토밍, 워크숍, 프로토타이핑, 유스케이스</text><line x1="100" y1="94" x2="100" y2="108" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="110" width="140" height="46" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="100.0" y="137.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="100" y="131" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">분석</text><text x="100" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#e8f2ff">Analysis</text><rect x="190" y="110" width="420" height="46" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="400.0" y="137.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">누락·충돌 확인, 범위 결정, DFD·자료 사전·UML로 모델링</text><line x1="100" y1="156" x2="100" y2="170" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="172" width="140" height="46" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="100.0" y="199.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="100" y="193" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">명세</text><text x="100" y="210" text-anchor="middle" font-size="11" font-weight="400" fill="#e8f2ff">Specification</text><rect x="190" y="172" width="420" height="46" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="400.0" y="199.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">요구사항 명세서(SRS) 작성, 정형·비정형 명세</text><line x1="100" y1="218" x2="100" y2="232" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="234" width="140" height="46" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="100.0" y="261.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="100" y="255" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">확인</text><text x="100" y="272" text-anchor="middle" font-size="11" font-weight="400" fill="#e8f2ff">Validation</text><rect x="190" y="234" width="420" height="46" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="400.0" y="261.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">동료 검토, 워크스루, 인스펙션으로 명세서 검증</text><path d="M30 294 H610" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="6 4"/><text x="320" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#ff9f0a">요구사항 관리: 위 과정 전체에서 변경 요청을 접수·평가·추적한다</text></svg>
