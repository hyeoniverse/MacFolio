<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>HttpException이면 그대로, http-errors 4xx면 상태를 믿고, 나머지는 500으로 감추고 그때만 로그를 남긴다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="720" height="382" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">오류 하나가 응답이 되기까지</text>
<text x="32" y="56" font-size="11" fill="#6b7280">apps/api/src/common/http-error.filter.ts</text>
<rect x="32" y="76" width="656" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="360.0" y="98" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">1. HttpException인가?</text><text x="360.0" y="118" font-size="10.5" fill="#374151" text-anchor="middle">예 → 그 상태와 설명 그대로 (404, 400, 401 …)</text><line x1="360.0" y1="130" x2="360.0" y2="150" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="152" width="656" height="52" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="360.0" y="174" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">2. http-errors 모양인가? status 4xx이고 expose === true</text><text x="360.0" y="194" font-size="10.5" fill="#374151" text-anchor="middle">예 → 그 상태 (413·400), 설명은 type으로 우리말 (entity.too.large → 요청이 너무 큽니다.)</text><line x1="360.0" y1="206" x2="360.0" y2="226" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="228" width="656" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="360.0" y="250" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">3. 그 밖의 모든 오류 (DB, 코드 버그, 5xx)</text><text x="360.0" y="270" font-size="10.5" fill="#374151" text-anchor="middle">500 &quot;서버에서 문제가 생겼습니다&quot; · 내용은 감춘다</text><line x1="360.0" y1="282" x2="360.0" y2="302" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="304" width="656" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="360.0" y="326" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">로그</text><text x="360.0" y="346" font-size="10.5" fill="#374151" text-anchor="middle">500일 때만 &quot;GET /posts → 500&quot; + 오류 → SafeLogger가 가린 뒤 stdout</text>
</svg>
