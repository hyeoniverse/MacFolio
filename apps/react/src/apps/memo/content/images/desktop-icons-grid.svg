<text x="390" y="190" font-size="10.5" fill="#047857" text-anchor="middle">끌어 놓은 곳</text>
<circle cx="375" cy="165" r="4" fill="#047857"/>
<text x="40" y="90" font-size="11" fill="#374151" text-anchor="start">창 폭이 바뀌어도</text>
<text x="40" y="106" font-size="11" fill="#374151" text-anchor="start">오른쪽 끝을 기준으로</text>
<text x="40" y="122" font-size="11" fill="#374151" text-anchor="start">다시 계산한다</text>
<text x="40" y="170" font-size="11" fill="#374151" text-anchor="start">놓으면 가장 가까운 칸,</text>
<text x="40" y="186" font-size="11" fill="#374151" text-anchor="start">차 있으면 가까운 빈 칸</text>
<text x="360" y="340" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x = 화면 폭 − 오른쪽 여백 − (col + 1) × 칸 폭,  y = 위 여백 + row × 칸 높이</text>
