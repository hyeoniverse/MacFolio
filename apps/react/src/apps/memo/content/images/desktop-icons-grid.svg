<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="720" height="360" fill="#fff"/>
  <text x="360.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">자리는 오른쪽 위에서 세는 칸으로 저장한다</text>
<rect x="20" y="45" width="680" height="270" rx="10" fill="none" stroke="#d1d5db"/>
