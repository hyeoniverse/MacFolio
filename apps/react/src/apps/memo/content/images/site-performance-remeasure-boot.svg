<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="276" rx="16" fill="#f5f5f7"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#1d1d1f">첫 번들(boot) 크기, brotli 압축</text>
<text x="150" y="77" font-size="13" text-anchor="end" fill="#3a3a3c">개선 전</text>
<rect x="162" y="64" width="440.0" height="18" rx="4" fill="#c7c7cc"/>
<text x="610.0" y="78" font-size="12" font-weight="700" fill="#1d1d1f">250KB</text>
<text x="658.0" y="78" font-size="12" fill="#3a3a3c">모든 앱 코드 포함</text>
<text x="150" y="109" font-size="13" text-anchor="end" fill="#3a3a3c">1차</text>
<rect x="162" y="96" width="82.7" height="18" rx="4" fill="#34c759"/>
<text x="252.72" y="110" font-size="12" font-weight="700" fill="#1d1d1f">47KB</text>
<text x="300.72" y="110" font-size="12" fill="#3a3a3c">앱을 lazy로 분리</text>
<text x="150" y="141" font-size="13" text-anchor="end" fill="#3a3a3c">3차</text>
<rect x="162" y="128" width="81.0" height="18" rx="4" fill="#34c759"/>
<text x="250.95999999999998" y="142" font-size="12" font-weight="700" fill="#1d1d1f">46KB</text>
<text x="150" y="173" font-size="13" text-anchor="end" fill="#3a3a3c">재측정</text>
<rect x="162" y="160" width="114.4" height="18" rx="4" fill="#ff9f0a"/>
<text x="284.4" y="174" font-size="12" font-weight="700" fill="#1d1d1f">65KB</text>
<text x="332.4" y="174" font-size="12" fill="#3a3a3c">명언 365개(원문 66KB)가 포함 +19KB</text>
<text x="150" y="205" font-size="13" text-anchor="end" fill="#3a3a3c">4차</text>
<rect x="162" y="192" width="82.7" height="18" rx="4" fill="#34c759"/>
<text x="252.72" y="206" font-size="12" font-weight="700" fill="#1d1d1f">47KB</text>
<text x="300.72" y="206" font-size="12" fill="#3a3a3c">명언 위젯을 lazy로 분리</text>
<text x="24" y="238" font-size="13" fill="#1d1d1f">첫 방문 전송량(휴대폰): 3차 483KB → 재측정 505KB → 4차 485KB</text>
<text x="24" y="258" font-size="12" fill="#3a3a3c">달라진 파일은 boot 하나였다. 3차 머지 시점(3e0c919ca)과 현재 main을 같은 방법으로 열어 파일별 전송량을 비교했다</text>
</svg>
