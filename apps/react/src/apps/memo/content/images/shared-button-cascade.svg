<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>같은 속성을 지정한 규칙 여럿 가운데 하나를 고르는 캐스케이드 단계</title>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
  <rect width="640" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">같은 요소의 같은 속성에 규칙이 여럿이면</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">위 단계에서 승부가 나면 아래 단계는 확인하지 않는다 (작성자 CSS 기준으로 줄임)</text>

  <g font-size="12">
    <rect x="24" y="76" width="260" height="66" rx="10" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="40" y="100" font-size="13" font-weight="600" fill="#1d1d1f">1. 중요도 (!important)</text>
    <text x="40" y="120" fill="#6e6e73">!important 선언이 일반 선언보다 우선</text>

    <rect x="24" y="160" width="260" height="66" rx="10" fill="#e8f2ff" stroke="#0a84ff"/>
    <text x="40" y="184" font-size="13" font-weight="600" fill="#1d1d1f">2. 캐스케이드 레이어 (@layer)</text>
    <text x="40" y="204" fill="#6e6e73">레이어 밖 &gt; 나중 레이어 &gt; 먼저 레이어</text>

    <rect x="24" y="244" width="260" height="66" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="40" y="268" font-size="13" font-weight="600" fill="#1d1d1f">3. 명시도 (a, b, c)</text>
    <text x="40" y="288" fill="#6e6e73">ID 수, 클래스·속성·가상 클래스 수, 태그 수</text>

    <rect x="24" y="328" width="260" height="66" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="40" y="352" font-size="13" font-weight="600" fill="#1d1d1f">4. 선언 순서</text>
    <text x="40" y="372" fill="#6e6e73">뒤에 선언된 규칙이 우선</text>

    <line x1="154" y1="144" x2="154" y2="158" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#c)"/>
    <line x1="154" y1="228" x2="154" y2="242" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#c)"/>
    <line x1="154" y1="312" x2="154" y2="326" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#c)"/>

    <!-- examples -->
    <text x="312" y="98" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-tool.on { color: X !important }</text>
    <text x="312" y="116" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-tool:hover:not(:disabled) { … }</text>
    <text x="312" y="134" fill="#ff9f0a">→ 명시도와 관계없이 첫 규칙 적용</text>

    <text x="312" y="182" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">a { color: inherit }  /* 레이어 밖 */</text>
    <text x="312" y="200" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">@layer reset { .gh a { … } }</text>
    <text x="312" y="218" fill="#0a84ff">→ (0,0,1)인 a가 (0,1,1)을 이긴다</text>

    <text x="312" y="266" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-tool:hover:not(:disabled)</text>
    <text x="312" y="284" fill="#1d1d1f">  (0,3,0)  &gt;  .memo-tool.on  (0,2,0)</text>
    <text x="312" y="302" fill="#6e6e73">→ 호버 규칙이 활성 규칙을 이긴다</text>

    <text x="312" y="350" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-pin.on  (0,2,0) 파일 앞쪽</text>
    <text x="312" y="368" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-tool.on (0,2,0) 파일 뒤쪽</text>
    <text x="312" y="386" fill="#6e6e73">→ 둘 다 !important면 뒤쪽이 적용</text>
  </g>
  <text x="24" y="418" font-size="12" fill="#6e6e73">!important 선언끼리는 레이어 순서가 뒤집힌다(먼저 선언한 레이어가 우선). 이 글의 사례는 모두 일반 선언이다</text>
</svg>
