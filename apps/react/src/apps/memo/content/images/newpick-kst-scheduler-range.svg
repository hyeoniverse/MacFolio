<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>"10월 19일" 범위가 9시간 밀려 있었다</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="900" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">"10월 19일" 범위가 9시간 밀려 있었다</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">KST 기준 시간축. 08:00 크롤링 결과가 기존 범위에서는 18일 조회에 들어갔다</text>
<text x="32" y="109" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">기존 (.utc(true))</text>
<rect x="285.0" y="94" width="360.0" height="24" rx="5" fill="#b91c1c"/>
<text x="465.0" y="110.0" font-size="11" fill="#ffffff" text-anchor="middle">19일 09:00 ~ 20일 08:59</text>
<rect x="150" y="94" width="135.0" height="24" rx="5" fill="#fef2f2"/>
<text x="217.5" y="110.0" font-size="11" fill="#b91c1c" text-anchor="middle">← 18일 범위</text>
<text x="32" y="159" font-size="12" fill="#15803d" text-anchor="start" font-weight="600">수정 (kstDayRange)</text>
<rect x="510.0" y="144" width="360.0" height="24" rx="5" fill="#15803d"/>
<text x="690.0" y="160.0" font-size="11" fill="#ffffff" text-anchor="middle">19일 00:00 ~ 23:59</text>
<line x1="150" y1="206" x2="870" y2="206" stroke="#9ca3af"/>
<line x1="150.0" y1="202" x2="150.0" y2="210" stroke="#9ca3af"/>
<text x="150.0" y="226" font-size="10" fill="#6b7280" text-anchor="middle">18일 00시</text>
<line x1="285.0" y1="202" x2="285.0" y2="210" stroke="#9ca3af"/>
<text x="285.0" y="226" font-size="10" fill="#6b7280" text-anchor="middle">09시</text>
<line x1="510.0" y1="202" x2="510.0" y2="210" stroke="#9ca3af"/>
<text x="510.0" y="226" font-size="10" fill="#6b7280" text-anchor="middle">19일 00시</text>
<line x1="630.0" y1="202" x2="630.0" y2="210" stroke="#9ca3af"/>
<text x="630.0" y="226" font-size="10" fill="#6b7280" text-anchor="middle">08시</text>
<line x1="870.0" y1="202" x2="870.0" y2="210" stroke="#9ca3af"/>
<text x="870.0" y="226" font-size="10" fill="#6b7280" text-anchor="middle">20일 00시</text>
<line x1="630.0" y1="84" x2="630.0" y2="200" stroke="#4f46e5" stroke-dasharray="4 3" stroke-width="1.5"/>
<circle cx="630.0" cy="190" r="7" fill="#4f46e5"/>
<text x="640.0" y="194" font-size="11" fill="#4f46e5" text-anchor="start" font-weight="600">19일 08:00 크롤링</text>
<text x="32" y="262" font-size="11" fill="#374151" text-anchor="start">기존 식은 KST 0시를 구한 뒤 시각만 남긴 채 UTC로 바꿔, 범위 전체가 +9시간 이동했다.</text>
<text x="32" y="280" font-size="11" fill="#6b7280" text-anchor="start">무료 체험이 '어제'를 요청하던 것도 이 밀림을 피하려던 흔적으로 보인다.</text>
</svg>
