<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>playsinline이 없으면 영상이 페이지를 덮는 전체 화면 플레이어로 열리고, playsinline이 있으면 페이지 안에서 재생된다</title>
<rect width="860" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">playsinline이 없으면 iPhone은 전체 화면으로 재생한다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">iPhone Safari는 playsinline 속성이 없는 video를 재생하면 전체 화면 플레이어로 전환한다 (도식)</text>
<text x="250" y="88" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">playsinline 없음</text>
<text x="250" y="384" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;video src="…" controls&gt;</text>
<rect x="160" y="100" width="180" height="270" rx="26" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<clipPath id="s160"><rect x="166" y="106" width="168" height="258" rx="21"/></clipPath>
<g clip-path="url(#s160)">
<rect x="166" y="106" width="168" height="258" fill="#000000"/>
<rect x="166" y="185.0" width="168" height="100" fill="#334155"/>
<polygon points="240.0,221.0 240.0,249.0 264.0,235.0" fill="#ffffff"/>
<text x="180" y="150" font-size="10" fill="#ffffff" font-weight="700" text-anchor="start">완료</text>
<rect x="180" y="324" width="140" height="4" rx="2" fill="#6b7280"/>
<text x="250.0" y="350" font-size="9" fill="#fca5a5" font-weight="700" text-anchor="middle">페이지를 덮는 전체 화면 플레이어</text>
</g>
<rect x="224.0" y="112" width="52" height="14" rx="7" fill="#111827"/>
<text x="590" y="88" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">playsinline</text>
<text x="590" y="384" font-size="10.5" fill="#15803d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;video src="…" controls playsinline&gt;</text>
<rect x="500" y="100" width="180" height="270" rx="26" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<clipPath id="s500"><rect x="506" y="106" width="168" height="258" rx="21"/></clipPath>
<g clip-path="url(#s500)">
<rect x="506" y="106" width="168" height="258" fill="#ffffff"/>
<text x="518" y="148" font-size="11" fill="#1f2937" font-weight="700" text-anchor="start">소개</text>
<rect x="518" y="160" width="144" height="86" rx="10" fill="#334155"/>
<polygon points="582.0,192 582.0,214 602.0,203" fill="#ffffff"/>
<rect x="518" y="258" width="144" height="5" rx="2.5" fill="#cbd5e1"/>
<rect x="518" y="270" width="126" height="5" rx="2.5" fill="#cbd5e1"/>
<rect x="518" y="282" width="108" height="5" rx="2.5" fill="#cbd5e1"/>
<rect x="518" y="294" width="144" height="5" rx="2.5" fill="#cbd5e1"/>
<rect x="518" y="306" width="126" height="5" rx="2.5" fill="#cbd5e1"/>
<text x="590.0" y="350" font-size="9" fill="#15803d" font-weight="700" text-anchor="middle">페이지 안에서 재생된다</text>
</g>
<rect x="564.0" y="112" width="52" height="14" rx="7" fill="#111827"/>
</svg>
