<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>목차를 펼치고 접는 동안 높이·불투명도·visibility·화살표가 바뀌는 시간</title>
<rect width="860" height="440" fill="#fff"/>
<text x="430" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">펼치기·접기 시간표 (--duration 280ms, --duration-fast 160ms)</text>
<g font-size="12.5" fill="#374151">
<text x="40" y="66" font-weight="600" fill="#111827" font-size="13.5">펼치기 (data-open = true)</text>
<text x="40" y="96">높이 (grid-template-rows)</text>
<rect x="260" y="84" width="560" height="16" rx="4" fill="#fde68a"/>
<text x="540" y="96" text-anchor="middle" fill="#92400e">0fr → 1fr, 280ms ease-out</text>
<text x="40" y="126">불투명도 (opacity)</text>
<rect x="260" y="114" width="560" height="16" rx="4" fill="#fde68a"/>
<text x="540" y="126" text-anchor="middle" fill="#92400e">0 → 1, 280ms</text>
<text x="40" y="156">visibility</text>
<rect x="260" y="144" width="560" height="16" rx="4" fill="#bbf7d0"/>
<text x="540" y="156" text-anchor="middle" fill="#166534">0ms에 바로 visible</text>
<text x="40" y="186">화살표 (›  → ⌄)</text>
<rect x="260" y="174" width="320" height="16" rx="4" fill="#dbeafe"/>
<text x="420" y="186" text-anchor="middle" fill="#1e40af">-90° → 0°, 160ms</text>
<text x="40" y="236" font-weight="600" fill="#111827" font-size="13.5">접기 (data-open = false)</text>
<text x="40" y="266">높이 (grid-template-rows)</text>
<rect x="260" y="254" width="560" height="16" rx="4" fill="#fde68a"/>
<text x="540" y="266" text-anchor="middle" fill="#92400e">1fr → 0fr, 280ms ease-out</text>
<text x="40" y="296">불투명도 (opacity)</text>
<rect x="260" y="284" width="320" height="16" rx="4" fill="#fde68a"/>
<text x="420" y="296" text-anchor="middle" fill="#92400e">1 → 0, 160ms</text>
<text x="40" y="326">visibility</text>
<rect x="260" y="314" width="560" height="16" rx="4" fill="#bbf7d0"/>
<rect x="816" y="310" width="4" height="24" fill="#166534"/>
<text x="540" y="326" text-anchor="middle" fill="#166534">280ms 동안 visible, 끝나는 시각에 hidden (Tab 제외)</text>
<text x="40" y="356">화살표 (⌄ → ›)</text>
<rect x="260" y="344" width="320" height="16" rx="4" fill="#dbeafe"/>
<text x="420" y="356" text-anchor="middle" fill="#1e40af">0° → -90°, 160ms</text>
</g>
<g font-size="11.5" fill="#6b7280">
<path d="M260 380 H820" stroke="#9ca3af"/>
<path d="M260 376 V384 M580 376 V384 M820 376 V384" stroke="#9ca3af"/>
<text x="260" y="398" text-anchor="middle">0ms</text>
<text x="580" y="398" text-anchor="middle">160ms</text>
<text x="820" y="398" text-anchor="middle">280ms</text>
<text x="40" y="424">prefers-reduced-motion: reduce → 모든 전환 0ms (바로 열고 닫는다)</text>
</g>
</svg>
