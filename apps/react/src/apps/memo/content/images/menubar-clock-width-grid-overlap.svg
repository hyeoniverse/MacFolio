<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>숨긴 예약 문자열과 현재 시각을 같은 그리드 셀에 겹친다</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="24" y="30" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">.time-display: 셀 하나짜리 inline-grid, 자식 셋이 모두 grid-area: 1 / 1</text>
<text x="24" y="62" font-size="13" fill="#6e6e73" text-anchor="start">펼쳐서 본 세 자식</text>
<rect x="120" y="76" width="262" height="30" rx="4" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="372" y="96" font-size="13" fill="#6e6e73" text-anchor="end">12:00 AM</text>
<text x="398" y="96" font-size="12" fill="#6e6e73" text-anchor="start">예약, visibility: hidden, aria-hidden</text>
<rect x="123" y="116" width="259" height="30" rx="4" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="372" y="136" font-size="13" fill="#6e6e73" text-anchor="end">12:00 PM</text>
<text x="398" y="136" font-size="12" fill="#6e6e73" text-anchor="start">예약, visibility: hidden, aria-hidden</text>
<rect x="192" y="156" width="190" height="30" rx="4" fill="#e5f0ff" stroke="#0a84ff" stroke-width="1.2"/>
<text x="372" y="176" font-size="13" fill="#1d1d1f" text-anchor="end" font-weight="700">1:11 PM</text>
<text x="398" y="176" font-size="12" fill="#6e6e73" text-anchor="start">현재 시각, 보이고 스크린 리더가 읽음</text>
<text x="24" y="230" font-size="13" fill="#6e6e73" text-anchor="start">겹친 결과</text>
<rect x="120" y="212" width="262" height="34" rx="4" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="372" y="234" font-size="13" fill="#1d1d1f" text-anchor="end" font-weight="700">1:11 PM</text>
<text x="398" y="226" font-size="12" fill="#0a84ff" text-anchor="start" font-weight="700">셀 폭 = 가장 넓은 자식 = 52.45px</text>
<text x="398" y="242" font-size="12" fill="#6e6e73" text-anchor="start">justify-items: end로 오른쪽 정렬</text>
<line x1="120" y1="262" x2="382" y2="262" stroke="#0a84ff" stroke-width="1.6" marker-start="url(#arb)" marker-end="url(#arb)"/>
<text x="251.0" y="284" font-size="12" fill="#0a84ff" text-anchor="middle">어느 시각을 표시해도 이 폭은 변하지 않는다</text>
</svg>
