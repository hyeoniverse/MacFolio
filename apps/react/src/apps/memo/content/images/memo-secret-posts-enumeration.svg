<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>응답 모양이 다르면 비밀 글의 존재가 드러나는 예</title>
<rect width="640" height="380" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">주소를 대입하는 요청에 무엇을 돌려주는가</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">방문자가 GET /posts/&lt;주소&gt;/comments를 차례로 보낸 경우. 주소는 설명용 예시다</text>
<rect x="20" y="66" width="290" height="300" rx="12" fill="#fff1f0" stroke="#ff3b30"/>
<text x="36" y="92" font-size="14" font-weight="700" fill="#ff3b30">비밀 글에만 403을 보내면</text>
<g font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">
<text x="36" y="124">2026-10-23-000000 → 200 []</text>
<text x="36" y="148">2026-10-23-000001 → 200 []</text>
<text x="36" y="172">…</text>
<text x="36" y="196" fill="#ff3b30" font-weight="700">2026-10-23-a1b2c3 → 403</text>
<text x="36" y="220">2026-10-23-a1b2c4 → 200 []</text>
</g>
<text x="36" y="258" font-size="12" fill="#1d1d1f">403이 나온 주소에 비밀 글이 있다는</text>
<text x="36" y="280" font-size="12" fill="#1d1d1f">사실과 작성 날짜가 드러난다</text>
<text x="36" y="316" font-size="12" fill="#6e6e73">내용은 보이지 않아도 존재 여부가</text>
<text x="36" y="338" font-size="12" fill="#6e6e73">정보가 된다</text>
<rect x="330" y="66" width="290" height="300" rx="12" fill="#eefaf1" stroke="#34c759"/>
<text x="346" y="92" font-size="14" font-weight="700" fill="#248a3d">없는 글과 같은 응답을 보내면</text>
<g font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">
<text x="346" y="124">2026-10-23-000000 → 200 []</text>
<text x="346" y="148">2026-10-23-000001 → 200 []</text>
<text x="346" y="172">…</text>
<text x="346" y="196" font-weight="700" fill="#248a3d">2026-10-23-a1b2c3 → 200 []</text>
<text x="346" y="220">2026-10-23-a1b2c4 → 200 []</text>
</g>
<text x="346" y="258" font-size="12" fill="#1d1d1f">모든 주소의 응답이 같아</text>
<text x="346" y="280" font-size="12" fill="#1d1d1f">비밀 글 주소를 골라낼 수 없다</text>
<text x="346" y="316" font-size="12" fill="#6e6e73">관리자 세션이 있는 요청만</text>
<text x="346" y="338" font-size="12" fill="#6e6e73">실제 댓글 목록을 받는다</text>
</svg>
