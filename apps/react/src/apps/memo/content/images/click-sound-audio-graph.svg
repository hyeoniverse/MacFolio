<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>mp3 파일을 한 번 내려받아 AudioBuffer로 디코딩해 두고, 클릭마다 새 AudioBufferSourceNode를 만들어 GainNode(0.4)를 거쳐 스피커로 보낸다</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
</defs>
<rect width="640" height="380" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">한 번 디코딩하고, 누를 때마다 새 노드로 재생</text>
<!-- load row -->
<text x="24" y="66" font-size="12" font-weight="600" fill="#6e6e73">처음 한 번 (load)</text>
<rect x="24" y="76" width="150" height="56" rx="8" fill="#f2f2f7"/>
<text x="99" y="99" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">fetch</text>
<text x="99" y="118" font-size="12" fill="#6e6e73" text-anchor="middle">mp3 3,133바이트</text>
<line x1="174" y1="104" x2="224" y2="104" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="226" y="76" width="170" height="56" rx="8" fill="#f2f2f7"/>
<text x="311" y="99" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">decodeAudioData</text>
<text x="311" y="118" font-size="12" fill="#6e6e73" text-anchor="middle">압축 해제 (mp3 → PCM)</text>
<line x1="396" y1="104" x2="446" y2="104" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="448" y="76" width="168" height="56" rx="8" fill="#ffffff" stroke="#34c759" stroke-width="2"/>
<text x="532" y="99" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">AudioBuffer</text>
<text x="532" y="118" font-size="12" fill="#6e6e73" text-anchor="middle">2채널 × 약 3,450샘플</text>
<!-- per click -->
<path d="M532 132 V166 H40 V320" fill="none" stroke="#34c759" stroke-dasharray="4 3" stroke-width="1.4"/>
<line x1="40" y1="220" x2="58" y2="220" stroke="#34c759" stroke-dasharray="4 3" stroke-width="1.4"/>
<line x1="40" y1="270" x2="58" y2="270" stroke="#34c759" stroke-dasharray="4 3" stroke-width="1.4"/>
<line x1="40" y1="320" x2="58" y2="320" stroke="#34c759" stroke-dasharray="4 3" stroke-width="1.4"/>
<rect x="300" y="154" width="216" height="22" fill="#ffffff"/>
<text x="408" y="170" font-size="12" fill="#34c759" text-anchor="middle">source.buffer (같은 버퍼 공유)</text>
<text x="60" y="192" font-size="12" font-weight="600" fill="#6e6e73">누를 때마다 (play)</text>
<rect x="60" y="200" width="190" height="40" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="155" y="224" font-size="12" fill="#1d1d1f" text-anchor="middle">AudioBufferSourceNode ①</text>
<rect x="60" y="250" width="190" height="40" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="155" y="274" font-size="12" fill="#1d1d1f" text-anchor="middle">AudioBufferSourceNode ②</text>
<rect x="60" y="300" width="190" height="40" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="155" y="324" font-size="12" fill="#1d1d1f" text-anchor="middle">AudioBufferSourceNode ③</text>
<line x1="250" y1="220" x2="342" y2="264" stroke="#1d1d1f" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="250" y1="270" x2="342" y2="270" stroke="#1d1d1f" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="250" y1="320" x2="342" y2="276" stroke="#1d1d1f" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="344" y="244" width="120" height="52" rx="8" fill="#f2f2f7"/>
<text x="404" y="266" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">GainNode</text>
<text x="404" y="284" font-size="12" fill="#6e6e73" text-anchor="middle">gain = 0.4</text>
<line x1="464" y1="270" x2="494" y2="270" stroke="#1d1d1f" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="496" y="244" width="120" height="52" rx="8" fill="#f2f2f7"/>
<text x="556" y="266" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">destination</text>
<text x="556" y="284" font-size="12" fill="#6e6e73" text-anchor="middle">스피커</text>
<text x="24" y="366" font-size="12" fill="#6e6e73">재생 노드는 start()를 한 번만 호출할 수 있고, 재생이 끝나면 버려진다. 버퍼는 계속 재사용한다</text>
</svg>
