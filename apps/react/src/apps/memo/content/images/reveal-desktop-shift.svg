<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="560" fill="#fff"/>
<defs><clipPath id="vp"><rect x="56.0" y="70.0" width="648.0" height="405.0" rx="6"/></clipPath><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs>
<text x="380.0" y="26.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">바탕화면 보기의 revealShift: 창 가운데가 화면 왼쪽 반이면 왼쪽, 아니면 오른쪽</text>
<text x="380.0" y="44.0" font-size="11" fill="#6b7280" text-anchor="middle">1440×900 화면, 캡처와 같은 배치. 점선은 원래 자리(left·top), 실선은 translate를 적용한 자리</text>
<rect x="56" y="70" width="648.0" height="405.0" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<rect x="56" y="70" width="648.0" height="11.25" fill="#e5e7eb"/>
<rect x="66.8" y="417.40000000000003" width="626.4" height="43.2" rx="6" fill="#e5e7eb"/>
<text x="380.0" y="442.6" font-size="10" fill="#6b7280" text-anchor="middle">Dock</text>
<line x1="380.0" y1="81.25" x2="380.0" y2="417.40000000000003" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="384.0" y="97.0" font-size="10" fill="#6b7280" text-anchor="start">화면 가운데 x = 720</text>
<g clip-path="url(#vp)">
<rect x="-185.20000000000002" y="115.0" width="259.2" height="162.0" rx="5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<rect x="686.0" y="227.5" width="268.2" height="189.0" rx="5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
</g>
<rect x="101.0" y="115.0" width="259.2" height="162.0" rx="5" fill="none" stroke="#6b7280" stroke-dasharray="5 4"/>
<text x="230.6" y="190.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">Safari</text>
<text x="230.6" y="206.0" font-size="10.5" fill="#6b7280" text-anchor="middle">가운데 x = 388</text>
<line x1="230.6" y1="226.0" x2="80.0" y2="226.0" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="152.3" y="221.0" font-size="10.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">translate -636px</text>
<rect x="416.0" y="227.5" width="268.2" height="189.0" rx="5" fill="none" stroke="#6b7280" stroke-dasharray="5 4"/>
<text x="550.1" y="316.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">터미널</text>
<text x="550.1" y="332.0" font-size="10.5" fill="#6b7280" text-anchor="middle">가운데 x = 1098</text>
<line x1="550.1" y1="352.0" x2="680.0" y2="352.0" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="618.0" y="347.0" font-size="10.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">translate +600px</text>
<text x="65.0" y="205.0" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="600">40px</text>
<text x="695.0" y="218.5" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="600">40px</text>
<text x="56.0" y="505.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">Safari</text>
<text x="108.0" y="505.0" font-size="11.5" fill="#4b5563" text-anchor="start">388 &lt; 720 → 왼쪽. REVEAL_PEEK − (x + width) = 40 − (100 + 576) = −636</text>
<text x="56.0" y="525.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">터미널</text>
<text x="108.0" y="525.0" font-size="11.5" fill="#4b5563" text-anchor="start">1098 ≥ 720 → 오른쪽. viewport.width − REVEAL_PEEK − x = 1440 − 40 − 800 = 600</text>
<text x="56.0" y="545.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">공통</text>
<text x="108.0" y="545.0" font-size="11.5" fill="#4b5563" text-anchor="start">left·top·width·height는 그대로라 저장된 창 자리, clampRect, 끌기 계산과 섞이지 않는다</text>
</svg>
