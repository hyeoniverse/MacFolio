<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">홉마다 바뀌는 MAC 주소와 끝까지 그대로인 IP 주소</text>
  <g stroke="#1d1d1f" stroke-width="2">
    <line x1="95" y1="80" x2="215" y2="80"/>
    <line x1="265" y1="80" x2="385" y2="80"/>
    <line x1="435" y1="80" x2="555" y2="80"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1d1d1f">
    <rect x="35" y="62" width="60" height="36" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="65" y="85">A</text>
    <circle cx="240" cy="80" r="24" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="240" y="85">R1</text>
    <circle cx="410" cy="80" r="24" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="410" y="85">R2</text>
    <rect x="555" y="62" width="60" height="36" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="585" y="85">B</text>
  </g>
  <g font-size="10.5" fill="#6e6e73" text-anchor="middle">
    <text x="65" y="116">192.0.2.10</text>
    <text x="200" y="116">192.0.2.1</text>
    <text x="280" y="116">198.51.100.1</text>
    <text x="370" y="116">198.51.100.2</text>
    <text x="450" y="116">203.0.113.1</text>
    <text x="585" y="116">203.0.113.20</text>
    <text x="155" y="70">LAN 192.0.2.0/24</text>
    <text x="325" y="70">198.51.100.0/24</text>
    <text x="495" y="70">LAN 203.0.113.0/24</text>
  </g>
  <g font-size="11.5" fill="#1d1d1f">
    <rect x="20" y="140" width="192" height="112" rx="6" fill="#fff" stroke="#c7c7cc"/>
    <text x="30" y="160" font-weight="600">링크 ①에서 보이는 프레임</text>
    <text x="30" y="182" fill="#ff9f0a">목적지 MAC: R1 왼쪽 NIC</text>
    <text x="30" y="200" fill="#ff9f0a">발신지 MAC: A</text>
    <text x="30" y="222" fill="#0a84ff">목적지 IP: 203.0.113.20</text>
    <text x="30" y="240" fill="#0a84ff">발신지 IP: 192.0.2.10</text>
    <rect x="224" y="140" width="192" height="112" rx="6" fill="#fff" stroke="#c7c7cc"/>
    <text x="234" y="160" font-weight="600">링크 ②</text>
    <text x="234" y="182" fill="#ff9f0a">목적지 MAC: R2 왼쪽 NIC</text>
    <text x="234" y="200" fill="#ff9f0a">발신지 MAC: R1 오른쪽 NIC</text>
    <text x="234" y="222" fill="#0a84ff">목적지 IP: 203.0.113.20</text>
    <text x="234" y="240" fill="#0a84ff">발신지 IP: 192.0.2.10</text>
    <rect x="428" y="140" width="192" height="112" rx="6" fill="#fff" stroke="#c7c7cc"/>
    <text x="438" y="160" font-weight="600">링크 ③</text>
    <text x="438" y="182" fill="#ff9f0a">목적지 MAC: B</text>
    <text x="438" y="200" fill="#ff9f0a">발신지 MAC: R2 오른쪽 NIC</text>
    <text x="438" y="222" fill="#0a84ff">목적지 IP: 203.0.113.20</text>
    <text x="438" y="240" fill="#0a84ff">발신지 IP: 192.0.2.10</text>
  </g>
  <g font-size="12.5" fill="#1d1d1f">
    <text x="20" y="284">각 홉은 다음 홉의 IP 주소를 ARP로 MAC 주소로 바꿔 새 이더넷 헤더를 붙인다.</text>
    <text x="20" y="306">IP 헤더의 목적지 주소는 변하지 않고, 모든 라우터가 이 값으로 다음 홉을 고른다.</text>
    <text x="20" y="328" fill="#6e6e73" font-size="11.5">TTL과 헤더 체크섬은 홉마다 갱신된다(TTL 1 감소, 체크섬 재계산).</text>
  </g>
</svg>
