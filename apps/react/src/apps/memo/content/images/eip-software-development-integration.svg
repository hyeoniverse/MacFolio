<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>하향식·상향식 통합 테스트</title><rect width="640" height="310" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="160" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">하향식 통합: 스텁(Stub)</text><text x="480" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">상향식 통합: 드라이버(Driver)</text><line x1="320" y1="15" x2="320" y2="300" stroke="#f2f2f7" stroke-width="2"/><rect x="110" y="50" width="100" height="36" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="160.0" y="72.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">M1 (메인)</text><rect x="40" y="130" width="100" height="36" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="90.0" y="152.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">M2 완성</text><rect x="180" y="130" width="100" height="36" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="2"/><text x="230.0" y="152.7" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">M3 스텁</text><rect x="10" y="210" width="90" height="36" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="2"/><text x="55.0" y="232.7" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">M4 스텁</text><rect x="110" y="210" width="90" height="36" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="2"/><text x="155.0" y="232.7" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">M5 스텁</text><line x1="150" y1="86" x2="95" y2="128" stroke="#6e6e73" stroke-width="1.5"/><line x1="170" y1="86" x2="225" y2="128" stroke="#6e6e73" stroke-width="1.5"/><line x1="75" y1="166" x2="55" y2="208" stroke="#6e6e73" stroke-width="1.5"/><line x1="105" y1="166" x2="150" y2="208" stroke="#6e6e73" stroke-width="1.5"/><text x="160" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">위 모듈부터 통합하고 아직 없는 하위 모듈은</text><text x="160" y="294" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">정해진 값만 돌려주는 스텁으로 대신한다</text><rect x="390" y="50" width="180" height="36" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="2"/><text x="480.0" y="72.7" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">드라이버 (테스트용 상위)</text><rect x="350" y="118" width="260" height="140" rx="10" fill="none" stroke="#30d158" stroke-width="2" stroke-dasharray="6 4"/><text x="362" y="140" text-anchor="start" font-size="12" font-weight="600" fill="#30d158">클러스터</text><rect x="420" y="150" width="120" height="34" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="480.0" y="171.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">M3</text><rect x="370" y="210" width="110" height="34" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="425.0" y="231.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">M6</text><rect x="490" y="210" width="110" height="34" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="545.0" y="231.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">M7</text><line x1="480" y1="86" x2="480" y2="148" stroke="#6e6e73" stroke-width="1.5"/><line x1="460" y1="184" x2="425" y2="208" stroke="#6e6e73" stroke-width="1.5"/><line x1="500" y1="184" x2="545" y2="208" stroke="#6e6e73" stroke-width="1.5"/><text x="480" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">아래 모듈부터 묶어 통합하고 아직 없는 상위 모듈은</text><text x="480" y="294" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">입력을 넣고 결과를 받는 드라이버로 대신한다</text></svg>
