<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  </defs>
  <!-- 라우터 영역 -->
  <rect x="210" y="124" width="220" height="166" rx="8" fill="#fff8ec" stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#ff9f0a">라우터</text>
  <g fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2">
    <rect x="20" y="30" width="110" height="44" rx="5"/>
    <rect x="20" y="100" width="110" height="36" rx="5"/>
    <rect x="20" y="164" width="110" height="36" rx="5"/>
    <rect x="20" y="228" width="110" height="44" rx="5"/>
    <rect x="510" y="30" width="110" height="44" rx="5"/>
    <rect x="510" y="100" width="110" height="36" rx="5"/>
    <rect x="510" y="164" width="110" height="36" rx="5"/>
    <rect x="510" y="228" width="110" height="44" rx="5"/>
    <rect x="270" y="144" width="100" height="36" rx="5"/>
    <rect x="222" y="228" width="92" height="44" rx="5"/>
    <rect x="326" y="228" width="92" height="44" rx="5"/>
  </g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <text x="75" y="48">FTP</text><text x="75" y="65">클라이언트</text>
    <text x="75" y="123">TCP</text>
    <text x="75" y="187">IP</text>
    <text x="75" y="246">이더넷</text><text x="75" y="263">드라이버</text>
    <text x="565" y="48">FTP</text><text x="565" y="65">서버</text>
    <text x="565" y="123">TCP</text>
    <text x="565" y="187">IP</text>
    <text x="565" y="246">토큰 링</text><text x="565" y="263">드라이버</text>
    <text x="320" y="167">IP</text>
    <text x="268" y="246">이더넷</text><text x="268" y="263">드라이버</text>
    <text x="372" y="246">토큰 링</text><text x="372" y="263">드라이버</text>
  </g>
  <!-- 스택 내부 데이터 경로 -->
  <g stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)">
    <line x1="75" y1="78" x2="75" y2="96"/>
    <line x1="75" y1="140" x2="75" y2="160"/>
    <line x1="75" y1="204" x2="75" y2="224"/>
    <line x1="565" y1="78" x2="565" y2="96"/>
    <line x1="565" y1="140" x2="565" y2="160"/>
    <line x1="565" y1="204" x2="565" y2="224"/>
    <line x1="296" y1="184" x2="276" y2="224"/>
    <line x1="344" y1="184" x2="364" y2="224"/>
  </g>
  <!-- 계층별 논리적 통신 -->
  <g stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="3 4" marker-start="url(#b)" marker-end="url(#b)">
    <line x1="136" y1="52" x2="504" y2="52"/>
    <line x1="136" y1="118" x2="504" y2="118"/>
    <line x1="136" y1="162" x2="266" y2="162"/>
    <line x1="374" y1="162" x2="504" y2="162"/>
    <line x1="136" y1="250" x2="218" y2="250"/>
    <line x1="422" y1="250" x2="504" y2="250"/>
  </g>
  <g font-size="12" fill="#0a84ff" text-anchor="middle">
    <rect x="270" y="38" width="100" height="18" fill="#fff"/>
    <text x="320" y="48">FTP 프로토콜</text>
    <rect x="270" y="104" width="100" height="18" fill="#fff"/>
    <text x="320" y="114">TCP 프로토콜</text>
    <text x="200" y="154">IP 프로토콜</text>
    <text x="440" y="154">IP 프로토콜</text>
    <text x="178" y="242">이더넷</text>
    <text x="462" y="242">토큰 링</text>
  </g>
  <!-- 물리 매체 -->
  <g stroke="#6e6e73" stroke-width="1.2">
    <line x1="75" y1="272" x2="75" y2="330"/>
    <line x1="268" y1="272" x2="268" y2="330"/>
    <line x1="372" y1="272" x2="372" y2="322"/>
    <line x1="565" y1="272" x2="565" y2="322"/>
  </g>
  <line x1="30" y1="330" x2="300" y2="330" stroke="#1d1d1f" stroke-width="4"/>
  <rect x="340" y="322" width="270" height="44" rx="22" fill="none" stroke="#1d1d1f" stroke-width="3"/>
  <g font-size="13" fill="#6e6e73" text-anchor="middle">
    <text x="165" y="352">이더넷</text>
    <text x="475" y="349">토큰 링</text>
  </g>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#6e6e73">파란 점선은 계층별 논리적 통신, 검은 화살표는 스택 안의 실제 데이터 경로</text>
</svg>
