<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>main과 작업 브랜치에서 버튼 상태별 계산된 스타일을 기록해 비교하는 절차</title>
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">계산된 스타일 비교 절차</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">같은 스크립트를 두 코드에 실행하고, 키가 같은 항목끼리 값을 비교한다</text>

  <g font-size="12">
    <rect x="24" y="80" width="120" height="44" rx="10" fill="#f2f2f7"/>
    <text x="84" y="107" text-anchor="middle" fill="#1d1d1f" font-weight="600">main</text>
    <rect x="24" y="180" width="120" height="44" rx="10" fill="#e8f2ff" stroke="#0a84ff"/>
    <text x="84" y="207" text-anchor="middle" fill="#0a84ff" font-weight="600">작업 브랜치</text>

    <rect x="180" y="80" width="200" height="144" rx="10" fill="#ffffff" stroke="#6e6e73"/>
    <text x="196" y="104" font-weight="600" fill="#1d1d1f">Playwright 스크립트</text>
    <text x="196" y="128" fill="#6e6e73">1. 앱을 하나씩 연다</text>
    <text x="196" y="148" fill="#6e6e73">2. 보이는 버튼·링크마다</text>
    <text x="212" y="166" fill="#6e6e73">getComputedStyle 기록</text>
    <text x="196" y="186" fill="#6e6e73">3. 마우스를 올리고</text>
    <text x="212" y="204" fill="#6e6e73">한 번 더 기록 (|hover)</text>

    <line x1="146" y1="102" x2="176" y2="140" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="146" y1="202" x2="176" y2="168" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#d)"/>

    <rect x="416" y="80" width="200" height="44" rx="10" fill="#f2f2f7"/>
    <text x="428" y="100" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">main.json</text>
    <text x="428" y="116" fill="#6e6e73">약 1,200건</text>
    <rect x="416" y="180" width="200" height="44" rx="10" fill="#e8f2ff" stroke="#0a84ff"/>
    <text x="428" y="200" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">branch.json</text>
    <text x="428" y="216" fill="#6e6e73">약 1,200건</text>
    <line x1="382" y1="140" x2="412" y2="102" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="382" y1="168" x2="412" y2="202" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#d)"/>

    <text x="424" y="152" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"gh|…|저장소|hover":</text>
    <text x="424" y="168" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">{ color, padding, … }</text>

    <rect x="24" y="252" width="592" height="56" rx="10" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="40" y="276" font-weight="600" fill="#1d1d1f">키가 같은 항목끼리 속성 값을 비교 → 다른 값만 출력</text>
    <text x="40" y="296" fill="#6e6e73">예: gh|…|저장소 color  rgb(9, 105, 218) → 기본 글자색. 화면 아래에 있어 스크린샷에는 거의 안 보이던 링크</text>
  </g>
</svg>
