<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="330" fill="#fff"/>
<text x="380" y="26" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">구독 단위가 작아져 온 흐름</text>
<text x="380" y="44" font-size="11" fill="#6b7280" text-anchor="middle">오른쪽 칸 수는 다시 계산되는 범위가 좁아지는 정도를 나타낸 도식이다</text>
<rect x="20" y="60" width="500" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="36" y="83" font-size="13" fill="#1e3a8a" font-weight="600">Flux Store</text>
<text x="140" y="83" font-size="11" fill="#6b7280">2014</text>
<text x="36" y="103" font-size="11" fill="#374151">Store 하나가 "바뀌었다" 이벤트 하나 · View가 Store 전체를 다시 읽는다</text>
<rect x="541.0" y="68" width="198.0" height="40" rx="3" fill="#93c5fd" stroke="#e5e7eb"/>
<rect x="20" y="124" width="500" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="36" y="147" font-size="13" fill="#4c1d95" font-weight="600">selector</text>
<text x="140" y="147" font-size="11" fill="#6b7280">Redux·Zustand</text>
<text x="36" y="167" font-size="11" fill="#374151">store는 하나, 구독은 값 단위 · 고른 값이 바뀐 컴포넌트만 다시 렌더링</text>
<rect x="541.0" y="132" width="98.0" height="40" rx="3" fill="#c4b5fd" stroke="#e5e7eb"/>
<rect x="641.0" y="132" width="98.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="20" y="188" width="500" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="36" y="211" font-size="13" fill="#78350f" font-weight="600">atom</text>
<text x="140" y="211" font-size="11" fill="#6b7280">Jotai·Recoil</text>
<text x="36" y="231" font-size="11" fill="#374151">상태를 작은 조각으로 나눈다 · 조각을 읽는 컴포넌트만 다시 렌더링</text>
<rect x="541.0" y="196" width="48.0" height="40" rx="3" fill="#fcd34d" stroke="#e5e7eb"/>
<rect x="591.0" y="196" width="48.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="641.0" y="196" width="48.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="691.0" y="196" width="48.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="20" y="252" width="500" height="56" rx="8" fill="#f0fdf4" stroke="#86efac"/>
<text x="36" y="275" font-size="13" fill="#14532d" font-weight="600">signal</text>
<text x="140" y="275" font-size="11" fill="#6b7280">Angular·Vue·Solid·Preact</text>
<text x="36" y="295" font-size="11" fill="#374151">읽은 값을 자동으로 추적한다 · 그 값을 쓰는 DOM·계산만 다시 실행</text>
<rect x="541.0" y="260" width="23.0" height="40" rx="3" fill="#86efac" stroke="#e5e7eb"/>
<rect x="566.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="591.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="616.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="641.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="666.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="691.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<rect x="716.0" y="260" width="23.0" height="40" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
<text x="640" y="320" font-size="10.5" fill="#6b7280" text-anchor="middle">색칠한 칸 = 바뀐 값 때문에 다시 계산되는 범위</text>
</svg>
