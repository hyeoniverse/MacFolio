<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>제어 흐름 그래프와 순환 복잡도</title><rect width="640" height="360" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#1d1d1f" stroke-width="1.5"/></marker><marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L13 7L1 13z" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/></marker><marker id="dia" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 6L10 1L19 6L10 11z" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/></marker><marker id="diaf" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 6L10 1L19 6L10 11z" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/></marker></defs>
<rect x="15" y="20" width="290" height="200" fill="#f2f2f7"/>
<text x="28" y="45" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">void f(int a, int b) {</text>
<text x="28" y="65" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">  if (a &gt; 0)        // ①</text>
<text x="28" y="85" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">    x = 1;          // ②</text>
<text x="28" y="105" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">  else</text>
<text x="28" y="125" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">    x = 2;          // ③</text>
<text x="28" y="145" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">  while (b &gt; 0)     // ④</text>
<text x="28" y="165" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">    b--;            // ⑤</text>
<text x="28" y="185" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">  return;           // ⑥</text>
<text x="28" y="205" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f" xml:space="preserve">}</text>
<path d="M458 53L424 90" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M482 53L516 90" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M422 118L456 155" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M518 118L484 155" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M484 182L552 221" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M580 214Q585 160 490 166" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M470 188L470 270" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="470" cy="40" r="17" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="470" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">1</text>
<circle cx="410" cy="105" r="17" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="410" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">2</text>
<circle cx="530" cy="105" r="17" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="530" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">3</text>
<circle cx="470" cy="170" r="17" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="470" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">4</text>
<circle cx="570" cy="230" r="17" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="570" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">5</text>
<circle cx="470" cy="290" r="17" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="470" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">6</text>
<text x="160" y="250" text-anchor="middle" font-size="13" fill="#1d1d1f">노드 N = 6, 간선 E = 7</text>
<text x="160" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#0a84ff">V(G) = E − N + 2 = 3</text>
<text x="160" y="300" text-anchor="middle" font-size="13" fill="#1d1d1f">조건 노드(①, ④) 2개 + 1 = 3</text>
<text x="160" y="330" text-anchor="middle" font-size="12" fill="#6e6e73">독립 경로 3개를 테스트하면 기초 경로 검사 완료</text>
</svg>
