<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>음악 앱의 창 상태와 실행 상태 전이</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<text x="24" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="600">음악 앱의 상태 전이</text>
<text x="24" y="50" font-size="12" fill="#6e6e73" text-anchor="start">창 유무(isRunning)와 창 없는 실행(alive)을 따로 보관하고, Dock 점은 둘 중 하나만 참이어도 표시한다</text>
<rect x="24" y="120" width="150" height="104" rx="6" fill="#ffffff" stroke="#aeaeb2" stroke-width="1.6"/>
<text x="36" y="144" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="600">꺼짐</text>
<text x="36" y="166" font-size="12" fill="#6e6e73" text-anchor="start">창: 없음</text>
<text x="36" y="184" font-size="12" fill="#6e6e73" text-anchor="start">alive: false</text>
<circle cx="42" cy="205" r="4" fill="#d1d1d6"/>
<text x="54" y="209" font-size="12" fill="#6e6e73" text-anchor="start">Dock 점 없음</text>
<rect x="236" y="120" width="150" height="104" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/>
<text x="248" y="144" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="600">창 없이 재생</text>
<text x="248" y="166" font-size="12" fill="#6e6e73" text-anchor="start">창: 없음</text>
<text x="248" y="184" font-size="12" fill="#6e6e73" text-anchor="start">alive: true</text>
<circle cx="254" cy="205" r="4" fill="#1d1d1f"/>
<text x="266" y="209" font-size="12" fill="#1d1d1f" text-anchor="start">Dock 점 표시</text>
<rect x="456" y="120" width="150" height="104" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/>
<text x="468" y="144" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="600">창 열림</text>
<text x="468" y="166" font-size="12" fill="#6e6e73" text-anchor="start">창: 있음</text>
<text x="468" y="184" font-size="12" fill="#6e6e73" text-anchor="start">alive: true</text>
<circle cx="474" cy="205" r="4" fill="#1d1d1f"/>
<text x="486" y="209" font-size="12" fill="#1d1d1f" text-anchor="start">Dock 점 표시</text>
<rect x="236" y="296" width="150" height="104" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/>
<text x="248" y="320" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="600">최소화 (계속 재생)</text>
<text x="248" y="342" font-size="12" fill="#6e6e73" text-anchor="start">창: 있음(숨김)</text>
<text x="248" y="360" font-size="12" fill="#6e6e73" text-anchor="start">alive: true</text>
<circle cx="254" cy="381" r="4" fill="#1d1d1f"/>
<text x="266" y="385" font-size="12" fill="#1d1d1f" text-anchor="start">Dock 점 표시</text>
<line x1="176" y1="166" x2="232" y2="166" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="205" y="156" font-size="12" fill="#0a84ff" text-anchor="middle">playing</text>
<text x="205" y="186" font-size="12" fill="#0a84ff" text-anchor="middle">keepAlive</text>
<line x1="390" y1="172" x2="462" y2="172" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="426" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">Dock 클릭</text>
<line x1="500" y1="224" x2="390" y2="312" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="440" y="262" font-size="12" fill="#6e6e73" text-anchor="end">노란 버튼</text>
<line x1="390" y1="342" x2="520" y2="228" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="494" y="304" font-size="12" fill="#6e6e73" text-anchor="start">Dock 클릭</text>
<path d="M536 120 L536 86 L104 86 L104 116" fill="none" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="320" y="80" font-size="12" fill="#ff3b30" text-anchor="middle">빨간 버튼·종료: 창과 alive를 함께 해제하고 재생을 멈춘다</text>
<text x="24" y="252" font-size="12" fill="#6e6e73" text-anchor="start">자동 재생 차단·파일 오류</text>
<text x="24" y="270" font-size="12" fill="#6e6e73" text-anchor="start">→ playing 이벤트가 없어 꺼짐 유지</text>
</svg>
