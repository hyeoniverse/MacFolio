<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="440" fill="#fff"/>
<text x="320" y="26" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">홈 화면에서 시작한 포인터 입력의 판정 순서</text>
<rect x="220" y="44" width="200" height="48" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="320" y="64" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">pointerdown</text>
<text x="320" y="82" font-size="12" fill="#6e6e73" text-anchor="middle">위젯 칸 위인지 기록</text>
<rect x="40" y="128" width="240" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="160" y="149" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">편집 중에 위젯을 누름</text>
<text x="160" y="167" font-size="12" fill="#6e6e73" text-anchor="middle">바로 끌 수 있는 상태</text>
<rect x="360" y="128" width="240" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="480" y="149" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">편집 전: 0.55초 누르고 있음</text>
<text x="480" y="167" font-size="12" fill="#6e6e73" text-anchor="middle">편집 모드를 켜고 끌 수 있는 상태</text>
<line x1="300" y1="92" x2="175" y2="126" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="92" x2="465" y2="126" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="150" y="214" width="340" height="50" rx="8" fill="#e5f1ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="320" y="235" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">pointermove: 8px 이상 움직이면 판정</text>
<text x="320" y="253" font-size="12" fill="#6e6e73" text-anchor="middle">끌 수 있는 위젯이면 방향과 관계없이 위젯 끌기</text>
<line x1="160" y1="178" x2="250" y2="212" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="480" y1="178" x2="390" y2="212" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="300" width="200" height="50" rx="8" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
<text x="120" y="321" font-size="13" font-weight="600" fill="#0a84ff" text-anchor="middle">위젯 끌기</text>
<text x="120" y="339" font-size="12" fill="#6e6e73" text-anchor="middle">setPointerCapture</text>
<rect x="240" y="300" width="180" height="50" rx="8" fill="#fff" stroke="#6e6e73"/>
<text x="330" y="321" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">그 밖, 가로 이동</text>
<text x="330" y="339" font-size="12" fill="#6e6e73" text-anchor="middle">페이지 넘기기</text>
<rect x="440" y="300" width="180" height="50" rx="8" fill="#fff" stroke="#6e6e73"/>
<text x="530" y="321" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">그 밖, 세로 이동</text>
<text x="530" y="339" font-size="12" fill="#6e6e73" text-anchor="middle">제어 센터 (useVerticalSwipe)</text>
<line x1="270" y1="264" x2="135" y2="298" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="320" y1="264" x2="330" y2="298" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="370" y1="264" x2="515" y2="298" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="384" width="140" height="44" rx="8" fill="#eafaef" stroke="#34c759"/>
<text x="90" y="402" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">pointerup</text>
<text x="90" y="419" font-size="12" fill="#6e6e73" text-anchor="middle">새 순서 저장</text>
<rect x="172" y="384" width="160" height="44" rx="8" fill="#ffefee" stroke="#ff3b30"/>
<text x="252" y="402" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">pointercancel</text>
<text x="252" y="419" font-size="12" fill="#6e6e73" text-anchor="middle">원래 순서로 되돌리기</text>
<line x1="100" y1="350" x2="92" y2="382" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="150" y1="350" x2="235" y2="382" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
