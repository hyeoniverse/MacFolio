<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<title>제목이 빈 글을 저장할 때 화면, API, DB 세 계층이 각각 거부하는 위치</title>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">제목이 빈 글을 세 계층에서 거부한다</text>
<text x="20" y="50" font-size="12" fill="#6e6e73">앞 계층을 거치지 않는 요청도 다음 계층에서 거부된다</text>
<rect x="20" y="72" width="180" height="150" rx="12" fill="#f2f2f7" stroke="#0a84ff" stroke-width="2"/>
<text x="110" y="100" font-size="14" font-weight="700" fill="#0a84ff" text-anchor="middle">1. 화면 입력 검사</text>
<text x="110" y="128" font-size="12" fill="#1d1d1f" text-anchor="middle">저장 전에 경고 표시</text>
<text x="110" y="152" font-size="12" fill="#6e6e73" text-anchor="middle">요청을 보내지 않는다</text>
<text x="110" y="196" font-size="12" fill="#6e6e73" text-anchor="middle">거치지 않는 경로:</text>
<text x="110" y="212" font-size="12" fill="#6e6e73" text-anchor="middle">curl로 API 직접 호출</text>
<line x1="200" y1="147" x2="226" y2="147" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="72" width="180" height="150" rx="12" fill="#f2f2f7" stroke="#ff9f0a" stroke-width="2"/>
<text x="320" y="100" font-size="14" font-weight="700" fill="#ff9f0a" text-anchor="middle">2. API 본문 검증</text>
<text x="320" y="128" font-size="12" fill="#1d1d1f" text-anchor="middle">400 Bad Request 응답</text>
<text x="320" y="152" font-size="12" fill="#6e6e73" text-anchor="middle">DB에 쓰지 않는다</text>
<text x="320" y="196" font-size="12" fill="#6e6e73" text-anchor="middle">거치지 않는 경로:</text>
<text x="320" y="212" font-size="12" fill="#6e6e73" text-anchor="middle">SQL 직접 실행, 서버 버그</text>
<line x1="410" y1="147" x2="436" y2="147" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<rect x="440" y="72" width="180" height="150" rx="12" fill="#f2f2f7" stroke="#34c759" stroke-width="2"/>
<text x="530" y="100" font-size="14" font-weight="700" fill="#34c759" text-anchor="middle">3. DB CHECK 제약</text>
<text x="530" y="128" font-size="12" fill="#1d1d1f" text-anchor="middle">INSERT·UPDATE 거부</text>
<text x="530" y="152" font-size="12" fill="#6e6e73" text-anchor="middle">행이 저장되지 않는다</text>
<text x="530" y="196" font-size="12" fill="#6e6e73" text-anchor="middle">모든 쓰기가 거치는</text>
<text x="530" y="212" font-size="12" fill="#6e6e73" text-anchor="middle">마지막 계층</text>
<rect x="20" y="240" width="600" height="44" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="36" y="267" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">요청 본문 {"title": "", "date": "2026-09-29", ...}  →  세 계층 모두 거부</text>
</svg>
