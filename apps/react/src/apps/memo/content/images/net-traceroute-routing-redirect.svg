<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <!-- 호스트 -->
  <g stroke="#1d1d1f" stroke-width="1.4" fill="#f2f2f7">
    <rect x="270" y="20" width="100" height="44" rx="6"/>
  </g>
  <text x="320" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">호스트</text>
  <!-- LAN -->
  <line x1="20" y1="150" x2="620" y2="150" stroke="#1d1d1f" stroke-width="3"/>
  <text x="620" y="140" text-anchor="end" font-size="12" fill="#6e6e73">같은 LAN</text>
  <g stroke="#6e6e73" stroke-width="1.5">
    <line x1="320" y1="64" x2="320" y2="150"/>
    <line x1="130" y1="150" x2="130" y2="226"/>
    <line x1="510" y1="150" x2="510" y2="226"/>
    <line x1="130" y1="264" x2="130" y2="300"/>
    <line x1="510" y1="264" x2="510" y2="300"/>
  </g>
  <!-- 라우터 -->
  <g stroke="#1d1d1f" stroke-width="1.4" fill="#e5f7ea">
    <rect x="70" y="226" width="120" height="38" rx="19"/>
    <rect x="450" y="226" width="120" height="38" rx="19"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">
    <text x="130" y="250">R1</text>
    <text x="510" y="250">R2</text>
  </g>
  <g font-size="12" fill="#6e6e73" text-anchor="middle">
    <text x="130" y="318">default 라우터</text>
    <text x="510" y="318">목적지로 가는 실제 다음 홉</text>
  </g>
  <!-- (1) 호스트 → R1 -->
  <path d="M300,66 L300,96 L110,96 L110,222" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#k)"/>
  <text x="200" y="88" text-anchor="middle" font-size="13" fill="#1d1d1f">① IP 데이터그램</text>
  <!-- (2) R1 → R2 -->
  <path d="M160,222 L160,186 L490,186 L490,222" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="330" y="204" text-anchor="middle" font-size="13" fill="#0a84ff">② IP 데이터그램 전달</text>
  <!-- (3) R1 → 호스트 ICMP 재지정 -->
  <path d="M145,222 L145,120 L340,120 L340,68" fill="none" stroke="#ff9f0a" stroke-width="1.8" marker-end="url(#o)"/>
  <text x="350" y="112" font-size="13" fill="#ff9f0a" font-weight="600">③ ICMP 재지정: 앞으로는 R2로</text>
</svg>
