<line x1="270" y1="182" x2="328" y2="148" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="560" y="60" width="230" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="675.0" y="81.0" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">고치기 전</text>
