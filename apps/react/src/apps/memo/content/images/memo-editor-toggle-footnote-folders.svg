<text x="410" y="262" font-size="11" fill="#6b7280" text-anchor="middle">글이 폴더를 떠나는 네 곳: 끌어 놓기 · 여러 개 골라 옮기기 · 지우기 · 편집 화면의 폴더 바꾸기</text>
<text x="410" y="282" font-size="11" fill="#6b7280" text-anchor="middle">남긴 폴더는 만든 폴더와 같아서, 비어 있으면 지울 수 있다</text>
