<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">표가 지킨 경로 수: 처음과 지금</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">10월 9일 64개 → 10월 18일 85개. 경로를 더할 때마다 표에 권한을 적고 들어왔다</text>
