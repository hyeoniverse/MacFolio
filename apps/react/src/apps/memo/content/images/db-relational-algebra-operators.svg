<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">실렉트, 프로젝트, 조인이 고르는 부분</text>

  <!-- 실렉트 -->
  <text x="110" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">실렉트 σ: 행(수평)</text>
  <g stroke="#d1d5db" fill="#f9fafb">
    <rect x="40" y="76" width="140" height="22"/><rect x="40" y="98" width="140" height="22"/>
    <rect x="40" y="120" width="140" height="22"/><rect x="40" y="142" width="140" height="22"/>
    <rect x="40" y="164" width="140" height="22"/>
  </g>
  <g fill="#c7d2fe" stroke="#4f46e5">
    <rect x="40" y="76" width="140" height="22"/><rect x="40" y="120" width="140" height="22"/><rect x="40" y="142" width="140" height="22"/>
  </g>
  <g stroke="#d1d5db"><line x1="75" y1="76" x2="75" y2="186"/><line x1="110" y1="76" x2="110" y2="186"/><line x1="145" y1="76" x2="145" y2="186"/></g>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#374151">σ학과='컴퓨터'(학생)</text>
  <text x="110" y="224" text-anchor="middle" font-size="11" fill="#6b7280">조건을 만족하는 행 3개</text>

  <!-- 프로젝트 -->
  <text x="320" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">프로젝트 π: 열(수직)</text>
  <g stroke="#d1d5db" fill="#f9fafb">
    <rect x="250" y="76" width="140" height="110"/>
  </g>
  <g fill="#a7f3d0" stroke="#059669">
    <rect x="285" y="76" width="35" height="110"/><rect x="355" y="76" width="35" height="110"/>
  </g>
  <g stroke="#d1d5db"><line x1="250" y1="98" x2="390" y2="98"/><line x1="250" y1="120" x2="390" y2="120"/><line x1="250" y1="142" x2="390" y2="142"/><line x1="250" y1="164" x2="390" y2="164"/><line x1="285" y1="76" x2="285" y2="186"/><line x1="320" y1="76" x2="320" y2="186"/><line x1="355" y1="76" x2="355" y2="186"/></g>
  <text x="320" y="208" text-anchor="middle" font-size="11" fill="#374151">π이름,학과(학생)</text>
  <text x="320" y="224" text-anchor="middle" font-size="11" fill="#6b7280">지정한 열만, 중복 행은 제거</text>

  <!-- 조인 -->
  <text x="530" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">자연 조인 ⋈N: 연결</text>
  <g font-size="10" text-anchor="middle" fill="#374151">
    <rect x="450" y="76" width="70" height="22" fill="#fde68a" stroke="#b45309"/><text x="485" y="91">학번</text>
    <rect x="450" y="98" width="70" height="44" fill="#f9fafb" stroke="#d1d5db"/><text x="485" y="124">학생</text>
    <rect x="550" y="76" width="70" height="22" fill="#fde68a" stroke="#b45309"/><text x="585" y="91">학번</text>
    <rect x="550" y="98" width="70" height="44" fill="#f9fafb" stroke="#d1d5db"/><text x="585" y="124">등록</text>
    <rect x="460" y="160" width="150" height="26" fill="#fff7ed" stroke="#b45309"/><text x="535" y="177">학번이 같은 행끼리 이어 붙임</text>
  </g>
  <path d="M520 87 L550 87" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 3"/>
  <g stroke="#6b7280" stroke-width="1.5"><line x1="485" y1="142" x2="510" y2="160"/><line x1="585" y1="142" x2="560" y2="160"/></g>
  <text x="530" y="208" text-anchor="middle" font-size="11" fill="#374151">학생 ⋈N 등록</text>
  <text x="530" y="224" text-anchor="middle" font-size="11" fill="#6b7280">공통 열 학번은 한 번만</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#1f2937">세 연산 모두 결과가 다시 릴레이션이라(폐쇄 성질) 서로 겹쳐 쓸 수 있다</text>
</svg>
