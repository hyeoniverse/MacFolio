<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>구조체 포인터로 만든 트리와 후위 순회 순서</title><rect width="640" height="300" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">left·right 포인터로 연결한 트리 (원 옆 숫자는 후위 순회 방문 순서)</text>
<line x1="320" y1="70" x2="200" y2="140" stroke="#6e6e73" stroke-width="2"/>
<line x1="320" y1="70" x2="440" y2="140" stroke="#6e6e73" stroke-width="2"/>
<line x1="200" y1="140" x2="130" y2="220" stroke="#6e6e73" stroke-width="2"/>
<line x1="200" y1="140" x2="270" y2="220" stroke="#6e6e73" stroke-width="2"/>
<line x1="440" y1="140" x2="510" y2="220" stroke="#6e6e73" stroke-width="2"/>
<text x="428" y="188" text-anchor="end" font-size="12" fill="#6e6e73">left = NULL</text>
<text x="252" y="98" text-anchor="middle" font-size="12" fill="#6e6e73">left</text>
<text x="390" y="98" text-anchor="middle" font-size="12" fill="#6e6e73">right</text>
<circle cx="320" cy="70" r="24" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1.5"/><text x="320" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">A</text><text x="356" y="64" font-size="13" fill="#0a84ff">6</text>
<circle cx="200" cy="140" r="24" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1.5"/><text x="200" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">B</text><text x="160" y="134" font-size="13" fill="#0a84ff">3</text>
<circle cx="440" cy="140" r="24" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1.5"/><text x="440" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">C</text><text x="476" y="134" font-size="13" fill="#0a84ff">5</text>
<circle cx="130" cy="220" r="24" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1.5"/><text x="130" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">D</text><text x="90" y="214" font-size="13" fill="#0a84ff">1</text>
<circle cx="270" cy="220" r="24" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1.5"/><text x="270" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">E</text><text x="304" y="214" font-size="13" fill="#0a84ff">2</text>
<circle cx="510" cy="220" r="24" fill="#fff4e5" stroke="#ff9f0a" stroke-width="2"/><text x="510" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">F</text><text x="544" y="214" font-size="13" font-weight="600" fill="#ff9f0a">4</text>
<text x="320" y="276" text-anchor="middle" font-size="13" fill="#1d1d1f">후위 순회: 왼쪽 → 오른쪽 → 자기 자신  =  D E B F C A</text>
</svg>
