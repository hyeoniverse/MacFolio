<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>코드 문제는 변수 추적 표를 그려 푼다</title><rect width="640" height="300" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">반복문 한 바퀴마다 변수 값을 한 줄씩 적는다</text>
<rect x="20" y="50" width="270" height="170" rx="8" fill="#1d1d1f"/>
<g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f2f2f7"><text x="36" y="80">int s = 0;</text><text x="36" y="104">for (int i = 1; i &lt;= 4; i++) {</text><text x="52" y="128">if (i % 2 == 0) continue;</text><text x="52" y="152">s += i * i;</text><text x="36" y="176">}</text><text x="36" y="200">printf("%d", s);</text></g>
<line x1="295" y1="135" x2="340" y2="135" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<g font-size="13" text-anchor="middle">
<rect x="345" y="50" width="275" height="34" fill="#f2f2f7"/><text x="390" y="72" fill="#1d1d1f" font-weight="600">i</text><text x="480" y="72" fill="#1d1d1f" font-weight="600">i % 2 == 0</text><text x="580" y="72" fill="#1d1d1f" font-weight="600">s</text>
<text x="390" y="106" fill="#1d1d1f">1</text><text x="480" y="106" fill="#6e6e73">거짓</text><text x="580" y="106" fill="#0a84ff">1</text>
<text x="390" y="134" fill="#1d1d1f">2</text><text x="480" y="134" fill="#ff453a">참 → continue</text><text x="580" y="134" fill="#6e6e73">1</text>
<text x="390" y="162" fill="#1d1d1f">3</text><text x="480" y="162" fill="#6e6e73">거짓</text><text x="580" y="162" fill="#0a84ff">10</text>
<text x="390" y="190" fill="#1d1d1f">4</text><text x="480" y="190" fill="#ff453a">참 → continue</text><text x="580" y="190" fill="#6e6e73">10</text>
<text x="390" y="218" fill="#1d1d1f">5</text><text x="480" y="218" fill="#6e6e73">i &lt;= 4 거짓, 종료</text>
<g stroke="#e5e5ea"><line x1="345" y1="118" x2="620" y2="118"/><line x1="345" y1="146" x2="620" y2="146"/><line x1="345" y1="174" x2="620" y2="174"/><line x1="345" y1="202" x2="620" y2="202"/></g>
</g>
<rect x="345" y="240" width="275" height="40" rx="8" fill="#e8f2ff"/><text x="482" y="265" text-anchor="middle" font-size="14" fill="#0a84ff" font-weight="600">출력: 10</text>
</svg>
