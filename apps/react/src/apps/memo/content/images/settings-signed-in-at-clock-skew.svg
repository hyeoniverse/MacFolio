<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>시계 차이와 1초 여유</title>
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">브라우저 시계가 0.4초 빠를 때 (예시)</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">타이머는 브라우저 시계로, 만료 판단은 서버 시계로 한다</text>
  <g font-size="12" fill="#1d1d1f">
    <text x="24" y="104" font-weight="700">서버 시계</text>
    <line x1="120" y1="100" x2="616" y2="100" stroke="#6e6e73" stroke-width="2"/>
    <text x="24" y="184" font-weight="700">브라우저 시계</text>
    <line x1="120" y1="180" x2="616" y2="180" stroke="#6e6e73" stroke-width="2"/>
    <line x1="300" y1="80" x2="300" y2="200" stroke="#ff3b30" stroke-width="2"/>
    <text x="300" y="74" text-anchor="middle" fill="#ff3b30">expiresAt (서버 기준 만료)</text>
    <line x1="240" y1="160" x2="240" y2="200" stroke="#ff9f0a" stroke-width="2"/>
    <text x="240" y="216" text-anchor="middle" fill="#ff9f0a">+0초 타이머</text>
    <text x="240" y="232" text-anchor="middle" fill="#ff9f0a">서버: 0.4초 남음</text>
    <text x="240" y="248" text-anchor="middle" fill="#ff9f0a">→ "로그인됨"</text>
    <path d="M240 160 L240 108" stroke="#ff9f0a" stroke-dasharray="4 3"/>
    <line x1="390" y1="160" x2="390" y2="200" stroke="#34c759" stroke-width="2"/>
    <text x="390" y="216" text-anchor="middle" fill="#34c759">+1초 타이머</text>
    <text x="390" y="232" text-anchor="middle" fill="#34c759">서버: 0.6초 지남</text>
    <text x="390" y="248" text-anchor="middle" fill="#34c759">→ 로그아웃 화면</text>
    <path d="M390 160 L390 108" stroke="#34c759" stroke-dasharray="4 3"/>
    <rect x="240" y="118" width="60" height="22" fill="#ff3b30" opacity="0.15"/>
    <text x="270" y="134" text-anchor="middle" font-size="12" fill="#ff3b30">0.4초</text>
  </g>
  <rect x="24" y="266" width="592" height="40" rx="8" fill="#f2f2f7"/>
  <text x="40" y="291" font-size="12" fill="#1d1d1f">1초 여유는 두 시계의 차이가 1초 미만이면 재조회 시각에 서버가 항상 만료로 판단하게 한다</text>
</svg>
