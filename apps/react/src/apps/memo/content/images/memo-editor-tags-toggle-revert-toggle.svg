<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect width="760" height="350" fill="#fff"/>
<text x="380.0" y="26" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">토글의 › 를 눌렀을 때 바뀌는 대상</text>
<text x="380.0" y="44" font-size="11" fill="#6b7280" text-anchor="middle">수정 전에는 문서(Markdown)가, 수정 후에는 편집기 화면 상태만 바뀐다</text>
<text x="16" y="74" font-size="12" fill="#991b1b" text-anchor="start" font-weight="600">수정 전</text>
<rect x="16" y="84" width="164" height="88" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
<text x="26" y="103" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">› 클릭 · 요약 줄 Enter</text>
<text x="26" y="121" font-size="10.5" fill="#4b5563" text-anchor="start">writer/details.ts</text>
<text x="26" y="137" font-size="10.5" fill="#4b5563" text-anchor="start">handleClickOn</text>
<rect x="204" y="84" width="164" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
<text x="214" y="103" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="600">문서 변경</text>
<text x="214" y="121" font-size="10.5" fill="#4b5563" text-anchor="start">setNodeMarkup으로</text>
<text x="214" y="137" font-size="10.5" fill="#4b5563" text-anchor="start">details_block의</text>
<text x="214" y="153" font-size="10.5" fill="#4b5563" text-anchor="start">open 속성 반전</text>
<rect x="392" y="84" width="164" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
<text x="402" y="103" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="600">Markdown 변경</text>
<text x="402" y="121" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;details id="terms"&gt;</text>
<text x="402" y="137" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ &lt;details id="terms"</text>
<text x="402" y="153" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">   open&gt;</text>
<rect x="580" y="84" width="164" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
<text x="590" y="103" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="600">onChange → 임시 저장</text>
<text x="590" y="121" font-size="10.5" fill="#4b5563" text-anchor="start">저장 요청 1회</text>
<text x="590" y="137" font-size="10.5" fill="#4b5563" text-anchor="start">‘임시 저장됨’ 표시</text>
<text x="590" y="153" font-size="10.5" fill="#4b5563" text-anchor="start">게시 버튼 활성화</text>
<line x1="182" y1="128.0" x2="202" y2="128.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="370" y1="128.0" x2="390" y2="128.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="558" y1="128.0" x2="578" y2="128.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<text x="16" y="200" font-size="12" fill="#166534" text-anchor="start" font-weight="600">수정 후</text>
<rect x="16" y="210" width="164" height="96" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
<text x="26" y="229" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">› 클릭 · 요약 줄 Enter</text>
<text x="26" y="247" font-size="10.5" fill="#4b5563" text-anchor="start">더블·트리플 클릭도</text>
<text x="26" y="263" font-size="10.5" fill="#4b5563" text-anchor="start">같은 함수로 처리</text>
<text x="26" y="279" font-size="10.5" fill="#4b5563" text-anchor="start">(toggleOnClick)</text>
<rect x="204" y="210" width="164" height="96" rx="6" fill="#f0fdf4" stroke="#86efac"/>
<text x="214" y="229" font-size="11.5" fill="#166534" text-anchor="start" font-weight="600">플러그인 상태만 변경</text>
<text x="214" y="247" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">showOnScreen()</text>
<text x="214" y="263" font-size="10.5" fill="#4b5563" text-anchor="start">anchors 플러그인의</text>
<text x="214" y="279" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">collapsed · revealed</text>
<rect x="392" y="210" width="164" height="96" rx="6" fill="#f0fdf4" stroke="#86efac"/>
<text x="402" y="229" font-size="11.5" fill="#166534" text-anchor="start" font-weight="600">Decoration으로 표시</text>
<text x="402" y="247" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">memo-details-collapsed</text>
<text x="402" y="263" font-size="9.8" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">memo-details-revealed</text>
<text x="402" y="279" font-size="10.5" fill="#4b5563" text-anchor="start">CSS가 내용 숨김·표시</text>
<rect x="580" y="210" width="164" height="96" rx="6" fill="#f0fdf4" stroke="#86efac"/>
<text x="590" y="229" font-size="11.5" fill="#166534" text-anchor="start" font-weight="600">문서 그대로</text>
<text x="590" y="247" font-size="10.5" fill="#4b5563" text-anchor="start">onChange 호출 없음</text>
<text x="590" y="263" font-size="10.5" fill="#4b5563" text-anchor="start">저장 요청 0회</text>
<text x="590" y="279" font-size="10.5" fill="#4b5563" text-anchor="start">게시 버튼 비활성</text>
<line x1="182" y1="258.0" x2="202" y2="258.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="370" y1="258.0" x2="390" y2="258.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="558" y1="258.0" x2="578" y2="258.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<text x="380" y="334" font-size="10.5" fill="#6b7280" text-anchor="middle">저장되는 펼침 여부는 읽어 온 &lt;details open&gt; 그대로이고, 편집기에서 새로 만든 토글만 open으로 저장한다</text>
</svg>
