<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>메모 검색의 단계: 검색어를 낱말로 나누고, 글마다 한 번 만든 검색용 글자에서 낱말을 찾아 점수로 늘어놓고, 없으면 비슷한 글과 고친 검색어를 보인다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker></defs>
<rect width="860" height="420" fill="#fff"/>
<text x="430" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">검색어 한 글자를 칠 때마다 지나가는 단계 (desktop-core/memo/search.ts)</text>
<g font-size="12.5">
<rect x="20" y="60" width="190" height="120" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="115" y="84" text-anchor="middle" font-weight="600" fill="#1f2937">① 검색어 나누기</text>
<text x="34" y="108" fill="#374151">공백 → 낱말 (모두 있어야 함)</text>
<text x="34" y="128" fill="#374151">하이픈·밑줄 → 이어진 덩어리</text>
<text x="34" y="148" fill="#374151">/memo/주소 → 주소만</text>
<text x="34" y="168" fill="#374151">마지막 글자는 입력 중으로</text>
<rect x="240" y="60" width="200" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="340" y="84" text-anchor="middle" font-weight="600" fill="#1f2937">② 글마다 검색용 글자</text>
<text x="254" y="108" fill="#374151">제목·주소·태그·초성·요약·본문</text>
<text x="254" y="128" fill="#374151">NFKC, 소문자, 공백 하나로</text>
<text x="254" y="148" fill="#1d4ed8">처음 한 번만 만들어 보관</text>
<text x="254" y="168" fill="#374151">(같은 글 객체면 다시 쓴다)</text>
<rect x="470" y="60" width="180" height="120" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="560" y="84" text-anchor="middle" font-weight="600" fill="#1f2937">③ 낱말마다 칸 무게</text>
<text x="484" y="108" fill="#374151">제목 10 · 주소 8 · 태그 6</text>
<text x="484" y="128" fill="#374151">초성 5 · 요약 4 · 본문 1</text>
<text x="484" y="148" fill="#374151">제목·주소가 검색어와 같으면</text>
<text x="484" y="168" fill="#374151">+30, 검색어로 시작하면 +10</text>
<rect x="680" y="60" width="160" height="120" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="760" y="84" text-anchor="middle" font-weight="600" fill="#1f2937">④ 목록</text>
<text x="694" y="108" fill="#374151">점수 높은 글부터</text>
<text x="694" y="128" fill="#374151">같으면 보기 설정 순서</text>
<text x="694" y="148" fill="#374151">고정한 글은 그대로 위</text>
<line x1="210" y1="120" x2="238" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="120" x2="468" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="650" y1="120" x2="678" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="760" y1="180" x2="760" y2="236" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="770" y="214" fill="#6b7280">0개면</text>
<rect x="300" y="240" width="540" height="150" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="570" y="264" text-anchor="middle" font-weight="600" fill="#1f2937">⑤ 결과가 없을 때 (제목·주소·태그만, 본문은 보지 않는다)</text>
<text x="316" y="292" fill="#374151">한글을 자모로 푼다: 프런트엔드 → ㅍㅡㄹㅓㄴㅌㅡㅇㅔㄴㄷㅡ</text>
<text x="316" y="316" fill="#374151">비슷한 글: 낱말마다 어느 부분과의 편집 비용이 자모 길이의 25% 이하</text>
<text x="316" y="340" fill="#374151">혹시 이 검색어인가요?: 어디에도 없는 낱말을 가장 가까운 낱말로 (dispacher → dispatcher)</text>
<text x="316" y="364" fill="#374151">바꾸기 비용 0.9 · 넣기/빼기 1 → 같은 횟수면 길이가 같은 낱말 (flix → flux)</text>
<text x="20" y="262" font-weight="600" fill="#1f2937">한 번에 드는 시간 (글 238편)</text>
<text x="20" y="290" fill="#374151">고치기 전: 4.5~5.1ms</text>
<text x="20" y="314" fill="#047857">고친 뒤: 0.5ms (첫 검색 때 31ms 한 번)</text>
<text x="20" y="338" fill="#374151">결과가 없을 때 추천: 약 11ms</text>
</g>
</svg>
