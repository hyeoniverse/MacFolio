<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>모듈을 읽을 때 계산한 상수는 서버 프로필이 도착하기 전에 정해져 옛 이름으로 남는다. getProfile은 쓰는 순간 읽고, useProfile은 도착하면 다시 그린다</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="800" height="250" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">언제 읽느냐가 문제였다</text>
<line x1="60" y1="70" x2="760" y2="70" stroke="#9ca3af" marker-end="url(#ag)"/>
<circle cx="100" cy="70" r="5" fill="#6b7280"/><text x="100" y="58" font-size="10.5" fill="#374151" text-anchor="middle">모듈 읽기</text>
<circle cx="300" cy="70" r="5" fill="#6b7280"/><text x="300" y="58" font-size="10.5" fill="#374151" text-anchor="middle">앱 열림</text>
<circle cx="480" cy="70" r="5" fill="#4f46e5"/><text x="480" y="58" font-size="10.5" fill="#4338ca" text-anchor="middle">GET /site 도착</text>
<circle cx="660" cy="70" r="5" fill="#6b7280"/><text x="660" y="58" font-size="10.5" fill="#374151" text-anchor="middle">메일 보내기</text>
<rect x="60" y="94" width="700" height="34" rx="6" fill="#fff1f2" stroke="#fda4af"/>
<text x="76" y="116" font-size="11" fill="#1f2937">상수 OWNER_ADDRESS: 모듈 읽기에서 '김정현 &lt;…&gt;'로 굳는다 → 끝까지 옛 이름</text>
<rect x="60" y="138" width="700" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="76" y="160" font-size="11" fill="#1f2937">getProfile(): 메일을 보내는 순간 읽는다 → 그때의 이름</text>
<rect x="60" y="182" width="700" height="34" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="76" y="204" font-size="11" fill="#1f2937">useProfile(): 처음엔 기본값으로 그리고, 도착하면 그 자리에서 다시 그린다</text>
</svg>
