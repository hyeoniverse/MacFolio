<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>결합도와 응집도의 순서</title><rect width="640" height="356" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">결합도와 응집도의 순서</text><text x="20" y="62" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">결합도 (Coupling): 모듈 사이의 의존 정도</text><rect x="20" y="74" width="92" height="36" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="66.0" y="96.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">자료</text><rect x="120" y="74" width="92" height="36" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="166.0" y="96.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">스탬프</text><rect x="220" y="74" width="92" height="36" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="266.0" y="96.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">제어</text><rect x="320" y="74" width="92" height="36" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="366.0" y="96.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">외부</text><rect x="420" y="74" width="92" height="36" rx="8" fill="#ff453a" stroke="none" stroke-width="1.5"/><text x="466.0" y="96.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">공통</text><rect x="520" y="74" width="92" height="36" rx="8" fill="#ff453a" stroke="none" stroke-width="1.5"/><text x="566.0" y="96.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">내용</text><line x1="20" y1="126" x2="612" y2="126" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="20" y="146" text-anchor="start" font-size="12" font-weight="600" fill="#30d158">약함 (좋음)</text><text x="612" y="146" text-anchor="end" font-size="12" font-weight="600" fill="#ff453a">강함 (나쁨)</text><text x="20" y="192" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">응집도 (Cohesion): 모듈 안 요소들의 관련 정도</text><rect x="20" y="204" width="80" height="36" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="60.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">기능적</text><rect x="106" y="204" width="80" height="36" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="146.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">순차적</text><rect x="192" y="204" width="80" height="36" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="232.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">교환적</text><rect x="278" y="204" width="80" height="36" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="318.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">절차적</text><rect x="364" y="204" width="80" height="36" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="404.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">시간적</text><rect x="450" y="204" width="80" height="36" rx="8" fill="#ff453a" stroke="none" stroke-width="1.5"/><text x="490.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">논리적</text><rect x="536" y="204" width="80" height="36" rx="8" fill="#ff453a" stroke="none" stroke-width="1.5"/><text x="576.0" y="226.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">우연적</text><line x1="20" y1="256" x2="612" y2="256" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="20" y="276" text-anchor="start" font-size="12" font-weight="600" fill="#30d158">강함 (좋음)</text><text x="612" y="276" text-anchor="end" font-size="12" font-weight="600" fill="#ff453a">약함 (나쁨)</text><rect x="20" y="296" width="600" height="46" rx="8" fill="#e8f2ff"/><text x="320" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">좋은 설계 = 결합도는 낮게, 응집도는 높게</text><text x="320" y="334" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">두 줄 모두 왼쪽이 좋은 쪽이다</text></svg>
