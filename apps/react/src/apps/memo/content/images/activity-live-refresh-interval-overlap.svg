<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>응답이 70초 걸릴 때 setInterval과 setTimeout 재예약의 요청 시각 비교</title>
<rect width="640" height="330" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">응답이 70초 걸릴 때, 간격 60초</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">막대 하나가 요청 하나 (보낸 시각부터 응답이 도착한 시각까지)</text>

<!-- setInterval 영역 -->
<text x="24" y="98" font-size="13" font-weight="600" fill="#1d1d1f">setInterval</text>
<text x="24" y="116" font-size="12" fill="#6e6e73">60초마다 보낸다</text>
<rect x="170" y="84" width="128.3" height="18" rx="4" fill="#0a84ff"/>
<rect x="390" y="84" width="128.3" height="18" rx="4" fill="#0a84ff"/>
<rect x="280" y="108" width="128.3" height="18" rx="4" fill="#0a84ff" opacity="0.75"/>
<rect x="500" y="108" width="110" height="18" rx="4" fill="#0a84ff" opacity="0.75"/>
<!-- 겹침 표시 -->
<rect x="280" y="80" width="18.3" height="50" fill="#ff3b30" opacity="0.25"/>
<rect x="390" y="80" width="18.3" height="50" fill="#ff3b30" opacity="0.25"/>
<rect x="500" y="80" width="18.3" height="50" fill="#ff3b30" opacity="0.25"/>
<text x="400" y="148" font-size="12" fill="#ff3b30" text-anchor="middle">빨간 구간: 요청 2개가 동시에 진행</text>

<!-- setTimeout 영역 -->
<text x="24" y="196" font-size="13" font-weight="600" fill="#1d1d1f">setTimeout 재예약</text>
<text x="24" y="214" font-size="12" fill="#6e6e73">응답 뒤 60초를 센다</text>
<rect x="170" y="190" width="128.3" height="18" rx="4" fill="#34c759"/>
<line x1="298.3" y1="199" x2="408.3" y2="199" stroke="#6e6e73" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="353.3" y="188" font-size="12" fill="#6e6e73" text-anchor="middle">60초 대기</text>
<rect x="408.3" y="190" width="128.3" height="18" rx="4" fill="#34c759"/>
<line x1="536.6" y1="199" x2="610" y2="199" stroke="#6e6e73" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="573" y="188" font-size="12" fill="#6e6e73" text-anchor="middle">60초 대기</text>
<text x="390" y="236" font-size="12" fill="#34c759" text-anchor="middle">한 번에 요청 하나만 진행</text>

<!-- 시간 축 -->
<line x1="170" y1="262" x2="610" y2="262" stroke="#1d1d1f" stroke-width="1"/>
<g font-size="12" fill="#6e6e73" text-anchor="middle">
<line x1="170" y1="258" x2="170" y2="266" stroke="#1d1d1f"/><text x="170" y="282">0초</text>
<line x1="280" y1="258" x2="280" y2="266" stroke="#1d1d1f"/><text x="280" y="282">60</text>
<line x1="390" y1="258" x2="390" y2="266" stroke="#1d1d1f"/><text x="390" y="282">120</text>
<line x1="500" y1="258" x2="500" y2="266" stroke="#1d1d1f"/><text x="500" y="282">180</text>
<line x1="610" y1="258" x2="610" y2="266" stroke="#1d1d1f"/><text x="610" y="282">240</text>
</g>
<text x="24" y="314" font-size="12" fill="#6e6e73">서버가 느릴수록 setInterval은 요청을 더 쌓고, 재예약 방식은 요청 사이 간격을 그대로 지킨다</text>
</svg>
