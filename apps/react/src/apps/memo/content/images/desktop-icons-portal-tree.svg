<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>React 트리에서는 메뉴가 아이콘 레이어의 자식이라 메뉴 항목의 pointerdown이 레이어 처리기까지 전파되지만, DOM 트리에서는 메뉴가 body 바로 아래에 있어 레이어 밖이다. 레이어는 currentTarget.contains(target)로 실제 DOM 위치를 확인한다</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker>
</defs>
<rect width="640" height="400" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">같은 메뉴, 두 개의 트리</text>
<!-- React tree -->
<text x="160" y="66" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">React 트리 (이벤트 전파 경로)</text>
<rect x="70" y="82" width="180" height="34" rx="8" fill="#f2f2f7"/>
<text x="160" y="104" font-size="12" fill="#1d1d1f" text-anchor="middle">Desktop</text>
<line x1="160" y1="116" x2="160" y2="136" stroke="#6e6e73"/>
<rect x="70" y="136" width="180" height="40" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="160" y="154" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">아이콘 레이어</text>
<text x="160" y="169" font-size="12" fill="#0a84ff" text-anchor="middle">onPointerDown</text>
<line x1="160" y1="176" x2="160" y2="196" stroke="#6e6e73"/>
<rect x="70" y="196" width="180" height="34" rx="8" fill="#f2f2f7"/>
<text x="160" y="218" font-size="12" fill="#1d1d1f" text-anchor="middle">Menu (createPortal)</text>
<line x1="160" y1="230" x2="160" y2="250" stroke="#6e6e73"/>
<rect x="70" y="250" width="180" height="34" rx="8" fill="#ffffff" stroke="#1d1d1f"/>
<text x="160" y="272" font-size="12" fill="#1d1d1f" text-anchor="middle">항목 "정리하기"</text>
<path d="M256 262 C 290 240, 290 170, 256 158" fill="none" stroke="#ff3b30" stroke-width="2" marker-end="url(#a)"/>
<text x="292" y="214" font-size="12" fill="#ff3b30">전파됨</text>
<!-- DOM tree -->
<text x="490" y="66" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">DOM 트리 (실제 요소 위치)</text>
<rect x="420" y="82" width="140" height="34" rx="8" fill="#f2f2f7"/>
<text x="490" y="104" font-size="12" fill="#1d1d1f" text-anchor="middle">body</text>
<line x1="450" y1="116" x2="410" y2="136" stroke="#6e6e73"/>
<line x1="530" y1="116" x2="570" y2="136" stroke="#6e6e73"/>
<rect x="350" y="136" width="120" height="34" rx="8" fill="#f2f2f7"/>
<text x="410" y="158" font-size="12" fill="#1d1d1f" text-anchor="middle">#root</text>
<line x1="410" y1="170" x2="410" y2="196" stroke="#6e6e73"/>
<rect x="350" y="196" width="120" height="40" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="410" y="214" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">아이콘 레이어</text>
<text x="410" y="229" font-size="12" fill="#6e6e73" text-anchor="middle">div</text>
<rect x="510" y="136" width="110" height="34" rx="8" fill="#f2f2f7"/>
<text x="565" y="158" font-size="12" fill="#1d1d1f" text-anchor="middle">메뉴 div</text>
<line x1="565" y1="170" x2="565" y2="196" stroke="#6e6e73"/>
<rect x="505" y="196" width="120" height="40" rx="8" fill="#ffffff" stroke="#1d1d1f"/>
<text x="565" y="220" font-size="12" fill="#1d1d1f" text-anchor="middle">항목 "정리하기"</text>
<rect x="340" y="250" width="290" height="34" rx="8" fill="#ffffff" stroke="#6e6e73" stroke-dasharray="4 3"/>
<text x="485" y="272" font-size="12" fill="#6e6e73" text-anchor="middle">레이어 div 안에 항목이 없다</text>
<!-- fix -->
<rect x="24" y="306" width="592" height="78" rx="10" fill="#f2f2f7"/>
<text x="40" y="330" font-size="13" font-weight="700" fill="#1d1d1f">수정: 레이어 처리기가 DOM 위치를 확인한다</text>
<text x="40" y="352" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">const inLayer = (event) =&gt; event.currentTarget.contains(event.target);</text>
<text x="40" y="372" font-size="12" fill="#6e6e73">메뉴 항목에서 온 이벤트는 inLayer가 false라 사각형 선택을 시작하지 않는다</text>
</svg>
