<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>organizePosts에 글 목록과 정리 내용을 넣은 예</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">organizePosts(posts, organization)의 입력과 결과</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">글 주소 a·b·c와 폴더 이름은 설명용 예시다</text>
<rect x="20" y="68" width="280" height="150" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="36" y="92" font-size="13" font-weight="700" fill="#1d1d1f">입력 1: 저장소 글 (머리말 category)</text>
<g font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">
<text x="36" y="120">a.md  학습/네트워크</text>
<text x="36" y="144">b.md  학습/네트워크</text>
<text x="36" y="168">c.md  개발 기록</text>
</g>
<text x="36" y="200" font-size="12" fill="#6e6e73">Git이 관리, 서버는 수정하지 않음</text>
<rect x="340" y="68" width="280" height="150" rx="10" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="356" y="92" font-size="13" font-weight="700" fill="#0a84ff">입력 2: 정리 내용 (DB 한 행)</text>
<g font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">
<text x="356" y="120">folders: ["보관"]</text>
<text x="356" y="144">posts:   { "b": "보관" }</text>
<text x="356" y="168">moves:   []</text>
<text x="356" y="192">pins:    { "c": true }</text>
</g>
<line x1="160" y1="218" x2="300" y2="262" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="480" y1="218" x2="340" y2="262" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="266" width="600" height="138" rx="10" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="36" y="290" font-size="13" font-weight="700" fill="#1d1d1f">결과: 사이드바와 목록에 표시되는 구조</text>
<g font-size="12" fill="#1d1d1f">
<text x="36" y="318">개발 기록 / c  (고정, 목록 맨 위)</text>
<text x="36" y="342">학습 / 네트워크 / a</text>
<text x="36" y="366">보관 / b  (머리말은 학습/네트워크 그대로, 정리 내용이 위치를 덮어씀)</text>
</g>
<text x="36" y="392" font-size="12" fill="#6e6e73">정리 내용을 빈 값으로 바꾸면 b는 학습/네트워크로, c는 고정이 풀린 상태로 돌아간다</text>
</svg>
