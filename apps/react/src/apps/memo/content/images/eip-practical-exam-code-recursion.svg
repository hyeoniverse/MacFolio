<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>power(3, 5)의 재귀 호출이 내려가고 값이 돌아오는 과정</title><rect width="640" height="360" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker></defs>
<text x="320" y="26" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600">power(3, 5): n을 반씩 줄이며 내려가고, 제곱하며 올라온다</text>
<rect x="60" y="60" width="200" height="44" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="160" y="80" font-size="14" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">power(3, 5)</text>
<text x="160" y="97" font-size="12" fill="#6e6e73" text-anchor="middle">n=5, 홀수, calls = 1</text>
<line x1="130" y1="104" x2="160" y2="128" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#m0a84ff)"/>
<text x="100" y="120" font-size="11" fill="#0a84ff" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">n / 2</text>
<rect x="430" y="66" width="180" height="32" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
<text x="520" y="87" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">9 × 9 × 3 = 243</text>
<rect x="90" y="130" width="200" height="44" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="190" y="150" font-size="14" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">power(3, 2)</text>
<text x="190" y="167" font-size="12" fill="#6e6e73" text-anchor="middle">n=2, 짝수, calls = 2</text>
<line x1="160" y1="174" x2="190" y2="198" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#m0a84ff)"/>
<text x="130" y="190" font-size="11" fill="#0a84ff" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">n / 2</text>
<rect x="430" y="136" width="180" height="32" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
<text x="520" y="157" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">3 × 3 = 9</text>
<line x1="600" y1="134" x2="600" y2="100" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#mff9f0a)"/>
<rect x="120" y="200" width="200" height="44" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="220" y="220" font-size="14" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">power(3, 1)</text>
<text x="220" y="237" font-size="12" fill="#6e6e73" text-anchor="middle">n=1, 홀수, calls = 3</text>
<line x1="190" y1="244" x2="220" y2="268" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#m0a84ff)"/>
<text x="160" y="260" font-size="11" fill="#0a84ff" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">n / 2</text>
<rect x="430" y="206" width="180" height="32" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
<text x="520" y="227" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">1 × 1 × 3 = 3</text>
<line x1="600" y1="204" x2="600" y2="170" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#mff9f0a)"/>
<rect x="150" y="270" width="200" height="44" rx="8" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="250" y="290" font-size="14" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">power(3, 0)</text>
<text x="250" y="307" font-size="12" fill="#6e6e73" text-anchor="middle">종료 조건, calls = 4</text>
<rect x="430" y="276" width="180" height="32" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1"/>
<text x="520" y="297" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">1</text>
<line x1="600" y1="274" x2="600" y2="240" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#mff9f0a)"/>
<text x="520" y="52" font-size="12" fill="#ff9f0a" text-anchor="middle">돌아오는 값 (아래에서 위로)</text>
<text x="320" y="345" font-size="12" fill="#6e6e73" text-anchor="middle">파란 화살표는 호출(내려가는 단계), 주황 화살표는 반환(올라오는 단계)</text>
</svg>
