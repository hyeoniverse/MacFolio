<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>z-index 층: 앱 창 위에 펼친 메뉴 10000, 전체 화면 보기 12000, 앱 오류 경고창 15000, 로그인 화면 20000 순서로 쌓인다</title>
<rect width="640" height="300" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">경고창이 놓이는 층 (theme.css의 --z-* 변수)</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">z-index 값이 클수록 화면에서 위에 그려진다</text>

<rect x="24" y="72" width="420" height="38" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="40" y="96" font-size="13" font-weight="700" fill="#1d1d1f">로그인 화면</text>
<text x="428" y="96" font-size="12" fill="#6e6e73" text-anchor="end" font-family="ui-monospace, Menlo, monospace">--z-login: 20000</text>

<rect x="24" y="118" width="420" height="38" rx="8" fill="#eef6ff" stroke="#0a84ff" stroke-width="2"/>
<text x="40" y="142" font-size="13" font-weight="700" fill="#0a84ff">앱 오류 경고창</text>
<text x="428" y="142" font-size="12" fill="#0a84ff" text-anchor="end" font-family="ui-monospace, Menlo, monospace">--z-app-error: 15000</text>

<rect x="24" y="164" width="420" height="38" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="40" y="188" font-size="13" font-weight="700" fill="#1d1d1f">전체 화면 보기</text>
<text x="428" y="188" font-size="12" fill="#6e6e73" text-anchor="end" font-family="ui-monospace, Menlo, monospace">--z-fullscreen: 12000</text>

<rect x="24" y="210" width="420" height="38" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="40" y="234" font-size="13" font-weight="700" fill="#1d1d1f">펼친 메뉴</text>
<text x="428" y="234" font-size="12" fill="#6e6e73" text-anchor="end" font-family="ui-monospace, Menlo, monospace">--z-menu: 10000</text>

<rect x="24" y="256" width="420" height="30" rx="8" fill="#ffffff" stroke="#6e6e73" stroke-dasharray="4 3"/>
<text x="40" y="276" font-size="12" fill="#6e6e73">앱 창들 (오류가 난 메모 창 포함)</text>

<text x="464" y="128" font-size="12" fill="#1d1d1f">오류가 난 앱은 창 내용을</text>
<text x="464" y="146" font-size="12" fill="#1d1d1f">렌더링하지 못하므로</text>
<text x="464" y="164" font-size="12" fill="#1d1d1f">경고창은 창 밖, 화면 전체에</text>
<text x="464" y="182" font-size="12" fill="#1d1d1f">메뉴·전체 화면보다 위,</text>
<text x="464" y="200" font-size="12" fill="#1d1d1f">로그인 화면보다 아래</text>
</svg>
