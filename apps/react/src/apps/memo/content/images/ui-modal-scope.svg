<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>scope window는 오버레이가 앱 창만 덮고 창 안에 그린다. scope screen은 createPortal로 body에 그려 화면 전체를 덮는다</title>
<rect width="800" height="270" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">scope: 덮개가 어디까지 덮나</text>
<text x="40" y="66" font-size="12" fill="#374151" font-weight="600">scope="window" (경고창 · 이름 바꾸기)</text>
<rect x="40" y="78" width="330" height="170" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<rect x="60" y="96" width="220" height="130" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<rect x="60" y="96" width="220" height="130" rx="8" fill="#000000" fill-opacity="0.12"/>
<rect x="110" y="136" width="120" height="50" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="170" y="165" font-size="10.5" fill="#1f2937" text-anchor="middle">패널</text>
<rect x="290" y="110" width="66" height="90" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="323" y="160" font-size="9.5" fill="#6b7280" text-anchor="middle">다른 창</text>
<text x="170" y="242" font-size="10" fill="#6b7280" text-anchor="middle">position: absolute, 앱 창 안</text>
<text x="430" y="66" font-size="12" fill="#374151" font-weight="600">scope="screen" (단축키 · 로그인 · Launchpad)</text>
<rect x="430" y="78" width="330" height="170" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<rect x="450" y="96" width="160" height="110" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<rect x="620" y="110" width="120" height="90" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<rect x="430" y="78" width="330" height="170" rx="10" fill="#000000" fill-opacity="0.28"/>
<rect x="535" y="128" width="120" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="595" y="160" font-size="10.5" fill="#1f2937" text-anchor="middle">패널</text>
<text x="595" y="242" font-size="10" fill="#ffffff" text-anchor="middle">position: fixed, createPortal → body</text>
</svg>
