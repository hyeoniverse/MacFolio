<rect x="107.4" y="136" width="75.4" height="34" rx="7" fill="#e8f2ff"/><text x="145.1" y="158" text-anchor="middle" fill="#1d1d1f">순차적</text><line x1="183.9" y1="153" x2="193.9" y2="153" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
