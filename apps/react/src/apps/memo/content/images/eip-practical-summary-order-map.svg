<rect x="282.3" y="136" width="75.4" height="34" rx="7" fill="#e8f2ff"/><text x="320.0" y="158" text-anchor="middle" fill="#1d1d1f">절차적</text><line x1="358.7" y1="153" x2="368.7" y2="153" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="369.7" y="136" width="75.4" height="34" rx="7" fill="#e8f2ff"/><text x="407.4" y="158" text-anchor="middle" fill="#1d1d1f">시간적</text><line x1="446.1" y1="153" x2="456.1" y2="153" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
