<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>순서를 외워야 하는 용어 묶음</title><rect width="640" height="514" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">순서를 통째로 써야 하는 묶음</text>
<g font-size="13">
<text x="20" y="52" font-weight="600" fill="#1d1d1f">결합도 (약한 것 → 강한 것, 왼쪽이 좋은 설계)</text><text x="620" y="52" text-anchor="end" fill="#0a84ff" font-weight="600">“자스제외공내”</text>
<rect x="20.0" y="62" width="90.0" height="34" rx="7" fill="#e8f2ff"/><text x="65.0" y="84" text-anchor="middle" fill="#1d1d1f">자료</text><line x1="111.0" y1="79" x2="121.0" y2="79" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="122.0" y="62" width="90.0" height="34" rx="7" fill="#e8f2ff"/><text x="167.0" y="84" text-anchor="middle" fill="#1d1d1f">스탬프</text><line x1="213.0" y1="79" x2="223.0" y2="79" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="224.0" y="62" width="90.0" height="34" rx="7" fill="#e8f2ff"/><text x="269.0" y="84" text-anchor="middle" fill="#1d1d1f">제어</text><line x1="315.0" y1="79" x2="325.0" y2="79" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="326.0" y="62" width="90.0" height="34" rx="7" fill="#e8f2ff"/><text x="371.0" y="84" text-anchor="middle" fill="#1d1d1f">외부</text><line x1="417.0" y1="79" x2="427.0" y2="79" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="428.0" y="62" width="90.0" height="34" rx="7" fill="#e8f2ff"/><text x="473.0" y="84" text-anchor="middle" fill="#1d1d1f">공통</text><line x1="519.0" y1="79" x2="529.0" y2="79" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530.0" y="62" width="90.0" height="34" rx="7" fill="#e8f2ff"/><text x="575.0" y="84" text-anchor="middle" fill="#1d1d1f">내용</text>
<text x="20" y="126" font-weight="600" fill="#1d1d1f">응집도 (강한 것 → 약한 것, 왼쪽이 좋은 설계)</text><text x="620" y="126" text-anchor="end" fill="#0a84ff" font-weight="600">“기순교절시논우”</text>
