<rect x="173.0" y="284" width="141.0" height="34" rx="7" fill="#fff4e5"/><text x="243.5" y="306" text-anchor="middle" fill="#1d1d1f">통합</text><line x1="315.0" y1="301" x2="325.0" y2="301" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="326.0" y="284" width="141.0" height="34" rx="7" fill="#fff4e5"/><text x="396.5" y="306" text-anchor="middle" fill="#1d1d1f">시스템</text><line x1="468.0" y1="301" x2="478.0" y2="301" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="479.0" y="284" width="141.0" height="34" rx="7" fill="#fff4e5"/><text x="549.5" y="306" text-anchor="middle" fill="#1d1d1f">인수</text>
<text x="20" y="348" font-weight="600" fill="#1d1d1f">정규화 (각 단계에서 제거하는 것)</text><text x="620" y="348" text-anchor="end" fill="#30d158" font-weight="600">“도부이결다조”</text>
<rect x="20.0" y="358" width="90.0" height="34" rx="7" fill="#f2f2f7"/><text x="65.0" y="380" text-anchor="middle" fill="#1d1d1f">1NF 원자값</text><line x1="111.0" y1="375" x2="121.0" y2="375" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="122.0" y="358" width="90.0" height="34" rx="7" fill="#f2f2f7"/><text x="167.0" y="380" text-anchor="middle" fill="#1d1d1f">2NF 부분</text><line x1="213.0" y1="375" x2="223.0" y2="375" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="224.0" y="358" width="90.0" height="34" rx="7" fill="#f2f2f7"/><text x="269.0" y="380" text-anchor="middle" fill="#1d1d1f">3NF 이행</text><line x1="315.0" y1="375" x2="325.0" y2="375" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="326.0" y="358" width="90.0" height="34" rx="7" fill="#f2f2f7"/><text x="371.0" y="380" text-anchor="middle" fill="#1d1d1f">BCNF 결정자</text><line x1="417.0" y1="375" x2="427.0" y2="375" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="428.0" y="358" width="90.0" height="34" rx="7" fill="#f2f2f7"/><text x="473.0" y="380" text-anchor="middle" fill="#1d1d1f">4NF 다치</text><line x1="519.0" y1="375" x2="529.0" y2="375" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530.0" y="358" width="90.0" height="34" rx="7" fill="#f2f2f7"/><text x="575.0" y="380" text-anchor="middle" fill="#1d1d1f">5NF 조인</text>
<text x="20" y="422" font-weight="600" fill="#1d1d1f">OSI 7계층 (하위 → 상위)</text>
<rect x="20.0" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="57.7" y="454" text-anchor="middle" fill="#1d1d1f">물리</text><line x1="96.4" y1="449" x2="106.4" y2="449" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="107.4" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="145.1" y="454" text-anchor="middle" fill="#1d1d1f">데이터 링크</text><line x1="183.9" y1="449" x2="193.9" y2="449" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="194.9" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="232.6" y="454" text-anchor="middle" fill="#1d1d1f">네트워크</text><line x1="271.3" y1="449" x2="281.3" y2="449" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="282.3" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="320.0" y="454" text-anchor="middle" fill="#1d1d1f">전송</text><line x1="358.7" y1="449" x2="368.7" y2="449" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="369.7" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="407.4" y="454" text-anchor="middle" fill="#1d1d1f">세션</text><line x1="446.1" y1="449" x2="456.1" y2="449" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="457.1" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="494.9" y="454" text-anchor="middle" fill="#1d1d1f">표현</text><line x1="533.6" y1="449" x2="543.6" y2="449" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="544.6" y="432" width="75.4" height="34" rx="7" fill="#f2f2f7"/><text x="582.3" y="454" text-anchor="middle" fill="#1d1d1f">응용</text>
</g>
<text x="320" y="498" text-anchor="middle" font-size="12" fill="#6e6e73">문제가 “약한 것부터”인지 “강한 것부터”인지, “하위부터”인지 “상위부터”인지 먼저 확인한다</text>
</svg>
