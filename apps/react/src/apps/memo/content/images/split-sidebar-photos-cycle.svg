<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>FolderRow가 FolderSidebar의 props 타입을 빌려 쓰므로 그냥 나누면 서로 import하는 순환이 된다. 함께 쓰는 타입을 folderSidebar.model.ts에 두어 둘 다 그쪽만 가져온다</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs>
<rect width="760" height="270" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">같이 쓰는 타입은 셋째 파일에</text>
<text x="32" y="66" font-size="13" fill="#ef4444" font-weight="700">그냥 나누면</text>
<rect x="32" y="86" width="150" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="107.0" y="112.0" font-size="11" fill="#374151" text-anchor="middle">FolderSidebar.tsx</text>
<rect x="32" y="180" width="150" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="107.0" y="206.0" font-size="11" fill="#374151" text-anchor="middle">FolderRow.tsx</text>
<path d="M92 132 V178" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M122 178 V132" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="190" y="150" font-size="10" fill="#ef4444">그린다</text>
<text x="190" y="166" font-size="10" fill="#ef4444">Omit&lt;Props&gt; 빌림</text>
<text x="380" y="66" font-size="13" fill="#059669" font-weight="700">셋째 파일에 두면</text>
<rect x="380" y="86" width="150" height="44" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="455.0" y="104.0" font-size="11" fill="#374151" text-anchor="middle">FolderSidebar.tsx</text>
<text x="455.0" y="120.0" font-size="11" fill="#6b7280" text-anchor="middle">· 339줄</text>
<rect x="380" y="180" width="150" height="44" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="455.0" y="206.0" font-size="11" fill="#374151" text-anchor="middle">FolderRow.tsx</text>
<rect x="580" y="128" width="150" height="54" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="655.0" y="151.0" font-size="10.5" fill="#374151" text-anchor="middle">folderSidebar.model.ts</text>
<text x="655.0" y="166.5" font-size="10.5" fill="#6b7280" text-anchor="middle">· DragItem, Props, 안내 문장</text>
<path d="M455 132 V178" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<path d="M532 108 L578 140" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#an)"/>
<path d="M532 202 L578 172" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#an)"/>
<text x="32" y="252" font-size="10.5" fill="#6b7280">같은 규칙으로 PhotosMobile.tsx(662줄)도 PhoneViewer · PhotoGrid · photosMobile.model.ts로 나눴다.</text>
