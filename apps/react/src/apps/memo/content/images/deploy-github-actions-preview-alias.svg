<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>브랜치 이름 fix/mail-phone-spacing이 별칭 fix-mail-phone-spacing으로 바뀌고, 미리보기 주소가 PR 댓글 하나에 기록된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="360" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">브랜치 이름에서 미리보기 주소까지</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">preview 작업이 PR마다 실행하는 변환. 별칭은 주소의 첫 부분(DNS 레이블)이 된다</text>
<rect x="24" y="72" width="592" height="34" rx="8" fill="#f2f2f7"/>
<text x="36" y="94" font-size="12.5" fill="#6e6e73">브랜치</text>
<text x="140" y="94" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">Fix/Mail_Phone--Spacing (가상의 예)</text>
<line x1="320" y1="108" x2="320" y2="120" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="122" width="592" height="34" rx="8" fill="#ffffff" stroke="#e5e5ea"/>
<text x="36" y="144" font-size="12.5" fill="#6e6e73">① 소문자</text>
<text x="140" y="144" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">fix/mail_phone--spacing</text>
<text x="604" y="144" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#6e6e73">tr '[:upper:]' '[:lower:]'</text>
<rect x="24" y="162" width="592" height="34" rx="8" fill="#ffffff" stroke="#e5e5ea"/>
<text x="36" y="184" font-size="12.5" fill="#6e6e73">② 기호 → -</text>
<text x="140" y="184" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">fix-mail-phone-spacing</text>
<text x="604" y="184" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#6e6e73">s/[^a-z0-9]+/-/g</text>
<rect x="24" y="202" width="592" height="34" rx="8" fill="#ffffff" stroke="#e5e5ea"/>
<text x="36" y="224" font-size="12.5" fill="#6e6e73">③ 양끝·40자</text>
<text x="140" y="224" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">fix-mail-phone-spacing</text>
<text x="604" y="224" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#6e6e73">s/^-+//; s/-+$//; cut -c1-40</text>
<line x1="320" y1="238" x2="320" y2="250" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="252" width="592" height="34" rx="8" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="36" y="274" font-size="12.5" fill="#0a84ff" font-weight="600">미리보기 주소</text>
<text x="140" y="274" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f"><tspan fill="#0a84ff" font-weight="700">fix-mail-phone-spacing</tspan>-macfolio.&lt;계정&gt;.workers.dev</text>
<rect x="24" y="300" width="290" height="44" rx="8" fill="#f2f2f7"/>
<text x="36" y="319" font-size="12" fill="#1d1d1f">표식 줄이 있는 댓글이 있으면 → 수정</text>
<text x="36" y="335" font-size="12" fill="#1d1d1f">없으면 → 새로 작성</text>
<rect x="326" y="300" width="290" height="44" rx="8" fill="#f2f2f7"/>
<text x="338" y="319" font-size="12" fill="#1d1d1f">커밋을 10번 push해도 별칭과 주소는 같고</text>
<text x="338" y="335" font-size="12" fill="#1d1d1f">PR의 미리보기 댓글은 1개</text>
</svg>
