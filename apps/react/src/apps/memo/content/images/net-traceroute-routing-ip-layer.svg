<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="480" fill="#fff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <!-- IP 계층 영역 -->
  <rect x="8" y="78" width="624" height="330" rx="10" fill="#fafafc" stroke="#c7c7cc" stroke-dasharray="5 4"/>
  <text x="20" y="398" font-size="13" font-weight="600" fill="#6e6e73">IP 계층</text>

  <!-- 화살표: 테이블 갱신(주황 점선) -->
  <g stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#o)">
    <line x1="55" y1="58" x2="70" y2="222"/>
    <line x1="152" y1="58" x2="118" y2="216"/>
    <line x1="240" y1="136" x2="160" y2="222"/>
    <line x1="140" y1="216" x2="240" y2="60"/>
  </g>
  <!-- 화살표: 데이터 경로 -->
  <g stroke="#1d1d1f" stroke-width="1.4" fill="none" marker-end="url(#k)">
    <line x1="410" y1="430" x2="530" y2="374"/>
    <line x1="530" y1="340" x2="530" y2="304"/>
    <line x1="530" y1="270" x2="530" y2="224"/>
    <path d="M560,156 L560,96"/>
    <line x1="560" y1="96" x2="482" y2="60"/>
    <line x1="560" y1="96" x2="392" y2="60"/>
    <line x1="560" y1="96" x2="314" y2="118"/>
    <line x1="370" y1="58" x2="340" y2="216"/>
    <line x1="460" y1="58" x2="374" y2="216"/>
    <line x1="270" y1="136" x2="282" y2="216"/>
    <line x1="180" y1="250" x2="196" y2="250"/>
    <line x1="450" y1="196" x2="384" y2="232"/>
    <line x1="460" y1="286" x2="384" y2="274"/>
    <line x1="290" y1="290" x2="320" y2="426"/>
  </g>
  <!-- 상자 -->
  <g fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2">
    <rect x="10" y="20" width="92" height="38" rx="5"/>
    <rect x="110" y="20" width="92" height="38" rx="5"/>
    <rect x="210" y="20" width="92" height="38" rx="5"/>
    <rect x="330" y="20" width="80" height="38" rx="5"/>
    <rect x="430" y="20" width="80" height="38" rx="5"/>
    <rect x="230" y="104" width="80" height="32" rx="5" fill="#fff"/>
    <rect x="200" y="218" width="180" height="72" rx="6" fill="#e3f0ff" stroke="#0a84ff" stroke-width="1.6"/>
    <rect x="450" y="156" width="176" height="66" rx="6" fill="#fff"/>
    <rect x="460" y="270" width="140" height="32" rx="5" fill="#fff"/>
    <rect x="460" y="340" width="140" height="32" rx="5" fill="#fff"/>
    <rect x="230" y="430" width="380" height="36" rx="5"/>
  </g>
  <ellipse cx="110" cy="250" rx="70" ry="32" fill="#fff4e0" stroke="#ff9f0a" stroke-width="1.5"/>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <text x="56" y="44">라우팅 데몬</text>
    <text x="156" y="44">route 명령</text>
    <text x="256" y="44">netstat 명령</text>
    <text x="370" y="44" font-weight="600">UDP</text>
    <text x="470" y="44" font-weight="600">TCP</text>
    <text x="270" y="125" font-weight="600">ICMP</text>
    <text x="110" y="255">라우팅 테이블</text>
    <text x="290" y="248" font-weight="600">IP 출력</text>
    <text x="290" y="268">다음 홉 계산(필요 시)</text>
    <text x="538" y="180" font-weight="600">우리 주소인가?</text>
    <text x="538" y="198" font-size="12" fill="#6e6e73">자기 IP 주소이거나</text>
    <text x="538" y="214" font-size="12" fill="#6e6e73">브로드캐스트 주소</text>
    <text x="530" y="291">IP 옵션 처리</text>
    <text x="530" y="361">IP 입력 큐</text>
    <text x="420" y="453">네트워크 인터페이스</text>
  </g>
  <g font-size="12" fill="#6e6e73">
    <text x="568" y="130">예</text>
    <text x="392" y="252">아니요: 전달 가능하면</text>
    <text x="420" y="300" text-anchor="middle">소스 라우팅</text>
    <rect x="174" y="166" width="70" height="18" fill="#fafafc"/>
    <text x="209" y="180" fill="#ff9f0a" text-anchor="middle">ICMP 재지정</text>
  </g>
</svg>
