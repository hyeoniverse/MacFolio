<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>브랜드 타입: 바깥에서 온 문자열은 postSlug()·folderPath() 문을 지나야 PostSlug·FolderPath가 되고, 안쪽은 그 타입만 받는다</title>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
</defs>
<rect width="640" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">문자열은 문을 지나야 글 주소·폴더 경로가 된다</text>
<text x="32" y="66" font-size="12" font-weight="600" fill="#ef4444">바깥 (string)</text>
<g font-size="10.5" fill="#374151">
<rect x="32" y="76" width="150" height="26" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="107" y="93" text-anchor="middle">주소창 /memo/&lt;slug&gt;</text>
<rect x="32" y="110" width="150" height="26" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="107" y="127" text-anchor="middle">API @Param('slug')</text>
<rect x="32" y="144" width="150" height="26" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="107" y="161" text-anchor="middle">Markdown 파일 이름</text>
<rect x="32" y="178" width="150" height="26" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="107" y="195" text-anchor="middle">끌어 놓는 항목의 id</text>
<rect x="32" y="212" width="150" height="26" rx="6" fill="#fff1f2" stroke="#fda4af"/><text x="107" y="229" text-anchor="middle">요청 몸통 (정리 내용)</text>
</g>
<rect x="222" y="76" width="196" height="162" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="320" y="98" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">desktop-core/memo/rules.ts</text>
<text x="320" y="120" font-size="10.5" fill="#374151" text-anchor="middle">postSlug(value): PostSlug | null</text>
<text x="320" y="135" font-size="10" fill="#6b7280" text-anchor="middle">POST_SLUG = /^[\w-]{1,100}$/</text>
<text x="320" y="158" font-size="10.5" fill="#374151" text-anchor="middle">folderPath(value): FolderPath | null</text>
<text x="320" y="173" font-size="10" fill="#6b7280" text-anchor="middle">folderPathError === null</text>
<text x="320" y="196" font-size="10.5" fill="#374151" text-anchor="middle">checkSlug(): asserts slug is PostSlug</text>
<text x="320" y="211" font-size="10.5" fill="#374151" text-anchor="middle">z.custom&lt;PostSlug&gt;(isPostSlug)</text>
<text x="320" y="228" font-size="10" fill="#6b7280" text-anchor="middle">실행 시에는 그냥 문자열, 타입에만 표시</text>
<g stroke="#4f46e5" stroke-width="2" fill="none">
<path d="M182 89 H220" marker-end="url(#ok)"/><path d="M182 123 H220" marker-end="url(#ok)"/><path d="M182 157 H220" marker-end="url(#ok)"/><path d="M182 191 H220" marker-end="url(#ok)"/><path d="M182 225 H220" marker-end="url(#ok)"/>
<path d="M418 157 H456" marker-end="url(#ok)"/>
</g>
<text x="458" y="66" font-size="12" font-weight="600" fill="#4f46e5">안쪽 (PostSlug · FolderPath)</text>
<g font-size="10.5" fill="#374151">
<rect x="458" y="76" width="150" height="26" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="533" y="93" text-anchor="middle">Post.slug · AdminPost.slug</text>
<rect x="458" y="110" width="150" height="26" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="533" y="127" text-anchor="middle">Organization의 키·값</text>
<rect x="458" y="144" width="150" height="26" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="533" y="161" text-anchor="middle">movePost(slug, folder)</text>
<rect x="458" y="178" width="150" height="26" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="533" y="195" text-anchor="middle">FolderNode.path</text>
<rect x="458" y="212" width="150" height="26" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="533" y="229" text-anchor="middle">사이드바 onRenameFolder …</text>
</g>
<path d="M107 262 H440" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#no)"/>
<text x="275" y="256" font-size="10.5" fill="#ef4444" text-anchor="middle">movePost(org, '아무 문자열', target) → tsc 오류</text>
<text x="32" y="292" font-size="10.5" fill="#374151">이미 있던 것: AppName(내장 앱 유니언 + 프로젝트 앱 브랜드), CustomWallpaperId, ProjectLook·EventType 유니언</text>
<text x="32" y="310" font-size="10.5" fill="#6b7280">any는 0건. 이번에 더한 것은 PostSlug·FolderPath 둘과 문 다섯 곳</text>
</svg>
