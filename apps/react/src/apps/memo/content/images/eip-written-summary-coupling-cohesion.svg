<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>결합도와 응집도의 순서</title><rect width="640" height="330" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">모듈 설계 품질: 결합도는 낮게, 응집도는 높게</text><text x="20" y="70" text-anchor="start" font-size="14" font-weight="600" fill="#1d1d1f">결합도 (모듈 사이의 의존 정도)</text><text x="620" y="70" text-anchor="end" font-size="13" font-weight="600" fill="#ff9f0a">외우기: 자스제외공내</text><rect x="20.0" y="84" width="93.3" height="52" rx="6" fill="#ecfaf0" stroke="#30d158" stroke-width="1.5"/><text x="66.7" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">자료</text><text x="66.7" y="127" text-anchor="middle" font-size="12" fill="#6e6e73">1</text><rect x="121.3" y="84" width="93.3" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="168.0" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">스탬프</text><text x="168.0" y="127" text-anchor="middle" font-size="12" fill="#6e6e73">2</text><rect x="222.7" y="84" width="93.3" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="269.3" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">제어</text><text x="269.3" y="127" text-anchor="middle" font-size="12" fill="#6e6e73">3</text><rect x="324.0" y="84" width="93.3" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="370.7" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">외부</text><text x="370.7" y="127" text-anchor="middle" font-size="12" fill="#6e6e73">4</text><rect x="425.3" y="84" width="93.3" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="472.0" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">공통</text><text x="472.0" y="127" text-anchor="middle" font-size="12" fill="#6e6e73">5</text><rect x="526.7" y="84" width="93.3" height="52" rx="6" fill="#fff0ef" stroke="#ff453a" stroke-width="1.5"/><text x="573.3" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">내용</text><text x="573.3" y="127" text-anchor="middle" font-size="12" fill="#6e6e73">6</text><path d="M20 156 H616" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="176" text-anchor="start" font-size="13" fill="#30d158">좋음: 결합도 약함</text><text x="620" y="176" text-anchor="end" font-size="13" fill="#ff453a">나쁨: 결합도 강함</text><text x="20" y="200" text-anchor="start" font-size="14" font-weight="600" fill="#1d1d1f">응집도 (모듈 내부 요소의 관련 정도)</text><text x="620" y="200" text-anchor="end" font-size="13" font-weight="600" fill="#ff9f0a">외우기: 기순교절시논우</text><rect x="20.0" y="214" width="78.9" height="52" rx="6" fill="#ecfaf0" stroke="#30d158" stroke-width="1.5"/><text x="59.4" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">기능적</text><text x="59.4" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">1</text><rect x="106.9" y="214" width="78.9" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="146.3" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">순차적</text><text x="146.3" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">2</text><rect x="193.7" y="214" width="78.9" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="233.1" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">교환적</text><text x="233.1" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">3</text><rect x="280.6" y="214" width="78.9" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="320.0" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">절차적</text><text x="320.0" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">4</text><rect x="367.4" y="214" width="78.9" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="406.9" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">시간적</text><text x="406.9" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">5</text><rect x="454.3" y="214" width="78.9" height="52" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="493.7" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">논리적</text><text x="493.7" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">6</text><rect x="541.1" y="214" width="78.9" height="52" rx="6" fill="#fff0ef" stroke="#ff453a" stroke-width="1.5"/><text x="580.6" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">우연적</text><text x="580.6" y="257" text-anchor="middle" font-size="12" fill="#6e6e73">7</text><path d="M20 286 H616" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="306" text-anchor="start" font-size="13" fill="#30d158">좋음: 응집도 강함</text><text x="620" y="306" text-anchor="end" font-size="13" fill="#ff453a">나쁨: 응집도 약함</text></svg>
