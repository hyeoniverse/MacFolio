<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="32" y="40" font-size="18" font-weight="700" fill="#1f2937">비밀 글을 필터링하는 위치 (서버)</text>
<text x="32" y="64" font-size="13" fill="#6b7280">방문자 요청은 SecretPosts로 확인하고 없는 글과 같은 응답을 보낸다. 관리자는 /posts/admin으로 모든 글을 받는다</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7280"/></marker></defs>
<rect x="32" y="100" width="170" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="117" y="128" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">방문자 브라우저</text>
<text x="117" y="148" font-size="12" text-anchor="middle" fill="#6b7280">세션 쿠키 없음</text>
<rect x="32" y="236" width="170" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="117" y="264" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">Cloudflare Worker</text>
<text x="117" y="284" font-size="12" text-anchor="middle" fill="#6b7280">첫 화면 본문 · sitemap · RSS</text>
<rect x="32" y="372" width="170" height="64" rx="10" fill="#eef2ff" stroke="#5856d6"/>
<text x="117" y="400" font-size="14" font-weight="600" text-anchor="middle" fill="#3730a3">관리자 브라우저</text>
<text x="117" y="420" font-size="12" text-anchor="middle" fill="#4f46e5">세션 쿠키 있음</text>
<rect x="290" y="92" width="330" height="236" rx="12" fill="#ffffff" stroke="#d1d5db"/>
<text x="306" y="116" font-size="13" font-weight="700" fill="#374151">공개 경로 (글 주소를 받는 곳)</text>
<g font-size="12.5" fill="#111827">
<text x="306" y="142">GET /posts · og.png</text>
<text x="306" y="166">GET·POST /posts/:slug/comments</text>
<text x="306" y="190">GET /posts/:slug/likes · PUT like</text>
<text x="306" y="214">GET /posts/stats (인기글)</text>
<text x="306" y="238">GET /analytics/views · summary</text>
<text x="306" y="262">GET /memo/organization</text>
<text x="306" y="286">DELETE /comments/:id · 댓글 좋아요</text>
</g>
<text x="306" y="314" font-size="12" fill="#6b7280">관리자 세션이면 비밀 글도 그대로 (GET /posts 제외)</text>
<rect x="290" y="372" width="330" height="64" rx="12" fill="#eef2ff" stroke="#5856d6"/>
<text x="306" y="398" font-size="13" font-weight="700" fill="#3730a3">GET /posts/admin · PUT /posts/:slug/secret</text>
<text x="306" y="420" font-size="12" fill="#4f46e5">AdminGuard: 모든 글과 secret 값</text>
<rect x="688" y="160" width="240" height="104" rx="12" fill="#fef3c7" stroke="#d97706"/>
<text x="808" y="190" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">SecretPosts</text>
<text x="808" y="212" font-size="12" text-anchor="middle" fill="#92400e">Post.secret = true 인 주소</text>
<text x="808" y="236" font-size="12" text-anchor="middle" fill="#92400e">→ 빈 목록 · 0 · 404</text>
<text x="808" y="252" font-size="11" text-anchor="middle" fill="#b45309">(없는 글과 같은 응답)</text>
<line x1="202" y1="132" x2="288" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="202" y1="268" x2="288" y2="146" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<text x="232" y="256" font-size="11" fill="#6b7280">GET /posts</text>
<line x1="202" y1="404" x2="288" y2="404" stroke="#5856d6" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="620" y1="212" x2="686" y2="212" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="688" y="372" width="240" height="64" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="808" y="398" font-size="12.5" text-anchor="middle" fill="#374151">저장소 Markdown 글</text>
<text x="808" y="418" font-size="12" text-anchor="middle" fill="#6b7280">공개 저장소에 원문이 있어 대상 아님</text>
<text x="32" y="490" font-size="12" fill="#6b7280">필터링은 화면이 아니라 API가 담당한다. 방문자 화면은 서버가 보낸 목록만 그린다</text>
</svg>
