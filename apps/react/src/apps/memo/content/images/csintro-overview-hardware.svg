<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>컴퓨터 하드웨어의 다섯 기능: 입력, 처리, 기억, 출력</title>
<rect width="640" height="340" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">하드웨어 구성 요소와 데이터 흐름</text>
<rect x="20" y="110" width="130" height="80" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="85" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">입력장치</text>
<text x="85" y="162" text-anchor="middle" font-size="12" fill="#6e6e73">키보드·마우스</text><text x="85" y="178" text-anchor="middle" font-size="12" fill="#6e6e73">마이크·카메라</text>
<rect x="220" y="70" width="200" height="160" rx="12" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
<text x="320" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0a84ff">중앙처리장치(CPU)</text>
<rect x="240" y="110" width="160" height="34" rx="6" fill="#f2f2f7"/><text x="320" y="132" text-anchor="middle" font-size="12" fill="#1d1d1f">제어장치: 명령어 해석·신호</text>
<rect x="240" y="152" width="160" height="34" rx="6" fill="#f2f2f7"/><text x="320" y="174" text-anchor="middle" font-size="12" fill="#1d1d1f">연산장치(ALU): 산술·논리</text>
<rect x="240" y="194" width="160" height="26" rx="6" fill="#f2f2f7"/><text x="320" y="212" text-anchor="middle" font-size="12" fill="#1d1d1f">레지스터</text>
<rect x="490" y="110" width="130" height="80" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="555" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">출력장치</text>
<text x="555" y="162" text-anchor="middle" font-size="12" fill="#6e6e73">모니터·프린터</text><text x="555" y="178" text-anchor="middle" font-size="12" fill="#6e6e73">스피커</text>
<rect x="180" y="262" width="280" height="62" rx="10" fill="#fff" stroke="#34c759" stroke-width="2"/>
<text x="320" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">기억장치</text>
<text x="320" y="308" text-anchor="middle" font-size="12" fill="#6e6e73">주기억(RAM·ROM) · 보조기억(SSD·HDD)</text>
<g stroke="#6e6e73" stroke-width="2" fill="none"><line x1="150" y1="150" x2="216" y2="150" marker-end="url(#a)"/><line x1="420" y1="150" x2="486" y2="150" marker-end="url(#a)"/>
<line x1="300" y1="230" x2="300" y2="258" marker-end="url(#a)"/><line x1="340" y1="260" x2="340" y2="234" marker-end="url(#a)"/></g>
<text x="355" y="252" font-size="12" fill="#6e6e73">명령어·데이터</text>
</svg>
