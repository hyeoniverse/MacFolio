<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 222" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>CI는 설치 바로 뒤에 취약점을 검사하고, 그다음 정적 검사, 시험과 빌드, API e2e 순서로 간다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="860" height="222" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">CI에서 검사가 놓인 자리</text>
<text x="32" y="56" font-size="11" fill="#6b7280">.github/workflows/ci.yml의 검사 작업 순서</text>
<rect x="32.0" y="80" width="136.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="100.4" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">설치</text><text x="100.4" y="122" font-size="10.5" fill="#374151" text-anchor="middle">pnpm install</text><text x="100.4" y="138" font-size="10.5" fill="#374151" text-anchor="middle">--frozen-lockfile</text><line x1="170.8" y1="126.0" x2="194.8" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="196.8" y="80" width="136.8" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="265.20000000000005" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">취약점 검사</text><text x="265.20000000000005" y="122" font-size="10.5" fill="#374151" text-anchor="middle">pnpm audit --prod</text><text x="265.20000000000005" y="138" font-size="10.5" fill="#374151" text-anchor="middle">--audit-level=high</text><text x="265.20000000000005" y="154" font-size="10.5" fill="#374151" text-anchor="middle">high 이상이면 멈춤</text><line x1="335.6" y1="126.0" x2="359.6" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="361.6" y="80" width="136.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="430.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">정적 검사</text><text x="430.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">포맷 · 린트</text><text x="430.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">순환 의존 · 타입</text><line x1="500.40000000000003" y1="126.0" x2="524.4000000000001" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="526.4000000000001" y="80" width="136.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="594.8000000000001" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">시험·빌드</text><text x="594.8000000000001" y="122" font-size="10.5" fill="#374151" text-anchor="middle">단위 시험</text><text x="594.8000000000001" y="138" font-size="10.5" fill="#374151" text-anchor="middle">빌드</text><line x1="665.2" y1="126.0" x2="689.2" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="691.2" y="80" width="136.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="759.6" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">API e2e</text><text x="759.6" y="122" font-size="10.5" fill="#374151" text-anchor="middle">PostgreSQL 띄워서</text><text x="759.6" y="138" font-size="10.5" fill="#374151" text-anchor="middle">(화면 E2E는 다른 작업)</text><text x="32" y="202" font-size="11" fill="#6b7280">overrides는 pnpm-workspace.yaml에, 줄마다 어느 위 패키지 때문인지 주석으로</text>
</svg>
