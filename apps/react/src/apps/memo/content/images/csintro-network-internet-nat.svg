<rect x="20" y="170" width="140" height="56" rx="6" fill="#f2f2f7" stroke="none"/>
<text x="90" y="194" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">스마트폰</text>
<text x="90" y="213" font-size="12" fill="#6e6e73" text-anchor="middle">192.168.0.11</text>
<line x1="160" y1="198" x2="238" y2="140" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<rect x="240" y="100" width="140" height="80" rx="8" fill="#ff9f0a" stroke="none"/>
<text x="310" y="135" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">공유기 (NAT)</text>
<text x="310" y="155" font-size="12" fill="#fff" text-anchor="middle">공인 203.0.113.5</text>
<line x1="380" y1="140" x2="470" y2="140" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<rect x="472" y="110" width="150" height="60" rx="8" fill="#0a84ff" stroke="none"/>
<text x="547" y="136" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">웹 서버</text>
