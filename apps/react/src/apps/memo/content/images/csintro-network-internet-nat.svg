<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>사설 IP 두 기기가 공유기의 NAT로 공인 IP 하나를 함께 쓰는 과정과 변환표</title>
<rect width="640" height="365" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect x="20" y="60" width="140" height="56" rx="6" fill="#f2f2f7" stroke="none"/>
<text x="90" y="84" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">노트북</text>
