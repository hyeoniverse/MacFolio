<text x="220" y="259" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">내부 주소:포트</text>
<text x="420" y="259" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">바꾼 주소:포트</text>
<rect x="120" y="268" width="400" height="28" rx="0" fill="#f2f2f7" stroke="none"/>
<text x="220" y="287" font-size="12" fill="#1d1d1f" text-anchor="middle">192.168.0.10:52344</text>
<text x="420" y="287" font-size="12" fill="#1d1d1f" text-anchor="middle">203.0.113.5:40001</text>
<rect x="120" y="296" width="400" height="28" rx="0" fill="#fff" stroke="none"/>
<text x="220" y="315" font-size="12" fill="#1d1d1f" text-anchor="middle">192.168.0.11:61002</text>
<text x="420" y="315" font-size="12" fill="#1d1d1f" text-anchor="middle">203.0.113.5:40002</text>
<text x="320" y="350" font-size="12" fill="#6e6e73" text-anchor="middle">서버는 203.0.113.5만 보고, 응답이 오면 공유기가 변환표로 원래 기기를 찾는다</text>
