<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="780" height="330" fill="#fff"/>
<text x="390.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">iframe 안을 눌렀을 때 바깥 문서가 알 수 있는 것</text>
<rect x="30" y="50" width="340" height="230" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
<text x="200" y="72" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">바깥 문서 (MacFolio)</text>
<rect x="410" y="50" width="340" height="230" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/>
<text x="580" y="72" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="600">iframe 안 문서 (게임)</text>
