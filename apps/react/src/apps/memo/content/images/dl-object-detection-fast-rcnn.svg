<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Fast RCNN의 구조</text>
  <!-- input -->
  <rect x="16" y="120" width="90" height="100" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="61" y="166" text-anchor="middle" font-size="12" fill="#6e6e73">입력 영상</text>
  <text x="61" y="182" text-anchor="middle" font-size="11" fill="#6e6e73">(전체 1장)</text>
  <!-- proposals -->
  <rect x="120" y="44" width="90" height="62" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
  <g fill="none" stroke="#ffcc00" stroke-width="2.2">
    <rect x="128" y="50" width="34" height="40"/><rect x="170" y="54" width="30" height="30"/><rect x="150" y="84" width="16" height="16"/>
  </g>
  <text x="112" y="68" text-anchor="end" font-size="11.5" fill="#1d1d1f">① 영역 제안</text>
  <text x="112" y="82" text-anchor="end" font-size="10.5" fill="#6e6e73">(선택적 탐색)</text>
  <line x1="90" y1="120" x2="124" y2="106" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
  <!-- deep convnet -->
  <path d="M136,160 l20,-14 h36 v64 l-20,14 h-36 z" fill="#e5f0ff" stroke="#0a84ff"/>
  <path d="M136,160 h36 l20,-14 M172,160 v64" fill="none" stroke="#0a84ff"/>
  <text x="164" y="248" text-anchor="middle" font-size="11.5" fill="#1d1d1f">깊은 CNN</text>
  <text x="164" y="262" text-anchor="middle" font-size="10.5" fill="#6e6e73">(영상당 한 번)</text>
  <line x1="108" y1="190" x2="130" y2="190" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- conv feature map -->
  <path d="M232,150 l24,-18 h40 v84 l-24,18 h-40 z" fill="#fff4e0" stroke="#ff9f0a"/>
  <path d="M232,150 h40 l24,-18 M272,150 v84" fill="none" stroke="#ff9f0a"/>
  <rect x="244" y="168" width="18" height="22" fill="none" stroke="#ff3b30" stroke-width="1.8"/>
  <text x="264" y="262" text-anchor="middle" font-size="11.5" fill="#1d1d1f">컨볼루션 특징 맵</text>
  <line x1="196" y1="190" x2="226" y2="190" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- projection -->
  <path d="M210,66 C250,70 256,120 252,164" fill="none" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#o)"/>
  <text x="244" y="120" text-anchor="end" font-size="11" fill="#ff9f0a">RoI 투영</text>
  <text x="244" y="134" text-anchor="end" font-size="10" fill="#ff9f0a">(RoI projection)</text>
  <!-- RoI pooling -->
  <rect x="320" y="166" width="38" height="38" fill="#e8f8ec" stroke="#34c759"/>
  <g stroke="#34c759" stroke-width="0.6">
    <line x1="325.4" y1="166" x2="325.4" y2="204"/><line x1="330.9" y1="166" x2="330.9" y2="204"/><line x1="336.3" y1="166" x2="336.3" y2="204"/><line x1="341.7" y1="166" x2="341.7" y2="204"/><line x1="347.1" y1="166" x2="347.1" y2="204"/><line x1="352.6" y1="166" x2="352.6" y2="204"/>
    <line x1="320" y1="171.4" x2="358" y2="171.4"/><line x1="320" y1="176.9" x2="358" y2="176.9"/><line x1="320" y1="182.3" x2="358" y2="182.3"/><line x1="320" y1="187.7" x2="358" y2="187.7"/><line x1="320" y1="193.1" x2="358" y2="193.1"/><line x1="320" y1="198.6" x2="358" y2="198.6"/>
  </g>
  <text x="339" y="226" text-anchor="middle" font-size="11.5" fill="#1d1d1f">RoI 풀링층</text>
  <text x="339" y="240" text-anchor="middle" font-size="10.5" fill="#6e6e73">(7×7 고정 격자)</text>
  <line x1="264" y1="179" x2="314" y2="183" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- FCs -->
  <rect x="378" y="174" width="12" height="22" fill="#fff" stroke="#1d1d1f"/>
  <rect x="396" y="174" width="12" height="22" fill="#fff" stroke="#1d1d1f"/>
  <text x="393" y="164" text-anchor="middle" font-size="11" fill="#1d1d1f">FC 2층</text>
  <line x1="360" y1="185" x2="374" y2="185" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- RoI feature vector -->
  <rect x="428" y="150" width="14" height="70" fill="#fff" stroke="#1d1d1f"/>
  <g stroke="#1d1d1f"><line x1="428" y1="164" x2="442" y2="164"/><line x1="428" y1="178" x2="442" y2="178"/><line x1="428" y1="206" x2="442" y2="206"/></g>
  <text x="435" y="240" text-anchor="middle" font-size="11.5" fill="#1d1d1f">RoI 특징 벡터</text>
  <text x="435" y="254" text-anchor="middle" font-size="10.5" fill="#6e6e73">(4096차원)</text>
  <line x1="410" y1="185" x2="424" y2="185" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- outputs -->
  <path d="M444,176 C470,170 480,104 506,96" fill="none" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M444,194 C470,200 480,252 506,258" fill="none" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="474" y="134" font-size="10.5" fill="#0a84ff" text-anchor="end">FC</text>
  <text x="494" y="218" font-size="10.5" fill="#0a84ff">FC</text>
  <rect x="510" y="62" width="118" height="70" rx="6" fill="#e5f0ff" stroke="#0a84ff"/>
  <text x="569" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">분류(softmax)</text>
  <text x="569" y="100" text-anchor="middle" font-size="10.5" fill="#6e6e73">부류 확률 벡터 21개</text>
  <text x="569" y="116" text-anchor="middle" font-size="10.5" fill="#6e6e73">(20부류 + 물체 아님)</text>
  <rect x="510" y="222" width="118" height="70" rx="6" fill="#e5f0ff" stroke="#0a84ff"/>
  <text x="569" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">박스 회귀</text>
  <text x="569" y="260" text-anchor="middle" font-size="10.5" fill="#6e6e73">부류마다 박스 위치</text>
  <text x="569" y="276" text-anchor="middle" font-size="10.5" fill="#6e6e73">(x, y, w, h) × 20</text>
  <!-- per RoI bracket -->
  <rect x="312" y="50" width="322" height="266" rx="8" fill="none" stroke="#c7c7cc" stroke-dasharray="5 4"/>
  <text x="626" y="306" text-anchor="end" font-size="10.5" fill="#6e6e73">② 영역 분류: RoI마다 반복</text>
</svg>
