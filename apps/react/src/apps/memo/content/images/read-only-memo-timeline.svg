<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>잠그고 다시 열기까지</title>
  <rect width="780" height="300" rx="16" fill="#ffffff"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#1f2937">잠근 지 하루 만에 hook 한 줄로 다시 열었다</text>
  <text x="32" y="62" font-size="12" fill="#6b7280">useCanEditMemo()의 반환값이 바뀐 과정</text>
  <line x1="60" y1="150" x2="740" y2="150" stroke="#d1d5db" stroke-width="2"/>
  <g font-size="12">
    <circle cx="90" cy="150" r="8" fill="#9ca3af"/>
    <text x="90" y="120" text-anchor="middle" fill="#1f2937" font-weight="600">9/28 전</text>
    <text x="90" y="180" text-anchor="middle" fill="#374151">누구나 편집</text>
    <text x="90" y="198" text-anchor="middle" fill="#6b7280">localStorage</text>
    <circle cx="260" cy="150" r="8" fill="#ef4444"/>
    <text x="260" y="120" text-anchor="middle" fill="#1f2937" font-weight="600">9/28 25d435e5d</text>
    <text x="260" y="180" text-anchor="middle" fill="#374151">return false</text>
    <text x="260" y="198" text-anchor="middle" fill="#6b7280">방문자 데이터 지움</text>
    <circle cx="450" cy="150" r="8" fill="#6366f1"/>
    <text x="450" y="120" text-anchor="middle" fill="#1f2937" font-weight="600">9/29 #37 · #38</text>
    <text x="450" y="180" text-anchor="middle" fill="#374151">API 뼈대</text>
    <text x="450" y="198" text-anchor="middle" fill="#6b7280">GitHub 관리자 로그인</text>
    <circle cx="650" cy="150" r="8" fill="#22c55e"/>
    <text x="650" y="120" text-anchor="middle" fill="#1f2937" font-weight="600">9/29 0150b9be1</text>
    <text x="650" y="180" text-anchor="middle" fill="#374151">useAdmin().status</text>
    <text x="650" y="198" text-anchor="middle" fill="#6b7280">=== 'signed-in'</text>
  </g>
  <rect x="32" y="232" width="716" height="44" rx="10" fill="#fff7ed"/>
  <text x="48" y="259" font-size="12" fill="#374151">화면은 이 값 하나만 본다. 저장할 때마다 서버가 세션을 다시 확인하므로, 브라우저에서 값을 바꿔도 저장되지 않는다</text>
</svg>
