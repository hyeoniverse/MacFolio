<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>한 방문의 시간선: 모았다가 5초마다, 탭이 숨으면 바로</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">한 방문의 시간선: 모았다가 5초마다, 탭이 숨으면 바로</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">큐에 쌓인 이벤트는 flush 때 한 묶음(visitId 하나)으로 간다</text>
<line x1="40" y1="150" x2="820" y2="150" stroke="#9ca3af" stroke-width="2"/>
<line x1="40" y1="142" x2="40" y2="158" stroke="#9ca3af" stroke-width="2"/>
<text x="40" y="176" font-size="11" fill="#6b7280" text-anchor="middle">0초</text>
<line x1="230" y1="142" x2="230" y2="158" stroke="#9ca3af" stroke-width="2"/>
<text x="230" y="176" font-size="11" fill="#6b7280" text-anchor="middle">5초</text>
<line x1="420" y1="142" x2="420" y2="158" stroke="#9ca3af" stroke-width="2"/>
<text x="420" y="176" font-size="11" fill="#6b7280" text-anchor="middle">10초</text>
<line x1="610" y1="142" x2="610" y2="158" stroke="#9ca3af" stroke-width="2"/>
<text x="610" y="176" font-size="11" fill="#6b7280" text-anchor="middle">15초</text>
<rect x="22" y="80" width="76" height="34" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="60.0" y="101.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">visit</text>
<line x1="60" y1="114" x2="60" y2="146" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="82" y="80" width="76" height="34" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="120.0" y="101.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">app memo</text>
<line x1="120" y1="114" x2="120" y2="146" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="262" y="80" width="76" height="34" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="300.0" y="101.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">item</text>
<line x1="300" y1="114" x2="300" y2="146" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="432" y="80" width="76" height="34" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="470.0" y="101.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">link</text>
<line x1="470" y1="114" x2="470" y2="146" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="662" y="80" width="76" height="34" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="700.0" y="101.0" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">leave</text>
<line x1="700" y1="114" x2="700" y2="146" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="184" y="196" width="92" height="36" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="230.0" y="218.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">flush</text>
<rect x="374" y="196" width="92" height="36" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="420.0" y="218.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">flush</text>
<rect x="564" y="196" width="92" height="36" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="610.0" y="218.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">flush</text>
<rect x="654" y="196" width="92" height="36" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="700.0" y="218.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">flush 즉시</text>
<text x="700" y="256" font-size="11" fill="#b91c1c" text-anchor="middle">visibilitychange: hidden</text>
<text x="40" y="285" font-size="11" fill="#6b7280" text-anchor="start">0~5초: visit·app 두 개가 한 묶음, 5~10초: item, 10~15초: link. 탭을 숨기면 기다리지 않고 leave와 함께 보낸다</text>
</svg>
