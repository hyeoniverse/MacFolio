<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>코드 강조 색 변수를 정의한 위치: 변경 전에는 창(data-app), 변경 후에는 본문 컨테이너</title>
<rect width="860" height="420" rx="16" fill="#ffffff"/>
<text x="32" y="38" font-size="17" fill="#1f2937" font-weight="700">코드 강조 색(--hl-*)을 정의한 위치</text>

<!-- 변경 전 -->
<text x="32" y="78" font-size="15" fill="#b91c1c" font-weight="700">변경 전: 창(data-app)마다 정의</text>
<text x="32" y="100" font-size="12.5" fill="#4b5563">[data-app='memo'], [data-app='finder']에만 --hl-* 정의</text>

<g font-size="13">
	<rect x="32" y="118" width="380" height="74" rx="10" fill="#f0fdf4" stroke="#86efac"/>
	<text x="48" y="144" fill="#1f2937" font-weight="600">메모 창 [data-app='memo']</text>
	<text x="48" y="168" fill="#374151">.memo-markdown .hljs-string → --hl-string</text>
	<text x="396" y="160" fill="#15803d" font-weight="700" text-anchor="end">강조 색</text>

	<rect x="32" y="204" width="380" height="74" rx="10" fill="#f0fdf4" stroke="#86efac"/>
	<text x="48" y="230" fill="#1f2937" font-weight="600">Finder 창 [data-app='finder']</text>
	<text x="48" y="254" fill="#374151">.finder-doc (휴대폰 파일 앱)</text>
	<text x="396" y="246" fill="#15803d" font-weight="700" text-anchor="end">강조 색</text>

	<rect x="32" y="290" width="380" height="74" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
	<text x="48" y="316" fill="#1f2937" font-weight="600">텍스트 편집기 창 [data-app='textedit']</text>
	<text x="48" y="340" fill="#374151">.finder-doc: --hl-* 없음 → color 무효</text>
	<text x="396" y="332" fill="#b91c1c" font-weight="700" text-anchor="end">본문 색</text>
</g>

<!-- 변경 후 -->
<text x="448" y="78" font-size="15" fill="#15803d" font-weight="700">변경 후: 본문 컨테이너 기준 (styles/prose.css)</text>
<text x="448" y="100" font-size="12.5" fill="#4b5563">어느 창에서 열어도 같은 규칙</text>

<g font-size="13">
	<rect x="448" y="118" width="380" height="96" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
	<text x="464" y="146" fill="#1f2937" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">:where(.memo-markdown, .finder-doc)</text>
	<text x="464" y="168" fill="#1f2937" font-weight="600" font-family="ui-monospace, Menlo, monospace" font-size="12.5">  .hljs-string</text>
	<text x="464" y="194" fill="#374151">→ color: var(--color-code-string)</text>

	<rect x="448" y="232" width="380" height="64" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
	<text x="464" y="258" fill="#1f2937" font-weight="600">--color-code-* (:root, tokens/semantic.css)</text>
	<text x="464" y="280" fill="#374151">라이트·다크 값을 화면 모드에 따라 전환</text>

	<rect x="448" y="314" width="118" height="50" rx="10" fill="#f0fdf4" stroke="#86efac"/>
	<text x="507" y="344" fill="#15803d" font-weight="700" text-anchor="middle">메모</text>
	<rect x="579" y="314" width="118" height="50" rx="10" fill="#f0fdf4" stroke="#86efac"/>
	<text x="638" y="344" fill="#15803d" font-weight="700" text-anchor="middle">Finder·파일</text>
	<rect x="710" y="314" width="118" height="50" rx="10" fill="#f0fdf4" stroke="#86efac"/>
	<text x="769" y="344" fill="#15803d" font-weight="700" text-anchor="middle">텍스트 편집기</text>
</g>

<line x1="430" y1="70" x2="430" y2="370" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="32" y="400" font-size="12" fill="#6b7280">var()가 정의되지 않은 변수를 가리키면 선언이 무효가 되어 color가 상속값(본문 색)으로 돌아간다</text>
</svg>
