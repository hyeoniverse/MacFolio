<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>열린 메뉴의 버튼을 다시 누를 때. 여는 버튼을 안쪽으로 치지 않으면 pointerdown이 메뉴를 닫고 이어지는 click이 다시 열어 닫히지 않는다. trigger로 안쪽에 넣으면 click만 처리되어 닫힌다</title>
<rect width="800" height="250" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">열린 메뉴의 버튼을 다시 누르면</text>
<text x="40" y="72" font-size="12" fill="#b91c1c" font-weight="600">여는 버튼이 "바깥"일 때</text>
<g font-size="11">
<rect x="40" y="84" width="200" height="40" rx="8" fill="#fff1f2" stroke="#fda4af"/><text x="140" y="108" text-anchor="middle" fill="#1f2937">pointerdown → 바깥 → 닫기</text>
<text x="256" y="108" fill="#6b7280">→</text>
<rect x="276" y="84" width="200" height="40" rx="8" fill="#fff1f2" stroke="#fda4af"/><text x="376" y="108" text-anchor="middle" fill="#1f2937">click → 버튼 → 다시 열기</text>
<text x="492" y="108" fill="#6b7280">=</text>
<rect x="512" y="84" width="248" height="40" rx="8" fill="#fee2e2"/><text x="636" y="108" text-anchor="middle" fill="#991b1b">닫히지 않는 메뉴</text>
</g>
<text x="40" y="160" font-size="12" fill="#047857" font-weight="600">여는 버튼을 trigger로 넘기면 (useDismiss의 inside)</text>
<g font-size="11">
<rect x="40" y="172" width="200" height="40" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="140" y="196" text-anchor="middle" fill="#1f2937">pointerdown → 안쪽 → 무시</text>
<text x="256" y="196" fill="#6b7280">→</text>
<rect x="276" y="172" width="200" height="40" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="376" y="196" text-anchor="middle" fill="#1f2937">click → 버튼 → 닫기(토글)</text>
<text x="492" y="196" fill="#6b7280">=</text>
<rect x="512" y="172" width="248" height="40" rx="8" fill="#d1fae5"/><text x="636" y="196" text-anchor="middle" fill="#065f46">한 번에 닫힌다</text>
</g>
</svg>
