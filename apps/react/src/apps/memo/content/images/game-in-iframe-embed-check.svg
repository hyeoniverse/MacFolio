<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>브라우저가 iframe 삽입을 허용하는지 판단하는 순서</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1d1d1f">iframe 안에 다른 사이트를 표시하기까지</text>
<rect x="24" y="54" width="250" height="78" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="38" y="78" font-size="13" font-weight="600" fill="#1d1d1f">① 부모 페이지 (MacFolio)</text>
<text x="38" y="100" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;iframe src="https://</text>
<text x="38" y="118" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">  sprout-farm-beta…"&gt;</text>
<line x1="274" y1="93" x2="360" y2="93" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="290" y="85" font-size="12" fill="#0a84ff">GET 요청</text>
<rect x="366" y="54" width="250" height="78" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="380" y="78" font-size="13" font-weight="600" fill="#1d1d1f">② 게임 사이트 (Vercel)</text>
<text x="380" y="100" font-size="12" fill="#1d1d1f">HTML과 함께 응답 헤더를 보낸다</text>
<text x="380" y="118" font-size="12" fill="#6e6e73" font-family="'SF Mono', Menlo, Consolas, monospace">HTTP/2 200</text>
<line x1="491" y1="132" x2="491" y2="160" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="24" y="166" width="592" height="150" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="38" y="190" font-size="13" font-weight="600" fill="#0a84ff">③ 브라우저가 응답 헤더를 확인한다</text>
<rect x="38" y="204" width="270" height="98" rx="8" fill="#fff1f0" stroke="#ff3b30"/>
<text x="50" y="226" font-size="12.5" font-weight="600" fill="#ff3b30">이런 헤더가 있으면 표시하지 않는다</text>
<text x="50" y="248" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">X-Frame-Options: DENY</text>
<text x="50" y="266" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">X-Frame-Options: SAMEORIGIN</text>
<text x="50" y="288" font-size="12" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">CSP frame-ancestors 'self'</text>
<rect x="326" y="204" width="276" height="98" rx="8" fill="#effaf2" stroke="#34c759"/>
<text x="338" y="226" font-size="12.5" font-weight="600" fill="#1d1d1f">새싹 농장의 응답</text>
<text x="338" y="248" font-size="12" fill="#1d1d1f">X-Frame-Options 없음</text>
<text x="338" y="266" font-size="12" fill="#1d1d1f">Content-Security-Policy 없음</text>
<text x="338" y="288" font-size="12" font-weight="600" fill="#34c759">→ 어느 사이트든 iframe에 넣을 수 있다</text>
<line x1="464" y1="316" x2="464" y2="344" stroke="#34c759" stroke-width="1.5" marker-end="url(#agr)"/>
<rect x="326" y="350" width="276" height="46" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="338" y="378" font-size="12.5" fill="#1d1d1f">④ iframe 안에 게임 첫 화면을 그린다</text>
<text x="38" y="368" font-size="12" fill="#6e6e73">curl -sI 로 받은 응답 헤더에서</text>
<text x="38" y="386" font-size="12" fill="#6e6e73">x-frame·content-security가 검색되지 않았다.</text>
</svg>
