<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>댓글 한 줄에 남는 것</title>
  <rect width="780" height="320" rx="16" fill="#ffffff"/>
  <text x="32" y="42" font-size="18" font-weight="700" fill="#1f2937">받은 것과 DB에 남는 것 (2026-09-29, PostComment)</text>
  <text x="32" y="64" font-size="12" fill="#6b7280">원문은 지나가기만 하고, 되돌릴 수 없는 값만 남는다</text>
  <g font-size="12">
    <text x="32" y="98" font-weight="600" fill="#6b7280">요청에서 받은 것</text>
    <text x="440" y="98" font-weight="600" fill="#6b7280">DB에 남는 것</text>
    <rect x="32" y="110" width="220" height="34" rx="8" fill="#f3f4f6"/><text x="46" y="132" fill="#1f2937">이름 · 내용</text>
    <rect x="440" y="110" width="300" height="34" rx="8" fill="#f3f4f6"/><text x="454" y="132" fill="#1f2937">name · body (규칙으로 다듬어서)</text>
    <rect x="32" y="156" width="220" height="34" rx="8" fill="#fee2e2"/><text x="46" y="178" fill="#b91c1c">비밀번호 (원문)</text>
    <rect x="440" y="156" width="300" height="34" rx="8" fill="#dcfce7"/><text x="454" y="178" fill="#15803d">passwordHash = scrypt$salt$hash</text>
    <rect x="32" y="202" width="220" height="34" rx="8" fill="#fee2e2"/><text x="46" y="224" fill="#b91c1c">IP 211.234.56.78</text>
    <rect x="440" y="202" width="140" height="34" rx="8" fill="#dcfce7"/><text x="454" y="224" fill="#15803d">ipPrefix 211.234</text>
    <rect x="590" y="202" width="150" height="34" rx="8" fill="#dcfce7"/><text x="604" y="224" fill="#15803d">ipHash (HMAC)</text>
    <rect x="32" y="248" width="220" height="34" rx="8" fill="#eef0ff"/><text x="46" y="270" fill="#3f46c7">세션 쿠키 (관리자)</text>
    <rect x="440" y="248" width="300" height="34" rx="8" fill="#eef0ff"/><text x="454" y="270" fill="#3f46c7">isAdmin = true, 이름은 김정현</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.6" fill="none">
    <path d="M252 127 H434"/><path d="M252 173 H434"/><path d="M252 219 H434"/><path d="M252 265 H434"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="343" y="168">scrypt + 새 salt</text>
    <text x="343" y="214">앞 두 자리 / 서버 키로 HMAC</text>
  </g>
  <text x="32" y="306" font-size="11" fill="#6b7280">응답은 id · name · ipPrefix · isAdmin · body · createdAt만 select한다 (해시 두 개는 밖으로 나가지 않는다)</text>
</svg>
