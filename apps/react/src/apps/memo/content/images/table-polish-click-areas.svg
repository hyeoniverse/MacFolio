<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>표가 편집기 폭을 다 써서 표 옆은 편집기 바깥인 본문 칸 여백이다. 편집기의 handleClick은 이 여백의 누름을 받지 못해, 본문 칸에 mousedown을 따로 달았다</title>
<rect width="800" height="260" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">표 옆을 누르면 누가 받나</text>
<rect x="60" y="60" width="680" height="170" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="76" y="80" font-size="11" fill="#c2410c">.memo-scroll (본문 칸) — mousedown을 여기에 단다</text>
<rect x="100" y="94" width="600" height="120" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="116" y="112" font-size="11" fill="#4338ca">ProseMirror 편집기 (view.dom) — handleClick</text>
<rect x="100" y="124" width="600" height="70" rx="4" fill="#ffffff" stroke="#6b7280"/>
<line x1="300" y1="124" x2="300" y2="194" stroke="#9ca3af"/>
<line x1="500" y1="124" x2="500" y2="194" stroke="#9ca3af"/>
<line x1="100" y1="159" x2="700" y2="159" stroke="#9ca3af"/>
<text x="400" y="182" font-size="10.5" fill="#6b7280" text-anchor="middle">표 (편집기 폭을 다 쓴다)</text>
<rect x="68" y="124" width="30" height="70" rx="4" fill="#fde68a" fill-opacity="0.6" stroke="#f59e0b" stroke-dasharray="4 3"/>
<rect x="702" y="124" width="30" height="70" rx="4" fill="#fde68a" fill-opacity="0.6" stroke="#f59e0b" stroke-dasharray="4 3"/>
<text x="83" y="212" font-size="9.5" fill="#92400e" text-anchor="middle">32px</text>
<text x="717" y="212" font-size="9.5" fill="#92400e" text-anchor="middle">32px</text>
<text x="400" y="250" font-size="10.5" fill="#374151" text-anchor="middle">노란 여백은 편집기 밖이라 handleClick이 오지 않는다 → gapBesideTableAt으로 표 앞·뒤 자리를 찾는다</text>
</svg>
