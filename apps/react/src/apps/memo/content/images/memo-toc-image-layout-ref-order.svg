<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>React 커밋 단계의 ref 연결 순서: 목차 안의 layout effect는 본문 ref가 붙기 전에 실행된다</title>
<rect width="860" height="330" fill="#fff"/>
<text x="430" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">한 번의 커밋에서 layout 단계가 지나가는 순서 (트리 순서)</text>
<g font-size="12.5">
<text x="24" y="70" font-weight="600" fill="#b91c1c">처음: 목차 컴포넌트 안에서 제목을 읽음</text>
<rect x="24" y="82" width="190" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
<text x="119" y="104" text-anchor="middle" fill="#1f2937">① MemoToc layout effect</text>
<text x="119" y="124" text-anchor="middle" fill="#b91c1c">body.current === null</text>
<rect x="234" y="82" width="190" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="329" y="104" text-anchor="middle" fill="#1f2937">② 본문 div ref 연결</text>
<text x="329" y="124" text-anchor="middle" fill="#6b7280">이미 늦음</text>
<rect x="444" y="82" width="190" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="539" y="108" text-anchor="middle" fill="#1f2937">③ ReaderBody layout effect</text>
<rect x="654" y="82" width="182" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
<text x="745" y="104" text-anchor="middle" fill="#1f2937">결과: 제목 0개</text>
<text x="745" y="124" text-anchor="middle" fill="#b91c1c">목차를 그리지 않음</text>
<text x="24" y="190" font-weight="600" fill="#15803d">고친 뒤: 부모(ReaderBody)의 useTocHeadings에서 읽음</text>
<rect x="24" y="202" width="190" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="119" y="228" text-anchor="middle" fill="#1f2937">① MemoToc (읽지 않음)</text>
<rect x="234" y="202" width="190" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="329" y="228" text-anchor="middle" fill="#1f2937">② 본문 div ref 연결</text>
<rect x="444" y="202" width="190" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="539" y="224" text-anchor="middle" fill="#1f2937">③ ReaderBody layout effect</text>
<text x="539" y="244" text-anchor="middle" fill="#15803d">제목 8개 읽기 → setState</text>
<rect x="654" y="202" width="182" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="745" y="224" text-anchor="middle" fill="#1f2937">그리기 전 다시 렌더링</text>
<text x="745" y="244" text-anchor="middle" fill="#15803d">첫 화면부터 목차</text>
<text x="24" y="296" fill="#4b5563">자식의 layout effect와 ref 연결은 트리 순서로 진행되고, 부모의 layout effect는 자식들이 모두 끝난 뒤 실행된다.</text>
<text x="24" y="316" fill="#4b5563">layout effect 안의 setState는 브라우저가 그리기 전에 처리되므로, 목차가 한 프레임 늦게 끼어들어 본문을 밀지 않는다.</text>
</g>
<g stroke="#9ca3af" stroke-width="1.5"><path d="M214 108 h20M424 108 h20M634 108 h20M214 228 h20M424 228 h20M634 228 h20"/></g>
</svg>
