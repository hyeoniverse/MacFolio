<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>메뉴를 연 시각의 폭 188px로 위치를 정한 뒤 문구가 길어지면 화면 오른쪽 끝에서 줄이 바뀌고 잘리던 문제와, ResizeObserver가 252px로 커진 것을 감지해 위치를 다시 잡는 수정</title>
<rect width="640" height="300" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">메뉴가 열린 뒤 문구가 길어질 때</text>
<text x="24" y="66" font-size="13" font-weight="700" fill="#ff3b30">수정 전: 처음 잰 폭으로 고정</text>
<text x="336" y="66" font-size="13" font-weight="700" fill="#34c759">수정 후: 커지면 다시 배치</text>
<rect x="24" y="80" width="280" height="22" fill="#f2f2f7"/>
<rect x="336" y="80" width="280" height="22" fill="#f2f2f7"/>
<text x="290" y="96" font-size="12" fill="#6e6e73" text-anchor="end">메뉴 막대</text>
<text x="602" y="96" font-size="12" fill="#6e6e73" text-anchor="end">메뉴 막대</text>
<line x1="304" y1="72" x2="304" y2="236" stroke="#1d1d1f" stroke-width="2"/>
<line x1="616" y1="72" x2="616" y2="236" stroke="#1d1d1f" stroke-width="2"/>
<text x="300" y="252" font-size="12" fill="#6e6e73" text-anchor="end">화면 오른쪽 끝</text>
<text x="612" y="252" font-size="12" fill="#6e6e73" text-anchor="end">화면 오른쪽 끝</text>
<rect x="150" y="110" width="150" height="76" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="162" y="132" font-size="12" fill="#1d1d1f">MacFolio API ·</text>
<text x="162" y="150" font-size="12" fill="#1d1d1f">서버에 연결할 수 없</text>
<rect x="290" y="138" width="14" height="18" fill="#ff3b30" opacity="0.25"/>
<text x="162" y="172" font-size="12" fill="#6e6e73">…</text>
<text x="290" y="208" font-size="12" fill="#ff3b30" text-anchor="end">188px 기준 위치 그대로, 끝이 잘림</text>
<rect x="356" y="110" width="252" height="56" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="368" y="132" font-size="12" fill="#1d1d1f">MacFolio API · 서버에 연결할 수 없음</text>
<text x="368" y="152" font-size="12" fill="#6e6e73">지금 확인</text>
<text x="356" y="190" font-size="12" fill="#0a84ff">ResizeObserver → place()</text>
<text x="356" y="208" font-size="12" fill="#0a84ff">폭 252px로 왼쪽으로 다시 배치</text>
<line x1="24" y1="268" x2="616" y2="268" stroke="#d1d1d6"/>
<text x="24" y="290" font-size="12" fill="#6e6e73">문구는 메뉴를 열면서 다시 확인한 /health 결과에 따라 바뀐다 (정상 → 서버에 연결할 수 없음).</text>
</svg>
