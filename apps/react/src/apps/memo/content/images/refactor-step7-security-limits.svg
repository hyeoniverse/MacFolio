<text x="32" y="300" font-size="10.5" font-weight="500" fill="#374151" text-anchor="start">apps/api/src/common/rate-limit.ts. 횟수는 환경 변수로 바꿀 수 있다. 데모와 메일의 하루 상한은 이와 별개로 서비스가 센다.</text>
