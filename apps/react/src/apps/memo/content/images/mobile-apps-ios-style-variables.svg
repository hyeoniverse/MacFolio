<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>셸이 정의한 CSS 사용자 정의 속성을 앱 CSS가 상속받아 사용한다</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="600" height="112" rx="10" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="36" y="46" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">휴대폰 셸 Window.css</text>
<text x="36" y="70" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">.container.mobile[data-app] {</text>
<text x="52" y="88" font-size="12" fill="#0a84ff" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">--phone-page-bg: #f3f4f6;   --phone-card-bg: #ffffff;   …</text>
<text x="36" y="106" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">}</text>
<text x="330" y="46" font-size="12" fill="#6e6e73" text-anchor="start">다크 모드: :root[data-theme="dark"] 아래에서</text>
<text x="330" y="106" font-size="12" fill="#ff9f0a" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">--phone-page-bg: #1e1e1e</text>
<text x="36" y="124" font-size="12" fill="#6e6e73" text-anchor="start">선언한 요소의 모든 자손이 같은 값을 상속받는다</text>
<text x="560" y="124" font-size="12" fill="#ff9f0a" text-anchor="end">값만 교체</text>
<line x1="90" y1="134" x2="90" y2="172" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="20" y="176" width="140" height="100" rx="10" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2"/>
<text x="90" y="198" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">메일 CSS</text>
<rect x="32" y="210" width="116" height="54" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1.2"/>
<rect x="42" y="222" width="96" height="30" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1"/>
<text x="90" y="242" font-size="12" fill="#1d1d1f" text-anchor="middle">흰 카드</text>
<line x1="242" y1="134" x2="242" y2="172" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="172" y="176" width="140" height="100" rx="10" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2"/>
<text x="242" y="198" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">메시지 CSS</text>
<rect x="184" y="210" width="116" height="54" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1.2"/>
<rect x="194" y="222" width="96" height="30" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1"/>
<text x="242" y="242" font-size="12" fill="#1d1d1f" text-anchor="middle">흰 카드</text>
<line x1="394" y1="134" x2="394" y2="172" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="324" y="176" width="140" height="100" rx="10" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2"/>
<text x="394" y="198" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">설정 CSS</text>
<rect x="336" y="210" width="116" height="54" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1.2"/>
<rect x="346" y="222" width="96" height="30" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1"/>
<text x="394" y="242" font-size="12" fill="#1d1d1f" text-anchor="middle">흰 카드</text>
<line x1="546" y1="134" x2="546" y2="172" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="476" y="176" width="140" height="100" rx="10" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2"/>
<text x="546" y="198" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">단축어 CSS</text>
<rect x="488" y="210" width="116" height="54" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1.2"/>
<rect x="498" y="222" width="96" height="30" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1"/>
<text x="546" y="242" font-size="12" fill="#1d1d1f" text-anchor="middle">흰 카드</text>
<text x="20" y="298" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">바탕: background-color: var(--phone-page-bg)   카드: var(--phone-card-bg)</text>
<text x="20" y="318" font-size="12" fill="#6e6e73" text-anchor="start">다크 모드 전환이나 색 변경은 셸의 선언 한 곳만 수정한다</text>
</svg>
