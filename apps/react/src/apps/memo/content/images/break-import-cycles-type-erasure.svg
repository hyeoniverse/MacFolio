<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>import type은 컴파일하면 사라지지만 madge는 소스를 읽는다</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker>
</defs>
<rect width="640" height="350" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">같은 import 한 줄, 두 개의 그래프</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">MailMobile.tsx (PR #188 이전)</text>

<rect x="24" y="66" width="592" height="40" rx="8" fill="#f2f2f7"/>
<text x="40" y="91" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">import type { ListMail, Mailbox } from '../Mail';</text>

<rect x="24" y="124" width="284" height="206" rx="10" fill="#ffffff" stroke="#6e6e73"/>
<text x="40" y="148" font-size="13" font-weight="700" fill="#1d1d1f">madge가 읽는 소스 (.tsx)</text>
<text x="40" y="166" font-size="12" fill="#6e6e73">import 문을 모두 간선으로 만든다</text>
<rect x="56" y="186" width="100" height="34" rx="6" fill="#f2f2f7" stroke="#ff3b30" stroke-width="1.5"/>
<text x="106" y="208" font-size="12" fill="#1d1d1f" text-anchor="middle">Mail.tsx</text>
<rect x="56" y="270" width="100" height="34" rx="6" fill="#f2f2f7" stroke="#ff3b30" stroke-width="1.5"/>
<text x="106" y="292" font-size="12" fill="#1d1d1f" text-anchor="middle">MailMobile.tsx</text>
<path d="M90 222 L90 266" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<path d="M122 268 L122 224" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<text x="172" y="236" font-size="12" fill="#1d1d1f">↓ 컴포넌트 import</text>
<text x="172" y="256" font-size="12" fill="#1d1d1f">↑ 타입 import</text>
<text x="172" y="290" font-size="13" font-weight="700" fill="#ff3b30">순환 1개</text>

<rect x="332" y="124" width="284" height="206" rx="10" fill="#ffffff" stroke="#6e6e73"/>
<text x="348" y="148" font-size="13" font-weight="700" fill="#1d1d1f">컴파일한 JS (브라우저가 실행)</text>
<text x="348" y="166" font-size="12" fill="#6e6e73">import type 줄은 통째로 삭제된다</text>
<rect x="364" y="186" width="100" height="34" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="414" y="208" font-size="12" fill="#1d1d1f" text-anchor="middle">Mail.js</text>
<rect x="364" y="270" width="100" height="34" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="414" y="292" font-size="12" fill="#1d1d1f" text-anchor="middle">MailMobile.js</text>
<path d="M414 222 L414 266" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)" fill="none"/>
<text x="430" y="248" font-size="12" fill="#1d1d1f">↓ 컴포넌트 import만 남음</text>
<text x="480" y="290" font-size="13" font-weight="700" fill="#34c759">순환 0개</text>
</svg>
