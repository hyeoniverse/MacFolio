<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="820" height="300" fill="#fff"/>
<text x="410.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">관리자 답장의 순서: 메일이 먼저, 저장이 나중</text>
<rect x="20" y="80" width="180" height="64" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="110.0" y="108.5" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="600">parseReply</text>
<text x="110.0" y="123.5" font-size="10" fill="#4b5563" text-anchor="middle">빈 값 · 길이 · 제어 문자</text>
<rect x="220" y="80" width="180" height="64" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="310.0" y="108.5" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">메일 찾기</text>
<text x="310.0" y="123.5" font-size="10" fill="#4b5563" text-anchor="middle">없으면 404</text>
<line x1="202" y1="112" x2="218" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="420" y="80" width="180" height="64" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="510.0" y="108.5" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">Resend로 보내기</text>
<text x="510.0" y="123.5" font-size="10" fill="#4b5563" text-anchor="middle">to: 방문자, Reply-To: 주인</text>
<line x1="402" y1="112" x2="418" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="620" y="80" width="180" height="64" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="710.0" y="108.5" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">ContactReply 저장</text>
<text x="710.0" y="123.5" font-size="10" fill="#4b5563" text-anchor="middle">그 메일 아래에</text>
<line x1="602" y1="112" x2="618" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="420" y="190" width="180" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="510.0" y="211.5" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">502</text>
<text x="510.0" y="226.5" font-size="10" fill="#4b5563" text-anchor="middle">보내지 못하면 저장하지 않는다</text>
<line x1="510" y1="144" x2="510" y2="188" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="410" y="275" font-size="11" fill="#6b7280" text-anchor="middle">저장만 되고 메일이 가지 않으면, 방문자는 사이트를 다시 열기 전까지 답장을 모른다</text>
</svg>
