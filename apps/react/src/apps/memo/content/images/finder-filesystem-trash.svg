<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 296" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>휴지통으로 보낼 때는 묻지 않고 원래 자리를 적어 두며, 영구 삭제할 때만 확인을 받고 서버에서도 지운다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="852" height="296" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">Finder 휴지통의 세 자리</text>
<text x="32" y="56" font-size="11" fill="#6b7280">관리자가 만든 폴더와 올린 파일</text>
<rect x="32" y="100" width="190" height="70" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="127.0" y="122" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">제자리</text><text x="127.0" y="142" font-size="10.5" fill="#374151" text-anchor="middle">만든 폴더 · 올린 파일</text><rect x="316" y="100" width="220" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="426.0" y="122" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">휴지통</text><text x="426.0" y="142" font-size="10.5" fill="#374151" text-anchor="middle">구조 trash: 항목 → 원래 폴더</text><text x="426.0" y="158" font-size="10.5" fill="#374151" text-anchor="middle">R2 파일은 그대로</text><rect x="630" y="100" width="190" height="70" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="725.0" y="122" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">영구 삭제</text><text x="725.0" y="142" font-size="10.5" fill="#374151" text-anchor="middle">확인을 받는다</text><text x="725.0" y="158" font-size="10.5" fill="#374151" text-anchor="middle">R2·문서 표에서도 지운다</text><line x1="224" y1="120" x2="314" y2="120" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="269" y="92" font-size="10" fill="#6b7280" text-anchor="middle">휴지통으로</text><text x="269" y="106" font-size="10" fill="#6b7280" text-anchor="middle">(묻지 않음)</text><path d="M316 155 C 290 190, 250 190, 224 155" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="270" y="204" font-size="10" fill="#6b7280" text-anchor="middle">되돌려 놓기</text><line x1="538" y1="135" x2="628" y2="135" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="583" y="106" font-size="10" fill="#6b7280" text-anchor="middle">즉시 삭제</text><text x="583" y="120" font-size="10" fill="#6b7280" text-anchor="middle">· 비우기</text><text x="32" y="236" font-size="10.5" fill="#374151">· 되돌려 놓을 원래 폴더가 없어졌으면 올린 폴더로 간다</text><text x="32" y="254" font-size="10.5" fill="#374151">· Finder 창은 HTML 끌어 놓기로, 바탕화면 아이콘은 놓은 자리의 data-dock-trash로 Dock 휴지통에 넣는다</text><text x="32" y="272" font-size="10.5" fill="#374151">· 버린 항목이 있으면 Dock의 휴지통에 종이가 담긴다</text>
</svg>
