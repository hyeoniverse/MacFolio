<text x="87.5" y="191.3" text-anchor="middle" font-size="12" fill="#1d1d1f">DROP</text>
<rect x="25" y="208" width="125" height="30" fill="#f2f2f7"/>
<text x="87.5" y="227.3" text-anchor="middle" font-size="12" fill="#1d1d1f">TRUNCATE</text>
<rect x="170" y="20" width="145" height="70" fill="#e8f7ec" stroke="#30d158" stroke-width="1.5"/>
<text x="242.5" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">DML</text>
