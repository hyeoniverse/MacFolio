<text x="397.5" y="155.3" text-anchor="middle" font-size="12" fill="#1d1d1f">REVOKE</text>
<rect x="480" y="20" width="145" height="70" fill="#ffe9e7" stroke="#ff453a" stroke-width="1.5"/>
<text x="552.5" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">TCL</text>
