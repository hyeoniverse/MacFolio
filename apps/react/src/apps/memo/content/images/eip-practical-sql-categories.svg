<text x="397.5" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">DCL</text>
<text x="397.5" y="66" text-anchor="middle" font-size="12" fill="#1d1d1f">데이터 제어어</text>
<text x="397.5" y="82" text-anchor="middle" font-size="11" fill="#6e6e73">권한을 준다</text>
