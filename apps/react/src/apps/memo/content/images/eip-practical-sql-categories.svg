<rect x="15" y="20" width="145" height="70" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="87.5" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">DDL</text>
<text x="87.5" y="66" text-anchor="middle" font-size="12" fill="#1d1d1f">데이터 정의어</text>
<text x="87.5" y="82" text-anchor="middle" font-size="11" fill="#6e6e73">구조를 만든다</text>
<rect x="25" y="100" width="125" height="30" fill="#f2f2f7"/>
<text x="87.5" y="119.3" text-anchor="middle" font-size="12" fill="#1d1d1f">CREATE</text>
