<text x="552.5" y="191.3" text-anchor="middle" font-size="12" fill="#1d1d1f">SAVEPOINT</text>
<text x="320" y="264" text-anchor="middle" font-size="12" fill="#6e6e73">TCL을 DCL에 포함해 세 분류(DDL·DML·DCL)로 설명하기도 한다</text>
