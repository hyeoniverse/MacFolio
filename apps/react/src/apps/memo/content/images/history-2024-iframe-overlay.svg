<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>iframe 안의 클릭이 바깥 창에 전달되지 않는 이유와 투명 덮개</title>
<rect width="640" height="380" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">뒤에 있는 블로그 창 안을 눌렀을 때</text>
<text x="24" y="66" font-size="14" font-weight="700" fill="#ff3b30">덮개 없음</text>
<rect x="24" y="78" width="280" height="200" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="40" y="100" font-size="12" fill="#6e6e73">MacFolio 문서: Container (onClick)</text>
<rect x="44" y="114" width="240" height="144" rx="6" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="56" y="136" font-size="12" fill="#ff9f0a">iframe: codingkirby.github.io 문서</text>
<circle cx="164" cy="196" r="9" fill="#ff3b30"/>
<text x="164" y="230" font-size="12" text-anchor="middle" fill="#1d1d1f">클릭 이벤트는 iframe 문서 안에서 끝난다</text>
<path d="M164 186 C164 150 210 140 230 104" stroke="#ff3b30" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/>
<text x="234" y="96" font-size="13" fill="#ff3b30">✕</text>
<text x="24" y="304" font-size="12.5" fill="#1d1d1f">바깥 창의 onClick이 실행되지 않아</text>
<text x="24" y="322" font-size="12.5" fill="#1d1d1f">블로그 창이 앞으로 오지 않는다.</text>
<text x="336" y="66" font-size="14" font-weight="700" fill="#34c759">맨 앞이 아닐 때만 덮개</text>
<rect x="336" y="78" width="280" height="200" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="352" y="100" font-size="12" fill="#6e6e73">MacFolio 문서: Container (onClick)</text>
<rect x="356" y="114" width="240" height="144" rx="6" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="368" y="136" font-size="12" fill="#ff9f0a">iframe</text>
<rect x="356" y="114" width="240" height="144" rx="6" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff" stroke-dasharray="5 3"/>
<text x="476" y="160" font-size="12" text-anchor="middle" fill="#0a84ff">투명 div (inset 0, zIndex 1)</text>
<circle cx="476" cy="196" r="9" fill="#34c759"/>
<text x="476" y="230" font-size="12" text-anchor="middle" fill="#1d1d1f">바깥 문서의 div가 클릭을 받는다</text>
<text x="352" y="304" font-size="12.5" fill="#1d1d1f">bringAppToFront('blog')가 실행되고,</text>
<text x="352" y="322" font-size="12.5" fill="#1d1d1f">맨 앞이 되면 덮개가 사라져 블로그를 조작한다.</text>
<text x="24" y="360" font-size="12" fill="#6e6e73">iframe은 별도 문서라 그 안의 이벤트는 바깥 문서의 DOM 트리로 버블링되지 않는다.</text>
</svg>
