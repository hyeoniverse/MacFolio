<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="470" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">재귀 리졸버를 쓸 때와 반복 리졸버를 쓸 때</text>
  <!-- 위: 재귀 -->
  <text x="16" y="56" font-size="13" font-weight="600" fill="#0a84ff">재귀 리졸버 사용: dig www.example.com (RD=1)</text>
  <rect x="16" y="72" width="226" height="88" rx="10" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="129" y="152" text-anchor="middle" font-size="11.5" fill="#6e6e73">로컬 컴퓨터</text>
  <g font-size="12.5" text-anchor="middle" fill="#1d1d1f">
    <rect x="28" y="92" width="80" height="36" rx="6" fill="#fff" stroke="#1d1d1f"/><text x="68" y="115">브라우저</text>
    <rect x="132" y="92" width="96" height="36" rx="6" fill="#fff" stroke="#1d1d1f"/><text x="180" y="115">스텁 리졸버</text>
  </g>
  <line x1="108" y1="110" x2="130" y2="110" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="300" y="84" width="120" height="64" rx="8" fill="#1d1d1f"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">재귀 리졸버</text>
  <text x="360" y="130" text-anchor="middle" font-size="11" fill="#d1d1d6">(ISP·공개 DNS)</text>
  <line x1="228" y1="104" x2="298" y2="104" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="298" y1="124" x2="230" y2="124" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="264" y="98" text-anchor="middle" font-size="11" fill="#1d1d1f">질의</text>
  <text x="264" y="140" text-anchor="middle" font-size="11" fill="#1d1d1f">최종 답</text>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="490" y="56" width="134" height="32" rx="6" fill="#fff" stroke="#0a84ff"/><text x="557" y="77">루트 서버</text>
    <rect x="490" y="100" width="134" height="32" rx="6" fill="#fff" stroke="#0a84ff"/><text x="557" y="121">com TLD 서버</text>
    <rect x="490" y="144" width="134" height="32" rx="6" fill="#fff" stroke="#0a84ff"/><text x="557" y="165">example.com 서버</text>
  </g>
  <g stroke="#0a84ff" stroke-width="1.4" marker-end="url(#b)">
    <line x1="420" y1="96" x2="488" y2="72"/>
    <line x1="420" y1="116" x2="488" y2="116"/>
    <line x1="420" y1="136" x2="488" y2="160"/>
  </g>
  <text x="454" y="196" text-anchor="middle" font-size="11" fill="#0a84ff">반복 질의(위임 응답을 따라감)</text>
  <line x1="16" y1="222" x2="624" y2="222" stroke="#d1d1d6"/>
  <!-- 아래: 반복 -->
  <text x="16" y="256" font-size="13" font-weight="600" fill="#0a84ff">반복 리졸버: dig +trace 또는 +norecurse</text>
  <rect x="16" y="300" width="226" height="88" rx="10" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="129" y="380" text-anchor="middle" font-size="11.5" fill="#6e6e73">로컬 컴퓨터</text>
  <g font-size="12.5" text-anchor="middle" fill="#1d1d1f">
    <rect x="28" y="320" width="80" height="36" rx="6" fill="#fff" stroke="#1d1d1f"/><text x="68" y="343">브라우저</text>
    <rect x="132" y="320" width="96" height="36" rx="6" fill="#0a84ff"/><text x="180" y="343" fill="#fff" font-weight="600">리졸버</text>
  </g>
  <line x1="108" y1="338" x2="130" y2="338" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="490" y="272" width="134" height="32" rx="6" fill="#fff" stroke="#0a84ff"/><text x="557" y="293">루트 서버</text>
    <rect x="490" y="322" width="134" height="32" rx="6" fill="#fff" stroke="#0a84ff"/><text x="557" y="343">com TLD 서버</text>
    <rect x="490" y="372" width="134" height="32" rx="6" fill="#fff" stroke="#0a84ff"/><text x="557" y="393">example.com 서버</text>
  </g>
  <g stroke="#0a84ff" stroke-width="1.4" marker-end="url(#b)">
    <line x1="228" y1="326" x2="488" y2="288"/>
    <line x1="228" y1="338" x2="488" y2="338"/>
    <line x1="228" y1="350" x2="488" y2="388"/>
  </g>
  <text x="360" y="428" text-anchor="middle" font-size="11" fill="#0a84ff">로컬 리졸버가 직접 각 단계에 반복 질의</text>
  <text x="320" y="458" text-anchor="middle" font-size="12" fill="#6e6e73">위는 탐색을 서버가, 아래는 클라이언트가 한다</text>
</svg>
