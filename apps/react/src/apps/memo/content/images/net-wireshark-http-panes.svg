<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Wireshark 화면 구성</text>
  <rect x="20" y="44" width="600" height="30" rx="5" fill="#e8f2ff" stroke="#0a84ff"/>
  <text x="32" y="63" font-size="12" fill="#0a84ff" font-family="monospace">표시 필터:  http.host</text>
  <text x="600" y="63" text-anchor="end" font-size="11" fill="#6e6e73">적용</text>
  <rect x="20" y="82" width="600" height="110" rx="5" fill="#f9f9fb" stroke="#1d1d1f"/>
  <text x="28" y="100" font-size="11" font-weight="600" fill="#1d1d1f">① 패킷 목록</text>
  <g font-size="10.5" fill="#1d1d1f" font-family="monospace">
    <text x="30" y="120">No.  Time     Source          Destination     Protocol  Info</text>
    <line x1="28" y1="126" x2="612" y2="126" stroke="#e5e5ea"/>
    <text x="30" y="142">12   0.059    198.51.100.10   203.0.113.50    HTTP      GET / HTTP/1.1</text>
    <rect x="28" y="146" width="584" height="15" fill="#0a84ff" fill-opacity="0.15"/>
    <text x="30" y="158">34   0.183    198.51.100.10   203.0.113.60    HTTP      GET /logo.png</text>
    <text x="30" y="174">51   0.470    203.0.113.50    198.51.100.10   HTTP      200 OK</text>
  </g>
  <rect x="20" y="200" width="600" height="120" rx="5" fill="#f9f9fb" stroke="#1d1d1f"/>
  <text x="28" y="218" font-size="11" font-weight="600" fill="#1d1d1f">② 선택한 패킷의 계층별 상세</text>
  <g font-size="11" fill="#1d1d1f">
    <text x="36" y="238">▸ Frame 34: 420 bytes</text>
    <text x="36" y="256">▸ Ethernet II  (출발지·목적지 MAC)</text>
    <text x="36" y="274">▸ Internet Protocol Version 4  (출발지·목적지 IP, TTL)</text>
    <text x="36" y="292">▾ Transmission Control Protocol  (포트, Seq, Ack, 플래그)</text>
    <text x="52" y="310" fill="#0a84ff">▾ Hypertext Transfer Protocol  →  Host: img.example.net</text>
  </g>
  <rect x="20" y="328" width="600" height="56" rx="5" fill="#f9f9fb" stroke="#1d1d1f"/>
  <text x="28" y="346" font-size="11" font-weight="600" fill="#1d1d1f">③ 원본 바이트 (16진수 · ASCII)</text>
  <text x="30" y="368" font-size="10.5" fill="#6e6e73" font-family="monospace">0000  47 45 54 20 2f 6c 6f 67 6f 2e 70 6e 67   GET /logo.png</text>
</svg>
