<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>ls -l 권한 문자열을 8진수 755로 바꾸는 과정</title>
<rect width="640" height="320" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">drwxr-xr-x 를 755로 읽는 법</text>
<g font-family="Menlo, monospace" font-size="22" text-anchor="middle">
<rect x="60" y="56" width="40" height="44" fill="#f2f2f7" stroke="#1d1d1f"/><text x="80" y="86" fill="#1d1d1f">d</text>
<rect x="120" y="56" width="132" height="44" fill="#0a84ff"/><text x="142" y="86" fill="#fff">r</text><text x="186" y="86" fill="#fff">w</text><text x="230" y="86" fill="#fff">x</text>
<rect x="262" y="56" width="132" height="44" fill="#ff9f0a"/><text x="284" y="86" fill="#fff">r</text><text x="328" y="86" fill="#fff">-</text><text x="372" y="86" fill="#fff">x</text>
<rect x="404" y="56" width="132" height="44" fill="#34c759"/><text x="426" y="86" fill="#fff">r</text><text x="470" y="86" fill="#fff">-</text><text x="514" y="86" fill="#fff">x</text>
</g>
<g font-size="12" fill="#1d1d1f" text-anchor="middle">
<text x="80" y="122">파일 종류</text><text x="80" y="138" fill="#6e6e73">d = 디렉터리</text>
<text x="186" y="122">소유자(user)</text><text x="328" y="122">그룹(group)</text><text x="470" y="122">기타(others)</text>
</g>
<g font-family="Menlo, monospace" font-size="15" text-anchor="middle" fill="#1d1d1f">
<text x="142" y="172">1</text><text x="186" y="172">1</text><text x="230" y="172">1</text>
<text x="284" y="172">1</text><text x="328" y="172">0</text><text x="372" y="172">1</text>
<text x="426" y="172">1</text><text x="470" y="172">0</text><text x="514" y="172">1</text>
</g>
<g font-size="12" fill="#6e6e73" text-anchor="middle">
<text x="142" y="198">4</text><text x="186" y="198">2</text><text x="230" y="198">1</text>
<text x="284" y="198">4</text><text x="328" y="198">2</text><text x="372" y="198">1</text>
<text x="426" y="198">4</text><text x="470" y="198">2</text><text x="514" y="198">1</text>
</g>
<text x="30" y="172" font-size="12" fill="#6e6e73">2진수</text><text x="30" y="198" font-size="12" fill="#6e6e73">자릿값</text>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<text x="186" y="234">4 + 2 + 1</text><text x="328" y="234">4 + 0 + 1</text><text x="470" y="234">4 + 0 + 1</text>
</g>
<g font-family="Menlo, monospace" font-size="30" font-weight="600" text-anchor="middle">
<text x="186" y="276" fill="#0a84ff">7</text><text x="328" y="276" fill="#ff9f0a">5</text><text x="470" y="276" fill="#34c759">5</text>
</g>
<text x="320" y="308" text-anchor="middle" font-size="12" fill="#6e6e73">r = 읽기(4), w = 쓰기(2), x = 실행(1). 세 자리를 각각 더하면 chmod에 쓰는 8진수가 된다</text>
</svg>
