<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>api()가 응답을 어떻게 나누는지</title>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
</defs>
<rect width="640" height="250" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="700" fill="#1f2937">api('/posts', { method: 'PUT', json }) 한 번에 일어나는 일</text>
<rect x="32" y="70" width="120" height="44" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="92" y="90" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">apiFetch</text>
<text x="92" y="105" font-size="10" fill="#6b7280" text-anchor="middle">주소·쿠키·JSON·15초</text>
<path d="M152 92 H190" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="192" y="70" width="110" height="44" rx="10" fill="#f3f4f6"/>
<text x="247" y="97" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">응답</text>
<!-- branches -->
<path d="M302 80 L352 60" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<path d="M302 92 H352" stroke="#ef4444" stroke-width="2" marker-end="url(#red)"/>
<path d="M302 104 L352 130" stroke="#ef4444" stroke-width="2" marker-end="url(#red)"/>
<path d="M92 114 V170 H352" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#red)"/>
<text x="110" y="150" font-size="10.5" fill="#6b7280">서버에 닿지 못함</text>
<g font-size="11.5" fill="#1f2937">
<rect x="356" y="42" width="252" height="34" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="366" y="56" font-weight="600">2xx</text><text x="366" y="70" font-size="10.5" fill="#374151">몸통을 JSON으로, 비어 있으면 null</text>
<rect x="356" y="80" width="252" height="34" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="366" y="94" font-weight="600">401 · 429</text><text x="366" y="108" font-size="10.5" fill="#374151">정해진 문구 + 관리자 상태를 로그아웃으로</text>
<rect x="356" y="118" width="252" height="34" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="366" y="132" font-weight="600">4xx · 5xx</text><text x="366" y="146" font-size="10.5" fill="#374151">서버의 message(배열이면 줄마다) → ApiError.reasons</text>
<rect x="356" y="156" width="252" height="34" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="366" y="170" font-weight="600">status 0</text><text x="366" y="184" font-size="10.5" fill="#374151">"서버에 연결할 수 없습니다. 잠시 뒤 다시 시도해 주세요."</text>
</g>
<text x="320" y="226" font-size="11" fill="#374151" text-anchor="middle">부르는 쪽은 try/catch 한 번이면 된다: 성공이면 값, 실패면 보여 줄 문구가 든 ApiError</text>
</svg>
