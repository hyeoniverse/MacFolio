<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>첫 화면 CSS 요청 모드</title>
<rect width="760" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="700" fill="#1f2937">첫 화면 CSS를 받는 순서</text>
<text x="32" y="62" font-size="12" fill="#6b7280">브라우저는 preload 응답을 요청 모드(credentials mode)가 같은 요청에만 연결한다</text>
<text x="32" y="96" font-size="13" font-weight="700" fill="#b91c1c">고치기 전</text>
<rect x="32" y="106" width="210" height="76" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="46" y="128" font-size="12.5" font-weight="600" fill="#1f2937">① index.html</text>
<text x="46" y="149" font-size="11" fill="#374151" font-family="ui-monospace, Menlo, monospace">link rel=preload as=style</text>
<text x="46" y="170" font-size="11.5" fill="#6b7280">모드: no-cors</text>
<path d="M248 144 H276" stroke="#9ca3af" stroke-width="1.5"/><path d="M276 144 l-6 -4 v8 z" fill="#9ca3af"/>
<rect x="282" y="106" width="210" height="76" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="296" y="128" font-size="12.5" font-weight="600" fill="#1f2937">② boot 묶음 실행</text>
<text x="296" y="149" font-size="11" fill="#374151" font-family="ui-monospace, Menlo, monospace">link rel=stylesheet crossorigin</text>
<text x="296" y="170" font-size="11.5" fill="#6b7280">모드: cors</text>
<path d="M498 144 H526" stroke="#9ca3af" stroke-width="1.5"/><path d="M526 144 l-6 -4 v8 z" fill="#9ca3af"/>
<rect x="532" y="112" width="196" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
<text x="546" y="136" font-size="12.5" font-weight="600" fill="#b91c1c">③ 모드가 달라 재사용 안 함</text>
<text x="546" y="158" font-size="11.5" fill="#b91c1c">같은 CSS 재요청, 콘솔 경고</text>
<text x="32" y="216" font-size="13" font-weight="700" fill="#047857">고친 뒤</text>
<rect x="32" y="226" width="210" height="76" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="46" y="248" font-size="12.5" font-weight="600" fill="#1f2937">① index.html</text>
<text x="46" y="269" font-size="11" fill="#374151" font-family="ui-monospace, Menlo, monospace">preload as=style crossorigin</text>
<text x="46" y="290" font-size="11.5" fill="#6b7280">모드: cors</text>
<path d="M248 264 H276" stroke="#9ca3af" stroke-width="1.5"/><path d="M276 264 l-6 -4 v8 z" fill="#9ca3af"/>
<rect x="282" y="226" width="210" height="76" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="296" y="248" font-size="12.5" font-weight="600" fill="#1f2937">② boot 묶음 실행</text>
<text x="296" y="269" font-size="11" fill="#374151" font-family="ui-monospace, Menlo, monospace">link rel=stylesheet crossorigin</text>
<text x="296" y="290" font-size="11.5" fill="#6b7280">모드: cors</text>
<path d="M498 264 H526" stroke="#9ca3af" stroke-width="1.5"/><path d="M526 264 l-6 -4 v8 z" fill="#9ca3af"/>
<rect x="532" y="232" width="196" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="546" y="256" font-size="12.5" font-weight="600" fill="#047857">③ preload 응답 사용</text>
<text x="546" y="278" font-size="11.5" fill="#047857">CSS 요청 1회, 경고 없음</text>
</svg>
