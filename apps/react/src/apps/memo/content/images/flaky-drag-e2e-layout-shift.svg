<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="760" height="330" fill="#fff"/>
<text x="380.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">자리를 잰 뒤 이미지가 불러와지면 목표가 밀린다</text>
<text x="190" y="60" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">① 자리를 잴 때</text>
<rect x="80" y="75" width="220" height="200" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="95" y="90" width="190" height="30" rx="6" fill="#e5e7eb" stroke="#d1d5db"/>
<text x="190" y="110" font-size="10" fill="#6b7280" text-anchor="middle">이미지 (아직 높이 0)</text>
<rect x="95" y="135" width="190" height="24" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="190" y="152" font-size="10" fill="#4f46e5" text-anchor="middle" font-weight="600">h2 소제목  y=472</text>
<text x="190" y="295" font-size="10" fill="#9ca3af" text-anchor="middle">창 아래 끝 y=700</text>
<text x="560" y="60" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">② 끄는 동안</text>
<rect x="450" y="75" width="220" height="200" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="465" y="90" width="190" height="150" rx="6" fill="#e5e7eb" stroke="#d1d5db"/>
<text x="560" y="170" font-size="10" fill="#6b7280" text-anchor="middle">이미지가 불러와져 높이가 생김</text>
<rect x="465" y="262" width="190" height="24" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
<text x="560" y="279" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="600">h2  y≈706 (창 밖)</text>
<line x1="305" y1="175" x2="445" y2="175" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="335" y="168" font-size="10" fill="#6b7280">레이아웃이 바뀜</text>
<text x="380" y="318" font-size="10.5" fill="#6b7280" text-anchor="middle">마우스가 창 밖(편집기 밖)으로 나가 dragleave → 선이 숨는다. 그래서 불러오기를 기다린 뒤 scrollIntoView로 올리고 잰다</text>
</svg>
