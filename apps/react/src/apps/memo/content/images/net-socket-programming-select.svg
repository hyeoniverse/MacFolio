<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="420" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">select()로 두 클라이언트를 한 스레드에서 처리하는 Coordinator</text>
  <g font-size="12.5">
    <rect x="20" y="60" width="150" height="70" rx="8" fill="#e5e5ea"/>
    <text x="95" y="84" text-anchor="middle" font-weight="600" fill="#1d1d1f">Commander</text>
    <text x="95" y="104" text-anchor="middle" font-size="11.5" fill="#1d1d1f">표준 입력의 명령 한 줄</text>
    <text x="95" y="120" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#6e6e73">QUERY, CONFIGURE …</text>
    <rect x="20" y="250" width="150" height="70" rx="8" fill="#e5e5ea"/>
    <text x="95" y="274" text-anchor="middle" font-weight="600" fill="#1d1d1f">Monitor</text>
    <text x="95" y="294" text-anchor="middle" font-size="11.5" fill="#1d1d1f">1초마다 반복</text>
    <text x="95" y="310" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#6e6e73">POLLING</text>
  </g>
  <rect x="215" y="50" width="250" height="350" rx="10" fill="#f5f5f7" stroke="#c7c7cc"/>
  <text x="340" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">Coordinator (포트 8080)</text>
  <g font-size="11.5" font-family="Menlo, monospace" fill="#1d1d1f">
    <rect x="232" y="84" width="216" height="40" rx="6" fill="#fff" stroke="#1d1d1f"/>
    <text x="340" y="101" text-anchor="middle">allset = {listenfd}</text>
    <text x="340" y="116" text-anchor="middle">연결마다 FD_SET으로 추가</text>
    <rect x="232" y="138" width="216" height="40" rx="6" fill="#e8f2ff" stroke="#0a84ff"/>
    <text x="340" y="155" text-anchor="middle">rset = allset</text>
    <text x="340" y="170" text-anchor="middle">select() 대기</text>
    <rect x="232" y="196" width="216" height="40" rx="6" fill="#fff" stroke="#1d1d1f"/>
    <text x="340" y="213" text-anchor="middle">FD_ISSET(listenfd)?</text>
    <text x="340" y="228" text-anchor="middle">→ accept(), FD_SET</text>
    <rect x="232" y="250" width="216" height="58" rx="6" fill="#fff" stroke="#1d1d1f"/>
    <text x="340" y="268" text-anchor="middle">FD_ISSET(client)?</text>
    <text x="340" y="283" text-anchor="middle">→ recv(), 개행까지 잘라</text>
    <text x="340" y="298" text-anchor="middle">handle() → send()</text>
    <rect x="232" y="322" width="216" height="40" rx="6" fill="#fff" stroke="#1d1d1f"/>
    <text x="340" y="339" text-anchor="middle">recv() == 0?</text>
    <text x="340" y="354" text-anchor="middle">→ close(), FD_CLR</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.3" marker-end="url(#a)">
    <line x1="340" y1="124" x2="340" y2="136"/><line x1="340" y1="178" x2="340" y2="194"/><line x1="340" y1="236" x2="340" y2="248"/><line x1="340" y1="308" x2="340" y2="320"/>
  </g>
  <path d="M232 342 H222 V158 H230" fill="none" stroke="#6e6e73" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="340" y="385" text-anchor="middle" font-size="11.5" fill="#6e6e73">처리가 끝나면 다시 select()로 돌아간다</text>
  <g stroke="#0a84ff" stroke-width="1.6" marker-end="url(#b)">
    <line x1="170" y1="88" x2="230" y2="150"/><line x1="170" y1="285" x2="230" y2="170"/>
  </g>
  <rect x="490" y="150" width="130" height="96" rx="8" fill="#fff4e0" stroke="#ff9f0a"/>
  <text x="555" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">보일러 상태</text>
  <g font-size="11.5" font-family="Menlo, monospace" fill="#1d1d1f">
    <text x="505" y="196">temp  = 25</text><text x="505" y="214">upper = 30</text><text x="505" y="232">lower = -5</text>
  </g>
  <line x1="448" y1="279" x2="488" y2="230" stroke="#ff9f0a" stroke-width="1.4"/>
  <text x="555" y="272" text-anchor="middle" font-size="11.5" fill="#6e6e73">POLLING마다</text>
  <text x="555" y="288" text-anchor="middle" font-size="11.5" fill="#6e6e73">temp += -1, 0, +1</text>
  <text x="555" y="312" text-anchor="middle" font-size="11.5" fill="#6e6e73">범위 안: safe</text>
  <text x="555" y="328" text-anchor="middle" font-size="11.5" fill="#6e6e73">범위 밖: warning</text>
</svg>
