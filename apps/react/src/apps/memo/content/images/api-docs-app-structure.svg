<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>API 코드에서 뽑은 openapi.json을 시험이 스냅숏으로 지키고, 따로 된 페이지 api-docs.html이 Scalar로 그린다. API 문서 앱은 그 페이지를 iframe으로 띄운다</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="860" height="320" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">문서는 서버가 아니라 사이트가 그린다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">서버가 꺼져도 문서는 보인다</text>
<rect x="32" y="86" width="220" height="76" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="44" y="105" font-size="12" fill="#1f2937" font-weight="600">apps/api</text>
<text x="44" y="122" font-size="10.5" fill="#374151">createOpenApiDocument(app)</text>
<text x="44" y="137.0" font-size="10.5" fill="#374151">DB 없이 앱 모듈만 만들고 닫음</text>
<rect x="300" y="86" width="240" height="76" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="312" y="105" font-size="12" fill="#b45309" font-weight="600">openapi.test.ts</text>
<text x="312" y="122" font-size="10.5" fill="#374151">toMatchFileSnapshot</text>
<text x="312" y="137.0" font-size="10.5" fill="#374151">어긋나면 CI 실패</text>
<text x="312" y="152.0" font-size="10.5" fill="#374151">pnpm --filter @macfolio/api openapi</text>
<rect x="588" y="86" width="240" height="76" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="600" y="105" font-size="12" fill="#4f46e5" font-weight="600">apidocs/openapi.json</text>
<text x="600" y="122" font-size="10.5" fill="#374151">사이트 저장소에 들어 있는 문서</text>
<path d="M252 124 H296" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
<path d="M540 124 H584" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#a-amber)"/>
<rect x="588" y="196" width="240" height="100" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="600" y="215" font-size="12" fill="#4f46e5" font-weight="600">api-docs.html (두 번째 시작점)</text>
<text x="600" y="232" font-size="10.5" fill="#374151">Scalar(Vue 포함)를 여기서만</text>
<text x="600" y="247.0" font-size="10.5" fill="#374151">pushState → replaceState</text>
<text x="600" y="262.0" font-size="10.5" fill="#374151">data-theme 따라 다크 모드</text>
<text x="600" y="277.0" font-size="10.5" fill="#374151">credentials: include</text>
<path d="M708 162 V192" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<rect x="300" y="196" width="240" height="100" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="312" y="215" font-size="12" fill="#4f46e5" font-weight="600">'API 문서' 앱</text>
<text x="312" y="232" font-size="10.5" fill="#374151">WebFrame (프로젝트 앱과 같이)</text>
<text x="312" y="247.0" font-size="10.5" fill="#374151">iframe 안의 # 만 바뀐다</text>
<text x="312" y="262.0" font-size="10.5" fill="#374151">사이트 주소·CSS는 그대로</text>
<path d="M584 246 H544" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<text x="564" y="238" font-size="10" fill="#4f46e5" font-weight="600" text-anchor="middle">iframe</text>
<rect x="32" y="196" width="220" height="100" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="44" y="215" font-size="12" fill="#b91c1c" font-weight="600">버린 길</text>
<text x="44" y="232" font-size="10.5" fill="#374151">서버 /docs를 iframe으로</text>
<text x="44" y="247.0" font-size="10.5" fill="#374151">× 서버가 꺼지면 빈 창</text>
<text x="44" y="262.0" font-size="10.5" fill="#374151">× 보안 헤더에 예외</text>
<text x="44" y="277.0" font-size="10.5" fill="#374151">× Swagger 모양</text>
</svg>
