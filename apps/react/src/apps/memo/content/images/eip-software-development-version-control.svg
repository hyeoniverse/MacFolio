<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>버전 관리 도구의 체크아웃·커밋·충돌</title><rect width="640" height="410" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">버전 관리 도구의 기본 동작</text><rect x="230" y="60" width="180" height="70" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="2"/><text x="320.0" y="99.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="320" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">저장소 (Repository)</text><text x="320" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">모든 버전과 변경 이력</text><rect x="30" y="220" width="190" height="70" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="125.0" y="259.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="125" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">개발자 A의 작업 공간</text><text x="125" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">Login.java 수정</text><rect x="420" y="220" width="190" height="70" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="515.0" y="259.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="515" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">개발자 B의 작업 공간</text><text x="515" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">Login.java 수정</text><line x1="250" y1="132" x2="150" y2="216" stroke="#0a84ff" stroke-width="2" marker-end="url(#a)"/><text x="170" y="166" text-anchor="end" font-size="12" font-weight="600" fill="#0a84ff">① 체크아웃</text><line x1="180" y1="216" x2="272" y2="134" stroke="#30d158" stroke-width="2" marker-end="url(#a)"/><text x="240" y="196" text-anchor="start" font-size="12" font-weight="600" fill="#30d158">② 커밋(체크인)</text><line x1="392" y1="132" x2="490" y2="216" stroke="#0a84ff" stroke-width="2" marker-end="url(#a)"/><text x="470" y="166" text-anchor="start" font-size="12" font-weight="600" fill="#0a84ff">① 체크아웃</text><line x1="460" y1="216" x2="368" y2="134" stroke="#ff453a" stroke-width="2" marker-end="url(#a)"/><text x="400" y="196" text-anchor="end" font-size="12" font-weight="600" fill="#ff453a">③ 커밋 시도</text><rect x="170" y="316" width="300" height="50" rx="8" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1.5"/><text x="320.0" y="345.7" text-anchor="middle" font-size="13" font-weight="400" fill="#1d1d1f"></text><text x="320" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">B의 커밋은 충돌(Conflict)로 거부된다</text><text x="320" y="355" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">업데이트로 A의 변경을 받아 병합한 뒤 다시 커밋</text><text x="320" y="392" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">디프(Diff)로 두 버전의 차이를 줄 단위로 조회하고, 필요하면 이전 버전으로 되돌린다</text></svg>
