<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="400" fill="#fff"/>
<text x="24" y="30" font-size="15" fill="#1f2937" font-weight="600">서버 글 한 편의 시각 열 변화</text>
<text x="24" y="49" font-size="11" fill="#6b7280">오전에 임시 저장하고 저녁에 처음 게시한 뒤, 다음 날 고쳐 다시 게시한 경우. 파랑은 정렬에 쓰는 값, 빨강은 바뀐 값</text>
<text x="200" y="80" font-size="11" fill="#6b7280" text-anchor="middle">09:00</text>
<text x="350" y="80" font-size="11" fill="#6b7280" text-anchor="middle">19:00</text>
<text x="500" y="80" font-size="11" fill="#6b7280" text-anchor="middle">다음 날 10:00</text>
<text x="650" y="80" font-size="11" fill="#6b7280" text-anchor="middle">다음 날 11:00</text>
<line x1="130" y1="100" x2="725" y2="100" stroke="#d1d5db" stroke-width="2"/>
<circle cx="200" cy="100" r="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<circle cx="350" cy="100" r="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<circle cx="500" cy="100" r="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<circle cx="650" cy="100" r="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="200" y="128" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">새 글 임시 저장</text>
<text x="350" y="128" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">처음 게시</text>
<text x="500" y="128" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">고쳐서 임시 저장</text>
<text x="650" y="128" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">다시 게시</text>
<g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4b5563">
<text x="24" y="162">createdAt</text>
<text x="24" y="192">publishedAt</text>
<text x="24" y="222">firstPublishedAt</text>
</g>
<text x="24" y="252" font-size="11" fill="#1f2937" font-weight="600">응답 createdAt</text>
<g stroke="#e5e7eb">
<line x1="24" y1="172" x2="736" y2="172"/>
<line x1="24" y1="202" x2="736" y2="202"/>
<line x1="24" y1="232" x2="736" y2="232"/>
<line x1="24" y1="262" x2="736" y2="262"/>
</g>
<g font-size="11.5" text-anchor="middle" fill="#4b5563">
<text x="200" y="162">09:00</text>
<text x="350" y="162">09:00</text>
<text x="500" y="162">09:00</text>
<text x="650" y="162">09:00</text>
<text x="200" y="192">없음</text>
<text x="350" y="192" fill="#b91c1c" font-weight="600">19:00</text>
<text x="500" y="192">19:00</text>
<text x="650" y="192" fill="#b91c1c" font-weight="600">11:00 (갱신)</text>
<text x="200" y="222">없음</text>
<text x="350" y="222" fill="#2563eb" font-weight="600">19:00 (최초 기록)</text>
<text x="500" y="222">19:00</text>
<text x="650" y="222" fill="#2563eb" font-weight="600">19:00 (유지)</text>
<text x="200" y="252">없음 → 맨 위</text>
<text x="350" y="252" fill="#2563eb" font-weight="600">19:00</text>
<text x="500" y="252">19:00</text>
<text x="650" y="252" fill="#2563eb" font-weight="600">19:00</text>
</g>
<rect x="24" y="280" width="712" height="104" rx="8" fill="#f3f4f6"/>
<text x="38" y="302" font-size="12" fill="#1f2937" font-weight="600">세 열의 의미</text>
<text x="38" y="324" font-size="11" fill="#4b5563"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">createdAt</tspan>: 행을 만든 시각 = 처음 임시 저장한 시각. 게시 시각과 무관하다</text>
<text x="38" y="344" font-size="11" fill="#4b5563"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">publishedAt</tspan>: 마지막으로 게시한 시각. 게시할 때마다 갱신된다</text>
<text x="38" y="364" font-size="11" fill="#4b5563"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">firstPublishedAt</tspan>: 처음 게시한 시각. 새 열이며 NULL일 때만 기록한다. API는 이 값을 응답의</text>
<text x="38" y="378" font-size="11" fill="#4b5563"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">createdAt</tspan> 필드로 전달한다</text>
</svg>
