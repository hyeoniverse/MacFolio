<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>border-radius 값별 사용 횟수 막대 그래프. 50% 84곳, 999px 73, 6px 46, 8px 42, 14px 34, 10px 29, 4px 15. 이름 붙인 여섯 값이 239곳</title><defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="720" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">border-radius 576곳, 값별로 세면</text>
<text x="90" y="77" font-size="11" font-weight="600" fill="#374151" text-anchor="end">50%</text>
<rect x="100" y="62" width="352.8" height="20" rx="4" fill="#d1d5db"/>
<text x="458.8" y="76" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">84</text>
<text x="480" y="76" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">원 — 그대로 둠</text>
<text x="90" y="107" font-size="11" font-weight="600" fill="#374151" text-anchor="end">999px</text>
<rect x="100" y="92" width="306.6" height="20" rx="4" fill="#4f46e5"/>
<text x="412.6" y="106" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">73</text>
<text x="480" y="106" font-size="10.5" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--radius-full</text>
<text x="90" y="137" font-size="11" font-weight="600" fill="#374151" text-anchor="end">6px</text>
<rect x="100" y="122" width="193.20000000000002" height="20" rx="4" fill="#4f46e5"/>
<text x="299.20000000000005" y="136" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">46</text>
<text x="480" y="136" font-size="10.5" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--radius-sm</text>
<text x="90" y="167" font-size="11" font-weight="600" fill="#374151" text-anchor="end">8px</text>
<rect x="100" y="152" width="176.4" height="20" rx="4" fill="#4f46e5"/>
<text x="282.4" y="166" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">42</text>
<text x="480" y="166" font-size="10.5" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--radius-md</text>
<text x="90" y="197" font-size="11" font-weight="600" fill="#374151" text-anchor="end">14px</text>
<rect x="100" y="182" width="142.8" height="20" rx="4" fill="#4f46e5"/>
<text x="248.8" y="196" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">34</text>
<text x="480" y="196" font-size="10.5" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--radius-xl</text>
<text x="90" y="227" font-size="11" font-weight="600" fill="#374151" text-anchor="end">10px</text>
<rect x="100" y="212" width="121.80000000000001" height="20" rx="4" fill="#4f46e5"/>
<text x="227.8" y="226" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">29</text>
<text x="480" y="226" font-size="10.5" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--radius-lg</text>
<text x="90" y="257" font-size="11" font-weight="600" fill="#374151" text-anchor="end">4px</text>
<rect x="100" y="242" width="63.0" height="20" rx="4" fill="#4f46e5"/>
<text x="169.0" y="256" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">15</text>
<text x="480" y="256" font-size="10.5" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--radius-xs</text>
<text x="32" y="290" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">색칠한 여섯 값 = 239곳 (전체의 41%)을 var(--radius-*)로. 12·22·18·20·16px 등은 각 20곳 아래라 남겼다.</text>
<text x="32" y="310" font-size="10.5" font-weight="600" fill="#4f46e5" text-anchor="start">값이 같으니 화면은 1px도 바뀌지 않는다.</text>
</svg>
