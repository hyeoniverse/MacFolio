<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>글 행의 세 상태</title>
  <rect width="780" height="320" rx="16" fill="#ffffff"/>
  <text x="32" y="42" font-size="18" font-weight="700" fill="#1f2937">deleted · deletedAt 두 칸으로 나뉘는 세 상태</text>
  <text x="32" y="64" font-size="12" fill="#6b7280">posts.service.ts의 remove · restore · purge · purgeExpired</text>
  <g text-anchor="middle">
    <rect x="32" y="110" width="190" height="90" rx="12" fill="#f3f4f6"/>
    <text x="127" y="140" font-size="15" font-weight="700" fill="#1f2937">보통 글</text>
    <text x="127" y="164" font-size="12" fill="#374151">deleted = false</text>
    <text x="127" y="182" font-size="12" fill="#374151">deletedAt = null</text>
    <rect x="296" y="110" width="200" height="90" rx="12" fill="#fff7ed"/>
    <text x="396" y="140" font-size="15" font-weight="700" fill="#9a3412">최근 삭제된 항목</text>
    <text x="396" y="164" font-size="12" fill="#374151">deleted = true</text>
    <text x="396" y="182" font-size="12" fill="#374151">deletedAt = 지운 때</text>
    <rect x="570" y="110" width="178" height="90" rx="12" fill="#fee2e2"/>
    <text x="659" y="140" font-size="15" font-weight="700" fill="#b91c1c">영구히 지운 글</text>
    <text x="659" y="164" font-size="12" fill="#374151">deleted = true</text>
    <text x="659" y="182" font-size="12" fill="#374151">deletedAt = null</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.6" fill="none">
    <path d="M222 140 H290"/><path d="M290 140 l-8 -5 m8 5 l-8 5"/>
    <path d="M296 176 H228"/><path d="M228 176 l8 -5 m-8 5 l8 5"/>
    <path d="M496 155 H564"/><path d="M564 155 l-8 -5 m8 5 l-8 5"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="259" y="130" fill="#374151">remove</text>
    <text x="259" y="196" fill="#374151">restore</text>
    <text x="530" y="145" fill="#374151">purge</text>
    <text x="530" y="176" font-size="11" fill="#6b7280">30일 지나면</text>
    <text x="530" y="190" font-size="11" fill="#6b7280">purgeExpired</text>
  </g>
  <rect x="32" y="226" width="716" height="70" rx="10" fill="#eef0ff"/>
  <text x="48" y="250" font-size="12" fill="#3f46c7" font-weight="600">CHECK ("deletedAt" IS NULL OR "deleted") — deleted = false인데 지운 때가 있는 상태는 DB가 막는다</text>
  <text x="48" y="272" font-size="12" fill="#374151">저장소 글을 서버 내용 없이 되살리면 행 자체를 지운다 → 파일이 다시 보인다</text>
</svg>
