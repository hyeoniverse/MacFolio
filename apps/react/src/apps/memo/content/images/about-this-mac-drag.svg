<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>끌어 옮기기의 좌표 계산</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="390" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">끌어 옮기기: 시작점에서 움직인 거리를 offset에 더한다</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">예: 창을 오른쪽으로 60px, 아래로 40px 끄는 경우</text>
<g font-size="12">
<rect x="20" y="70" width="186" height="128" rx="10" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="34" y="94" font-size="14" font-weight="700" fill="#0a84ff">① pointerdown</text>
<text x="34" y="120" fill="#1d1d1f">포인터 위치 (700, 300)</text>
<text x="34" y="142" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">from = (0, 0)</text>
<text x="34" y="164" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">setPointerCapture</text>
<text x="34" y="184" fill="#6e6e73">포인터를 이 창에 고정</text>
<line x1="208" y1="134" x2="225" y2="134" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="227" y="70" width="186" height="128" rx="10" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="241" y="94" font-size="14" font-weight="700" fill="#0a84ff">② pointermove</text>
<text x="241" y="120" fill="#1d1d1f">포인터 위치 (760, 340)</text>
<text x="241" y="142" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">x = 0 + 760 − 700</text>
<text x="241" y="164" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">y = 0 + 340 − 300</text>
<text x="241" y="184" fill="#1d1d1f">offset = (60, 40)</text>
<line x1="415" y1="134" x2="432" y2="134" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="434" y="70" width="186" height="128" rx="10" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="448" y="94" font-size="14" font-weight="700" fill="#0a84ff">③ pointerup</text>
<text x="448" y="120" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">drag = null</text>
<text x="448" y="142" fill="#1d1d1f">창은 (60, 40)에 머문다</text>
<text x="448" y="164" fill="#1d1d1f">다시 끌면 시작값</text>
<text x="448" y="184" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">from = (60, 40)</text>
</g>
<text x="20" y="232" font-size="14" font-weight="700" fill="#1d1d1f">CSS 적용</text>
<rect x="20" y="246" width="150" height="88" rx="8" fill="none" stroke="#6e6e73" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="30" y="266" font-size="12" fill="#6e6e73">처음 자리 (가운데)</text>
<rect x="62" y="274" width="150" height="88" rx="8" fill="#ffffff" fill-opacity="0.85" stroke="#0a84ff" stroke-width="2"/>
<text x="137" y="314" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">translate:</text>
<text x="137" y="332" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">60px 40px</text>
<line x1="170" y1="334" x2="209" y2="359" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="250" y="220" width="370" height="150" rx="10" fill="#fff8ec" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="266" y="246" font-size="14" font-weight="700" fill="#1d1d1f">끌기를 시작하지 않는 위치</text>
<text x="266" y="270" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">target.closest('button, a, dd') → return</text>
<text x="266" y="296" font-size="12" fill="#1d1d1f">button: 닫기 버튼, '추가 정보…', 개인정보 처리 방침</text>
<text x="266" y="318" font-size="12" fill="#1d1d1f">a: 이메일·GitHub 링크</text>
<text x="266" y="340" font-size="12" fill="#1d1d1f">dd: 사양 값. 이메일 주소를 끌어서 선택·복사한다</text>
<text x="266" y="360" font-size="12" fill="#6e6e73">그 밖의 빈 영역(사진, 이름, 라벨)에서만 창이 움직인다</text>
</svg>
