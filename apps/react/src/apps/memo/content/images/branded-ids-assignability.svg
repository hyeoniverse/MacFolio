<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>string과 PostSlug의 포함 관계</title>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
</defs>
<rect width="640" height="340" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">PostSlug는 string의 부분 집합이다</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">POST_SLUG = /^[\w-]{1,100}$/ : 영문·숫자·밑줄·하이픈 1~100자</text>

<rect x="24" y="72" width="400" height="248" rx="14" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="40" y="96" font-size="13" font-weight="700" fill="#1d1d1f">string (모든 문자열)</text>
<text x="40" y="126" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"a/b?x=1"</text>
<text x="40" y="146" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"한글-제목"</text>
<text x="40" y="166" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">""  (빈 문자열)</text>
<text x="40" y="186" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"x" × 101</text>
<text x="40" y="214" font-size="12" fill="#6e6e73">postSlug()가 null을</text>
<text x="40" y="230" font-size="12" fill="#6e6e73">반환하는 값</text>

<rect x="196" y="110" width="212" height="194" rx="12" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="212" y="134" font-size="13" font-weight="700" fill="#0a84ff">PostSlug</text>
<text x="212" y="152" font-size="12" fill="#6e6e73">검사를 통과한 문자열</text>
<text x="212" y="182" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"cra-to-vite"</text>
<text x="212" y="202" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"branded-ids"</text>
<text x="212" y="222" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">"day-20250323"</text>
<text x="212" y="258" font-size="12" fill="#6e6e73">실행 시에는 같은 문자열,</text>
<text x="212" y="276" font-size="12" fill="#6e6e73">타입에만 표시가 붙는다</text>

<text x="444" y="96" font-size="13" font-weight="700" fill="#1d1d1f">대입 방향</text>
<line x1="444" y1="124" x2="602" y2="124" stroke="#34c759" stroke-width="2" marker-end="url(#ag)"/>
<text x="444" y="146" font-size="12" fill="#1d1d1f">PostSlug → string</text>
<text x="444" y="164" font-size="12" fill="#34c759" font-weight="700">허용 (부분 집합이므로)</text>
<line x1="444" y1="196" x2="602" y2="196" stroke="#ff3b30" stroke-width="2" stroke-dasharray="6 4"/>
<text x="523" y="201" font-size="16" font-weight="700" fill="#ff3b30" text-anchor="middle">×</text>
<text x="444" y="218" font-size="12" fill="#1d1d1f">string → PostSlug</text>
<text x="444" y="236" font-size="12" fill="#ff3b30" font-weight="700">거부 (TS2345)</text>
<line x1="444" y1="268" x2="602" y2="268" stroke="#0a84ff" stroke-width="2" marker-end="url(#ab)"/>
<text x="444" y="290" font-size="12" fill="#1d1d1f">string → postSlug() →</text>
<text x="444" y="308" font-size="12" fill="#0a84ff" font-weight="700">PostSlug 또는 null</text>
</svg>
