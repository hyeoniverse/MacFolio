<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">장바구니에 상품 하나를 담았을 때 다시 렌더링되는 컴포넌트</text>

  <!-- 왼쪽 -->
  <text x="160" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">store 전체를 구독</text>
  <text x="160" y="74" text-anchor="middle" font-size="12" fill="#6e6e73" font-family="Menlo, monospace">const s = useShopStore()</text>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none">
    <path d="M160 116 V132 H70 V146"/><path d="M160 132 H250 V146"/><path d="M160 132 V146"/>
  </g>
  <rect x="100" y="86" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="160" y="106" text-anchor="middle" font-size="12" fill="#1d1d1f">App</text>
  <g font-size="12" text-anchor="middle">
    <rect x="27" y="146" width="86" height="44" rx="6" fill="#ff9f0a"/>
    <text x="70" y="166" fill="#1d1d1f" font-weight="600">Header</text><text x="70" y="181" fill="#1d1d1f">user.name</text>
    <rect x="117" y="146" width="86" height="44" rx="6" fill="#ff9f0a"/>
    <text x="160" y="166" fill="#1d1d1f" font-weight="600">CartBadge</text><text x="160" y="181" fill="#1d1d1f">cart.length</text>
    <rect x="207" y="146" width="86" height="44" rx="6" fill="#ff9f0a"/>
    <text x="250" y="166" fill="#1d1d1f" font-weight="600">Theme</text><text x="250" y="181" fill="#1d1d1f">theme</text>
  </g>
  <text x="160" y="216" text-anchor="middle" font-size="12" fill="#1d1d1f">3개 모두 다시 렌더링</text>

  <line x1="320" y1="50" x2="320" y2="230" stroke="#c7c7cc" stroke-dasharray="4 4"/>

  <!-- 오른쪽 -->
  <text x="480" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">selector로 쓰는 값만 구독</text>
  <text x="480" y="74" text-anchor="middle" font-size="12" fill="#6e6e73" font-family="Menlo, monospace">useShopStore((s) =&gt; s.cart.length)</text>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none">
    <path d="M480 116 V132 H390 V146"/><path d="M480 132 H570 V146"/><path d="M480 132 V146"/>
  </g>
  <rect x="420" y="86" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="480" y="106" text-anchor="middle" font-size="12" fill="#1d1d1f">App</text>
  <g font-size="12" text-anchor="middle">
    <rect x="347" y="146" width="86" height="44" rx="6" fill="#f2f2f7" stroke="#c7c7cc"/>
    <text x="390" y="166" fill="#6e6e73" font-weight="600">Header</text><text x="390" y="181" fill="#6e6e73">user.name</text>
    <rect x="437" y="146" width="86" height="44" rx="6" fill="#ff9f0a"/>
    <text x="480" y="166" fill="#1d1d1f" font-weight="600">CartBadge</text><text x="480" y="181" fill="#1d1d1f">cart.length</text>
    <rect x="527" y="146" width="86" height="44" rx="6" fill="#f2f2f7" stroke="#c7c7cc"/>
    <text x="570" y="166" fill="#6e6e73" font-weight="600">Theme</text><text x="570" y="181" fill="#6e6e73">theme</text>
  </g>
  <text x="480" y="216" text-anchor="middle" font-size="12" fill="#1d1d1f">CartBadge 하나만 다시 렌더링</text>

  <rect x="22" y="246" width="596" height="78" rx="8" fill="#f2f2f7"/>
  <text x="38" y="270" font-size="13" font-weight="600" fill="#1d1d1f">판단 기준</text>
  <text x="38" y="290" font-size="12" fill="#1d1d1f">selector가 반환한 값을 이전 값과 Object.is로 비교해, 같으면 그 컴포넌트는 렌더링을 건너뛴다.</text>
  <text x="38" y="308" font-size="12" fill="#1d1d1f">user.name과 theme은 그대로이므로 Header와 Theme은 다시 실행되지 않는다.</text>
  <g font-size="12"><rect x="440" y="260" width="14" height="14" rx="3" fill="#ff9f0a"/><text x="460" y="272" fill="#1d1d1f">다시 렌더링</text>
  <rect x="530" y="260" width="14" height="14" rx="3" fill="#f2f2f7" stroke="#c7c7cc"/><text x="550" y="272" fill="#1d1d1f">건너뜀</text></g>
</svg>
