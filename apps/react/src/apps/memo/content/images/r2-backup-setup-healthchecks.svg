<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>backup.sh가 성공하면 Ping URL, 실패하면 /fail을 요청한다. 요청이 주기 1일과 유예 1시간 안에 오지 않으면 healthchecks.io가 메일을 보낸다</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">healthchecks.io가 알림을 보내는 세 경우</text>
<text x="32" y="56" font-size="11" fill="#6b7280">Check 설정: 주기(Period) 1일 · 유예(Grace) 1시간 · cron 03:30 UTC</text>
<rect x="32" y="84" width="248" height="96" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
<text x="44" y="103" font-size="12" fill="#15803d" font-weight="600">성공</text>
<text x="44" y="120" font-size="10.5" fill="#374151">backup.sh 종료 코드 0</text>
<text x="44" y="135" font-size="10.5" fill="#374151">→ GET BACKUP_PING_URL</text>
<text x="44" y="150" font-size="10.5" fill="#374151">상태 up 유지, 알림 없음</text>
<rect x="306" y="84" width="248" height="96" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="318" y="103" font-size="12" fill="#b91c1c" font-weight="600">실패</text>
<text x="318" y="120" font-size="10.5" fill="#374151">덤프·검사·업로드·상한 중 하나 실패</text>
<text x="318" y="135" font-size="10.5" fill="#374151">→ GET BACKUP_PING_URL/fail</text>
<text x="318" y="150" font-size="10.5" fill="#374151">즉시 down → 메일 알림</text>
<rect x="580" y="84" width="248" height="96" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="592" y="103" font-size="12" fill="#b45309" font-weight="600">실행되지 않음</text>
<text x="592" y="120" font-size="10.5" fill="#374151">서버 중지, crontab 항목 누락 등</text>
<text x="592" y="135" font-size="10.5" fill="#374151">→ 요청 자체가 없음</text>
<text x="592" y="150" font-size="10.5" fill="#374151">1일 + 1시간 경과 후 down → 메일</text>
<rect x="32" y="206" width="796" height="66" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="44" y="225" font-size="12" fill="#374151" font-weight="600">cron만 사용할 때와의 차이</text>
<text x="44" y="242" font-size="10.5" fill="#374151">cron은 작업이 실패하거나 실행되지 않아도 알리지 않는다. healthchecks.io는 "요청이 오지 않음"도 실패로 판단하므로</text>
<text x="44" y="257" font-size="10.5" fill="#374151">세 번째 경우(실행 자체가 멈춘 상태)까지 검출한다</text>
</svg>
