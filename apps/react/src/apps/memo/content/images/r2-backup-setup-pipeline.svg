<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>cron이 backup.sh를 부르면 pg_dump와 gzip, 압축 검사, 서버에 7일 보관, R2에서 30일 지난 것 삭제, 크기 상한 확인, 올리기, healthchecks 알림 순으로 진행한다</title><defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="800" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">매일 03:30 UTC, backup.sh 한 번이 하는 일</text>
<rect x="32" y="64" width="210" height="62" rx="10" fill="#f3f4f6"/>
<text x="137.0" y="91.75" font-size="11.5" font-weight="600" fill="#374151" text-anchor="middle">pg_dump | gzip -9</text>
<text x="137.0" y="109.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">--clean --if-exists</text>
<rect x="282" y="64" width="210" height="62" rx="10" fill="#f3f4f6"/>
<text x="387.0" y="91.75" font-size="11.5" font-weight="600" fill="#374151" text-anchor="middle">gzip -t</text>
<text x="387.0" y="109.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">끊긴 파일 거르기</text>
<path d="M244 95 H280" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="532" y="64" width="210" height="62" rx="10" fill="#f3f4f6"/>
<text x="637.0" y="91.75" font-size="11.5" font-weight="600" fill="#374151" text-anchor="middle">~/backups</text>
<text x="637.0" y="109.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">7일 보관</text>
<path d="M494 95 H530" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="32" y="160" width="210" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="137.0" y="187.75" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="middle">R2: 30일 지난 것 삭제</text>
<text x="137.0" y="205.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">rclone delete --min-age</text>
<rect x="282" y="160" width="210" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="387.0" y="187.75" font-size="11.5" font-weight="600" fill="#1f2937" text-anchor="middle">크기 + 오늘 ≤ 8GB?</text>
<text x="387.0" y="205.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">rclone size --json</text>
<path d="M244 191 H280" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="532" y="160" width="210" height="62" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="637.0" y="187.75" font-size="11.5" font-weight="600" fill="#4f46e5" text-anchor="middle">rclone copy</text>
<text x="637.0" y="205.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">R2에 올림</text>
<path d="M494 191 H530" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<path d="M637 126 V142 H137 V158" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<rect x="32" y="262" width="210" height="46" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="137.0" y="288.5" font-size="11" font-weight="600" fill="#065f46" text-anchor="middle">성공 → BACKUP_PING_URL</text>
<rect x="262" y="262" width="250" height="46" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
<text x="387.0" y="288.5" font-size="11" font-weight="600" fill="#9f1239" text-anchor="middle">어느 단계든 실패 → 주소/fail</text>
<rect x="532" y="262" width="236" height="46" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="650.0" y="288.25" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="middle">하루 소식 없음 → healthchecks가 메일</text>
<path d="M637 222 V240 H137 V260" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#good)"/>
<text x="650" y="90" font-size="10" font-weight="400" fill="#374151" text-anchor="start"></text>
</svg>
