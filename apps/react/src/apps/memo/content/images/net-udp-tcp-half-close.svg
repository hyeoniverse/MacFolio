<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="420" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <g font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">
    <text x="190" y="26">클라이언트</text>
    <text x="450" y="26">서버</text>
  </g>
  <g stroke="#6e6e73" stroke-width="2">
    <line x1="190" y1="36" x2="190" y2="410"/><line x1="450" y1="36" x2="450" y2="410"/>
  </g>
  <line x1="190" y1="64" x2="448" y2="84" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="320.0" y="58" text-anchor="middle" font-size="13" fill="#0a84ff">FIN</text>
  <text x="180" y="69" text-anchor="end" font-size="13" fill="#1d1d1f">응용이 shutdown</text>
  <text x="460" y="89" font-size="13" fill="#1d1d1f">응용에 EOF 전달</text>
  <line x1="450" y1="120" x2="192" y2="140" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="320.0" y="114" text-anchor="middle" font-size="13" fill="#0a84ff">FIN의 ACK</text>
  <line x1="450" y1="176" x2="192" y2="196" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="320.0" y="170" text-anchor="middle" font-size="13" fill="#ff3b30">데이터</text>
  <text x="460" y="181" font-size="13" fill="#1d1d1f">응용이 write</text>
  <line x1="190" y1="232" x2="448" y2="252" stroke="#ff3b30" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="320.0" y="226" text-anchor="middle" font-size="13" fill="#ff3b30">데이터의 ACK</text>
  <text x="180" y="237" text-anchor="end" font-size="13" fill="#1d1d1f">응용이 read</text>
  <line x1="450" y1="318" x2="192" y2="338" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="320.0" y="312" text-anchor="middle" font-size="13" fill="#1d1d1f">FIN</text>
  <text x="460" y="323" font-size="13" fill="#1d1d1f">응용이 close</text>
  <line x1="190" y1="374" x2="448" y2="394" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="320.0" y="368" text-anchor="middle" font-size="13" fill="#1d1d1f">FIN의 ACK</text>
  <text x="180" y="379" text-anchor="end" font-size="13" fill="#1d1d1f">응용에 EOF 전달</text>
</svg>
