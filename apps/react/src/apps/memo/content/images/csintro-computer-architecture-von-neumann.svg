<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>폰 노이만 구조: CPU, 주기억장치, 입출력장치와 시스템 버스</title>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">폰 노이만 구조와 시스템 버스</text>
<rect x="30" y="56" width="250" height="200" rx="12" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
<text x="155" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#0a84ff">CPU</text>
<rect x="46" y="94" width="104" height="66" rx="6" fill="#f2f2f7"/><text x="98" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">제어장치</text><text x="98" y="142" text-anchor="middle" font-size="12" fill="#6e6e73">해독·제어 신호</text>
<rect x="160" y="94" width="104" height="66" rx="6" fill="#f2f2f7"/><text x="212" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">ALU</text><text x="212" y="142" text-anchor="middle" font-size="12" fill="#6e6e73">산술·논리 연산</text>
<rect x="46" y="170" width="218" height="74" rx="6" fill="#f2f2f7"/><text x="155" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">레지스터</text>
<text x="155" y="212" text-anchor="middle" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">PC  IR  MAR  MBR</text><text x="155" y="232" text-anchor="middle" font-size="12" fill="#6e6e73" font-family="ui-monospace, Menlo, monospace">AC  범용 레지스터</text>
<rect x="340" y="56" width="270" height="110" rx="12" fill="#fff" stroke="#34c759" stroke-width="2"/>
<text x="475" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">주기억장치</text>
<rect x="356" y="92" width="238" height="28" rx="4" fill="#e8f2ff"/><text x="475" y="111" text-anchor="middle" font-size="12" fill="#1d1d1f">명령어 (프로그램 코드)</text>
<rect x="356" y="126" width="238" height="28" rx="4" fill="#eaf8ee"/><text x="475" y="145" text-anchor="middle" font-size="12" fill="#1d1d1f">데이터</text>
<rect x="420" y="186" width="190" height="70" rx="12" fill="#fff" stroke="#6e6e73"/>
<text x="515" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">입출력장치</text><text x="515" y="236" text-anchor="middle" font-size="12" fill="#6e6e73">키보드·디스크·NIC</text>
<g stroke-width="8" stroke-linecap="round">
<line x1="40" y1="300" x2="600" y2="300" stroke="#ff9f0a"/><line x1="40" y1="330" x2="600" y2="330" stroke="#0a84ff"/><line x1="40" y1="360" x2="600" y2="360" stroke="#34c759"/>
</g>
<g stroke="#6e6e73" stroke-width="2"><line x1="155" y1="256" x2="155" y2="364"/><line x1="370" y1="166" x2="370" y2="364"/><line x1="560" y1="256" x2="560" y2="364"/></g>
<g font-size="12" fill="#1d1d1f"><text x="168" y="292">주소 버스 (CPU → 장치)</text><text x="168" y="322">데이터 버스 (양방향)</text><text x="168" y="352">제어 버스 (읽기·쓰기·인터럽트)</text></g>
<text x="30" y="390" font-size="12" fill="#6e6e73">명령어와 데이터가 같은 메모리와 같은 버스를 공유한다.</text>
</svg>
