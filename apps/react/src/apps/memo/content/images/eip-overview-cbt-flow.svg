<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>CBT 필기시험 진행 순서</title><rect width="640" height="300" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">CBT 필기시험 화면 진행 순서</text>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<rect x="20" y="52" width="130" height="60" rx="6" fill="#f2f2f7"/><text x="85" y="76" font-weight="600">1 수험자 정보</text><text x="85" y="96" font-size="12" fill="#6e6e73">감독위원 신분 확인</text>
<rect x="176" y="52" width="130" height="60" rx="6" fill="#f2f2f7"/><text x="241" y="76" font-weight="600">2 안내사항</text><text x="241" y="96" font-size="12" fill="#6e6e73">[다음]으로 확인</text>
<rect x="332" y="52" width="130" height="60" rx="6" fill="#f2f2f7"/><text x="397" y="76" font-weight="600">3 유의사항</text><text x="397" y="96" font-size="12" fill="#6e6e73">[다음]으로 확인</text>
<rect x="488" y="52" width="130" height="60" rx="6" fill="#f2f2f7"/><text x="553" y="76" font-weight="600">4 메뉴 설명</text><text x="553" y="96" font-size="12" fill="#6e6e73">글자 크기·계산기</text>
<rect x="20" y="170" width="130" height="76" rx="6" fill="#0a84ff"/><text x="85" y="194" font-weight="600" fill="#fff">5 문제 풀이</text><text x="85" y="214" font-size="12" fill="#fff">과목 이동·체크</text><text x="85" y="230" font-size="12" fill="#fff">남은 시간 표시</text>
<rect x="176" y="170" width="130" height="76" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="241" y="194" font-weight="600">6 답안 제출</text><text x="241" y="214" font-size="12" fill="#6e6e73">안 푼 문제 확인</text><text x="241" y="230" font-size="12" fill="#6e6e73">[남은 문제] 목록</text>
<rect x="332" y="170" width="130" height="76" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="397" y="194" font-weight="600">7 최종 제출</text><text x="397" y="214" font-size="12" fill="#6e6e73">승인 창에서 [확인]</text><text x="397" y="230" font-size="12" fill="#6e6e73">[취소]면 계속 풀이</text>
<rect x="488" y="170" width="130" height="76" rx="6" fill="#30d158"/><text x="553" y="194" font-weight="600" fill="#fff">8 결과 확인</text><text x="553" y="214" font-size="12" fill="#fff">점수·합격 여부</text><text x="553" y="230" font-size="12" fill="#fff">확인 후 퇴실</text>
</g>
<g stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M150 82 H172"/><path d="M306 82 H328"/><path d="M462 82 H484"/><path d="M553 112 V140 H85 V166"/><path d="M150 208 H172"/><path d="M306 208 H328"/><path d="M462 208 H484"/></g>
<path d="M397 246 V266 H85 V250" stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/><text x="241" y="284" text-anchor="middle" font-size="12" fill="#6e6e73">[취소]를 누르면 문제 풀이 화면으로 돌아간다</text>
</svg>
