<text x="320" y="40" text-anchor="middle" font-size="12" fill="#6e6e73">준비 큐에 있던 프로세스가 CPU를 받으면 실행, 할당 시간이 끝나면 다시 준비로 돌아간다</text>
<text x="320" y="62" text-anchor="middle" font-size="12" fill="#6e6e73">입출력을 기다리는 동안은 대기 상태라 CPU를 받을 수 없다</text></svg>
