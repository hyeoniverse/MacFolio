<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>registry와 Finder의 순환: 전과 후</title>
<defs>
<marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
<marker id="o2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="640" height="290" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="700" fill="#1f2937">전: Finder가 컴포넌트 표를 다시 읽는다</text>
<text x="352" y="40" font-size="17" font-weight="700" fill="#1f2937">후: 이름은 manifest에서</text>
<!-- before -->
<rect x="40" y="80" width="120" height="44" rx="10" fill="#fff1f2" stroke="#fda4af"/>
<text x="100" y="100" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">registry.ts</text>
<text x="100" y="115" font-size="10" fill="#6b7280" text-anchor="middle">앱 → 컴포넌트</text>
<rect x="190" y="80" width="110" height="44" rx="10" fill="#fff1f2" stroke="#fda4af"/>
<text x="245" y="107" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">Finder.tsx</text>
<path d="M160 93 H188" stroke="#ef4444" stroke-width="2" marker-end="url(#r2)"/>
<path d="M190 111 H162" stroke="#ef4444" stroke-width="2" marker-end="url(#r2)"/>
<text x="175" y="78" font-size="10" fill="#6b7280" text-anchor="middle">lazy()</text>
<text x="175" y="138" font-size="10" fill="#6b7280" text-anchor="middle">WINDOW_APPS</text>
<rect x="40" y="170" width="260" height="84" rx="10" fill="#f9fafb"/>
<text x="54" y="194" font-size="12" fill="#374151">Finder에 필요한 것은 컴포넌트가 아니라 이름뿐</text>
<text x="54" y="214" font-size="12" fill="#374151">lazy라 돌아가긴 했지만 번들러가 둘을 떼지 못한다</text>
<text x="54" y="234" font-size="12" fill="#374151">(처음 열 때 불러오는 효과가 반감)</text>
<!-- after -->
<rect x="360" y="80" width="110" height="44" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="415" y="107" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">registry.ts</text>
<rect x="500" y="80" width="110" height="44" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="555" y="107" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">Finder.tsx</text>
<path d="M470 102 H498" stroke="#4f46e5" stroke-width="2" marker-end="url(#o2)"/>
<text x="484" y="78" font-size="10" fill="#6b7280" text-anchor="middle">lazy()</text>
<rect x="430" y="186" width="110" height="44" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="485" y="205" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">manifest.ts</text>
<text x="485" y="220" font-size="10" fill="#6b7280" text-anchor="middle">React를 모르는 앱 목록</text>
<path d="M415 124 L470 184" stroke="#4f46e5" stroke-width="2" marker-end="url(#o2)"/>
<path d="M555 124 L500 184" stroke="#4f46e5" stroke-width="2" marker-end="url(#o2)"/>
<text x="485" y="254" font-size="10.5" fill="#6b7280" text-anchor="middle">WINDOW_APP_NAMES (창으로 열리는 앱 이름)</text>
<text x="485" y="276" font-size="11" fill="#374151" text-anchor="middle">둘 다 아래 층만 본다</text>
</svg>
