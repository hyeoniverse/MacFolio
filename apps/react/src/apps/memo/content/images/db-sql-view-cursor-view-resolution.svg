<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">뷰에 대한 질의를 기본 테이블에 대한 질의로 바꾸는 과정</text>
  <g font-size="12" fill="#1d1d1f">
    <text x="20" y="56" fill="#6e6e73">① 사용자가 보낸 질의</text>
    <rect x="20" y="64" width="290" height="50" rx="8" fill="#e8f2ff" stroke="#0a84ff"/>
    <text x="32" y="84" font-family="SFMono-Regular, Menlo, monospace">SELECT Sname FROM CSTUDENT</text>
    <text x="32" y="102" font-family="SFMono-Regular, Menlo, monospace">WHERE  Year = 4;</text>
    <text x="330" y="56" fill="#6e6e73">② 카탈로그에 저장된 뷰 정의</text>
    <rect x="330" y="64" width="290" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="342" y="84" font-family="SFMono-Regular, Menlo, monospace">CSTUDENT = SELECT Sno, Sname,</text>
    <text x="342" y="102" font-family="SFMono-Regular, Menlo, monospace">  Year FROM STUDENT WHERE Dept='컴퓨터'</text>
    <text x="20" y="160" fill="#6e6e73">③ DBMS가 두 조건을 합쳐 만든 질의</text>
    <rect x="20" y="168" width="600" height="50" rx="8" fill="#fff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="32" y="188" font-family="SFMono-Regular, Menlo, monospace">SELECT Sname FROM STUDENT</text>
    <text x="32" y="206" font-family="SFMono-Regular, Menlo, monospace">WHERE  Dept = '컴퓨터' AND Year = 4;</text>
    <text x="20" y="252" fill="#6e6e73">④ 기본 테이블 STUDENT에서 실행한 결과</text>
    <rect x="20" y="260" width="200" height="24" fill="#f2f2f7" stroke="#6e6e73"/><text x="32" y="277" font-weight="600">Sname</text>
    <rect x="20" y="284" width="200" height="24" fill="#fff" stroke="#6e6e73"/><text x="32" y="301">나수영</text>
    <rect x="20" y="308" width="200" height="24" fill="#fff" stroke="#6e6e73"/><text x="32" y="325">송병길</text>
    <text x="250" y="290" fill="#1d1d1f">뷰에는 저장된 행이 없다. 실행할 때마다</text>
    <text x="250" y="308" fill="#1d1d1f">STUDENT의 현재 행에서 결과를 계산한다.</text>
  </g>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M165 114 L 165 150"/>
    <path d="M475 114 L 475 150"/>
    <path d="M120 218 L 120 242"/>
  </g>
</svg>
