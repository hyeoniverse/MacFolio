<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">사원 레코드에 '전화번호' 필드를 추가할 때 고쳐야 하는 곳</text>
  <line x1="320" y1="48" x2="320" y2="340" stroke="#d2d2d7" stroke-dasharray="4 4"/>

  <text x="165" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#ff3b30">파일 시스템</text>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="20" y="76" width="60" height="32" fill="#f2f2f7" stroke="#6e6e73"/><text x="50" y="97">사번</text>
    <rect x="80" y="76" width="70" height="32" fill="#f2f2f7" stroke="#6e6e73"/><text x="115" y="97">이름</text>
    <rect x="150" y="76" width="55" height="32" fill="#f2f2f7" stroke="#6e6e73"/><text x="177" y="97">부서</text>
    <rect x="205" y="76" width="95" height="32" fill="#fff4e5" stroke="#ff9f0a" stroke-width="2"/><text x="252" y="97">+ 전화번호</text>
  </g>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#6e6e73">사원 파일의 레코드 형식</text>
  <line x1="62" y1="134" x2="62" y2="196" stroke="#6e6e73" marker-end="url(#a)"/>
  <line x1="160" y1="134" x2="160" y2="196" stroke="#6e6e73" marker-end="url(#a)"/>
  <line x1="258" y1="134" x2="258" y2="196" stroke="#6e6e73" marker-end="url(#a)"/>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="200" width="84" height="66" rx="6" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
    <text x="62" y="222" fill="#1d1d1f" font-weight="600">인사</text><text x="62" y="240" fill="#ff3b30">레코드 정의</text><text x="62" y="256" fill="#ff3b30">수정</text>
    <rect x="118" y="200" width="84" height="66" rx="6" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
    <text x="160" y="222" fill="#1d1d1f" font-weight="600">급여</text><text x="160" y="240" fill="#ff3b30">레코드 정의</text><text x="160" y="256" fill="#ff3b30">수정</text>
    <rect x="216" y="200" width="84" height="66" rx="6" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
    <text x="258" y="222" fill="#1d1d1f" font-weight="600">퇴직금</text><text x="258" y="240" fill="#ff3b30">레코드 정의</text><text x="258" y="256" fill="#ff3b30">수정</text>
  </g>
  <text x="160" y="296" text-anchor="middle" font-size="13" fill="#ff3b30" font-weight="600">프로그램 3개를 모두 고쳐 다시 컴파일</text>
  <text x="160" y="316" text-anchor="middle" font-size="12" fill="#6e6e73">한 곳이라도 빠뜨리면 그 프로그램은</text>
  <text x="160" y="332" text-anchor="middle" font-size="12" fill="#6e6e73">옛 레코드 길이로 읽어 필드 경계가 어긋난다</text>

  <text x="480" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#0a84ff">DBMS</text>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="340" y="76" width="60" height="32" fill="#f2f2f7" stroke="#6e6e73"/><text x="370" y="97">사번</text>
    <rect x="400" y="76" width="70" height="32" fill="#f2f2f7" stroke="#6e6e73"/><text x="435" y="97">이름</text>
    <rect x="470" y="76" width="55" height="32" fill="#f2f2f7" stroke="#6e6e73"/><text x="497" y="97">부서</text>
    <rect x="525" y="76" width="95" height="32" fill="#fff4e5" stroke="#ff9f0a" stroke-width="2"/><text x="572" y="97">+ 전화번호</text>
  </g>
  <text x="480" y="126" text-anchor="middle" font-size="12" fill="#6e6e73">저장 레코드(물리적 구조)</text>
  <line x1="480" y1="132" x2="480" y2="146" stroke="#6e6e73" marker-end="url(#a)"/>
  <rect x="370" y="150" width="220" height="38" rx="6" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="480" y="174" text-anchor="middle" font-size="12" fill="#0a84ff" font-weight="600">DBMS가 사상(mapping)만 갱신</text>
  <line x1="410" y1="190" x2="382" y2="208" stroke="#6e6e73" marker-end="url(#a)"/>
  <line x1="480" y1="190" x2="480" y2="208" stroke="#6e6e73" marker-end="url(#a)"/>
  <line x1="550" y1="190" x2="578" y2="208" stroke="#6e6e73" marker-end="url(#a)"/>
  <g font-size="12" text-anchor="middle">
    <rect x="340" y="212" width="84" height="54" rx="6" fill="#fff" stroke="#34c759" stroke-width="1.5"/>
    <text x="382" y="234" fill="#1d1d1f" font-weight="600">인사</text><text x="382" y="252" fill="#248a3d">수정 없음</text>
    <rect x="438" y="212" width="84" height="54" rx="6" fill="#fff" stroke="#34c759" stroke-width="1.5"/>
    <text x="480" y="234" fill="#1d1d1f" font-weight="600">급여</text><text x="480" y="252" fill="#248a3d">수정 없음</text>
    <rect x="536" y="212" width="84" height="54" rx="6" fill="#fff" stroke="#34c759" stroke-width="1.5"/>
    <text x="578" y="234" fill="#1d1d1f" font-weight="600">퇴직금</text><text x="578" y="252" fill="#248a3d">수정 없음</text>
  </g>
  <text x="480" y="296" text-anchor="middle" font-size="13" fill="#0a84ff" font-weight="600">프로그램은 계속 사번·이름·부서만 요청</text>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#6e6e73">전화번호가 필요한 새 프로그램만</text>
  <text x="480" y="332" text-anchor="middle" font-size="12" fill="#6e6e73">그 열을 질의에 추가한다</text>
</svg>
