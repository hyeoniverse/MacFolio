<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>main에 머지하면 check 뒤에 API가 바뀐 커밋만 이미지를 만들어 GHCR에 올리고, SSH로 서버의 deploy.sh를 부르고, 바깥 /health의 version을 확인한 뒤 프론트엔드를 배포한다</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">main에 머지하면</text>
<text x="32" y="56" font-size="11" fill="#6b7280">서버는 빌드하지 않고 받기만 한다</text>
<rect x="32" y="90" width="120" height="60" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="92.0" y="109" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">check</text>
<text x="92.0" y="126" font-size="10.5" fill="#374151" text-anchor="middle">format·lint·시험</text>
<rect x="190" y="90" width="190" height="60" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="202" y="109" font-size="12" fill="#4f46e5" font-weight="600">api-image</text>
<text x="202" y="126" font-size="10.5" fill="#374151">API가 바뀐 커밋만</text>
<text x="202" y="141.0" font-size="10.5" fill="#374151">amd64 빌드 → GHCR sha-&lt;커밋&gt;</text>
<rect x="418" y="90" width="190" height="60" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="430" y="109" font-size="12" fill="#4f46e5" font-weight="600">api-deploy</text>
<text x="430" y="126" font-size="10.5" fill="#374151">SSH (명령 하나만 되는 키)</text>
<text x="430" y="141.0" font-size="10.5" fill="#374151">ops/deploy.sh sha-&lt;커밋&gt;</text>
<rect x="646" y="90" width="182" height="60" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
<text x="658" y="109" font-size="12" fill="#15803d" font-weight="600">바깥에서 확인</text>
<text x="658" y="126" font-size="10.5" fill="#374151">/health의 version이</text>
<text x="658" y="141.0" font-size="10.5" fill="#374151">이번 커밋인가</text>
<path d="M152 120 H186" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<path d="M380 120 H414" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<path d="M608 120 H642" stroke="#15803d" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<rect x="646" y="176" width="182" height="50" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="658" y="195" font-size="12" fill="#1f2937" font-weight="600">deploy (프론트엔드)</text>
<text x="658" y="212" font-size="10.5" fill="#374151">API 배포가 끝난 뒤에</text>
<path d="M737 150 V172" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
<rect x="190" y="176" width="418" height="132" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4 3"/>
<text x="204" y="196" font-size="12" fill="#1f2937" font-weight="600">서버의 ops/deploy.sh</text>
<text x="204" y="216" font-size="10.5" fill="#374151">① 태그 모양 sha-[0-9a-f]{7,40} · 잠금</text>
<text x="204" y="238" font-size="10.5" fill="#374151">② 배포 직전 DB 백업</text>
<text x="204" y="260" font-size="10.5" fill="#374151">③ ~/deploy/.env의 API_TAG 바꾸기</text>
<text x="204" y="282" font-size="10.5" fill="#374151">④ 없으면 이미지 받기 → 컨테이너 교체</text>
<text x="414" y="216" font-size="10.5" fill="#374151">⑤ healthy + version 확인 (최대 120초)</text>
<text x="414" y="238" font-size="10.5" fill="#374151">⑥ 성공: 지금·이전 이미지만 남김</text>
<text x="414" y="260" font-size="10.5" fill="#b91c1c">⑦ 실패: 이전 태그로 되돌림</text>
<path d="M513 150 V172" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
</svg>
