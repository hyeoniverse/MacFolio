<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>캡처 단계: 바탕화면 판이 먼저, 창이 나중</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker></defs>
  <rect width="800" height="330" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">캡처 단계: 바탕화면 판이 먼저, 창이 나중</text>
  <text x="32" y="68" font-size="12" fill="#6b7280">pointerdown은 바깥에서 안으로 내려간다. 마지막으로 바꾼 쪽이 "지금 쓰는 앱"</text>
  <rect x="32" y="92" width="736" height="200" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="48" y="116" font-size="12" fill="#374151" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.desktop-surface  onPointerDownCapture={focusDesktop}  → Finder</text>
  <rect x="48" y="132" width="300" height="90" rx="8" fill="#eef0ff"/>
  <text x="198.0" y="164.2" font-size="12" text-anchor="middle" fill="#3f46c7" font-weight="600">창 [data-app="memo"]</text>
  <text x="198.0" y="181.2" font-size="11" text-anchor="middle" fill="#3f46c7">onPointerDownCapture</text>
  <text x="198.0" y="198.2" font-size="11" text-anchor="middle" fill="#3f46c7">→ bringAppToFront('memo')</text>
  <rect x="380" y="132" width="180" height="90" rx="8" fill="#f3f4f6"/>
  <text x="470.0" y="164.2" font-size="12" text-anchor="middle" fill="#374151" font-weight="600">메뉴 막대 · Dock</text>
  <text x="470.0" y="181.2" font-size="11" text-anchor="middle" fill="#374151">· 바탕화면</text>
  <text x="470.0" y="198.2" font-size="11" text-anchor="middle" fill="#374151">창 없음 → Finder 그대로</text>
  <rect x="590" y="132" width="160" height="90" rx="8" fill="#dcfce7"/>
  <text x="670.0" y="164.8" font-size="11" text-anchor="middle" fill="#15803d" font-weight="600">포털 메뉴</text>
  <text x="670.0" y="180.8" font-size="10" text-anchor="middle" fill="#15803d">DOM은 body 밑</text>
  <text x="670.0" y="196.8" font-size="10" text-anchor="middle" fill="#15803d">React 트리는 창 안 → 메모</text>
  <text x="48" y="252" font-size="12" fill="#6b7280" text-anchor="start">창 안을 누르면: focusDesktop → bringAppToFront 순서로 불려 앱 이름이 남는다.</text>
  <text x="48" y="272" font-size="12" fill="#6b7280" text-anchor="start">처음에는 판을 display: contents로 두어 크기가 없었고, 바탕화면 클릭이 판에 닿지 않았다.</text>
  <text x="32" y="316" font-size="12" fill="#374151" text-anchor="start">메뉴 막대 이름 = 창 밖을 눌렀으면 Finder, 아니면 foregroundApp(apps) (실행 중이고 최소화되지 않은 창 중 맨 앞)</text>
</svg>
