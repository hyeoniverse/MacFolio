<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>유스케이스 다이어그램의 포함과 확장 관계</title><rect width="640" height="392" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">온라인 서점의 유스케이스 다이어그램</text><circle cx="56" cy="120" r="10" fill="none" stroke="#1d1d1f" stroke-width="1.5"/><line x1="56" y1="130" x2="56" y2="160" stroke="#1d1d1f" stroke-width="1.5"/><line x1="40" y1="140" x2="72" y2="140" stroke="#1d1d1f" stroke-width="1.5"/><line x1="56" y1="160" x2="44" y2="180" stroke="#1d1d1f" stroke-width="1.5"/><line x1="56" y1="160" x2="68" y2="180" stroke="#1d1d1f" stroke-width="1.5"/><text x="56" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">회원</text><circle cx="590" cy="150" r="10" fill="none" stroke="#1d1d1f" stroke-width="1.5"/><line x1="590" y1="160" x2="590" y2="190" stroke="#1d1d1f" stroke-width="1.5"/><line x1="574" y1="170" x2="606" y2="170" stroke="#1d1d1f" stroke-width="1.5"/><line x1="590" y1="190" x2="578" y2="210" stroke="#1d1d1f" stroke-width="1.5"/><line x1="590" y1="190" x2="602" y2="210" stroke="#1d1d1f" stroke-width="1.5"/><text x="590" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">결제 대행사</text><rect x="120" y="44" width="420" height="290" rx="6" fill="none" stroke="#6e6e73" stroke-width="1.5"/><text x="130" y="64" text-anchor="start" font-size="12" font-weight="600" fill="#6e6e73">온라인 서점</text><ellipse cx="240" cy="110" rx="72" ry="24" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/><text x="240" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">도서 주문</text><ellipse cx="240" cy="260" rx="72" ry="24" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/><text x="240" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">도서 검색</text><ellipse cx="440" cy="110" rx="72" ry="24" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/><text x="440" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">로그인</text><ellipse cx="440" cy="190" rx="72" ry="24" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/><text x="440" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">결제</text><ellipse cx="440" cy="290" rx="72" ry="24" fill="#fff4e5" stroke="#0a84ff" stroke-width="1.5"/><text x="440" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">쿠폰 적용</text><line x1="76" y1="150" x2="168" y2="114" stroke="#1d1d1f" stroke-width="1.5"/><line x1="76" y1="160" x2="170" y2="252" stroke="#1d1d1f" stroke-width="1.5"/><line x1="512" y1="190" x2="572" y2="170" stroke="#1d1d1f" stroke-width="1.5"/><line x1="312" y1="110" x2="364" y2="110" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="338" y="100" text-anchor="middle" font-size="11" font-weight="400" fill="#0a84ff">«include»</text><line x1="300" y1="124" x2="372" y2="178" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="318" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#0a84ff">«include»</text><line x1="440" y1="266" x2="440" y2="216" stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="448" y="246" text-anchor="start" font-size="11" font-weight="400" fill="#ff9f0a">«extend»</text><text x="320" y="356" text-anchor="middle" font-size="12" font-weight="400" fill="#0a84ff">include: 기본 기능이 항상 포함 기능을 호출 (주문 → 로그인)</text><text x="320" y="376" text-anchor="middle" font-size="12" font-weight="400" fill="#ff9f0a">extend: 조건이 맞을 때만 확장 기능이 기본 기능에 끼어듦 (쿠폰 적용 → 결제)</text></svg>
