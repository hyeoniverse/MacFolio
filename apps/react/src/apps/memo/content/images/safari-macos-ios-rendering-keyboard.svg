<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>아래에 고정한 입력 막대는 키보드 뒤에 숨고, visualViewport 높이로 위치를 잡으면 키보드 위에 보인다</title>
<rect width="860" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">화면 키보드는 레이아웃 뷰포트를 줄이지 않는다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">iOS에서는 키보드가 올라와도 position: fixed의 기준이 그대로라, 아래에 고정한 입력 막대가 키보드에 가려진다 (도식)</text>
<text x="250" y="88" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">bottom: 0 고정</text>
<text x="250" y="384" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">position: fixed; bottom: 0;</text>
