  <line x1="110" y1="92" x2="148" y2="92" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="150" y="66" width="110" height="52" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
