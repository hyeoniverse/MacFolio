<text x="320" y="276" text-anchor="middle" font-size="12" fill="#6e6e73">도메인: 학년 속성이 가질 수 있는 값의 집합 {1, 2, 3, 4}</text>
<text x="320" y="300" text-anchor="middle" font-size="12" fill="#6e6e73">튜플 사이에 순서가 없고 같은 튜플이 두 번 나오지 않으며, 각 값은 더 쪼갤 수 없는 원자값이다</text></svg>
