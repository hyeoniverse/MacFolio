<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>desktop-core를 화면은 src로, 서버는 dist로 읽고, core를 먼저 빌드하게 한 세 곳</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="820" height="420" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">한 패키지, 두 입구</text>
<text x="32" y="56" font-size="11" fill="#6b7280">package.json exports의 조건으로 읽는 파일이 갈린다</text>
<rect x="300" y="80" width="220" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="410.0" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">packages/desktop-core</text><text x="410.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">src/*.ts  →  tsc  →  dist/*.js</text><rect x="40" y="220" width="260" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="170.0" y="242" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">apps/react (Vite·Vitest)</text><text x="170.0" y="262" font-size="10.5" fill="#374151" text-anchor="middle">조건 source를 켠다</text><text x="170.0" y="278" font-size="10.5" fill="#374151" text-anchor="middle">→ src/memo/index.ts를 바로 읽음</text><text x="170.0" y="294" font-size="10.5" fill="#374151" text-anchor="middle">core 빌드 없이도 돈다</text><rect x="520" y="220" width="260" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="650.0" y="242" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">apps/api (Node)</text><text x="650.0" y="262" font-size="10.5" fill="#374151" text-anchor="middle">조건을 모른다</text><text x="650.0" y="278" font-size="10.5" fill="#374151" text-anchor="middle">→ dist/memo/index.js를 읽음</text><text x="650.0" y="294" font-size="10.5" fill="#374151" text-anchor="middle">core가 먼저 빌드돼야 한다</text><line x1="370" y1="152" x2="190" y2="218" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="280.0" y="179.0" font-size="10" fill="#6b7280" text-anchor="middle">source</text><line x1="450" y1="152" x2="640" y2="218" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="545.0" y="179.0" font-size="10" fill="#6b7280" text-anchor="middle">default · types</text><text x="32" y="340" font-size="11.5" font-weight="600" fill="#1f2937">core를 먼저 빌드하게 한 곳</text><text x="44" y="362" font-size="10.5" fill="#374151">· Turborepo: typecheck·dev가 의존 패키지의 build를 먼저 (^build)</text><text x="44" y="380" font-size="10.5" fill="#374151">· API Dockerfile: core의 package.json도 복사해 설치 → core 빌드 → API 빌드</text><text x="44" y="398" font-size="10.5" fill="#374151">· CI: packages/desktop-core가 바뀌어도 API 이미지를 새로 만든다</text>
</svg>
