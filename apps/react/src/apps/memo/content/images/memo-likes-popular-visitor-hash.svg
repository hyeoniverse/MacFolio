<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>방문자 쿠키를 HMAC으로 바꿔 좋아요 행의 기본 키로 쓰는 과정</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="400" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">같은 브라우저가 두 번 눌러도 행이 하나인 이유</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">토큰과 해시는 설명용 예시 값이다. 실제 토큰은 32자, 해시는 64자 16진수다</text>
<rect x="20" y="70" width="170" height="78" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="105" y="94" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">브라우저 쿠키</text>
<text x="105" y="114" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">macfolio_visitor</text>
<text x="105" y="134" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">= Q3xV…k9 (토큰)</text>
<line x1="190" y1="109" x2="226" y2="109" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="230" y="70" width="210" height="78" rx="10" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="335" y="94" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">hashVisitor (서버)</text>
<text x="335" y="114" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">HMAC-SHA256(비밀 키,</text>
<text x="335" y="134" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"visitor:" + 토큰)</text>
<line x1="440" y1="109" x2="476" y2="109" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="480" y="70" width="140" height="78" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="550" y="94" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">visitorHash</text>
<text x="550" y="114" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">9f2c…e1</text>
<text x="550" y="134" font-size="12" fill="#6e6e73" text-anchor="middle">DB에는 이 값만</text>
<text x="20" y="186" font-size="13" font-weight="700" fill="#1d1d1f">PostLike 테이블, 기본 키 (postSlug, visitorHash)</text>
<rect x="20" y="198" width="360" height="30" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="32" y="218" font-size="12" font-weight="700" fill="#1d1d1f">postSlug</text>
<text x="190" y="218" font-size="12" font-weight="700" fill="#1d1d1f">visitorHash</text>
<rect x="20" y="228" width="360" height="30" fill="#ffffff" stroke="#6e6e73"/>
<text x="32" y="248" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">memo-lock</text>
<text x="190" y="248" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">9f2c…e1</text>
<rect x="20" y="258" width="360" height="30" fill="#ffffff" stroke="#6e6e73"/>
<text x="32" y="278" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">memo-lock</text>
<text x="190" y="278" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">41ab…07</text>
<rect x="400" y="198" width="220" height="60" rx="8" fill="#fff8ec" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="412" y="220" font-size="12" font-weight="700" fill="#1d1d1f">같은 브라우저가 다시 PUT</text>
<text x="412" y="242" font-size="12" fill="#1d1d1f">같은 키 → skipDuplicates로 무시</text>
<line x1="398" y1="243" x2="384" y2="243" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="400" y="266" width="220" height="44" rx="8" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="412" y="293" font-size="12" fill="#1d1d1f">다른 브라우저 → 다른 해시 → 새 행</text>
<line x1="398" y1="283" x2="384" y2="276" stroke="#34c759" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="338" font-size="12" fill="#6e6e73">count = 이 글의 행 수 (2), liked = 요청한 브라우저의 해시로 된 행이 있는지</text>
<text x="20" y="360" font-size="12" fill="#6e6e73">DB가 유출돼도 비밀 키 없이는 9f2c…e1에서 쿠키 토큰을 되돌리거나</text>
<text x="20" y="380" font-size="12" fill="#6e6e73">다른 토큰으로 같은 해시를 만들 수 없다</text>
</svg>
