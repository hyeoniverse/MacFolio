<g stroke="#ff9f0a" stroke-width="2" fill="none">
<path d="M118 92 L160 190" marker-end="url(#ao)"/>
<line x1="182" y1="200" x2="256" y2="200" marker-end="url(#ao)"/>
<line x1="282" y1="200" x2="356" y2="200" marker-end="url(#ao)"/>
<line x1="382" y1="200" x2="456" y2="200" marker-end="url(#ao)"/>
<path d="M482 196 L548 94" marker-end="url(#ao)"/>
</g>
<text x="536" y="160" font-size="12" fill="#b36b00">^2 (둘째 부모)</text>
<rect x="140" y="176" width="360" height="82" rx="10" fill="none" stroke="#ff9f0a" stroke-dasharray="5 4"/>
<text x="24" y="296" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f">git log c069c201d^1..c069c201d^2</text>
<text x="24" y="316" font-size="12" fill="#6e6e73">^2에서 닿고 ^1에서는 닿지 않는 커밋, 곧 점선 안의 브랜치 커밋 4개를 출력한다.</text>
<text x="24" y="340" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f">git log --first-parent</text>
<text x="200" y="340" font-size="12" fill="#6e6e73">파란 선만 따라가 PR 하나를 머지 커밋 한 줄로 출력한다.</text>
