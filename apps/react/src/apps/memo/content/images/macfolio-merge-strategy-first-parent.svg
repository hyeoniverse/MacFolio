<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>머지 커밋 c069c201d의 첫째 부모는 main 쪽 이전 커밋이고 둘째 부모는 PR 212 브랜치의 마지막 커밋이다. --first-parent는 첫째 부모만 따라가고, c069c201d^1..c069c201d^2는 브랜치 커밋 4개를 고른다</title>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker>
</defs>
<rect width="640" height="360" fill="#ffffff"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1d1d1f">머지 커밋의 두 부모와 --first-parent (PR #212)</text>
<text x="24" y="84" font-size="12" fill="#0a84ff">main</text>
<circle cx="110" cy="80" r="13" fill="#e8f1ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="110" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f">7891cbd4e</text>
<text x="60" y="118" font-size="12" fill="#6e6e73">Merge #210</text>
<circle cx="560" cy="80" r="16" fill="#0a84ff"/>
<text x="560" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">M</text>
<text x="560" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f">c069c201d</text>
<text x="600" y="118" text-anchor="middle" font-size="12" fill="#6e6e73">Merge #212</text>
<line x1="123" y1="80" x2="542" y2="80" stroke="#0a84ff" stroke-width="3" marker-start="none"/>
<text x="330" y="72" text-anchor="middle" font-size="12" fill="#0a84ff">^1 (첫째 부모) · git log --first-parent가 따라가는 선</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="middle">
<circle cx="170" cy="200" r="12" fill="#fff4e0" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="170" y="230">5039684a0</text>
