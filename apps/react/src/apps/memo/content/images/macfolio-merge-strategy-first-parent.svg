<text x="370" y="230">160590753</text>
<circle cx="470" cy="200" r="12" fill="#fff4e0" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="470" y="230">0378d6f05</text>
</g>
<g font-size="12" fill="#6e6e73" text-anchor="middle">
<text x="170" y="248">refactor(ui)</text>
<text x="270" y="248">docs(ui)</text>
<text x="370" y="248">docs(ui)</text>
<text x="470" y="248">docs(memo)</text>
