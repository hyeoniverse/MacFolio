<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>storage 이벤트는 값을 쓴 탭에는 오지 않는다</title>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">탭 A에서 메모 검색어를 저장했을 때</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">같은 출처의 두 탭이 localStorage 하나를 공유한다</text>
<rect x="20" y="70" width="200" height="140" rx="10" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="120" y="96" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">탭 A (값을 쓴 탭)</text>
<text x="36" y="124" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">localStorage.setItem(</text>
<text x="48" y="142" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">'macfolio:memo:</text>
<text x="48" y="160" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace"> recent-searches', …)</text>
<text x="36" y="192" font-size="12" fill="#ff3b30">storage 이벤트 없음</text>
<rect x="250" y="100" width="140" height="80" rx="10" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="320" y="132" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">localStorage</text>
<text x="320" y="152" font-size="12" fill="#1d1d1f" text-anchor="middle">출처당 하나</text>
<line x1="222" y1="140" x2="246" y2="140" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#n)"/>
<line x1="392" y1="140" x2="416" y2="140" stroke="#34c759" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="420" y="70" width="200" height="140" rx="10" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="520" y="96" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">탭 B (다른 탭)</text>
<text x="436" y="124" font-size="12" fill="#34c759" font-weight="700">storage 이벤트 수신</text>
<text x="436" y="146" font-size="12" fill="#1d1d1f">key, oldValue, newValue</text>
<text x="436" y="172" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">→ refreshBin()</text>
<text x="436" y="194" font-size="12" fill="#6e6e73">Dock 아이콘 즉시 갱신</text>
<text x="20" y="246" font-size="14" font-weight="700" fill="#1d1d1f">그래서 탭 A는 다른 방법으로 다시 확인한다</text>
<g font-size="12" fill="#1d1d1f">
<rect x="20" y="262" width="190" height="80" rx="8" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="34" y="286" font-weight="700">휴지통에서 비울 때</text>
<text x="34" y="308" font-family="ui-monospace, Menlo, monospace">refreshBin() 직접 호출</text>
<text x="34" y="328" fill="#6e6e73">지연 0</text>
<rect x="225" y="262" width="190" height="80" rx="8" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="239" y="286" font-weight="700">설정을 바꿀 때</text>
<text x="239" y="308">설정 저장소 구독</text>
<text x="239" y="328" fill="#6e6e73">지연 0</text>
<rect x="430" y="262" width="190" height="80" rx="8" fill="#fff8ec" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="444" y="286" font-weight="700">그 밖의 앱이 쓸 때</text>
<text x="444" y="308">2초마다 (보이는 탭만)</text>
<text x="444" y="328" fill="#6e6e73">최대 2초 지연</text>
</g>
</svg>
