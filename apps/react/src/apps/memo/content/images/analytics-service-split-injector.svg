<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>NestJS 인젝터가 생성자 매개변수 타입을 읽어 필요한 인스턴스를 먼저 만들고, Stats에는 Rollup을, Controller에는 Recorder와 Stats를 넣는다</title>
<defs>
<marker id="ia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="ib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
</defs>
<rect width="640" height="400" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">인젝터가 만드는 순서</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">매개변수 타입을 읽어 필요한 인스턴스를 먼저 만든다. ②와 ③은 서로 무관해 순서가 정해지지 않는다</text>

<rect x="24" y="72" width="592" height="40" rx="8" fill="#f2f2f7"/>
<text x="38" y="97" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">providers: [AnalyticsRecorder, AnalyticsRollup, AnalyticsStats]</text>

<rect x="232" y="132" width="176" height="44" rx="8" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/>
<text x="320" y="152" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">① PrismaService</text>
<text x="320" y="168" font-size="12" fill="#6e6e73" text-anchor="middle">DB 연결 (세 서비스 공통)</text>

<rect x="24" y="222" width="176" height="56" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="112" y="244" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">② AnalyticsRecorder</text>
<text x="112" y="264" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">(prisma, config)</text>

<rect x="232" y="222" width="176" height="56" rx="8" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="320" y="244" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">③ AnalyticsRollup</text>
<text x="320" y="264" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">(prisma)</text>

<rect x="440" y="222" width="176" height="56" rx="8" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="528" y="244" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">④ AnalyticsStats</text>
<text x="528" y="264" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">(prisma, rollup)</text>

<path d="M280 176 L136 220" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ia)"/>
<path d="M320 176 V220" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ia)"/>
<path d="M360 176 L504 220" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ia)"/>
<path d="M408 250 H438" stroke="#0a84ff" stroke-width="2" marker-end="url(#ib)"/>

<rect x="132" y="322" width="376" height="48" rx="8" fill="#0a84ff"/>
<text x="320" y="342" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⑤ AnalyticsController</text>
<text x="320" y="360" font-size="12" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">(recorder, stats)</text>
<path d="M112 278 L200 320" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ia)"/>
<path d="M528 278 L440 320" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ia)"/>
<text x="320" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">Rollup은 컨트롤러에 주입하지 않는다</text>
</svg>
