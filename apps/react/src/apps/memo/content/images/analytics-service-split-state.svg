<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>상태는 그것을 쓰는 서비스 안으로</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">상태는 그것을 쓰는 서비스 안으로</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">나누기 전에는 세 가지 상태가 한 클래스의 필드였다</text>
<rect x="32" y="90" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="157.0" y="143.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">AnalyticsRecorder</text>
<text x="157.0" y="160.5" font-size="11" fill="#374151" text-anchor="middle">batches: Map&lt;ip, 1분 묶음 수&gt;</text>
<text x="157.0" y="177.5" font-size="11" fill="#374151" text-anchor="middle"></text>
<text x="157.0" y="194.5" font-size="11" fill="#374151" text-anchor="middle">record()</text>
<rect x="305" y="90" width="250" height="150" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="430.0" y="126.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">AnalyticsRollup</text>
<text x="430.0" y="143.5" font-size="11" fill="#374151" text-anchor="middle">timer (한 시간마다)</text>
<text x="430.0" y="160.5" font-size="11" fill="#374151" text-anchor="middle">maintainedAt (5분 간격)</text>
<text x="430.0" y="177.5" font-size="11" fill="#374151" text-anchor="middle"></text>
<text x="430.0" y="194.5" font-size="11" fill="#374151" text-anchor="middle">maintain · maintainIfStale</text>
<text x="430.0" y="211.5" font-size="11" fill="#374151" text-anchor="middle">rowsBetween</text>
<rect x="578" y="90" width="250" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="703.0" y="126.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">AnalyticsStats</text>
<text x="703.0" y="143.5" font-size="11" fill="#374151" text-anchor="middle">today (오늘 방문자, 1분)</text>
<text x="703.0" y="160.5" font-size="11" fill="#374151" text-anchor="middle">publicCache: Map (1분)</text>
<text x="703.0" y="177.5" font-size="11" fill="#374151" text-anchor="middle"></text>
<text x="703.0" y="194.5" font-size="11" fill="#374151" text-anchor="middle">todayVisitors · summary</text>
<text x="703.0" y="211.5" font-size="11" fill="#374151" text-anchor="middle">views · live</text>
<line x1="578" y1="190" x2="559" y2="190" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<text x="568" y="262" font-size="11" fill="#b45309" text-anchor="middle">Stats → Rollup만 의존</text>
<text x="32" y="282" font-size="11" fill="#6b7280" text-anchor="start">Recorder와 Rollup은 서로 모른다. 셋 다 PrismaService를 받는다</text>
</svg>
