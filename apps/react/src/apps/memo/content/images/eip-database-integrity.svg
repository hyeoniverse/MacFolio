<text x="470.0" y="88.32" text-anchor="middle" font-size="12" fill="#1d1d1f">CS</text>
<text x="560.0" y="88.32" text-anchor="middle" font-size="12" fill="#1d1d1f">컴퓨터공학</text>
<text x="470.0" y="114.32" text-anchor="middle" font-size="12" fill="#1d1d1f">BA</text>
<text x="560.0" y="114.32" text-anchor="middle" font-size="12" fill="#1d1d1f">경영</text>
