<text x="349" y="78" text-anchor="middle" font-size="12" fill="#0a84ff">외래키 → 기본키</text>
<text x="282" y="140" text-anchor="start" font-size="12" fill="#ff453a">← 학과에 없는 값: 거부</text>
<text x="282" y="166" text-anchor="start" font-size="12" fill="#6e6e73">← NULL: 허용</text>
<text x="320" y="220" text-anchor="middle" font-size="13" fill="#1d1d1f">외래키 값은 참조되는 릴레이션의 기본키 값 중 하나이거나 NULL이어야 한다</text>
<text x="320" y="248" text-anchor="middle" font-size="12" fill="#6e6e73">학과에서 CS 행을 삭제하면 학생 1001이 없는 학과를 가리키게 되므로</text>
<text x="320" y="268" text-anchor="middle" font-size="12" fill="#6e6e73">RESTRICT(거부), CASCADE(함께 삭제), SET NULL(NULL로 변경) 중 하나로 처리한다</text></svg>
