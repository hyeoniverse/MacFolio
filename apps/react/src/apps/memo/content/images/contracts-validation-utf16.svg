<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>문자열 '가😀'는 코드 포인트 두 개이지만 UTF-16 코드 단위로는 세 개라서 length는 3, Array.from의 길이는 2이고, slice(0, 2)는 이모지의 서로게이트 쌍 절반만 남긴다</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">'가😀'를 세는 두 가지 단위</text>

<text x="20" y="66" font-size="12" font-weight="700" fill="#6e6e73">문자</text>
<rect x="130" y="48" width="110" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="178" y="68" font-size="14" fill="#1d1d1f">가</text>
<rect x="250" y="48" width="220" height="30" rx="6" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="352" y="68" font-size="14" fill="#1d1d1f">😀</text>

<text x="20" y="112" font-size="12" font-weight="700" fill="#6e6e73">코드 포인트</text>
<g font-size="12" font-family="SFMono-Regular, Menlo, monospace">
<rect x="130" y="94" width="110" height="30" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="158" y="114" fill="#1d1d1f">U+AC00</text>
<rect x="250" y="94" width="220" height="30" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="330" y="114" fill="#1d1d1f">U+1F600</text>
</g>
<text x="490" y="114" font-size="12" fill="#248a3d">Array.from → 2</text>

<text x="20" y="158" font-size="12" font-weight="700" fill="#6e6e73">UTF-16 코드 단위</text>
<g font-size="12" font-family="SFMono-Regular, Menlo, monospace">
<rect x="130" y="140" width="110" height="30" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="168" y="160" fill="#1d1d1f">AC00</text>
<rect x="250" y="140" width="105" height="30" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="285" y="160" fill="#1d1d1f">D83D</text>
<rect x="365" y="140" width="105" height="30" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="400" y="160" fill="#1d1d1f">DE00</text>
</g>
<text x="490" y="160" font-size="12" fill="#0a84ff">.length → 3</text>
<text x="250" y="190" font-size="12" fill="#6e6e73">상위·하위 서로게이트 두 개가 문자 하나</text>

<rect x="20" y="210" width="600" height="110" rx="8" fill="#f2f2f7"/>
<text x="34" y="234" font-size="13" font-weight="700" fill="#1d1d1f">2자로 자르면</text>
<g font-size="12" font-family="SFMono-Regular, Menlo, monospace">
<text x="34" y="260" fill="#1d1d1f">'가😀'.slice(0, 2)</text>
<text x="250" y="260" fill="#ff3b30">'가\uD83D'  (하위 서로게이트가 없어 깨진 문자 �)</text>
<text x="34" y="290" fill="#1d1d1f">Array.from('가😀').slice(0, 2).join('')</text>
<text x="370" y="290" fill="#248a3d">'가😀'</text>
</g>
<text x="34" y="310" font-size="12" fill="#6e6e73">PostgreSQL char_length('가😀')도 2 (코드 포인트 기준)</text>

<line x1="20" y1="342" x2="620" y2="342" stroke="#e5e5ea"/>
<text x="20" y="364" font-size="12" fill="#6e6e73">U+FFFF 이하(한글 음절 등)는 코드 단위 1개, 그보다 큰 문자(대부분의 이모지)는 코드 단위 2개로 저장된다</text>
<text x="20" y="382" font-size="12" fill="#6e6e73">contracts의 길이 검사는 서버·DB와 같은 코드 포인트 기준으로 집계한다</text>
</svg>
