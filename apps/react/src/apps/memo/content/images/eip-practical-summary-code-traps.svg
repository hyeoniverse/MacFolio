<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 454" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>언어별 코드 출력 함정 체크리스트</title><rect width="640" height="454" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">출력값을 쓰기 전에 확인할 함정</text>
<g font-size="13">
<rect x="20" y="46" width="600" height="28" rx="6" fill="#e8f2ff"/><text x="34" y="65" font-weight="600" fill="#0a84ff">C</text>
<rect x="28" y="86" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="97" fill="#1d1d1f">7 / 2 → 3, (double)7 / 2 → 3.5</text>
<rect x="328" y="86" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="97" fill="#1d1d1f">-7 % 3 → -1 (왼쪽 피연산자 부호)</text>
<rect x="28" y="114" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="125" fill="#1d1d1f">b = a++ → b는 증가 전 값</text>
<rect x="328" y="114" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="125" fill="#1d1d1f">break 없는 case는 아래 case까지 실행</text>
<rect x="28" y="142" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="153" fill="#1d1d1f">sizeof("abc") → 4 (널 문자 포함)</text>
<rect x="328" y="142" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="153" fill="#1d1d1f">static 지역 변수는 처음 한 번만 초기화</text>
<rect x="20" y="174" width="600" height="28" rx="6" fill="#e8f2ff"/><text x="34" y="193" font-weight="600" fill="#0a84ff">Java</text>
<rect x="28" y="214" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="225" fill="#1d1d1f">부모 타입 변수의 메서드 호출 → 자식 메서드</text>
<rect x="328" y="214" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="225" fill="#1d1d1f">같은 이름 필드 → 변수 타입(부모)의 필드</text>
<rect x="28" y="242" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="253" fill="#1d1d1f">자식 생성 시 부모 생성자가 먼저 출력</text>
<rect x="328" y="242" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="253" fill="#1d1d1f">"A" + 1 + 2 → A12, 1 + 2 + "A" → 3A</text>
<rect x="28" y="270" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="281" fill="#1d1d1f">== 은 같은 객체인지, equals는 내용</text>
<rect x="328" y="270" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="281" fill="#1d1d1f">try의 return 전에 finally가 실행</text>
<rect x="20" y="302" width="600" height="28" rx="6" fill="#e8f2ff"/><text x="34" y="321" font-weight="600" fill="#0a84ff">Python</text>
<rect x="28" y="342" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="353" fill="#1d1d1f">s[1:4] → 인덱스 4는 제외</text>
<rect x="328" y="342" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="353" fill="#1d1d1f">7 / 2 → 3.5, -7 // 2 → -4</text>
<rect x="28" y="370" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="381" fill="#1d1d1f">b = a 이후 b를 바꾸면 a도 바뀜</text>
<rect x="328" y="370" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="381" fill="#1d1d1f">기본 인자 box=[]는 호출 사이에 누적</text>
<rect x="28" y="398" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="48" y="409" fill="#1d1d1f">뒤의 if는 거르기, 앞의 if-else는 값 고르기</text>
<rect x="328" y="398" width="12" height="12" rx="2" fill="none" stroke="#6e6e73"/><text x="348" y="409" fill="#1d1d1f">print는 사이에 공백, 끝에 줄바꿈</text>
</g>
<text x="320" y="438" text-anchor="middle" font-size="12" fill="#6e6e73">출력문의 공백·줄바꿈·따옴표까지 답의 일부다</text>
</svg>
