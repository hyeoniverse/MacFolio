<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="760" height="380" fill="#fff"/>
  <text x="380.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">오류 하나가 응답과 로그로 나가는 길</text>
<rect x="20" y="60" width="150" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="95.0" y="92.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">던져진 오류</text>
<rect x="210" y="50" width="240" height="76" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="330.0" y="76.0" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="600">전역 예외 필터 (@Catch())</text>
<text x="330.0" y="92.0" font-size="10.5" fill="#4b5563" text-anchor="middle">HttpException?</text>
<text x="330.0" y="108.0" font-size="10.5" fill="#4b5563" text-anchor="middle">http-errors: status 4xx + expose?</text>
<line x1="170" y1="88" x2="208" y2="88" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="50" width="240" height="76" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="620.0" y="76.0" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">그 상태로 답한다</text>
<text x="620.0" y="92.0" font-size="10.5" fill="#4b5563" text-anchor="middle">413 &quot;요청이 너무 큽니다.&quot;</text>
<text x="620.0" y="108.0" font-size="10.5" fill="#4b5563" text-anchor="middle">로그 없음</text>
<line x1="450" y1="88" x2="498" y2="88" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="465" y="80" font-size="10.5" fill="#6b7280" text-anchor="start">예</text>
<rect x="210" y="170" width="240" height="60" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="330.0" y="196.0" font-size="11" fill="#e11d48" text-anchor="middle" font-weight="600">500으로 감춘다</text>
<text x="330.0" y="212.0" font-size="10.5" fill="#4b5563" text-anchor="middle">응답에 내부 내용 없음</text>
<line x1="330" y1="126" x2="330" y2="168" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="336" y="152" font-size="10.5" fill="#6b7280" text-anchor="start">아니오</text>
<rect x="210" y="270" width="240" height="70" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="330.0" y="293.0" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="600">SafeLogger (ConsoleLogger 상속)</text>
<text x="330.0" y="309.0" font-size="10.5" fill="#4b5563" text-anchor="middle">GET /posts → 500 + 오류</text>
<text x="330.0" y="325.0" font-size="10.5" fill="#4b5563" text-anchor="middle">여섯 메서드가 모두 가린다</text>
<line x1="330" y1="230" x2="330" y2="268" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="250" width="240" height="110" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text x="620.0" y="270.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="600">가린 뒤 stdout</text>
<text x="620.0" y="285.5" font-size="10.0" fill="#4b5563" text-anchor="middle">postgresql://u:***@db</text>
<text x="620.0" y="301.0" font-size="10.0" fill="#4b5563" text-anchor="middle">Bearer ***</text>
<text x="620.0" y="316.5" font-size="10.0" fill="#4b5563" text-anchor="middle">session=***</text>
<text x="620.0" y="332.0" font-size="10.0" fill="#4b5563" text-anchor="middle">re_… · gsk_… · ghp_… → ***</text>
<text x="620.0" y="347.5" font-size="10.0" fill="#4b5563" text-anchor="middle">m***@example.com</text>
<line x1="450" y1="305" x2="498" y2="305" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
