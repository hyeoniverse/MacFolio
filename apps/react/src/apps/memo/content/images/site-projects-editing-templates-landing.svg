<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"><title>landingOf가 프로젝트를 첫 화면, 차례가 정해진 구역들, 마무리로 바꾸고 템플릿은 이것만 읽는다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs><rect width="860" height="340" rx="16" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#1f2937">내용은 하나로 (landingOf), 템플릿은 여럿으로</text><rect x="28" y="70" width="160" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="108.0" y="92" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">Project</text><text x="108.0" y="110" font-size="10.5" fill="#4b5563" text-anchor="middle">코드 기본값 + 덮어쓸 값</text><text x="108.0" y="125" font-size="10.5" fill="#4b5563" text-anchor="middle">이름·소개·기능·그림…</text><text x="108.0" y="140" font-size="10.5" fill="#4b5563" text-anchor="middle">트러블슈팅·팀원·배포</text><rect x="224" y="70" width="140" height="110" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="294.0" y="92" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">landingOf()</text><text x="294.0" y="110" font-size="10.5" fill="#4b5563" text-anchor="middle">순수 함수</text><text x="294.0" y="125" font-size="10.5" fill="#4b5563" text-anchor="middle">값 없는 구역은</text><text x="294.0" y="140" font-size="10.5" fill="#4b5563" text-anchor="middle">만들지 않는다</text><rect x="400" y="56" width="200" height="270" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="500" y="76" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">첫 화면 → 구역 → 마무리</text><text x="418" y="96.0" font-size="10.5" fill="#374151">1. 숫자</text><text x="418" y="112.5" font-size="10.5" fill="#374151">2. 주요 기능</text><text x="418" y="129.0" font-size="10.5" fill="#374151">3. 화면 모음</text><text x="418" y="145.5" font-size="10.5" fill="#374151">4. 쓰는 법</text><text x="418" y="162.0" font-size="10.5" fill="#374151">5. 구현 방법</text><text x="418" y="178.5" font-size="10.5" fill="#374151">6. 트러블슈팅</text><text x="418" y="195.0" font-size="10.5" fill="#374151">7. 더 들려줄 이야기</text><text x="418" y="211.5" font-size="10.5" fill="#374151">8. 조작법</text><text x="418" y="228.0" font-size="10.5" fill="#374151">9. 기술 사양</text><text x="418" y="244.5" font-size="10.5" fill="#374151">10. 팀원</text><text x="418" y="261.0" font-size="10.5" fill="#374151">11. 내 역할</text><text x="418" y="277.5" font-size="10.5" fill="#374151">12. 진행 과정</text><text x="418" y="294.0" font-size="10.5" fill="#374151">13. 배포 결과물</text><text x="418" y="310.5" font-size="10.5" fill="#374151">14. 출처</text><path d="M188 125 L222 125" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M364 125 L398 125" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="650" y="60" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="76" font-size="10.5" fill="#065f46" text-anchor="middle">제품</text><rect x="650" y="89" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="105" font-size="10.5" fill="#065f46" text-anchor="middle">카드 (새 프로젝트 기본)</text><rect x="650" y="118" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="134" font-size="10.5" fill="#065f46" text-anchor="middle">문서</text><rect x="650" y="147" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="163" font-size="10.5" fill="#065f46" text-anchor="middle">벤토</text><rect x="650" y="176" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="192" font-size="10.5" fill="#065f46" text-anchor="middle">키노트</text><rect x="650" y="205" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="221" font-size="10.5" fill="#065f46" text-anchor="middle">매거진</text><rect x="650" y="234" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="250" font-size="10.5" fill="#065f46" text-anchor="middle">개발자 도구</text><rect x="650" y="263" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="279" font-size="10.5" fill="#065f46" text-anchor="middle">저장소 (README·docs 탭)</text><rect x="650" y="292" width="184" height="24" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/><text x="742" y="308" font-size="10.5" fill="#065f46" text-anchor="middle">놀이</text><path d="M600 190 L646 190" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="28" y="222" font-size="10.5" fill="#6b7280">구역을 그리는 함수 묶음은 구역 종류를</text><text x="28" y="238" font-size="10.5" fill="#6b7280">하나도 빠뜨릴 수 없게 타입으로 막았다.</text><text x="28" y="264" font-size="10.5" fill="#6b7280">그래서 어떤 템플릿을 골라도</text><text x="28" y="280" font-size="10.5" fill="#6b7280">편집 화면에서 채운 칸이 모두 보인다.</text></svg>