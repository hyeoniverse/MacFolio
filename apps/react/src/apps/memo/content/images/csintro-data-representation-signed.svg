<g font-size="12"><rect x="30" y="190" width="580" height="120" rx="8" fill="#f2f2f7"/><text x="50" y="216" fill="#1d1d1f">부호-절댓값: 1000이 -0. 범위 -7 ~ +7</text><text x="50" y="242" fill="#1d1d1f">1의 보수: 1111이 -0. 범위 -7 ~ +7</text><text x="50" y="268" fill="#0a84ff">2의 보수: 0이 하나뿐이고 1000이 -8. 범위 -8 ~ +7</text><text x="50" y="294" fill="#ff3b30">빨간 값: 0을 두 번 표현하는 패턴</text></g></svg>
