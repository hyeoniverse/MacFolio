<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>SQL 처리 순서와 절마다 쓸 수 있는 것</title><rect width="640" height="410" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">쓰는 순서는 SELECT부터, 처리 순서는 FROM부터</text>
<g font-size="13" font-weight="600" fill="#6e6e73"><text x="34" y="60">처리</text><text x="90" y="60">절</text><text x="220" y="60">하는 일</text><text x="510" y="60">집계 함수</text></g>
<g font-size="13">
<rect x="20" y="72" width="600" height="40" rx="8" fill="#f2f2f7"/><text x="40" y="97" font-weight="600" fill="#0a84ff">1</text><text x="90" y="97" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">FROM</text><text x="220" y="97" fill="#1d1d1f">테이블을 읽고 조인한다</text><text x="510" y="97" fill="#ff453a" font-weight="600">불가</text>
<rect x="20" y="120" width="600" height="40" rx="8" fill="#fff4e5"/><text x="40" y="145" font-weight="600" fill="#0a84ff">2</text><text x="90" y="145" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">WHERE</text><text x="220" y="145" fill="#1d1d1f">그룹 전의 행을 거른다</text><text x="510" y="145" fill="#ff453a" font-weight="600">불가</text>
<rect x="20" y="168" width="600" height="40" rx="8" fill="#f2f2f7"/><text x="40" y="193" font-weight="600" fill="#0a84ff">3</text><text x="90" y="193" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">GROUP BY</text><text x="220" y="193" fill="#1d1d1f">같은 값끼리 그룹으로 묶는다</text><text x="510" y="193" fill="#6e6e73" font-weight="600">기준 열 지정</text>
<rect x="20" y="216" width="600" height="40" rx="8" fill="#fff4e5"/><text x="40" y="241" font-weight="600" fill="#0a84ff">4</text><text x="90" y="241" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">HAVING</text><text x="220" y="241" fill="#1d1d1f">묶은 그룹을 거른다</text><text x="510" y="241" fill="#30d158" font-weight="600">가능</text>
<rect x="20" y="264" width="600" height="40" rx="8" fill="#f2f2f7"/><text x="40" y="289" font-weight="600" fill="#0a84ff">5</text><text x="90" y="289" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">SELECT</text><text x="220" y="289" fill="#1d1d1f">열을 고르고 별칭을 만든다</text><text x="510" y="289" fill="#30d158" font-weight="600">가능</text>
<rect x="20" y="312" width="600" height="40" rx="8" fill="#f2f2f7"/><text x="40" y="337" font-weight="600" fill="#0a84ff">6</text><text x="90" y="337" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">ORDER BY</text><text x="220" y="337" fill="#1d1d1f">결과를 정렬한다 (별칭 사용 가능)</text><text x="510" y="337" fill="#30d158" font-weight="600">가능</text>
</g>
<text x="320" y="374" text-anchor="middle" font-size="12" fill="#6e6e73">집계 함수가 들어간 조건은 HAVING, 그룹으로 묶기 전 행 조건은 WHERE (주황 두 줄)</text>
<text x="320" y="394" text-anchor="middle" font-size="12" fill="#6e6e73">별칭은 SELECT에서 생기므로 WHERE에서는 쓸 수 없고 ORDER BY에서는 쓸 수 있다</text>
</svg>
