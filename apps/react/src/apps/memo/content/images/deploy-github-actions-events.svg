<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>main push는 check 후 deploy, 같은 저장소 PR은 check와 preview, 포크 PR은 check만 실행한다</title>
<rect width="640" height="300" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">이벤트별로 실행되는 작업 (#82 시점)</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">각 작업의 if 조건이 github.event_name, github.ref, PR의 head 저장소를 확인한다</text>
<rect x="24" y="72" width="592" height="30" rx="6" fill="#f2f2f7"/>
<text x="36" y="92" font-size="12.5" font-weight="600" fill="#1d1d1f">이벤트</text>
<text x="300" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">check</text>
<text x="420" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">deploy</text>
<text x="540" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">preview</text>
<text x="36" y="132" font-size="12.5" fill="#1d1d1f">main에 push (PR 머지 포함)</text>
<rect x="262" y="114" width="76" height="26" rx="13" fill="#eafaef"/><text x="300" y="132" font-size="12" text-anchor="middle" fill="#1d1d1f">실행</text>
<rect x="374" y="114" width="92" height="26" rx="13" fill="#eaf3ff" stroke="#0a84ff"/><text x="420" y="132" font-size="12" text-anchor="middle" fill="#0a84ff">check 통과 후</text>
<text x="540" y="132" font-size="12" text-anchor="middle" fill="#6e6e73">건너뜀</text>
<line x1="24" y1="150" x2="616" y2="150" stroke="#e5e5ea"/>
<text x="36" y="176" font-size="12.5" fill="#1d1d1f">같은 저장소 브랜치의 PR</text>
<rect x="262" y="158" width="76" height="26" rx="13" fill="#eafaef"/><text x="300" y="176" font-size="12" text-anchor="middle" fill="#1d1d1f">실행</text>
<text x="420" y="176" font-size="12" text-anchor="middle" fill="#6e6e73">건너뜀</text>
<rect x="494" y="158" width="92" height="26" rx="13" fill="#fff7eb" stroke="#ff9f0a"/><text x="540" y="176" font-size="12" text-anchor="middle" fill="#1d1d1f">미리보기 업로드</text>
<line x1="24" y1="194" x2="616" y2="194" stroke="#e5e5ea"/>
<text x="36" y="220" font-size="12.5" fill="#1d1d1f">포크에서 연 PR</text>
<rect x="262" y="202" width="76" height="26" rx="13" fill="#eafaef"/><text x="300" y="220" font-size="12" text-anchor="middle" fill="#1d1d1f">실행</text>
<text x="420" y="220" font-size="12" text-anchor="middle" fill="#6e6e73">건너뜀</text>
<text x="540" y="220" font-size="12" text-anchor="middle" fill="#ff3b30">건너뜀 (Secrets 없음)</text>
<rect x="24" y="242" width="592" height="42" rx="8" fill="#f2f2f7"/>
<text x="38" y="261" font-size="12" fill="#1d1d1f">deploy는 needs: check라 check가 실패하면 시작하지 않는다. 실제 사이트를 바꾸는 작업은</text>
<text x="38" y="277" font-size="12" fill="#1d1d1f">main push의 deploy 하나뿐이고, PR의 preview는 별도 버전만 업로드한다.</text>
</svg>
