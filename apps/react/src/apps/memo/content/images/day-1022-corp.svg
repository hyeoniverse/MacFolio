<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>Safari가 분석 이벤트 응답을 취소하던 과정</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16a34a"/></marker></defs>
<rect width="760" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="16" font-weight="700" fill="#1f2937">전: helmet 기본값 same-origin</text>
<rect x="32" y="56" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="132" y="80" font-size="14" fill="#111827" text-anchor="middle">Safari</text><text x="132" y="99" font-size="11" fill="#6b7280" text-anchor="middle">macfolio.hyeoniverse.com</text>
<rect x="528" y="56" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="628" y="80" font-size="14" fill="#111827" text-anchor="middle">API</text><text x="628" y="99" font-size="11" fill="#6b7280" text-anchor="middle">macfolio-api.hyeoniverse.com</text>
<path d="M236 70 H522" stroke="#374151" marker-end="url(#a)"/><text x="380" y="64" font-size="11.5" fill="#374151" text-anchor="middle">sendBeacon POST /analytics/events (no-cors)</text>
<path d="M524 96 H240" stroke="#dc2626" stroke-dasharray="5 4" marker-end="url(#r)"/><text x="380" y="114" font-size="11.5" fill="#dc2626" text-anchor="middle">204 · Cross-Origin-Resource-Policy: same-origin</text>
<rect x="32" y="128" width="696" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="380" y="153" font-size="13" fill="#b91c1c" text-anchor="middle">출처가 달라 Safari가 응답을 취소한다. 콘솔에 5초마다 오류 3줄</text>
<text x="32" y="222" font-size="16" font-weight="700" fill="#1f2937">후: /analytics/events만 cross-origin</text>
<rect x="32" y="238" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="132" y="262" font-size="14" fill="#111827" text-anchor="middle">Safari</text><text x="132" y="281" font-size="11" fill="#6b7280" text-anchor="middle">macfolio.hyeoniverse.com</text>
<rect x="528" y="238" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="628" y="262" font-size="14" fill="#111827" text-anchor="middle">API</text><text x="628" y="281" font-size="11" fill="#6b7280" text-anchor="middle">macfolio-api.hyeoniverse.com</text>
<path d="M236 252 H522" stroke="#374151" marker-end="url(#a)"/><text x="380" y="246" font-size="11.5" fill="#374151" text-anchor="middle">sendBeacon POST /analytics/events (no-cors)</text>
<path d="M524 278 H240" stroke="#16a34a" marker-end="url(#g)"/><text x="380" y="296" font-size="11.5" fill="#16a34a" text-anchor="middle">204 · Cross-Origin-Resource-Policy: cross-origin</text>
<rect x="32" y="310" width="696" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="380" y="335" font-size="13" fill="#15803d" text-anchor="middle">응답을 정상 처리한다. 다른 경로(/health 등)는 same-origin 유지</text>
<text x="32" y="380" font-size="11.5" fill="#6b7280">CORS는 cors 모드 요청(fetch)의 응답 열람을, CORP는 no-cors 요청(img, sendBeacon)의 응답 전달을 정한다</text>
</svg>
