<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">900px에서 떠난 글로 돌아왔을 때 본문의 scrollTop</text>

  <!-- 축 -->
  <line x1="80" y1="70" x2="80" y2="270" stroke="#6e6e73"/>
  <line x1="80" y1="270" x2="610" y2="270" stroke="#6e6e73"/>
  <rect x="72" y="196" width="16" height="10" fill="#fff"/>
  <line x1="72" y1="200" x2="88" y2="194" stroke="#6e6e73"/>
  <line x1="72" y1="208" x2="88" y2="202" stroke="#6e6e73"/>
  <text x="70" y="230" font-size="11.5" fill="#6e6e73" text-anchor="end">(축 생략)</text>
  <text x="70" y="104" font-size="12" fill="#6e6e73" text-anchor="end">950px</text>
  <text x="70" y="154" font-size="12" fill="#6e6e73" text-anchor="end">900px</text>
  <text x="70" y="274" font-size="12" fill="#6e6e73" text-anchor="end">0</text>
  <line x1="80" y1="100" x2="610" y2="100" stroke="#f2f2f7"/>
  <line x1="80" y1="150" x2="610" y2="150" stroke="#f2f2f7"/>
  <text x="96" y="292" font-size="12" fill="#6e6e73" text-anchor="middle">0</text>
  <text x="200" y="292" font-size="12" fill="#6e6e73" text-anchor="middle">목차·편집기 렌더링</text>
  <text x="560" y="292" font-size="12" fill="#6e6e73" text-anchor="middle">40프레임 (약 0.6초)</text>
  <text x="345" y="312" font-size="12" fill="#6e6e73" text-anchor="middle">돌아온 뒤 경과한 프레임</text>
  <line x1="200" y1="78" x2="200" y2="270" stroke="#c7c7cc" stroke-dasharray="4 3"/>
  <line x1="560" y1="78" x2="560" y2="270" stroke="#c7c7cc" stroke-dasharray="4 3"/>

  <!-- 한 번만 맞춘 경우 -->
  <path d="M96,270 L96,150 L200,150 L206,100 L610,100" fill="none" stroke="#ff3b30" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="90" font-size="12" fill="#ff3b30" text-anchor="middle">한 번만 맞춘 경우: 스크롤 앵커링이 950px로 옮긴 채 남는다</text>

  <!-- 매 프레임 맞춘 경우 -->
  <path d="M96,270 L96,150 L200,150 L206,100 L212,150 L610,150" fill="none" stroke="#0a84ff" stroke-width="2.5"/>
  <text x="400" y="176" font-size="12" fill="#0a84ff" text-anchor="middle">매 프레임 다시 맞춘 경우: 다음 프레임에 900px로 돌아온다</text>
  <circle cx="96" cy="150" r="4" fill="#0a84ff"/>
  <text x="104" y="140" font-size="12" fill="#1d1d1f">scrollTop = 900</text>

  <rect x="112" y="214" width="420" height="40" rx="6" fill="#f2f2f7"/>
  <text x="124" y="238" font-size="12" fill="#1d1d1f">40프레임 안에 휠·터치 입력이 들어오면 즉시 맞추기를 멈춘다</text>

  <text x="320" y="342" font-size="12" fill="#6e6e73" text-anchor="middle">보이던 문단 위쪽의 높이가 늦게 바뀌면, 브라우저는 그 문단을 화면에 유지하려고 scrollTop을 옮긴다</text>
</svg>
