<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>공유기 뒤의 기기들은 서버에 같은 공인 IP로 보이므로, 관리자 노트북이 로그인한 뒤에는 같은 공유기의 다른 방문자도 제외되고, LTE로 바뀐 휴대폰은 관리자 요청이 한 번 있기 전까지 집계된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="380" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">서버가 보는 IP는 기기가 아니라 공유기의 공인 IP</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">IP는 문서용 예시 대역. 관리자 노트북이 로그인해 198.51.100.20이 AdminIp에 기록된 뒤의 상황</text>

<!-- 집 -->
<rect x="24" y="72" width="300" height="214" rx="10" fill="#f2f2f7"/>
<text x="40" y="94" font-size="12" fill="#6e6e73">같은 공유기 (사설 IP 192.168.0.x)</text>
<g font-size="12" text-anchor="middle">
<rect x="40" y="108" width="128" height="46" rx="6" fill="#ffffff" stroke="#0a84ff"/>
<text x="104" y="128" fill="#1d1d1f">관리자 노트북</text>
<text x="104" y="146" fill="#0a84ff">로그인함</text>
<rect x="40" y="164" width="128" height="46" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<text x="104" y="184" fill="#1d1d1f">관리자 휴대폰</text>
<text x="104" y="202" fill="#6e6e73">로그인 안 함</text>
<rect x="40" y="220" width="128" height="46" rx="6" fill="#ffffff" stroke="#ff9f0a"/>
<text x="104" y="240" fill="#1d1d1f">가족의 태블릿</text>
<text x="104" y="258" fill="#ff9f0a">일반 방문자</text>
<rect x="200" y="150" width="108" height="72" rx="8" fill="#ffffff" stroke="#1d1d1f"/>
<text x="254" y="176" fill="#1d1d1f" font-weight="600">공유기</text>
<text x="254" y="196" fill="#6e6e73">공인 IP</text>
<text x="254" y="212" fill="#1d1d1f">198.51.100.20</text>
</g>
<line x1="168" y1="131" x2="198" y2="170" stroke="#6e6e73"/>
<line x1="168" y1="187" x2="198" y2="187" stroke="#6e6e73"/>
<line x1="168" y1="243" x2="198" y2="204" stroke="#6e6e73"/>
<line x1="308" y1="186" x2="386" y2="186" stroke="#6e6e73" marker-end="url(#a)"/>

<!-- 서버 -->
<rect x="390" y="120" width="226" height="132" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="503" y="144" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">API 서버</text>
<g font-size="12" fill="#1d1d1f">
<text x="406" y="168">세 기기 모두 198.51.100.20</text>
<text x="406" y="188">isAdminIp → 참</text>
<text x="406" y="212" fill="#248a3d">관리자 휴대폰: 제외 (의도)</text>
<text x="406" y="232" fill="#ff3b30">가족의 태블릿: 제외 (손실)</text>
</g>

<!-- LTE -->
<rect x="24" y="300" width="592" height="62" rx="10" fill="#fff4e5"/>
<g font-size="12" fill="#1d1d1f">
<text x="40" y="324">관리자 휴대폰이 LTE로 바뀌면 공인 IP가 203.0.113.50 같은 새 값이 된다. AdminIp에 없으므로</text>
<text x="40" y="344">그 IP에서 관리자 요청(로그인한 상태로 사이트 열기)이 한 번 있기 전까지는 일반 방문으로 집계된다</text>
</g>
</svg>
