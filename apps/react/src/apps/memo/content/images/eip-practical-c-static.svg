<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>static 지역 변수와 일반 지역 변수의 수명 비교</title><rect width="640" height="330" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="320" y="28" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600">counter()를 3번 호출: static s는 값이 남고, 지역 변수 a는 매번 새로 만든다</text>
<rect x="40" y="46" width="560" height="76" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="56" y="66" font-size="12" fill="#ff9f0a" font-weight="600">데이터 영역 (프로그램 시작부터 끝까지 유지)</text>
<text x="56" y="104" font-size="13" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">static int s</text>
<rect x="200" y="82" width="110" height="30" fill="#fff" stroke="#ff9f0a" stroke-width="1"/>
<text x="255.0" y="101.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">0 → 1</text>
<rect x="335" y="82" width="110" height="30" fill="#fff" stroke="#ff9f0a" stroke-width="1"/>
<text x="390.0" y="101.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">1 → 2</text>
<rect x="470" y="82" width="110" height="30" fill="#fff" stroke="#ff9f0a" stroke-width="1"/>
<text x="525.0" y="101.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">2 → 3</text>
<text x="255" y="138" font-size="12" fill="#6e6e73" text-anchor="middle" font-weight="600">1번째 호출</text>
<rect x="200" y="146" width="110" height="90" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="210" y="166" font-size="11" fill="#0a84ff">스택 프레임</text>
<rect x="210" y="176" width="90" height="30" fill="#fff" stroke="#0a84ff" stroke-width="1"/>
<text x="255.0" y="195.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">a: 0 → 1</text>
<text x="255" y="226" font-size="11" fill="#6e6e73" text-anchor="middle">반환 뒤 소멸</text>
<text x="255" y="264" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">10 + 1 = 11</text>
<text x="390" y="138" font-size="12" fill="#6e6e73" text-anchor="middle" font-weight="600">2번째 호출</text>
<rect x="335" y="146" width="110" height="90" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="345" y="166" font-size="11" fill="#0a84ff">스택 프레임</text>
<rect x="345" y="176" width="90" height="30" fill="#fff" stroke="#0a84ff" stroke-width="1"/>
<text x="390.0" y="195.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">a: 0 → 1</text>
<text x="390" y="226" font-size="11" fill="#6e6e73" text-anchor="middle">반환 뒤 소멸</text>
<text x="390" y="264" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">20 + 1 = 21</text>
<text x="525" y="138" font-size="12" fill="#6e6e73" text-anchor="middle" font-weight="600">3번째 호출</text>
<rect x="470" y="146" width="110" height="90" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="480" y="166" font-size="11" fill="#0a84ff">스택 프레임</text>
<rect x="480" y="176" width="90" height="30" fill="#fff" stroke="#0a84ff" stroke-width="1"/>
<text x="525.0" y="195.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">a: 0 → 1</text>
<text x="525" y="226" font-size="11" fill="#6e6e73" text-anchor="middle">반환 뒤 소멸</text>
<text x="525" y="264" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">30 + 1 = 31</text>
<text x="56" y="196" font-size="13" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">int a</text>
<text x="56" y="264" font-size="13" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">s*10 + a</text>
<text x="320" y="306" font-size="13" fill="#ff9f0a" text-anchor="middle" font-weight="600">출력: 11 21 31   static 변수의 초기화(= 0)는 프로그램 시작 시각에 한 번만 일어난다</text>
</svg>
