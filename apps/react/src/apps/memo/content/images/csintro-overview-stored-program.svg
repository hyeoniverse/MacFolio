<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>배선식 프로그래밍(ENIAC)과 프로그램 내장 방식(EDVAC 이후)의 비교</title>
<rect width="640" height="340" fill="#fff"/>
<text x="160" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">배선식 (ENIAC, 1945)</text>
<text x="480" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">프로그램 내장 방식</text>
<line x1="320" y1="44" x2="320" y2="300" stroke="#6e6e73" stroke-dasharray="4 4"/>
<g fill="#f2f2f7" stroke="#6e6e73"><rect x="30" y="60" width="70" height="50"/><rect x="125" y="60" width="70" height="50"/><rect x="220" y="60" width="70" height="50"/><rect x="30" y="160" width="70" height="50"/><rect x="125" y="160" width="70" height="50"/><rect x="220" y="160" width="70" height="50"/></g>
<g font-size="12" text-anchor="middle" fill="#1d1d1f"><text x="65" y="90">누산기</text><text x="160" y="90">곱셈기</text><text x="255" y="90">누산기</text><text x="65" y="190">함수표</text><text x="160" y="190">누산기</text><text x="255" y="190">출력</text></g>
<g stroke="#ff9f0a" stroke-width="2.5" fill="none"><path d="M100 85 H125"/><path d="M195 85 H220"/><path d="M255 110 V160"/><path d="M65 110 C65 140 160 130 160 160"/><path d="M100 185 H125"/></g>
<text x="160" y="240" text-anchor="middle" font-size="12" fill="#ff9f0a">케이블과 스위치 배치 = 프로그램</text>
<text x="160" y="262" text-anchor="middle" font-size="12" fill="#6e6e73">문제를 바꾸려면 사람이 다시 배선</text>
<text x="160" y="280" text-anchor="middle" font-size="12" fill="#6e6e73">(수 일 소요)</text>
<rect x="350" y="60" width="110" height="150" rx="6" fill="#0a84ff"/>
<text x="405" y="90" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">CPU</text>
<rect x="364" y="104" width="82" height="26" fill="#fff"/><text x="405" y="122" text-anchor="middle" font-size="12" fill="#1d1d1f">PC = 102</text>
<text x="405" y="160" text-anchor="middle" font-size="12" fill="#fff">인출 → 해독</text><text x="405" y="178" text-anchor="middle" font-size="12" fill="#fff">→ 실행 반복</text>
<rect x="500" y="60" width="120" height="150" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="560" y="52" text-anchor="middle" font-size="12" fill="#6e6e73">주기억장치</text>
<g font-size="12" fill="#1d1d1f"><text x="508" y="80">100 LOAD 200</text><text x="508" y="100">101 ADD 201</text><text x="508" y="120" fill="#0a84ff" font-weight="600">102 STORE 202</text><text x="508" y="140">103 HALT</text><line x1="500" y1="150" x2="620" y2="150" stroke="#6e6e73"/><text x="508" y="170" fill="#34c759">200 데이터 7</text><text x="508" y="190" fill="#34c759">201 데이터 5</text></g>
<path d="M460 120 H500" stroke="#1d1d1f" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="485" y="240" text-anchor="middle" font-size="12" fill="#0a84ff">명령어와 데이터가 같은 메모리에 숫자로 저장</text>
<text x="485" y="262" text-anchor="middle" font-size="12" fill="#6e6e73">문제를 바꾸려면 메모리 내용만 교체</text>
<text x="320" y="325" text-anchor="middle" font-size="12" fill="#6e6e73">근거: J. von Neumann, First Draft of a Report on the EDVAC (1945)</text>
</svg>
