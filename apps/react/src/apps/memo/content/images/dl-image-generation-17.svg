<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="260" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">VAE: 인코더가 분포를 출력하고 디코더가 표본에서 복원</text>
  <rect x="16" y="100" width="70" height="50" rx="8" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="51" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">입력 x</text>
  <line x1="86" y1="125" x2="110" y2="125" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M112 80 L192 105 L192 145 L112 170 Z" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="152" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">인코더</text>
  <text x="152" y="138" text-anchor="middle" font-size="11" fill="#1d1d1f">q_φ(z|x)</text>
  <line x1="192" y1="112" x2="222" y2="92" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="192" y1="138" x2="222" y2="158" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="224" y="74" width="54" height="34" rx="6" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="251" y="96" text-anchor="middle" font-size="14" fill="#1d1d1f">μ</text>
  <rect x="224" y="142" width="54" height="34" rx="6" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="251" y="164" text-anchor="middle" font-size="14" fill="#1d1d1f">σ</text>
  <rect x="246" y="196" width="80" height="34" rx="6" fill="#fff" stroke="#6e6e73" stroke-dasharray="4 3"/>
  <text x="286" y="218" text-anchor="middle" font-size="12" fill="#6e6e73">ε ~ N(0, I)</text>
  <line x1="278" y1="91" x2="320" y2="118" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="278" y1="159" x2="320" y2="134" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="300" y1="196" x2="330" y2="146" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="322" y="104" width="128" height="42" rx="8" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="386" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">잠재 변수 z</text>
  <text x="386" y="139" text-anchor="middle" font-size="11" fill="#1d1d1f">z = μ + σ ⊙ ε</text>
  <line x1="450" y1="125" x2="474" y2="125" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M476 105 L556 80 L556 170 L476 145 Z" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="516" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">디코더</text>
  <text x="516" y="138" text-anchor="middle" font-size="11" fill="#1d1d1f">p_θ(x|z)</text>
  <line x1="556" y1="125" x2="572" y2="125" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="604" y="122" text-anchor="middle" font-size="14" fill="#1d1d1f">x̂</text>
  <text x="604" y="140" text-anchor="middle" font-size="10" fill="#6e6e73">복원·생성</text>
  <text x="152" y="60" text-anchor="middle" font-size="11" fill="#6e6e73">학습 시각에만 사용</text>
  <text x="516" y="60" text-anchor="middle" font-size="11" fill="#6e6e73">생성 시각: z ~ N(0, I)를 넣는다</text>
