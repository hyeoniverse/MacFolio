<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="510" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">ICMP 메시지 유형 (1) 유형 0~4</text>
  <rect x="20" y="44" width="600" height="28" fill="#f2f2f7"/>
  <g font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">
    <text x="48" y="63">유형</text><text x="92" y="63">코드</text>
    <text x="317" y="63">설명</text>
    <text x="540" y="63">질의</text><text x="596" y="63">오류</text>
  </g>
  <rect x="20" y="44" width="600" height="446" fill="none" stroke="#1d1d1f"/>
  <g stroke="#1d1d1f" stroke-width="1">
    <line x1="512" y1="44" x2="512" y2="490"/><line x1="568" y1="44" x2="568" y2="490"/>
    <line x1="20" y1="72" x2="620" y2="72"/>
    <line x1="20" y1="94" x2="620" y2="94"/>
    <line x1="20" y1="468" x2="620" y2="468"/>
    <line x1="20" y1="490" x2="620" y2="490"/>
  </g>
  <g font-size="12.5" fill="#1d1d1f">
    <text x="48" y="87.5" text-anchor="middle">0</text>
    <text x="92" y="87.5" text-anchor="middle">0</text>
    <text x="122" y="87.5">에코 응답(echo reply): ping 응답</text>
    <circle cx="540" cy="83" r="4" fill="#0a84ff"/>
    <text x="48" y="109.5" text-anchor="middle">3</text>
    <text x="122" y="109.5" font-weight="600">목적지 도달 불가(destination unreachable)</text>
    <text x="92" y="131.5" text-anchor="middle">0</text>
    <text x="138" y="131.5">네트워크 도달 불가(network unreachable)</text>
    <circle cx="596" cy="127" r="4" fill="#ff9f0a"/>
    <text x="92" y="153.5" text-anchor="middle">1</text>
    <text x="138" y="153.5">호스트 도달 불가(host unreachable)</text>
    <circle cx="596" cy="149" r="4" fill="#ff9f0a"/>
    <text x="92" y="175.5" text-anchor="middle">2</text>
    <text x="138" y="175.5">프로토콜 도달 불가(protocol unreachable)</text>
    <circle cx="596" cy="171" r="4" fill="#ff9f0a"/>
    <text x="92" y="197.5" text-anchor="middle">3</text>
    <text x="138" y="197.5">포트 도달 불가(port unreachable)</text>
    <circle cx="596" cy="193" r="4" fill="#ff9f0a"/>
    <text x="92" y="219.5" text-anchor="middle">4</text>
    <text x="138" y="219.5">단편화가 필요하나 DF 비트가 설정됨</text>
    <circle cx="596" cy="215" r="4" fill="#ff9f0a"/>
    <text x="92" y="241.5" text-anchor="middle">5</text>
    <text x="138" y="241.5">소스 라우트 실패(source route failed)</text>
    <circle cx="596" cy="237" r="4" fill="#ff9f0a"/>
    <text x="92" y="263.5" text-anchor="middle">6</text>
    <text x="138" y="263.5">목적지 네트워크를 알 수 없음</text>
    <circle cx="596" cy="259" r="4" fill="#ff9f0a"/>
    <text x="92" y="285.5" text-anchor="middle">7</text>
    <text x="138" y="285.5">목적지 호스트를 알 수 없음</text>
    <circle cx="596" cy="281" r="4" fill="#ff9f0a"/>
    <text x="92" y="307.5" text-anchor="middle">8</text>
    <text x="138" y="307.5">발신지 호스트 고립(폐지)</text>
    <circle cx="596" cy="303" r="4" fill="#ff9f0a"/>
    <text x="92" y="329.5" text-anchor="middle">9</text>
    <text x="138" y="329.5">목적지 네트워크 관리상 금지</text>
    <circle cx="596" cy="325" r="4" fill="#ff9f0a"/>
    <text x="92" y="351.5" text-anchor="middle">10</text>
    <text x="138" y="351.5">목적지 호스트 관리상 금지</text>
    <circle cx="596" cy="347" r="4" fill="#ff9f0a"/>
    <text x="92" y="373.5" text-anchor="middle">11</text>
    <text x="138" y="373.5">TOS에 대한 네트워크 도달 불가</text>
    <circle cx="596" cy="369" r="4" fill="#ff9f0a"/>
    <text x="92" y="395.5" text-anchor="middle">12</text>
    <text x="138" y="395.5">TOS에 대한 호스트 도달 불가</text>
    <circle cx="596" cy="391" r="4" fill="#ff9f0a"/>
    <text x="92" y="417.5" text-anchor="middle">13</text>
    <text x="138" y="417.5">필터링에 의한 통신 관리상 금지</text>
    <circle cx="596" cy="413" r="4" fill="#ff9f0a"/>
    <text x="92" y="439.5" text-anchor="middle">14</text>
    <text x="138" y="439.5">호스트 우선순위(precedence) 위반</text>
    <circle cx="596" cy="435" r="4" fill="#ff9f0a"/>
    <text x="92" y="461.5" text-anchor="middle">15</text>
    <text x="138" y="461.5">우선순위 차단(precedence cutoff) 적용 중</text>
    <circle cx="596" cy="457" r="4" fill="#ff9f0a"/>
    <text x="48" y="483.5" text-anchor="middle">4</text>
    <text x="92" y="483.5" text-anchor="middle">0</text>
    <text x="122" y="483.5">발신지 억제(source quench): 초보적 흐름 제어</text>
    <circle cx="596" cy="479" r="4" fill="#ff9f0a"/>
  </g>
</svg>
