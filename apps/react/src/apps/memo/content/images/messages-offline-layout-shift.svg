<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>전송 실패 문구 위치의 전후 비교</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">전송 실패를 어디에 표시하나</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">점선은 오류가 나기 전 입력창의 위치</text>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#ff3b30"/></marker></defs>
  <!-- before -->
  <text x="24" y="86" font-size="14" font-weight="700" fill="#ff3b30">전: 입력창 아래 빨간 줄</text>
  <rect x="24" y="98" width="284" height="236" rx="12" fill="#f2f2f7"/>
  <rect x="40" y="114" width="150" height="30" rx="15" fill="#e5e5ea"/>
  <text x="54" y="134" font-size="12" fill="#1d1d1f">잘 보고 갑니다</text>
  <rect x="150" y="154" width="142" height="30" rx="15" fill="#0a84ff"/>
  <text x="164" y="174" font-size="12" fill="#ffffff">감사합니다!</text>
  <rect x="40" y="276" width="252" height="34" rx="17" fill="none" stroke="#6e6e73" stroke-dasharray="4 4"/>
  <rect x="40" y="250" width="252" height="34" rx="17" fill="#ffffff" stroke="#1d1d1f"/>
  <text x="56" y="272" font-size="12" fill="#1d1d1f">포트폴리오 잘 봤어요</text>
  <text x="44" y="304" font-size="12" fill="#ff3b30">Failed to fetch</text>
  <path d="M300 290 V262" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="166" y="326" font-size="12" fill="#ff3b30">오류 줄 높이만큼 위로</text>
  <!-- after -->
  <text x="332" y="86" font-size="14" font-weight="700" fill="#34c759">후: 화면 위에 겹치는 경고창</text>
  <rect x="332" y="98" width="284" height="236" rx="12" fill="#f2f2f7"/>
  <rect x="348" y="114" width="150" height="30" rx="15" fill="#e5e5ea"/>
  <text x="362" y="134" font-size="12" fill="#1d1d1f">잘 보고 갑니다</text>
  <rect x="458" y="154" width="142" height="30" rx="15" fill="#0a84ff"/>
  <text x="472" y="174" font-size="12" fill="#ffffff">감사합니다!</text>
  <rect x="348" y="276" width="252" height="34" rx="17" fill="#ffffff" stroke="#1d1d1f"/>
  <text x="364" y="298" font-size="12" fill="#1d1d1f">포트폴리오 잘 봤어요</text>
  <rect x="332" y="98" width="284" height="236" rx="12" fill="#1d1d1f" fill-opacity="0.28"/>
  <rect x="368" y="138" width="212" height="122" rx="12" fill="#ffffff"/>
  <text x="474" y="166" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">메시지를 보내지 못했습니다</text>
  <text x="474" y="188" font-size="12" fill="#6e6e73" text-anchor="middle">서버에 연결할 수 없습니다.</text>
  <text x="474" y="205" font-size="12" fill="#6e6e73" text-anchor="middle">잠시 뒤 다시 시도해 주세요.</text>
  <rect x="384" y="220" width="180" height="28" rx="8" fill="#0a84ff"/>
  <text x="474" y="239" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">확인</text>
  <text x="474" y="326" font-size="12" fill="#1d1d1f" text-anchor="middle">입력창 위치와 입력한 글이 그대로</text>
</svg>
