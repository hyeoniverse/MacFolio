<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>로그인한 때(createdAt)부터 12시간 뒤 expiresAt까지가 세션이다. 화면은 /auth/me로 두 시각을 받고, 만료 1초 뒤에 다시 물어 로그아웃 화면으로 바꾼다</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="860" height="280" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">세션 12시간과 화면의 타이머</text>
<rect x="60" y="96" width="700" height="26" rx="6" fill="#e0e7ff"/>
<text x="410.0" y="114" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">관리자 세션 12시간 (SESSION_TTL_MS)</text>
<path d="M60 80 L60 140" stroke="#4f46e5" stroke-width="2" fill="none"/>
<text x="60" y="72" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">로그인 처리 시각 now</text>
<text x="60" y="158" font-size="10.5" font-weight="500" fill="#374151" text-anchor="middle">createdAt = signedInAt</text>
<path d="M760 80 L760 140" stroke="#e11d48" stroke-width="2" fill="none"/>
<text x="760" y="72" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">expiresAt = now + 12h</text>
<path d="M800 88 L800 140" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
<text x="800" y="158" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="middle">+1초: /auth/me</text>
<rect x="220" y="180" width="220" height="48" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="330.0" y="200.5" font-size="11.5" font-weight="600" fill="#3730a3" text-anchor="middle">GET /auth/me</text>
<text x="330.0" y="215.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">login · signedInAt · expiresAt (ISO 8601)</text>
<rect x="480" y="180" width="250" height="48" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="605.0" y="200.5" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle">setTimeout(refreshAdmin, 남은 시간 + 1초)</text>
<text x="605.0" y="215.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">2^31 ms를 넘으면 걸지 않는다</text>
<path d="M440 204 L478 204" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#gray)"/>
<text x="32" y="262" font-size="10.5" font-weight="500" fill="#374151" text-anchor="start">두 시각을 같은 now에서 만들어 차이가 정확히 12시간이다. 화면 문구는 "2026년 10월 2일 오후 7:03"처럼 직접 조립한다(ICU마다 오후/PM이 달라서).</text>
</svg>
