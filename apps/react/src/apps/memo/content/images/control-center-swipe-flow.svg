<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 238" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>문서 캡처 단계에서 시작, 판단, 따라오기, 끝의 네 단계로 쓸기를 처리한다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="860" height="238" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">쓸기 하나가 지나가는 길</text>
<text x="32" y="56" font-size="11" fill="#6b7280">useVerticalSwipe: document에 캡처 단계로 9개 이벤트를 단다</text>
<rect x="32.0" y="80" width="178.0" height="108" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">시작</text><text x="121.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">pointerdown · touchstart</text><text x="121.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">canStartSwipe(target)</text><text x="121.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">입력·막대·홈 인디케이터 X</text><text x="121.0" y="170" font-size="10.5" fill="#374151" text-anchor="middle">스크롤 남았으면 X</text><line x1="212.0" y1="134.0" x2="236.0" y2="134.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="238.0" y="80" width="178.0" height="108" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="327.0" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">판단</text><text x="327.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">8px까지 undecided</text><text x="327.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">세로·정한 방향 → swipe</text><text x="327.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">가로·반대 → other (놓아줌)</text><line x1="418.0" y1="134.0" x2="442.0" y2="134.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="444.0" y="80" width="178.0" height="108" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="533.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">따라오기</text><text x="533.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">onMove(거리)</text><text x="533.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">touchmove preventDefault</text><text x="533.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">패널 progress = 거리/240</text><line x1="624.0" y1="134.0" x2="648.0" y2="134.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="650.0" y="80" width="178.0" height="108" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="739.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">끝</text><text x="739.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">onEnd(거리) ≥ 60px → 여닫기</text><text x="739.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">500ms 안 click 하나 버림</text><text x="739.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">touchcancel → onCancel</text><text x="32" y="218" font-size="11" fill="#6b7280">여는 쪽(MobileShell, down)과 닫는 쪽(ControlCenter, up)이 같은 훅을 쓴다</text>
</svg>
