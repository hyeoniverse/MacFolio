<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>요청 경로를 하나로: 브라우저는 /api, 서버는 API_URL</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="900" height="340" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">요청 경로를 하나로: 브라우저는 /api, 서버는 API_URL</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">apiFetch 하나가 두 경로를 고르고, 토큰 갱신은 middleware와 apiFetch가 나눠 맡는다</text>
<rect x="32" y="90" width="170" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="117.0" y="115.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">브라우저</text>
<text x="117.0" y="131.0" font-size="10.5" fill="#6b7280" text-anchor="middle">클라이언트 컴포넌트</text>
<rect x="32" y="230" width="170" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="117.0" y="255.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">Next 서버</text>
<text x="117.0" y="271.0" font-size="10.5" fill="#6b7280" text-anchor="middle">서버 컴포넌트 · middleware</text>
<rect x="352" y="90" width="200" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="452.0" y="115.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">/api/* (Next rewrites)</text>
<text x="452.0" y="131.0" font-size="10.5" fill="#6b7280" text-anchor="middle">같은 도메인 프록시</text>
<rect x="690" y="160" width="180" height="56" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="780.0" y="185.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">NestJS api</text>
<text x="780.0" y="201.0" font-size="10.5" fill="#6b7280" text-anchor="middle">API_URL</text>
<line x1="202" y1="118" x2="352" y2="118" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a-blue)"/>
<text x="277.0" y="110" font-size="10.5" fill="#4f46e5" text-anchor="middle">apiFetch('/api/...')</text>
<line x1="552" y1="118" x2="690" y2="178" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a-blue)"/>
<text x="630" y="136" font-size="10.5" fill="#4f46e5" text-anchor="middle">프록시</text>
<line x1="202" y1="258" x2="690" y2="200" stroke="#b45309" stroke-width="1.6" marker-end="url(#a-amber)"/>
<text x="420" y="268" font-size="10.5" fill="#b45309" text-anchor="middle">apiFetch(API_URL + ...) · 쿠키를 그대로 전달</text>
<text x="32" y="176" font-size="11" fill="#4f46e5" text-anchor="start" font-weight="600">401 → refresh 1번 → 재시도</text>
<text x="32" y="192" font-size="10.5" fill="#6b7280" text-anchor="start">동시에 여러 요청이 401이어도 refresh는 한 번</text>
<text x="32" y="312" font-size="11" fill="#b45309" text-anchor="start" font-weight="600">페이지 렌더링 전: access 쿠키가 없고 refresh가 있으면 갱신해 같은 요청에 반영</text>
<text x="32" y="328" font-size="10.5" fill="#6b7280" text-anchor="start">/mypage는 토큰이 없으면 307 → /?login=required</text>
<text x="600" y="260" font-size="11" fill="#374151" text-anchor="start">쿠키는 프론트 도메인에 저장된다</text>
<text x="600" y="276" font-size="10.5" fill="#6b7280" text-anchor="start">→ www/api 서브도메인이 필요 없다</text>
</svg>
