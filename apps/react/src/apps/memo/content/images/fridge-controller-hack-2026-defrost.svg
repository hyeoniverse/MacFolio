<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="330" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">정상 제상과 공격자가 건 제상의 차이 (도식)</text>

  <!-- axes -->
  <g stroke="#c7c7cc">
    <line x1="80" y1="60" x2="80" y2="270"/>
    <line x1="80" y1="270" x2="690" y2="270"/>
    <line x1="80" y1="218" x2="690" y2="218" stroke-dasharray="3 4"/>
  </g>
  <g font-size="11" fill="#6e6e73" text-anchor="end">
    <text x="72" y="74">60°C</text>
    <text x="72" y="148">30°C</text>
    <text x="72" y="222">3°C</text>
    <text x="72" y="274">-18°C</text>
  </g>
  <g font-size="11" fill="#6e6e73" text-anchor="middle">
    <text x="80" y="290">0시간</text>
    <text x="283" y="290">2시간</text>
    <text x="486" y="290">4시간</text>
    <text x="690" y="290">6시간</text>
  </g>

  <!-- normal defrost: short bumps -->
  <path d="M80 218 L150 218 L160 205 L180 205 L190 218 L330 218 L340 205 L360 205 L370 218 L510 218 L520 205 L540 205 L550 218 L690 218" fill="none" stroke="#0a84ff" stroke-width="2.5"/>
  <!-- attack -->
  <path d="M80 218 L200 218 C 300 180, 420 125, 690 101" fill="none" stroke="#ff3b30" stroke-width="2.5"/>

  <g font-size="12">
    <rect x="100" y="70" width="12" height="12" rx="2" fill="#0a84ff"/>
    <text x="118" y="81" fill="#1d1d1f">정상: 정해진 시각에 잠깐 히터를 켜 성에를 녹이고 바로 냉각으로 돌아간다</text>
    <rect x="100" y="92" width="12" height="12" rx="2" fill="#ff3b30"/>
    <text x="118" y="103" fill="#1d1d1f">공격: 제상을 끝내지 않거나 목표 온도를 높게 바꿔 계속 데운다</text>
  </g>
  <text x="600" y="128" font-size="12" font-weight="600" fill="#ff3b30">6시간 뒤 50°C 안팎</text>
  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#8e8e93">온도 곡선은 설명을 위한 도식이며 실제 측정값이 아니다. 3°C는 냉장 진열대의 일반적인 설정값</text>
</svg>
