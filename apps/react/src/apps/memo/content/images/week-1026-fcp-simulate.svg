<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>관찰한 첫 렌더링 0.58초와 Lighthouse simulate가 계산한 FCP 2.8초의 차이, 테마 스크립트를 인라인으로 넣은 뒤 1.0초</title>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">관찰한 첫 렌더링과 simulate가 계산한 FCP</text>
<text x="20" y="50" font-size="12" fill="#6e6e73">simulate는 첫 렌더링 전에 도착한 요청을 모두 필요한 요청으로 보고 느린 4G로 다시 계산한다</text>
<text x="20" y="80" font-size="13" font-weight="700" fill="#1d1d1f">관찰 (배포 사이트)</text>
<rect x="20" y="90" width="66" height="26" fill="#c7c7cc"/><text x="53" y="108" font-size="12" fill="#1d1d1f" text-anchor="middle">TTFB</text>
<rect x="86" y="90" width="31" height="26" fill="#0a84ff"/>
<text x="126" y="108" font-size="12" fill="#1d1d1f">394ms + 렌더링 186ms = 0.58초</text>
<text x="20" y="150" font-size="13" font-weight="700" fill="#1d1d1f">전: simulate 계산</text>
<rect x="20" y="160" width="20" height="26" fill="#ff3b30"/>
<rect x="40" y="160" width="430" height="26" fill="#ff9f0a" opacity="0.8"/>
<text x="46" y="178" font-size="12" fill="#1d1d1f">theme-boot.js(2KB) + 그사이 도착한 번들 38개 = 요청 39개, 145KB</text>
<text x="480" y="178" font-size="12" font-weight="700" fill="#ff3b30">2.8초</text>
<text x="20" y="204" font-size="12" fill="#6e6e73">빨간 칸: 렌더링을 막는 외부 스크립트. 이 파일을 받는 동안 도착한 요청이 모두 계산에 들어간다</text>
<text x="20" y="240" font-size="13" font-weight="700" fill="#1d1d1f">후: 테마 스크립트 인라인 + 첫 화면 HTML 엣지 캐시</text>
<rect x="20" y="250" width="168" height="26" fill="#34c759"/>
<text x="196" y="268" font-size="12" font-weight="700" fill="#34c759">1.0초</text>
<text x="240" y="268" font-size="12" fill="#6e6e73">렌더링을 막는 외부 요청이 없다 (모바일 점수 91 → 100)</text>
</svg>
