<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">:where()로 명시도를 0으로 둔 공통 규칙과 화면별 규칙의 우선순위</text>
  <text x="30" y="62" font-size="13" font-weight="600" fill="#1d1d1f">① 같은 pre 요소에 걸린 두 규칙</text>
  <rect x="30" y="74" width="580" height="44" rx="6" fill="#f2f2f7"/>
  <text x="44" y="101" font-size="13" fill="#1d1d1f">:where(.prose) pre { padding: var(--prose-pre-padding) }</text>
  <text x="596" y="101" text-anchor="end" font-size="13" fill="#6e6e73">(0, 0, 1)</text>
  <rect x="30" y="126" width="580" height="44" rx="6" fill="#eaf3ff" stroke="#0a84ff"/>
  <text x="44" y="153" font-size="13" fill="#1d1d1f">.memo-markdown pre { … }  화면별 파일</text>
  <text x="596" y="153" text-anchor="end" font-size="13" font-weight="600" fill="#0a84ff">(0, 1, 1) 우선</text>
  <text x="30" y="192" font-size="12" fill="#6e6e73">:where() 안의 .prose는 점수에 더해지지 않으므로, CSS 파일을 불러오는 순서와 관계없이 화면별 규칙이 이긴다</text>
  <text x="30" y="236" font-size="13" font-weight="600" fill="#1d1d1f">② 명시도가 낮아져 지게 된 규칙과 해결</text>
  <rect x="30" y="248" width="280" height="96" rx="6" fill="#fff0ef" stroke="#ff3b30"/>
  <text x="44" y="272" font-size="12" font-weight="600" fill="#ff3b30">변경 직후</text>
  <text x="44" y="294" font-size="12" fill="#1d1d1f">.memo ul { list-style: none } (0,1,1)</text>
  <text x="44" y="314" font-size="12" fill="#1d1d1f">:where(.prose) ul { … } (0,0,1)</text>
  <text x="44" y="334" font-size="12" fill="#ff3b30">본문 목록의 글머리표가 사라진다</text>
  <rect x="330" y="248" width="280" height="96" rx="6" fill="#effaf2" stroke="#34c759"/>
  <text x="344" y="272" font-size="12" font-weight="600" fill="#34c759">@layer reset으로 이동</text>
  <text x="344" y="294" font-size="12" fill="#1d1d1f">@layer reset { .memo ul { … } }</text>
  <text x="344" y="314" font-size="12" fill="#1d1d1f">레이어 밖 :where(.prose) ul이 이긴다</text>
  <text x="344" y="334" font-size="12" fill="#34c759">글머리표 유지, 폴더 목록은 그대로</text>
  <text x="30" y="378" font-size="12" fill="#6e6e73">캐스케이드는 레이어 순서를 명시도보다 먼저 비교한다. 레이어에 넣지 않은 규칙은 모든 레이어보다 우선한다</text>
</svg>
