<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>GitHub secret scanning은 알려진 서비스 키를 push 때 막고, gitleaks는 기본 규칙과 이 프로젝트 규칙 셋으로 커밋 기록 전체를 CI에서 훑는다</title><defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="780" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">두 스캐너가 보는 범위</text>
<rect x="32" y="60" width="350" height="150" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="207.0" y="110.25" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">GitHub Secret Protection</text>
<text x="207.0" y="129.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">GitHub이 아는 서비스의 키 (ghp_, AKIA… 등)</text>
<text x="207.0" y="143.5" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">Push protection: 그런 키가 든 push를 막는다</text>
<text x="207.0" y="158.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">알려진 서비스에 알려 폐기하게 한다</text>
<text x="207.0" y="172.5" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">저장소 설정에서 손으로 켠다</text>
<rect x="398" y="60" width="350" height="150" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="573.0" y="110.25" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">gitleaks 8.30.1 (CI 작업 secrets)</text>
<text x="573.0" y="129.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">기본 규칙 + .gitleaks.toml 세 규칙</text>
<text x="573.0" y="143.5" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">re_… (Resend) · gsk_… (Groq)</text>
<text x="573.0" y="158.0" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">scheme://user:password@host</text>
<text x="573.0" y="172.5" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">fetch-depth 0, 791커밋 · 392MB 약 15초</text>
<text x="32" y="240" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">예외는 좁게: private-key 규칙을 Oracle 문서의 시험용 키가 든 두 파일에서만.</text>
<text x="32" y="262" font-size="10.5" font-weight="400" fill="#374151" text-anchor="start">엔트로피가 낮은 값(A1b2A1b2…)은 gitleaks가 넘긴다 → 설정은 무작위 가짜 값으로 시험했다.</text>
<text x="32" y="284" font-size="10.5" font-weight="600" fill="#4f46e5" text-anchor="start">--redact: CI 로그는 공개라, 걸린 값을 그대로 찍으면 그것이 또 유출이다.</text>
</svg>
