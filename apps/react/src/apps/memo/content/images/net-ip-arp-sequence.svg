<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">ARP 요청은 브로드캐스트, 응답은 유니캐스트</text>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34c759"/></marker>
  </defs>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="45" y="42" width="130" height="44" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="110" y="60">A 192.168.0.10</text>
    <text x="110" y="77" fill="#6e6e73">aa:aa:aa:aa:aa:aa</text>
    <rect x="265" y="42" width="130" height="44" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="330" y="60">B 192.168.0.20</text>
    <text x="330" y="77" fill="#6e6e73">bb:bb:bb:bb:bb:bb</text>
    <rect x="475" y="42" width="130" height="44" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="540" y="60">C 192.168.0.30</text>
    <text x="540" y="77" fill="#6e6e73">cc:cc:cc:cc:cc:cc</text>
  </g>
  <g stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="110" y1="86" x2="110" y2="340"/>
    <line x1="330" y1="86" x2="330" y2="340"/>
    <line x1="540" y1="86" x2="540" y2="340"/>
  </g>
  <g stroke="#0a84ff" stroke-width="1.8" marker-end="url(#b)">
    <line x1="110" y1="134" x2="326" y2="134"/>
    <line x1="110" y1="134" x2="536" y2="146"/>
  </g>
  <g font-size="11.5" fill="#0a84ff">
    <text x="120" y="104">① 요청(op=1): who-has 192.168.0.30 tell 192.168.0.10</text>
    <text x="120" y="120" fill="#6e6e73">목적지 MAC ff:ff:ff:ff:ff:ff, 타깃 MAC 00:00:00:00:00:00</text>
  </g>
  <g font-size="11.5" fill="#6e6e73">
    <rect x="190" y="156" width="280" height="36" fill="#fff"/>
    <text x="330" y="170" text-anchor="middle">② B: 타깃 IP가 자신이 아니므로 응답하지 않는다</text>
    <text x="330" y="186" text-anchor="middle">(A의 항목이 이미 캐시에 있으면 갱신만 한다)</text>
  </g>
  <line x1="540" y1="222" x2="114" y2="222" stroke="#ff9f0a" stroke-width="1.8" marker-end="url(#o)"/>
  <g font-size="11.5" fill="#ff9f0a">
    <text x="530" y="214" text-anchor="end">③ 응답(op=2): 192.168.0.30 is-at cc:cc:cc:cc:cc:cc</text>
    <text x="530" y="240" text-anchor="end" fill="#6e6e73">목적지 MAC aa:aa:aa:aa:aa:aa (유니캐스트)</text>
  </g>
  <text x="120" y="270" font-size="11.5" fill="#1d1d1f">④ A가 캐시에 192.168.0.30 → cc:cc:cc:cc:cc:cc 보관</text>
  <line x1="110" y1="308" x2="536" y2="308" stroke="#34c759" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="120" y="300" font-size="11.5" fill="#34c759">⑤ IP 데이터그램을 cc:cc:cc:cc:cc:cc로 직접 전송</text>
</svg>
