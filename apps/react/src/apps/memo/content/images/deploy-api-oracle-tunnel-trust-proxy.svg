<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>요청자가 X-Forwarded-For에 위조 값 A를 넣어도 Cloudflare가 실제 IP B를 끝에 덧붙인다. trust proxy 1은 오른쪽 끝 B를, true는 왼쪽 끝 A를 req.ip로 쓴다</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="860" height="320" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">trust proxy 1과 true의 차이</text>
<text x="32" y="56" font-size="11" fill="#6b7280">X-Forwarded-For(XFF)는 거친 프록시마다 오른쪽 끝에 IP를 덧붙인다 · A = 요청자가 적은 값, B = Cloudflare가 확인한 실제 IP</text>
<rect x="32" y="90" width="170" height="70" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="44" y="109" font-size="12" fill="#374151" font-weight="600">요청자 (실제 IP B)</text>
<text x="44" y="126" font-size="10.5" fill="#374151">XFF: A</text>
<text x="44" y="141" font-size="10.5" fill="#374151">(위조한 값을 직접 적음)</text>
<rect x="242" y="90" width="180" height="70" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="254" y="109" font-size="12" fill="#4f46e5" font-weight="600">Cloudflare 엣지</text>
<text x="254" y="126" font-size="10.5" fill="#374151">XFF: A, B</text>
<text x="254" y="141" font-size="10.5" fill="#374151">(접속한 IP B를 덧붙임)</text>
<rect x="462" y="90" width="170" height="70" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="474" y="109" font-size="12" fill="#4f46e5" font-weight="600">cloudflared</text>
<text x="474" y="126" font-size="10.5" fill="#374151">터널 → api:4000</text>
<text x="474" y="141" font-size="10.5" fill="#374151">XFF: A, B 전달</text>
<rect x="672" y="90" width="156" height="70" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="684" y="109" font-size="12" fill="#4f46e5" font-weight="600">Express (API)</text>
<text x="684" y="126" font-size="10.5" fill="#374151">req.ip 결정</text>
<path d="M202 125 H238" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
<path d="M422 125 H458" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<path d="M632 125 H668" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<rect x="32" y="200" width="380" height="92" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
<text x="44" y="219" font-size="12" fill="#15803d" font-weight="600">TRUST_PROXY=1 (적용한 설정)</text>
<text x="44" y="236" font-size="10.5" fill="#374151">바로 앞 한 단계(cloudflared)만 신뢰한다</text>
<text x="44" y="251" font-size="10.5" fill="#374151">XFF의 오른쪽 끝 값을 클라이언트로 본다</text>
<text x="44" y="266" font-size="10.5" fill="#374151">req.ip = B (실제 IP)</text>
<text x="44" y="281" font-size="10.5" fill="#374151">→ 요청 제한이 실제 IP 단위로 동작</text>
<rect x="448" y="200" width="380" height="92" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="460" y="219" font-size="12" fill="#b91c1c" font-weight="600">trust proxy = true (적용하지 않음)</text>
<text x="460" y="236" font-size="10.5" fill="#374151">XFF의 모든 값을 신뢰한다</text>
<text x="460" y="251" font-size="10.5" fill="#374151">XFF의 왼쪽 끝 값을 클라이언트로 본다</text>
<text x="460" y="266" font-size="10.5" fill="#374151">req.ip = A (요청자가 적은 값)</text>
<text x="460" y="281" font-size="10.5" fill="#374151">→ 요청마다 A를 바꾸면 요청 제한을 우회</text>
<path d="M750 160 C750 180 222 172 222 196" stroke="#15803d" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<path d="M750 160 V196" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#a-red)"/>
</svg>
