<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>ARP 요청은 브로드캐스트, 응답은 유니캐스트</title><rect width="640" height="290" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs><g font-size="13">
<rect x="20" y="40" width="120" height="50" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="80" y="62" text-anchor="middle" fill="#1d1d1f">호스트 A</text><text x="80" y="80" text-anchor="middle" font-size="11" fill="#6e6e73">192.168.0.10</text>
<rect x="340" y="200" width="120" height="50" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="400" y="222" text-anchor="middle" fill="#1d1d1f">호스트 C</text><text x="400" y="240" text-anchor="middle" font-size="11" fill="#6e6e73">192.168.0.30</text>
<rect x="190" y="200" width="120" height="50" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="250" y="222" text-anchor="middle" fill="#1d1d1f">호스트 B</text><text x="250" y="240" text-anchor="middle" font-size="11" fill="#6e6e73">192.168.0.20</text>
<rect x="490" y="200" width="120" height="50" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="550" y="222" text-anchor="middle" fill="#1d1d1f">호스트 D</text><text x="550" y="240" text-anchor="middle" font-size="11" fill="#6e6e73">192.168.0.40</text>
<path d="M140 70 C220 70 240 130 250 196" fill="none" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><path d="M140 70 C300 70 390 130 400 196" fill="none" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/><path d="M140 70 C400 70 540 130 550 196" fill="none" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/>
<rect x="250" y="30" width="370" height="44" rx="6" fill="#fff" stroke="#0a84ff"/><text x="262" y="50" font-size="12" fill="#0a84ff">① ARP 요청(목적지 MAC ff:ff:ff:ff:ff:ff)</text><text x="262" y="66" font-size="12" fill="#1d1d1f">"192.168.0.20의 MAC 주소를 가진 장치는?"</text>
<path d="M190 212 C140 196 100 150 90 94" fill="none" stroke="#ff9f0a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="204" width="160" height="40" rx="6" fill="#fff" stroke="#ff9f0a"/><text x="30" y="221" font-size="12" fill="#ff9f0a">② ARP 응답(유니캐스트)</text><text x="30" y="237" font-size="11" fill="#1d1d1f">"제 MAC은 3c:22:fb:…"</text>
<text x="20" y="278" font-size="12" fill="#6e6e73">A는 결과를 ARP 캐시에 보관한다 · RARP는 반대로 MAC 주소로 자기 IP 주소를 묻는다(현재는 DHCP가 대체)</text>
</g></svg>
