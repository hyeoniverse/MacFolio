<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>10월 10일 05시(UTC)에 조회하면 10월 1일 0시부터 10월 11일 0시까지 하루 단위 10칸의 computedAmount를 더한다</title>
<rect width="640" height="280" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">이번 달 요금 조회 구간 (granularity: DAILY)</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">예: 2026-10-10 05:00 UTC에 조회. 시작·끝을 모두 0시로 맞춰야 일 단위 조회가 받아들여진다</text>
<g font-size="12" fill="#1d1d1f" text-anchor="middle">
<rect x="60" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="85" y="117">1일</text>
<rect x="110" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="135" y="117">2일</text>
<rect x="160" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="185" y="117">3일</text>
<rect x="210" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="235" y="117">4일</text>
<rect x="260" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="285" y="117">5일</text>
<rect x="310" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="335" y="117">6일</text>
<rect x="360" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="385" y="117">7일</text>
<rect x="410" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="435" y="117">8일</text>
<rect x="460" y="92" width="50" height="40" fill="#eaf3ff" stroke="#0a84ff"/><text x="485" y="117">9일</text>
<rect x="510" y="92" width="50" height="40" fill="#fff7eb" stroke="#ff9f0a"/><text x="535" y="117">10일</text>
</g>
<line x1="60" y1="84" x2="60" y2="152" stroke="#1d1d1f" stroke-width="1.5"/>
<line x1="560" y1="84" x2="560" y2="152" stroke="#1d1d1f" stroke-width="1.5"/>
<line x1="520" y1="80" x2="520" y2="140" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="520" y="76" font-size="12" text-anchor="middle" fill="#ff3b30">지금 05:00</text>
<text x="56" y="170" font-size="12" fill="#1d1d1f">timeUsageStarted</text>
<text x="56" y="186" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6e6e73">2026-10-01T00:00Z</text>
<text x="564" y="170" font-size="12" text-anchor="end" fill="#1d1d1f">timeUsageEnded</text>
<text x="564" y="186" font-size="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#6e6e73">2026-10-11T00:00Z</text>
<text x="535" y="148" font-size="12" text-anchor="middle" fill="#6e6e73">진행 중</text>
<rect x="24" y="206" width="592" height="56" rx="8" fill="#f2f2f7"/>
<text x="38" y="228" font-size="12.5" fill="#1d1d1f">응답은 하루 한 칸씩 items[]로 오고, 각 칸의 computedAmount를 모두 더한 값이 이번 달 요금이다.</text>
<text x="38" y="248" font-size="12.5" fill="#1d1d1f">끝을 '지금'이 아니라 '내일 0시'로 잡아야 진행 중인 오늘 사용분까지 포함된다.</text>
</svg>
