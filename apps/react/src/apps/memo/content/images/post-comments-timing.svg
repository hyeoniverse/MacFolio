<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>일반 비교와 상수 시간 비교</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">앞에서부터 비교하면 응답 시간이 단서가 된다</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">기대 값의 앞 8바이트만 표시. 칸 하나가 바이트 하나</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
    <text x="96" y="94" fill="#6e6e73" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">기대 값</text>
    <g fill="#f2f2f7">
      <rect x="160" y="78" width="40" height="26" rx="4"/><rect x="204" y="78" width="40" height="26" rx="4"/><rect x="248" y="78" width="40" height="26" rx="4"/><rect x="292" y="78" width="40" height="26" rx="4"/>
      <rect x="336" y="78" width="40" height="26" rx="4"/><rect x="380" y="78" width="40" height="26" rx="4"/><rect x="424" y="78" width="40" height="26" rx="4"/><rect x="468" y="78" width="40" height="26" rx="4"/>
    </g>
    <g fill="#1d1d1f"><text x="180" y="96">a3</text><text x="224" y="96">7f</text><text x="268" y="96">10</text><text x="312" y="96">c2</text><text x="356" y="96">5e</text><text x="400" y="96">09</text><text x="444" y="96">d4</text><text x="488" y="96">b1</text></g>
  </g>
  <!-- naive -->
  <text x="24" y="138" font-size="14" font-weight="700" fill="#ff3b30">일반 비교: 처음 다른 바이트에서 멈춘다</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
    <text x="96" y="172" fill="#6e6e73" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">추측 A</text>
    <rect x="160" y="156" width="40" height="26" rx="4" fill="#fff1f0" stroke="#ff3b30"/><text x="180" y="174" fill="#1d1d1f">00</text>
    <text x="524" y="174" fill="#1d1d1f" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">1번 비교</text>
    <text x="96" y="210" fill="#6e6e73" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">추측 B</text>
    <rect x="160" y="194" width="40" height="26" rx="4" fill="#eaf8ee" stroke="#34c759"/><text x="180" y="212" fill="#1d1d1f">a3</text>
    <rect x="204" y="194" width="40" height="26" rx="4" fill="#eaf8ee" stroke="#34c759"/><text x="224" y="212" fill="#1d1d1f">7f</text>
    <rect x="248" y="194" width="40" height="26" rx="4" fill="#eaf8ee" stroke="#34c759"/><text x="268" y="212" fill="#1d1d1f">10</text>
    <rect x="292" y="194" width="40" height="26" rx="4" fill="#fff1f0" stroke="#ff3b30"/><text x="312" y="212" fill="#1d1d1f">00</text>
    <text x="524" y="212" fill="#ff3b30" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">4번 비교 → 더 늦다</text>
  </g>
  <!-- constant -->
  <text x="24" y="256" font-size="14" font-weight="700" fill="#34c759">timingSafeEqual: 항상 끝까지 비교한다</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
    <text x="96" y="290" fill="#6e6e73" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">A와 B</text>
    <g fill="#f2f2f7" stroke="#0a84ff">
      <rect x="160" y="274" width="40" height="26" rx="4"/><rect x="204" y="274" width="40" height="26" rx="4"/><rect x="248" y="274" width="40" height="26" rx="4"/><rect x="292" y="274" width="40" height="26" rx="4"/>
      <rect x="336" y="274" width="40" height="26" rx="4"/><rect x="380" y="274" width="40" height="26" rx="4"/><rect x="424" y="274" width="40" height="26" rx="4"/><rect x="468" y="274" width="40" height="26" rx="4"/>
    </g>
    <text x="524" y="292" fill="#0a84ff" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="start">32바이트 모두 비교</text>
  </g>
  <text x="24" y="320" font-size="12" fill="#6e6e73">응답 시간이 같으므로 몇 바이트가 맞았는지 알 수 없다</text>
</svg>
