<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">역방향 조회 이름 만들기와 위임 경로</text>
  <text x="40" y="62" font-size="13" fill="#1d1d1f">IP 주소</text>
  <text x="140" y="62" font-size="15" font-family="Menlo, monospace" fill="#1d1d1f">128.230.171.184</text>
  <text x="40" y="96" font-size="13" fill="#1d1d1f">PTR 질의 이름</text>
  <text x="140" y="96" font-size="15" font-family="Menlo, monospace" fill="#0a84ff">184.171.230.128.in-addr.arpa.</text>
  <text x="140" y="118" font-size="12" fill="#6e6e73">옥텟 순서를 뒤집어 in-addr.arpa 밑에 붙인다. IP 주소의 첫 옥텟이 트리의 맨 위 단계다.</text>
  <g font-size="12.5">
    <rect x="40" y="140" width="120" height="40" rx="6" fill="#e5e5ea"/><text x="100" y="165" text-anchor="middle" fill="#1d1d1f">루트(.)</text>
    <rect x="190" y="140" width="120" height="40" rx="6" fill="#e5e5ea"/><text x="250" y="165" text-anchor="middle" fill="#1d1d1f">in-addr.arpa</text>
    <rect x="340" y="140" width="120" height="40" rx="6" fill="#e5e5ea"/><text x="400" y="165" text-anchor="middle" fill="#1d1d1f">128.in-addr.arpa</text>
    <rect x="490" y="140" width="130" height="40" rx="6" fill="#fff4e0" stroke="#ff9f0a"/><text x="555" y="165" text-anchor="middle" fill="#1d1d1f">230.128.in-addr.arpa</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"><line x1="160" y1="160" x2="188" y2="160"/><line x1="310" y1="160" x2="338" y2="160"/><line x1="460" y1="160" x2="488" y2="160"/></g>
  <g font-size="11.5" fill="#6e6e73" text-anchor="middle">
    <text x="100" y="200">1단계 질의</text><text x="250" y="200">2단계 질의</text><text x="400" y="200">3단계 질의 (ARIN)</text><text x="555" y="200">4단계 질의 → PTR</text>
  </g>
  <rect x="40" y="226" width="580" height="86" rx="8" fill="#e8f2ff" stroke="#0a84ff"/>
  <text x="56" y="250" font-size="12.5" fill="#1d1d1f">마지막 단계의 서버는 그 주소 블록을 받은 기관이 운영한다. 공격자가 자기 주소 블록의</text>
  <text x="56" y="270" font-size="12.5" fill="#1d1d1f">역방향 존을 운영하면 PTR 응답에 아무 이름(예: www.bank.example)이나 적을 수 있다.</text>
  <text x="56" y="296" font-size="12.5" fill="#0a84ff">→ 역방향 조회 결과만 보고 접근을 허용하면 안 된다. 정방향으로 다시 조회해 대조한다.</text>
</svg>
