<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">스텁 리졸버와 재귀 리졸버, 단계마다 있는 캐시</text>
  <!-- 로컬 컴퓨터 -->
  <rect x="16" y="46" width="352" height="210" rx="10" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="192" y="246" text-anchor="middle" font-size="12" fill="#6e6e73">로컬 컴퓨터(운영체제)</text>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <rect x="34" y="104" width="120" height="36" rx="6" fill="#fff" stroke="#1d1d1f"/><text x="94" y="127">웹 브라우저</text>
    <rect x="34" y="166" width="120" height="36" rx="6" fill="#fff" stroke="#1d1d1f"/><text x="94" y="189">메일 클라이언트</text>
    <rect x="214" y="134" width="134" height="40" rx="6" fill="#0a84ff"/><text x="281" y="159" fill="#fff" font-weight="600">스텁 리졸버</text>
  </g>
  <!-- 캐시 -->
  <g font-size="11.5" fill="#1d1d1f" text-anchor="middle">
    <rect x="54" y="62" width="80" height="26" rx="13" fill="#e8f2ff" stroke="#0a84ff"/><text x="94" y="79">브라우저 캐시</text>
    <rect x="234" y="88" width="94" height="26" rx="13" fill="#e8f2ff" stroke="#0a84ff"/><text x="281" y="105">OS 캐시</text>
  </g>
  <g stroke="#0a84ff" stroke-width="1.2"><line x1="94" y1="88" x2="94" y2="104"/><line x1="281" y1="114" x2="281" y2="134"/></g>
  <g stroke="#1d1d1f" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M154 122 C185 122 185 150 212 150"/>
    <path d="M154 184 C185 184 185 160 212 160"/>
  </g>
  <!-- ISP -->
  <rect x="404" y="46" width="160" height="210" rx="10" fill="#f5f5f7" stroke="#6e6e73"/>
  <text x="484" y="246" text-anchor="middle" font-size="12" fill="#6e6e73">ISP 또는 공개 리졸버</text>
  <rect x="418" y="134" width="132" height="40" rx="6" fill="#1d1d1f"/>
  <text x="484" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">재귀 리졸버</text>
  <rect x="432" y="88" width="104" height="26" rx="13" fill="#e8f2ff" stroke="#0a84ff"/>
  <text x="484" y="105" text-anchor="middle" font-size="11.5" fill="#1d1d1f">공유 캐시(가장 큼)</text>
  <line x1="484" y1="114" x2="484" y2="134" stroke="#0a84ff" stroke-width="1.2"/>
  <line x1="348" y1="154" x2="416" y2="154" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="382" y="146" text-anchor="middle" font-size="11.5" fill="#1d1d1f">재귀 질의</text>
  <path d="M550 154 C580 154 590 120 620 112" stroke="#1d1d1f" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="604" y="190" text-anchor="middle" font-size="11.5" fill="#1d1d1f">루트부터</text>
  <text x="604" y="206" text-anchor="middle" font-size="11.5" fill="#1d1d1f">반복 질의</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#6e6e73">스텁 리졸버는 질의를 통째로 맡기고, 트리 탐색은 재귀 리졸버가 한다</text>
</svg>
