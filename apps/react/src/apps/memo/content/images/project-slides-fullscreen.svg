<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="360" fill="#fff"/>
<text x="320" y="26" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">슬라이드쇼와 Fullscreen API의 시작·종료 경로</text>
<rect x="220" y="44" width="200" height="46" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="320" y="64" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">⇧⌘F 또는 보기 › 슬라이드쇼</text>
<text x="320" y="81" font-size="12" fill="#6e6e73" text-anchor="middle">element.requestFullscreen()</text>
<rect x="40" y="126" width="250" height="50" rx="8" fill="#e5f1ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="165" y="147" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">허용: 모니터 전체 화면</text>
<text x="165" y="165" font-size="12" fill="#6e6e73" text-anchor="middle">fullscreenchange → entered = true</text>
<rect x="350" y="126" width="250" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="475" y="147" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">거절: 브라우저 창 안의 검은 화면</text>
<text x="475" y="165" font-size="12" fill="#6e6e73" text-anchor="middle">Promise 거절은 무시 (catch)</text>
<line x1="290" y1="90" x2="190" y2="124" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="350" y1="90" x2="450" y2="124" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="212" width="250" height="50" rx="8" fill="#fff" stroke="#6e6e73"/>
<text x="165" y="233" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">브라우저가 전체 화면 해제</text>
<text x="165" y="251" font-size="12" fill="#6e6e73" text-anchor="middle">Esc 등으로 fullscreenElement가 null</text>
<rect x="350" y="212" width="250" height="50" rx="8" fill="#fff" stroke="#6e6e73"/>
<text x="475" y="233" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">페이지가 Esc keydown 수신</text>
<text x="475" y="251" font-size="12" fill="#6e6e73" text-anchor="middle">window 캡처 단계 처리기</text>
<line x1="165" y1="176" x2="165" y2="210" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="475" y1="176" x2="475" y2="210" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="170" y="296" width="300" height="50" rx="8" fill="#eafaef" stroke="#34c759" stroke-width="1.5"/>
<text x="320" y="317" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">close(): 한 번만 실행 (closed ref)</text>
<text x="320" y="335" font-size="12" fill="#6e6e73" text-anchor="middle">onClose(마지막 쪽) → 미리보기 창이 그 쪽으로 스크롤</text>
<line x1="165" y1="262" x2="250" y2="294" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="475" y1="262" x2="390" y2="294" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
