<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>content.test.ts의 글별 링크 검사 순서</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<text x="24" y="32" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="600">content.test.ts의 글별 링크 검사</text>
<text x="24" y="54" font-size="12" fill="#6e6e73" text-anchor="start">it.each가 글마다 시험을 하나씩 만들고, 각 시험은 코드 밖의 본문 줄만 검사한다</text>
<rect x="170" y="72" width="300" height="44" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="320" y="99" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">저장소 글 223편의 원문 (it.each)</text>
<line x1="320" y1="116" x2="320" y2="136" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="120" y="138" width="400" height="52" rx="6" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.2"/>
<text x="320" y="160" font-size="13" fill="#0a84ff" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">proseLines(source)</text>
<text x="320" y="180" font-size="12" fill="#6e6e73" text-anchor="middle">``` 코드 블록 줄과 `인라인 코드`를 제외한 본문 줄</text>
<path d="M320 190 L320 204 L110 204 L110 222" fill="none" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M320 190 L320 204 L320 204 L320 222" fill="none" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M320 190 L320 204 L530 204 L530 222" fill="none" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="24" y="224" width="172" height="150" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/>
<text x="36" y="248" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="600">① 링크 대상</text>
<text x="36" y="272" font-size="12" fill="#1d1d1f" text-anchor="start">](/memo/주소)의 주소가</text>
<text x="36" y="290" font-size="12" fill="#1d1d1f" text-anchor="start">저장소 글 slug 집합에 있다</text>
<text x="36" y="324" font-size="12" fill="#ff3b30" text-anchor="start">실패하는 원문 예</text>
<text x="36" y="346" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">[글](/memo/no-such)</text>
<rect x="234" y="224" width="172" height="150" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/>
<text x="246" y="248" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="600">② 주소만 적은 곳</text>
<text x="246" y="272" font-size="12" fill="#1d1d1f" text-anchor="start">](…)를 뺀 줄에</text>
<text x="246" y="290" font-size="12" fill="#1d1d1f" text-anchor="start">/memo/주소가 남지 않는다</text>
<text x="246" y="324" font-size="12" fill="#ff3b30" text-anchor="start">실패하는 원문 예</text>
<text x="246" y="346" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">- 앞 글: /memo/x</text>
<rect x="444" y="224" width="172" height="150" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/>
<text x="456" y="248" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="600">③ 각주 뒤 괄호</text>
<text x="456" y="272" font-size="12" fill="#1d1d1f" text-anchor="start">[^라벨]( 형태가</text>
<text x="456" y="290" font-size="12" fill="#1d1d1f" text-anchor="start">본문 줄에 없다</text>
<text x="456" y="324" font-size="12" fill="#ff3b30" text-anchor="start">실패하는 원문 예</text>
<text x="456" y="346" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">요청[^p](OPTIONS)</text>
<text x="24" y="404" font-size="12" fill="#6e6e73" text-anchor="start">실패하면 시험 이름에 파일 경로가 들어 있어 어느 글인지 바로 확인할 수 있다</text>
</svg>
