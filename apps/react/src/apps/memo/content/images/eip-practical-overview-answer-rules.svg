<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>실기 답안에서 점수를 잃는 경우</title><rect width="640" height="330" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">같은 뜻이라도 문제가 요구한 형태로 써야 한다</text>
<g font-size="13"><rect x="20" y="48" width="600" height="30" fill="#f2f2f7"/><text x="40" y="68" fill="#1d1d1f" font-weight="600">문제가 요구한 것</text><text x="300" y="68" fill="#30d158" font-weight="600">맞는 답</text><text x="470" y="68" fill="#ff453a" font-weight="600">틀리는 답</text>
<text x="40" y="106" fill="#1d1d1f">영문 약어로 쓰시오</text><text x="300" y="106" fill="#1d1d1f">EAI</text><text x="470" y="106" fill="#6e6e73">기업 애플리케이션 통합</text>
<text x="40" y="146" fill="#1d1d1f">한 단어로 쓰시오</text><text x="300" y="146" fill="#1d1d1f">스텁</text><text x="470" y="146" fill="#6e6e73">스텁, 드라이버</text>
<text x="40" y="186" fill="#1d1d1f">순서대로 쓰시오</text><text x="300" y="186" fill="#1d1d1f">ㄷ → ㄱ → ㄴ</text><text x="470" y="186" fill="#6e6e73">ㄱ, ㄴ, ㄷ (순서 무시)</text>
<text x="40" y="226" fill="#1d1d1f">보기에서 골라 기호로 쓰시오</text><text x="300" y="226" fill="#1d1d1f">ㄹ</text><text x="470" y="226" fill="#6e6e73">상태 전이 테스트</text>
<text x="40" y="266" fill="#1d1d1f">출력 결과를 쓰시오</text><text x="300" y="266" fill="#1d1d1f">1 3 5</text><text x="470" y="266" fill="#6e6e73">135 (공백 누락)</text>
<g stroke="#e5e5ea"><line x1="20" y1="122" x2="620" y2="122"/><line x1="20" y1="162" x2="620" y2="162"/><line x1="20" y1="202" x2="620" y2="202"/><line x1="20" y1="242" x2="620" y2="242"/><line x1="20" y1="282" x2="620" y2="282"/></g>
<text x="320" y="312" text-anchor="middle" font-size="12" fill="#6e6e73">답을 여러 개 써 두면 그중 하나가 맞아도 오답으로 처리될 수 있다</text></g>
</svg>
