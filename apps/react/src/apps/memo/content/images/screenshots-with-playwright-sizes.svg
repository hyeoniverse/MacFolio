<rect width="780" height="320" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">9월 30일에 한 번에 넣은 사진 일곱 장의 크기 (KB)</text>
<text x="252" y="79" font-size="11" font-weight="500" fill="#374151" text-anchor="end">drafts-status.jpg</text>
