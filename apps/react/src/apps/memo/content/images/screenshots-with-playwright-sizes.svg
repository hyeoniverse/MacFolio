<text x="32" y="300" font-size="10.5" font-weight="500" fill="#374151" text-anchor="start">목록 전체를 찍은 사진은 크고, 메뉴·막대만 잘라 찍은 사진은 작다. 1KB = 1,000바이트로 반올림.</text>
