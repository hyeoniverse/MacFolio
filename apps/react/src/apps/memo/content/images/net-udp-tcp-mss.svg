<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="260" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <g stroke="#6e6e73" stroke-width="1.5">
    <line x1="120" y1="80" x2="300" y2="80"/>
    <line x1="380" y1="80" x2="460" y2="80"/>
    <line x1="460" y1="40" x2="460" y2="130"/>
    <line x1="460" y1="80" x2="520" y2="80"/>
  </g>
  <rect x="44" y="64" width="76" height="32" rx="5" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.3"/>
  <text x="82" y="85" text-anchor="middle" font-size="13" fill="#1d1d1f">slip</text>
  <rect x="300" y="64" width="76" height="32" rx="5" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.3"/>
  <text x="338" y="85" text-anchor="middle" font-size="13" fill="#1d1d1f">bsdi</text>
  <rect x="520" y="64" width="76" height="32" rx="5" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.3"/>
  <text x="558" y="85" text-anchor="middle" font-size="13" fill="#1d1d1f">sun</text>
  <g font-size="12" fill="#6e6e73" text-anchor="middle">
    <text x="210" y="70">SLIP 링크</text>
    <text x="210" y="102" fill="#ff9f0a" font-weight="600">MTU 296</text>
    <text x="420" y="70">이더넷</text>
    <text x="420" y="102">MTU 1500</text>
  </g>
  <g stroke-width="1.6">
    <line x1="590" y1="160" x2="86" y2="160" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="86" y1="210" x2="590" y2="210" stroke="#ff9f0a" marker-end="url(#o)"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="338" y="152" fill="#0a84ff">① SYN &lt;mss 1460&gt;: sun은 1500 − 40 = 1460바이트까지 받는다</text>
    <text x="338" y="202" fill="#ff9f0a">② SYN+ACK &lt;mss 256&gt;: slip은 296 − 40 = 256바이트까지 받는다</text>
  </g>
  <text x="320" y="246" text-anchor="middle" font-size="12" fill="#6e6e73">sun은 slip에게 256바이트보다 큰 세그먼트를 보내지 않는다</text>
</svg>
