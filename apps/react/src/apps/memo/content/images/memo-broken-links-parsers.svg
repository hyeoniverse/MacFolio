<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="392" fill="#fff"/>
<text x="24" y="30" font-size="15" fill="#1f2937" font-weight="600">같은 원문을 두 GFM 파서가 다르게 해석한다</text>
<text x="24" y="49" font-size="11" fill="#6b7280">원문 끝에 [^preflight]: … 정의가 있는 경우. 빨강은 링크, 초록은 각주로 해석된 결과</text>
<rect x="24" y="64" width="712" height="40" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="38" y="89" font-size="12.5" fill="#1f2937" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">사전 요청[^preflight](OPTIONS)을 먼저 보내는데</text>
<path d="M200 104 V124" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
<path d="M560 104 V124" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
<rect x="24" y="124" width="350" height="150" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="38" y="147" font-size="12" fill="#065f46" font-weight="600">micromark (사이트: react-markdown + remark-gfm)</text>
<text x="38" y="168" font-size="11" fill="#4b5563">[ 에서 각주 호출을 먼저 시도한다.</text>
<text x="38" y="186" font-size="11" fill="#4b5563">정의된 라벨이면 각주, 아니면 일반 대괄호</text>
<text x="38" y="212" font-size="11" fill="#065f46" font-weight="600">정의 있음 → 각주 + 글자 "(OPTIONS)"</text>
<text x="38" y="230" font-size="11" fill="#4b5563">화면: 사전 요청¹(OPTIONS)을</text>
<text x="38" y="254" font-size="11" fill="#b91c1c" font-weight="600">정의 없음 → 링크 &lt;a href="OPTIONS"&gt;^preflight&lt;/a&gt;</text>
<rect x="386" y="124" width="350" height="150" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="400" y="147" font-size="12" fill="#991b1b" font-weight="600">cmark-gfm (GitHub의 파일·PR 화면)</text>
<text x="400" y="168" font-size="11" fill="#4b5563">] 뒤에 ( 가 오면 인라인 링크를 먼저 시도한다.</text>
<text x="400" y="186" font-size="11" fill="#4b5563">괄호 안이 링크 주소 형식일 때 링크가 된다</text>
<text x="400" y="212" font-size="11" fill="#b91c1c" font-weight="600">(OPTIONS) → 링크 &lt;a href="OPTIONS"&gt;^preflight&lt;/a&gt;</text>
<text x="400" y="230" font-size="11" fill="#4b5563">정의가 있어도 각주가 사라진다</text>
<text x="400" y="254" font-size="11" fill="#065f46" font-weight="600">(앱 창) → 공백이 있어 주소가 아님 → 각주</text>
<rect x="24" y="290" width="712" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="38" y="313" font-size="12" fill="#1e3a8a" font-weight="600">수정: 괄호 설명을 각주 앞으로</text>
<text x="38" y="337" font-size="12.5" fill="#1f2937" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">사전 요청(OPTIONS)[^preflight]을 먼저 보내는데</text>
<text x="38" y="361" font-size="11" fill="#4b5563">각주 뒤에 ( 가 오지 않으므로 두 파서 모두 각주로 해석한다. 각주 번호도 설명 뒤에 붙는다</text>
</svg>
