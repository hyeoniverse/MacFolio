<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>브라우저와 운영체제에 따른 렌더링 엔진. macOS의 Safari·Chrome·Firefox는 각각 WebKit·Blink·Gecko이지만, iOS에서는 세 브라우저 모두 WebKit이다(EU·일본 제외). 같은 WebKit이라도 macOS와 iOS는 GPU 합성 방식과 화면 조건이 다르다</title>
<rect width="860" height="420" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">브라우저보다 렌더링 엔진과 운영체제</text>
<text x="32" y="56" font-size="11" fill="#6b7280">iPhone에서는 Chrome도 WebKit으로 렌더링한다 (EU·일본 제외). 같은 WebKit이라도 macOS와 iOS는 합성 방식이 다르다</text>
<text x="290" y="92" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">macOS</text>
<text x="520" y="92" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">iOS</text>
<text x="750" y="92" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Windows·Android</text>
<text x="48" y="142" font-size="13" fill="#1f2937" font-weight="700">Safari</text>
<text x="48" y="222" font-size="13" fill="#1f2937" font-weight="700">Chrome</text>
<text x="48" y="302" font-size="13" fill="#1f2937" font-weight="700">Firefox</text>
<rect x="200" y="110" width="180" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="290" y="137" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">WebKit</text>
<text x="290" y="156" font-size="10.5" fill="#374151" text-anchor="middle">Core Animation</text>
<rect x="430" y="110" width="180" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="520" y="137" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">WebKit</text>
<text x="520" y="156" font-size="10.5" fill="#374151" text-anchor="middle">Core Animation, 타일 렌더링</text>
<rect x="660" y="110" width="180" height="62" rx="9" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="750" y="137" font-size="13" fill="#9ca3af" font-weight="700" text-anchor="middle">—</text>
<text x="750" y="156" font-size="10.5" fill="#374151" text-anchor="middle">없음</text>
<rect x="200" y="190" width="180" height="62" rx="9" fill="#ecfdf5" stroke="#15803d" stroke-width="1.2"/>
<text x="290" y="217" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Blink</text>
<text x="290" y="236" font-size="10.5" fill="#374151" text-anchor="middle">Skia</text>
<rect x="430" y="190" width="180" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="520" y="217" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">WebKit</text>
<text x="520" y="236" font-size="10.5" fill="#374151" text-anchor="middle">Safari와 같은 엔진</text>
<rect x="660" y="190" width="180" height="62" rx="9" fill="#ecfdf5" stroke="#15803d" stroke-width="1.2"/>
<text x="750" y="217" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Blink</text>
<text x="750" y="236" font-size="10.5" fill="#374151" text-anchor="middle">Skia</text>
<rect x="200" y="270" width="180" height="62" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="290" y="297" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">Gecko</text>
<text x="290" y="316" font-size="10.5" fill="#374151" text-anchor="middle">WebRender</text>
<rect x="430" y="270" width="180" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="520" y="297" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">WebKit</text>
<text x="520" y="316" font-size="10.5" fill="#374151" text-anchor="middle">Safari와 같은 엔진</text>
<rect x="660" y="270" width="180" height="62" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="750" y="297" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">Gecko</text>
<text x="750" y="316" font-size="10.5" fill="#374151" text-anchor="middle">WebRender</text>
<rect x="426" y="104" width="188" height="234" rx="12" fill="none" stroke="#4f46e5" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="520" y="358" font-size="10.5" fill="#4f46e5" text-anchor="middle">iOS: 모든 브라우저가 WebKit</text>
<text x="32" y="392" font-size="10.5" fill="#6b7280">각 칸의 두 번째 줄은 그래픽·합성 계층. 같은 WebKit이라도 GPU 메모리, 레이어 분리 기준, 화면 크기 조건이 달라 결과가 다를 수 있다</text>
</svg>
