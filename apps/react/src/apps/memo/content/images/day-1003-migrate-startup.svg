<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 352" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>컨테이너 시작 시 마이그레이션을 적용하는 순서</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="352" fill="#ffffff"/>
<text x="24" y="34" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="700">docker compose up -d --build api 이후 컨테이너 시작 순서</text>
<rect x="24" y="60" width="140" height="116" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
<text x="40" y="86" font-size="18" fill="#1d1d1f" text-anchor="start" font-weight="700">1</text>
<text x="40" y="110" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">이미지 빌드</text>
<text x="40" y="148" font-size="12" fill="#6e6e73" text-anchor="start">~/macfolio의</text>
<text x="40" y="164" font-size="12" fill="#6e6e73" text-anchor="start">새 코드로</text>
<line x1="164" y1="118" x2="174" y2="118" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="176" y="60" width="140" height="116" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/>
<text x="192" y="86" font-size="18" fill="#0a84ff" text-anchor="start" font-weight="700">2</text>
<text x="192" y="110" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">prisma</text>
<text x="192" y="128" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">migrate deploy</text>
<text x="192" y="148" font-size="12" fill="#6e6e73" text-anchor="start">적용 기록 표와</text>
<text x="192" y="164" font-size="12" fill="#6e6e73" text-anchor="start">폴더를 비교</text>
<line x1="316" y1="118" x2="326" y2="118" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="328" y="60" width="140" height="116" rx="10" fill="#ffffff" stroke="#c27400" stroke-width="1.6"/>
<text x="344" y="86" font-size="18" fill="#c27400" text-anchor="start" font-weight="700">3</text>
<text x="344" y="110" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">미적용</text>
<text x="344" y="128" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">마이그레이션 실행</text>
<text x="344" y="148" font-size="12" fill="#6e6e73" text-anchor="start">…_wallpapers</text>
<text x="344" y="164" font-size="12" fill="#6e6e73" text-anchor="start">한 건 적용</text>
<line x1="468" y1="118" x2="478" y2="118" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="480" y="60" width="140" height="116" rx="10" fill="#ffffff" stroke="#248a3d" stroke-width="1.6"/>
<text x="496" y="86" font-size="18" fill="#248a3d" text-anchor="start" font-weight="700">4</text>
<text x="496" y="110" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">Nest 시작</text>
<text x="496" y="148" font-size="12" fill="#6e6e73" text-anchor="start">요청 수신</text>
<text x="496" y="164" font-size="12" fill="#6e6e73" text-anchor="start">시작</text>
<rect x="24" y="196" width="592" height="112" rx="10" fill="#1d1d1f" stroke="none" stroke-width="1.2"/>
<text x="40" y="222" font-size="12" fill="#8e8e93" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">$ docker compose logs -f api</text>
<text x="40" y="244" font-size="12" fill="#f2f2f7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">Applying migration `20261002150000_wallpapers`</text>
<text x="40" y="266" font-size="12" fill="#f2f2f7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">All migrations have been successfully applied.</text>
<text x="40" y="288" font-size="12" fill="#f2f2f7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">[Nest] … Nest application successfully started</text>
<text x="24" y="336" font-size="12" fill="#6e6e73" text-anchor="start">마이그레이션이 실패하면 4단계로 넘어가지 않으므로, 옛 스키마로 새 코드가 동작하는 상황이 생기지 않는다.</text>
</svg>
