<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>열린 메뉴를 인덱스로 저장하면 등록 후 다른 메뉴가 열린다</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker></defs>
<rect width="860" height="480" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">열린 메뉴를 인덱스로 저장하면, 메뉴 등록 후 다른 메뉴가 열린다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">Dock에서 메모를 열자마자 '윈도우'를 누른 경우 (제목 구성은 설명용 도식)</text>

<text x="400" y="130" font-size="12" fill="#374151" font-weight="700">① 누른 시각: 메모 메뉴 등록 전</text>
<g font-size="12" text-anchor="middle">
<rect x="32" y="108" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="72" y="130" fill="#374151" font-weight="700">메모</text>
<rect x="120" y="108" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="160" y="130" fill="#374151">파일</text>
<rect x="208" y="108" width="80" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="248" y="130" fill="#4f46e5" font-weight="700">윈도우</text>
<rect x="296" y="108" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="336" y="130" fill="#374151">도움말</text>
<text x="72" y="158" font-size="10" fill="#6b7280">0</text><text x="160" y="158" font-size="10" fill="#6b7280">1</text><text x="248" y="158" font-size="10" fill="#4f46e5" font-weight="700">2</text><text x="336" y="158" font-size="10" fill="#6b7280">3</text>
</g>

<text x="572" y="226" font-size="12" fill="#374151" font-weight="700">② 렌더링 시각:</text><text x="572" y="243" font-size="12" fill="#374151" font-weight="700">편집·보기 등록 후</text>
<g font-size="12" text-anchor="middle">
<rect x="32" y="210" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="72" y="232" fill="#374151" font-weight="700">메모</text>
<rect x="120" y="210" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="160" y="232" fill="#374151">파일</text>
<rect x="208" y="210" width="80" height="34" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="248" y="232" fill="#b91c1c" font-weight="700">편집</text>
<rect x="296" y="210" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="336" y="232" fill="#374151">보기</text>
<rect x="384" y="210" width="80" height="34" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="424" y="232" fill="#15803d" font-weight="700">윈도우</text>
<rect x="472" y="210" width="80" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="512" y="232" fill="#374151">도움말</text>
<text x="72" y="260" font-size="10" fill="#6b7280">0</text><text x="160" y="260" font-size="10" fill="#6b7280">1</text><text x="248" y="260" font-size="10" fill="#b91c1c" font-weight="700">2</text><text x="336" y="260" font-size="10" fill="#6b7280">3</text><text x="424" y="260" font-size="10" fill="#15803d" font-weight="700">4</text><text x="512" y="260" font-size="10" fill="#6b7280">5</text>
</g>

<line x1="248" y1="164" x2="248" y2="204" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<path d="M 262 164 C 330 176, 400 186, 420 204" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-green)"/>

<rect x="32" y="292" width="388" height="74" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="226" y="316" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">수정 전: 인덱스 2를 저장</text>
<text x="226" y="336" font-size="11" fill="#374151" text-anchor="middle">등록 후 2번 자리는 '편집'</text>
<text x="226" y="353" font-size="11" fill="#374151" text-anchor="middle">→ 누르지 않은 메뉴가 열린다</text>

<rect x="440" y="292" width="388" height="74" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="634" y="316" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">수정 후: 제목 '윈도우'를 저장</text>
<text x="634" y="336" font-size="11" fill="#374151" text-anchor="middle">등록 후에도 제목으로 찾아 4번</text>
<text x="634" y="353" font-size="11" fill="#374151" text-anchor="middle">→ 누른 메뉴가 그대로 열린다</text>

<rect x="32" y="382" width="796" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="52" y="408" font-size="13" fill="#b45309" font-weight="700">같은 원인의 두 번째 버그: 이동해 온 제목</text>
<text x="52" y="430" font-size="11" fill="#374151">등록으로 제목들이 오른쪽으로 이동하면, 정지한 포인터 아래로 '편집'이 들어오며 pointerenter가 발생한다.</text>
<text x="52" y="448" font-size="11" fill="#374151">전환 조건을 pointermove + movementX·movementY ≠ 0으로 바꿔, 포인터가 실제로 움직일 때만 다른 메뉴로 전환한다.</text>
</svg>
