<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>DAC·MAC·RBAC가 권한을 정하는 방식</title><rect width="640" height="300" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<g font-size="13">
<text x="107" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">DAC 임의적</text>
<text x="320" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">MAC 강제적</text>
<text x="533" y="30" text-anchor="middle" font-weight="600" fill="#1d1d1f">RBAC 역할 기반</text>
<line x1="213" y1="44" x2="213" y2="250" stroke="#f2f2f7" stroke-width="2"/><line x1="427" y1="44" x2="427" y2="250" stroke="#f2f2f7" stroke-width="2"/>
<rect x="47" y="56" width="120" height="36" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="107" y="79" text-anchor="middle" fill="#1d1d1f">파일 소유자 김</text>
<path d="M107 92 V128" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="115" y="115" font-size="12" fill="#6e6e73">권한 부여</text>
<rect x="47" y="132" width="120" height="36" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="107" y="155" text-anchor="middle" fill="#1d1d1f">이 → 읽기 허용</text>
<text x="107" y="198" text-anchor="middle" font-size="12" fill="#6e6e73">신원(ID) 기준</text><text x="107" y="216" text-anchor="middle" font-size="12" fill="#6e6e73">예: chmod, ACL</text>
<rect x="250" y="56" width="140" height="30" fill="#ff453a"/><text x="320" y="76" text-anchor="middle" fill="#fff" font-size="12">극비</text>
<rect x="250" y="86" width="140" height="30" fill="#ff9f0a"/><text x="320" y="106" text-anchor="middle" fill="#fff" font-size="12">비밀</text>
<rect x="250" y="116" width="140" height="30" fill="#0a84ff"/><text x="320" y="136" text-anchor="middle" fill="#fff" font-size="12">대외비</text>
<rect x="250" y="146" width="140" height="30" fill="#30d158"/><text x="320" y="166" text-anchor="middle" fill="#fff" font-size="12">일반</text>
<text x="320" y="198" text-anchor="middle" font-size="12" fill="#6e6e73">관리자가 정한 보안 등급 기준</text><text x="320" y="216" text-anchor="middle" font-size="12" fill="#6e6e73">사용자 등급 ≥ 자료 등급이면 읽기</text>
<rect x="473" y="56" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="533" y="76" text-anchor="middle" fill="#1d1d1f" font-size="12">사용자 박·최</text>
<path d="M533 86 V104" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<rect x="473" y="108" width="120" height="30" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="533" y="128" text-anchor="middle" fill="#0a84ff" font-size="12">역할: 회계 담당</text>
<path d="M533 138 V156" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<rect x="473" y="160" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="533" y="180" text-anchor="middle" fill="#1d1d1f" font-size="12">권한: 전표 조회·작성</text>
<text x="533" y="216" text-anchor="middle" font-size="12" fill="#6e6e73">직무(역할) 기준</text>
<text x="320" y="268" text-anchor="middle" font-size="12" fill="#6e6e73">누가 권한을 정하는가: DAC는 소유자, MAC는 시스템(관리자), RBAC는 역할에 묶어 중앙 관리</text>
</g></svg>
