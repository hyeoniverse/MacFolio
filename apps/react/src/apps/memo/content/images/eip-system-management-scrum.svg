<rect x="576" y="118" width="54" height="54" rx="6" fill="#30d158"/><text x="603" y="142" text-anchor="middle" fill="#fff" font-size="12">증분</text><text x="603" y="158" text-anchor="middle" fill="#fff" font-size="12">출시</text>
<path d="M118 145 H146" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M254 145 H274" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<path d="M418 120 L448 102" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M418 170 L448 188" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M556 97 L580 122" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<path d="M504 222 C504 280 202 280 202 184" fill="none" stroke="#6e6e73" stroke-dasharray="5 4" stroke-width="2" marker-end="url(#a)"/><text x="350" y="292" text-anchor="middle" font-size="12" fill="#6e6e73">다음 스프린트로 반복</text>
<text x="66" y="40" text-anchor="middle" font-size="12" fill="#6e6e73">제품 책임자(PO)</text><path d="M66 48 V104" stroke="#c7c7cc"/>
<text x="350" y="40" text-anchor="middle" font-size="12" fill="#6e6e73">개발팀 + 스크럼 마스터(SM)</text><path d="M350 48 V70" stroke="#c7c7cc"/>
