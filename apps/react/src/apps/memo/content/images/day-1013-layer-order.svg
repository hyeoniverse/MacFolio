<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>빌드한 HTML에서 CSS 파일 순서에 따라 뒤집힌 @layer 순서와 수정</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker></defs>
<rect width="640" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">@layer 순서는 처음 등장한 곳에서 정해진다</text>
<text x="20" y="62" font-size="13" font-weight="700" fill="#ff3b30">수정 전: 빌드한 index.html</text>
<rect x="20" y="74" width="290" height="34" rx="6" fill="#f2f2f7"/><text x="32" y="96" font-size="12" fill="#1d1d1f">1. &lt;link&gt; 공통 컴포넌트가 든 CSS 파일</text>
<rect x="20" y="114" width="290" height="34" rx="6" fill="#f2f2f7"/><text x="32" y="136" font-size="12" fill="#1d1d1f">2. &lt;link&gt; main CSS (@layer reset, components;)</text>
<rect x="330" y="74" width="290" height="74" rx="8" fill="#fff1f0" stroke="#ff3b30"/>
<text x="346" y="98" font-size="12" fill="#1d1d1f">결정된 순서: components → reset</text>
<text x="346" y="118" font-size="12" fill="#ff3b30">뒤에 온 reset이 우선:</text>
<text x="346" y="136" font-size="12" fill="#ff3b30">* { padding: 0 }이 버튼의 padding을 이긴다</text>
<path d="M310 111 H326" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
<rect x="20" y="164" width="600" height="44" rx="8" fill="#ffffff" stroke="#c7c7cc"/>
<text x="36" y="183" font-size="12" fill="#6e6e73">결과 예: 답장 버튼</text>
<rect x="160" y="172" width="44" height="28" rx="5" fill="#0a84ff"/><text x="182" y="190" font-size="12" fill="#ffffff" text-anchor="middle">답장</text>
<text x="216" y="190" font-size="12" fill="#ff3b30">padding 0: 글자가 테두리에 붙는다</text>
<text x="20" y="244" font-size="13" font-weight="700" fill="#1f7a3a">수정 후: index.html 인라인 &lt;style&gt; 맨 앞에서 선언 (#221)</text>
<rect x="20" y="256" width="290" height="34" rx="6" fill="#effaf2" stroke="#34c759"/><text x="32" y="278" font-size="12" fill="#1d1d1f">0. &lt;style&gt;@layer reset, components;</text>
<rect x="20" y="296" width="290" height="30" rx="6" fill="#f2f2f7"/><text x="32" y="316" font-size="12" fill="#1d1d1f">1. &lt;link&gt; 공통 컴포넌트 CSS</text>
<rect x="20" y="332" width="290" height="30" rx="6" fill="#f2f2f7"/><text x="32" y="352" font-size="12" fill="#1d1d1f">2. &lt;link&gt; main CSS</text>
<rect x="330" y="256" width="290" height="70" rx="8" fill="#effaf2" stroke="#34c759"/>
<text x="346" y="280" font-size="12" fill="#1d1d1f">결정된 순서: reset → components</text>
<text x="346" y="300" font-size="12" fill="#1f7a3a">CSS 파일이 어떤 순서로 붙어도</text>
<text x="346" y="318" font-size="12" fill="#1f7a3a">공통 컴포넌트 스타일이 우선한다</text>
<path d="M310 273 H326" stroke="#34c759" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="330" y="340" width="70" height="28" rx="5" fill="#0a84ff"/><text x="365" y="358" font-size="12" fill="#ffffff" text-anchor="middle">답장</text>
<text x="410" y="358" font-size="12" fill="#1f7a3a">여백 복원</text>
</svg>
