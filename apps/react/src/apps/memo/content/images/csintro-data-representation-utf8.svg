<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>UTF-8 바이트 구성과 '가'(U+AC00)의 인코딩</title>
<rect width="640" height="380" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">UTF-8: 코드 포인트 범위에 따라 1~4바이트</text>
<g font-size="12" fill="#1d1d1f">
<text x="30" y="66" font-weight="600">코드 포인트 범위</text><text x="230" y="66" font-weight="600">바이트 형식 (x = 코드 포인트 비트)</text><text x="560" y="66" font-weight="600">예</text>
</g>
<g font-size="12" fill="#1d1d1f">
<text x="30" y="94">U+0000 ~ U+007F</text><text x="560" y="94">A</text>
<text x="30" y="122">U+0080 ~ U+07FF</text><text x="560" y="122">é</text>
<text x="30" y="150">U+0800 ~ U+FFFF</text><text x="560" y="150" fill="#0a84ff" font-weight="600">가</text>
<text x="30" y="178">U+10000 ~ U+10FFFF</text><text x="560" y="178">U+1F600</text>
</g>
<g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1d1d1f">
<text x="230" y="94"><tspan fill="#ff9f0a">0</tspan>xxxxxxx</text>
<text x="230" y="122"><tspan fill="#ff9f0a">110</tspan>xxxxx <tspan fill="#ff9f0a">10</tspan>xxxxxx</text>
<text x="230" y="150"><tspan fill="#ff9f0a">1110</tspan>xxxx <tspan fill="#ff9f0a">10</tspan>xxxxxx <tspan fill="#ff9f0a">10</tspan>xxxxxx</text>
<text x="230" y="178"><tspan fill="#ff9f0a">11110</tspan>xxx <tspan fill="#ff9f0a">10</tspan>xxxxxx <tspan fill="#ff9f0a">10</tspan>xxxxxx <tspan fill="#ff9f0a">10</tspan>xxxxxx</text>
</g>
<line x1="30" y1="198" x2="610" y2="198" stroke="#f2f2f7" stroke-width="2"/>
<text x="30" y="226" font-size="13" font-weight="600" fill="#1d1d1f">'가' = U+AC00 인코딩</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="13">
<text x="30" y="256" fill="#6e6e73">16비트:</text>
<rect x="110" y="240" width="50" height="24" fill="#e8f2ff"/><rect x="164" y="240" width="74" height="24" fill="#eaf8ee"/><rect x="242" y="240" width="74" height="24" fill="#f2f2f7"/>
<text x="135" y="257" text-anchor="middle" fill="#1d1d1f">1010</text><text x="201" y="257" text-anchor="middle" fill="#1d1d1f">110000</text><text x="279" y="257" text-anchor="middle" fill="#1d1d1f">000000</text>
<text x="30" y="306" fill="#6e6e73">UTF-8:</text>
<rect x="110" y="290" width="110" height="24" fill="#e8f2ff"/><rect x="230" y="290" width="110" height="24" fill="#eaf8ee"/><rect x="350" y="290" width="110" height="24" fill="#f2f2f7"/>
<text x="165" y="307" text-anchor="middle" fill="#1d1d1f"><tspan fill="#ff9f0a">1110</tspan>1010</text><text x="285" y="307" text-anchor="middle" fill="#1d1d1f"><tspan fill="#ff9f0a">10</tspan>110000</text><text x="405" y="307" text-anchor="middle" fill="#1d1d1f"><tspan fill="#ff9f0a">10</tspan>000000</text>
<g text-anchor="middle" fill="#0a84ff" font-weight="600"><text x="165" y="338">EA</text><text x="285" y="338">B0</text><text x="405" y="338">80</text></g>
</g>
<g stroke="#6e6e73" fill="none"><path d="M135 266 L165 288"/><path d="M201 266 L285 288"/><path d="M279 266 L405 288"/></g>
<text x="480" y="307" font-size="12" fill="#6e6e73">3바이트</text>
<text x="30" y="366" font-size="12" fill="#6e6e73">주황 비트는 바이트 종류를 나타내는 고정 접두사다. 같은 '가'는 UTF-16에서 AC 00, 2바이트다.</text>
</svg>
