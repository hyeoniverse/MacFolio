<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 234" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>개발 서버, 고치기 전 빌드, 고친 뒤 빌드에서 CSS가 붙는 순서와 층 순서</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="900" height="234" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">개발 서버와 빌드 결과의 CSS 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">층 순서는 문서에서 층 이름이 처음 나온 곳이 정한다</text>
<rect x="32.0" y="76" width="262.6666666666667" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="46.0" y="100" font-size="12.5" font-weight="600" fill="#1f2937">개발 서버 (vite dev)</text><text x="46.0" y="122" font-size="10.5" fill="#374151">진입점이 import 순서대로 &lt;style&gt;을 넣는다</text><text x="46.0" y="140" font-size="10.5" fill="#374151">1. layers.css → @layer reset, components</text><text x="46.0" y="158" font-size="10.5" fill="#374151">2. index.css → @layer reset {…}</text><text x="46.0" y="176" font-size="10.5" fill="#374151">3. Button.css → @layer components {…}</text><text x="46.0" y="194" font-size="10.5" fill="#374151">결과: reset &lt; components  (버튼 여백 5px 14px)</text><rect x="318.6666666666667" y="76" width="262.6666666666667" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="332.6666666666667" y="100" font-size="12.5" font-weight="600" fill="#1f2937">빌드 (고치기 전)</text><text x="332.6666666666667" y="122" font-size="10.5" fill="#374151">공용 덩어리 CSS가 진입점 CSS보다 먼저 붙는다</text><text x="332.6666666666667" y="140" font-size="10.5" fill="#374151">1. repository-….css → @layer components {…}</text><text x="332.6666666666667" y="158" font-size="10.5" fill="#374151">2. main-….css → @layer reset, components …</text><text x="332.6666666666667" y="176" font-size="10.5" fill="#374151"></text><text x="332.6666666666667" y="194" font-size="10.5" fill="#374151">결과: components &lt; reset  (버튼 여백 0)</text><rect x="605.3333333333334" y="76" width="262.6666666666667" height="130" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="619.3333333333334" y="100" font-size="12.5" font-weight="600" fill="#4f46e5">빌드 (고친 뒤)</text><text x="619.3333333333334" y="122" font-size="10.5" fill="#374151">index.html 인라인 &lt;style&gt;이 맨 앞</text><text x="619.3333333333334" y="140" font-size="10.5" fill="#374151">0. &lt;style&gt;@layer reset,components;&lt;/style&gt;</text><text x="619.3333333333334" y="158" font-size="10.5" fill="#374151">1. 공용 CSS → components</text><text x="619.3333333333334" y="176" font-size="10.5" fill="#374151">2. 진입점 CSS → reset</text><text x="619.3333333333334" y="194" font-size="10.5" fill="#374151">결과: reset &lt; components  (5px 14px)</text>
</svg>
