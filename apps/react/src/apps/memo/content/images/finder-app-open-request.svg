<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 364" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>Finder가 요청을 저장소에 남기고 창을 열면, 메모가 마운트되며 남은 요청을 꺼내 그 글을 연다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="822" height="364" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">다른 앱에 &quot;이걸 열어 줘&quot;</text>
<text x="32" y="56" font-size="11" fill="#6b7280">apps/react/src/shared/lib/openRequest.ts</text>
<rect x="32" y="84" width="190" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="127.0" y="106" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">Finder</text><text x="127.0" y="126" font-size="10.5" fill="#374151" text-anchor="middle">글 두 번 누르기</text><rect x="300" y="84" width="220" height="64" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="410.0" y="106" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">openRequestStore</text><text x="410.0" y="126" font-size="10.5" fill="#374151" text-anchor="middle">{ request: { app: memo, id } }</text><rect x="600" y="84" width="190" height="64" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="695.0" y="106" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">창 관리</text><text x="695.0" y="126" font-size="10.5" fill="#374151" text-anchor="middle">openApp(memo)</text><line x1="224" y1="106" x2="298" y2="106" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="261.0" y="100.0" font-size="10" fill="#6b7280" text-anchor="middle">1. requestOpen</text><path d="M128 150 C 128 200, 640 200, 690 150" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="200" y="200" font-size="10" fill="#6b7280">2. openApp (부르는 쪽이 창을 연다)</text><rect x="600" y="240" width="190" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="695.0" y="262" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">메모 (처음이면 코드를 불러옴)</text><text x="695.0" y="282" font-size="10.5" fill="#374151" text-anchor="middle">마운트되며 useOpenRequest</text><text x="695.0" y="298" font-size="10.5" fill="#374151" text-anchor="middle">→ take() 한 번</text><line x1="695" y1="150" x2="695" y2="238" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><path d="M600 290 C 470 290, 430 230, 410 150" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><text x="300" y="300" font-size="10" fill="#6b7280">3. 남은 요청을 꺼내고 지운다 → 그 글을 연다</text><text x="32" y="342" font-size="10.5" fill="#374151">이미 열려 있는 앱은 subscribe(take)로 바로 받는다. Safari는 같은 방법으로 프로젝트 탭을 연다</text>
</svg>
