<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>표 머리를 누를 때의 정렬 (StatTable)</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="250" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">표 머리를 누를 때의 정렬 (StatTable)</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">같은 열을 다시 누르면 반대로, 다른 열로 옮기면 그 열의 기본 방향부터</text>
<rect x="32" y="100" width="200" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="132.0" y="130.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">방문 ▼ (처음)</text>
<text x="132.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle">많은 순, aria-sort=descending</text>
<rect x="330" y="100" width="200" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="430.0" y="130.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">방문 ▲</text>
<text x="430.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle">적은 순</text>
<rect x="628" y="100" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="728.0" y="130.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">이름 ▲</text>
<text x="728.0" y="147.5" font-size="11" fill="#374151" text-anchor="middle">가나다순, localeCompare ko</text>
<line x1="232" y1="125" x2="326" y2="125" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="279.0" y="119.0" font-size="11" fill="#4f46e5" text-anchor="middle">방문 누름</text>
<line x1="330" y1="150" x2="236" y2="150" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="283.0" y="168" font-size="11" fill="#4f46e5" text-anchor="middle">방문 누름</text>
<line x1="530" y1="135" x2="624" y2="135" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<text x="577.0" y="129.0" font-size="11" fill="#15803d" text-anchor="middle">이름 누름</text>
<text x="628" y="200" font-size="11" fill="#6b7280" text-anchor="start">이름을 다시 누르면 ▼ (거꾸로)</text>
</svg>
