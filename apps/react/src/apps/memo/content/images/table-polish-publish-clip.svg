<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>수정 전에는 게시 버튼의 위쪽 경계가 스크롤 칸(.memo-scroll)의 위쪽 경계와 같은 153px이라 overflow로 잘렸다. 본문 칸에 위쪽 여백 4px을 지정해 버튼이 스크롤 칸 안쪽으로 내려왔다</title>
<rect width="800" height="280" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">게시 버튼과 스크롤 칸 경계</text>
<text x="210" y="70" font-size="13" fill="#374151" font-weight="600" text-anchor="middle">수정 전</text>
<text x="590" y="70" font-size="13" fill="#374151" font-weight="600" text-anchor="middle">수정 후 (padding-top 4px)</text>
<rect x="50" y="84" width="320" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="66" y="108" font-size="11" fill="#6b7280">도구 막대</text>
<rect x="50" y="128" width="320" height="110" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="66" y="226" font-size="11" fill="#4338ca">.memo-scroll  top 153.0  overflow-y: auto</text>
<rect x="280" y="125" width="76" height="30" rx="7" fill="#fde68a" stroke="#f59e0b" stroke-dasharray="4 3"/>
<rect x="280" y="128" width="76" height="27" rx="0" fill="#f59e0b"/>
<text x="318" y="146" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">게시</text>
<text x="66" y="176" font-size="11" fill="#b91c1c">button top 153.0 = 스크롤 칸 top</text>
<text x="66" y="194" font-size="11" fill="#b91c1c">→ 경계 바깥(반 픽셀·초점 테두리)이 잘린다</text>
<rect x="430" y="84" width="320" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="446" y="108" font-size="11" fill="#6b7280">도구 막대</text>
<rect x="430" y="128" width="320" height="110" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<rect x="431" y="129" width="318" height="4" fill="#bbf7d0"/>
<text x="446" y="226" font-size="11" fill="#4338ca">.memo-scroll  padding-top 4px</text>
<rect x="660" y="135" width="76" height="27" rx="7" fill="#f59e0b"/>
<text x="698" y="153" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">게시</text>
<text x="446" y="183" font-size="11" fill="#15803d">버튼이 경계에서 4px 아래</text>
<text x="446" y="201" font-size="11" fill="#15803d">→ 위쪽 테두리까지 모두 표시된다</text>
<text x="400" y="266" font-size="10.5" fill="#374151" text-anchor="middle">읽기 화면도 같은 스크롤 칸을 사용하므로 날짜 줄도 4px 내려가, 읽기와 편집 화면의 위치가 계속 일치한다</text>
</svg>
