<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>⌘W와 ⌥W 키 입력이 전달되는 경로</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<rect x="20" y="130" width="110" height="64" rx="10" fill="#f2f2f7"/>
<text x="75" y="158" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">키보드</text>
<text x="75" y="178" font-size="12" fill="#6e6e73" text-anchor="middle">⌘W 또는 ⌥W</text>
<line x1="130" y1="162" x2="186" y2="162" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="110" width="170" height="104" rx="10" fill="#ffffff" stroke="#6e6e73"/>
<text x="275" y="136" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">브라우저</text>
<text x="275" y="160" font-size="12" fill="#6e6e73" text-anchor="middle">예약된 단축키인가?</text>
<text x="275" y="180" font-size="12" fill="#6e6e73" text-anchor="middle">⌘N · ⌘T · ⌘W ...</text>
<path d="M275 110 V 64 H 400" fill="none" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
<text x="285" y="88" font-size="12" fill="#ff3b30">⌘W: 예</text>
<rect x="404" y="34" width="216" height="62" rx="10" fill="#fff1f0" stroke="#ff3b30"/>
<text x="512" y="58" font-size="12" fill="#1d1d1f" text-anchor="middle">브라우저가 탭을 닫는다</text>
<text x="512" y="78" font-size="12" fill="#ff3b30" text-anchor="middle">페이지는 keydown을 받지 못한다</text>
<path d="M275 214 V 260 H 400" fill="none" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<text x="285" y="244" font-size="12" fill="#0a84ff">⌥W: 아니오</text>
<rect x="404" y="222" width="216" height="80" rx="10" fill="#eef6ff" stroke="#0a84ff"/>
<text x="512" y="246" font-size="12" fill="#1d1d1f" text-anchor="middle">페이지의 keydown 처리기</text>
<text x="512" y="266" font-size="12" fill="#6e6e73" text-anchor="middle">altKey = true, code = "KeyW"</text>
<text x="512" y="286" font-size="12" fill="#0a84ff" text-anchor="middle">→ Safari 앱의 '탭 닫기' 실행</text>
<text x="20" y="318" font-size="12" fill="#6e6e73">⌥(Option)와 글자 조합은 macOS 브라우저가 예약하지 않으므로 페이지까지 전달된다</text>
</svg>
