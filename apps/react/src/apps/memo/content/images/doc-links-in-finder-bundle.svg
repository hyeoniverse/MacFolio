<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>메모 앱이 번들 문서 목록을 import하지 않는 이유</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker></defs>
<rect width="640" height="340" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1d1d1f">빌드 결과의 청크(따로 내려받는 JavaScript 파일)</text>
<rect x="24" y="56" width="270" height="200" rx="12" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.5"/>
<text x="40" y="82" font-size="14" font-weight="600" fill="#0a84ff">메모 앱 청크</text>
<text x="40" y="100" font-size="12" fill="#6e6e73">메모 창을 열면 내려받는다</text>
<rect x="40" y="114" width="238" height="40" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="52" y="139" font-size="12.5" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">MarkdownLink.tsx</text>
<rect x="40" y="168" width="238" height="70" rx="8" fill="#ffffff" stroke="#0a84ff"/>
<text x="52" y="190" font-size="12.5" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">repoDocs.ts</text>
<text x="52" y="208" font-size="12" fill="#1d1d1f">bundledDocOf + BUNDLED_DOC 정규식</text>
<text x="52" y="226" font-size="12" fill="#34c759" font-weight="600">경로 모양만 검사 (문서 원문 없음)</text>
<line x1="159" y1="154" x2="159" y2="166" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="346" y="56" width="270" height="200" rx="12" fill="#f2f2f7" stroke="#6e6e73" stroke-width="1.5"/>
<text x="362" y="82" font-size="14" font-weight="600" fill="#1d1d1f">Finder 청크</text>
<text x="362" y="100" font-size="12" fill="#6e6e73">Finder를 처음 열면 내려받는다</text>
<rect x="362" y="114" width="238" height="124" rx="8" fill="#ffffff" stroke="#ff9f0a"/>
<text x="374" y="138" font-size="12.5" fill="#1d1d1f" font-family="'SF Mono', Menlo, Consolas, monospace">docsBundle.ts</text>
<text x="374" y="160" font-size="12" fill="#1d1d1f">import.meta.glob으로 문서 원문을</text>
<text x="374" y="178" font-size="12" fill="#1d1d1f">문자열로 포함</text>
<text x="374" y="202" font-size="12" fill="#1d1d1f">README·CONTRIBUTING·docs/**/*.md</text>
<text x="374" y="222" font-size="12" fill="#ff9f0a" font-weight="600">19개 파일, 원문 약 690KB</text>
<path d="M278 210 C 310 210, 320 180, 360 180" fill="none" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="306" y="204" font-size="15" font-weight="700" fill="#ff3b30">✕</text>
<text x="24" y="286" font-size="12.5" fill="#1d1d1f">빨간 점선처럼 메모 앱이 docsBundle.ts를 import하면 문서 원문 전체가 메모 앱 청크에 들어가,</text>
<text x="24" y="306" font-size="12.5" fill="#1d1d1f">블로그 글만 읽는 방문자도 그 원문을 내려받는다. 그래서 정규식만 가져다 쓴다.</text>
<text x="24" y="328" font-size="12" fill="#6e6e73">파일 수와 크기는 2026년 11월 저장소 기준이다.</text>
</svg>
