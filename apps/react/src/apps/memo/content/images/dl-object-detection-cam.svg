<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
    <radialGradient id="h" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3b30"/><stop offset="0.45" stop-color="#ffcc00"/><stop offset="0.8" stop-color="#34c759" stop-opacity="0.5"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></radialGradient>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">CAM: 마지막 특징 맵을 부류 가중치로 더한다</text>
  <!-- input -->
  <rect x="16" y="54" width="70" height="86" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="51" y="94" text-anchor="middle" font-size="12" fill="#1d1d1f">입력 영상</text>
  <text x="51" y="110" text-anchor="middle" font-size="11" fill="#6e6e73">(사람과 개)</text>
  <line x1="88" y1="97" x2="104" y2="97" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- conv stack -->
  <g fill="#f2f2f7" stroke="#6e6e73">
    <rect x="108" y="56" width="30" height="82"/>
    <rect x="146" y="62" width="28" height="70"/>
    <rect x="182" y="68" width="26" height="58"/>
    <rect x="216" y="72" width="24" height="50"/>
  </g>
  <g font-size="10" fill="#6e6e73" text-anchor="middle">
    <text transform="translate(127,97) rotate(-90)">CONV</text><text transform="translate(164,97) rotate(-90)">CONV</text><text transform="translate(199,97) rotate(-90)">CONV</text><text transform="translate(232,97) rotate(-90)">CONV</text>
  </g>
  <text x="174" y="156" text-anchor="middle" font-size="11" fill="#6e6e73">컨볼루션층</text>
  <!-- feature maps -->
  <rect x="262" y="58" width="44" height="66" fill="#fff" stroke="#0a84ff" stroke-width="1.5"/>
  <rect x="270" y="64" width="44" height="66" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
  <rect x="278" y="70" width="44" height="66" fill="#fff" stroke="#34c759" stroke-width="1.5"/>
  <text x="292" y="156" text-anchor="middle" font-size="11" fill="#6e6e73">마지막 특징 맵</text>
  <text x="292" y="170" text-anchor="middle" font-size="11" fill="#6e6e73">f₁ … fₙ</text>
  <line x1="248" y1="97" x2="258" y2="97" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- GAP -->
  <path d="M330,86 h34 v-8 l16,19 l-16,19 v-8 h-34 z" fill="#fff4e0" stroke="#ff9f0a"/>
  <text x="352" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#ff9f0a">GAP</text>
  <text x="355" y="134" text-anchor="middle" font-size="10" fill="#6e6e73">전역 평균</text>
  <text x="355" y="147" text-anchor="middle" font-size="10" fill="#6e6e73">풀링</text>
  <!-- GAP nodes -->
  <rect x="392" y="44" width="40" height="112" rx="10" fill="#fff" stroke="#ff9f0a" stroke-width="1.5"/>
  <circle cx="412" cy="64" r="11" fill="#e5f0ff" stroke="#0a84ff" stroke-width="1.5"/>
  <circle cx="412" cy="94" r="11" fill="#ffe5e3" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="412" y="122" text-anchor="middle" font-size="12" fill="#1d1d1f">⋮</text>
  <circle cx="412" cy="138" r="11" fill="#e8f8ec" stroke="#34c759" stroke-width="1.5"/>
  <!-- output nodes -->
  <rect x="500" y="44" width="40" height="112" rx="10" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/>
  <circle cx="520" cy="64" r="11" fill="#f2f2f7" stroke="#c7c7cc"/>
  <circle cx="520" cy="94" r="11" fill="#6e6e73" stroke="#1d1d1f" stroke-width="2"/>
  <text x="520" y="122" text-anchor="middle" font-size="12" fill="#1d1d1f">⋮</text>
  <circle cx="520" cy="138" r="11" fill="#f2f2f7" stroke="#c7c7cc"/>
  <line x1="423" y1="64" x2="509" y2="94" stroke="#0a84ff" stroke-width="1.5"/>
  <line x1="423" y1="94" x2="509" y2="94" stroke="#ff3b30" stroke-width="1.5"/>
  <line x1="423" y1="138" x2="509" y2="94" stroke="#34c759" stroke-width="1.5"/>
  <g font-size="12" font-style="italic">
    <text x="452" y="68" fill="#0a84ff">w₁</text>
    <text x="452" y="90" fill="#ff3b30">w₂</text>
    <text x="452" y="134" fill="#34c759">wₙ</text>
  </g>
  <text x="548" y="90" font-size="11.5" fill="#1d1d1f">부류 c</text>
  <text x="548" y="105" font-size="10.5" fill="#6e6e73">(오스트레일리안</text>
  <text x="548" y="119" font-size="10.5" fill="#6e6e73">테리어)</text>
  <text x="520" y="174" text-anchor="middle" font-size="11" fill="#6e6e73">부류 점수</text>
  <!-- bracket arrow -->
  <path d="M262,186 Q262,200 300,200 L520,200 Q540,200 540,186" fill="none" stroke="#af52de" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="222" stroke="#af52de" stroke-width="2" marker-end="url(#a)"/>
  <!-- bottom panel -->
  <rect x="16" y="228" width="608" height="160" rx="10" fill="#f2f2f7"/>
  <text x="320" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">부류 활성 맵(CAM) 만들기</text>
  <g>
    <rect x="62" y="270" width="80" height="96" fill="#1f3a93" stroke="#0a84ff" stroke-width="2"/>
    <ellipse cx="96" cy="300" rx="18" ry="24" fill="url(#h)"/>
    <rect x="202" y="270" width="80" height="96" fill="#1f3a93" stroke="#ff3b30" stroke-width="2"/>
    <ellipse cx="226" cy="344" rx="20" ry="18" fill="url(#h)"/>
    <ellipse cx="262" cy="342" rx="22" ry="20" fill="url(#h)"/>
    <ellipse cx="240" cy="286" rx="16" ry="8" fill="url(#h)"/>
    <rect x="374" y="270" width="80" height="96" fill="#1f3a93" stroke="#34c759" stroke-width="2"/>
    <ellipse cx="426" cy="346" rx="24" ry="14" fill="url(#h)"/>
    <rect x="502" y="270" width="80" height="96" fill="#5b6bbf" stroke="#6e6e73" stroke-width="2"/>
    <ellipse cx="524" cy="344" rx="22" ry="18" fill="url(#h)"/>
    <ellipse cx="560" cy="342" rx="24" ry="20" fill="url(#h)"/>
  </g>
  <g font-size="14" font-style="italic">
    <text x="30" y="324" fill="#0a84ff">w₁ ×</text>
    <text x="150" y="324" fill="#1d1d1f">+</text>
    <text x="164" y="324" fill="#ff3b30">w₂ ×</text>
    <text x="292" y="324" fill="#1d1d1f">+ … +</text>
    <text x="338" y="324" fill="#34c759">wₙ ×</text>
    <text x="466" y="324" fill="#1d1d1f">=</text>
  </g>
  <g font-size="10.5" fill="#6e6e73" text-anchor="middle">
    <text x="102" y="381">특징 맵 f₁</text>
    <text x="242" y="381">특징 맵 f₂</text>
    <text x="414" y="381">특징 맵 fₙ</text>
    <text x="542" y="381">CAM(개가 있는 영역)</text>
  </g>
</svg>
