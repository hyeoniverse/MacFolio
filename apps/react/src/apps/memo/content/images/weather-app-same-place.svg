<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>서울(시청, 37.5665, 126.978)과 종로구(구청, 37.5735, 126.979)는 위도 0.007도, 경도 0.001도 떨어져 있다. 기준 0.01도 사각형 안에는 종로구가 들어가 같은 장소로 판정되고, 기준 0.005도 사각형 밖에 있어 다른 장소로 판정된다</title>
<rect width="640" height="370" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">같은 장소 판정 범위와 서울·종로구 좌표</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">서울 좌표를 중심으로, 위도·경도 차가 기준보다 작으면 같은 장소로 본다 (비율은 실제 거리에 맞춤)</text>

<rect x="105" y="80" width="190" height="240" fill="#fff5f4" stroke="#ff3b30" stroke-dasharray="6 4"/>
<text x="111" y="96" font-size="12" fill="#ff3b30">±0.01° (수정 전)</text>
<rect x="152.5" y="140" width="95" height="120" fill="#f0faf2" stroke="#34c759" stroke-width="1.5"/>
<text x="158" y="276" font-size="12" fill="#248a3d">±0.005° (수정 후)</text>

<circle cx="200" cy="200" r="6" fill="#0a84ff"/>
<text x="200" y="224" font-size="12" font-weight="700" fill="#0a84ff" text-anchor="middle">서울 (시청)</text>
<circle cx="209.5" cy="116" r="6" fill="#ff9f0a"/>
<text x="221" y="121" font-size="12" font-weight="700" fill="#c46f00">종로구 (구청)</text>
<line x1="200" y1="200" x2="209.5" y2="116" stroke="#6e6e73" stroke-dasharray="3 3"/>
<text x="214" y="134" font-size="12" fill="#6e6e73">약 0.78km</text>

<line x1="105" y1="340" x2="152.5" y2="340" stroke="#6e6e73"/>
<text x="105" y="356" font-size="12" fill="#6e6e73">경도 0.005° ≈ 0.44km</text>

<rect x="330" y="80" width="286" height="250" rx="10" fill="#f2f2f7"/>
<text x="346" y="104" font-size="13" font-weight="700" fill="#1d1d1f">좌표 (cities.ts)</text>
<text x="346" y="126" font-size="12" fill="#1d1d1f">서울</text>
<text x="420" y="126" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">37.5665, 126.9780</text>
<text x="346" y="146" font-size="12" fill="#1d1d1f">종로구</text>
<text x="420" y="146" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">37.5735, 126.9790</text>
<text x="346" y="166" font-size="12" fill="#1d1d1f">차이</text>
<text x="420" y="166" font-size="12" fill="#1d1d1f">위도 0.0070°, 경도 0.0010°</text>
<line x1="346" y1="180" x2="600" y2="180" stroke="#d1d1d6"/>
<text x="346" y="204" font-size="12" font-weight="700" fill="#ff3b30">기준 0.01°</text>
<text x="346" y="222" font-size="12" fill="#1d1d1f">0.0070 &lt; 0.01, 0.0010 &lt; 0.01</text>
<text x="346" y="240" font-size="12" fill="#1d1d1f">→ 같은 장소, 종로구가 결과에서 빠짐</text>
<text x="346" y="272" font-size="12" font-weight="700" fill="#248a3d">기준 0.005°</text>
<text x="346" y="290" font-size="12" fill="#1d1d1f">0.0070 &gt; 0.005</text>
<text x="346" y="308" font-size="12" fill="#1d1d1f">→ 다른 장소, 둘 다 표시</text>
</svg>
