<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>같은 규칙을 읽는 곳과 쓰는 곳 모두에</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">같은 규칙을 읽는 곳과 쓰는 곳 모두에</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">한쪽만 고치면 읽기는 맞고 저장은 망가지거나, 그 반대가 된다</text>
<rect x="32" y="90" width="250" height="96" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="157.0" y="125.0" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">markdownPlugins.ts</text>
<text x="157.0" y="142.0" font-size="11" fill="#374151" text-anchor="middle">REMARK_PLUGINS</text>
<text x="157.0" y="159.0" font-size="11" fill="#374151" text-anchor="middle">gfm · cjkFriendly · …</text>
<rect x="360" y="80" width="200" height="38" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="460.0" y="103.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">읽기 화면 (react-markdown)</text>
<line x1="282" y1="138" x2="356" y2="99" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="360" y="126" width="200" height="38" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="460.0" y="149.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">편집 중 미리보기 (react-markdown)</text>
<line x1="282" y1="138" x2="356" y2="145" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="360" y="172" width="200" height="38" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="460.0" y="195.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">버전 기록 (react-markdown)</text>
<line x1="282" y1="138" x2="356" y2="191" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="360" y="236" width="200" height="60" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="460.0" y="261.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">편집기 (Milkdown)</text>
<text x="460.0" y="278.5" font-size="11" fill="#374151" text-anchor="middle">$remark(cjkFriendly)</text>
<line x1="560" y1="266" x2="640" y2="266" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="644" y="206" width="190" height="110" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="739.0" y="248.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">저장할 Markdown</text>
<text x="739.0" y="265.0" font-size="11" fill="#374151" text-anchor="middle">**취소(cancelled)**가</text>
<text x="739.0" y="282.0" font-size="11" fill="#374151" text-anchor="middle">(&amp;#xAC00; 없음)</text>
<line x1="560" y1="130" x2="640" y2="130" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="644" y="96" width="190" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="739.0" y="126.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">화면</text>
<text x="739.0" y="143.5" font-size="11" fill="#374151" text-anchor="middle">&lt;strong&gt;취소(cancelled)&lt;/strong&gt;가</text>
</svg>
