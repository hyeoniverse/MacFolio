<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="356" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">같은 코드에서 린터와 포매터가 하는 일</text>

  <!-- 원본 -->
  <text x="24" y="58" font-size="13" font-weight="600" fill="#1d1d1f">저장 전 코드</text>
  <rect x="24" y="68" width="592" height="70" rx="8" fill="#f2f2f7"/>
  <g font-family="Menlo, monospace" font-size="12" fill="#1d1d1f">
    <text x="36" y="92">const total = 1</text>
    <text x="36" y="110">function add(a,b){ if (a == null) return b;</text>
    <text x="36" y="128">return a+b }</text>
  </g>

  <!-- 린터 -->
  <text x="24" y="170" font-size="13" font-weight="600" fill="#ff3b30">린터 (ESLint): 문제를 찾는다</text>
  <rect x="24" y="180" width="292" height="128" rx="8" fill="#fff" stroke="#ff3b30"/>
  <g font-size="12" fill="#1d1d1f">
    <text x="36" y="204">1행 total을 선언하고 쓰지 않는다</text>
    <text x="36" y="221" fill="#6e6e73" font-family="Menlo, monospace">no-unused-vars</text>
    <text x="36" y="246">2행 == 는 형 변환 비교다. === 권장</text>
    <text x="36" y="263" fill="#6e6e73" font-family="Menlo, monospace">eqeqeq</text>
    <text x="36" y="298" fill="#6e6e73">버그 가능성을 알리고 일부는 자동 수정한다</text>
  </g>

  <!-- 포매터 -->
  <text x="324" y="170" font-size="13" font-weight="600" fill="#0a84ff">포매터 (Prettier): 모양만 바꾼다</text>
  <rect x="324" y="180" width="292" height="128" rx="8" fill="#fff" stroke="#0a84ff"/>
  <g font-family="Menlo, monospace" font-size="12" fill="#1d1d1f">
    <text x="336" y="204">const total = 1;</text>
    <text x="336" y="222">function add(a, b) {</text>
    <text x="351" y="240">if (a == null) return b;</text>
    <text x="351" y="258">return a + b;</text>
    <text x="336" y="276">}</text>
  </g>
  <text x="336" y="298" font-size="12" fill="#6e6e73">공백·줄바꿈·세미콜론만 통일한다</text>

  <text x="24" y="338" font-size="12" fill="#6e6e73">포매터는 == 를 고치지 않고, 린터는 줄바꿈 모양을 판단하지 않는다. 그래서 둘을 함께 쓴다.</text>
</svg>
