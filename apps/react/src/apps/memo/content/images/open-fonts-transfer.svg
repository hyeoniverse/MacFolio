<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="440" fill="#fff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">화면별 글꼴 전송량 (Font Awesome 포함)</text>
  <text x="24" y="54" font-size="12" fill="#6e6e73">1 = 한글 명조를 Safari를 볼 때 받기, 2 = Pretendard core를 사이트가 쓰는 글자로 줄이기</text>
  <line x1="190" y1="72" x2="190" y2="368" stroke="#e5e5ea"/>
  <text x="190" y="384" font-size="12" fill="#6e6e73" text-anchor="middle">0KB</text>
  <line x1="274" y1="72" x2="274" y2="368" stroke="#e5e5ea"/>
  <text x="274" y="384" font-size="12" fill="#6e6e73" text-anchor="middle">300KB</text>
  <line x1="358" y1="72" x2="358" y2="368" stroke="#e5e5ea"/>
  <text x="358" y="384" font-size="12" fill="#6e6e73" text-anchor="middle">600KB</text>
  <line x1="442" y1="72" x2="442" y2="368" stroke="#e5e5ea"/>
