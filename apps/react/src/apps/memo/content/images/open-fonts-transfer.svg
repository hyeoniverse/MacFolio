  <line x1="526" y1="72" x2="526" y2="368" stroke="#e5e5ea"/>
  <text x="526" y="384" font-size="12" fill="#6e6e73" text-anchor="middle">1200KB</text>
  <text x="24" y="112" font-size="12" font-weight="600" fill="#1d1d1f">데스크톱 첫 화면</text>
  <rect x="190" y="82" width="332.4" height="18" rx="3" fill="#c7c7cc"/>
  <text x="528.4" y="96" font-size="12" fill="#1d1d1f">교체 직후 1,187KB</text>
  <rect x="190" y="106" width="217.6" height="18" rx="3" fill="#8ec5ff"/>
  <text x="413.6" y="120" font-size="12" fill="#1d1d1f">1 적용 777KB</text>
  <rect x="190" y="130" width="159.0" height="18" rx="3" fill="#0a84ff"/>
  <text x="355.0" y="144" font-size="12" fill="#1d1d1f">1 + 2 적용 568KB</text>
  <text x="24" y="208" font-size="12" font-weight="600" fill="#1d1d1f">메모 글 (/memo/…)</text>
  <rect x="190" y="178" width="332.4" height="18" rx="3" fill="#c7c7cc"/>
  <text x="528.4" y="192" font-size="12" fill="#1d1d1f">교체 직후 1,187KB</text>
  <rect x="190" y="202" width="217.6" height="18" rx="3" fill="#8ec5ff"/>
  <text x="413.6" y="216" font-size="12" fill="#1d1d1f">1 적용 777KB</text>
  <rect x="190" y="226" width="159.0" height="18" rx="3" fill="#0a84ff"/>
  <text x="355.0" y="240" font-size="12" fill="#1d1d1f">1 + 2 적용 568KB</text>
  <text x="24" y="304" font-size="12" font-weight="600" fill="#1d1d1f">휴대폰 홈 (iPhone 15)</text>
  <rect x="190" y="274" width="165.5" height="18" rx="3" fill="#c7c7cc"/>
  <text x="361.5" y="288" font-size="12" fill="#1d1d1f">교체 직후 591KB</text>
  <rect x="190" y="298" width="165.5" height="18" rx="3" fill="#8ec5ff"/>
  <text x="361.5" y="312" font-size="12" fill="#1d1d1f">1 적용 591KB</text>
  <rect x="190" y="322" width="107.0" height="18" rx="3" fill="#0a84ff"/>
  <text x="303.0" y="336" font-size="12" fill="#1d1d1f">1 + 2 적용 382KB</text>
  <text x="24" y="412" font-size="12" fill="#6e6e73">참고: 고치기 전 Apple 글꼴 구성은 데스크톱 Chromium 397KB, WebKit 248KB</text>
  <text x="24" y="430" font-size="12" fill="#6e6e73">E2E 상한: 데스크톱 600KB, 휴대폰 410KB (측정값에 약 30KB를 더한 값)</text>
</svg>
