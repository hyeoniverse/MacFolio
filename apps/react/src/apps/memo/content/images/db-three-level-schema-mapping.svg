<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="470" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">3단계 데이터베이스 구조와 두 사상</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 응용 프로그램 -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <rect x="60" y="50" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="130" y="72">성적 처리 프로그램</text>
    <rect x="250" y="50" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="320" y="72">학적 프로그램</text>
    <rect x="440" y="50" width="140" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="510" y="72">수강 신청 프로그램</text>
  </g>

  <!-- 외부 단계 -->
  <text x="20" y="128" font-size="12" font-weight="600" fill="#4f46e5">외부 단계</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="104" width="140" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="130" y="122" fill="#4f46e5" font-weight="600">외부 스키마 1</text>
    <text x="130" y="139" fill="#374151">학번, 이름, 성적</text>
    <rect x="250" y="104" width="140" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="320" y="122" fill="#4f46e5" font-weight="600">외부 스키마 2</text>
    <text x="320" y="139" fill="#374151">학번, 이름, 학과</text>
    <rect x="440" y="104" width="140" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="510" y="122" fill="#4f46e5" font-weight="600">외부 스키마 3</text>
    <text x="510" y="139" fill="#374151">학번, 과목번호</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="130" y1="84" x2="130" y2="104"/>
    <line x1="320" y1="84" x2="320" y2="104"/>
    <line x1="510" y1="84" x2="510" y2="104"/>
  </g>

  <!-- 외부/개념 사상 -->
  <rect x="60" y="172" width="520" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="#92400e">외부/개념 사상 (응용 인터페이스) → 논리적 데이터 독립성</text>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="148" x2="130" y2="170"/>
    <line x1="320" y1="148" x2="320" y2="170"/>
    <line x1="510" y1="148" x2="510" y2="170"/>
    <line x1="320" y1="202" x2="320" y2="224"/>
  </g>

  <!-- 개념 단계 -->
  <text x="20" y="252" font-size="12" font-weight="600" fill="#059669">개념 단계</text>
  <rect x="150" y="226" width="340" height="48" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="320" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">개념 스키마 (기관 전체에 하나)</text>
  <text x="320" y="264" text-anchor="middle" font-size="11" fill="#374151">학생(학번, 이름, 학년, 학과, …) · 과목 · 등록 · 제약조건</text>

  <!-- 개념/내부 사상 -->
  <rect x="60" y="298" width="520" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#92400e">개념/내부 사상 (저장 인터페이스) → 물리적 데이터 독립성</text>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="320" y1="274" x2="320" y2="296"/>
    <line x1="320" y1="328" x2="320" y2="350"/>
  </g>

  <!-- 내부 단계 -->
  <text x="20" y="378" font-size="12" font-weight="600" fill="#b45309">내부 단계</text>
  <rect x="150" y="352" width="340" height="48" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">내부 스키마</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#374151">레코드 형식 · 필드 길이 · 인덱스 · 접근 경로</text>

  <!-- 저장 장치 -->
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="320" y1="400" x2="320" y2="422"/>
  </g>
  <rect x="230" y="424" width="180" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="320" y="445" text-anchor="middle" font-size="12" fill="#374151">저장 데이터베이스</text>
</svg>
