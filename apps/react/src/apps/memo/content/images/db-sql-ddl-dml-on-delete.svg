<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">DELETE FROM STUDENT WHERE Sno = 100 을 실행하면</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#6e6e73">ENROL의 외래 키 Sno에 지정한 ON DELETE 옵션에 따라 ENROL이 달라진다</text>
  <g font-size="12" fill="#1d1d1f">
    <!-- CASCADE -->
    <rect x="20" y="64" width="190" height="250" rx="10" fill="#fff" stroke="#34c759" stroke-width="1.5"/>
    <text x="115" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">CASCADE</text>
    <text x="115" y="106" text-anchor="middle" fill="#6e6e73">참조하는 행도 함께 삭제</text>
    <rect x="36" y="120" width="158" height="22" fill="#fff0ef"/><text x="44" y="135" fill="#ff3b30" text-decoration="line-through">100  C413</text>
    <rect x="36" y="144" width="158" height="22" fill="#fff0ef"/><text x="44" y="159" fill="#ff3b30" text-decoration="line-through">100  E412</text>
    <rect x="36" y="168" width="158" height="22" fill="#f2f2f7"/><text x="44" y="183">200  C123</text>
    <rect x="36" y="192" width="158" height="22" fill="#f2f2f7"/><text x="44" y="207">300  C312</text>
    <text x="115" y="236" text-anchor="middle" fill="#6e6e73">⋮</text>
    <text x="115" y="270" text-anchor="middle">STUDENT 1행, ENROL 2행</text>
    <text x="115" y="288" text-anchor="middle">삭제</text>
    <!-- SET NULL -->
    <rect x="225" y="64" width="190" height="250" rx="10" fill="#fff" stroke="#ff9f0a" stroke-width="1.5"/>
    <text x="320" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#c77700">SET NULL</text>
    <text x="320" y="106" text-anchor="middle" fill="#6e6e73">외래 키 값을 NULL로</text>
    <rect x="241" y="120" width="158" height="22" fill="#fff5e6"/><text x="249" y="135" fill="#c77700">NULL  C413</text>
    <rect x="241" y="144" width="158" height="22" fill="#fff5e6"/><text x="249" y="159" fill="#c77700">NULL  E412</text>
    <rect x="241" y="168" width="158" height="22" fill="#f2f2f7"/><text x="249" y="183">200  C123</text>
    <rect x="241" y="192" width="158" height="22" fill="#f2f2f7"/><text x="249" y="207">300  C312</text>
    <text x="320" y="252" text-anchor="middle" fill="#ff3b30">ENROL은 Sno가 기본 키의</text>
    <text x="320" y="270" text-anchor="middle" fill="#ff3b30">일부라 NULL이 될 수 없어</text>
    <text x="320" y="288" text-anchor="middle" fill="#ff3b30">이 테이블에는 쓸 수 없다</text>
    <!-- NO ACTION -->
    <rect x="430" y="64" width="190" height="250" rx="10" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/>
    <text x="525" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">NO ACTION (생략)</text>
    <text x="525" y="106" text-anchor="middle" fill="#6e6e73">위반하는 삭제를 거부</text>
    <rect x="446" y="120" width="158" height="22" fill="#f2f2f7"/><text x="454" y="135">100  C413</text>
    <rect x="446" y="144" width="158" height="22" fill="#f2f2f7"/><text x="454" y="159">100  E412</text>
    <rect x="446" y="168" width="158" height="22" fill="#f2f2f7"/><text x="454" y="183">200  C123</text>
    <rect x="446" y="192" width="158" height="22" fill="#f2f2f7"/><text x="454" y="207">300  C312</text>
    <text x="525" y="236" text-anchor="middle" fill="#6e6e73">⋮</text>
    <text x="525" y="270" text-anchor="middle">DELETE 실패,</text>
    <text x="525" y="288" text-anchor="middle">두 테이블 모두 그대로</text>
  </g>
</svg>
