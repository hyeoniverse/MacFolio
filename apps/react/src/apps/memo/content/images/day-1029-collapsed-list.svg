<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>11편 연재에서 지금 글에 따라 줄여 보이는 목록</title>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">11편 연재의 줄인 목록 (최대 5편, 강조는 지금 글)</text>
<g font-size="13">
<text x="40" y="62" font-weight="700" fill="#1d1d1f">지금 3편</text>
<text x="240" y="62" font-weight="700" fill="#1d1d1f">지금 6편</text>
<text x="440" y="62" font-weight="700" fill="#1d1d1f">지금 9편</text>
<g transform="translate(40,74)">
<line x1="0" y1="0" x2="0" y2="170" stroke="#c7c7cc" stroke-width="1"/>
<text x="12" y="20" fill="#1d1d1f">1편</text><text x="12" y="48" fill="#1d1d1f">2편</text>
<rect x="-1" y="58" width="3" height="24" fill="#0a84ff"/><text x="12" y="76" fill="#0a84ff" font-weight="700">3편</text>
<text x="12" y="104" fill="#1d1d1f">4편</text><text x="12" y="132" fill="#1d1d1f">5편</text>
<text x="12" y="166" fill="#6e6e73">⌄ 6편 더보기</text>
</g>
<g transform="translate(240,74)">
<line x1="0" y1="0" x2="0" y2="170" stroke="#c7c7cc" stroke-width="1"/>
<text x="12" y="20" fill="#1d1d1f">1편</text><text x="12" y="48" fill="#1d1d1f">2편</text><text x="12" y="76" fill="#1d1d1f">3편</text>
<text x="70" y="90" fill="#6e6e73">⋮ 4편 생략</text>
<text x="12" y="104" fill="#1d1d1f">5편 (이전 편)</text>
<rect x="-1" y="114" width="3" height="24" fill="#0a84ff"/><text x="12" y="132" fill="#0a84ff" font-weight="700">6편</text>
<text x="12" y="166" fill="#6e6e73">⌄ 6편 더보기</text>
</g>
<g transform="translate(440,74)">
<line x1="0" y1="0" x2="0" y2="170" stroke="#c7c7cc" stroke-width="1"/>
<text x="12" y="20" fill="#1d1d1f">1편</text><text x="12" y="48" fill="#1d1d1f">2편</text><text x="12" y="76" fill="#1d1d1f">3편</text>
<text x="70" y="90" fill="#6e6e73">⋮ 4~7편 생략</text>
<text x="12" y="104" fill="#1d1d1f">8편 (이전 편)</text>
<rect x="-1" y="114" width="3" height="24" fill="#0a84ff"/><text x="12" y="132" fill="#0a84ff" font-weight="700">9편</text>
<text x="12" y="166" fill="#6e6e73">⌄ 6편 더보기</text>
</g>
</g>
<text x="20" y="282" font-size="12" fill="#6e6e73">지금 글이 앞 5편보다 뒤면 이전 편과 지금 글을 두고, 남는 세 칸을 1편부터 채운다</text>
</svg>
