<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="720" height="330" fill="#fff"/>
  <text x="360.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">앱을 열 때 고른 배경화면을 확인하는 길</text>
<rect x="250" y="50" width="220" height="50" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="360.0" y="79.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">저장된 배경화면 id</text>
<rect x="250" y="130" width="220" height="50" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="360.0" y="151.0" font-size="10.5" fill="#4f46e5" text-anchor="middle" font-weight="600">custom:finder-로 시작?</text>
<text x="360.0" y="166.5" font-size="10.0" fill="#4b5563" text-anchor="middle">FINDER_WALLPAPER_PREFIX</text>
<line x1="360" y1="100" x2="360" y2="128" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="510" y="130" width="180" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="600.0" y="159.0" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">그대로 쓴다</text>
<line x1="470" y1="155" x2="508" y2="155" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="480" y="148" font-size="10.5" fill="#6b7280" text-anchor="start">예</text>
<rect x="250" y="210" width="220" height="50" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="360.0" y="231.0" font-size="10.5" fill="#4f46e5" text-anchor="middle" font-weight="600">custom:으로 시작?</text>
<text x="360.0" y="246.5" font-size="10.0" fill="#4b5563" text-anchor="middle">관리자가 올린 배경화면</text>
<line x1="360" y1="180" x2="360" y2="208" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="366" y="198" font-size="10.5" fill="#6b7280" text-anchor="start">아니오</text>
<rect x="510" y="210" width="180" height="50" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="600.0" y="231.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">서버 목록과 맞춰 보기</text>
<text x="600.0" y="246.5" font-size="10.0" fill="#4b5563" text-anchor="middle">없으면 기본값</text>
<line x1="470" y1="235" x2="508" y2="235" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="480" y="228" font-size="10.5" fill="#6b7280" text-anchor="start">예</text>
<rect x="30" y="210" width="180" height="50" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="120.0" y="231.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">기본 · 내장 배경화면</text>
<text x="120.0" y="247.0" font-size="10.5" fill="#4b5563" text-anchor="middle">그대로</text>
<line x1="250" y1="235" x2="212" y2="235" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="215" y="228" font-size="10.5" fill="#6b7280" text-anchor="start">아니오</text>
<text x="360" y="300" font-size="11" fill="#6b7280" text-anchor="middle">고치기 전에는 첫 질문이 없어서, Finder에서 고른 것도 서버 목록에 없으니 매번 기본값으로 돌아갔다</text>
</svg>
