<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>GoF 디자인 패턴 분류</title><rect width="640" height="436" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">GoF 디자인 패턴 23가지</text><rect x="14" y="42" width="190" height="34" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="109.0" y="64.0" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">생성 (5)</text><text x="109.0" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">객체를 만드는 방법</text><rect x="14" y="104" width="190" height="23" rx="4" fill="#e8f2ff"/><text x="22" y="120" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">추상 팩토리 (Abstract Factory)</text><rect x="14" y="131" width="190" height="23" rx="4" fill="#e8f2ff"/><text x="22" y="147" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">빌더 (Builder)</text><rect x="14" y="158" width="190" height="23" rx="4" fill="#e8f2ff"/><text x="22" y="174" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">팩토리 메서드 (Factory Method)</text><rect x="14" y="185" width="190" height="23" rx="4" fill="#e8f2ff"/><text x="22" y="201" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">프로토타입 (Prototype)</text><rect x="14" y="212" width="190" height="23" rx="4" fill="#e8f2ff"/><text x="22" y="228" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">싱글톤 (Singleton)</text><rect x="214" y="42" width="190" height="34" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="309.0" y="64.0" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">구조 (7)</text><text x="309.0" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">클래스·객체를 조합하는 방법</text><rect x="214" y="104" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="120" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">어댑터 (Adapter)</text><rect x="214" y="131" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="147" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">브리지 (Bridge)</text><rect x="214" y="158" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="174" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">컴포지트 (Composite)</text><rect x="214" y="185" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="201" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">데코레이터 (Decorator)</text><rect x="214" y="212" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="228" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">퍼사드 (Facade)</text><rect x="214" y="239" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="255" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">플라이웨이트 (Flyweight)</text><rect x="214" y="266" width="190" height="23" rx="4" fill="#e9f9ee"/><text x="222" y="282" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">프록시 (Proxy)</text><rect x="414" y="42" width="212" height="34" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="520.0" y="64.0" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">행위 (11)</text><text x="520.0" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">객체 사이의 책임 분배와 통신</text><rect x="414" y="104" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="120" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">책임 연쇄 (Chain of Responsibility)</text><rect x="414" y="131" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="147" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">커맨드 (Command)</text><rect x="414" y="158" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="174" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">인터프리터 (Interpreter)</text><rect x="414" y="185" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="201" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">반복자 (Iterator)</text><rect x="414" y="212" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="228" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">중재자 (Mediator)</text><rect x="414" y="239" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="255" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">메멘토 (Memento)</text><rect x="414" y="266" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="282" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">옵서버 (Observer)</text><rect x="414" y="293" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="309" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">상태 (State)</text><rect x="414" y="320" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="336" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">전략 (Strategy)</text><rect x="414" y="347" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="363" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">템플릿 메서드 (Template Method)</text><rect x="414" y="374" width="212" height="23" rx="4" fill="#fff4e5"/><text x="422" y="390" text-anchor="start" font-size="11.5" font-weight="400" fill="#1d1d1f">방문자 (Visitor)</text><text x="320" y="420" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">Gamma, Helm, Johnson, Vlissides 네 명(Gang of Four)이 1994년 책에서 분류한 목록</text></svg>
