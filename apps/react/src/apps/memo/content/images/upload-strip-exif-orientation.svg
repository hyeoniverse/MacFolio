<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>휴대폰을 세워 찍은 사진은 픽셀을 가로로 저장하고 Orientation 6을 기록한다. 브라우저는 이 값에 따라 시계 방향으로 90도 돌려 세로로 표시하고, EXIF를 모두 지우면 저장된 그대로 옆으로 누운 사진이 표시된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">Orientation 6: 저장된 픽셀과 표시되는 모습</text>
<text x="104" y="66" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">① 파일에 저장된 픽셀</text>
<rect x="34" y="96" width="140" height="100" rx="6" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
<path d="M84 146 L50 146" stroke="#0a84ff" stroke-width="3" marker-end="url(#b)"/>
<text x="120" y="151" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">하늘 쪽</text>
<text x="104" y="222" font-size="12" fill="#6e6e73" text-anchor="middle">센서 방향 그대로 가로로 저장</text>
<text x="104" y="240" font-size="12" fill="#6e6e73" text-anchor="middle">EXIF: Orientation = 6</text>
<path d="M190 146 L226 112" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M190 156 L226 214" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="66" font-size="13" font-weight="700" fill="#34c759" text-anchor="middle">② 방향 값을 남긴 경우</text>
<rect x="240" y="76" width="56" height="78" rx="6" fill="#f2f2f7" stroke="#34c759" stroke-width="2"/>
<path d="M268 132 L268 96" stroke="#0a84ff" stroke-width="3" marker-end="url(#b)"/>
<text x="312" y="104" font-size="12" fill="#1d1d1f">브라우저가 시계 방향 90° 회전</text>
<text x="312" y="124" font-size="12" fill="#1d1d1f">image-orientation: from-image</text>
<text x="312" y="144" font-size="12" fill="#34c759">찍은 모습 그대로 세로로 표시</text>
<text x="340" y="190" font-size="13" font-weight="700" fill="#ff3b30" text-anchor="middle">③ EXIF를 모두 지운 경우</text>
<rect x="240" y="200" width="100" height="70" rx="6" fill="#f2f2f7" stroke="#ff3b30" stroke-width="2"/>
<path d="M300 235 L262 235" stroke="#0a84ff" stroke-width="3" marker-end="url(#b)"/>
<text x="356" y="226" font-size="12" fill="#1d1d1f">회전 정보가 없어 저장된 그대로</text>
<text x="356" y="246" font-size="12" fill="#ff3b30">사진이 옆으로 누워 표시</text>
<rect x="24" y="286" width="592" height="32" rx="8" fill="#f2f2f7"/>
<text x="36" y="307" font-size="12" fill="#1d1d1f">값 1: 회전 없음 · 3: 180° · 6: 시계 방향 90° · 8: 반시계 방향 90° (2·4·5·7은 좌우 반전이 섞인 값)</text>
</svg>
