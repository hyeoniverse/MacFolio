<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>순환 의존과 제3의 파일로 끊는 방법</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">순환 의존과 제3의 파일(model.ts)로 끊는 방법</text>
<text x="160" y="62" font-size="13" font-weight="700" fill="#ff3b30" text-anchor="middle">전: 서로를 import</text>
<rect x="40" y="90" width="110" height="44" rx="8" fill="#f2f2f7"/><text x="95" y="117" font-size="13" fill="#1d1d1f" text-anchor="middle">Mail.tsx</text>
<rect x="170" y="90" width="110" height="44" rx="8" fill="#f2f2f7"/><text x="225" y="117" font-size="13" fill="#1d1d1f" text-anchor="middle">MailMobile.tsx</text>
<path d="M150 104 H166" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
<path d="M170 122 H154" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
<text x="40" y="164" font-size="12" fill="#1d1d1f">Mail.tsx는 MailMobile.tsx를 렌더링하고,</text>
<text x="40" y="182" font-size="12" fill="#1d1d1f">MailMobile.tsx는 Mail.tsx의 ListMail 타입을 import</text>
<text x="40" y="206" font-size="12" fill="#ff3b30">import type이라 실행 코드에서는 지워지지만,</text>
<text x="40" y="224" font-size="12" fill="#ff3b30">소스 그래프에는 순환이 남아 계층이 섞인다</text>
<line x1="320" y1="50" x2="320" y2="280" stroke="#c7c7cc" stroke-dasharray="4 4"/>
<text x="480" y="62" font-size="13" font-weight="700" fill="#1f7a3a" text-anchor="middle">후: 공통 타입을 제3의 파일로</text>
<rect x="360" y="90" width="110" height="44" rx="8" fill="#f2f2f7"/><text x="415" y="117" font-size="13" fill="#1d1d1f" text-anchor="middle">Mail.tsx</text>
<rect x="490" y="90" width="120" height="44" rx="8" fill="#f2f2f7"/><text x="550" y="117" font-size="13" fill="#1d1d1f" text-anchor="middle">MailMobile.tsx</text>
<rect x="425" y="190" width="120" height="44" rx="8" fill="#eef5ff" stroke="#0a84ff"/><text x="485" y="211" font-size="13" fill="#0a84ff" text-anchor="middle">model.ts</text><text x="485" y="227" font-size="12" fill="#6e6e73" text-anchor="middle">ListMail·Mailbox</text>
<path d="M470 112 H486" stroke="#34c759" stroke-width="1.5" marker-end="url(#g)"/>
<path d="M415 134 L470 186" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<path d="M550 134 L500 186" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<text x="360" y="266" font-size="12" fill="#1d1d1f">화살표가 한 방향으로만 흐른다. madge가 CI에서 확인</text>
</svg>
