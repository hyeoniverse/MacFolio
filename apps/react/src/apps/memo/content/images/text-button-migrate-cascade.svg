<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>이기는 순서: 앱 CSS(층 밖, 원래 점수) &gt; :where 규칙(층 밖, 점수 0) &gt; .ui-button(components 층) &gt; 앱 reset 층. :where 규칙은 공통 CSS가 더한 값만 지우고 앱 규칙에는 진다</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs>
<rect width="760" height="290" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">공통 CSS가 더한 값만 지우는 :where() 규칙</text>
<rect x="70" y="64" width="360" height="40" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="250.0" y="87.8" font-size="10.5" fill="#374151" text-anchor="middle">앱 CSS  .bin-empty-button { … }</text>
<text x="446" y="88" font-size="10.5" fill="#374151">층 밖 · 원래 점수 → 늘 이긴다</text>
<rect x="70" y="114" width="360" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="250.0" y="137.8" font-size="10.5" fill="#374151" text-anchor="middle">:where(.bin-empty-button):where(.ui-button)</text>
<text x="446" y="138" font-size="10.5" fill="#374151">층 밖 · 점수 0 → 공통 CSS는 이기고 앱 규칙에는 진다</text>
<rect x="70" y="164" width="360" height="40" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="250.0" y="187.8" font-size="10.5" fill="#374151" text-anchor="middle">.ui-button  (inline-flex, gap 6px, fade-in, opacity .45)</text>
<text x="446" y="188" font-size="10.5" fill="#374151">@layer components</text>
<rect x="70" y="214" width="360" height="40" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="250.0" y="237.8" font-size="10.5" fill="#374151" text-anchor="middle">.memo button { font: inherit }</text>
<text x="446" y="238" font-size="10.5" fill="#374151">앱 reset 층 → components 층에 진다</text>
<path d="M48 252 V70" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<text x="36" y="270" font-size="10" fill="#6b7280">아래에서 위로 갈수록 이긴다</text>
</svg>
