<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">SQL 문의 세 갈래와 다루는 대상</text>
  <g font-size="12" fill="#1d1d1f">
    <rect x="20" y="46" width="190" height="236" rx="10" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="115" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#0a84ff">DDL 데이터 정의</text>
    <text x="115" y="94" text-anchor="middle" fill="#6e6e73">대상: 구조(스키마)</text>
    <text x="36" y="124" font-family="SFMono-Regular, Menlo, monospace">CREATE</text>
    <text x="36" y="144" font-family="SFMono-Regular, Menlo, monospace">ALTER</text>
    <text x="36" y="164" font-family="SFMono-Regular, Menlo, monospace">DROP</text>
    <text x="36" y="196" fill="#6e6e73">테이블·뷰·도메인을</text>
    <text x="36" y="214" fill="#6e6e73">만들고 바꾸고 제거</text>
    <rect x="30" y="232" width="170" height="38" rx="6" fill="#fff"/>
    <text x="40" y="256" font-size="12" font-family="SFMono-Regular, Menlo, monospace">CREATE TABLE ENROL</text>

    <rect x="225" y="46" width="190" height="236" rx="10" fill="#eaf8ee" stroke="#34c759" stroke-width="1.5"/>
    <text x="320" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#248a3d">DML 데이터 조작</text>
    <text x="320" y="94" text-anchor="middle" fill="#6e6e73">대상: 행(데이터 값)</text>
    <text x="241" y="124" font-family="SFMono-Regular, Menlo, monospace">SELECT</text>
    <text x="241" y="144" font-family="SFMono-Regular, Menlo, monospace">INSERT</text>
    <text x="241" y="164" font-family="SFMono-Regular, Menlo, monospace">UPDATE</text>
    <text x="241" y="184" font-family="SFMono-Regular, Menlo, monospace">DELETE</text>
    <text x="241" y="214" fill="#6e6e73">검색·삽입·갱신·삭제</text>
    <rect x="235" y="232" width="170" height="38" rx="6" fill="#fff"/>
    <text x="245" y="256" font-size="12" font-family="SFMono-Regular, Menlo, monospace">DELETE FROM ENROL</text>

    <rect x="430" y="46" width="190" height="236" rx="10" fill="#fff5e6" stroke="#ff9f0a" stroke-width="1.5"/>
    <text x="525" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#c77700">DCL 데이터 제어</text>
    <text x="525" y="94" text-anchor="middle" fill="#6e6e73">대상: 권한·트랜잭션</text>
    <text x="446" y="124" font-family="SFMono-Regular, Menlo, monospace">GRANT</text>
    <text x="446" y="144" font-family="SFMono-Regular, Menlo, monospace">REVOKE</text>
    <text x="446" y="164" font-family="SFMono-Regular, Menlo, monospace">COMMIT</text>
    <text x="446" y="184" font-family="SFMono-Regular, Menlo, monospace">ROLLBACK</text>
    <text x="446" y="214" fill="#6e6e73">보안·회복·병행 제어</text>
    <rect x="440" y="232" width="170" height="38" rx="6" fill="#fff"/>
    <text x="450" y="256" font-size="12" font-family="SFMono-Regular, Menlo, monospace">GRANT SELECT ON …</text>
  </g>
</svg>
