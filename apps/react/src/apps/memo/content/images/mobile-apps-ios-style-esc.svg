<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>Esc 키 이벤트를 처리한 곳이 있으면 뒤로 가기를 실행하지 않는다</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="24" y="30" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">Esc 한 번의 처리 순서 (팝오버가 열린 메모 본문)</text>
<line x1="40" y1="70" x2="610" y2="70" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="600" y="60" font-size="12" fill="#6e6e73" text-anchor="end">시간</text>
<circle cx="70" cy="70" r="6" fill="#1d1d1f"/>
<text x="70" y="98" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">keydown 발생</text>
<circle cx="200" cy="70" r="6" fill="#0a84ff"/>
<text x="200" y="98" font-size="13" fill="#0a84ff" text-anchor="middle" font-weight="700">팝오버 리스너</text>
<text x="200" y="116" font-size="12" fill="#6e6e73" text-anchor="middle">닫고 preventDefault()</text>
<circle cx="350" cy="70" r="6" fill="#6e6e73"/>
<text x="350" y="98" font-size="13" fill="#6e6e73" text-anchor="middle" font-weight="700">다른 리스너들</text>
<text x="350" y="116" font-size="12" fill="#6e6e73" text-anchor="middle">등록 순서대로 실행</text>
<circle cx="500" cy="70" r="6" fill="#ff9f0a"/>
<text x="500" y="98" font-size="13" fill="#ff9f0a" text-anchor="middle" font-weight="700">setTimeout 0</text>
<text x="500" y="116" font-size="12" fill="#6e6e73" text-anchor="middle">전파가 끝난 뒤 실행</text>
<rect x="380" y="140" width="240" height="70" rx="8" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.2"/>
<text x="500" y="164" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">뒤로 가기 처리</text>
<text x="500" y="184" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">event.defaultPrevented가 true</text>
<text x="500" y="200" font-size="12" fill="#ff3b30" text-anchor="middle">→ 실행하지 않는다</text>
<line x1="500" y1="122" x2="500" y2="138" stroke="#ff9f0a" stroke-width="1.6" marker-end="url(#aro)"/>
<rect x="24" y="140" width="330" height="70" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="40" y="164" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="700">열린 팝오버가 없을 때</text>
<text x="40" y="184" font-size="12" fill="#6e6e73" text-anchor="start">아무도 preventDefault()를 호출하지 않으므로</text>
<text x="40" y="200" font-size="12" fill="#34c759" text-anchor="start">setTimeout 0에서 뒤로 가기가 한 단계 실행된다</text>
<text x="24" y="244" font-size="12" fill="#1d1d1f" text-anchor="start">등록 순서와 관계없이 결과가 같다. 뒤로 가기는 모든 리스너가 실행된 뒤에 판정하기 때문이다.</text>
<text x="24" y="264" font-size="12" fill="#6e6e73" text-anchor="start">입력 칸 안의 Esc, 제어 센터·앱 전환기가 열린 상태는 이 판정 전에 제외한다.</text>
</svg>
