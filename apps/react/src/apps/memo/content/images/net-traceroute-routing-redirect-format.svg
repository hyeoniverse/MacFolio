<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">ICMP 재지정 메시지 형식</text>
  <g font-size="11" fill="#6e6e73">
    <text x="60" y="54" text-anchor="middle">0</text>
    <text x="180" y="54" text-anchor="middle">7 8</text>
    <text x="300" y="54" text-anchor="middle">15 16</text>
    <text x="540" y="54" text-anchor="middle">31</text>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.2">
    <rect x="60" y="62" width="120" height="34" fill="#e5f1ff"/>
    <rect x="180" y="62" width="120" height="34" fill="#e5f1ff"/>
    <rect x="300" y="62" width="240" height="34" fill="#f2f2f7"/>
    <rect x="60" y="96" width="480" height="34" fill="#fff4e5"/>
    <path d="M60 130 V194 H540 V130" fill="#f2f2f7"/>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.2">
    <line x1="52" y1="168" x2="68" y2="156"/><line x1="52" y1="174" x2="68" y2="162"/>
    <line x1="532" y1="168" x2="548" y2="156"/><line x1="532" y1="174" x2="548" y2="162"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1d1d1f">
    <text x="120" y="84">유형(5)</text>
    <text x="240" y="84">코드(0~3)</text>
    <text x="420" y="84">체크섬</text>
    <text x="300" y="118">라우터의 인터넷 주소(새로 쓸 다음 홉)</text>
    <text x="300" y="158">원래 IP 데이터그램의 IP 헤더(옵션 포함)</text>
    <text x="300" y="178">+ 원래 데이터그램 데이터의 처음 8바이트</text>
  </g>
  <g stroke="#6e6e73" stroke-width="1.2">
    <line x1="548" y1="62" x2="580" y2="62"/><line x1="548" y1="130" x2="580" y2="130"/>
    <line x1="566" y1="66" x2="566" y2="126"/>
    <path d="M562 72 L566 64 L570 72 M562 120 L566 128 L570 120" fill="none"/>
  </g>
  <text x="574" y="100" font-size="12" fill="#6e6e73">8바이트</text>
  <text x="320" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">재지정 메시지의 코드 값</text>
  <rect x="120" y="250" width="400" height="28" fill="#f2f2f7"/>
  <g stroke="#1d1d1f" stroke-width="1">
    <rect x="120" y="250" width="400" height="128" fill="none"/>
    <line x1="120" y1="278" x2="520" y2="278"/>
    <line x1="190" y1="250" x2="190" y2="378"/>
  </g>
  <g font-size="12.5" fill="#1d1d1f">
    <text x="155" y="269" text-anchor="middle" font-weight="600">코드</text>
    <text x="355" y="269" text-anchor="middle" font-weight="600">설명</text>
    <text x="155" y="300" text-anchor="middle">0</text><text x="206" y="300">네트워크에 대한 재지정</text>
    <text x="155" y="324" text-anchor="middle">1</text><text x="206" y="324">호스트에 대한 재지정</text>
    <text x="155" y="348" text-anchor="middle">2</text><text x="206" y="348">서비스 유형(TOS)과 네트워크에 대한 재지정</text>
    <text x="155" y="372" text-anchor="middle">3</text><text x="206" y="372">서비스 유형(TOS)과 호스트에 대한 재지정</text>
  </g>
</svg>
