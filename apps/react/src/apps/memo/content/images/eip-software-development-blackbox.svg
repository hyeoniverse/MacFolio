<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>동치 분할과 경계값 분석</title><rect width="640" height="350" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">점수 입력(0~100, 60 이상 합격)의 동치 분할과 경계값</text><rect x="40" y="60" width="78" height="44" fill="#ffe5e3"/><text x="79.0" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#ff453a">무효</text><rect x="118" y="60" width="240" height="44" fill="#f2f2f7"/><text x="238.0" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">유효: 불합격</text><rect x="358" y="60" width="164" height="44" fill="#e9f9ee"/><text x="440.0" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#1f8a3b">유효: 합격</text><rect x="522" y="60" width="78" height="44" fill="#ffe5e3"/><text x="561.0" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#ff453a">무효</text><line x1="40" y1="104" x2="600" y2="104" stroke="#6e6e73" stroke-width="1.5"/><line x1="120" y1="100" x2="120" y2="110" stroke="#6e6e73"/><text x="120.0" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">0</text><line x1="360" y1="100" x2="360" y2="110" stroke="#6e6e73"/><text x="360.0" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">60</text><line x1="520" y1="100" x2="520" y2="110" stroke="#6e6e73"/><text x="520.0" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">100</text><text x="40" y="160" text-anchor="start" font-size="13" font-weight="600" fill="#0a84ff">동치 분할: 분할마다 대표값 하나</text><circle cx="100" cy="182" r="7" fill="#0a84ff"/><text x="100.0" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">-5</text><circle cx="240" cy="182" r="7" fill="#0a84ff"/><text x="240.0" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">30</text><circle cx="440" cy="182" r="7" fill="#0a84ff"/><text x="440.0" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">80</text><circle cx="560" cy="182" r="7" fill="#0a84ff"/><text x="560.0" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">110</text><text x="80.0" y="138" text-anchor="middle" font-size="11" font-weight="400" fill="#ff453a">0 미만</text><text x="560.0" y="138" text-anchor="middle" font-size="11" font-weight="400" fill="#ff453a">100 초과</text><text x="40" y="246" text-anchor="start" font-size="13" font-weight="600" fill="#ff9f0a">경계값 분석: 경계와 그 바로 바깥</text><circle cx="108" cy="268" r="6" fill="#ff9f0a"/><text x="113.0" y="292" text-anchor="end" font-size="11" font-weight="400" fill="#1d1d1f">-1</text><circle cx="128" cy="268" r="6" fill="#ff9f0a"/><text x="123.0" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#1d1d1f">0</text><circle cx="348" cy="268" r="6" fill="#ff9f0a"/><text x="353.0" y="292" text-anchor="end" font-size="11" font-weight="400" fill="#1d1d1f">59</text><circle cx="368" cy="268" r="6" fill="#ff9f0a"/><text x="363.0" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#1d1d1f">60</text><circle cx="512" cy="268" r="6" fill="#ff9f0a"/><text x="517.0" y="292" text-anchor="end" font-size="11" font-weight="400" fill="#1d1d1f">100</text><circle cx="532" cy="268" r="6" fill="#ff9f0a"/><text x="527.0" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#1d1d1f">101</text><text x="320" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">개발자가 조건을 60 &gt; 대신 60 &gt;= 로 잘못 쓰는 실수는 59와 60 사이에서 드러난다</text></svg>
