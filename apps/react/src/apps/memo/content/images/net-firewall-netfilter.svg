<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="380" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">netfilter 훅을 지나는 순서와 각 지점의 테이블</text>

  <!-- 양 끝 막대 -->
  <rect x="16" y="44" width="52" height="316" rx="6" fill="#1d1d1f"/>
  <text x="42" y="196" text-anchor="middle" font-size="11" fill="#fff">네트워크</text>
  <text x="42" y="212" text-anchor="middle" font-size="11" fill="#fff">인터페이스</text>
  <rect x="572" y="44" width="52" height="316" rx="6" fill="#1d1d1f"/>
  <text x="598" y="196" text-anchor="middle" font-size="11" fill="#fff">지역</text>
  <text x="598" y="212" text-anchor="middle" font-size="11" fill="#fff">프로세스</text>

  <!-- 묶음 배경 -->
  <g fill="#f2f2f7" stroke="#c7c7cc">
    <rect x="84" y="66" width="262" height="44" rx="6"/>
    <rect x="436" y="66" width="128" height="44" rx="6"/>
    <rect x="352" y="160" width="72" height="88" rx="6"/>
    <rect x="84" y="290" width="132" height="44" rx="6"/>
    <rect x="252" y="290" width="312" height="44" rx="6"/>
  </g>
  <g font-size="11" font-weight="600" fill="#6e6e73" text-anchor="middle">
    <text x="215" y="60">PREROUTING</text>
    <text x="500" y="60">INPUT</text>
    <text x="432" y="208" text-anchor="start">FORWARD</text>
    <text x="150" y="352">POSTROUTING</text>
    <text x="408" y="352">OUTPUT</text>
  </g>

  <!-- 테이블 상자: raw·conntrack 회색, mangle 초록, nat 주황, filter 파랑 -->
  <g font-size="11" text-anchor="middle">
    <!-- PREROUTING: raw → conntrack → mangle → nat -->
    <rect x="90" y="75" width="56" height="26" rx="4" fill="#d1d1d6"/><text x="118" y="92" fill="#1d1d1f">raw</text>
    <rect x="154" y="75" width="56" height="26" rx="4" fill="#d1d1d6"/><text x="182" y="92" fill="#1d1d1f">conntrack</text>
    <rect x="218" y="75" width="56" height="26" rx="4" fill="#34c759"/><text x="246" y="92" fill="#fff">mangle</text>
    <rect x="282" y="75" width="56" height="26" rx="4" fill="#ff9f0a"/><text x="310" y="92" fill="#fff">nat</text>
    <!-- INPUT: mangle → filter -->
    <rect x="442" y="75" width="56" height="26" rx="4" fill="#34c759"/><text x="470" y="92" fill="#fff">mangle</text>
    <rect x="502" y="75" width="56" height="26" rx="4" fill="#0a84ff"/><text x="530" y="92" fill="#fff">filter</text>
    <!-- FORWARD: mangle → filter -->
    <rect x="360" y="170" width="56" height="26" rx="4" fill="#34c759"/><text x="388" y="187" fill="#fff">mangle</text>
    <rect x="360" y="212" width="56" height="26" rx="4" fill="#0a84ff"/><text x="388" y="229" fill="#fff">filter</text>
    <!-- OUTPUT (오른쪽에서 왼쪽): raw → conntrack → mangle → nat → filter -->
    <rect x="502" y="299" width="56" height="26" rx="4" fill="#d1d1d6"/><text x="530" y="316" fill="#1d1d1f">raw</text>
    <rect x="440" y="299" width="56" height="26" rx="4" fill="#d1d1d6"/><text x="468" y="316" fill="#1d1d1f">conntrack</text>
    <rect x="378" y="299" width="56" height="26" rx="4" fill="#34c759"/><text x="406" y="316" fill="#fff">mangle</text>
    <rect x="316" y="299" width="56" height="26" rx="4" fill="#ff9f0a"/><text x="344" y="316" fill="#fff">nat</text>
    <rect x="258" y="299" width="52" height="26" rx="4" fill="#0a84ff"/><text x="284" y="316" fill="#fff">filter</text>
    <!-- POSTROUTING (오른쪽에서 왼쪽): mangle → nat -->
    <rect x="154" y="299" width="56" height="26" rx="4" fill="#34c759"/><text x="182" y="316" fill="#fff">mangle</text>
    <rect x="90" y="299" width="56" height="26" rx="4" fill="#ff9f0a"/><text x="118" y="316" fill="#fff">nat</text>
  </g>

  <!-- 라우팅 판단 -->
  <polygon points="390,64 424,88 390,112 356,88" fill="#fff" stroke="#1d1d1f"/>
  <text x="390" y="85" text-anchor="middle" font-size="10" fill="#1d1d1f">라우팅</text>
  <text x="390" y="97" text-anchor="middle" font-size="10" fill="#1d1d1f">판단</text>

  <g stroke="#1d1d1f" stroke-width="1.4" fill="none">
    <!-- 들어오는 경로 -->
    <line x1="68" y1="88" x2="88" y2="88" marker-end="url(#a)"/>
    <line x1="146" y1="88" x2="152" y2="88"/>
    <line x1="210" y1="88" x2="216" y2="88"/>
    <line x1="274" y1="88" x2="280" y2="88"/>
    <line x1="338" y1="88" x2="354" y2="88" marker-end="url(#a)"/>
    <line x1="424" y1="88" x2="440" y2="88" marker-end="url(#a)"/>
    <line x1="498" y1="88" x2="500" y2="88"/>
    <line x1="558" y1="88" x2="570" y2="88" marker-end="url(#a)"/>
    <!-- FORWARD 경로 -->
    <line x1="390" y1="112" x2="390" y2="168" marker-end="url(#a)"/>
    <line x1="388" y1="196" x2="388" y2="210" marker-end="url(#a)"/>
    <polyline points="388,238 388,268 234,268 234,310" marker-end="url(#a)"/>
    <!-- 나가는 경로 -->
    <line x1="572" y1="312" x2="560" y2="312" marker-end="url(#a)"/>
    <line x1="502" y1="312" x2="496" y2="312"/>
    <line x1="440" y1="312" x2="434" y2="312"/>
    <line x1="378" y1="312" x2="372" y2="312"/>
    <line x1="316" y1="312" x2="310" y2="312"/>
    <line x1="258" y1="312" x2="212" y2="312" marker-end="url(#a)"/>
    <line x1="154" y1="312" x2="146" y2="312"/>
    <line x1="90" y1="312" x2="70" y2="312" marker-end="url(#a)"/>
  </g>
  <text x="300" y="190" text-anchor="middle" font-size="11" fill="#6e6e73">다른 호스트로</text>
  <text x="300" y="204" text-anchor="middle" font-size="11" fill="#6e6e73">전달</text>
</svg>
