<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>탭을 바꿔도 정렬이 남은 까닭: 같은 자리, 같은 컴포넌트</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">탭을 바꿔도 정렬이 남은 까닭: 같은 자리, 같은 컴포넌트</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">React는 타입과 자리가 같으면 상태를 그대로 두고 props만 바꾼다</text>
<rect x="32" y="86" width="380" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="44" y="112.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start">key 없음 (버그)</text>
<text x="44" y="129.5" font-size="11" fill="#374151" text-anchor="start">유입 경로: StatTable sort = 이름 ▲</text>
<text x="44" y="146.5" font-size="11" fill="#374151" text-anchor="start">→ 앱·글로 이동: 같은 자리의 StatTable</text>
<text x="44" y="163.5" font-size="11" fill="#374151" text-anchor="start">sort 상태 유지 → 조회수 표가 이름순</text>
<rect x="448" y="86" width="380" height="96" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="460" y="112.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="start">key={tab} (고침)</text>
<text x="460" y="129.5" font-size="11" fill="#374151" text-anchor="start">탭이 바뀌면 본문을 새로 마운트</text>
<text x="460" y="146.5" font-size="11" fill="#374151" text-anchor="start">StatTable의 useState도 처음 값</text>
<text x="460" y="163.5" font-size="11" fill="#374151" text-anchor="start">조회수 표는 다시 많은 순 ▼</text>
<rect x="32" y="210" width="380" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="44" y="237.0" font-size="13" fill="#374151" font-weight="700" text-anchor="start">재현</text>
<text x="44" y="254.0" font-size="11" fill="#374151" text-anchor="start">유입 경로에서 이름 머리 누름</text>
<text x="44" y="271.0" font-size="11" fill="#374151" text-anchor="start">→ 앱·글 탭 → 첫 줄이 가장 적은 글</text>
<rect x="448" y="210" width="380" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="460" y="237.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="start">시험이 잡은 곳</text>
<text x="460" y="254.0" font-size="11" fill="#374151" text-anchor="start">이름순으로 바꾼 뒤 앱·글 탭에서</text>
<text x="460" y="271.0" font-size="11" fill="#374151" text-anchor="start">많은 순인지 본다 (activity.spec.ts)</text>
</svg>
