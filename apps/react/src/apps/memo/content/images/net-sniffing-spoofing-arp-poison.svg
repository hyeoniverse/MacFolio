<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>

  <text x="160" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">정상 트래픽 경로</text>
  <text x="480" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">ARP 캐시가 오염된 경로</text>
  <line x1="320" y1="40" x2="320" y2="280" stroke="#d1d1d6"/>

  <!-- 왼쪽 패널 -->
  <g stroke="#1d1d1f" stroke-width="1.4">
    <line x1="80" y1="100" x2="240" y2="100"/>
    <line x1="160" y1="100" x2="160" y2="210"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#1d1d1f">
    <rect x="30" y="80" width="64" height="40" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="62" y="104">대상 호스트</text>
    <rect x="132" y="88" width="56" height="24" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="160" y="104">스위치</text>
    <rect x="226" y="80" width="64" height="40" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="258" y="104">라우터</text>
    <rect x="128" y="210" width="64" height="40" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="160" y="234">스니퍼</text>
  </g>
  <g stroke-width="1.8" fill="none">
    <line x1="96" y1="70" x2="222" y2="70" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="222" y1="140" x2="96" y2="140" stroke="#ff9f0a" marker-end="url(#o)"/>
  </g>
  <text x="160" y="62" text-anchor="middle" font-size="11" fill="#0a84ff">나가는 트래픽</text>
  <text x="244" y="160" text-anchor="middle" font-size="11" fill="#ff9f0a">들어오는 트래픽</text>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#6e6e73">스니퍼에는 대상 트래픽이 오지 않는다</text>

  <!-- 오른쪽 패널 -->
  <g stroke="#1d1d1f" stroke-width="1.4">
    <line x1="400" y1="100" x2="560" y2="100"/>
    <line x1="480" y1="100" x2="480" y2="210"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#1d1d1f">
    <rect x="350" y="80" width="64" height="40" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="382" y="104">대상 호스트</text>
    <rect x="452" y="88" width="56" height="24" rx="4" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="480" y="104">스위치</text>
    <rect x="546" y="80" width="64" height="40" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="578" y="104">라우터</text>
    <rect x="448" y="210" width="64" height="40" rx="6" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="480" y="234">스니퍼</text>
  </g>
  <g stroke-width="1.8" fill="none">
    <line x1="388" y1="126" x2="452" y2="206" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="508" y1="206" x2="572" y2="126" stroke="#0a84ff" marker-end="url(#b)"/>
    <line x1="584" y1="128" x2="520" y2="210" stroke="#ff9f0a" marker-end="url(#o)"/>
    <line x1="442" y1="212" x2="376" y2="128" stroke="#ff9f0a" marker-end="url(#o)"/>
  </g>
  <text x="480" y="270" text-anchor="middle" font-size="11" fill="#6e6e73">양방향 트래픽이 모두 스니퍼를 거친다</text>
  <text x="480" y="62" text-anchor="middle" font-size="11" fill="#6e6e73">대상과 라우터의 ARP 캐시에</text>
  <text x="480" y="76" text-anchor="middle" font-size="11" fill="#6e6e73">상대 IP = 스니퍼 MAC</text>
</svg>
