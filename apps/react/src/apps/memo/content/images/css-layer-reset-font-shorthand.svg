<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>font: inherit 한 줄이 하위 속성 일곱 개를 모두 덮어쓰는 과정</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs>
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="30" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">단축 속성 font는 하위 속성을 모두 지정한다</text>

  <rect x="20" y="56" width="190" height="56" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="115" y="80" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">.memo button {</text>
  <text x="115" y="100" font-size="13" fill="#ff3b30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">font: inherit; }</text>

  <line x1="210" y1="84" x2="250" y2="84" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>

  <g font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">
    <rect x="256" y="50" width="200" height="200" rx="10" fill="#ffffff" stroke="#ff3b30"/>
    <text x="270" y="74">font-style: inherit</text>
    <text x="270" y="98">font-variant: inherit</text>
    <text x="270" y="122" fill="#ff3b30" font-weight="700">font-weight: inherit</text>
    <text x="270" y="146">font-stretch: inherit</text>
    <text x="270" y="170" fill="#ff3b30" font-weight="700">font-size: inherit</text>
    <text x="270" y="194">line-height: inherit</text>
    <text x="270" y="218">font-family: inherit</text>
    <text x="270" y="240" font-size="12" fill="#6e6e73" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">명시도 (0, 1, 1)</text>
  </g>

  <rect x="466" y="98" width="164" height="80" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="548" y="120" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">.memo-writer-publish</text>
  <text x="548" y="142" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" text-decoration="line-through">font-size: 11px</text>
  <text x="548" y="162" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" text-decoration="line-through">font-weight: 600</text>
  <text x="548" y="196" font-size="12" fill="#6e6e73" text-anchor="middle">명시도 (0, 1, 0)</text>
  <line x1="466" y1="140" x2="458" y2="140" stroke="#ff3b30" stroke-width="1.5"/>

  <rect x="20" y="268" width="600" height="56" rx="10" fill="#f2f2f7"/>
  <text x="36" y="292" font-size="13" fill="#1d1d1f">계산된 값: font-size <tspan font-weight="700">12px</tspan>, font-weight <tspan font-weight="700">400</tspan> (부모 값을 상속)</text>
  <text x="36" y="312" font-size="13" fill="#0a84ff">reset 층으로 옮긴 뒤: font-size 11px, font-weight 600 (버튼 클래스의 값)</text>
</svg>
