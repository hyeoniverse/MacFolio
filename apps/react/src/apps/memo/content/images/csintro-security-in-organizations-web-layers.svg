<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>웹 서버를 보호하는 네트워크, 시스템, 애플리케이션 3계층 보안</title>
<defs></defs>
<rect width="640" height="270" fill="#fff"/>
<text x="320" y="30" font-size="16" fill="#1d1d1f" text-anchor="middle" font-weight="600">웹 서버를 감싸는 3계층 보안</text>
<rect x="20" y="50" width="600" height="190" rx="8" fill="#eef6ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="320.0" y="149.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="35" y="72" font-size="13" fill="#0a84ff" text-anchor="start" font-weight="600">네트워크 보안: Anti-DDoS, 방화벽, TMS·IDS</text>
<rect x="60" y="85" width="520" height="140" rx="8" fill="#fff6e8" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="320.0" y="159.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="75" y="107" font-size="13" fill="#b86e00" text-anchor="start" font-weight="600">시스템 보안: 서버 보안(Secure OS), 접근 통제(NAC·SAC·DAC)</text>
<rect x="100" y="120" width="440" height="90" rx="8" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="320.0" y="169.6" font-size="13" fill="#1d1d1f" text-anchor="middle"></text>
<text x="115" y="142" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="600">애플리케이션 보안: 웹 방화벽, 웹셸 탐지, 시큐어 코딩</text>
<rect x="250" y="155" width="140" height="40" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="320.0" y="179.6" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">웹 서버 (DMZ)</text>
<text x="320" y="260" font-size="12" fill="#6e6e73" text-anchor="middle">바깥 계층이 뚫려도 안쪽 계층이 다시 막도록 겹쳐 둔다</text>
</svg>
