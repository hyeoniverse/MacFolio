<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>UML 다이어그램 분류</title><rect width="640" height="390" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">UML 다이어그램의 분류</text><rect x="240" y="42" width="160" height="36" rx="8" fill="#1d1d1f" stroke="none" stroke-width="1.5"/><text x="320.0" y="64.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">UML 다이어그램</text><rect x="40" y="104" width="250" height="36" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="165.0" y="126.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">구조 다이어그램 (정적)</text><rect x="350" y="104" width="250" height="36" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="475.0" y="126.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">행위 다이어그램 (동적)</text><line x1="320" y1="78" x2="165" y2="104" stroke="#6e6e73" stroke-width="1.5"/><line x1="320" y1="78" x2="475" y2="104" stroke="#6e6e73" stroke-width="1.5"/><rect x="40" y="152" width="250" height="26" rx="5" fill="#e8f2ff"/><text x="52" y="170" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">클래스</text><text x="282" y="170" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">속성·연산과 클래스 사이 관계</text><rect x="40" y="182" width="250" height="26" rx="5" fill="#e8f2ff"/><text x="52" y="200" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">객체</text><text x="282" y="200" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">특정 시점의 인스턴스와 링크</text><rect x="40" y="212" width="250" height="26" rx="5" fill="#e8f2ff"/><text x="52" y="230" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">컴포넌트</text><text x="282" y="230" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">구현 모듈과 인터페이스</text><rect x="40" y="242" width="250" height="26" rx="5" fill="#e8f2ff"/><text x="52" y="260" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">배치</text><text x="282" y="260" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">노드(서버·장치)와 산출물 배치</text><rect x="40" y="272" width="250" height="26" rx="5" fill="#e8f2ff"/><text x="52" y="290" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">복합체 구조</text><text x="282" y="290" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">클래스 내부 구조</text><rect x="40" y="302" width="250" height="26" rx="5" fill="#e8f2ff"/><text x="52" y="320" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">패키지</text><text x="282" y="320" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">요소를 묶은 그룹과 의존</text><rect x="350" y="152" width="250" height="26" rx="5" fill="#fff4e5"/><text x="362" y="170" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">유스케이스</text><text x="592" y="170" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">사용자 관점의 기능</text><rect x="350" y="182" width="250" height="26" rx="5" fill="#ffe8c2"/><text x="362" y="200" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">시퀀스</text><text x="592" y="200" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">시간 순서에 따른 메시지</text><rect x="350" y="212" width="250" height="26" rx="5" fill="#ffe8c2"/><text x="362" y="230" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">커뮤니케이션</text><text x="592" y="230" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">객체 간 링크와 메시지</text><rect x="350" y="242" width="250" height="26" rx="5" fill="#fff4e5"/><text x="362" y="260" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">상태</text><text x="592" y="260" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">이벤트에 따른 상태 변화</text><rect x="350" y="272" width="250" height="26" rx="5" fill="#fff4e5"/><text x="362" y="290" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">활동</text><text x="592" y="290" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">처리 흐름과 분기</text><rect x="350" y="302" width="250" height="26" rx="5" fill="#ffe8c2"/><text x="362" y="320" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">상호작용 개요</text><text x="592" y="320" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">상호작용 다이어그램의 흐름</text><rect x="350" y="332" width="250" height="26" rx="5" fill="#ffe8c2"/><text x="362" y="350" text-anchor="start" font-size="12" font-weight="600" fill="#1d1d1f">타이밍</text><text x="592" y="350" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">시간 제약과 상태 변화</text><text x="475" y="374" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">진한 칸 4개는 상호작용 다이어그램으로 묶인다</text><text x="165" y="374" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">UML 2.5에는 프로파일 다이어그램도 구조 쪽에 있다</text></svg>
