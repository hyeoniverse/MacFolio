<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>바깥 문서의 세션 기록으로 iframe 기록 위치 추정</title>
<rect width="760" height="380" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="700" fill="#1f2937">바깥 문서의 세션 기록으로 iframe 기록 위치 추정</text>
<text x="32" y="60" font-size="12" fill="#6b7280">다른 출처 iframe의 contentWindow.history는 읽을 수 없다. iframe 안의 이동은 바깥 문서의 세션 기록에 함께 쌓인다</text>

<text x="32" y="100" font-size="13" font-weight="700" fill="#374151">바깥 문서의 세션 기록 (history.length = 3)</text>
<rect x="32" y="112" width="200" height="58" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="46" y="136" font-size="12" font-weight="600" fill="#374151">1  MacFolio</text>
<text x="46" y="156" font-size="11" fill="#6b7280">주소 막대는 replaceState만</text>
<rect x="256" y="112" width="200" height="58" rx="10" fill="#dcfce7" stroke="#86efac"/>
<text x="270" y="136" font-size="12" font-weight="600" fill="#374151">2  iframe: /news/1</text>
<text x="270" y="156" font-size="11" fill="#6b7280">iframe 안 링크 이동</text>
<rect x="480" y="112" width="200" height="58" rx="10" fill="#dcfce7" stroke="#86efac"/>
<text x="494" y="136" font-size="12" font-weight="600" fill="#374151">3  iframe: /news/2</text>
<text x="494" y="156" font-size="11" fill="#6b7280">iframe 안 링크 이동</text>

<path d="M32 184 H232" stroke="#9ca3af" stroke-width="2"/>
<text x="132" y="202" font-size="12" fill="#374151" text-anchor="middle">base = 1 (창을 연 시각의 길이)</text>
<path d="M256 184 H680" stroke="#16a34a" stroke-width="2"/>
<text x="468" y="202" font-size="12" fill="#15803d" text-anchor="middle">length = 2 (늘어난 수 = 이 iframe이 쌓은 기록)</text>

<text x="32" y="246" font-size="13" font-weight="700" fill="#374151">위치(index)</text>
<text x="160" y="246" font-size="12" fill="#374151">링크를 두 번 누른 뒤</text>
<path d="M580 236 L580 222" stroke="#2563eb" stroke-width="2"/><path d="M574 226 L580 218 L586 226" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="596" y="246" font-size="12" fill="#2563eb">index 2 (‹ 활성, › 비활성)</text>
<text x="160" y="276" font-size="12" fill="#374151">‹ 누름 → window.history.back()</text>
<path d="M356 266 L356 252" stroke="#2563eb" stroke-width="2"/><path d="M350 256 L356 248 L362 256" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="372" y="276" font-size="12" fill="#2563eb">index 1, iframe이 /news/1로 이동</text>

<text x="32" y="318" font-size="12" fill="#374151">· 뒤로 가기는 index &gt; 0일 때만 활성 → iframe 기록이 없을 때 MacFolio의 이전 페이지로 나가지 않는다</text>
<text x="32" y="338" font-size="12" fill="#374151">· 새로 고침은 contentWindow.location.replace(src): src를 다시 지정하면 기록이 하나 더 쌓인다</text>
<text x="32" y="358" font-size="12" fill="#374151">· 세션 기록은 문서 전체에 하나: 프로젝트 앱 두 개를 번갈아 이동하면 마지막에 기록을 쌓은 iframe이 움직인다</text>
</svg>
