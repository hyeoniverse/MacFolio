<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>클래스 다이어그램 예</title><rect width="640" height="414" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">주문 도메인의 클래스 다이어그램</text><defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12z" fill="#fff" stroke="#1d1d1f" stroke-width="1.2"/></marker><marker id="diaf" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M0 5L8 0L16 5L8 10z" fill="#1d1d1f"/></marker></defs><rect x="30" y="60" width="170" height="102" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><rect x="30" y="60" width="170" height="28" fill="#e8f2ff" stroke="#1d1d1f" stroke-width="1.5"/><text x="115.0" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">회원</text><line x1="30" y1="134" x2="200" y2="134" stroke="#1d1d1f" stroke-width="1.5"/><text x="38" y="107" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">- id: String</text><text x="38" y="125" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">- name: String</text><text x="38" y="153" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">+ order(): 주문</text><rect x="250" y="60" width="170" height="120" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><rect x="250" y="60" width="170" height="28" fill="#e8f2ff" stroke="#1d1d1f" stroke-width="1.5"/><text x="335.0" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">주문</text><line x1="250" y1="134" x2="420" y2="134" stroke="#1d1d1f" stroke-width="1.5"/><text x="258" y="107" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">- orderNo: int</text><text x="258" y="125" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">- date: Date</text><text x="258" y="153" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">+ total(): int</text><text x="258" y="171" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">+ cancel(): void</text><rect x="470" y="60" width="150" height="84" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><rect x="470" y="60" width="150" height="28" fill="#e8f2ff" stroke="#1d1d1f" stroke-width="1.5"/><text x="545.0" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">주문 항목</text><line x1="470" y1="116" x2="620" y2="116" stroke="#1d1d1f" stroke-width="1.5"/><text x="478" y="107" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">- qty: int</text><text x="478" y="135" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">+ price(): int</text><rect x="470" y="250" width="150" height="84" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><rect x="470" y="250" width="150" height="28" fill="#e8f2ff" stroke="#1d1d1f" stroke-width="1.5"/><text x="545.0" y="269" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">도서</text><line x1="470" y1="306" x2="620" y2="306" stroke="#1d1d1f" stroke-width="1.5"/><text x="478" y="297" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">- isbn: String</text><text x="478" y="325" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">+ getPrice(): int</text><rect x="250" y="250" width="170" height="84" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><rect x="250" y="250" width="170" height="28" fill="#e8f2ff" stroke="#1d1d1f" stroke-width="1.5"/><text x="335.0" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">«abstract»</text><text x="335.0" y="269" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">상품</text><line x1="250" y1="306" x2="420" y2="306" stroke="#1d1d1f" stroke-width="1.5"/><text x="258" y="297" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f"># price: int</text><text x="258" y="325" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">+ getPrice(): int</text><line x1="200" y1="100" x2="250" y2="100" stroke="#1d1d1f" stroke-width="1.5"/><text x="208" y="94" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">1</text><text x="242" y="94" text-anchor="end" font-size="12" font-weight="400" fill="#1d1d1f">0..*</text><line x1="420" y1="100" x2="470" y2="100" stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#diaf)"/><text x="462" y="94" text-anchor="end" font-size="12" font-weight="400" fill="#1d1d1f">1..*</text><line x1="545" y1="148" x2="545" y2="250" stroke="#1d1d1f" stroke-width="1.5"/><text x="551" y="240" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">1</text><text x="551" y="166" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">*</text><line x1="470" y1="300" x2="422" y2="300" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#tri)"/><text x="30" y="362" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">- private  + public  # protected (가시성 표기)</text><text x="30" y="380" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">회원 1명은 주문 0개 이상, 주문은 주문 항목 1개 이상을 포함(◆)</text><text x="30" y="398" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">도서는 상품을 상속(▷)하는 일반화 관계</text></svg>
