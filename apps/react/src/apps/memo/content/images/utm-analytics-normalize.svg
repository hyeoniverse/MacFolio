<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>정규화 없이 저장하면 LinkedIn, linkedin, 공백이 섞인 값이 세 행으로 나뉘고, cleanUtm으로 공백 제거·소문자·공백을 하이픈으로 바꾸면 한 행으로 합쳐지는 비교</title>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="390" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">같은 출처를 다르게 적은 링크 세 개</text>
<g font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f">
<text x="24" y="66">?utm_source=LinkedIn</text>
<text x="24" y="88">?utm_source=linkedin</text>
<text x="24" y="110">?utm_source=%20linkedin%20</text>
</g>
<text x="250" y="110" font-size="12" fill="#6e6e73">(%20은 공백 한 칸)</text>
<rect x="24" y="130" width="280" height="132" rx="10" fill="#ffffff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="40" y="154" font-size="13" font-weight="700" fill="#ff3b30">그대로 집계</text>
<g font-size="12" fill="#1d1d1f">
<text x="40" y="182" font-family="SFMono-Regular, Menlo, monospace">LinkedIn</text><text x="288" y="182" text-anchor="end">1</text>
<text x="40" y="206" font-family="SFMono-Regular, Menlo, monospace">linkedin</text><text x="288" y="206" text-anchor="end">1</text>
<text x="40" y="230" font-family="SFMono-Regular, Menlo, monospace">" linkedin "</text><text x="288" y="230" text-anchor="end">1</text>
</g>
<text x="40" y="252" font-size="12" fill="#6e6e73">세 행으로 나뉜다</text>
<rect x="336" y="130" width="280" height="132" rx="10" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="352" y="154" font-size="13" font-weight="700" fill="#34c759">cleanUtm 뒤 집계</text>
<g font-size="12" fill="#1d1d1f">
<text x="352" y="182" font-family="SFMono-Regular, Menlo, monospace">linkedin</text><text x="600" y="182" text-anchor="end">3</text>
</g>
<text x="352" y="252" font-size="12" fill="#6e6e73">한 행으로 합쳐진다</text>
<line x1="24" y1="278" x2="616" y2="278" stroke="#d1d1d6"/>
<text x="24" y="302" font-size="12" font-weight="700" fill="#6e6e73">cleanUtm 단계</text>
<rect x="24" y="314" width="136" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="92.0" y="334" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f" text-anchor="middle">" LinkedIn Post "</text>
<text x="92.0" y="364" font-size="12" fill="#6e6e73" text-anchor="middle">입력값</text>
<line x1="162" y1="329" x2="174" y2="329" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<rect x="176" y="314" width="136" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="244.0" y="334" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f" text-anchor="middle">"LinkedIn Post"</text>
<text x="244.0" y="364" font-size="12" fill="#6e6e73" text-anchor="middle">1. 앞뒤 공백 제거</text>
<line x1="314" y1="329" x2="326" y2="329" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<rect x="328" y="314" width="136" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="396.0" y="334" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f" text-anchor="middle">"linkedin post"</text>
<text x="396.0" y="364" font-size="12" fill="#6e6e73" text-anchor="middle">2. 소문자로</text>
<line x1="466" y1="329" x2="478" y2="329" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
<rect x="480" y="314" width="136" height="30" rx="6" fill="#f2f2f7" stroke="#34c759"/>
<text x="548.0" y="334" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f" text-anchor="middle">"linkedin-post"</text>
<text x="548.0" y="364" font-size="12" fill="#6e6e73" text-anchor="middle">3. 공백을 -로</text>
<text x="24" y="384" font-size="12" fill="#6e6e73">마지막으로 100자(UTM_MAX)까지만 남기고, 빈 문자열이면 값 없음(undefined)으로 처리한다.</text>
</svg>
