<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>adminStore가 client의 onUnauthorized에 핸들러를 등록한다. 어떤 요청이든 401을 받으면 client가 핸들러를 부르고, adminStore는 /auth/me로 다시 물어 로그아웃 상태로 바뀐다. import는 adminStore에서 client로 한 방향뿐이다</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="800" height="240" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">401은 한 곳에서: import는 한 방향</text>
<rect x="40" y="80" width="180" height="60" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="130" y="105" font-size="11.5" fill="#1f2937" text-anchor="middle">postsApi · filesApi …</text>
<text x="130" y="123" font-size="10.5" fill="#6b7280" text-anchor="middle">api(path, options)</text>
<rect x="300" y="80" width="200" height="60" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="400" y="105" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">shared/api/client.ts</text>
<text x="400" y="123" font-size="10.5" fill="#6b7280" text-anchor="middle">핸들러 집합만 안다</text>
<rect x="580" y="80" width="180" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="670" y="105" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">adminStore</text>
<text x="670" y="123" font-size="10.5" fill="#6b7280" text-anchor="middle">refreshAdmin() → /auth/me</text>
<path d="M222 110 H298" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M578 100 H502" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="540" y="92" font-size="10" fill="#4338ca" text-anchor="middle">import · 등록</text>
<path d="M502 124 H578" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="540" y="142" font-size="10" fill="#047857" text-anchor="middle">401이면 호출</text>
<text x="40" y="186" font-size="10.5" fill="#374151">client가 adminStore를 import하면 adminStore → client → adminStore 순환이 생긴다.</text>
<text x="40" y="204" font-size="10.5" fill="#374151">그래서 client는 onUnauthorized(handler)로 받은 함수만 들고 있다.</text>
</svg>
