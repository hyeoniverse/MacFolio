<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>쌓임 맥락 안의 z-index는 바깥 요소와 비교되지 않는다</title>
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="30" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">z-index 9999가 z-index 2 아래에 그려지는 경우</text>

  <!-- 왼쪽: 구조 -->
  <text x="20" y="62" font-size="13" font-weight="700" fill="#6e6e73">DOM 구조</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">
    <rect x="20" y="72" width="270" height="150" rx="10" fill="#f2f2f7"/>
    <text x="32" y="96">&lt;body&gt;</text>
    <text x="48" y="120" fill="#0a84ff">&lt;div A&gt; z-index: 1</text>
    <text x="64" y="144" fill="#ff3b30">&lt;div 메뉴&gt; z-index: 9999</text>
    <text x="48" y="168" fill="#0a84ff">&lt;/div&gt;</text>
    <text x="48" y="192" fill="#ff9f0a">&lt;div B&gt; z-index: 2</text>
  </g>

  <!-- 오른쪽: 그려지는 모습 -->
  <text x="320" y="62" font-size="13" font-weight="700" fill="#6e6e73">화면에서 겹치는 순서</text>
  <rect x="330" y="80" width="190" height="130" rx="10" fill="#0a84ff" fill-opacity="0.15" stroke="#0a84ff"/>
  <text x="342" y="100" font-size="12" fill="#0a84ff">A (z 1, 쌓임 맥락)</text>
  <rect x="350" y="112" width="150" height="80" rx="8" fill="#ff3b30" fill-opacity="0.2" stroke="#ff3b30"/>
  <text x="362" y="132" font-size="12" fill="#ff3b30">메뉴 (z 9999)</text>
  <rect x="430" y="140" width="190" height="90" rx="10" fill="#ff9f0a" fill-opacity="0.9" stroke="#ff9f0a"/>
  <text x="525" y="190" font-size="13" fill="#1d1d1f" text-anchor="middle">B (z 2)가 위</text>

  <rect x="20" y="240" width="600" height="66" rx="10" fill="#f2f2f7"/>
  <text x="36" y="264" font-size="13" fill="#1d1d1f">메뉴의 9999는 A 안에서만 비교된다. 바깥에서는 A 전체가 z 1로 B(2)와 비교된다.</text>
  <text x="36" y="288" font-size="13" fill="#1d1d1f">화면 전체에서 겹치는 요소의 값만 --z-* 목록 하나로 관리하는 이유다.</text>
</svg>
