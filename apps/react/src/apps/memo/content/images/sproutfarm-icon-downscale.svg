<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>10칸을 6픽셀로 축소할 때 최근접 이웃과 면적 평균의 결과</title>
<rect width="640" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">선 3개가 있는 10칸을 6픽셀로 축소하기</text>
<text x="24" y="56" font-size="12" fill="#6e6e73">출력 1픽셀이 원본 1.67칸을 덮는다. 굵기 1칸인 선이 출력 픽셀보다 가늘어진다</text>
<text x="24" y="98" font-size="13" font-weight="600" fill="#1d1d1f">원본 10칸</text>
<rect x="140" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="162.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">0</text>
<rect x="185" y="76" width="45" height="36" fill="#1d1d1f" stroke="#c7c7cc"/>
<text x="207.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">1</text>
<rect x="230" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="252.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">2</text>
<rect x="275" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="297.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">3</text>
<rect x="320" y="76" width="45" height="36" fill="#1d1d1f" stroke="#c7c7cc"/>
<text x="342.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">4</text>
<rect x="365" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="387.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">5</text>
<rect x="410" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="432.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">6</text>
<rect x="455" y="76" width="45" height="36" fill="#1d1d1f" stroke="#c7c7cc"/>
<text x="477.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">7</text>
<rect x="500" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="522.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">8</text>
<rect x="545" y="76" width="45" height="36" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="567.5" y="128" font-size="12" text-anchor="middle" fill="#6e6e73">9</text>
<text x="24" y="190" font-size="13" font-weight="600" fill="#1d1d1f">최근접 이웃</text>
<text x="24" y="208" font-size="12" fill="#6e6e73">한 칸만 골라 복사</text>
<rect x="140" y="168" width="75" height="40" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="177.5" y="226" font-size="12" text-anchor="middle" fill="#6e6e73">0번 칸</text>
<rect x="215" y="168" width="75" height="40" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="252.5" y="226" font-size="12" text-anchor="middle" fill="#6e6e73">2번 칸</text>
<rect x="290" y="168" width="75" height="40" fill="#1d1d1f" stroke="#c7c7cc"/>
<text x="327.5" y="226" font-size="12" text-anchor="middle" fill="#6e6e73">4번 칸</text>
<rect x="365" y="168" width="75" height="40" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="402.5" y="226" font-size="12" text-anchor="middle" fill="#6e6e73">5번 칸</text>
<rect x="440" y="168" width="75" height="40" fill="#1d1d1f" stroke="#c7c7cc"/>
<text x="477.5" y="226" font-size="12" text-anchor="middle" fill="#6e6e73">7번 칸</text>
<rect x="515" y="168" width="75" height="40" fill="#f2f2f7" stroke="#c7c7cc"/>
<text x="552.5" y="226" font-size="12" text-anchor="middle" fill="#6e6e73">9번 칸</text>
<text x="140" y="250" font-size="12" fill="#ff3b30">1번 칸의 선은 어느 출력 픽셀에도 선택되지 않아 사라진다</text>
<text x="24" y="296" font-size="13" font-weight="600" fill="#1d1d1f">면적 평균</text>
<text x="24" y="314" font-size="12" fill="#6e6e73">덮는 칸을 섞기</text>
<rect x="140" y="274" width="75" height="40" fill="rgb(157,157,162)" stroke="#c7c7cc"/>
<text x="177.5" y="332" font-size="12" text-anchor="middle" fill="#6e6e73">검정 40%</text>
<rect x="215" y="274" width="75" height="40" fill="rgb(199,199,204)" stroke="#c7c7cc"/>
<text x="252.5" y="332" font-size="12" text-anchor="middle" fill="#6e6e73">검정 20%</text>
<rect x="290" y="274" width="75" height="40" fill="rgb(114,114,119)" stroke="#c7c7cc"/>
<text x="327.5" y="332" font-size="12" text-anchor="middle" fill="#6e6e73">검정 60%</text>
<rect x="365" y="274" width="75" height="40" fill="rgb(242,242,247)" stroke="#c7c7cc"/>
<text x="402.5" y="332" font-size="12" text-anchor="middle" fill="#6e6e73">검정 0%</text>
<rect x="440" y="274" width="75" height="40" fill="rgb(114,114,119)" stroke="#c7c7cc"/>
<text x="477.5" y="332" font-size="12" text-anchor="middle" fill="#6e6e73">검정 60%</text>
<rect x="515" y="274" width="75" height="40" fill="rgb(242,242,247)" stroke="#c7c7cc"/>
<text x="552.5" y="332" font-size="12" text-anchor="middle" fill="#6e6e73">검정 0%</text>
<text x="140" y="360" font-size="12" fill="#34c759">선 3개가 모두 회색으로 남는다. 작은 아이콘에서 형태가 유지된다</text>
</svg>