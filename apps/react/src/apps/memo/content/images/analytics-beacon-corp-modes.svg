<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>요청 모드에 따라 브라우저가 적용하는 검사: cors 모드는 CORS, no-cors 모드는 CORP</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6e6e73"/></marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">요청 모드에 따라 달라지는 응답 검사</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">다른 출처의 응답이 도착하면 브라우저는 요청 모드를 보고 어떤 헤더를 검사할지 정한다</text>

  <!-- 시작 -->
  <rect x="220" y="76" width="200" height="40" rx="8" fill="#f2f2f7"/>
  <text x="320" y="101" font-size="13" text-anchor="middle" fill="#1d1d1f">다른 출처의 응답 도착</text>
  <path d="M320 116 V134 H160 V150" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <path d="M320 134 H480 V150" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>

  <!-- cors 모드 -->
  <rect x="40" y="152" width="240" height="64" rx="8" fill="#e5f1ff" stroke="#0a84ff"/>
  <text x="160" y="176" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1f">cors 모드</text>
  <text x="160" y="198" font-size="12" text-anchor="middle" fill="#6e6e73">fetch(), XMLHttpRequest</text>
  <path d="M160 216 V236" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="40" y="238" width="240" height="64" rx="8" fill="#ffffff" stroke="#0a84ff"/>
  <text x="160" y="262" font-size="13" font-weight="600" text-anchor="middle" fill="#0a84ff">CORS 검사</text>
  <text x="160" y="284" font-size="12" text-anchor="middle" fill="#1d1d1f">Access-Control-Allow-Origin</text>
  <path d="M160 302 V322" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="40" y="324" width="240" height="56" rx="8" fill="#f2f2f7"/>
  <text x="160" y="346" font-size="12" text-anchor="middle" fill="#1d1d1f">통과하면 스크립트가</text>
  <text x="160" y="366" font-size="12" text-anchor="middle" fill="#1d1d1f">응답 본문을 읽는다</text>

  <!-- no-cors 모드 -->
  <rect x="360" y="152" width="240" height="64" rx="8" fill="#fff4e0" stroke="#ff9f0a"/>
  <text x="480" y="176" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1f">no-cors 모드</text>
  <text x="480" y="198" font-size="12" text-anchor="middle" fill="#6e6e73">&lt;img&gt;, &lt;script&gt;, text/plain sendBeacon</text>
  <path d="M480 216 V236" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="360" y="238" width="240" height="64" rx="8" fill="#ffffff" stroke="#ff9f0a"/>
  <text x="480" y="262" font-size="13" font-weight="600" text-anchor="middle" fill="#c27100">CORP 검사</text>
  <text x="480" y="284" font-size="12" text-anchor="middle" fill="#1d1d1f">Cross-Origin-Resource-Policy</text>
  <path d="M420 302 V322" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <path d="M540 302 V322" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="360" y="324" width="114" height="56" rx="8" fill="#e8f8ec"/>
  <text x="417" y="346" font-size="12" text-anchor="middle" fill="#1d1d1f">통과: 문서에</text>
  <text x="417" y="366" font-size="12" text-anchor="middle" fill="#1d1d1f">응답 전달</text>
  <rect x="486" y="324" width="114" height="56" rx="8" fill="#ffecea"/>
  <text x="543" y="346" font-size="12" text-anchor="middle" fill="#ff3b30">실패: 응답 취소</text>
  <text x="543" y="366" font-size="12" text-anchor="middle" fill="#ff3b30">콘솔 에러</text>

  <text x="24" y="412" font-size="12" fill="#1d1d1f">이번 문제: sendBeacon(text/plain)은 no-cors 모드라 오른쪽 경로를 따른다.</text>
  <text x="24" y="430" font-size="12" fill="#6e6e73">CORS 헤더(Access-Control-Allow-Origin)가 맞아도 CORP 값이 same-origin이면 Safari는 응답을 취소했다</text>
</svg>
