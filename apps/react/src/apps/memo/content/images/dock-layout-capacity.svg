<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>모든 화면 폭에서 어림셈이 실제보다 칸을 적게 셌다. 1920px에서 16칸 대 21칸</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="640" height="318" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">Dock에 들어가는 앱 칸 수</text>
<text x="32" y="56" font-size="11" fill="#6b7280">화면 폭마다 어림셈과 실제 치수로 센 값</text>
<text x="110" y="76" font-size="10.5" fill="#9ca3af">■ 어림셈 (w − 300) / 100</text><text x="300" y="76" font-size="10.5" fill="#4f46e5">■ 실제 치수 dockAppCapacity</text><text x="96" y="106" font-size="11.5" fill="#374151" text-anchor="end">768px</text><rect x="110" y="92" width="80" height="9" rx="2" fill="#c7c9d1"/><text x="196" y="100" font-size="10" fill="#6b7280">4</text><rect x="110" y="103" width="140" height="9" rx="2" fill="#4f46e5"/><text x="256" y="111" font-size="10" font-weight="600" fill="#1f2937">7</text><text x="96" y="138" font-size="11.5" fill="#374151" text-anchor="end">900px</text><rect x="110" y="124" width="120" height="9" rx="2" fill="#c7c9d1"/><text x="236" y="132" font-size="10" fill="#6b7280">6</text><rect x="110" y="135" width="160" height="9" rx="2" fill="#4f46e5"/><text x="276" y="143" font-size="10" font-weight="600" fill="#1f2937">8</text><text x="96" y="170" font-size="11.5" fill="#374151" text-anchor="end">1280px</text><rect x="110" y="156" width="180" height="9" rx="2" fill="#c7c9d1"/><text x="296" y="164" font-size="10" fill="#6b7280">9</text><rect x="110" y="167" width="260" height="9" rx="2" fill="#4f46e5"/><text x="376" y="175" font-size="10" font-weight="600" fill="#1f2937">13</text><text x="96" y="202" font-size="11.5" fill="#374151" text-anchor="end">1440px</text><rect x="110" y="188" width="220" height="9" rx="2" fill="#c7c9d1"/><text x="336" y="196" font-size="10" fill="#6b7280">11</text><rect x="110" y="199" width="300" height="9" rx="2" fill="#4f46e5"/><text x="416" y="207" font-size="10" font-weight="600" fill="#1f2937">15</text><text x="96" y="234" font-size="11.5" fill="#374151" text-anchor="end">1600px</text><rect x="110" y="220" width="260" height="9" rx="2" fill="#c7c9d1"/><text x="376" y="228" font-size="10" fill="#6b7280">13</text><rect x="110" y="231" width="340" height="9" rx="2" fill="#4f46e5"/><text x="456" y="239" font-size="10" font-weight="600" fill="#1f2937">17</text><text x="96" y="266" font-size="11.5" fill="#374151" text-anchor="end">1920px</text><rect x="110" y="252" width="320" height="9" rx="2" fill="#c7c9d1"/><text x="436" y="260" font-size="10" fill="#6b7280">16</text><rect x="110" y="263" width="420" height="9" rx="2" fill="#4f46e5"/><text x="536" y="271" font-size="10" font-weight="600" fill="#1f2937">21</text><text x="32" y="298" font-size="11" fill="#6b7280">실제 치수: 아이콘 64px(768px 이하 56px) + 간격 16px, 여백 16+16, 구분선 2px, Launchpad·휴지통 2칸</text>
</svg>
