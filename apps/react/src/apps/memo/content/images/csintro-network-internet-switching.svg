<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>회선 교환, 메시지 교환, 패킷 교환의 경로 사용 방식 비교</title>
<rect width="640" height="410" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="20" y="40" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">회선 교환</text>
<line x1="80" y1="95" x2="230" y2="65" stroke="#d1d1d6" stroke-width="2"/>
<line x1="80" y1="95" x2="230" y2="125" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="65" x2="380" y2="65" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="125" x2="380" y2="125" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="65" x2="380" y2="125" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="125" x2="380" y2="65" stroke="#d1d1d6" stroke-width="2"/>
<line x1="380" y1="65" x2="540" y2="95" stroke="#d1d1d6" stroke-width="2"/>
<line x1="380" y1="125" x2="540" y2="95" stroke="#d1d1d6" stroke-width="2"/>
<line x1="80" y1="95" x2="230" y2="65" stroke="#0a84ff" stroke-width="5"/>
<line x1="230" y1="65" x2="380" y2="65" stroke="#0a84ff" stroke-width="5"/>
<line x1="380" y1="65" x2="540" y2="95" stroke="#0a84ff" stroke-width="5"/>
<text x="310" y="152" font-size="12" fill="#0a84ff" text-anchor="middle">연결하는 동안 A와 B 사이 경로 하나를 전용으로 점유</text>
<circle cx="80" cy="95" r="11" fill="#1d1d1f"/>
<circle cx="230" cy="65" r="11" fill="#6e6e73"/>
<circle cx="230" cy="125" r="11" fill="#6e6e73"/>
<circle cx="380" cy="65" r="11" fill="#6e6e73"/>
<circle cx="380" cy="125" r="11" fill="#6e6e73"/>
<circle cx="540" cy="95" r="11" fill="#1d1d1f"/>
<text x="80" y="100" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
<text x="540" y="100" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
<text x="20" y="165" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">메시지 교환</text>
<line x1="80" y1="220" x2="230" y2="190" stroke="#d1d1d6" stroke-width="2"/>
<line x1="80" y1="220" x2="230" y2="250" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="190" x2="380" y2="190" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="250" x2="380" y2="250" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="190" x2="380" y2="250" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="250" x2="380" y2="190" stroke="#d1d1d6" stroke-width="2"/>
<line x1="380" y1="190" x2="540" y2="220" stroke="#d1d1d6" stroke-width="2"/>
<line x1="380" y1="250" x2="540" y2="220" stroke="#d1d1d6" stroke-width="2"/>
<rect x="250" y="163" width="70" height="24" rx="4" fill="#ff9f0a" stroke="none"/>
<text x="285" y="180" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">메시지 전체</text>
<text x="310" y="277" font-size="12" fill="#ff9f0a" text-anchor="middle">메시지 전체를 교환기에 저장한 뒤 다음 교환기로 전달</text>
<circle cx="80" cy="220" r="11" fill="#1d1d1f"/>
<circle cx="230" cy="190" r="11" fill="#6e6e73"/>
<circle cx="230" cy="250" r="11" fill="#6e6e73"/>
<circle cx="380" cy="190" r="11" fill="#6e6e73"/>
<circle cx="380" cy="250" r="11" fill="#6e6e73"/>
<circle cx="540" cy="220" r="11" fill="#1d1d1f"/>
<text x="80" y="225" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
<text x="540" y="225" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
<text x="20" y="290" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">패킷 교환</text>
<line x1="80" y1="345" x2="230" y2="315" stroke="#d1d1d6" stroke-width="2"/>
<line x1="80" y1="345" x2="230" y2="375" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="315" x2="380" y2="315" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="375" x2="380" y2="375" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="315" x2="380" y2="375" stroke="#d1d1d6" stroke-width="2"/>
<line x1="230" y1="375" x2="380" y2="315" stroke="#d1d1d6" stroke-width="2"/>
<line x1="380" y1="315" x2="540" y2="345" stroke="#d1d1d6" stroke-width="2"/>
<line x1="380" y1="375" x2="540" y2="345" stroke="#d1d1d6" stroke-width="2"/>
<rect x="142" y="319" width="26" height="22" rx="4" fill="#0a84ff" stroke="none"/>
<text x="155" y="335" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<rect x="292" y="304" width="26" height="22" rx="4" fill="#0a84ff" stroke="none"/>
<text x="305" y="320" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<rect x="292" y="364" width="26" height="22" rx="4" fill="#34c759" stroke="none"/>
<text x="305" y="380" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<rect x="447" y="349" width="26" height="22" rx="4" fill="#34c759" stroke="none"/>
<text x="460" y="365" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="310" y="402" font-size="12" fill="#34c759" text-anchor="middle">패킷마다 경로를 따로 정하고, 받는 쪽에서 순서대로 재조립</text>
<circle cx="80" cy="345" r="11" fill="#1d1d1f"/>
<circle cx="230" cy="315" r="11" fill="#6e6e73"/>
<circle cx="230" cy="375" r="11" fill="#6e6e73"/>
<circle cx="380" cy="315" r="11" fill="#6e6e73"/>
<circle cx="380" cy="375" r="11" fill="#6e6e73"/>
<circle cx="540" cy="345" r="11" fill="#1d1d1f"/>
<text x="80" y="350" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
<text x="540" y="350" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
</svg>
