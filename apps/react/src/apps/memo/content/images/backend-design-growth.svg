<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>이 글을 쓴 날(10/03)과 지금(10/19)</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="270" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">이 글을 쓴 날(10/03)과 지금(10/19)</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">같은 구조 위에 기능이 붙었다. 숫자는 코드에서 셌다</text>
<text x="32" y="96" font-size="12" fill="#374151" text-anchor="start">기능 모듈 (10/03)</text>
<rect x="182" y="83" width="275.0" height="20" rx="4" fill="#374151"/>
<text x="465.0" y="98" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">11</text>
<text x="32" y="132" font-size="12" fill="#374151" text-anchor="start">기능 모듈 (지금)</text>
<rect x="182" y="119" width="600.0" height="20" rx="4" fill="#4f46e5"/>
<text x="790.0" y="134" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">24</text>
<text x="32" y="176" font-size="12" fill="#374151" text-anchor="start">API 시험 (10/03)</text>
<rect x="182" y="163" width="233.0" height="20" rx="4" fill="#374151"/>
<text x="423.0097087378641" y="178" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">120</text>
<text x="32" y="212" font-size="12" fill="#374151" text-anchor="start">API 시험 (지금)</text>
<rect x="182" y="199" width="600.0" height="20" rx="4" fill="#4f46e5"/>
<text x="790.0" y="214" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">309</text>
<text x="32" y="252" font-size="11" fill="#6b7280" text-anchor="start">10/03 숫자는 이 글 본문의 &quot;11개&quot;, &quot;120개가 넘는다&quot;. 지금 시험 = e2e 131 + 단위 178</text>
</svg>
