<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>회색 동그라미와 사람 아이콘을 아래에 깔고 사진은 투명하게 위에 둔다. 받는 중에는 아이콘이 보이고, onLoad가 오면 data-loaded로 사진이 나타나며, 받지 못하면 아이콘이 그대로 남는다</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="860" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">GitHubAvatar의 세 상태: 같은 동그라미에 겹친 두 층</text>
<circle cx="150" cy="112" r="40" fill="#b8b8be"/>
<circle cx="150" cy="102" r="11" fill="#ffffff"/><path d="M132 132 Q150 110 168 132 Z" fill="#ffffff"/>
<text x="150" y="190" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">받는 중</text>
<text x="150" y="210" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="middle">&lt;img&gt; opacity 0</text>
<text x="150" y="228" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">아이콘이 보인다</text>
<circle cx="430" cy="112" r="40" fill="#b8b8be"/>
<circle cx="430" cy="112" r="40" fill="#6366f1"/>
<text x="430" y="118" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">사진</text>
<text x="430" y="190" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">다 받음</text>
<text x="430" y="210" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="middle">data-loaded → opacity 1</text>
<text x="430" y="228" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">사진이 덮는다</text>
<circle cx="710" cy="112" r="40" fill="#b8b8be"/>
<circle cx="710" cy="102" r="11" fill="#ffffff"/><path d="M692 132 Q710 110 728 132 Z" fill="#ffffff"/>
<text x="710" y="190" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">받지 못함</text>
<text x="710" y="210" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="middle">onLoad가 오지 않는다</text>
<text x="710" y="228" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">아이콘이 남는다 (깨진 표시 없음)</text>
<path d="M196 112 L384 112" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#good)"/>
<text x="290.0" y="106.0" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">onLoad</text>
<path d="M150 166 L150 172 L710 172 L710 168" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#warn)"/>
<text x="560" y="166" font-size="10" font-weight="500" fill="#92400e" text-anchor="middle">오류·차단 (load 없음)</text>
<text x="32" y="272" font-size="10.5" font-weight="500" fill="#374151" text-anchor="start">캐시에서 바로 온 사진은 React가 그리기 전에 load가 끝나 이벤트를 놓친다 → 처음 그린 직후 complete &amp;&amp; naturalWidth &gt; 0을 한 번 본다.</text>
</svg>
