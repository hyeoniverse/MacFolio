<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"><title>프로젝트 페이지 템플릿 수의 변화: 7, 8, 12, 13, 4, 9</title><rect width="880" height="300" rx="16" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#1f2937">템플릿 수가 바뀌어 온 길</text><text x="28" y="56" font-size="10.5" fill="#6b7280">진한 막대: 공통 내용 모델(landingOf) 위의 템플릿. 직접 짠 페이지(custom)는 세지 않았다.</text><rect x="66" y="156" width="40" height="84" rx="4" fill="#a5b4fc"/><text x="86" y="150" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">7</text><text x="86" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">처음</text><text x="86" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">프로젝트마다 짠 모양</text><rect x="188" y="144" width="40" height="96" rx="4" fill="#a5b4fc"/><text x="208" y="138" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">8</text><text x="208" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">+ 기본(카드)</text><text x="208" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">showcase를 더함</text><rect x="310" y="96" width="40" height="144" rx="4" fill="#a5b4fc"/><text x="330" y="90" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">12</text><text x="330" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">다시 짜기</text><text x="330" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">읽는 방식이 다른 12</text><rect x="432" y="84" width="40" height="156" rx="4" fill="#a5b4fc"/><text x="452" y="78" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">13</text><text x="452" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">랜딩 키트</text><text x="452" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">기기 틀·벤토·CTA</text><rect x="554" y="192" width="40" height="48" rx="4" fill="#4f46e5"/><text x="574" y="186" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">4</text><text x="574" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">공통 내용 모델</text><text x="574" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">제품·카드·문서·벤토</text><rect x="676" y="132" width="40" height="108" rx="4" fill="#4f46e5"/><text x="696" y="126" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">9</text><text x="696" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">더하기</text><text x="696" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">+키노트·매거진 등</text><rect x="798" y="132" width="40" height="108" rx="4" fill="#4f46e5"/><text x="818" y="126" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">9</text><text x="818" y="260" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">RPG 분리</text><text x="818" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">대화창은 다른 브랜치로</text></svg>