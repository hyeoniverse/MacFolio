<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">헤더를 누가 채우는가: 일반 UDP 소켓과 원시 소켓</text>
  <!-- legend -->
  <rect x="150" y="42" width="14" height="14" fill="#e8f2ff" stroke="#0a84ff"/><text x="170" y="54" font-size="12" fill="#1d1d1f">응용 프로그램이 채움</text>
  <rect x="330" y="42" width="14" height="14" fill="#f2f2f7" stroke="#6e6e73"/><text x="350" y="54" font-size="12" fill="#1d1d1f">커널이 채움</text>
  <!-- row 1 -->
  <text x="20" y="98" font-size="13" font-weight="600" fill="#1d1d1f">SOCK_DGRAM</text>
  <text x="20" y="116" font-size="12" fill="#6e6e73">sendto()</text>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="140" y="80" width="110" height="44" fill="#f2f2f7" stroke="#6e6e73"/><text x="195" y="100">이더넷 헤더</text><text x="195" y="116" fill="#6e6e73">MAC 주소</text>
    <rect x="250" y="80" width="140" height="44" fill="#f2f2f7" stroke="#6e6e73"/><text x="320" y="100">IP 헤더</text><text x="320" y="116" fill="#6e6e73">출발지 = 자기 주소</text>
    <rect x="390" y="80" width="100" height="44" fill="#f2f2f7" stroke="#6e6e73"/><text x="440" y="100">UDP 헤더</text><text x="440" y="116" fill="#6e6e73">포트·체크섬</text>
    <rect x="490" y="80" width="130" height="44" fill="#e8f2ff" stroke="#0a84ff"/><text x="555" y="106">페이로드</text>
  </g>
  <text x="140" y="146" font-size="12" fill="#1d1d1f">응용은 페이로드와 목적지만 넘긴다. 출발지 IP는 커널이 인터페이스 주소로 채운다.</text>
  <!-- row 2 -->
  <text x="20" y="198" font-size="13" font-weight="600" fill="#1d1d1f">SOCK_RAW</text>
  <text x="20" y="216" font-size="12" fill="#6e6e73">+ IP_HDRINCL</text>
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="140" y="180" width="110" height="44" fill="#f2f2f7" stroke="#6e6e73"/><text x="195" y="200">이더넷 헤더</text><text x="195" y="216" fill="#6e6e73">MAC 주소</text>
    <rect x="250" y="180" width="140" height="44" fill="#e8f2ff" stroke="#0a84ff"/><text x="320" y="200">IP 헤더</text><text x="320" y="216" fill="#ff3b30">출발지 = 임의 값</text>
    <rect x="390" y="180" width="100" height="44" fill="#e8f2ff" stroke="#0a84ff"/><text x="440" y="200">UDP 헤더</text><text x="440" y="216" fill="#6e6e73">직접 계산</text>
    <rect x="490" y="180" width="130" height="44" fill="#e8f2ff" stroke="#0a84ff"/><text x="555" y="206">페이로드</text>
  </g>
  <text x="140" y="246" font-size="12" fill="#1d1d1f">응용이 IP 헤더부터 직접 만든다. 출발지 필드에 192.0.2.1을 쓰면 그대로 나간다.</text>
  <rect x="20" y="268" width="600" height="48" rx="8" fill="#ff3b30" fill-opacity="0.08" stroke="#ff3b30"/>
  <text x="34" y="288" font-size="12" fill="#1d1d1f">원시 소켓은 root 권한(리눅스는 CAP_NET_RAW)이 있어야 열린다.</text>
  <text x="34" y="306" font-size="12" fill="#1d1d1f">경계 라우터가 출발지 검증(BCP 38)을 수행하면 위조된 출발지의 패킷은 폐기된다.</text>
</svg>
