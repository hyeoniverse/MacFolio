<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>ref 객체와 ref 콜백이 요소 교체를 알리는 방식</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<text x="24" y="32" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="600">요소가 칸 A에서 칸 B로 바뀔 때</text>
<text x="24" y="54" font-size="12" fill="#6e6e73" text-anchor="start">ref 객체는 값만 바뀌고, ref 콜백은 state를 바꿔 다시 렌더링을 일으킨다</text>
<rect x="24" y="72" width="286" height="334" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/>
<text x="38" y="98" font-size="14" fill="#ff3b30" text-anchor="start" font-weight="600">ref 객체 (수정 전)</text>
<rect x="38" y="114" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="48" y="139" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">const ref = useRef(null)</text>
<line x1="167" y1="154" x2="167" y2="166" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="38" y="168" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="48" y="193" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">&lt;div ref={ref}&gt;</text>
<line x1="167" y1="208" x2="167" y2="220" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="38" y="222" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="48" y="247" font-size="13" fill="#1d1d1f" text-anchor="start">React가 ref.current = 칸 B로 바꾼다</text>
<line x1="167" y1="262" x2="167" y2="274" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="38" y="276" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="48" y="301" font-size="13" fill="#1d1d1f" text-anchor="start">값만 바뀌고 다시 렌더링하지 않는다</text>
<line x1="167" y1="316" x2="167" y2="332" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="38" y="334" width="258" height="52" rx="6" fill="#ffffff" stroke="#ff3b30" stroke-width="1.6"/>
<text x="48" y="356" font-size="12" fill="#1d1d1f" text-anchor="start">effect 의존성 [ref]: 같은 객체</text>
<text x="48" y="375" font-size="12" fill="#ff3b30" text-anchor="start" font-weight="600">→ effect 재실행 없음, 칸 A를 계속 관찰</text>
<rect x="330" y="72" width="286" height="334" rx="6" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/>
<text x="344" y="98" font-size="14" fill="#34c759" text-anchor="start" font-weight="600">ref 콜백 (수정 후)</text>
<rect x="344" y="114" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="354" y="139" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">const [element, setElement]</text>
<line x1="473" y1="154" x2="473" y2="166" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="344" y="168" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="354" y="193" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">&lt;div ref={attach}&gt;</text>
<line x1="473" y1="208" x2="473" y2="220" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="344" y="222" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="354" y="247" font-size="13" fill="#1d1d1f" text-anchor="start">React가 attach(칸 B)를 호출한다</text>
<line x1="473" y1="262" x2="473" y2="274" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="344" y="276" width="258" height="40" rx="6" fill="#f2f2f7" stroke="none" stroke-width="1.2"/>
<text x="354" y="301" font-size="13" fill="#1d1d1f" text-anchor="start">setElement(칸 B) → 다시 렌더링</text>
<line x1="473" y1="316" x2="473" y2="332" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="344" y="334" width="258" height="52" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.6"/>
<text x="354" y="356" font-size="12" fill="#1d1d1f" text-anchor="start">effect 의존성 [element]: 값이 바뀜</text>
<text x="354" y="375" font-size="12" fill="#34c759" text-anchor="start" font-weight="600">→ effect 재실행, 칸 B를 관찰</text>
</svg>
