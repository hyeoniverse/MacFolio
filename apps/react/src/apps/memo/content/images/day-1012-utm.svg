<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>UTM 매개변수가 붙은 링크가 유입 경로로 집계되는 과정</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">UTM 매개변수로 지원처별 방문을 구분하는 과정</text>
<rect x="20" y="50" width="600" height="40" rx="8" fill="#f2f2f7"/>
<text x="34" y="75" font-size="12" fill="#1d1d1f">https://macfolio.hyeoniverse.com/?<tspan fill="#0a84ff">utm_source=회사A</tspan>&amp;<tspan fill="#ff9f0a">utm_medium=resume</tspan>&amp;<tspan fill="#34c759">utm_campaign=공고X</tspan></text>
<rect x="20" y="120" width="170" height="56" rx="8" fill="#ffffff" stroke="#6e6e73"/><text x="105" y="143" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">1. 지원서의 링크</text><text x="105" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">검토자가 클릭</text>
<rect x="235" y="120" width="170" height="56" rx="8" fill="#ffffff" stroke="#6e6e73"/><text x="320" y="143" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">2. 첫 화면</text><text x="320" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">주소의 utm_* 값을 읽어 전송</text>
<rect x="450" y="120" width="170" height="56" rx="8" fill="#eef5ff" stroke="#0a84ff"/><text x="535" y="143" font-size="13" font-weight="600" fill="#0a84ff" text-anchor="middle">3. 트래픽 분석 API</text><text x="535" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">출처·매체·캠페인별 집계</text>
<path d="M190 148 H231" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><path d="M405 148 H446" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="210" font-size="13" font-weight="600" fill="#1d1d1f">관리자의 활동 상태 보기 (예시)</text>
<rect x="20" y="222" width="600" height="64" rx="8" fill="#f2f2f7"/>
<g font-size="12" fill="#1d1d1f">
<text x="36" y="246">회사A / resume / 공고X</text><rect x="260" y="236" width="180" height="12" rx="3" fill="#0a84ff"/><text x="450" y="246">방문 3</text>
<text x="36" y="272">회사B / resume / 공고Y</text><rect x="260" y="262" width="60" height="12" rx="3" fill="#0a84ff"/><text x="330" y="272">방문 1</text>
</g>
</svg>
