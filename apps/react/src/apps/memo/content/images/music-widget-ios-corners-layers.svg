<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>음악 위젯의 층. 위젯 판이 둥글게 자르고, 그 안의 흐린 앨범 표지는 filter 때문에 따로 된 층으로 그려진다. 아이폰 Safari는 그 층을 네모로만 잘라 꼭짓점이 각져 보였다. clip-path로 둥근 모양을 한 번 더 자른다</title>
<rect width="860" height="380" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">흐린 배경이 둥근 자르기를 빠져나간다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">filter가 걸린 ::before는 따로 된 층이 된다. 둥근 모서리 자르기가 그 층까지 가지 않으면 네모로만 잘린다</text>
<text x="202" y="92" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">아이폰 Safari (고치기 전)</text>
<rect x="52" y="110" width="300" height="200" rx="6" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="62" y="126" font-size="10" fill="#4b5563">::before (앨범 표지, blur, inset -30px). 위젯 밖은 잘려 안 보인다</text>
<rect x="82" y="140" width="240" height="140" fill="#4a3a55"/>
<rect x="82" y="140" width="240" height="140" rx="22" fill="none" stroke="#f9fafb" stroke-dasharray="4 3" stroke-width="1.5"/>
<rect x="100" y="168" width="70" height="70" rx="8" fill="#9fc6c9"/>
<text x="184" y="185" font-size="10.5" fill="#e5e7eb">지금 재생 중</text>
<text x="184" y="203" font-size="13" fill="#ffffff" font-weight="700">Inochi No Namae</text>
<rect x="184" y="222" width="118" height="4" rx="2" fill="#d1d5db" opacity="0.7"/>
<text x="620" y="92" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">clip-path로 한 번 더 자른 뒤</text>
<rect x="470" y="110" width="300" height="200" rx="6" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="480" y="126" font-size="10" fill="#4b5563">::before (앨범 표지, blur, inset -30px). 위젯 밖은 잘려 안 보인다</text>
<rect x="500" y="140" width="240" height="140" rx="22" fill="#4a3a55"/>
<rect x="518" y="168" width="70" height="70" rx="8" fill="#9fc6c9"/>
<text x="602" y="185" font-size="10.5" fill="#e5e7eb">지금 재생 중</text>
<text x="602" y="203" font-size="13" fill="#ffffff" font-weight="700">Inochi No Namae</text>
<rect x="602" y="222" width="118" height="4" rx="2" fill="#d1d5db" opacity="0.7"/>
<text x="202" y="300" font-size="10.5" fill="#b91c1c" text-anchor="middle">점선이 원래 둥근 모양. 흐린 층이 네모로 남는다</text>
<text x="620" y="300" font-size="10.5" fill="#15803d" text-anchor="middle">clip-path: inset(0 round var(--radius-window))</text>
<text x="32" y="350" font-size="10.5" fill="#6b7280">맥 Safari와 Playwright WebKit(헤드리스)에서는 고치기 전에도 둥글게 나왔다. 같은 WebKit이라도 그리는 방식이 달라서다</text>
</svg>
