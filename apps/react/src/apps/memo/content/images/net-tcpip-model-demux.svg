<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="380" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">역다중화: 헤더의 식별자 세 개로 받을 프로그램을 찾는다</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <rect x="200" y="46" width="200" height="34" rx="6" fill="#f2f2f7" stroke="#1d1d1f"/>
    <text x="300" y="68">수신한 이더넷 프레임</text>
    <rect x="170" y="130" width="100" height="34" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="220" y="152">IP</text>
    <rect x="380" y="130" width="100" height="34" rx="6" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="430" y="152">ARP</text>
    <rect x="40" y="220" width="90" height="34" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="85" y="242">ICMP</text>
    <rect x="175" y="220" width="90" height="34" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="220" y="242">TCP</text>
    <rect x="310" y="220" width="90" height="34" rx="6" fill="#e5f1ff" stroke="#0a84ff"/>
    <text x="355" y="242">UDP</text>
    <rect x="110" y="310" width="100" height="34" rx="6" fill="#eaf8ee" stroke="#34c759"/>
    <text x="160" y="332">웹 서버</text>
    <rect x="230" y="310" width="100" height="34" rx="6" fill="#eaf8ee" stroke="#34c759"/>
    <text x="280" y="332">SSH 서버</text>
    <rect x="350" y="310" width="100" height="34" rx="6" fill="#eaf8ee" stroke="#34c759"/>
    <text x="400" y="332">DNS 서버</text>
  </g>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="270" y1="80" x2="228" y2="128"/>
    <line x1="330" y1="80" x2="420" y2="128"/>
    <line x1="200" y1="164" x2="100" y2="218"/>
    <line x1="220" y1="164" x2="220" y2="218"/>
    <line x1="240" y1="164" x2="340" y2="218"/>
    <line x1="210" y1="254" x2="170" y2="308"/>
    <line x1="232" y1="254" x2="270" y2="308"/>
    <line x1="362" y1="254" x2="392" y2="308"/>
  </g>
  <g font-size="12" fill="#0a84ff" font-family="Menlo, monospace">
    <text x="196" y="104" text-anchor="end">0x0800</text>
    <text x="392" y="104">0x0806</text>
    <text x="130" y="190" text-anchor="end">1</text>
    <text x="226" y="194">6</text>
    <text x="300" y="190">17</text>
    <text x="172" y="284" text-anchor="end">80</text>
    <text x="258" y="284">22</text>
    <text x="384" y="284">53</text>
  </g>
  <g font-size="12" fill="#6e6e73" text-anchor="end">
    <text x="630" y="72">이더넷 헤더의 프레임 유형(type, 16비트)</text>
    <text x="630" y="190">IP 헤더의 프로토콜(protocol, 8비트)</text>
    <text x="630" y="280">TCP·UDP 헤더의 목적지 포트(16비트)</text>
  </g>
