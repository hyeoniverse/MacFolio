<text x="160" y="295" text-anchor="middle" font-size="13" fill="#1d1d1f">평균 65점, 모든 과목 40점 이상</text><text x="480" y="295" text-anchor="middle" font-size="13" fill="#1d1d1f">평균 72점이지만 3과목이 40점 미만</text>
