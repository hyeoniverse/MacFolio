<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>필기 합격 기준: 평균과 과락</title><rect width="640" height="320" fill="#fff"/>
