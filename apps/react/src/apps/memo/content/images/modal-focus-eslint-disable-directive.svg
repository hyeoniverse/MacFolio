<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 250" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>eslint-disable 지시문의 구성</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9f0a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="250" fill="#ffffff"/>
<text x="24" y="30" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="700">규칙 비활성화 지시문과 이유를 한 줄에 적는 형식</text>
<rect x="24" y="60" width="216" height="40" rx="4" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="32" y="85" font-size="12" fill="#1d1d1f" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">// eslint-disable-next-line</text>
<line x1="134.0" y1="104" x2="134.0" y2="124" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="134.0" y="144" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="700">지시문</text>
<text x="134.0" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">바로 다음 줄에만 적용</text>
<rect x="244" y="60" width="226" height="40" rx="4" fill="#f2f2f7" stroke="#0a84ff" stroke-width="1.2"/>
<text x="252" y="85" font-size="12" fill="#0a84ff" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">react-hooks/exhaustive-deps</text>
<line x1="359.0" y1="104" x2="359.0" y2="124" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="359.0" y="144" font-size="13" fill="#0a84ff" text-anchor="middle" font-weight="700">규칙 이름</text>
<text x="359.0" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">끌 규칙만 지정</text>
<rect x="474" y="60" width="86" height="40" rx="4" fill="#f2f2f7" stroke="#34c759" stroke-width="1.2"/>
<text x="482" y="85" font-size="12" fill="#34c759" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">-- 이유</text>
<line x1="519.0" y1="104" x2="519.0" y2="124" stroke="#34c759" stroke-width="1.6" marker-end="url(#arg)"/>
<text x="519.0" y="144" font-size="13" fill="#34c759" text-anchor="middle" font-weight="700">설명</text>
<text x="519.0" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">-- 뒤는 주석으로 취급</text>
<text x="24" y="200" font-size="12" fill="#1d1d1f" text-anchor="start">이유가 윗줄의 별도 주석에 있으면 지시문만 옮기거나 삭제할 때 이유가 따로 남는다.</text>
<text x="24" y="220" font-size="12" fill="#6e6e73" text-anchor="start">eslint-plugin-eslint-comments의 require-description 규칙은 -- 뒤 설명이 없는 지시문을 보고한다.</text>
</svg>
