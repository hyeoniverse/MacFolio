<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="760" height="380" fill="#fff"/>
  <text x="380.0" y="28" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">파일은 서버를 지나가지 않고 R2로 바로 올라간다</text>
<rect x="20" y="150" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="90.0" y="173.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">브라우저</text>
<text x="90.0" y="189.0" font-size="10.5" fill="#4b5563" text-anchor="middle">(관리자)</text>
<text x="90.0" y="205.0" font-size="10.5" fill="#4b5563" text-anchor="middle">Finder에 끌어 놓기</text>
<rect x="310" y="50" width="170" height="70" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="395.0" y="73.0" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="600">API (NestJS)</text>
<text x="395.0" y="89.0" font-size="10.5" fill="#4b5563" text-anchor="middle">관리자 · 종류 · 20MB 확인</text>
<text x="395.0" y="105.0" font-size="10.5" fill="#4b5563" text-anchor="middle">5분짜리 서명 주소</text>
<rect x="590" y="150" width="150" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="665.0" y="181.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">Cloudflare R2</text>
<text x="665.0" y="197.0" font-size="10.5" fill="#4b5563" text-anchor="middle">macfolio-files</text>
<line x1="160" y1="165" x2="308" y2="95" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="180" y="118" font-size="10.5" fill="#6b7280" text-anchor="start">① 이름 · 크기</text>
<line x1="310" y1="110" x2="162" y2="180" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/><text x="210" y="168" font-size="10.5" fill="#6b7280" text-anchor="start">서명 주소</text>
<line x1="160" y1="195" x2="588" y2="195" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="300" y="188" font-size="10.5" fill="#6b7280" text-anchor="start">② PUT (XHR로 진행률 표시)</text>
<line x1="480" y1="95" x2="588" y2="165" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="520" y="120" font-size="10.5" fill="#6b7280" text-anchor="start">③ HEAD: 있나, 크기가 같나</text>
<rect x="310" y="250" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="395.0" y="279.0" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">Document 표에 더함</text>
<line x1="395" y1="120" x2="395" y2="248" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="300" width="260" height="60" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text x="150.0" y="326.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="600">사이트 Worker /files/&lt;키&gt;</text>
<text x="150.0" y="341.5" font-size="10.0" fill="#4b5563" text-anchor="middle">같은 출처라 frame-src &#x27;self&#x27; 그대로</text>
<line x1="588" y1="215" x2="282" y2="320" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4 3"/>
<text x="560" y="330" font-size="10.5" fill="#6b7280" text-anchor="middle">서명에 content-length를 넣어</text>
<text x="560" y="346" font-size="10.5" fill="#6b7280" text-anchor="middle">말한 크기와 다른 파일은 R2가 받지 않는다</text>
</svg>
