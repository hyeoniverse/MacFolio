<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">편집기와 CI가 같은 규칙 파일을 읽는 구조 (ESLint 예)</text>

  <!-- 저장소 -->
  <rect x="200" y="112" width="240" height="132" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="320" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">저장소</text>
  <g font-size="12" font-family="Menlo, monospace" fill="#1d1d1f">
    <rect x="216" y="146" width="208" height="28" rx="5" fill="#fff" stroke="#c7c7cc"/>
    <text x="228" y="165">eslint.config.js</text>
    <rect x="216" y="182" width="208" height="28" rx="5" fill="#fff" stroke="#c7c7cc"/>
    <text x="228" y="201">node_modules/eslint</text>
  </g>
  <text x="320" y="232" text-anchor="middle" font-size="12" fill="#6e6e73">규칙과 ESLint 버전이 한 곳에 있다</text>

  <!-- 편집기 -->
  <rect x="16" y="56" width="164" height="96" rx="10" fill="#0a84ff"/>
  <text x="98" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">VS Code</text>
  <text x="98" y="100" text-anchor="middle" font-size="12" fill="#fff">ESLint 확장</text>
  <text x="98" y="124" text-anchor="middle" font-size="12" fill="#fff">입력할 때마다 검사</text>
  <text x="98" y="140" text-anchor="middle" font-size="12" fill="#fff">줄에 빨간 물결줄 표시</text>

  <!-- CI -->
  <rect x="460" y="56" width="164" height="96" rx="10" fill="#34c759"/>
  <text x="542" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">CI · 터미널</text>
  <text x="542" y="100" text-anchor="middle" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">npx eslint .</text>
  <text x="542" y="124" text-anchor="middle" font-size="12" fill="#1d1d1f">푸시할 때 검사</text>
  <text x="542" y="140" text-anchor="middle" font-size="12" fill="#1d1d1f">위반이 있으면 실패</text>

  <g stroke="#6e6e73" stroke-width="1.5" fill="none">
    <path d="M180 104 C 200 104, 200 150, 214 160" marker-end="url(#a)"/>
    <path d="M460 104 C 440 104, 440 150, 426 160" marker-end="url(#a)"/>
  </g>
  <text x="186" y="168" text-anchor="end" font-size="12" fill="#6e6e73">읽기</text>
  <text x="454" y="168" font-size="12" fill="#6e6e73">읽기</text>

  <rect x="16" y="264" width="608" height="52" rx="8" fill="#fff" stroke="#c7c7cc"/>
  <text x="32" y="286" font-size="12" fill="#1d1d1f">확장이 자체 규칙을 쓰지 않고 저장소의 파일을 읽으므로, 편집기에서 경고가 없으면 CI에서도 같은 규칙으로 통과한다.</text>
  <text x="32" y="304" font-size="12" fill="#6e6e73">Prettier(.prettierrc), Stylelint(stylelint.config.*), Playwright(playwright.config.ts)도 같은 방식이다.</text>
</svg>
