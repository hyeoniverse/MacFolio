<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>16:10 데스크톱 배경화면을 9:19.5 휴대폰 화면에 가운데 기준으로 채우면 가로의 약 29%만 보이고, 반대로 세로 배경화면을 데스크톱에 채우면 세로의 약 29%만 보인다</title>
<rect width="640" height="360" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">비율이 다른 화면을 채우면 잘리는 범위</text>
<!-- left: landscape image on phone -->
<text x="170" y="62" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">16:10 사진 → 9:19.5 휴대폰</text>
<rect x="30" y="140" width="280" height="175" fill="#f2f2f7" stroke="#6e6e73"/>
<rect x="130" y="140" width="80.6" height="175" fill="#0a84ff" opacity="0.25" stroke="#0a84ff" stroke-width="2"/>
<rect x="30" y="140" width="100" height="175" fill="#ff3b30" opacity="0.10"/>
<rect x="210.6" y="140" width="99.4" height="175" fill="#ff3b30" opacity="0.10"/>
<text x="80" y="232" font-size="12" fill="#ff3b30" text-anchor="middle">잘림</text>
<text x="260" y="232" font-size="12" fill="#ff3b30" text-anchor="middle">잘림</text>
<text x="170" y="132" font-size="12" fill="#0a84ff" text-anchor="middle">보이는 폭 28.8%</text>
<text x="170" y="336" font-size="12" fill="#6e6e73" text-anchor="middle">(9 ÷ 19.5) ÷ (16 ÷ 10) ≈ 0.288</text>
<!-- right: portrait image on desktop -->
<text x="470" y="62" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">9:19.5 사진 → 16:10 데스크톱</text>
<rect x="430" y="76" width="80" height="173.3" fill="#f2f2f7" stroke="#6e6e73"/>
<rect x="430" y="137.7" width="80" height="50" fill="#34c759" opacity="0.3" stroke="#34c759" stroke-width="2"/>
<rect x="430" y="76" width="80" height="61.7" fill="#ff3b30" opacity="0.10"/>
<rect x="430" y="187.7" width="80" height="61.6" fill="#ff3b30" opacity="0.10"/>
<text x="470" y="110" font-size="12" fill="#ff3b30" text-anchor="middle">잘림</text>
<text x="470" y="222" font-size="12" fill="#ff3b30" text-anchor="middle">잘림</text>
<text x="520" y="167" font-size="12" fill="#34c759">보이는 높이 28.8%</text>
<text x="470" y="276" font-size="12" fill="#6e6e73" text-anchor="middle">휴대폰 → 데스크톱도 같은 비율로 잘린다</text>
<text x="470" y="300" font-size="12" fill="#6e6e73" text-anchor="middle">그래서 기본 배경화면은 종류별로 분리하고,</text>
<text x="470" y="318" font-size="12" fill="#6e6e73" text-anchor="middle">관리자가 올린 사진만 양쪽에 표시한다</text>
</svg>
