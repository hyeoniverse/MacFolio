<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>Safari 전체 화면의 페이지 칸 1440×641에 게임 화면을 세 배로 넣으면 384×216은 1152×648로 높이 641을 넘고, 360×208은 1080×624로 들어간다</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">정수 배율과 해상도 고르기</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">Safari 전체 화면의 페이지 칸(1440×641)에 세 배로 확대한 게임 화면을 넣는 경우. 도형 비율 0.4</text>

<rect x="24" y="96" width="576" height="256.4" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="24" y="88" font-size="12" font-weight="700" fill="#1d1d1f">페이지 칸 1440×641 (검은 테두리)</text>

<rect x="76" y="98" width="460.8" height="259.2" fill="none" stroke="#ff3b30" stroke-width="2" stroke-dasharray="6 4"/>
<text x="84" y="370" font-size="12" font-weight="700" fill="#ff3b30">384×216 × 3 = 1152×648 → 높이 648 &gt; 641, 넘침</text>

<rect x="96" y="102" width="432" height="249.6" fill="#eef6ff" stroke="#0a84ff" stroke-width="2"/>
<text x="312" y="216" font-size="14" font-weight="700" fill="#0a84ff" text-anchor="middle">360×208 × 3 = 1080×624</text>
<text x="312" y="238" font-size="12" fill="#1d1d1f" text-anchor="middle">높이 624 ≤ 641, 들어간다</text>
<text x="312" y="260" font-size="12" fill="#6e6e73" text-anchor="middle">게임 화면의 1픽셀이 화면의 3×3 픽셀이 된다</text>

<text x="24" y="392" font-size="12" fill="#6e6e73">이후 규칙: 세로 200칸 이상 남는 최대 정수 배율. 641 ÷ 3 ≈ 214칸, 1440 ÷ 3 = 480칸</text>
</svg>
