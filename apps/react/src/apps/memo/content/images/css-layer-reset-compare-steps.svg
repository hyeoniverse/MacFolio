<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 202" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>잡음을 재고, 시각을 고정하고, 전후 58장을 찍어 픽셀 차이를 세는 네 단계</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="860" height="202" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">화면 58장을 전후로 비교한 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">E2E의 가짜 API로 같은 장면을 만든다</text>
<rect x="32.0" y="80" width="178.0" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">1. 잡음 재기</text><text x="121.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">같은 코드로 두 번 찍기</text><text x="121.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">거의 모든 장면 0.03% 다름</text><text x="121.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">원인: 메뉴 막대 시계</text><line x1="212.0" y1="126.0" x2="236.0" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="238.0" y="80" width="178.0" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="327.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">2. 시각 고정</text><text x="327.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">page.clock.setFixedTime()</text><text x="327.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">잡음 0.001%로</text><line x1="418.0" y1="126.0" x2="442.0" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="444.0" y="80" width="178.0" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="533.0" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">3. 전후 찍기</text><text x="533.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">데스크톱 20장면 × 라이트·다크</text><text x="533.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">휴대폰 9장면 × 라이트·다크</text><text x="533.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">= 58장</text><line x1="624.0" y1="126.0" x2="648.0" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="650.0" y="80" width="178.0" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="739.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">4. 픽셀 비교</text><text x="739.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">canvas로 RGB 차이 합 &gt; 30</text><text x="739.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">다른 픽셀을 빨갛게, 비율 세기</text>
</svg>
