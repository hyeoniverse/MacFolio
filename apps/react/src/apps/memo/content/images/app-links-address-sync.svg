<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>주소 막대를 누가 바꾸나: 앱마다 → 한 곳</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="340" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">주소 막대를 누가 바꾸나: 앱마다 → 한 곳</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">앱은 &quot;지금 보여 주는 항목&quot;만 알리고, 창 순서를 아는 앱 상태가 맨 앞 창으로 주소를 정한다</text>
<text x="32" y="86" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="start">전</text>
<rect x="32" y="100" width="170" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="117.0" y="120.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">메모</text>
<text x="117.0" y="137.5" font-size="11" fill="#374151" text-anchor="middle">replaceState(/memo/…)</text>
<rect x="32" y="170" width="170" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="117.0" y="190.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">Safari</text>
<text x="117.0" y="207.5" font-size="11" fill="#374151" text-anchor="middle">replaceState(/safari/…)</text>
<rect x="250" y="130" width="150" height="60" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="325.0" y="155.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">주소 막대</text>
<text x="325.0" y="172.5" font-size="11" fill="#374151" text-anchor="middle">나중에 쓴 쪽이 이김</text>
<line x1="202" y1="125" x2="246" y2="150" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<line x1="202" y1="195" x2="246" y2="170" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<text x="32" y="250" font-size="11" fill="#b91c1c" text-anchor="start">메모를 보고 있는데 뒤의 Safari 탭 주소가 남는다</text>
<text x="448" y="86" font-size="14" fill="#15803d" font-weight="700" text-anchor="start">후</text>
<rect x="448" y="100" width="150" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="523.0" y="117.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">메모</text>
<text x="523.0" y="134.5" font-size="11" fill="#374151" text-anchor="middle">setAppAddress</text>
<rect x="448" y="156" width="150" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="523.0" y="173.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">Safari</text>
<text x="523.0" y="190.5" font-size="11" fill="#374151" text-anchor="middle">setAppAddress</text>
<rect x="628" y="100" width="200" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="728.0" y="137.0" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">appAddresses (저장소)</text>
<text x="728.0" y="154.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">{ memo: slug,</text>
<text x="728.0" y="171.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">  safari: id }</text>
<line x1="598" y1="122" x2="624" y2="130" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<line x1="598" y1="178" x2="624" y2="170" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="628" y="230" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="728.0" y="252.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">syncAddressBar(front())</text>
<text x="728.0" y="269.0" font-size="11" fill="#374151" text-anchor="middle">맨 앞 · 최소화 아님</text>
<text x="728.0" y="286.0" font-size="11" fill="#374151" text-anchor="middle">zIndex가 가장 큰 앱</text>
<line x1="728" y1="200" x2="728" y2="226" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="448" y="230" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="523.0" y="260.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">창 순서 바뀜</text>
<text x="523.0" y="277.5" font-size="11" fill="#374151" text-anchor="middle">앞으로 · 닫기 · 최소화</text>
<line x1="598" y1="265" x2="624" y2="265" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
</svg>
