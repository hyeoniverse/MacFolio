<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 202" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>번역 요청 몸통을 모으기, 칸 수, 칸마다, 합친 길이, 채우기 순서로 검사한다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="900" height="202" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">번역 몸통을 보는 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">packages/contracts/src/demos.ts의 TranslateInput</text>
<rect x="32.0" y="80" width="144.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="104.4" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">모으기</text><text x="104.4" y="122" font-size="10.5" fill="#374151" text-anchor="middle">preprocess</text><text x="104.4" y="138" font-size="10.5" fill="#374151" text-anchor="middle">text 하나 → [text]</text><text x="104.4" y="154" font-size="10.5" fill="#374151" text-anchor="middle">texts 배열은 그대로</text><line x1="178.8" y1="126.0" x2="202.8" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="204.8" y="80" width="144.8" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="277.20000000000005" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">칸 수</text><text x="277.20000000000005" y="122" font-size="10.5" fill="#374151" text-anchor="middle">.max(3)</text><text x="277.20000000000005" y="138" font-size="10.5" fill="#374151" text-anchor="middle">넘으면 &quot;3칸까지만…&quot;</text><text x="277.20000000000005" y="154" font-size="10.5" fill="#374151" text-anchor="middle">칸마다는 보지 않는다</text><line x1="351.6" y1="126.0" x2="375.6" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="377.6" y="80" width="144.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="450.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">칸마다</text><text x="450.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">.pipe(translateText)</text><text x="450.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">빈 글·200자·제어 문자</text><text x="450.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">주소·욕설</text><line x1="524.4000000000001" y1="126.0" x2="548.4000000000001" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="550.4000000000001" y="80" width="144.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="622.8000000000001" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">합친 길이</text><text x="622.8000000000001" y="122" font-size="10.5" fill="#374151" text-anchor="middle">.refine(join ≤ 200)</text><text x="622.8000000000001" y="138" font-size="10.5" fill="#374151" text-anchor="middle">&quot;모두 합쳐 200자…&quot;</text><line x1="697.2" y1="126.0" x2="721.2" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="723.2" y="80" width="144.8" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="795.6" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">채우기</text><text x="795.6" y="122" font-size="10.5" fill="#374151" text-anchor="middle">transform</text><text x="795.6" y="138" font-size="10.5" fill="#374151" text-anchor="middle">to = from의 반대</text><text x="795.6" y="154" font-size="10.5" fill="#374151" text-anchor="middle">skip은 아는 공급자만</text>
</svg>
