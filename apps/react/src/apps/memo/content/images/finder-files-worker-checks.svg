<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 234" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>메서드, 키 모양, 버킷, ETag, 응답 순서로 거르고, 키가 이상하면 버킷을 읽기 전에 404로 끝낸다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="900" height="234" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">/files/&lt;키&gt; 요청을 거르는 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">apps/react/worker/files.ts의 serveFile</text>
<rect x="32.0" y="80" width="144.8" height="124" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="104.4" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">메서드</text><text x="104.4" y="122" font-size="10.5" fill="#374151" text-anchor="middle">GET·HEAD가</text><text x="104.4" y="138" font-size="10.5" fill="#374151" text-anchor="middle">아니면 405</text><line x1="178.8" y1="142.0" x2="202.8" y2="142.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="204.8" y="80" width="144.8" height="124" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="277.20000000000005" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">키 모양</text><text x="277.20000000000005" y="122" font-size="10.5" fill="#374151" text-anchor="middle">512자 이하</text><text x="277.20000000000005" y="138" font-size="10.5" fill="#374151" text-anchor="middle">제어 문자·\ X</text><text x="277.20000000000005" y="154" font-size="10.5" fill="#374151" text-anchor="middle">빈 조각·.·.. X</text><text x="277.20000000000005" y="170" font-size="10.5" fill="#374151" text-anchor="middle">허용 확장자만</text><text x="277.20000000000005" y="186" font-size="10.5" fill="#374151" text-anchor="middle">→ 아니면 404</text><line x1="351.6" y1="142.0" x2="375.6" y2="142.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="377.6" y="80" width="144.8" height="124" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="450.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">버킷</text><text x="450.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">바인딩 없음 → 404</text><text x="450.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">R2에 없음 → 404</text><line x1="524.4000000000001" y1="142.0" x2="548.4000000000001" y2="142.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="550.4000000000001" y="80" width="144.8" height="124" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="622.8000000000001" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">ETag</text><text x="622.8000000000001" y="122" font-size="10.5" fill="#374151" text-anchor="middle">If-None-Match가</text><text x="622.8000000000001" y="138" font-size="10.5" fill="#374151" text-anchor="middle">맞으면 304</text><line x1="697.2" y1="142.0" x2="721.2" y2="142.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="723.2" y="80" width="144.8" height="124" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="795.6" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">응답</text><text x="795.6" y="122" font-size="10.5" fill="#374151" text-anchor="middle">Range면 206/416</text><text x="795.6" y="138" font-size="10.5" fill="#374151" text-anchor="middle">아니면 200</text><text x="795.6" y="154" font-size="10.5" fill="#374151" text-anchor="middle">inline 또는 ?download=1</text><text x="795.6" y="170" font-size="10.5" fill="#374151" text-anchor="middle">좁은 CSP</text>
</svg>
