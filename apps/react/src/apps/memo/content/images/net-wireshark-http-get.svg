<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="380" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">하나의 TCP 연결 위의 HTTP 요청과 응답</text>
  <text x="140" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">브라우저</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">웹 서버 : 80</text>
  <line x1="140" y1="60" x2="140" y2="350" stroke="#6e6e73" stroke-width="2"/>
  <line x1="500" y1="60" x2="500" y2="350" stroke="#6e6e73" stroke-width="2"/>
  <g font-size="11.5">
    <line x1="140" y1="82" x2="500" y2="104" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="88" text-anchor="middle" fill="#1d1d1f">SYN</text>
    <line x1="500" y1="118" x2="140" y2="140" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="124" text-anchor="middle" fill="#1d1d1f">SYN + ACK</text>
    <line x1="140" y1="154" x2="500" y2="176" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="160" text-anchor="middle" fill="#1d1d1f">ACK  (연결 성립)</text>
    <line x1="140" y1="200" x2="500" y2="222" stroke="#0a84ff" stroke-width="2" marker-end="url(#a)"/>
    <text x="320" y="206" text-anchor="middle" fill="#0a84ff">GET /file HTTP/1.1  (PSH+ACK)</text>
    <line x1="500" y1="238" x2="140" y2="260" stroke="#34c759" stroke-width="2" marker-end="url(#a)"/>
    <text x="320" y="244" text-anchor="middle" fill="#34c759">HTTP/1.1 200 OK  + 본문</text>
    <line x1="140" y1="290" x2="500" y2="312" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="296" text-anchor="middle" fill="#1d1d1f">FIN + ACK</text>
    <line x1="500" y1="326" x2="140" y2="348" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="332" text-anchor="middle" fill="#1d1d1f">FIN + ACK</text>
  </g>
  <text x="128" y="192" text-anchor="end" font-size="10.5" fill="#6e6e73" transform="rotate(-90 20 185)"></text>
  <rect x="150" y="68" width="4" height="100" fill="#1d1d1f" opacity="0.12"/>
  <rect x="150" y="190" width="4" height="78" fill="#0a84ff" opacity="0.18"/>
  <rect x="150" y="282" width="4" height="70" fill="#1d1d1f" opacity="0.12"/>
  <text x="166" y="76" font-size="10" fill="#6e6e73">핸드셰이크</text>
  <text x="166" y="198" font-size="10" fill="#0a84ff">HTTP 교환</text>
  <text x="166" y="290" font-size="10" fill="#6e6e73">종료</text>
</svg>
