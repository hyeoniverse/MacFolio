<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>package.json에 없는 react-dom이 예전 node_modules에 남아 있어 로컬에서만 동작하던 상태</title>
<rect width="640" height="340" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">package.json에 없는 의존성이 로컬에서만 동작하는 이유</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">npm install은 package.json(과 잠금 파일)에 적힌 패키지만 설치한다</text>
<rect x="24" y="74" width="180" height="150" rx="10" fill="#f2f2f7"/>
<text x="38" y="98" font-size="13" font-weight="600" fill="#1d1d1f">package.json</text>
<text x="38" y="122" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">react</text>
<text x="38" y="142" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">vite</text>
<text x="38" y="162" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">@vitejs/plugin-react</text>
<text x="38" y="186" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#ff3b30">react-dom  (없음)</text>
<text x="38" y="206" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#ff3b30">typescript (없음)</text>
<rect x="228" y="74" width="188" height="150" rx="10" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="242" y="98" font-size="13" font-weight="600" fill="#1d1d1f">개발자 Mac</text>
<text x="242" y="118" font-size="12" fill="#6e6e73">CRA 시절 node_modules 유지</text>
<text x="242" y="144" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">node_modules/react</text>
<text x="242" y="164" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">node_modules/vite</text>
<text x="242" y="184" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#34c759">node_modules/react-dom</text>
<text x="242" y="204" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#34c759">node_modules/typescript</text>
<rect x="440" y="74" width="176" height="150" rx="10" fill="#ffffff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="454" y="98" font-size="13" font-weight="600" fill="#1d1d1f">새로 설치한 환경</text>
<text x="454" y="118" font-size="12" fill="#6e6e73">CI, 새 컴퓨터, 배포 빌드</text>
<text x="454" y="144" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">node_modules/react</text>
<text x="454" y="164" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">node_modules/vite</text>
<text x="454" y="184" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#ff3b30">react-dom 없음</text>
<text x="454" y="204" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#ff3b30">typescript 없음</text>
<rect x="228" y="236" width="188" height="34" rx="8" fill="#eafaef"/>
<text x="322" y="258" font-size="12.5" text-anchor="middle" fill="#1d1d1f">import 성공, tsc 실행 가능</text>
<rect x="440" y="236" width="176" height="34" rx="8" fill="#ffecea"/>
<text x="528" y="258" font-size="12.5" text-anchor="middle" fill="#1d1d1f">import·tsc 실패 가능</text>
<text x="24" y="300" font-size="12.5" fill="#1d1d1f">package.json에 적지 않은 패키지가 이전 설치 결과에 남아 있으면, 로컬 빌드는 성공하고</text>
<text x="24" y="320" font-size="12.5" fill="#1d1d1f">처음부터 설치하는 환경에서만 실패한다. 정리 커밋에서 두 패키지를 package.json에 추가했다.</text>
</svg>
