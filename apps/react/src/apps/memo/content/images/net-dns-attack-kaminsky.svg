<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="420" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Kaminsky 공격의 한 회차</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="30" y="44" width="120" height="34" rx="6" fill="#1d1d1f"/><text x="90" y="66" fill="#fff">공격자</text>
    <rect x="245" y="44" width="150" height="34" rx="6" fill="#e5e5ea"/><text x="320" y="66" fill="#1d1d1f">로컬 DNS 서버(피해자)</text>
    <rect x="470" y="44" width="150" height="34" rx="6" fill="#0a84ff"/><text x="545" y="66" fill="#fff">example.com 권한 서버</text>
  </g>
  <g stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="90" y1="78" x2="90" y2="330"/><line x1="320" y1="78" x2="320" y2="330"/><line x1="545" y1="78" x2="545" y2="330"/>
  </g>
  <line x1="90" y1="110" x2="318" y2="110" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="100" y="102" font-size="12" fill="#1d1d1f">① twysw.example.com의 A 레코드?</text>
  <line x1="320" y1="148" x2="543" y2="148" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="140" font-size="12" fill="#1d1d1f">② 같은 질의 (출발 포트 P, TXID T)</text>
  <g stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#b)">
    <line x1="90" y1="182" x2="318" y2="182"/><line x1="90" y1="198" x2="318" y2="198"/><line x1="90" y1="214" x2="318" y2="214"/><line x1="90" y1="230" x2="318" y2="230"/>
  </g>
  <text x="100" y="250" font-size="12" fill="#c46f00">③ 위조 응답 수백 개: 출처 IP는 권한 서버,</text>
  <text x="100" y="266" font-size="12" fill="#c46f00">TXID는 0~65535 중 추측값,</text>
  <text x="100" y="282" font-size="12" fill="#c46f00">Authority: example.com NS ns.attacker32.com</text>
  <line x1="545" y1="300" x2="322" y2="300" stroke="#6e6e73" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#c)"/>
  <text x="535" y="292" text-anchor="end" font-size="12" fill="#6e6e73">④ 진짜 응답: 늦게 오면 버려진다</text>
  <rect x="30" y="344" width="580" height="60" rx="8" fill="#e8f2ff" stroke="#0a84ff"/>
  <text x="44" y="368" font-size="12.5" fill="#1d1d1f">TXID·포트가 맞는 위조 응답이 ④보다 먼저 도착하면 example.com의 NS가 ns.attacker32.com으로 캐시된다.</text>
  <text x="44" y="390" font-size="12.5" fill="#1d1d1f">실패하면 다른 무작위 이름으로 ①부터 다시 시작한다. 이름이 매번 달라 캐시가 다음 시도를 막지 못한다.</text>
</svg>
