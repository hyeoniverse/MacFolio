<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>규칙 복사본 하나만 고쳤을 때의 요청과 응답</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
</defs>
<rect width="640" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">복사본 중 하나만 4단으로 고친 경우 (가정)</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">관리자가 글을 폴더 "a/b/c/d"로 옮긴다</text>

<rect x="24" y="70" width="230" height="96" rx="10" fill="#f2f2f7" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="40" y="94" font-size="13" font-weight="700" fill="#1d1d1f">화면 (desktop-core)</text>
<text x="40" y="116" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">MAX_FOLDER_DEPTH = 4</text>
<text x="40" y="136" font-size="12" fill="#ff9f0a">고친 쪽</text>
<text x="40" y="154" font-size="12" fill="#1d1d1f">"a/b/c/d" 검사 통과</text>

<rect x="386" y="70" width="230" height="96" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="402" y="94" font-size="13" font-weight="700" fill="#1d1d1f">서버 (apps/api)</text>
<text x="402" y="116" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">MAX_FOLDER_DEPTH = 3</text>
<text x="402" y="136" font-size="12" fill="#6e6e73">놓친 쪽</text>
<text x="402" y="154" font-size="12" fill="#1d1d1f">"a/b/c/d" 검사 실패</text>

<line x1="254" y1="104" x2="382" y2="104" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="318" y="96" font-size="12" fill="#1d1d1f" text-anchor="middle">PUT 정리 내용</text>
<line x1="386" y1="140" x2="258" y2="140" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="320" y="132" font-size="12" font-weight="700" fill="#ff3b30" text-anchor="middle">400</text>
<text x="320" y="158" font-size="12" fill="#ff3b30" text-anchor="middle">폴더는 3단까지입니다</text>

<text x="24" y="198" font-size="12" fill="#1d1d1f">화면은 저장 버튼을 활성화하고, 저장하는 순간 서버가 거절한다. 어느 쪽이 맞는지 코드에 근거가 없다.</text>

<line x1="24" y1="218" x2="616" y2="218" stroke="#6e6e73" stroke-dasharray="4 4"/>
<text x="24" y="246" font-size="14" font-weight="700" fill="#1d1d1f">한 파일로 모은 뒤</text>

<rect x="205" y="262" width="230" height="56" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="320" y="284" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">desktop-core/src/memo/rules.ts</text>
<text x="320" y="304" font-size="12" fill="#0a84ff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">MAX_FOLDER_DEPTH = 3</text>
<rect x="24" y="300" width="150" height="56" rx="10" fill="#f2f2f7"/>
<text x="99" y="324" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">화면</text>
<text x="99" y="342" font-size="12" fill="#6e6e73" text-anchor="middle">src를 import</text>
<rect x="466" y="300" width="150" height="56" rx="10" fill="#f2f2f7"/>
<text x="541" y="324" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">서버</text>
<text x="541" y="342" font-size="12" fill="#6e6e73" text-anchor="middle">dist를 import</text>
<line x1="176" y1="326" x2="202" y2="300" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="464" y1="326" x2="438" y2="300" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="320" y="346" font-size="12" fill="#1d1d1f" text-anchor="middle">값을 바꾸면 양쪽이 함께 바뀐다</text>
</svg>
