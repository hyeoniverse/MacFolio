<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  </defs>
  <text x="30" y="26" font-size="15" font-weight="600" fill="#1d1d1f">트랜스포머 출력에서 부류 예측까지</text>
  <!-- 입력 토큰 -->
  <g fill="#0a84ff">
    <rect x="30" y="250" width="150" height="28" rx="3"/>
    <rect x="230" y="250" width="150" height="28" rx="3"/>
    <rect x="450" y="250" width="150" height="28" rx="3"/>
    <rect x="30" y="140" width="150" height="28" rx="3"/>
    <rect x="230" y="140" width="150" height="28" rx="3"/>
    <rect x="450" y="140" width="150" height="28" rx="3"/>
    <rect x="30" y="96" width="150" height="28" rx="3"/>
    <rect x="470" y="40" width="110" height="84" rx="3"/>
  </g>
  <g font-size="13" fill="#fff" text-anchor="middle" font-style="italic">
    <text x="105" y="269">z<tspan font-size="9" dy="3">0,0</tspan></text>
    <text x="305" y="269">z<tspan font-size="9" dy="3">0,1</tspan></text>
    <text x="525" y="269">z<tspan font-size="9" dy="3">0,9</tspan></text>
    <text x="105" y="159">z<tspan font-size="9" dy="3">12,0</tspan></text>
    <text x="305" y="159">z<tspan font-size="9" dy="3">12,1</tspan></text>
    <text x="525" y="159">z<tspan font-size="9" dy="3">12,9</tspan></text>
  </g>
  <text x="105" y="115" text-anchor="middle" font-size="12.5" fill="#fff">정규화한 <tspan font-style="italic">z</tspan><tspan font-size="9" dy="3" font-style="italic">12,0</tspan></text>
  <text x="525" y="78" text-anchor="middle" font-size="13" fill="#fff">부류</text>
  <text x="525" y="96" text-anchor="middle" font-size="12" fill="#fff">(1000차원)</text>
  <g font-size="16" fill="#1d1d1f" text-anchor="middle">
    <text x="415" y="269">…</text>
    <text x="415" y="159">…</text>
  </g>
  <rect x="30" y="190" width="570" height="40" rx="10" fill="#aeaeb2"/>
  <text x="315" y="215" text-anchor="middle" font-size="14" fill="#fff">트랜스포머 인코더 × 12</text>
  <rect x="230" y="40" width="150" height="50" rx="12" fill="#a9cdf5"/>
  <text x="305" y="70" text-anchor="middle" font-size="14" fill="#fff">MLP</text>
  <g stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="105" y1="250" x2="105" y2="232"/>
    <line x1="305" y1="250" x2="305" y2="232"/>
    <line x1="525" y1="250" x2="525" y2="232"/>
    <line x1="105" y1="190" x2="105" y2="170"/>
    <line x1="305" y1="190" x2="305" y2="170"/>
    <line x1="525" y1="190" x2="525" y2="170"/>
    <line x1="105" y1="140" x2="105" y2="126"/>
    <polyline points="105,96 105,65 228,65" fill="none"/>
    <line x1="380" y1="65" x2="468" y2="65"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="105" y="300"><tspan fill="#0a84ff">class 토큰</tspan><tspan fill="#1d1d1f"> + </tspan><tspan fill="#ff3b30">PE 0</tspan></text>
    <text x="305" y="300"><tspan fill="#0a84ff">패치 1</tspan><tspan fill="#1d1d1f"> + </tspan><tspan fill="#ff3b30">PE 1</tspan></text>
    <text x="525" y="300"><tspan fill="#0a84ff">패치 9</tspan><tspan fill="#1d1d1f"> + </tspan><tspan fill="#ff3b30">PE 9</tspan></text>
  </g>
  <text x="30" y="328" font-size="11.5" fill="#6e6e73">PE: 위치 임베딩(position embedding). 0번 위치(class 토큰)의 출력만 MLP head로 보낸다</text>
</svg>
