<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>FinderItem은 kind 필드로 구분하는 판별 유니언이다. switch가 모든 kind를 처리하면 default의 item은 never 타입이 되고, alias 처리를 빠뜨리면 item이 AliasItem으로 남아 never에 대입할 수 없다는 컴파일 오류가 난다</title>
<rect width="640" height="380" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">판별 유니언과 never 검사</text>

<rect x="20" y="44" width="600" height="56" rx="8" fill="#f2f2f7"/>
<text x="32" y="64" font-size="12" fill="#6e6e73">FinderItem (kind 값으로 종류를 구분)</text>
<text x="32" y="86" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f">folder | <tspan fill="#0a84ff" font-weight="700">alias</tspan> | doc | post | project | app | pdf | image | file | track</text>

<g font-size="12">
<text x="20" y="130" font-weight="700" fill="#248a3d">모든 kind를 처리한 경우</text>
<rect x="20" y="140" width="290" height="140" rx="8" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<g font-family="SFMono-Regular, Menlo, monospace" style="white-space:pre">
<text style="white-space:pre" x="32" y="162" fill="#1d1d1f">switch (item.kind) {</text>
<text style="white-space:pre" x="32" y="180" fill="#1d1d1f">  case 'folder': …</text>
<text style="white-space:pre" x="32" y="198" fill="#1d1d1f">  case 'alias': …</text>
<text style="white-space:pre" x="32" y="216" fill="#1d1d1f">  … (나머지 kind)</text>
<text style="white-space:pre" x="32" y="234" fill="#1d1d1f">  default:</text>
<text style="white-space:pre" x="32" y="252" fill="#1d1d1f">    const u: never = item;</text>
</g>
<text x="32" y="272" fill="#248a3d">남은 타입이 없어 item은 never, 통과</text>

<text x="330" y="130" font-weight="700" fill="#ff3b30">alias 처리를 빠뜨린 경우</text>
<rect x="330" y="140" width="290" height="140" rx="8" fill="#ffffff" stroke="#ff3b30" stroke-width="1.5"/>
<g font-family="SFMono-Regular, Menlo, monospace" style="white-space:pre">
<text style="white-space:pre" x="342" y="162" fill="#1d1d1f">switch (item.kind) {</text>
<text style="white-space:pre" x="342" y="180" fill="#1d1d1f">  case 'folder': …</text>
<text style="white-space:pre" x="342" y="198" fill="#c7c7cc">  (alias 없음)</text>
<text style="white-space:pre" x="342" y="216" fill="#1d1d1f">  … (나머지 kind)</text>
<text style="white-space:pre" x="342" y="234" fill="#1d1d1f">  default:</text>
<text style="white-space:pre" x="342" y="252" fill="#1d1d1f">    const u: never = item;</text>
</g>
<text x="342" y="272" fill="#ff3b30">item은 AliasItem으로 남는다</text>
</g>

<rect x="20" y="296" width="600" height="66" rx="8" fill="#ffeceb"/>
<text x="34" y="318" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#ff3b30">error TS2322: Type 'AliasItem' is not assignable to type 'never'.</text>
<text x="34" y="340" font-size="12" fill="#1d1d1f">새 kind를 추가하고 여는 방법을 정하지 않으면 pnpm typecheck가 이 줄에서 실패한다</text>
<text x="34" y="356" font-size="12" fill="#6e6e73">KIND_LABELS의 Record&lt;FinderItem['kind'], string&gt;도 같은 원리로 라벨 누락을 검출한다</text>
</svg>
