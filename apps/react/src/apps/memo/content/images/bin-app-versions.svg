<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>휴지통이 담은 것: 네 번 바뀌었다</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">휴지통이 담은 것: 네 번 바뀌었다</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">10/09 아침부터 10/18까지. 아래는 그때 사이드바에 있던 칸</text>
<rect x="32" y="90" width="184" height="120" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="124.0" y="137.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">10/09 ①</text>
<text x="124.0" y="154.0" font-size="11" fill="#374151" text-anchor="middle">버린 기능 + 개발 일지</text>
<text x="124.0" y="171.0" font-size="11" fill="#374151" text-anchor="middle">관리자: 지운 메모 되살리기</text>
<rect x="236" y="90" width="184" height="120" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="328.0" y="137.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">10/09 ②</text>
<text x="328.0" y="154.0" font-size="11" fill="#374151" text-anchor="middle">버린 기능만 (11가지)</text>
<text x="328.0" y="171.0" font-size="11" fill="#374151" text-anchor="middle">바꾸기 전 화면 · 지운 줄 수</text>
<rect x="440" y="90" width="184" height="120" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="532.0" y="137.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">10/10 ③</text>
<text x="532.0" y="154.0" font-size="11" fill="#374151" text-anchor="middle">내 브라우저 데이터</text>
<text x="532.0" y="171.0" font-size="11" fill="#374151" text-anchor="middle">관리자: 서버 파일</text>
<rect x="644" y="90" width="184" height="120" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="736.0" y="137.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">10/18 ④</text>
<text x="736.0" y="154.0" font-size="11" fill="#374151" text-anchor="middle">+ Finder에서 버린 항목</text>
<text x="736.0" y="171.0" font-size="11" fill="#374151" text-anchor="middle">되돌려 놓기 · 영구 삭제</text>
<line x1="216" y1="150" x2="236" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<line x1="420" y1="150" x2="440" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<line x1="624" y1="150" x2="644" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="32" y="250" font-size="12" fill="#b91c1c" text-anchor="start">①②는 &quot;보여 주는 곳&quot; (전시장): 개발이 끝나면 더할 것이 없고, 개발 일지와 내용이 겹친다</text>
<text x="32" y="276" font-size="12" fill="#15803d" text-anchor="start">③④는 &quot;비우는 곳&quot;: 방문자 브라우저에 남은 것, 서버에 남은 파일, Finder에서 버린 것</text>
</svg>
