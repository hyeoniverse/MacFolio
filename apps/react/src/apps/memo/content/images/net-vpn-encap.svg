<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">IP 터널링의 캡슐화 구조</text>
  <!-- original packet -->
  <text x="40" y="66" font-size="13" font-weight="600" fill="#1d1d1f">보호할 원래 패킷</text>
  <rect x="40" y="76" width="150" height="44" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
  <line x1="120" y1="76" x2="120" y2="120" stroke="#1d1d1f" stroke-width="1"/>
  <text x="80" y="102" text-anchor="middle" font-size="11.5" fill="#1d1d1f">내부 IP 헤더</text>
  <text x="155" y="102" text-anchor="middle" font-size="11.5" fill="#1d1d1f">데이터</text>
  <!-- arrow -->
  <line x1="215" y1="98" x2="255" y2="98" stroke="#0a84ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="235" y="88" text-anchor="middle" font-size="11" fill="#0a84ff">암호화</text>
  <text x="235" y="116" text-anchor="middle" font-size="11" fill="#0a84ff">+ 캡슐화</text>
  <!-- tunnel packet -->
  <text x="280" y="66" font-size="13" font-weight="600" fill="#1d1d1f">터널을 지나는 실제 패킷</text>
  <rect x="280" y="76" width="130" height="44" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff" stroke-width="1.2"/>
  <rect x="410" y="76" width="200" height="44" fill="#34c759" fill-opacity="0.14" stroke="#34c759" stroke-width="1.5"/>
  <text x="345" y="94" text-anchor="middle" font-size="11.5" fill="#1d1d1f">새 IP 헤더</text>
  <text x="345" y="110" text-anchor="middle" font-size="10.5" fill="#6e6e73">(터널 양 끝 주소)</text>
  <text x="510" y="94" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d1d1f">페이로드 = 원래 IP 패킷</text>
  <text x="510" y="110" text-anchor="middle" font-size="10.5" fill="#34c759">암호화되어 보호됨</text>
  <!-- note -->
  <g font-size="12.5" fill="#1d1d1f">
    <text x="40" y="168">터널 끝 A는 보호할 IP 패킷을 통째로 페이로드에 담고, 새 IP 헤더를 붙여 공용망으로 보낸다.</text>
    <text x="40" y="190">터널 끝 B는 페이로드에서 원래 IP 패킷을 꺼낸다. 방화벽은 바깥 헤더만 보므로</text>
    <text x="40" y="212">안에 담긴 원래 패킷을 보지 못하고 필터링하지 못한다.</text>
  </g>
  <rect x="40" y="232" width="560" height="32" rx="6" fill="#ff9f0a" fill-opacity="0.1" stroke="#ff9f0a" stroke-width="1"/>
  <text x="52" y="253" font-size="12" fill="#1d1d1f">IPsec 터널링은 커널에서, TLS/SSL 터널링은 응용 수준에서 원래 패킷을 TCP·UDP 안에 담는다.</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0a84ff"/></marker></defs>
</svg>
