<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Safari 창이 앞에 있을 때 Dock의 메모 아이콘을 누르는 동안 표시된 앱 이름</text>

  <!-- 축 -->
  <text x="150" y="64" font-size="12" fill="#6e6e73" text-anchor="middle">누르기 전</text>
  <text x="330" y="64" font-size="12" fill="#6e6e73" text-anchor="middle">pointerdown (누름)</text>
  <text x="520" y="64" font-size="12" fill="#6e6e73" text-anchor="middle">click (손을 뗌)</text>
  <line x1="240" y1="72" x2="240" y2="190" stroke="#c7c7cc" stroke-dasharray="4 3"/>
  <line x1="240" y1="196" x2="240" y2="240" stroke="#c7c7cc" stroke-dasharray="4 3"/>
  <line x1="420" y1="72" x2="420" y2="270" stroke="#c7c7cc" stroke-dasharray="4 3"/>

  <!-- 고치기 전 -->
  <text x="16" y="110" font-size="13" font-weight="700" fill="#ff3b30">고치기 전</text>
  <rect x="80" y="88" width="150" height="36" rx="6" fill="#f2f2f7"/><text x="155" y="111" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">Safari</text>
  <rect x="250" y="88" width="160" height="36" rx="6" fill="#fff" stroke="#ff3b30" stroke-width="2"/><text x="330" y="111" font-size="13" font-weight="700" fill="#ff3b30" text-anchor="middle">Finder</text>
  <rect x="430" y="88" width="190" height="36" rx="6" fill="#f2f2f7"/><text x="525" y="111" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">메모</text>
  <text x="330" y="146" font-size="12" fill="#6e6e73" text-anchor="middle">바탕화면 레이어의 캡처 핸들러가</text>
  <text x="330" y="163" font-size="12" fill="#6e6e73" text-anchor="middle">Dock도 '창 밖'으로 처리</text>

  <!-- 고친 뒤 -->
  <text x="16" y="222" font-size="13" font-weight="700" fill="#0a84ff">고친 뒤</text>
  <rect x="80" y="200" width="330" height="36" rx="6" fill="#f2f2f7"/><text x="245" y="223" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">Safari (그대로)</text>
  <rect x="430" y="200" width="190" height="36" rx="6" fill="#fff" stroke="#0a84ff" stroke-width="2"/><text x="525" y="223" font-size="13" font-weight="700" fill="#0a84ff" text-anchor="middle">메모</text>
  <text x="245" y="258" font-size="12" fill="#6e6e73" text-anchor="middle">.dock · .launchpad-content는 처리하지 않는다</text>

  <rect x="16" y="282" width="608" height="36" rx="8" fill="#fff" stroke="#6e6e73"/>
  <text x="320" y="305" font-size="12" fill="#1d1d1f" text-anchor="middle">시험: MutationObserver로 앱 이름 요소가 거친 문자열을 모두 기록하고 'Finder'가 없는지 확인</text>
</svg>
