<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>키 없는 SHA-256 해시는 IPv4 주소 약 43억 개를 모두 대입해 원문을 찾을 수 있고, 서버 비밀 키를 쓰는 HMAC은 키 없이는 후보 값을 계산할 수 없다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="400" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">AdminIp 표가 유출됐을 때 IP를 되찾을 수 있는가</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">예시 IP 203.0.113.7 (문서용 대역). 공격자는 표의 64자 값만 가지고 있다</text>

<!-- 왼쪽 -->
<rect x="24" y="70" width="292" height="286" rx="10" fill="#ffebea" stroke="#ff3b30"/>
<text x="40" y="94" font-size="13" font-weight="700" fill="#ff3b30">키 없는 SHA-256</text>
<g font-size="12" fill="#1d1d1f">
<text x="40" y="118" font-family="ui-monospace, Menlo, monospace">sha256("admin-ip:" + ip)</text>
<text x="40" y="146">공격자가 모든 IPv4 주소를 대입한다</text>
<rect x="40" y="156" width="260" height="96" rx="6" fill="#ffffff"/>
<g font-family="ui-monospace, Menlo, monospace">
<text x="52" y="176">0.0.0.0</text><text x="180" y="176">→ 3b7a…</text>
<text x="52" y="194">0.0.0.1</text><text x="180" y="194">→ e01f…</text>
<text x="52" y="232" fill="#ff3b30" font-weight="600">203.0.113.7</text><text x="180" y="232" fill="#ff3b30" font-weight="600">→ 9c4d… 일치</text>
</g>
<text x="52" y="213" fill="#6e6e73">…  2^32 ≈ 43억 번 반복  …</text>
<text x="40" y="280">해시 함수와 접두어는 코드에 공개되어 있어</text>
<text x="40" y="298">누구나 같은 계산을 할 수 있다</text>
<text x="40" y="330" font-weight="600" fill="#ff3b30">IP 원문이 복원된다</text>
</g>

<!-- 오른쪽 -->
<rect x="324" y="70" width="292" height="286" rx="10" fill="#e8f8ec" stroke="#34c759"/>
<text x="340" y="94" font-size="13" font-weight="700" fill="#248a3d">HMAC-SHA256 (MacFolio)</text>
<g font-size="12" fill="#1d1d1f">
<text x="340" y="118" font-family="ui-monospace, Menlo, monospace">hmac(IP_HASH_SECRET, …)</text>
<text x="340" y="146">공격자가 같은 대입을 시도한다</text>
<rect x="340" y="156" width="260" height="96" rx="6" fill="#ffffff"/>
<g font-family="ui-monospace, Menlo, monospace">
<text x="352" y="176">0.0.0.0</text><text x="480" y="176">→ ?</text>
<text x="352" y="194">0.0.0.1</text><text x="480" y="194">→ ?</text>
</g>
<text x="352" y="216" fill="#6e6e73">키를 모르면</text>
<text x="352" y="236" fill="#6e6e73">비교할 후보 값을 만들 수 없다</text>
<text x="340" y="280">키는 서버 환경 변수에만 있고</text>
<text x="340" y="298">DB에는 저장하지 않는다</text>
<text x="340" y="330" font-weight="600" fill="#248a3d">표만으로는 IP를 알 수 없다</text>
</g>
<text x="24" y="384" font-size="12" fill="#6e6e73">43억 번은 컴퓨터 한 대로 끝낼 수 있는 계산량이라, 입력 범위가 작은 값은 키 없는 해시로 감출 수 없다</text>
</svg>
