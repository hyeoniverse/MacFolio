<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">필터 6개를 쓰는 컨볼루션층</text>
  <!-- input volume -->
  <text x="80" y="64" text-anchor="middle" font-size="13" fill="#ff3b30">3×32×32 영상</text>
  <polygon points="60,100 80,82 80,212 60,230" fill="#f9dcdc" stroke="#1d1d1f"/>
  <polygon points="60,100 80,82 92,82 72,100" fill="#f4c7c7" stroke="#1d1d1f"/>
  <rect x="60" y="100" width="12" height="130" fill="#fbe9e9" stroke="#1d1d1f"/>
  <text x="100" y="160" font-size="12" fill="#6e6e73">32</text>
  <text x="86" y="228" font-size="12" fill="#6e6e73">32</text>
  <text x="56" y="246" font-size="12" fill="#6e6e73">3</text>
  <!-- conv box -->
  <rect x="240" y="120" width="140" height="56" rx="4" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/>
  <text x="310" y="153" text-anchor="middle" font-size="15" fill="#1d1d1f">컨볼루션층</text>
  <line x1="120" y1="148" x2="236" y2="148" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="148" x2="472" y2="148" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="310" y="80" text-anchor="middle" font-size="12.5" fill="#1d1d1f">3×5×5 크기 필터 6개</text>
  <!-- filters -->
  <g stroke="#1d1d1f">
    <rect x="258" y="226" width="12" height="34" fill="#c9d8f2"/>
    <rect x="272" y="226" width="12" height="34" fill="#cfe8c7"/>
    <rect x="286" y="226" width="12" height="34" fill="#f2d0d0"/>
    <rect x="300" y="226" width="12" height="34" fill="#e1d0ee"/>
    <rect x="314" y="226" width="12" height="34" fill="#c9d8f2"/>
    <rect x="328" y="226" width="12" height="34" fill="#f6e3c6"/>
  </g>
  <line x1="300" y1="220" x2="300" y2="182" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="244" y="240" text-anchor="end" font-size="12.5" fill="#1d1d1f">6×3×5×5</text>
  <text x="244" y="256" text-anchor="end" font-size="12.5" fill="#1d1d1f">필터</text>
  <!-- outputs: 6 maps -->
  <g stroke="#1d1d1f">
    <polygon points="490,96 506,82 506,192 490,206" fill="#c9d8f2"/>
    <polygon points="500,96 516,82 516,192 500,206" fill="#cfe8c7"/>
    <polygon points="510,96 526,82 526,192 510,206" fill="#f2d0d0"/>
    <polygon points="520,96 536,82 536,192 520,206" fill="#e1d0ee"/>
    <polygon points="530,96 546,82 546,192 530,206" fill="#c9d8f2"/>
    <polygon points="540,96 556,82 556,192 540,206" fill="#f6e3c6"/>
  </g>
  <text x="525" y="56" text-anchor="middle" font-size="12.5" fill="#1d1d1f">활성 맵 6장</text>
  <text x="525" y="72" text-anchor="middle" font-size="12.5" fill="#1d1d1f">(각 1×28×28)</text>
  <text x="525" y="236" text-anchor="middle" font-size="12.5" fill="#1d1d1f">활성 맵을 쌓아</text>
  <text x="525" y="252" text-anchor="middle" font-size="12.5" fill="#0a84ff" font-weight="600">6×28×28 출력</text>
</svg>
