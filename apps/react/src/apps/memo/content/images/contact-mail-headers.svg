<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>서버가 보내는 메일의 헤더 예시. From은 인증한 도메인, Reply-To는 방문자 주소라서 운영자가 답장하면 방문자에게 간다</title>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
</defs>
<rect width="640" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">운영자가 받는 메일 (예시)</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">방문자 홍길동(visitor@example.com)이 제목 "문의드립니다"로 보낸 경우</text>

<rect x="24" y="70" width="380" height="250" rx="10" fill="#f2f2f7"/>
<g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">
<text x="40" y="96"><tspan fill="#6e6e73">From:</tspan> contact@hyeoniverse.com</text>
<text x="40" y="118"><tspan fill="#6e6e73">To:</tspan> &lt;운영자, CONTACT_TO&gt;</text>
<text x="40" y="140"><tspan fill="#6e6e73">Reply-To:</tspan> <tspan fill="#0a84ff" font-weight="700">visitor@example.com</tspan></text>
<text x="40" y="162"><tspan fill="#6e6e73">Subject:</tspan> [MacFolio] 문의드립니다</text>
<line x1="40" y1="176" x2="388" y2="176" stroke="#c7c7cc"/>
<text x="40" y="198">포트폴리오 잘 봤습니다. ...</text>
<text x="40" y="226">---</text>
<text x="40" y="248">보낸 사람: 홍길동</text>
<text x="40" y="266">  &lt;visitor@example.com&gt;</text>
<text x="40" y="288" fill="#6e6e73">(MacFolio 메일 앱에서 보냄.</text>
<text x="40" y="306" fill="#6e6e73"> 답장하면 보낸 사람에게 갑니다)</text>
</g>

<path d="M404 136 C 450 136, 450 136, 470 136" stroke="#0a84ff" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<rect x="472" y="100" width="144" height="74" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="544" y="124" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">답장 버튼</text>
<text x="544" y="144" font-size="12" fill="#1d1d1f" text-anchor="middle">받는 사람 칸에</text>
<text x="544" y="162" font-size="12" fill="#0a84ff" text-anchor="middle">visitor@example.com</text>

<rect x="24" y="338" width="592" height="78" rx="10" fill="#ffffff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="38" y="362" font-size="12" font-weight="700" fill="#ff3b30">From에 방문자 주소를 넣으면</text>
<text x="38" y="382" font-size="12" fill="#1d1d1f">example.com의 SPF·DKIM으로 인증되지 않은 메일이 된다. 받는 서버의 DMARC 검사는</text>
<text x="38" y="400" font-size="12" fill="#1d1d1f">From 도메인과 인증된 도메인의 일치를 확인하므로, 스팸으로 분류되거나 거절될 수 있다</text>
</svg>
