<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>로딩 화면의 클릭을 소리 준비에 쓴다</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">로딩 화면의 클릭을 소리 준비에 쓴다</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">브라우저는 사용자가 한 번 누르기 전에는 AudioContext를 멈춰 둔다 (자동 재생 정책)</text>
<line x1="40" y1="110" x2="820" y2="110" stroke="#9ca3af" stroke-width="2"/>
<circle cx="80" cy="110" r="8" fill="#6b7280"/>
<text x="80" y="90" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">페이지 열림</text>
<text x="80" y="138" font-size="11" fill="#6b7280" text-anchor="middle">AudioContext 못 씀</text>
<circle cx="260" cy="110" r="8" fill="#4f46e5"/>
<text x="260" y="90" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">로딩 화면 클릭</text>
<text x="260" y="138" font-size="11" fill="#6b7280" text-anchor="middle">시작음 · 딸깍은 없음</text>
<circle cx="560" cy="110" r="8" fill="#b45309"/>
<text x="560" y="90" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">로딩 막대 3초</text>
<text x="560" y="138" font-size="11" fill="#6b7280" text-anchor="middle">그 사이 준비 끝</text>
<circle cx="760" cy="110" r="8" fill="#15803d"/>
<text x="760" y="90" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">데스크톱 첫 클릭</text>
<text x="760" y="138" font-size="11" fill="#6b7280" text-anchor="middle">바로 딸깍</text>
<rect x="200" y="170" width="440" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="420.0" y="208.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">warmUp()</text>
<text x="420.0" y="225.5" font-size="11" fill="#374151" text-anchor="middle">new AudioContext()</text>
<text x="420.0" y="242.5" font-size="11" fill="#374151" text-anchor="middle">fetch mouse-down.mp3 · mouse-up.mp3 (각 3,133바이트)</text>
<text x="420.0" y="259.5" font-size="11" fill="#374151" text-anchor="middle">decodeAudioData → buffers 두 개</text>
<line x1="260" y1="120" x2="330" y2="168" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="670" y="170" width="170" height="120" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="755.0" y="208.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">play(phase)</text>
<text x="755.0" y="225.5" font-size="11" fill="#374151" text-anchor="middle">createBufferSource</text>
<text x="755.0" y="242.5" font-size="11" fill="#374151" text-anchor="middle">buffer 공유</text>
<text x="755.0" y="259.5" font-size="11" fill="#374151" text-anchor="middle">gain 0.4 → start</text>
<line x1="760" y1="120" x2="755" y2="168" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
</svg>
