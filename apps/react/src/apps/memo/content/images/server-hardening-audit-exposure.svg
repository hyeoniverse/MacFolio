<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>인터넷에서 Oracle Security List를 지나 서버에 닿는 길은 22번 SSH뿐이다. API는 cloudflared가 서버에서 밖으로 건 터널로 요청을 받고, compose의 컨테이너는 호스트 포트를 열지 않는다</title><defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="800" height="320" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">바깥에서 닿는 길은 SSH 하나</text>
<rect x="32" y="70" width="140" height="60" rx="10" fill="#f3f4f6"/>
<text x="102.0" y="96.5" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">관리자</text>
<text x="102.0" y="115.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">SSH 키</text>
<rect x="32" y="170" width="140" height="60" rx="10" fill="#f3f4f6"/>
<text x="102.0" y="197.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">방문자</text>
<text x="102.0" y="215.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">https://macfolio-api…</text>
<rect x="222" y="170" width="140" height="60" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="292.0" y="196.5" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">Cloudflare</text>
<text x="292.0" y="215.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">Tunnel 끝</text>
<path d="M172 200 H220" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="412" y="52" width="356" height="210" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
<text x="428" y="74" font-size="11" font-weight="600" fill="#374151" text-anchor="start">Oracle VM (Security List · ss -lntu: 0.0.0.0:22만)</text>
<rect x="428" y="90" width="120" height="40" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="488.0" y="106.75" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle">sshd :22</text>
<text x="488.0" y="124.5" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">키만</text>
<path d="M172 100 H426" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#good)"/>
<text x="300" y="92" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">22번만</text>
<rect x="428" y="170" width="100" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="478.0" y="196.75" font-size="12" font-weight="600" fill="#4f46e5" text-anchor="middle">tunnel</text>
<text x="478.0" y="215.25" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">nonroot</text>
<rect x="540" y="170" width="100" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="590.0" y="196.75" font-size="12" font-weight="600" fill="#4f46e5" text-anchor="middle">api</text>
<text x="590.0" y="215.25" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">node</text>
<rect x="652" y="170" width="100" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="702.0" y="196.75" font-size="12" font-weight="600" fill="#4f46e5" text-anchor="middle">db</text>
<text x="702.0" y="215.25" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">postgres</text>
<path d="M440 170 C400 150 380 230 364 205" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ok)"/>
<text x="380" y="152" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">밖으로 연결</text>
<text x="428" y="250" font-size="9.8" font-weight="400" fill="#6b7280" text-anchor="start">compose.yml에 ports: 없음 · api는 Dockerfile의 USER node</text>
<text x="32" y="290" font-size="10" font-weight="400" fill="#374151" text-anchor="start">ops/audit.sh가 넷(SSH 키만, 포트 22뿐, root 아님, 자동 보안 업데이트)을 읽어 OK/확인을 찍고, 확인이 있으면 1로 끝난다. 아무것도 바꾸지 않는다.</text>
</svg>
