<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>요청은 Express 미들웨어를 거친 뒤 NestJS의 파이프와 핸들러에 도달한다. 본문 크기 오류는 미들웨어 단계에서 http-errors 객체로 발생해 전역 예외 필터에 도달한다</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker>
</defs>
<rect width="640" height="380" fill="#ffffff"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1d1d1f">요청이 핸들러에 도달하기까지와 오류가 생기는 위치</text>
<rect x="104" y="50" width="250" height="122" rx="10" fill="#f2f2f7"/>
<text x="116" y="70" font-size="12" fill="#6e6e73">Express 미들웨어 (app.use)</text>
<rect x="366" y="50" width="250" height="122" rx="10" fill="#e8f1ff"/>
<text x="378" y="70" font-size="12" fill="#0a84ff">NestJS</text>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<rect x="24" y="96" width="64" height="48" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="56" y="125">요청</text>
<rect x="116" y="84" width="104" height="72" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="168" y="108">helmet</text>
<text x="168" y="126">cors</text>
<text x="168" y="144">cookieParser</text>
<rect x="236" y="84" width="106" height="72" rx="8" fill="#fff4e0" stroke="#ff9f0a"/>
<text x="289" y="106">body-parser</text>
<text x="289" y="124" font-size="12" fill="#6e6e73">JSON 100KB</text>
<text x="289" y="142" font-size="12" fill="#6e6e73">text 32KB</text>
<rect x="378" y="84" width="104" height="72" rx="8" fill="#ffffff" stroke="#0a84ff"/>
<text x="430" y="114">가드·파이프</text>
<text x="430" y="134" font-size="12" fill="#6e6e73">ValidationPipe</text>
<rect x="498" y="84" width="106" height="72" rx="8" fill="#ffffff" stroke="#0a84ff"/>
<text x="551" y="114">핸들러</text>
<text x="551" y="134" font-size="12" fill="#6e6e73">서비스 → DB</text>
</g>
<g stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)">
<line x1="88" y1="120" x2="114" y2="120"/>
<line x1="220" y1="120" x2="234" y2="120"/>
<line x1="342" y1="120" x2="376" y2="120"/>
<line x1="482" y1="120" x2="496" y2="120"/>
</g>
<g stroke="#ff3b30" stroke-width="1.5" fill="none" marker-end="url(#ar)">
<path d="M289 156 V258"/>
<path d="M430 156 V258"/>
<path d="M551 156 V258"/>
</g>
<g font-size="12" fill="#1d1d1f">
<rect x="160" y="186" width="160" height="58" rx="6" fill="#ffffff" stroke="#ff3b30"/>
<text x="170" y="204" font-family="ui-monospace, Menlo, monospace" font-size="12">status: 413</text>
<text x="170" y="220" font-family="ui-monospace, Menlo, monospace" font-size="12">expose: true</text>
<text x="170" y="236" font-family="ui-monospace, Menlo, monospace" font-size="12">entity.too.large</text>
<rect x="364" y="194" width="124" height="42" rx="6" fill="#ffffff" stroke="#ff3b30"/>
<text x="426" y="212" text-anchor="middle">HttpException</text>
<text x="426" y="228" text-anchor="middle" fill="#6e6e73">400·404 등</text>
<rect x="500" y="194" width="116" height="42" rx="6" fill="#ffffff" stroke="#ff3b30"/>
<text x="558" y="212" text-anchor="middle">일반 Error</text>
<text x="558" y="228" text-anchor="middle" fill="#6e6e73">DB 연결 실패 등</text>
</g>
<rect x="160" y="260" width="456" height="50" rx="10" fill="#1d1d1f"/>
<text x="388" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">전역 예외 필터 (HttpErrorFilter, @Catch())</text>
<text x="388" y="300" text-anchor="middle" font-size="12" fill="#d2d2d7">모든 예외를 { statusCode, error, message, path, timestamp } 응답 하나로 변환</text>
<text x="24" y="338" font-size="12" fill="#6e6e73">body-parser의 오류는 NestJS의 HttpException이 아닌 http-errors 객체라서, 수정 전 필터는</text>
<text x="24" y="356" font-size="12" fill="#6e6e73">이를 알 수 없는 예외로 판단해 500으로 응답했다.</text>
</svg>
