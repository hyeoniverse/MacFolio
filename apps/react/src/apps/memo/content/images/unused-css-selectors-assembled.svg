<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>글자로 찾으면 놓치는 경우. CSS의 .sky-rain은 코드에 sky-rain이라는 글자가 없고 sky- 와 값이 합쳐져 만들어진다</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="760" height="230" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">왜 글자 찾기만으로는 못 지우나</text>
<rect x="32" y="62" width="200" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="132" y="86" font-size="11" fill="#6b7280" text-anchor="middle">Weather.css</text>
<text x="132" y="106" font-size="12" fill="#1f2937" text-anchor="middle">.sky-rain { … }</text>
<rect x="290" y="62" width="250" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="415" y="86" font-size="11" fill="#6b7280" text-anchor="middle">Weather.tsx</text>
<text x="415" y="106" font-size="12" fill="#1f2937" text-anchor="middle">`weather sky-${weather?.sky}`</text>
<rect x="590" y="62" width="140" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="660" y="86" font-size="11" fill="#6b7280" text-anchor="middle">실제 화면</text>
<text x="660" y="106" font-size="12" fill="#1f2937" text-anchor="middle">class="sky-rain"</text>
<path d="M542 90 H588" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="32" y="140" width="698" height="64" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="48" y="164" font-size="11.5" fill="#1f2937">"sky-rain"이라는 글자는 소스 어디에도 없다 → 글자 찾기는 '안 쓴다'고 판단</text>
<text x="48" y="186" font-size="11.5" fill="#1f2937">PurgeCSS 같은 도구를 그대로 돌리면 비 오는 날 하늘 색이 사라진다</text>
</svg>
