<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>배포 키로 접속하면 sshd가 authorized_keys의 command= 옵션에 따라 클라이언트가 보낸 명령 대신 deploy.sh를 실행하고, 보낸 문자열은 SSH_ORIGINAL_COMMAND로 전달된다. deploy.sh는 sha-16진수 7~40자리 형식만 배포하고 그 밖은 종료 코드 2로 끝낸다</title>
<defs>
<marker id="fc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
<marker id="fc-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34c759"/></marker>
<marker id="fc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/></marker>
</defs>
<rect width="640" height="370" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">배포 키로 접속하면 실행되는 것</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">클라이언트가 보낸 명령은 실행되지 않고, 문자열로만 전달된다</text>

<rect x="24" y="74" width="180" height="96" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="114" y="98" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">GitHub Actions</text>
<text x="114" y="120" font-size="12" fill="#6e6e73" text-anchor="middle">배포 키로 SSH 접속</text>
<text x="114" y="144" font-size="12" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">ssh ubuntu@서버</text>
<text x="114" y="160" font-size="12" fill="#0a84ff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">sha-1a2b3c4</text>

<path d="M204 122 H238" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#fc-g)"/>

<rect x="242" y="74" width="374" height="96" rx="10" fill="#eef6ff" stroke="#0a84ff"/>
<text x="258" y="98" font-size="14" font-weight="700" fill="#1d1d1f">서버의 sshd: authorized_keys 줄 확인</text>
<text x="258" y="120" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">restrict,command="…/ops/deploy.sh" ssh-ed25519 …</text>
<text x="258" y="142" font-size="12" fill="#1d1d1f">restrict: 포트·에이전트 포워딩, 터미널 할당 차단</text>
<text x="258" y="160" font-size="12" fill="#1d1d1f">command=: 보낸 명령 대신 deploy.sh 실행</text>

<path d="M429 170 V196" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#fc-g)"/>
<rect x="242" y="200" width="374" height="58" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="258" y="222" font-size="13" font-weight="700" fill="#1d1d1f">ops/deploy.sh 실행</text>
<text x="258" y="244" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">SSH_ORIGINAL_COMMAND="sha-1a2b3c4"</text>

<path d="M330 258 V286" stroke="#34c759" stroke-width="1.5" marker-end="url(#fc-gr)"/>
<path d="M528 258 V286" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#fc-r)"/>
<text x="429" y="278" font-size="12" fill="#6e6e73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">sha-[0-9a-f]{7,40}?</text>

<rect x="242" y="290" width="176" height="64" rx="10" fill="#f0faf2" stroke="#34c759"/>
<text x="254" y="312" font-size="12" font-weight="700" fill="#248a3d">형식이 맞음</text>
<text x="254" y="330" font-size="12" fill="#1d1d1f">그 태그의 이미지로</text>
<text x="254" y="346" font-size="12" fill="#1d1d1f">백업·교체·확인</text>

<rect x="440" y="290" width="176" height="64" rx="10" fill="#fff5f4" stroke="#ff3b30"/>
<text x="452" y="312" font-size="12" font-weight="700" fill="#ff3b30">형식이 다름</text>
<text x="452" y="330" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">sha-abc; rm -rf /</text>
<text x="452" y="346" font-size="12" fill="#1d1d1f">"태그 모양이 아니다", 종료 2</text>

<rect x="24" y="200" width="196" height="154" rx="10" fill="#fff8ec" stroke="#ff9f0a"/>
<text x="36" y="222" font-size="13" font-weight="700" fill="#c46f00">키가 유출되어도</text>
<text x="36" y="246" font-size="12" fill="#1d1d1f">셸을 얻을 수 없다</text>
<text x="36" y="266" font-size="12" fill="#1d1d1f">다른 명령을 실행할 수 없다</text>
<text x="36" y="286" font-size="12" fill="#1d1d1f">터널을 열 수 없다</text>
<text x="36" y="314" font-size="12" fill="#6e6e73">가능한 일은 레지스트리에</text>
<text x="36" y="332" font-size="12" fill="#6e6e73">이미 있는 태그로 배포하는 것</text>
</svg>
