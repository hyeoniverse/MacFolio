<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>정적 사이트에서 브라우저 비밀번호 검사가 막지 못하는 것</title>
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">브라우저에서 검사하면 정답도 브라우저에 있다</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">정적 호스팅은 모든 방문자에게 같은 JS 파일을 보낸다</text>
  <rect x="24" y="80" width="170" height="90" rx="10" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="109" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1f">정적 호스팅</text>
  <text x="109" y="130" font-size="12" text-anchor="middle" fill="#6e6e73">index.html</text>
  <text x="109" y="148" font-size="12" text-anchor="middle" fill="#6e6e73">assets/index-….js</text>
  <path d="M194 125 H262" stroke="#1d1d1f" stroke-width="2"/><path d="M270 125 l-10 -5 v10z" fill="#1d1d1f"/>
  <text x="232" y="116" font-size="12" text-anchor="middle" fill="#6e6e73">같은 파일</text>
  <rect x="272" y="80" width="344" height="150" rx="10" fill="#ffffff" stroke="#ff3b30" stroke-width="2"/>
  <text x="288" y="104" font-size="13" font-weight="700" fill="#1d1d1f">방문자 브라우저의 번들 (예시 코드)</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1d1d1f">
    <text x="288" y="130">const HASH = <tspan fill="#ff3b30">'9f86d08…'</tspan></text>
    <text x="288" y="150">if (sha256(input) === HASH)</text>
    <text x="288" y="170">  canEdit = true</text>
  </g>
  <text x="288" y="198" font-size="12" fill="#ff3b30">개발자 도구 Sources 탭에서 해시와 분기를 모두 확인</text>
  <text x="288" y="218" font-size="12" fill="#ff3b30">콘솔에서 canEdit = true로 바꾸면 검사 생략</text>
  <rect x="24" y="250" width="592" height="72" rx="10" fill="#f2f2f7"/>
  <text x="40" y="276" font-size="13" font-weight="700" fill="#1d1d1f">검사를 통과해도 결과는 localStorage에만 남는다</text>
  <text x="40" y="300" font-size="12" fill="#6e6e73">관리자 브라우저에 저장한 폴더 구조는 서버로 가지 않으므로, 다른 방문자 화면은 그대로다</text>
</svg>
