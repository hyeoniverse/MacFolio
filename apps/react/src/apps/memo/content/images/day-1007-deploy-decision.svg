<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>API 배포 판단 기준: 직전 push 대비와 서버 실행 버전 대비</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<text x="20" y="28" font-size="13" font-weight="700" fill="#1d1d1f">main의 커밋 순서</text>
<line x1="60" y1="70" x2="580" y2="70" stroke="#c7c7cc" stroke-width="2"/>
<circle cx="100" cy="70" r="12" fill="#34c759"/>
<text x="100" y="102" font-size="12" fill="#1d1d1f" text-anchor="middle">이전 커밋</text>
<text x="100" y="120" font-size="12" fill="#34c759" text-anchor="middle">서버에서 실행 중</text>
<circle cx="320" cy="70" r="12" fill="#ff3b30"/>
<text x="320" y="102" font-size="12" fill="#1d1d1f" text-anchor="middle">#115 · API 변경 있음</text>
<text x="320" y="120" font-size="12" fill="#ff3b30" text-anchor="middle">메뉴 시험 실패 → 배포 단계 없음</text>
<circle cx="540" cy="70" r="12" fill="#0a84ff"/>
<text x="540" y="102" font-size="12" fill="#1d1d1f" text-anchor="middle">#116 · API 변경 없음</text>
<text x="540" y="120" font-size="12" fill="#0a84ff" text-anchor="middle">CI 통과</text>
<rect x="20" y="146" width="600" height="92" rx="10" fill="#fff1f0"/>
<text x="34" y="170" font-size="13" font-weight="700" fill="#ff3b30">변경 전: 직전 push와 비교</text>
<path d="M320 196 H 536" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#a)"/>
<text x="428" y="190" font-size="12" fill="#1d1d1f" text-anchor="middle">#115 → #116 차이</text>
<text x="34" y="200" font-size="12" fill="#1d1d1f">git diff #115 #116 -- apps/api</text>
<text x="34" y="224" font-size="12" fill="#ff3b30">API 경로에 차이 없음 → 배포 생략. #115의 API 변경은 어느 실행에서도 배포되지 않는다</text>
<rect x="20" y="252" width="600" height="92" rx="10" fill="#ecfaef"/>
<text x="34" y="276" font-size="13" font-weight="700" fill="#34c759">변경 후 (#118): 서버의 /health version과 비교</text>
<path d="M100 302 H 536" stroke="#34c759" stroke-width="1.5" marker-end="url(#a)"/>
<text x="318" y="296" font-size="12" fill="#1d1d1f" text-anchor="middle">실행 중인 버전 → #116 차이 (#115 포함)</text>
<text x="34" y="330" font-size="12" fill="#1d1d1f">git diff &lt;서버 version&gt; #116 -- apps/api ... → 차이 있음 → 배포. 서버가 최신 main을 따라잡는다</text>
</svg>
