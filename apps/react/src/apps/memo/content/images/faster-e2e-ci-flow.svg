<line x1="480" y1="210" x2="528" y2="240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="300" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">배포 조건: e2e 성공  또는  e2e-reuse가 같은 트리의 통과 기록을 찾음</text>
<text x="380" y="320" font-size="11" fill="#6b7280" text-anchor="middle">e2e가 &quot;건너뛰어졌다&quot;는 것만으로는 배포하지 않는다</text>
<text x="380" y="350" font-size="11" fill="#6b7280" text-anchor="middle">트리가 다른 경우: 그사이 다른 PR이 먼저 머지됐거나, PR 없이 main에 push했을 때</text>
