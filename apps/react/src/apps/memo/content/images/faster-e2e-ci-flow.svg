<text x="635.0" y="236.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">아니오 → e2e 6칸 다 돌림</text>
<text x="635.0" y="251.5" font-size="10.0" fill="#4b5563" text-anchor="middle">통과하면 배포</text>
