<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>PR 미리보기 주소에서 CORS로 막힌 /health 요청</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="200" height="56" rx="10" fill="#f2f2f7"/>
<text x="120" y="44" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">미리보기 페이지</text>
<text x="120" y="63" font-size="12" fill="#6e6e73" text-anchor="middle">feat-x-macfolio...workers.dev</text>
<rect x="420" y="20" width="200" height="56" rx="10" fill="#f2f2f7"/>
<text x="520" y="44" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">API 서버</text>
<text x="520" y="63" font-size="12" fill="#34c759" text-anchor="middle">정상 동작 중</text>
<line x1="220" y1="104" x2="416" y2="104" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="318" y="96" font-size="12" fill="#1d1d1f" text-anchor="middle">GET /health · Origin: 미리보기 주소</text>
<rect x="420" y="118" width="200" height="56" rx="8" fill="#ffffff" stroke="#6e6e73"/>
<text x="520" y="140" font-size="12" fill="#1d1d1f" text-anchor="middle">허용 목록에 이 Origin 없음</text>
<text x="520" y="159" font-size="12" fill="#6e6e73" text-anchor="middle">→ CORS 허용 헤더 생략</text>
<line x1="416" y1="196" x2="224" y2="196" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
<text x="320" y="188" font-size="12" fill="#1d1d1f" text-anchor="middle">200 OK (Access-Control-Allow-Origin 없음)</text>
<rect x="20" y="210" width="300" height="74" rx="8" fill="#fff1f0" stroke="#ff3b30"/>
<text x="34" y="232" font-size="12" fill="#1d1d1f">브라우저가 응답을 페이지에 넘기지 않음</text>
<text x="34" y="252" font-size="12" fill="#6e6e73">fetch는 TypeError: Failed to fetch</text>
<text x="34" y="272" font-size="12" fill="#ff3b30">메뉴 막대: "서버에 연결할 수 없음"</text>
<rect x="340" y="210" width="280" height="74" rx="8" fill="#ecfaef" stroke="#34c759"/>
<text x="354" y="232" font-size="12" font-weight="600" fill="#1d1d1f">#115: 허용 목록에 이름 한 칸 와일드카드</text>
<text x="354" y="254" font-size="12" fill="#6e6e73">https://*-macfolio.hyeoniverse</text>
<text x="354" y="272" font-size="12" fill="#6e6e73">.workers.dev</text>
</svg>
