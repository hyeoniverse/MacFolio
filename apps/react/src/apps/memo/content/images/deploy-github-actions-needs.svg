<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>check와 e2e, api-changes가 끝나면 api-image와 api-deploy를 거쳐 마지막에 deploy가 돈다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="900" height="370" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">main에 push했을 때 작업 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">.github/workflows/ci.yml의 needs (10월 19일 기준)</text>
<rect x="32" y="90" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="117.0" y="112" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">check</text><text x="117.0" y="132" font-size="10.5" fill="#374151" text-anchor="middle">검사·단위·빌드·API e2e</text><rect x="32" y="170" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="117.0" y="192" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">e2e / e2e-reuse</text><text x="117.0" y="212" font-size="10.5" fill="#374151" text-anchor="middle">화면 E2E 6칸</text><text x="117.0" y="228" font-size="10.5" fill="#374151" text-anchor="middle">같은 트리면 다시 안 돎</text><rect x="32" y="250" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="117.0" y="272" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">api-changes</text><text x="117.0" y="292" font-size="10.5" fill="#374151" text-anchor="middle">API가 바뀌었나</text><rect x="262" y="170" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="347.0" y="192" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">api-image</text><text x="347.0" y="212" font-size="10.5" fill="#374151" text-anchor="middle">API 이미지 빌드</text><text x="347.0" y="228" font-size="10.5" fill="#374151" text-anchor="middle">(바뀌었을 때만)</text><rect x="492" y="170" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="577.0" y="192" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">api-deploy</text><text x="577.0" y="212" font-size="10.5" fill="#374151" text-anchor="middle">서버에 새 이미지</text><text x="577.0" y="228" font-size="10.5" fill="#374151" text-anchor="middle">(deploy-api.yml)</text><rect x="722" y="170" width="150" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="797.0" y="192" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">deploy</text><text x="797.0" y="212" font-size="10.5" fill="#374151" text-anchor="middle">wrangler deploy</text><text x="797.0" y="228" font-size="10.5" fill="#374151" text-anchor="middle">프론트엔드</text><line x1="204" y1="120" x2="260" y2="190" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><line x1="204" y1="200" x2="260" y2="200" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><line x1="204" y1="280" x2="260" y2="212" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><line x1="434" y1="200" x2="490" y2="200" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><line x1="664" y1="200" x2="720" y2="200" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><path d="M204 112 C 500 60, 700 80, 790 168" fill="none" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="560" y="64" font-size="10" fill="#6b7280" text-anchor="middle">deploy는 check·e2e도 직접 기다린다</text><text x="32" y="346" font-size="11" fill="#6b7280">처음(#82)에는 check → deploy 한 줄이었다. API가 바뀌면 API가 먼저, 프론트엔드가 나중에 바뀐다</text>
</svg>
