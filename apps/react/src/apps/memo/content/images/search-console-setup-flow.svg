<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>Search Console 연결 구성. Google Cloud에서 만든 서비스 계정을 Search Console 속성에 제한됨 사용자로 추가하고, 키의 두 값과 속성 주소를 서버 api.env에 넣으면 API가 6시간마다 검색어를 가져와 검색어 탭에 표시한다. 사이트맵은 Worker가 생성해 Search Console에 제출한다</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="860" height="440" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">Search Console 연결 구성</text>
<text x="32" y="56" font-size="11.5" fill="#6b7280">숫자는 설정 순서. 회색 화살표는 설정할 때 한 번, 파란 화살표는 운영 중 반복되는 흐름</text>

<rect x="32" y="80" width="250" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="104" font-size="13.5" fill="#111827" font-weight="700">① Search Console</text>
<text x="48" y="126" font-size="11.5" fill="#374151">속성: URL 접두어</text>
<text x="48" y="144" font-size="11" fill="#6b7280">https://macfolio.hyeoniverse.com/</text>
<text x="48" y="166" font-size="11.5" fill="#374151">Sitemaps: sitemap.xml 제출</text>
<text x="48" y="188" font-size="11.5" fill="#374151">③ 사용자 및 권한</text>
<text x="48" y="206" font-size="11" fill="#6b7280">②의 서비스 계정 이메일 · 제한됨</text>

<rect x="305" y="80" width="250" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="321" y="104" font-size="13.5" fill="#111827" font-weight="700">② Google Cloud</text>
<text x="321" y="126" font-size="11.5" fill="#374151">프로젝트 (기존 것 재사용 가능)</text>
<text x="321" y="146" font-size="11.5" fill="#374151">Search Console API 사용 설정</text>
<text x="321" y="166" font-size="11.5" fill="#374151">서비스 계정 (역할 없음)</text>
<text x="321" y="186" font-size="11.5" fill="#374151">JSON 키 내려받기</text>
<text x="321" y="206" font-size="11" fill="#6b7280">client_email · private_key</text>

<rect x="578" y="80" width="250" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="594" y="104" font-size="13.5" fill="#111827" font-weight="700">④ 서버 ~/deploy/api.env</text>
<text x="594" y="128" font-size="11.5" fill="#374151">GSC_SITE_URL</text>
<text x="594" y="148" font-size="11.5" fill="#374151">GSC_CLIENT_EMAIL</text>
<text x="594" y="168" font-size="11.5" fill="#374151">GSC_PRIVATE_KEY</text>
<text x="594" y="192" font-size="11" fill="#6b7280">scp로 옮긴 키에서 두 값만 추출하고</text>
<text x="594" y="208" font-size="11" fill="#6b7280">키 파일은 삭제</text>

<path d="M305 196 H288" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M555 186 H572" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="578" y="290" width="250" height="122" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="594" y="314" font-size="13.5" fill="#1e1b4b" font-weight="700">MacFolio API</text>
<text x="594" y="336" font-size="11.5" fill="#3730a3">6시간마다 JWT(RS256) 서명</text>
<text x="594" y="356" font-size="11.5" fill="#3730a3">searchAnalytics.query</text>
<text x="594" y="376" font-size="11" fill="#4f46e5">Search Console API에서 날짜·검색어·</text>
<text x="594" y="392" font-size="11" fill="#4f46e5">페이지별 노출·클릭·순위를 가져온다</text>
<path d="M703 230 V284" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="305" y="290" width="250" height="122" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="321" y="314" font-size="13.5" fill="#1e1b4b" font-weight="700">활동 상태 보기 › 검색어</text>
<text x="321" y="336" font-size="11.5" fill="#3730a3">관리자만 조회</text>
<text x="321" y="356" font-size="11.5" fill="#3730a3">⑤ 지금 가져오기로 첫 동기화</text>
<text x="321" y="376" font-size="11" fill="#4f46e5">처음에는 16개월치</text>
<path d="M578 345 H561" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ab)"/>

<rect x="32" y="290" width="250" height="122" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="48" y="314" font-size="13.5" fill="#1e1b4b" font-weight="700">Cloudflare Worker</text>
<text x="48" y="336" font-size="11.5" fill="#3730a3">sitemap.xml 생성</text>
<text x="48" y="356" font-size="11" fill="#4f46e5">저장소 글 + 서버 글 + 프로젝트</text>
<text x="48" y="376" font-size="11" fill="#4f46e5">robots.txt에 주소 명시</text>
<path d="M157 290 V236" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ab)"/>
</svg>
