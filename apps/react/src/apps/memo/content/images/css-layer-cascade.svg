<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>층 밖의 규칙이 층 안의 규칙을 이긴다</title>
  <rect width="640" height="360" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">같은 단추, 두 규칙</text>
  <text x="32" y="68" font-size="12" fill="#6b7280">브라우저는 층을 먼저 비교하고, 층이 같을 때만 선택자 점수를 본다</text>

  <!-- 전 -->
  <g>
    <text x="32" y="104" font-size="14" font-weight="700" fill="#374151">전: 둘 다 층 밖</text>
    <rect x="32" y="118" width="280" height="44" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="46" y="138" font-size="12" fill="#15803d" font-family="ui-monospace, Menlo, monospace">.memo button  (0,1,1)</text>
    <text x="46" y="154" font-size="11" fill="#15803d">color: inherit → 이긴다</text>
    <rect x="32" y="172" width="280" height="44" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="46" y="192" font-size="12" fill="#b91c1c" font-family="ui-monospace, Menlo, monospace">.memo-writer-publish  (0,1,0)</text>
    <text x="46" y="208" font-size="11" fill="#b91c1c">color: #2b2100 → 진다 (그래서 !important)</text>
  </g>

  <!-- 후 -->
  <g>
    <text x="340" y="104" font-size="14" font-weight="700" fill="#374151">후: 기본값을 reset 층에</text>
    <rect x="340" y="118" width="268" height="98" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="5 4"/>
    <text x="354" y="138" font-size="11" fill="#9ca3af">@layer reset</text>
    <rect x="354" y="146" width="240" height="56" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="368" y="168" font-size="12" fill="#b91c1c" font-family="ui-monospace, Menlo, monospace">.memo button  (0,1,1)</text>
    <text x="368" y="186" font-size="11" fill="#b91c1c">점수가 높아도 층 안이라 진다</text>
    <rect x="340" y="226" width="268" height="44" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="354" y="246" font-size="12" fill="#15803d" font-family="ui-monospace, Menlo, monospace">.memo-writer-publish  (0,1,0)</text>
    <text x="354" y="262" font-size="11" fill="#15803d">층 밖이라 이긴다, !important 없이</text>
  </g>

  <path d="M32 296 H608" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="32" y="322" font-size="12" fill="#374151">층 순서는 styles/layers.css 한 줄로 정한다:  @layer reset;</text>
  <text x="32" y="342" font-size="12" fill="#6b7280">층 밖(평소에 쓰는 모든 규칙) &gt; reset 층 &gt; 브라우저 기본</text>
</svg>
