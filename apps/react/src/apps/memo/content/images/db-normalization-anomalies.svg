<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">수강(학번, 과목번호, 성적, 학년)에서 일어나는 세 가지 이상</text>
  <g font-size="12" fill="#1d1d1f">
    <rect x="20" y="46" width="300" height="26" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="32" y="64" text-decoration="underline">학번</text><text x="100" y="64" text-decoration="underline">과목번호</text><text x="190" y="64">성적</text><text x="260" y="64">학년</text>
    <rect x="20" y="72" width="300" height="26" fill="#fff0ef" stroke="#ff3b30"/>
    <text x="32" y="90">200</text><text x="100" y="90">C123</text><text x="190" y="90">B</text><text x="260" y="90">3</text>
    <rect x="20" y="104" width="300" height="26" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="32" y="122">400</text><text x="100" y="122">C312</text><text x="190" y="122">A</text><text x="260" y="122" font-weight="600">4 → 3</text>
    <rect x="20" y="130" width="300" height="26" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="32" y="148">400</text><text x="100" y="148">C324</text><text x="190" y="148">A</text><text x="260" y="148" font-weight="600">4 → 3</text>
    <rect x="20" y="156" width="300" height="26" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="32" y="174">400</text><text x="100" y="174">C413</text><text x="190" y="174">B</text><text x="260" y="174" font-weight="600">4 → ?</text>
    <rect x="20" y="182" width="300" height="26" fill="#fff4e5" stroke="#ff9f0a"/>
    <text x="32" y="200">400</text><text x="100" y="200">E412</text><text x="190" y="200">C</text><text x="260" y="200" font-weight="600">4 → ?</text>
    <rect x="20" y="214" width="300" height="26" fill="#e8f2ff" stroke="#0a84ff" stroke-dasharray="4 3"/>
    <text x="32" y="232">600</text><text x="100" y="232" fill="#ff3b30" font-weight="600">NULL</text><text x="190" y="232">-</text><text x="260" y="232">2</text>
  </g>
  <g font-size="12">
    <text x="340" y="82" font-weight="600" fill="#ff3b30">삭제 이상</text>
    <text x="340" y="100" fill="#1d1d1f">200번이 C123을 취소해 튜플을 삭제하면</text>
    <text x="340" y="116" fill="#1d1d1f">"200번은 3학년"이라는 사실도 함께 사라진다</text>
    <text x="340" y="146" font-weight="600" fill="#c46c00">갱신 이상</text>
    <text x="340" y="164" fill="#1d1d1f">400번의 학년을 바꾸려면 튜플 4개를 모두</text>
    <text x="340" y="180" fill="#1d1d1f">고쳐야 한다. 2개만 고치면 학년이 3과 4로 갈린다</text>
    <text x="340" y="222" font-weight="600" fill="#0a84ff">삽입 이상</text>
    <text x="340" y="240" fill="#1d1d1f">수강 과목이 없는 600번의 학년은 기본 키의</text>
    <text x="340" y="256" fill="#1d1d1f">과목번호가 NULL이 되어 삽입할 수 없다</text>
  </g>
  <rect x="20" y="276" width="600" height="40" rx="6" fill="#f2f2f7" stroke="#d2d2d7"/>
  <text x="320" y="301" text-anchor="middle" font-size="13" fill="#1d1d1f">원인: 학년은 학번만으로 정해지는데(학번 → 학년) 키가 {학번, 과목번호}인 릴레이션에 들어 있다</text>
</svg>
