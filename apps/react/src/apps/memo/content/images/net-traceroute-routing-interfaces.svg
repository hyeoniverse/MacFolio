<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <!-- 네트워크 1, 3 (버스) -->
  <g stroke="#1d1d1f" stroke-width="3">
    <line x1="20" y1="60" x2="220" y2="60"/>
    <line x1="420" y1="60" x2="620" y2="60"/>
  </g>
  <g stroke="#6e6e73" stroke-width="1.2">
    <line x1="50" y1="36" x2="50" y2="60"/><line x1="90" y1="36" x2="90" y2="60"/><line x1="130" y1="36" x2="130" y2="60"/><line x1="170" y1="36" x2="170" y2="60"/>
    <line x1="470" y1="36" x2="470" y2="60"/><line x1="510" y1="36" x2="510" y2="60"/><line x1="550" y1="36" x2="550" y2="60"/><line x1="590" y1="36" x2="590" y2="60"/>
    <line x1="150" y1="60" x2="150" y2="130"/>
    <line x1="490" y1="60" x2="490" y2="130"/>
    <line x1="200" y1="150" x2="440" y2="150"/>
  </g>
  <g font-size="13" fill="#6e6e73">
    <text x="20" y="84">네트워크 1</text>
    <text x="620" y="84" text-anchor="end">네트워크 3</text>
    <text x="320" y="140" text-anchor="middle">네트워크 2</text>
  </g>
  <!-- 라우터 -->
  <g fill="#e5f7ea" stroke="#1d1d1f" stroke-width="1.4">
    <rect x="100" y="130" width="100" height="40" rx="20"/>
    <rect x="440" y="130" width="100" height="40" rx="20"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">
    <text x="150" y="155">라우터 1</text>
    <text x="490" y="155">라우터 2</text>
  </g>
  <!-- 인터페이스 점 -->
  <g fill="#34c759" stroke="#1d1d1f" stroke-width="1">
    <circle cx="150" cy="130" r="6"/><circle cx="200" cy="150" r="6"/>
    <circle cx="440" cy="150" r="6"/><circle cx="490" cy="130" r="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1d1d1f">
    <text x="162" y="122">if1</text>
    <text x="206" y="172">if2</text>
    <text x="412" y="172">if3</text>
    <text x="456" y="122">if4</text>
  </g>
  <!-- 조사 방향 -->
  <line x1="60" y1="215" x2="580" y2="215" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="320" y="207" text-anchor="middle" font-size="13" fill="#0a84ff">네트워크 1 → 3 조사: if1, if3이 출력된다</text>
  <line x1="580" y1="262" x2="60" y2="262" stroke="#ff9f0a" stroke-width="1.8" marker-end="url(#o)"/>
  <text x="320" y="254" text-anchor="middle" font-size="13" fill="#ff9f0a">네트워크 3 → 1 조사: if4, if2가 출력된다</text>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#6e6e73">traceroute는 데이터그램이 들어온 인터페이스의 주소를 출력한다</text>
</svg>
