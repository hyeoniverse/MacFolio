<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>배포 A 도중 CI가 취소되어 SSH 연결이 끊겨도 trap '' HUP으로 deploy.sh A가 끝까지 실행되고, 이어서 온 배포 B는 flock 잠금에서 A가 끝나기를 기다리며, deploy-api.yml은 concurrency cancel-in-progress false로 실행을 취소하지 않고 순서대로 처리한다</title>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">배포 도중 연결이 끊기거나 다음 배포가 올 때</text>
<text x="24" y="54" font-size="12" fill="#6e6e73">가로축은 시간. 세 겹의 처리가 배포를 중간에 멈추지 않게 한다</text>

<line x1="140" y1="300" x2="616" y2="300" stroke="#d1d1d6"/>
<text x="616" y="318" font-size="12" fill="#6e6e73" text-anchor="end">시간 →</text>

<text x="24" y="96" font-size="12" font-weight="700" fill="#1d1d1f">SSH 연결 A</text>
<rect x="140" y="80" width="150" height="26" rx="6" fill="#eef6ff" stroke="#0a84ff"/>
<text x="150" y="98" font-size="12" fill="#1d1d1f">연결 중</text>
<line x1="290" y1="74" x2="290" y2="112" stroke="#ff3b30" stroke-width="2"/>
<text x="298" y="98" font-size="12" fill="#ff3b30">CI 취소로 끊김 (SIGHUP)</text>

<text x="24" y="150" font-size="12" font-weight="700" fill="#1d1d1f">deploy.sh A</text>
<rect x="140" y="134" width="300" height="26" rx="6" fill="#f0faf2" stroke="#34c759"/>
<text x="150" y="152" font-size="12" fill="#1d1d1f">백업 → 교체 → 확인, 끝까지 실행</text>
<text x="140" y="180" font-size="12" fill="#248a3d" font-family="ui-monospace, Menlo, monospace">① trap '' HUP: 끊김 신호 무시</text>

<text x="24" y="226" font-size="12" font-weight="700" fill="#1d1d1f">deploy.sh B</text>
<rect x="330" y="210" width="110" height="26" rx="6" fill="#fff8ec" stroke="#ff9f0a" stroke-dasharray="4 3"/>
<text x="340" y="228" font-size="12" fill="#c46f00">잠금 대기</text>
<rect x="440" y="210" width="176" height="26" rx="6" fill="#f0faf2" stroke="#34c759"/>
<text x="450" y="228" font-size="12" fill="#1d1d1f">A가 끝난 뒤 실행</text>
<text x="330" y="256" font-size="12" fill="#c46f00" font-family="ui-monospace, Menlo, monospace">② flock -w 600: 최대 600초 대기</text>

<rect x="24" y="268" width="104" height="24" rx="6" fill="#f2f2f7"/>
<text x="76" y="285" font-size="12" fill="#1d1d1f" text-anchor="middle">워크플로</text>
<text x="140" y="285" font-size="12" fill="#1d1d1f">③ deploy-api.yml: concurrency, cancel-in-progress: false (취소 없이 순서대로)</text>
</svg>
