<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>iframe 삽입을 허용할지 브라우저가 판단하는 과정</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="380" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">다른 출처의 /docs를 iframe에 넣으면</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">브라우저는 iframe 응답의 헤더와 바깥 페이지의 출처를 비교해 표시 여부를 정한다</text>
<rect x="20" y="70" width="250" height="150" rx="10" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="34" y="94" font-size="13" font-weight="700" fill="#1d1d1f">바깥 페이지 (사이트)</text>
<text x="34" y="114" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">macfolio.hyeoniverse.com</text>
<rect x="40" y="128" width="210" height="76" rx="6" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="52" y="152" font-size="12" fill="#0a84ff" font-family="ui-monospace, Menlo, monospace">&lt;iframe src=</text>
<text x="52" y="170" font-size="12" fill="#0a84ff" font-family="ui-monospace, Menlo, monospace"> "macfolio-api.…/docs"&gt;</text>
<text x="52" y="192" font-size="12" fill="#6e6e73">다른 출처 (호스트가 다름)</text>
<line x1="250" y1="150" x2="356" y2="150" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="303" y="142" font-size="12" fill="#0a84ff" text-anchor="middle">요청</text>
<rect x="360" y="70" width="260" height="150" rx="10" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.2"/>
<text x="374" y="94" font-size="13" font-weight="700" fill="#1d1d1f">API 서버 응답 (helmet 기본값)</text>
<text x="374" y="122" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">X-Frame-Options:</text>
<text x="390" y="140" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">SAMEORIGIN</text>
<text x="374" y="166" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">Content-Security-Policy:</text>
<text x="390" y="184" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">frame-ancestors 'self'</text>
<text x="374" y="208" font-size="12" fill="#6e6e73">같은 출처의 페이지만 나를 삽입할 수 있다</text>
<line x1="490" y1="222" x2="490" y2="250" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="490" y1="236" x2="150" y2="236" stroke="#6e6e73" stroke-width="1.5"/>
<line x1="150" y1="236" x2="150" y2="250" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="20" y="254" width="290" height="110" rx="10" fill="#fff1f0" stroke="#ff3b30" stroke-width="1.5"/>
<text x="34" y="278" font-size="13" font-weight="700" fill="#ff3b30">헤더 그대로: 표시 차단</text>
<text x="34" y="302" font-size="12" fill="#1d1d1f">바깥 페이지 출처 ≠ /docs 출처</text>
<text x="34" y="324" font-size="12" fill="#1d1d1f">iframe 자리에 오류 화면이 표시된다</text>
<text x="34" y="346" font-size="12" fill="#6e6e73">서버의 모든 경로에 적용되는 기본 보호</text>
<rect x="330" y="254" width="290" height="110" rx="10" fill="#fff8ec" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="344" y="278" font-size="13" font-weight="700" fill="#1d1d1f">첫 방법: /docs만 예외</text>
<text x="344" y="302" font-size="12" fill="#1d1d1f">/docs 응답에서 두 헤더를 완화하고</text>
<text x="344" y="324" font-size="12" fill="#1d1d1f">사이트 주소를 허용 목록에 추가</text>
<text x="344" y="346" font-size="12" fill="#6e6e73">표시는 되지만 서버가 꺼지면 빈 창</text>
</svg>
