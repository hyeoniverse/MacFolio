<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>scrypt 비밀번호 해시의 저장과 검증</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">비밀번호 해시의 저장과 검증</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">rules.ts의 hashPassword·verifyPassword. 문자열 값은 형식을 보이기 위한 예시</text>
  <defs><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6e6e73"/></marker></defs>
  <!-- store -->
  <text x="24" y="88" font-size="14" font-weight="700" fill="#0a84ff">댓글 작성: 저장</text>
  <rect x="24" y="100" width="130" height="56" rx="8" fill="#f2f2f7"/>
  <text x="38" y="123" font-size="12" fill="#6e6e73">입력 비밀번호</text>
  <text x="38" y="143" font-size="13" font-weight="600" fill="#1d1d1f">"sky1234"</text>
  <rect x="24" y="166" width="130" height="56" rx="8" fill="#f2f2f7"/>
  <text x="38" y="189" font-size="12" fill="#6e6e73">randomBytes(16)</text>
  <text x="38" y="209" font-size="13" font-weight="600" fill="#1d1d1f">새 salt</text>
  <rect x="190" y="128" width="150" height="66" rx="8" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="265" y="156" font-size="13" font-weight="600" fill="#0a84ff" text-anchor="middle">scrypt</text>
  <text x="265" y="176" font-size="12" fill="#1d1d1f" text-anchor="middle">32바이트 결과</text>
  <path d="M154 128 L184 150" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#e)"/>
  <path d="M154 194 L184 172" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#e)"/>
  <rect x="376" y="128" width="240" height="66" rx="8" fill="#eaf8ee" stroke="#34c759" stroke-width="1.5"/>
  <text x="390" y="152" font-size="12" fill="#6e6e73">passwordHash 열</text>
  <text x="390" y="176" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">scrypt$q3Jx…$8fK2…</text>
  <path d="M340 161 H370" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#e)"/>
  <text x="390" y="214" font-size="12" fill="#6e6e73">종류 $ salt(base64) $ 해시(base64)</text>
  <!-- verify -->
  <line x1="24" y1="236" x2="616" y2="236" stroke="#f2f2f7" stroke-width="2"/>
  <text x="24" y="264" font-size="14" font-weight="700" fill="#ff9f0a">댓글 삭제: 검증</text>
  <rect x="24" y="276" width="160" height="56" rx="8" fill="#eaf8ee"/>
  <text x="38" y="299" font-size="12" fill="#6e6e73">저장 값을 $로 분리</text>
  <text x="38" y="319" font-size="12" fill="#1d1d1f">salt, 기대 해시</text>
  <rect x="24" y="342" width="160" height="56" rx="8" fill="#f2f2f7"/>
  <text x="38" y="365" font-size="12" fill="#6e6e73">삭제 요청의 비밀번호</text>
  <text x="38" y="385" font-size="13" font-weight="600" fill="#1d1d1f">"sky1234"</text>
  <rect x="216" y="306" width="140" height="62" rx="8" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="286" y="332" font-size="13" font-weight="600" fill="#0a84ff" text-anchor="middle">scrypt</text>
  <text x="286" y="352" font-size="12" fill="#1d1d1f" text-anchor="middle">같은 salt로 계산</text>
  <path d="M184 304 L210 326" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#e)"/>
  <path d="M184 370 L210 348" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#e)"/>
  <rect x="388" y="306" width="228" height="62" rx="8" fill="#fff6e8" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="402" y="332" font-size="13" font-weight="600" fill="#1d1d1f">timingSafeEqual(계산, 기대)</text>
  <text x="402" y="352" font-size="12" fill="#6e6e73">같으면 삭제, 다르면 403</text>
  <path d="M356 337 H382" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#e)"/>
</svg>
