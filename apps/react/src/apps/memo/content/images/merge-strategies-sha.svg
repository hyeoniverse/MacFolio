<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6e6e73"/></marker></defs>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Rebase and merge가 커밋 SHA를 바꾸는 이유</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#6e6e73">SHA는 커밋 객체의 모든 필드를 입력으로 계산한다. 필드 하나만 달라도 SHA가 달라진다</text>
  <text x="165" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">브랜치의 커밋 A</text>
  <text x="475" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">main에 다시 만든 커밋 A'</text>
  <g font-size="12">
    <rect x="30" y="92" width="270" height="170" rx="8" fill="#f2f2f7" stroke="#d1d1d6"/>
    <text x="44" y="116" fill="#6e6e73">tree</text><text x="130" y="116" fill="#1d1d1f">파일 내용</text>
    <text x="44" y="142" fill="#6e6e73">parent</text><text x="130" y="142" fill="#1d1d1f">M1</text>
    <text x="44" y="168" fill="#6e6e73">author</text><text x="130" y="168" fill="#1d1d1f">작성자, 작성 시각</text>
    <text x="44" y="194" fill="#6e6e73">committer</text><text x="130" y="194" fill="#1d1d1f">작성자, 작성 시각</text>
    <text x="44" y="220" fill="#6e6e73">gpgsig</text><text x="130" y="220" fill="#1d1d1f">작성자 서명</text>
    <text x="44" y="246" fill="#6e6e73">message</text><text x="130" y="246" fill="#1d1d1f">"컴포넌트 추가"</text>
    <rect x="340" y="92" width="270" height="170" rx="8" fill="#f2f2f7" stroke="#d1d1d6"/>
    <text x="354" y="116" fill="#6e6e73">tree</text><text x="440" y="116" fill="#1d1d1f">파일 내용 (같음)</text>
    <rect x="436" y="128" width="168" height="20" rx="4" fill="#fff4e5"/>
    <text x="354" y="142" fill="#6e6e73">parent</text><text x="440" y="142" fill="#1d1d1f">M2</text>
    <text x="354" y="168" fill="#6e6e73">author</text><text x="440" y="168" fill="#1d1d1f">작성자, 작성 시각 (같음)</text>
    <rect x="436" y="180" width="168" height="20" rx="4" fill="#fff4e5"/>
    <text x="354" y="194" fill="#6e6e73">committer</text><text x="440" y="194" fill="#1d1d1f">병합한 사용자, 병합 시각</text>
    <rect x="436" y="206" width="168" height="20" rx="4" fill="#ffecea"/>
    <text x="354" y="220" fill="#6e6e73">gpgsig</text><text x="440" y="220" fill="#ff3b30">없음</text>
    <text x="354" y="246" fill="#6e6e73">message</text><text x="440" y="246" fill="#1d1d1f">"컴포넌트 추가" (같음)</text>
  </g>
  <path d="M165 262 L165 284" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M475 262 L475 284" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="165" y="306" text-anchor="middle" font-size="13" fill="#1d1d1f">SHA 7d6c5b4…</text>
  <text x="475" y="306" text-anchor="middle" font-size="13" fill="#0a84ff">SHA 새 값</text>
  <text x="320" y="324" text-anchor="middle" font-size="12" fill="#ff9f0a">주황 칸: 다시 만들면서 바뀐 필드</text>
</svg>
