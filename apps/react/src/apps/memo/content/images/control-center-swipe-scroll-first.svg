<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>메모 앱 목록이 맨 위(scrollTop 0)이면 아래로 쓸 때 제어 센터가 열리고, 내용을 내려 둔 상태(scrollTop 320)이면 같은 동작이 스크롤이 된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker></defs>
<rect width="640" height="380" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">같은 "아래로 쓸기"가 스크롤 위치에 따라 다르게 처리된다</text>
<!-- phone 1 -->
<rect x="60" y="56" width="180" height="300" rx="24" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
<rect x="72" y="88" width="156" height="230" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<g fill="#f2f2f7"><rect x="82" y="98" width="136" height="26" rx="4"/><rect x="82" y="132" width="136" height="26" rx="4"/><rect x="82" y="166" width="136" height="26" rx="4"/><rect x="82" y="200" width="136" height="26" rx="4"/><rect x="82" y="234" width="136" height="26" rx="4"/><rect x="82" y="268" width="136" height="26" rx="4"/></g>
<text x="150" y="115" font-size="12" fill="#1d1d1f" text-anchor="middle">첫 번째 글</text>
<line x1="150" y1="150" x2="150" y2="220" stroke="#0a84ff" stroke-width="3" marker-end="url(#a)"/>
<circle cx="150" cy="150" r="9" fill="#0a84ff" opacity="0.35"/>
<text x="150" y="80" font-size="12" fill="#6e6e73" text-anchor="middle">scrollTop = 0</text>
<!-- phone 2 -->
<rect x="400" y="56" width="180" height="300" rx="24" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
<rect x="412" y="88" width="156" height="230" rx="6" fill="#ffffff" stroke="#6e6e73"/>
<g fill="#f2f2f7"><rect x="422" y="98" width="136" height="26" rx="4"/><rect x="422" y="132" width="136" height="26" rx="4"/><rect x="422" y="166" width="136" height="26" rx="4"/><rect x="422" y="200" width="136" height="26" rx="4"/><rect x="422" y="234" width="136" height="26" rx="4"/><rect x="422" y="268" width="136" height="26" rx="4"/></g>
<text x="490" y="115" font-size="12" fill="#1d1d1f" text-anchor="middle">열 번째 글</text>
<line x1="490" y1="150" x2="490" y2="220" stroke="#0a84ff" stroke-width="3" marker-end="url(#a)"/>
<circle cx="490" cy="150" r="9" fill="#0a84ff" opacity="0.35"/>
<text x="490" y="80" font-size="12" fill="#6e6e73" text-anchor="middle">scrollTop = 320</text>
<!-- results -->
<rect x="250" y="120" width="140" height="56" rx="10" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="320" y="143" font-size="13" font-weight="700" fill="#34c759" text-anchor="middle">← 제어 센터 열림</text>
<text x="320" y="162" font-size="12" fill="#6e6e73" text-anchor="middle">위로 올라갈 내용 없음</text>
<rect x="250" y="200" width="140" height="56" rx="10" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="320" y="223" font-size="13" font-weight="700" fill="#ff9f0a" text-anchor="middle">스크롤 우선 →</text>
<text x="320" y="242" font-size="12" fill="#6e6e73" text-anchor="middle">scrollTop &gt; 0</text>
</svg>
