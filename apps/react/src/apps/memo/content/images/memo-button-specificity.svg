<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>두 규칙의 우선순위</title>
  <rect width="640" height="300" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">같은 단추, 두 규칙 중 이기는 쪽</text>
  <text x="32" y="68" font-size="12" fill="#6b7280">(ID, 클래스, 태그) 순서로 앞자리부터 비교한다. 같으면 뒤에 적은 규칙</text>

  <g font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="372" y="100">ID</text>
    <text x="420" y="100">클래스</text>
    <text x="468" y="100">태그</text>
  </g>

  <!-- .memo button -->
  <g>
    <text x="32" y="138" font-size="14" fill="#1f2937" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.memo button</text>
    <text x="32" y="158" font-size="11" fill="#6b7280">color: inherit (부모의 흐린 글자색)</text>
    <rect x="356" y="118" width="32" height="30" rx="7" fill="#f3f4f6"/><text x="372" y="138" font-size="14" text-anchor="middle" fill="#374151">0</text>
    <rect x="404" y="118" width="32" height="30" rx="7" fill="#f3f4f6"/><text x="420" y="138" font-size="14" text-anchor="middle" fill="#374151">1</text>
    <rect x="452" y="118" width="32" height="30" rx="7" fill="#dcfce7"/><text x="468" y="138" font-size="14" text-anchor="middle" fill="#15803d" font-weight="700">1</text>
    <rect x="508" y="118" width="100" height="30" rx="7" fill="#dcfce7"/><text x="558" y="138" font-size="12" text-anchor="middle" fill="#15803d">이긴다</text>
  </g>

  <!-- .memo-writer-publish -->
  <g>
    <text x="32" y="200" font-size="14" fill="#1f2937" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.memo-writer-publish</text>
    <text x="32" y="220" font-size="11" fill="#6b7280">color: #2b2100 (진한 갈색)</text>
    <rect x="356" y="180" width="32" height="30" rx="7" fill="#f3f4f6"/><text x="372" y="200" font-size="14" text-anchor="middle" fill="#374151">0</text>
    <rect x="404" y="180" width="32" height="30" rx="7" fill="#f3f4f6"/><text x="420" y="200" font-size="14" text-anchor="middle" fill="#374151">1</text>
    <rect x="452" y="180" width="32" height="30" rx="7" fill="#fee2e2"/><text x="468" y="200" font-size="14" text-anchor="middle" fill="#b91c1c" font-weight="700">0</text>
    <rect x="508" y="180" width="100" height="30" rx="7" fill="#fee2e2"/><text x="558" y="200" font-size="12" text-anchor="middle" fill="#b91c1c">진다</text>
  </g>

  <path d="M32 246 H608" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="32" y="274" font-size="12" fill="#374151">고친 뒤: .memo-writer-actions .memo-writer-publish → (0, 2, 0)으로 클래스 자리에서 이긴다</text>
</svg>
