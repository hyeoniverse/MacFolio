<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>아래 막대 그리드 48px 1fr 48px. 장소가 하나면 점이 없어 목록 버튼이 가운데 칸 왼쪽으로 밀렸고, grid-column 3으로 오른쪽 칸에 고정했다</title>
<rect width="780" height="260" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">아래 막대: grid-template-columns 48px 1fr 48px</text>
<text x="32" y="70" font-size="12" fill="#b91c1c" font-weight="600">전: 장소가 하나면 점이 없다 → 목록 버튼이 두 번째 칸으로</text>
<rect x="48" y="80" width="684" height="52" rx="10" fill="#fff1f2" stroke="#fda4af"/>
<rect x="64" y="88" width="48" height="36" rx="6" fill="none" stroke="#fda4af" stroke-dasharray="4 3"/>
<rect x="112" y="88" width="572" height="36" rx="6" fill="none" stroke="#fda4af" stroke-dasharray="4 3"/>
<rect x="684" y="88" width="48" height="36" rx="6" fill="none" stroke="#fda4af" stroke-dasharray="4 3"/>
<rect x="116" y="92" width="28" height="28" rx="6" fill="#ef4444"/>
<text x="130" y="111" font-size="12" fill="#ffffff" text-anchor="middle">☰</text>
<text x="400" y="111" font-size="10.5" fill="#6b7280" text-anchor="middle">(점 없음, 여백 16px)</text>
<text x="32" y="168" font-size="12" fill="#047857" font-weight="600">후: 목록 버튼 grid-column: 3, 여백은 --weather-gutter 28px</text>
<rect x="48" y="178" width="684" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<rect x="76" y="186" width="48" height="36" rx="6" fill="none" stroke="#6ee7b7" stroke-dasharray="4 3"/>
<rect x="124" y="186" width="536" height="36" rx="6" fill="none" stroke="#6ee7b7" stroke-dasharray="4 3"/>
<rect x="660" y="186" width="48" height="36" rx="6" fill="none" stroke="#6ee7b7" stroke-dasharray="4 3"/>
<rect x="676" y="190" width="28" height="28" rx="6" fill="#059669"/>
<text x="690" y="209" font-size="12" fill="#ffffff" text-anchor="middle">☰</text>
<text x="392" y="209" font-size="10.5" fill="#6b7280" text-anchor="middle">(가운데 칸은 비어도 자리를 지킨다)</text>
</svg>
