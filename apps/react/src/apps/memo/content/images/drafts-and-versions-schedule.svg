<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>GET /posts는 요청마다 서울 기준 오늘 날짜를 계산해 게시 날짜가 그보다 뒤인 글을 목록에서 제외하고, 날짜가 지나면 다음 요청부터 그 글이 포함된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">스케줄러 없는 예약 발행: 요청마다 날짜 비교</text>

<line x1="40" y1="96" x2="610" y2="96" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<g font-size="12" fill="#1d1d1f" font-family="SFMono-Regular, Menlo, monospace">
<line x1="110" y1="88" x2="110" y2="104" stroke="#6e6e73"/><text x="76" y="122">09-29</text>
<line x1="250" y1="88" x2="250" y2="104" stroke="#6e6e73"/><text x="216" y="122">09-30</text>
<line x1="390" y1="88" x2="390" y2="104" stroke="#6e6e73"/><text x="356" y="122">10-01</text>
<line x1="530" y1="88" x2="530" y2="104" stroke="#6e6e73"/><text x="496" y="122">10-02</text>
</g>
<rect x="196" y="48" width="108" height="26" rx="13" fill="#0a84ff"/>
<text x="210" y="66" font-size="12" font-weight="700" fill="#ffffff">오늘(서울) 09-30</text>
<line x1="250" y1="74" x2="250" y2="88" stroke="#0a84ff" stroke-width="2"/>

<g font-size="12">
<rect x="60" y="140" width="100" height="44" rx="6" fill="#e8f7ec" stroke="#34c759"/>
<text x="70" y="158" fill="#1d1d1f">글 A</text><text x="70" y="175" fill="#248a3d">목록에 포함</text>
<rect x="200" y="140" width="100" height="44" rx="6" fill="#e8f7ec" stroke="#34c759"/>
<text x="210" y="158" fill="#1d1d1f">글 B</text><text x="210" y="175" fill="#248a3d">목록에 포함</text>
<rect x="340" y="140" width="100" height="44" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-dasharray="4 3"/>
<text x="350" y="158" fill="#1d1d1f">글 C (예약)</text><text x="350" y="175" fill="#6e6e73">제외</text>
<rect x="480" y="140" width="100" height="44" rx="6" fill="#f2f2f7" stroke="#c7c7cc" stroke-dasharray="4 3"/>
<text x="490" y="158" fill="#1d1d1f">글 D (예약)</text><text x="490" y="175" fill="#6e6e73">제외</text>
</g>

<rect x="20" y="206" width="600" height="104" rx="8" fill="#f2f2f7"/>
<text x="34" y="230" font-size="13" font-weight="700" fill="#1d1d1f">서버 코드 (posts.service.ts)</text>
<text x="34" y="252" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f">today = Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' })</text>
<text x="34" y="270" font-size="12" font-family="SFMono-Regular, Menlo, monospace" fill="#1d1d1f">hidden = row.deleted || row.date &gt; now   <tspan fill="#6e6e73">// '2026-10-01' &gt; '2026-09-30'</tspan></text>
<text x="34" y="294" font-size="12" fill="#6e6e73">10월 1일 0시(서울)가 지난 뒤의 첫 요청에서 now가 '2026-10-01'이 되어 글 C가 목록에 포함된다</text>
</svg>
