<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>집계 키는 컨트롤러, 핸들러, 제한 이름, 요청자 IP를 이어 붙인 값이다. TRUST_PROXY가 0이면 모든 방문자의 IP가 cloudflared 하나로 보여 집계 칸이 하나로 합쳐지고, 1이면 방문자마다 칸이 나뉜다</title>
<rect width="640" height="330" fill="#ffffff"/>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">집계 칸은 경로 × 제한 이름 × 요청자 IP마다 하나</text>
<rect x="24" y="48" width="592" height="34" rx="8" fill="#f2f2f7"/>
<text x="40" y="70" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">키 = sha256("PostsController-create-write-" + req.ip)</text>
<text x="24" y="114" font-size="13" font-weight="700" fill="#ff3b30">TRUST_PROXY=0</text>
<text x="24" y="132" font-size="12" fill="#6e6e73">req.ip가 터널 컨테이너 주소</text>
<rect x="24" y="146" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="84" y="166" font-size="12" fill="#1d1d1f" text-anchor="middle">방문자 A</text>
<rect x="24" y="186" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="84" y="206" font-size="12" fill="#1d1d1f" text-anchor="middle">방문자 B</text>
<rect x="24" y="226" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="84" y="246" font-size="12" fill="#1d1d1f" text-anchor="middle">방문자 C</text>
<path d="M144 161 L196 196 M144 201 L196 201 M144 241 L196 206" stroke="#6e6e73" stroke-width="1.5" fill="none"/>
<rect x="196" y="176" width="104" height="50" rx="8" fill="#ffffff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="248" y="198" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">칸 1개</text>
<text x="248" y="216" font-size="12" fill="#ff3b30" text-anchor="middle">세 명 합산</text>
<text x="24" y="284" font-size="12" fill="#1d1d1f">한 명이 한도를 넘기면</text>
<text x="24" y="302" font-size="12" fill="#ff3b30">세 명 모두 429</text>
<line x1="320" y1="100" x2="320" y2="310" stroke="#d1d1d6" stroke-width="1"/>
<text x="340" y="114" font-size="13" font-weight="700" fill="#34c759">TRUST_PROXY=1</text>
<text x="340" y="132" font-size="12" fill="#6e6e73">req.ip가 X-Forwarded-For의 실제 IP</text>
<rect x="340" y="146" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="400" y="166" font-size="12" fill="#1d1d1f" text-anchor="middle">방문자 A</text>
<rect x="340" y="186" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="400" y="206" font-size="12" fill="#1d1d1f" text-anchor="middle">방문자 B</text>
<rect x="340" y="226" width="120" height="30" rx="6" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="400" y="246" font-size="12" fill="#1d1d1f" text-anchor="middle">방문자 C</text>
<path d="M460 161 H500 M460 201 H500 M460 241 H500" stroke="#6e6e73" stroke-width="1.5"/>
<rect x="500" y="146" width="116" height="30" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="558" y="166" font-size="12" fill="#1d1d1f" text-anchor="middle">A의 칸</text>
<rect x="500" y="186" width="116" height="30" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="558" y="206" font-size="12" fill="#1d1d1f" text-anchor="middle">B의 칸</text>
<rect x="500" y="226" width="116" height="30" rx="6" fill="#ffffff" stroke="#34c759" stroke-width="1.5"/>
<text x="558" y="246" font-size="12" fill="#1d1d1f" text-anchor="middle">C의 칸</text>
<text x="340" y="284" font-size="12" fill="#1d1d1f">A가 한도를 넘겨도</text>
<text x="340" y="302" font-size="12" fill="#34c759">B·C는 그대로 허용</text>
</svg>
