<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="262" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">패치 임베딩: 패치 N개 + class 토큰 1개 = 토큰 N+1개</text>
  <text x="320" y="52" text-anchor="middle" font-size="14" font-style="italic" fill="#1d1d1f">z₀ = [x<tspan font-size="10" dy="3">class</tspan><tspan dy="-3">; x</tspan><tspan font-size="10" dy="3">p</tspan><tspan font-size="10" dy="-9">1</tspan><tspan dy="6">E; x</tspan><tspan font-size="10" dy="3">p</tspan><tspan font-size="10" dy="-9">2</tspan><tspan dy="6">E; ⋯ ; x</tspan><tspan font-size="10" dy="3">p</tspan><tspan font-size="10" dy="-9">N</tspan><tspan dy="6">E] + E</tspan><tspan font-size="10" dy="3">pos</tspan></text>
  <text x="320" y="74" text-anchor="middle" font-size="12" fill="#6e6e73">E: (P²·C)×D 선형 투영 행렬, E<tspan font-size="9" dy="3">pos</tspan><tspan dy="-3">: (N+1)×D 위치 임베딩</tspan></text>
  <g transform="translate(100,-100)">
  <!-- 토큰 -->
  <g stroke="#1d1d1f" stroke-width="1">
    <rect x="128" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="140" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="159" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="171" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="190" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="202" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="221" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="233" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="252" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="264" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="283" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="295" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="314" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="326" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="345" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="357" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="376" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="388" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
    <rect x="407" y="194" width="11" height="20" rx="5" fill="#d9c9ef"/><rect x="419" y="194" width="11" height="20" rx="5" fill="#ffd6d6"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1d1d1f">
    <text x="133.5" y="208">0</text><text x="145.5" y="208">*</text>
    <text x="164.5" y="208">1</text><text x="195.5" y="208">2</text><text x="226.5" y="208">3</text><text x="257.5" y="208">4</text>
    <text x="288.5" y="208">5</text><text x="319.5" y="208">6</text><text x="350.5" y="208">7</text><text x="381.5" y="208">8</text><text x="412.5" y="208">9</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#1d1d1f" font-weight="600">
    <text x="58" y="197">패치 + 위치</text>
    <text x="58" y="212">임베딩</text>
  </g>
  <line x1="100" y1="203" x2="124" y2="203" stroke="#6e6e73" stroke-width="1.3" marker-end="url(#g)"/>
  <g font-size="10.5" text-anchor="middle" fill="#6e6e73">
    <text x="58" y="232">* 학습 가능한</text>
    <text x="58" y="246">[class] 임베딩</text>
  </g>
  <!-- 선형 투영 -->
  <rect x="155" y="232" width="280" height="28" rx="6" fill="#ffecec" stroke="#1d1d1f"/>
  <text x="295" y="251" text-anchor="middle" font-size="12" fill="#1d1d1f">펼친 패치의 선형 투영(linear projection)</text>
  <g stroke="#1d1d1f" stroke-width="1">
    <line x1="171" y1="232" x2="171" y2="214"/><line x1="202" y1="232" x2="202" y2="214"/><line x1="233" y1="232" x2="233" y2="214"/>
    <line x1="264" y1="232" x2="264" y2="214"/><line x1="295" y1="232" x2="295" y2="214"/><line x1="326" y1="232" x2="326" y2="214"/>
    <line x1="357" y1="232" x2="357" y2="214"/><line x1="388" y1="232" x2="388" y2="214"/><line x1="419" y1="232" x2="419" y2="214"/>
    <line x1="171" y1="282" x2="171" y2="260"/><line x1="202" y1="282" x2="202" y2="260"/><line x1="233" y1="282" x2="233" y2="260"/>
    <line x1="264" y1="282" x2="264" y2="260"/><line x1="295" y1="282" x2="295" y2="260"/><line x1="326" y1="282" x2="326" y2="260"/>
    <line x1="357" y1="282" x2="357" y2="260"/><line x1="388" y1="282" x2="388" y2="260"/><line x1="419" y1="282" x2="419" y2="260"/>
  </g>
  <!-- 패치 한 줄 -->
  <g fill="#cfe3ff" stroke="#0a84ff">
    <rect x="159" y="282" width="24" height="24"/><rect x="190" y="282" width="24" height="24"/><rect x="221" y="282" width="24" height="24"/>
    <rect x="252" y="282" width="24" height="24"/><rect x="283" y="282" width="24" height="24"/><rect x="314" y="282" width="24" height="24"/>
    <rect x="345" y="282" width="24" height="24"/><rect x="376" y="282" width="24" height="24"/><rect x="407" y="282" width="24" height="24"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#1d1d1f">
    <text x="171" y="298">1</text><text x="202" y="298">2</text><text x="233" y="298">3</text><text x="264" y="298">4</text><text x="295" y="298">5</text>
    <text x="326" y="298">6</text><text x="357" y="298">7</text><text x="388" y="298">8</text><text x="419" y="298">9</text>
  </g>
  <!-- 3×3 패치 격자 -->
  <g fill="#cfe3ff" stroke="#0a84ff">
    <rect x="22" y="266" width="22" height="22"/><rect x="47" y="266" width="22" height="22"/><rect x="72" y="266" width="22" height="22"/>
    <rect x="22" y="291" width="22" height="22"/><rect x="47" y="291" width="22" height="22"/><rect x="72" y="291" width="22" height="22"/>
    <rect x="22" y="316" width="22" height="22"/><rect x="47" y="316" width="22" height="22"/><rect x="72" y="316" width="22" height="22"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1d1d1f">
    <text x="33" y="281">1</text><text x="58" y="281">2</text><text x="83" y="281">3</text>
    <text x="33" y="306">4</text><text x="58" y="306">5</text><text x="83" y="306">6</text>
    <text x="33" y="331">7</text><text x="58" y="331">8</text><text x="83" y="331">9</text>
  </g>
  <text x="58" y="354" text-anchor="middle" font-size="10.5" fill="#6e6e73">영상을 패치로 자른다</text>
  <line x1="100" y1="302" x2="153" y2="296" stroke="#6e6e73" stroke-width="1.3" marker-end="url(#g)"/>
  </g>
</svg>
