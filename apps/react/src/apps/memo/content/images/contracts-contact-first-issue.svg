<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>이름 칸 하나의 규칙 목록: 처음 어긋난 것 하나만</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">이름 칸 하나의 규칙 목록: 처음 어긋난 것 하나만</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">superRefine 안에서 find로 끝낸다. 이어 붙인 refine은 앞이 실패해도 뒤가 모두 돈다</text>
<rect x="32" y="80" width="170" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="117.0" y="104.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">nonEmpty</text>
<text x="220" y="105" font-size="12" fill="#374151" text-anchor="start">이름을 입력해주세요.</text>
<line x1="117" y1="120" x2="117" y2="132" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="132" width="170" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="117.0" y="156.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">length ≤ 30</text>
<text x="220" y="157" font-size="12" fill="#374151" text-anchor="start">이름은 30자까지 입력할 수 있습니다.</text>
<line x1="117" y1="172" x2="117" y2="184" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="184" width="170" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="117.0" y="208.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">oneLine</text>
<text x="220" y="209" font-size="12" fill="#374151" text-anchor="start">이름과 제목은 한 줄로 써 주세요.</text>
<line x1="117" y1="224" x2="117" y2="236" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="236" width="170" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="117.0" y="260.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">readable</text>
<text x="220" y="261" font-size="12" fill="#374151" text-anchor="start">읽을 수 없는 글자가 있습니다.</text>
<rect x="560" y="96" width="268" height="70" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="694.0" y="118.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">입력 &quot;&quot;(빈 값)</text>
<text x="694.0" y="135.0" font-size="11" fill="#374151" text-anchor="middle">→ 첫 규칙에서 멈춤</text>
<text x="694.0" y="152.0" font-size="11" fill="#374151" text-anchor="middle">문구 하나: 이름을 입력해주세요.</text>
<rect x="560" y="190" width="268" height="70" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="694.0" y="212.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">입력 &quot;가\n나&quot;</text>
<text x="694.0" y="229.0" font-size="11" fill="#374151" text-anchor="middle">→ 셋째 규칙에서 멈춤</text>
<text x="694.0" y="246.0" font-size="11" fill="#374151" text-anchor="middle">문구 하나: 한 줄로 써 주세요.</text>
<text x="32" y="310" font-size="11" fill="#6b7280" text-anchor="start">화면은 이 문구를 칸 아래에, 서버는 400의 message 배열에 넣는다</text>
</svg>
