<text x="145" y="216" text-anchor="middle" font-size="12" fill="#1d1d1f">내부: RIP 또는 OSPF (IGP)</text><text x="495" y="216" text-anchor="middle" font-size="12" fill="#1d1d1f">내부: RIP 또는 OSPF (IGP)</text>
<text x="20" y="256" font-size="12" fill="#6e6e73">검은 점 = 경계 라우터 · RIP: 거리 벡터, 홉 수(최대 15) · OSPF: 링크 상태, 다익스트라 · BGP: 경로 벡터</text>
<text x="20" y="276" font-size="12" fill="#6e6e73">AS(Autonomous System) = 하나의 정책으로 관리되는 라우터 묶음, 고유 번호(ASN)로 구분</text>
</g></svg>
