<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>창 폭에 따라 Dock에 들어가는 앱</title>
  <rect width="780" height="300" rx="16" fill="#ffffff"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#1f2937">Dock 칸 수 = (창 폭 − 300) ÷ 100 (2026-10-04 기준)</text>
  <text x="32" y="62" font-size="12" fill="#6b7280">내장 앱 11개 뒤에 프로젝트 앱 5개. 넘치는 뒤쪽 앱은 Launchpad로 가고, 실행 중에는 Dock 끝에 다시 보인다</text>
  <text x="32" y="122" font-size="13" font-weight="600" fill="#1f2937">1600px</text>
  <text x="32" y="140" font-size="11" fill="#6b7280">13칸</text>
