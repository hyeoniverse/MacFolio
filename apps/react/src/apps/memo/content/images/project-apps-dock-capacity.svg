  <rect x="100" y="270" width="14" height="14" rx="3" fill="#e5e7eb"/><text x="120" y="282" font-size="11" fill="#374151">내장 앱 (Finder~시스템 설정)</text>
  <rect x="300" y="270" width="14" height="14" rx="3" fill="#c7d2fe"/><text x="320" y="282" font-size="11" fill="#374151">프로젝트 앱 (HYEONIVERSE·NewPick·QRU·WTD·새싹 농장)</text>
