<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>3개 샤드와 6개 샤드의 실행 시간 비교. 샤드마다 준비 단계 약 1분이 붙고, 시험 부분은 샤드 수가 두 배가 되면 약 절반이 된다. 전체 대기 시간은 가장 늦게 끝나는 샤드가 결정한다</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1d1d1f">샤드 수에 따른 E2E 대기 시간 (개념도, 막대 길이는 근사)</text>
<g font-size="12" fill="#1d1d1f">
<rect x="24" y="48" width="14" height="14" fill="#ff9f0a"/><text x="44" y="60">준비 (설치·빌드·브라우저 설치, 약 1분)</text>
<rect x="300" y="48" width="14" height="14" fill="#0a84ff"/><text x="320" y="60">시험 실행</text>
</g>
<text x="24" y="96" font-size="13" font-weight="700" fill="#1d1d1f">3개 샤드 (변경 전)</text>
<g font-size="12" fill="#6e6e73">
<text x="24" y="122">샤드 1</text><text x="24" y="146">샤드 2</text><text x="24" y="170">샤드 3</text>
</g>
<g>
<rect x="80" y="110" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="110" width="360" height="16" fill="#0a84ff"/>
<rect x="80" y="134" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="134" width="350" height="16" fill="#0a84ff"/>
<rect x="80" y="158" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="158" width="368" height="16" fill="#0a84ff"/>
</g>
<line x1="492" y1="104" x2="492" y2="184" stroke="#ff3b30" stroke-dasharray="4 3"/>
<text x="500" y="146" font-size="12" fill="#ff3b30">시험 8~9분 +</text>
<text x="500" y="162" font-size="12" fill="#ff3b30">준비 1분</text>
<text x="24" y="218" font-size="13" font-weight="700" fill="#1d1d1f">6개 샤드 (변경 후)</text>
<g font-size="12" fill="#6e6e73">
<text x="24" y="244">샤드 1</text><text x="24" y="268">샤드 2</text><text x="24" y="292">샤드 3</text>
<text x="24" y="316">샤드 4</text><text x="24" y="340">샤드 5</text><text x="24" y="364">샤드 6</text>
</g>
<g>
<rect x="80" y="232" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="232" width="180" height="16" fill="#0a84ff"/>
<rect x="80" y="256" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="256" width="172" height="16" fill="#0a84ff"/>
<rect x="80" y="280" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="280" width="186" height="16" fill="#0a84ff"/>
<rect x="80" y="304" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="304" width="176" height="16" fill="#0a84ff"/>
<rect x="80" y="328" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="328" width="182" height="16" fill="#0a84ff"/>
<rect x="80" y="352" width="44" height="16" fill="#ff9f0a"/><rect x="124" y="352" width="170" height="16" fill="#0a84ff"/>
</g>
<line x1="310" y1="226" x2="310" y2="374" stroke="#34c759" stroke-dasharray="4 3"/>
<text x="318" y="290" font-size="12" fill="#248a3d">시험 시간 약 절반 +</text>
<text x="318" y="306" font-size="12" fill="#248a3d">준비 1분 (그대로)</text>
<text x="24" y="392" font-size="12" fill="#6e6e73">대기 시간은 가장 늦게 끝나는 샤드가 결정한다. 준비 1분은 샤드마다 붙으므로 사용 시간 총합은 늘어난다.</text>
</svg>
