<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>주소의 구성 요소와 서버가 받는 부분</title>
<rect width="640" height="380" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">주소의 각 부분 중 서버에 전달되는 것</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">브라우저는 # 뒤(프래그먼트)를 요청에 넣지 않는다. 경로와 쿼리는 서버에 전달된다</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="13">
<rect x="20" y="72" width="138" height="34" rx="6" fill="#f2f2f7"/>
<text x="89" y="94" text-anchor="middle" fill="#1d1d1f">https://</text>
<rect x="162" y="72" width="196" height="34" rx="6" fill="#f2f2f7"/>
<text x="260" y="94" text-anchor="middle" fill="#1d1d1f">macfolio.…com</text>
<rect x="362" y="72" width="128" height="34" rx="6" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="426" y="94" text-anchor="middle" fill="#0a84ff">/memo/abc</text>
<rect x="494" y="72" width="64" height="34" rx="6" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="526" y="94" text-anchor="middle" fill="#0a84ff">?a=1</text>
<rect x="562" y="72" width="58" height="34" rx="6" fill="#fff1f0" stroke="#ff3b30" stroke-width="1.5"/>
<text x="591" y="94" text-anchor="middle" fill="#ff3b30">#x</text>
</g>
<g font-size="12" fill="#6e6e73" text-anchor="middle">
<text x="89" y="124">프로토콜</text>
<text x="260" y="124">호스트</text>
<text x="426" y="124">경로</text>
<text x="526" y="124">쿼리</text>
<text x="591" y="124">프래그먼트</text>
</g>
<text x="20" y="166" font-size="14" font-weight="700" fill="#1d1d1f">같은 글을 세 형식으로 표현했을 때 서버가 받는 요청</text>
<g font-size="12">
<rect x="20" y="180" width="600" height="56" rx="8" fill="#f2f2f7"/>
<text x="34" y="203" font-weight="700" fill="#1d1d1f">해시</text>
<text x="110" y="203" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">/#/memo/cra-to-vite</text>
<text x="34" y="224" fill="#6e6e73">서버가 받는 줄</text>
<text x="130" y="224" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">GET /</text>
<text x="606" y="214" fill="#ff3b30" text-anchor="end">어느 글인지 알 수 없다</text>
<rect x="20" y="244" width="600" height="56" rx="8" fill="#f2f2f7"/>
<text x="34" y="267" font-weight="700" fill="#1d1d1f">쿼리</text>
<text x="110" y="267" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">/?memo=cra-to-vite</text>
<text x="34" y="288" fill="#6e6e73">서버가 받는 줄</text>
<text x="130" y="288" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">GET /?memo=cra-to-vite</text>
<text x="606" y="278" fill="#ff9f0a" text-anchor="end">받지만 앱을 쿼리 이름으로 구분</text>
<rect x="20" y="308" width="600" height="56" rx="8" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="34" y="331" font-weight="700" fill="#1d1d1f">경로</text>
<text x="110" y="331" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">/memo/cra-to-vite</text>
<text x="34" y="352" fill="#6e6e73">서버가 받는 줄</text>
<text x="130" y="352" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">GET /memo/cra-to-vite</text>
<text x="606" y="342" fill="#34c759" text-anchor="end" font-weight="700">채택</text>
</g>
</svg>
