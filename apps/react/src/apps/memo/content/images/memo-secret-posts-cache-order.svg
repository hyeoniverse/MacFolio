<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>1분 캐시와 비밀 글 필터링의 순서</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<text x="20" y="32" font-size="16" font-weight="700" fill="#1d1d1f">필터링을 캐시 앞에 두는가, 뒤에 두는가</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">0초에 조회수를 캐시에 저장하고, 10초에 글 X를 비밀로 지정한 뒤, 20초에 방문자가 조회한 경우</text>
<text x="20" y="90" font-size="13" font-weight="700" fill="#ff3b30">캐시 안에서 필터링</text>
<rect x="20" y="102" width="120" height="44" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="80" y="129" font-size="12" fill="#1d1d1f" text-anchor="middle">DB 집계</text>
<line x1="140" y1="124" x2="166" y2="124" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="170" y="102" width="130" height="44" rx="8" fill="#fff8ec" stroke="#ff9f0a"/>
<text x="235" y="129" font-size="12" fill="#1d1d1f" text-anchor="middle">비밀 글 제외 (0초)</text>
<line x1="300" y1="124" x2="326" y2="124" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="330" y="102" width="130" height="44" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="395" y="129" font-size="12" fill="#1d1d1f" text-anchor="middle">1분 캐시</text>
<line x1="460" y1="124" x2="486" y2="124" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490" y="102" width="130" height="44" rx="8" fill="#fff1f0" stroke="#ff3b30" stroke-width="1.5"/>
<text x="555" y="122" font-size="12" fill="#1d1d1f" text-anchor="middle">20초 응답</text>
<text x="555" y="138" font-size="12" font-weight="700" fill="#ff3b30" text-anchor="middle">X 포함</text>
<text x="20" y="170" font-size="12" fill="#6e6e73">0초에 X는 공개 글이었으므로 캐시에 X가 들어 있고, 캐시가 만료되는 60초까지 그대로 나간다</text>
<line x1="20" y1="190" x2="620" y2="190" stroke="#e5e5ea"/>
<text x="20" y="224" font-size="13" font-weight="700" fill="#248a3d">캐시에서 꺼낸 뒤 필터링 (채택)</text>
<rect x="20" y="236" width="120" height="44" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="80" y="263" font-size="12" fill="#1d1d1f" text-anchor="middle">DB 집계</text>
<line x1="140" y1="258" x2="166" y2="258" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="170" y="236" width="130" height="44" rx="8" fill="#f2f2f7" stroke="#6e6e73"/>
<text x="235" y="263" font-size="12" fill="#1d1d1f" text-anchor="middle">1분 캐시 (전체 값)</text>
<line x1="300" y1="258" x2="326" y2="258" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="330" y="236" width="130" height="44" rx="8" fill="#eaf3ff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="395" y="256" font-size="12" fill="#1d1d1f" text-anchor="middle">비밀 글 제외</text>
<text x="395" y="272" font-size="12" fill="#0a84ff" text-anchor="middle">요청마다 slugs()</text>
<line x1="460" y1="258" x2="486" y2="258" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490" y="236" width="130" height="44" rx="8" fill="#eefaf1" stroke="#34c759" stroke-width="1.5"/>
<text x="555" y="256" font-size="12" fill="#1d1d1f" text-anchor="middle">20초 응답</text>
<text x="555" y="272" font-size="12" font-weight="700" fill="#248a3d" text-anchor="middle">X 없음</text>
<text x="20" y="306" font-size="12" fill="#6e6e73">캐시는 DB 집계만 아끼고, 비밀 글 목록은 응답할 때마다 다시 읽는다.</text>
<text x="20" y="326" font-size="12" fill="#6e6e73">비밀로 지정한 직후의 요청부터 X가 빠진다</text>
</svg>
