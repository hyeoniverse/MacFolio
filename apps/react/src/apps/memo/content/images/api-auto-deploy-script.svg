<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>deploy.sh의 갈림길과 끝나는 코드</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="460" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">deploy.sh의 갈림길과 끝나는 코드</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">151줄. 0은 성공 또는 이미 떠 있음, 1은 실패(되돌렸든 아니든), 2는 태그 모양이 아님</text>
<rect x="32" y="80" width="170" height="50" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="117.0" y="100.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">태그 검사</text>
<text x="117.0" y="117.5" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">sha-[0-9a-f]{7,40}</text>
<line x1="117" y1="130" x2="117" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="32" y="164" width="170" height="50" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="117.0" y="184.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">flock (600초)</text>
<text x="117.0" y="201.5" font-size="11" fill="#374151" text-anchor="middle">두 배포가 겹치지 않게</text>
<line x1="202" y1="105" x2="256" y2="105" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="260" y="84" width="150" height="42" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="335.0" y="109.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">exit 2</text>
<line x1="202" y1="189" x2="256" y2="189" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="260" y="164" width="150" height="50" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="335.0" y="193.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">같은 태그 &amp; 떠 있음?</text>
<line x1="410" y1="189" x2="450" y2="189" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<text x="430.0" y="183.0" font-size="11" fill="#15803d" text-anchor="middle">예</text>
<rect x="454" y="168" width="120" height="42" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="514.0" y="193.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">exit 0</text>
<line x1="335" y1="214" x2="335" y2="244" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<text x="372" y="234" font-size="11" fill="#374151" text-anchor="middle">아니오</text>
<rect x="260" y="248" width="150" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="335.0" y="266.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">배포 직전 백업</text>
<text x="335.0" y="283.5" font-size="11" fill="#374151" text-anchor="middle">backup.sh (서버만)</text>
<line x1="410" y1="271" x2="450" y2="271" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<text x="430.0" y="265.0" font-size="11" fill="#b91c1c" text-anchor="middle">실패</text>
<rect x="454" y="250" width="120" height="42" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="514.0" y="275.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">exit 1</text>
<line x1="335" y1="294" x2="335" y2="320" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="260" y="324" width="150" height="50" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="335.0" y="344.5" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">up(새 태그)</text>
<text x="335.0" y="361.5" font-size="11" fill="#374151" text-anchor="middle">pull → up → healthy</text>
<line x1="410" y1="336" x2="610" y2="300" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="614" y="276" width="214" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="721.0" y="296.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">healthy 아님 → up(이전 태그)</text>
<text x="721.0" y="313.5" font-size="11" fill="#374151" text-anchor="middle">되돌림 성공/실패 로그, exit 1</text>
<line x1="410" y1="349" x2="610" y2="358" stroke="#b45309" stroke-width="1.8" marker-end="url(#a-amber)"/>
<rect x="614" y="336" width="214" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="721.0" y="354.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">pull 실패(3) → .env만 되돌림</text>
<text x="721.0" y="371.5" font-size="11" fill="#374151" text-anchor="middle">컨테이너 그대로, exit 1</text>
<line x1="410" y1="362" x2="610" y2="414" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="614" y="392" width="214" height="46" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="721.0" y="410.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">성공 → exit 0</text>
<text x="721.0" y="427.5" font-size="11" fill="#374151" text-anchor="middle">이전·지금 이미지만 남김</text>
</svg>
