<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>C 연산자 우선순위 사다리</title><rect width="640" height="470" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="320" y="30" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600">연산자 우선순위 (위가 먼저 계산)</text>
<rect x="60" y="50" width="470" height="30" fill="#e8f2ff"/>
<text x="72" y="70" font-size="13" fill="#1d1d1f" font-weight="600">후위</text>
<text x="160" y="70" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">a++  a--  ()  []  -&gt;  .</text>
<text x="552" y="70" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="83" width="470" height="30" fill="#f2f2f7"/>
<text x="72" y="103" font-size="13" fill="#1d1d1f" font-weight="600">단항</text>
<text x="160" y="103" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">++a  --a  !  ~  -  *p  &amp;a  sizeof  (형변환)</text>
<text x="552" y="103" font-size="14" fill="#6e6e73" text-anchor="middle">←</text>
<rect x="60" y="116" width="470" height="30" fill="#e8f2ff"/>
<text x="72" y="136" font-size="13" fill="#1d1d1f" font-weight="600">산술 곱셈</text>
<text x="160" y="136" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">*  /  %</text>
<text x="552" y="136" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="149" width="470" height="30" fill="#f2f2f7"/>
<text x="72" y="169" font-size="13" fill="#1d1d1f" font-weight="600">산술 덧셈</text>
<text x="160" y="169" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">+  -</text>
<text x="552" y="169" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="182" width="470" height="30" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="72" y="202" font-size="13" fill="#1d1d1f" font-weight="600">시프트</text>
<text x="160" y="202" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&lt;&lt;  &gt;&gt;</text>
<text x="552" y="202" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="215" width="470" height="30" fill="#f2f2f7"/>
<text x="72" y="235" font-size="13" fill="#1d1d1f" font-weight="600">관계</text>
<text x="160" y="235" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&lt;  &lt;=  &gt;  &gt;=</text>
<text x="552" y="235" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="248" width="470" height="30" fill="#e8f2ff"/>
<text x="72" y="268" font-size="13" fill="#1d1d1f" font-weight="600">같음</text>
<text x="160" y="268" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">==  !=</text>
<text x="552" y="268" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="281" width="470" height="30" fill="#fff4e5" stroke="#ff9f0a" stroke-width="1"/>
<text x="72" y="301" font-size="13" fill="#1d1d1f" font-weight="600">비트</text>
<text x="160" y="301" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&amp;   다음  ^   다음  |</text>
<text x="552" y="301" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="314" width="470" height="30" fill="#e8f2ff"/>
<text x="72" y="334" font-size="13" fill="#1d1d1f" font-weight="600">논리</text>
<text x="160" y="334" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&amp;&amp;   다음  ||</text>
<text x="552" y="334" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<rect x="60" y="347" width="470" height="30" fill="#f2f2f7"/>
<text x="72" y="367" font-size="13" fill="#1d1d1f" font-weight="600">조건</text>
<text x="160" y="367" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">? :</text>
<text x="552" y="367" font-size="14" fill="#6e6e73" text-anchor="middle">←</text>
<rect x="60" y="380" width="470" height="30" fill="#e8f2ff"/>
<text x="72" y="400" font-size="13" fill="#1d1d1f" font-weight="600">대입</text>
<text x="160" y="400" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">=  +=  -=  *=  /=  %=  &lt;&lt;=  &gt;&gt;=  &amp;=  ^=  |=</text>
<text x="552" y="400" font-size="14" fill="#6e6e73" text-anchor="middle">←</text>
<rect x="60" y="413" width="470" height="30" fill="#f2f2f7"/>
<text x="72" y="433" font-size="13" fill="#1d1d1f" font-weight="600">쉼표</text>
<text x="160" y="433" font-size="13" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">,</text>
<text x="552" y="433" font-size="14" fill="#6e6e73" text-anchor="middle">→</text>
<text x="552" y="44" font-size="12" fill="#6e6e73" text-anchor="middle">결합</text>
<line x1="40" y1="56" x2="40" y2="440" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)"/>
<text x="30" y="60" font-size="12" fill="#6e6e73" text-anchor="end">높음</text>
<text x="30" y="440" font-size="12" fill="#6e6e73" text-anchor="end">낮음</text>
<text x="320" y="464" font-size="13" fill="#ff9f0a" text-anchor="middle" font-weight="600">주황 칸이 함정: 1 &lt;&lt; a + 1 은 1 &lt;&lt; (a+1), 6 &amp; 3 == 3 은 6 &amp; (3 == 3)</text>
</svg>
