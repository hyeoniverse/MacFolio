<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">CIFAR-10 영상을 패치 토큰으로 바꾸는 과정 (patch_siz = 4)</text>

  <!-- 1. 32x32x3 영상을 8x8 패치 격자로 -->
  <g>
    <rect x="30" y="70" width="160" height="160" fill="#f5f5f7" stroke="#1d1d1f"/>
    <g stroke="#6e6e73" stroke-width="0.8">
      <line x1="50" y1="70" x2="50" y2="230"/><line x1="70" y1="70" x2="70" y2="230"/><line x1="90" y1="70" x2="90" y2="230"/>
      <line x1="110" y1="70" x2="110" y2="230"/><line x1="130" y1="70" x2="130" y2="230"/><line x1="150" y1="70" x2="150" y2="230"/>
      <line x1="170" y1="70" x2="170" y2="230"/>
      <line x1="30" y1="90" x2="190" y2="90"/><line x1="30" y1="110" x2="190" y2="110"/><line x1="30" y1="130" x2="190" y2="130"/>
      <line x1="30" y1="150" x2="190" y2="150"/><line x1="30" y1="170" x2="190" y2="170"/><line x1="30" y1="190" x2="190" y2="190"/>
      <line x1="30" y1="210" x2="190" y2="210"/>
    </g>
    <rect x="30" y="70" width="20" height="20" fill="#0a84ff" fill-opacity="0.35" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="110" y="56" text-anchor="middle" font-size="12" fill="#1d1d1f">입력 영상 32×32×3</text>
    <text x="110" y="252" text-anchor="middle" font-size="12" fill="#1d1d1f">8×8 격자 = 패치 64개</text>
    <text x="110" y="270" text-anchor="middle" font-size="11" fill="#6e6e73">N = HW/P² = 32·32/4² = 64</text>
  </g>

  <path d="M200 150 L238 150" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M232 145 L240 150 L232 155" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>

  <!-- 2. 패치 하나를 펼침 -->
  <g>
    <rect x="250" y="120" width="40" height="40" fill="#0a84ff" fill-opacity="0.35" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="270" y="106" text-anchor="middle" font-size="12" fill="#1d1d1f">패치 4×4×3</text>
    <path d="M300 140 L318 140" stroke="#1d1d1f" stroke-width="1.5"/>
    <path d="M312 135 L320 140 L312 145" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <rect x="326" y="70" width="18" height="140" fill="#0a84ff" fill-opacity="0.15" stroke="#0a84ff"/>
    <text x="335" y="230" text-anchor="middle" font-size="12" fill="#1d1d1f">flatten</text>
    <text x="335" y="248" text-anchor="middle" font-size="11" fill="#6e6e73">48차원</text>
    <text x="335" y="264" text-anchor="middle" font-size="11" fill="#6e6e73">(P²·C = 16·3)</text>
  </g>

  <path d="M354 140 L392 140" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M386 135 L394 140 L386 145" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>

  <!-- 3. 선형 투영 -->
  <g>
    <rect x="400" y="112" width="96" height="56" rx="8" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="448" y="136" text-anchor="middle" font-size="12" fill="#1d1d1f">Dense(64)</text>
    <text x="448" y="154" text-anchor="middle" font-size="11" fill="#6e6e73">선형 투영 E</text>
    <text x="448" y="196" text-anchor="middle" font-size="12" fill="#1d1d1f">+ 위치 임베딩</text>
    <text x="448" y="214" text-anchor="middle" font-size="11" fill="#6e6e73">Embedding(64, 64)</text>
  </g>

  <path d="M506 140 L544 140" stroke="#1d1d1f" stroke-width="1.5"/>
  <path d="M538 135 L546 140 L538 145" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>

  <!-- 4. 토큰 행렬 -->
  <g>
    <rect x="556" y="70" width="64" height="140" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff"/>
    <g stroke="#0a84ff" stroke-width="0.6">
      <line x1="556" y1="87.5" x2="620" y2="87.5"/><line x1="556" y1="105" x2="620" y2="105"/><line x1="556" y1="122.5" x2="620" y2="122.5"/>
      <line x1="556" y1="140" x2="620" y2="140"/><line x1="556" y1="157.5" x2="620" y2="157.5"/><line x1="556" y1="175" x2="620" y2="175"/>
      <line x1="556" y1="192.5" x2="620" y2="192.5"/>
    </g>
    <text x="588" y="56" text-anchor="middle" font-size="12" fill="#1d1d1f">토큰 행렬</text>
    <text x="588" y="230" text-anchor="middle" font-size="12" fill="#1d1d1f">64×64</text>
    <text x="588" y="248" text-anchor="middle" font-size="11" fill="#6e6e73">(패치 수 × d_model)</text>
  </g>

  <text x="320" y="300" text-anchor="middle" font-size="12" fill="#6e6e73">72×72로 키우고 patch_siz = 6이면 패치 (72/6)² = 144개, 패치 하나는 6·6·3 = 108차원이다</text>
</svg>
