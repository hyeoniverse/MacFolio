<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="400" fill="#fff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">size-adjust로 대체 글꼴의 글자 폭 맞추기</text>
  <text x="24" y="54" font-size="12" fill="#6e6e73">한글 한 글자의 전진 폭(hmtx, 글자 크기 1em 기준). 폭이 다르면 같은 제목도 줄바꿈 위치가 달라진다</text>

  <text x="24" y="96" font-size="13" font-weight="600" fill="#1d1d1f">Noto Serif KR</text>
  <rect x="200" y="80" width="386.4" height="26" rx="4" fill="#ff9f0a"/>
  <text x="208" y="98" font-size="12" fill="#1d1d1f">0.966em</text>

  <text x="24" y="140" font-size="13" font-weight="600" fill="#1d1d1f">Pretendard</text>
  <rect x="200" y="124" width="345.6" height="26" rx="4" fill="#c7c7cc"/>
  <text x="208" y="142" font-size="12" fill="#1d1d1f">0.864em</text>
  <line x1="545.6" y1="118" x2="545.6" y2="156" stroke="#ff3b30" stroke-dasharray="3 3"/>
  <line x1="586.4" y1="118" x2="586.4" y2="156" stroke="#ff3b30" stroke-dasharray="3 3"/>
  <text x="566" y="172" font-size="12" fill="#ff3b30" text-anchor="middle">차이</text>

  <text x="24" y="206" font-size="13" font-weight="600" fill="#1d1d1f">Pretendard</text>
  <text x="24" y="222" font-size="12" fill="#6e6e73">+ size-adjust 111.8%</text>
  <rect x="200" y="194" width="386.3" height="26" rx="4" fill="#0a84ff"/>
  <text x="208" y="212" font-size="12" fill="#fff">0.864em × 1.118 ≈ 0.966em</text>

  <line x1="24" y1="246" x2="616" y2="246" stroke="#c7c7cc"/>

  <text x="24" y="274" font-size="13" font-weight="700" fill="#1d1d1f">HYEONIVERSE 페이지 제목 상자</text>
  <rect x="24" y="290" width="284" height="92" rx="8" fill="#fff5f4" stroke="#ff3b30"/>
  <text x="38" y="314" font-size="12" font-weight="600" fill="#1d1d1f">폭을 맞추지 않았을 때</text>
  <text x="38" y="338" font-size="12" fill="#1d1d1f">명조를 받기 전 한 줄, 높이 43px</text>
  <text x="38" y="358" font-size="12" fill="#1d1d1f">명조를 받은 뒤 두 줄, 높이 87px</text>
  <text x="38" y="374" font-size="12" fill="#ff3b30">글꼴이 바뀌는 시각에 아래 내용이 밀린다</text>

  <rect x="332" y="290" width="284" height="92" rx="8" fill="#f0fbf3" stroke="#34c759"/>
  <text x="346" y="314" font-size="12" font-weight="600" fill="#1d1d1f">size-adjust 111.8%를 준 뒤</text>
  <text x="346" y="338" font-size="12" fill="#1d1d1f">바뀌기 전 571×87px</text>
  <text x="346" y="358" font-size="12" fill="#1d1d1f">바뀐 뒤 571×87px</text>
  <text x="346" y="374" font-size="12" fill="#248a3d">줄바꿈과 높이가 같다</text>
</svg>
