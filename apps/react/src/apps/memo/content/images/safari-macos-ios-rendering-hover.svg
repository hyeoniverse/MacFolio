<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>:hover만 쓰면 탭한 항목이 계속 강조되고, @media (hover: hover) 안에 두면 터치 기기에서는 강조가 생기지 않는다</title>
<rect width="860" height="400" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">터치 기기에서는 :hover가 탭한 뒤에도 남는다</text>
<text x="32" y="56" font-size="11" fill="#6b7280">모바일 브라우저는 탭을 hover처럼 처리해, 다른 곳을 누를 때까지 :hover 스타일이 유지된다 (도식)</text>
<text x="250" y="88" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">:hover만 사용</text>
<text x="250" y="384" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.item:hover { … }</text>
<rect x="160" y="100" width="180" height="270" rx="26" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<clipPath id="s160"><rect x="166" y="106" width="168" height="258" rx="21"/></clipPath>
<g clip-path="url(#s160)">
<rect x="166" y="106" width="168" height="258" fill="#ffffff"/>
<text x="178" y="148" font-size="11" fill="#1f2937" font-weight="700" text-anchor="start">목록</text>
<rect x="178" y="162" width="144" height="28" rx="8" fill="#f3f4f6" stroke="none"/>
<rect x="178" y="198" width="144" height="28" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<rect x="178" y="234" width="144" height="28" rx="8" fill="#f3f4f6" stroke="none"/>
<rect x="178" y="270" width="144" height="28" rx="8" fill="#f3f4f6" stroke="none"/>
<text x="188" y="180" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 1</text>
<text x="188" y="216" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 2</text>
<text x="188" y="252" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 3</text>
<text x="188" y="288" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 4</text>
<text x="314" y="216" font-size="14" fill="#1f2937" font-weight="400" text-anchor="end">👆</text>
<text x="250.0" y="344" font-size="9" fill="#b91c1c" font-weight="700" text-anchor="middle">탭한 뒤 다른 곳을 봐도</text>
<text x="250.0" y="356" font-size="9" fill="#b91c1c" font-weight="700" text-anchor="middle">:hover 강조가 남는다</text>
</g>
<rect x="224.0" y="112" width="52" height="14" rx="7" fill="#111827"/>
<text x="590" y="88" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">@media (hover: hover)</text>
<text x="590" y="384" font-size="10.5" fill="#15803d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">@media (hover: hover) { … }</text>
<rect x="500" y="100" width="180" height="270" rx="26" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<clipPath id="s500"><rect x="506" y="106" width="168" height="258" rx="21"/></clipPath>
<g clip-path="url(#s500)">
<rect x="506" y="106" width="168" height="258" fill="#ffffff"/>
<text x="518" y="148" font-size="11" fill="#1f2937" font-weight="700" text-anchor="start">목록</text>
<rect x="518" y="162" width="144" height="28" rx="8" fill="#f3f4f6"/>
<rect x="518" y="198" width="144" height="28" rx="8" fill="#f3f4f6"/>
<rect x="518" y="234" width="144" height="28" rx="8" fill="#f3f4f6"/>
<rect x="518" y="270" width="144" height="28" rx="8" fill="#f3f4f6"/>
<text x="528" y="180" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 1</text>
<text x="528" y="216" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 2</text>
<text x="528" y="252" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 3</text>
<text x="528" y="288" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">항목 4</text>
<text x="590.0" y="350" font-size="9" fill="#15803d" font-weight="700" text-anchor="middle">터치 기기에는 강조를 주지 않는다</text>
</g>
<rect x="564.0" y="112" width="52" height="14" rx="7" fill="#111827"/>
</svg>
