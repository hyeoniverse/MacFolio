<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="690" fill="#fff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d70015"/></marker>
  </defs>
  <!-- 영역 -->
  <g fill="none" stroke="#6e6e73" stroke-dasharray="5 4">
    <rect x="18" y="404" width="420" height="172"/>
    <rect x="450" y="300" width="125" height="176"/>
  </g>
  <g font-size="11.5" fill="#6e6e73" text-anchor="middle">
    <text x="228" y="592">능동 폐쇄</text>
    <text x="512" y="492">수동 폐쇄</text>
  </g>
  <!-- 상태 -->
  <g fill="#f2f2f7" stroke="#1d1d1f">
    <rect x="265" y="35" width="110" height="30" rx="10"/>
    <rect x="265" y="125" width="110" height="30" rx="10"/>
    <rect x="40" y="225" width="110" height="30" rx="10"/>
    <rect x="460" y="225" width="110" height="30" rx="10"/>
    <rect x="260" y="315" width="120" height="30" rx="10"/>
    <rect x="460" y="315" width="110" height="30" rx="10"/>
    <rect x="460" y="430" width="110" height="30" rx="10"/>
    <rect x="30" y="430" width="110" height="30" rx="10"/>
    <rect x="265" y="430" width="110" height="30" rx="10"/>
    <rect x="30" y="520" width="110" height="30" rx="10"/>
    <rect x="265" y="520" width="110" height="30" rx="10"/>
  </g>
  <g font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">
    <text x="320" y="55">CLOSED</text>
    <text x="320" y="145">LISTEN</text>
    <text x="95" y="245">SYN-RCVD</text>
    <text x="515" y="245">SYN-SENT</text>
    <text x="320" y="335">ESTABLISHED</text>
    <text x="515" y="335">CLOSE-WAIT</text>
    <text x="515" y="450">LAST-ACK</text>
    <text x="85" y="450">FIN-WAIT-1</text>
    <text x="320" y="450">CLOSING</text>
    <text x="85" y="540">FIN-WAIT-2</text>
    <text x="320" y="540">TIME-WAIT</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#6e6e73">
    <text x="320" y="27">시작점</text>
    <text x="320" y="171">수동 개방</text>
    <text x="515" y="271">능동 개방</text>
    <text x="320" y="361">데이터 전송 상태</text>
    <text x="320" y="566">2MSL 타임아웃</text>
  </g>
  <!-- 복귀 경로 -->
  <path d="M375,535 H630 V50 H379" fill="none" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#b)"/>
  <!-- 서버(빨간 점선) -->
  <g fill="none" stroke="#d70015" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)">
    <line x1="320" y1="65" x2="320" y2="122"/>
    <line x1="265" y1="146" x2="112" y2="222"/>
    <line x1="140" y1="255" x2="257" y2="318"/>
    <line x1="380" y1="330" x2="457" y2="330"/>
    <line x1="515" y1="345" x2="515" y2="427"/>
    <line x1="570" y1="445" x2="627" y2="445"/>
  </g>
  <!-- 클라이언트(파란 실선) -->
  <g fill="none" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#b)">
    <line x1="370" y1="65" x2="505" y2="222"/>
    <line x1="490" y1="255" x2="383" y2="320"/>
    <line x1="265" y1="342" x2="142" y2="430"/>
    <line x1="85" y1="460" x2="85" y2="517"/>
    <line x1="140" y1="535" x2="262" y2="535"/>
  </g>
  <!-- 그 밖 -->
  <g fill="none" stroke="#1d1d1f" stroke-width="1.2" marker-end="url(#k)">
    <line x1="375" y1="150" x2="470" y2="222"/>
    <line x1="140" y1="225" x2="282" y2="157"/>
    <line x1="460" y1="240" x2="153" y2="240"/>
    <line x1="570" y1="240" x2="627" y2="240"/>
    <line x1="85" y1="255" x2="85" y2="427"/>
    <line x1="140" y1="445" x2="262" y2="445"/>
    <line x1="140" y1="455" x2="268" y2="520"/>
    <line x1="320" y1="460" x2="320" y2="517"/>
  </g>
  <!-- 라벨 -->
  <g font-size="11" fill="#1d1d1f">
    <text x="312" y="88" text-anchor="end">응용: 수동 개방</text>
    <text x="312" y="102" text-anchor="end">송신: 없음</text>
    <text x="440" y="108">응용: 능동 개방</text>
    <text x="440" y="122">송신: SYN</text>
    <text x="418" y="196" text-anchor="end">응용: 데이터 전송</text>
    <text x="428" y="210" text-anchor="end">송신: SYN</text>
    <text x="180" y="166" text-anchor="end">수신: SYN</text>
    <text x="180" y="180" text-anchor="end">송신: SYN, ACK</text>
    <text x="222" y="210">수신: RST</text>
    <text x="305" y="233" text-anchor="middle">수신: SYN</text>
    <text x="305" y="254" text-anchor="middle">송신: SYN, ACK</text>
    <text x="305" y="268" text-anchor="middle" fill="#6e6e73">동시 개방</text>
    <text x="626" y="270" text-anchor="end">응용: 닫기</text>
    <text x="626" y="284" text-anchor="end">또는 타임아웃</text>
    <text x="395" y="290" text-anchor="end">수신: SYN, ACK</text>
    <text x="395" y="304" text-anchor="end">송신: ACK</text>
    <text x="196" y="300" text-anchor="end">수신: ACK</text>
    <text x="196" y="314" text-anchor="end">송신: 없음</text>
    <text x="420" y="352" text-anchor="middle">수신: FIN</text>
    <text x="420" y="366" text-anchor="middle">송신: ACK</text>
    <text x="92" y="330">응용: 닫기</text>
    <text x="92" y="344">송신: FIN</text>
    <text x="222" y="384">응용: 닫기</text>
    <text x="222" y="398">송신: FIN</text>
    <text x="523" y="384">응용: 닫기</text>
    <text x="523" y="398">송신: FIN</text>
    <text x="603" y="437" text-anchor="middle">수신: ACK</text>
    <text x="603" y="463" text-anchor="middle">송신: 없음</text>
    <text x="200" y="437" text-anchor="middle">수신: FIN</text>
    <text x="200" y="458" text-anchor="middle">송신: ACK</text>
    <text x="312" y="422" text-anchor="end" fill="#6e6e73">동시 폐쇄</text>
    <text x="236" y="486">수신: FIN, ACK</text>
    <text x="236" y="500">송신: ACK</text>
    <text x="328" y="484">수신: ACK</text>
    <text x="328" y="498">송신: 없음</text>
    <text x="92" y="484">수신: ACK</text>
    <text x="92" y="498">송신: 없음</text>
    <text x="200" y="527" text-anchor="middle">수신: FIN</text>
    <text x="200" y="550" text-anchor="middle">송신: ACK</text>
  </g>
  <!-- 범례 -->
  <g font-size="11.5" fill="#1d1d1f">
    <line x1="20" y1="612" x2="56" y2="612" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#b)"/>
    <text x="66" y="616">클라이언트의 일반적인 상태 전이</text>
    <line x1="320" y1="612" x2="356" y2="612" stroke="#d70015" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#r)"/>
    <text x="366" y="616">서버의 일반적인 상태 전이</text>
    <text x="20" y="640">응용(appl): 응용이 해당 동작을 했을 때 일어나는 상태 전이</text>
    <text x="20" y="658">수신(recv): 해당 세그먼트를 수신했을 때 일어나는 상태 전이</text>
    <text x="20" y="676">송신(send): 이 상태 전이로 보내는 세그먼트(있다면)</text>
  </g>
</svg>
