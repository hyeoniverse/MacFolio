<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>저장소가 실패하는 세 경우와 storage.ts의 답. 접근 자체가 막히면 SecurityError, 쓰기가 막히면 QuotaExceededError, 값이 깨졌으면 JSON 오류. readJson은 null, writeJson은 false를 돌려주고 화면은 그대로 간다</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="800" height="260" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">실패는 storage.ts 안에서 끝난다</text>
<g font-size="11">
<rect x="32" y="62" width="300" height="44" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="48" y="82" fill="#1f2937">localStorage에 손대는 순간 SecurityError</text>
<text x="48" y="98" fill="#6b7280" font-size="10">일부 브라우저의 쿠키·사이트 데이터 차단</text>
<rect x="32" y="116" width="300" height="44" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="48" y="136" fill="#1f2937">setItem에서 QuotaExceededError</text>
<text x="48" y="152" fill="#6b7280" font-size="10">사생활 보호 창, 저장 공간 가득</text>
<rect x="32" y="170" width="300" height="44" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="48" y="190" fill="#1f2937">값이 JSON이 아니다</text>
<text x="48" y="206" fill="#6b7280" font-size="10">손으로 고친 값, 옛 형식</text>
<rect x="400" y="100" width="170" height="76" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="485" y="128" fill="#1f2937" font-weight="600" text-anchor="middle">storage.ts</text>
<text x="485" y="146" fill="#374151" text-anchor="middle" font-size="10">try/catch 4개</text>
<text x="485" y="162" fill="#374151" text-anchor="middle" font-size="10">readJson · writeJson …</text>
<path d="M334 84 L398 120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M334 138 H398" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M334 192 L398 158" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="612" y="88" width="160" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="692" y="114" fill="#1f2937" text-anchor="middle">읽기 → null</text>
<rect x="612" y="144" width="160" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="692" y="170" fill="#1f2937" text-anchor="middle">쓰기 → false</text>
<path d="M572 128 L610 112" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M572 150 L610 164" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
</g>
<text x="32" y="242" font-size="10.5" fill="#6b7280">부르는 쪽은 null이면 기본값(parseSettings(null) 등)을 쓴다. 화면은 이번 방문 동안 그대로 보인다</text>
</svg>
