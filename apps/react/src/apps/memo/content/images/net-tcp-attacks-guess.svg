<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">수신 창이 넓을수록 위조 패킷이 창 안에 들 확률이 커진다</text>
  <!-- full space bar -->
  <text x="30" y="62" font-size="12" font-weight="600" fill="#1d1d1f">시퀀스 번호 공간 전체: 2³² = 4,294,967,296</text>
  <rect x="30" y="72" width="580" height="26" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="30" y="114" font-size="12" fill="#6e6e73">0</text>
  <text x="610" y="114" text-anchor="end" font-size="12" fill="#6e6e73">2³² − 1</text>
  <!-- case A: default window -->
  <text x="30" y="150" font-size="13" font-weight="600" fill="#1d1d1f">기본 창 87,380바이트</text>
  <rect x="30" y="160" width="580" height="26" fill="#f2f2f7" stroke="#6e6e73"/>
  <rect x="300" y="160" width="2" height="26" fill="#ff9f0a"/>
  <text x="308" y="178" font-size="12" fill="#ff9f0a">창 하나 = 공간의 약 1/49,153</text>
  <text x="30" y="204" font-size="12" fill="#1d1d1f">창 크기 간격으로 번호를 바꿔 가며 보내면 최대 약 49,153번 안에 창 안에 든다</text>
  <!-- case B: max window -->
  <text x="30" y="240" font-size="13" font-weight="600" fill="#1d1d1f">최대 창 3,493,888바이트</text>
  <rect x="30" y="250" width="580" height="26" fill="#f2f2f7" stroke="#6e6e73"/>
  <rect x="300" y="250" width="12" height="26" fill="#ff3b30"/>
  <text x="320" y="268" font-size="12" fill="#ff3b30">창 하나 = 공간의 약 1/1,229</text>
  <text x="30" y="294" font-size="12" fill="#1d1d1f">같은 방식이면 최대 약 1,229번이면 충분하다</text>
  <text x="30" y="318" font-size="12" fill="#6e6e73">필요한 추측 수 ≈ 2³² ÷ RCV.WND (막대 안 색칠 폭은 비율을 과장해 표시)</text>
</svg>
