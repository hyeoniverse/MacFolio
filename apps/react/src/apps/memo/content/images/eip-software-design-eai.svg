<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>EAI 구축 유형</title><rect width="640" height="420" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">EAI의 네 가지 구축 유형</text><text x="160" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">포인트 투 포인트</text><line x1="90" y1="90" x2="230" y2="90" stroke="#6e6e73" stroke-width="1.5"/><line x1="90" y1="90" x2="90" y2="180" stroke="#6e6e73" stroke-width="1.5"/><line x1="90" y1="90" x2="230" y2="180" stroke="#6e6e73" stroke-width="1.5"/><line x1="230" y1="90" x2="90" y2="180" stroke="#6e6e73" stroke-width="1.5"/><line x1="230" y1="90" x2="230" y2="180" stroke="#6e6e73" stroke-width="1.5"/><line x1="90" y1="180" x2="230" y2="180" stroke="#6e6e73" stroke-width="1.5"/><rect x="68" y="76" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="90" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">A</text><rect x="208" y="76" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="230" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">B</text><rect x="68" y="166" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="90" y="184" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">C</text><rect x="208" y="166" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="230" y="184" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">D</text><text x="160" y="216" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">1:1로 직접 연결, 시스템이 늘면 연결 수 급증</text><text x="480" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">허브 앤 스포크</text><line x1="400" y1="85" x2="480" y2="135" stroke="#6e6e73" stroke-width="1.5"/><line x1="560" y1="85" x2="480" y2="135" stroke="#6e6e73" stroke-width="1.5"/><line x1="400" y1="185" x2="480" y2="135" stroke="#6e6e73" stroke-width="1.5"/><line x1="560" y1="185" x2="480" y2="135" stroke="#6e6e73" stroke-width="1.5"/><circle cx="480" cy="135" r="22" fill="#0a84ff"/><text x="480" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">허브</text><rect x="378" y="71" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="400" y="89" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">A</text><rect x="538" y="71" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="560" y="89" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">B</text><rect x="378" y="171" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="400" y="189" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">C</text><rect x="538" y="171" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="560" y="189" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">D</text><text x="480" y="216" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">허브 하나로 중앙 집중, 허브 장애 시 전체 중단</text><line x1="20" y1="232" x2="620" y2="232" stroke="#f2f2f7" stroke-width="2"/><line x1="320" y1="40" x2="320" y2="450" stroke="#f2f2f7" stroke-width="2"/><text x="160" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">메시지 버스 (ESB 방식)</text><rect x="40" y="330" width="240" height="24" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="160.0" y="346.3" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">버스 (미들웨어)</text><line x1="70" y1="300" x2="70" y2="330" stroke="#6e6e73" stroke-width="1.5"/><rect x="48" y="276" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="70" y="294" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">A</text><rect x="56" y="304" width="28" height="12" rx="2" fill="#30d158"/><line x1="130" y1="300" x2="130" y2="330" stroke="#6e6e73" stroke-width="1.5"/><rect x="108" y="276" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="130" y="294" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">B</text><rect x="116" y="304" width="28" height="12" rx="2" fill="#30d158"/><line x1="190" y1="300" x2="190" y2="330" stroke="#6e6e73" stroke-width="1.5"/><rect x="168" y="276" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="190" y="294" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">C</text><rect x="176" y="304" width="28" height="12" rx="2" fill="#30d158"/><line x1="250" y1="300" x2="250" y2="330" stroke="#6e6e73" stroke-width="1.5"/><rect x="228" y="276" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="250" y="294" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">D</text><rect x="236" y="304" width="28" height="12" rx="2" fill="#30d158"/><text x="160" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">시스템마다 어댑터(초록)를 두고 버스로 통신</text><text x="160" y="402" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">확장성이 높아 대용량 처리에 유리</text><text x="480" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">하이브리드</text><rect x="360" y="350" width="240" height="24" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="480.0" y="366.3" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">버스</text><line x1="420" y1="337" x2="420" y2="350" stroke="#6e6e73" stroke-width="1.5"/><line x1="420" y1="322" x2="386" y2="286" stroke="#6e6e73" stroke-width="1.5"/><rect x="364" y="272" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="386" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f"></text><line x1="420" y1="322" x2="454" y2="286" stroke="#6e6e73" stroke-width="1.5"/><rect x="432" y="272" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="454" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f"></text><circle cx="420" cy="322" r="15" fill="#0a84ff"/><text x="420" y="326" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">허브</text><line x1="540" y1="337" x2="540" y2="350" stroke="#6e6e73" stroke-width="1.5"/><line x1="540" y1="322" x2="506" y2="286" stroke="#6e6e73" stroke-width="1.5"/><rect x="484" y="272" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="506" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f"></text><line x1="540" y1="322" x2="574" y2="286" stroke="#6e6e73" stroke-width="1.5"/><rect x="552" y="272" width="44" height="28" rx="5" fill="#f2f2f7" stroke="#6e6e73"/><text x="574" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f"></text><circle cx="540" cy="322" r="15" fill="#0a84ff"/><text x="540" y="326" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">허브</text><text x="480" y="402" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">그룹 안은 허브 앤 스포크, 그룹 사이는 메시지 버스</text></svg>
