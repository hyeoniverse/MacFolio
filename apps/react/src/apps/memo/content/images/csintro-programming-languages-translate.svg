<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>컴파일러, 인터프리터, 바이트코드와 가상 머신 방식의 실행 과정 비교</title>
<rect width="640" height="330" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<g font-size="13" fill="#1d1d1f">
<text x="20" y="30" font-size="14" font-weight="700" fill="#0a84ff">컴파일 방식 (C, Rust, Go)</text>
<rect x="20" y="44" width="110" height="44" rx="6" fill="#f2f2f7"/><text x="75" y="71" text-anchor="middle">소스 코드</text>
<rect x="170" y="44" width="110" height="44" rx="6" fill="#0a84ff"/><text x="225" y="71" text-anchor="middle" fill="#fff">컴파일러</text>
<rect x="320" y="44" width="130" height="44" rx="6" fill="#f2f2f7"/><text x="385" y="64" text-anchor="middle">실행 파일</text><text x="385" y="80" text-anchor="middle" font-size="12" fill="#6e6e73">(기계어)</text>
<rect x="490" y="44" width="130" height="44" rx="6" fill="#f2f2f7"/><text x="555" y="71" text-anchor="middle">CPU가 실행</text>
<line x1="130" y1="66" x2="168" y2="66" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="66" x2="318" y2="66" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="450" y1="66" x2="488" y2="66" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<text x="225" y="106" text-anchor="middle" font-size="12" fill="#6e6e73">실행 전에 한 번 전체 번역</text><text x="555" y="106" text-anchor="middle" font-size="12" fill="#6e6e73">번역 없이 반복 실행</text>
<text x="20" y="140" font-size="14" font-weight="700" fill="#ff9f0a">인터프리터 방식 (셸 스크립트, 초기 BASIC)</text>
<rect x="20" y="154" width="110" height="44" rx="6" fill="#f2f2f7"/><text x="75" y="181" text-anchor="middle">소스 코드</text>
<rect x="170" y="154" width="280" height="44" rx="6" fill="#ff9f0a"/><text x="310" y="181" text-anchor="middle" fill="#fff">인터프리터: 문장을 읽고 바로 실행</text>
<rect x="490" y="154" width="130" height="44" rx="6" fill="#f2f2f7"/><text x="555" y="181" text-anchor="middle">실행 결과</text>
<line x1="130" y1="176" x2="168" y2="176" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="450" y1="176" x2="488" y2="176" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
<text x="310" y="216" text-anchor="middle" font-size="12" fill="#6e6e73">실행할 때마다 해석. 실행 파일이 남지 않는다</text>
<text x="20" y="250" font-size="14" font-weight="700" fill="#34c759">바이트코드 + 가상 머신 (Java, Python, C#)</text>
<rect x="20" y="264" width="90" height="44" rx="6" fill="#f2f2f7"/><text x="65" y="291" text-anchor="middle">소스 코드</text>
<rect x="140" y="264" width="100" height="44" rx="6" fill="#34c759"/><text x="190" y="291" text-anchor="middle" fill="#fff">컴파일러</text>
<rect x="270" y="264" width="100" height="44" rx="6" fill="#f2f2f7"/><text x="320" y="291" text-anchor="middle">바이트코드</text>
<rect x="400" y="264" width="220" height="44" rx="6" fill="#34c759"/><text x="510" y="284" text-anchor="middle" fill="#fff">가상 머신</text><text x="510" y="300" text-anchor="middle" fill="#fff" font-size="12">해석 + 자주 쓰는 부분은 JIT 컴파일</text>
<line x1="110" y1="286" x2="138" y2="286" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="240" y1="286" x2="268" y2="286" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><line x1="370" y1="286" x2="398" y2="286" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/>
</g>
</svg>
