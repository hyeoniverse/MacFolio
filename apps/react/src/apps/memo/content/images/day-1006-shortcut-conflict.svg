<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>Safari 메뉴에서 같은 ⌥W가 두 항목에 지정된 경우</title>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="14" font-weight="700" fill="#ff3b30">변경 전</text>
<text x="330" y="30" font-size="14" font-weight="700" fill="#34c759">변경 후</text>
<text x="20" y="52" font-size="12" fill="#6e6e73">키를 누르면 메뉴 항목을 위에서부터 찾는다</text>
<text x="330" y="52" font-size="12" fill="#6e6e73">앱이 ⌥W를 쓰면 윈도우 닫기는 ⌥⇧W</text>
<g>
<rect x="20" y="66" width="290" height="186" rx="10" fill="#f2f2f7"/>
<text x="36" y="92" font-size="12" font-weight="600" fill="#6e6e73">Safari 메뉴 항목 (일부, 등록 순서)</text>
<rect x="32" y="104" width="266" height="34" rx="6" fill="#eef6ff" stroke="#0a84ff"/>
<text x="44" y="126" font-size="13" fill="#1d1d1f">1. 탭 닫기</text><text x="286" y="126" font-size="13" fill="#0a84ff" text-anchor="end">⌥W ← 실행</text>
<rect x="32" y="146" width="266" height="34" rx="6" fill="#ffffff"/>
<text x="44" y="168" font-size="13" fill="#1d1d1f">2. 새로운 탭</text><text x="286" y="168" font-size="13" fill="#6e6e73" text-anchor="end">⌥T</text>
<rect x="32" y="188" width="266" height="34" rx="6" fill="#fff1f0" stroke="#ff3b30"/>
<text x="44" y="210" font-size="13" fill="#1d1d1f">3. 윈도우 닫기</text><text x="286" y="210" font-size="13" fill="#ff3b30" text-anchor="end">⌥W 표시만, 실행 안 됨</text>
<text x="36" y="242" font-size="12" fill="#6e6e73">첫 번째 일치에서 탐색이 끝난다</text>
</g>
<g>
<rect x="330" y="66" width="290" height="186" rx="10" fill="#f2f2f7"/>
<text x="346" y="92" font-size="12" font-weight="600" fill="#6e6e73">Safari 메뉴 항목 (일부, 등록 순서)</text>
<rect x="342" y="104" width="266" height="34" rx="6" fill="#ffffff"/>
<text x="354" y="126" font-size="13" fill="#1d1d1f">1. 탭 닫기</text><text x="596" y="126" font-size="13" fill="#1d1d1f" text-anchor="end">⌥W</text>
<rect x="342" y="146" width="266" height="34" rx="6" fill="#ffffff"/>
<text x="354" y="168" font-size="13" fill="#1d1d1f">2. 새로운 탭</text><text x="596" y="168" font-size="13" fill="#6e6e73" text-anchor="end">⌥T</text>
<rect x="342" y="188" width="266" height="34" rx="6" fill="#ecfaef" stroke="#34c759"/>
<text x="354" y="210" font-size="13" fill="#1d1d1f">3. 윈도우 닫기</text><text x="596" y="210" font-size="13" fill="#34c759" text-anchor="end">⌥⇧W</text>
<text x="346" y="242" font-size="12" fill="#6e6e73">키 조합마다 항목이 하나뿐이다</text>
</g>
<text x="20" y="284" font-size="12" fill="#6e6e73">⌥W를 쓰지 않는 앱(메모, Finder 등)에서는 윈도우 닫기가 그대로 ⌥W다</text>
</svg>
