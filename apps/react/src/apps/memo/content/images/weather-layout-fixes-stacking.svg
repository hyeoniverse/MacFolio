<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>backdrop-filter가 만든 쌓임 맥락</title>
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">쌓임 맥락 안의 z-index는 그 맥락 안에서만 비교된다</text>
  <g font-size="12">
    <text x="20" y="60" font-weight="600" fill="#1d1d1f">요소 구조</text>
    <rect x="20" y="70" width="330" height="250" rx="12" fill="#f2f2f7" stroke="#6e6e73"/>
    <text x="34" y="92" font-weight="600" fill="#1d1d1f">날씨 창 (쌓임 맥락)</text>
    <rect x="36" y="106" width="298" height="120" rx="10" fill="#ffffff" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="50" y="128" font-weight="600" fill="#1d1d1f">떠 있는 사이드바</text>
    <text x="50" y="146" fill="#6e6e73">backdrop-filter: blur(…) → 새 쌓임 맥락</text>
    <rect x="50" y="160" width="270" height="52" rx="8" fill="#eaf3ff" stroke="#0a84ff"/>
    <text x="64" y="182" fill="#1d1d1f">사이드바 버튼  z-index를 크게 올려도</text>
    <text x="64" y="200" fill="#6e6e73">사이드바 안의 형제들과만 순서를 비교</text>
    <rect x="36" y="240" width="298" height="64" rx="10" fill="#ffffff" stroke="#6e6e73"/>
    <text x="50" y="263" fill="#1d1d1f">신호등 줄 (창 끌기 영역)  z-index: 3</text>
    <text x="50" y="283" fill="#6e6e73">사이드바 버튼과 같은 높이에 놓인다</text>

    <text x="380" y="60" font-weight="600" fill="#1d1d1f">창 안에서 칠하는 순서 (위가 앞)</text>
    <rect x="380" y="76" width="240" height="44" rx="8" fill="#fff" stroke="#6e6e73"/>
    <text x="394" y="103" fill="#1d1d1f">신호등 줄  z 3</text>
    <rect x="380" y="128" width="240" height="64" rx="8" fill="#fff" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="394" y="150" fill="#1d1d1f">사이드바 묶음  z 지정 없음</text>
    <text x="394" y="170" fill="#6e6e73">버튼의 z-index는 묶음 안에서만 쓰인다</text>
    <text x="394" y="186" fill="#6e6e73">→ 버튼이 끌기 영역 아래에 깔린다</text>
    <rect x="380" y="212" width="240" height="108" rx="8" fill="#fff5f5" stroke="#ff3b30"/>
    <text x="394" y="234" font-weight="600" fill="#ff3b30">수정 전: 사이드바 묶음 전체를 z 4로</text>
    <text x="394" y="254" fill="#1d1d1f">버튼은 클릭되지만 어두운 사이드바</text>
    <text x="394" y="272" fill="#1d1d1f">전체가 신호등을 덮는다</text>
    <text x="394" y="296" font-weight="600" fill="#34c759">수정 후: 버튼을 사이드바 밖으로</text>
    <text x="394" y="312" fill="#1d1d1f">꺼내 버튼만 z 4</text>
  </g>
</svg>
