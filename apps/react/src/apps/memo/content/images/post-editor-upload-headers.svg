<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="820" height="400" rx="16" fill="#fff"/>
  <text x="410" y="30" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">업로드한 파일의 형식 판별과 응답 헤더 (apps/api/src/files/)</text>

  <rect x="24" y="130" width="160" height="64" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="104" y="157" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">POST /files</text>
  <text x="104" y="174" font-size="10" fill="#4b5563" text-anchor="middle">10MB 이하 (API + DB CHECK)</text>
  <line x1="186" y1="162" x2="222" y2="162" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="224" y="130" width="190" height="64" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="319" y="157" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="600">sniffImage(앞부분 바이트)</text>
  <text x="319" y="174" font-size="10" fill="#4b5563" text-anchor="middle">브라우저가 보낸 MIME은 사용 안 함</text>

  <line x1="416" y1="150" x2="462" y2="98" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="416" y1="176" x2="462" y2="228" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="464" y="60" width="332" height="76" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="480" y="82" font-size="11" fill="#047857" font-weight="600">이미지: PNG · JPEG · GIF · WebP</text>
  <text x="480" y="100" font-size="10" fill="#4b5563">89 50 4E 47 … / FF D8 FF / 47 49 46 38 / RIFF…WEBP</text>
  <text x="480" y="118" font-size="10" fill="#047857">Content-Disposition: inline → &lt;img&gt;로 표시</text>

  <rect x="464" y="190" width="332" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="480" y="212" font-size="11" fill="#b45309" font-weight="600">그 밖의 파일 (SVG · HTML · PDF …)</text>
  <text x="480" y="230" font-size="10" fill="#4b5563">SVG는 스크립트를 포함할 수 있어 이미지로 보지 않음</text>
  <text x="480" y="248" font-size="10" fill="#b45309">Content-Disposition: attachment → 내려받기만</text>

  <rect x="24" y="300" width="772" height="74" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="322" font-size="11" fill="#374151" font-weight="600">모든 파일 응답에 공통으로 붙는 헤더</text>
  <text x="40" y="342" font-size="10" fill="#4b5563">X-Content-Type-Options: nosniff — 브라우저가 내용을 보고 형식을 바꿔 해석하지 않게</text>
  <text x="40" y="360" font-size="10" fill="#4b5563">Content-Security-Policy: sandbox — 직접 열어도 스크립트 실행 차단 · Cross-Origin-Resource-Policy: cross-origin — 사이트 &lt;img&gt;에서 로드 허용</text>
</svg>
