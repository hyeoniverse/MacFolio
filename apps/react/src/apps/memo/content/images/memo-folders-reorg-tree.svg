<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>폴더 구조: 전과 후</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker></defs>
  <rect width="820" height="380" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">폴더 구조: 전과 후</text>
  <text x="32" y="68" font-size="12" fill="#6b7280">전: 두 단이 늘 같은 개발기/MacFolio, 기준이 섞인 10개. 후: 일하는 영역 → 일의 종류</text>
  <text x="32" y="100" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="600">전</text>
  <rect x="32" y="110" width="170" height="32" rx="8" fill="#f3f4f6"/>
  <text x="117.0" y="130.2" font-size="12" text-anchor="middle" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">개발기/</text>
  <rect x="52" y="150" width="170" height="32" rx="8" fill="#f3f4f6"/>
  <text x="137.0" y="170.2" font-size="12" text-anchor="middle" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MacFolio/</text>
  <text x="80" y="206" font-size="12" fill="#374151" text-anchor="start">데스크톱 15</text>
  <text x="200" y="206" font-size="12" fill="#374151" text-anchor="start">메모 13</text>
  <text x="80" y="230" font-size="12" fill="#374151" text-anchor="start">회고 10</text>
  <text x="200" y="230" font-size="12" fill="#374151" text-anchor="start">백엔드 10</text>
  <text x="80" y="254" font-size="12" fill="#374151" text-anchor="start">배포·운영 10</text>
  <text x="200" y="254" font-size="12" fill="#374151" text-anchor="start">프로젝트·GitHub 8</text>
  <text x="80" y="278" font-size="12" fill="#374151" text-anchor="start">빌드·테스트 6</text>
  <text x="200" y="278" font-size="12" fill="#374151" text-anchor="start">공통 UI 6</text>
  <text x="80" y="302" font-size="12" fill="#374151" text-anchor="start">트래픽 분석 4</text>
  <text x="200" y="302" font-size="12" fill="#374151" text-anchor="start">휴대폰 2</text>
  <text x="32" y="346" font-size="12" fill="#b91c1c" text-anchor="start">앱 · 화면 크기 · 계층 · 글 종류가 한 단에 섞였다</text>
  <line x1="330" y1="220" x2="380" y2="220" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="410" y="100" font-size="13" fill="#15803d" text-anchor="start" font-weight="600">후</text>
  <rect x="410" y="110" width="170" height="30" rx="8" fill="#eef0ff"/>
  <text x="495.0" y="129.2" font-size="12" text-anchor="middle" fill="#3f46c7">프론트엔드/</text>
  <rect x="440" y="148" width="350" height="30" rx="8" fill="#eef0ff"/>
  <text x="615.0" y="167.2" font-size="12" text-anchor="middle" fill="#3f46c7">기능 24 · 트러블슈팅 8 · 구조·리팩터링 9 · 모바일 3</text>
  <rect x="410" y="186" width="170" height="30" rx="8" fill="#dcfce7"/>
  <text x="495.0" y="205.2" font-size="12" text-anchor="middle" fill="#15803d">백엔드 15</text>
  <rect x="410" y="224" width="170" height="30" rx="8" fill="#fef3c7"/>
  <text x="495.0" y="243.2" font-size="12" text-anchor="middle" fill="#b45309">인프라/</text>
  <rect x="440" y="262" width="350" height="30" rx="8" fill="#fef3c7"/>
  <text x="615.0" y="281.2" font-size="12" text-anchor="middle" fill="#b45309">배포·운영 10 · 빌드·테스트 6</text>
  <rect x="410" y="300" width="170" height="30" rx="8" fill="#f3f4f6"/>
  <text x="495.0" y="319.2" font-size="12" text-anchor="middle" fill="#374151">회고 10</text>
  <text x="410" y="346" font-size="12" fill="#15803d" text-anchor="start">맨 위는 일하는 영역, 프론트엔드 안은 일의 종류로</text>
</svg>
