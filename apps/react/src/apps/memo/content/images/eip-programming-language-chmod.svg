<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>chmod 754의 권한 비트</title><rect width="640" height="250" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="14" fill="#1d1d1f" font-weight="600">chmod 754 batch.sh → -rwxr-xr--</text>
<text x="155" y="62" text-anchor="middle" font-size="13" fill="#0a84ff" font-weight="600">소유자 (u)</text>
<rect x="80" y="74" width="50" height="36" fill="#0a84ff" stroke="#0a84ff" stroke-width="1"/>
<text x="105.0" y="97.4" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">r</text>
<text x="105" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">1</text>
<text x="105" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">4</text>
<rect x="130" y="74" width="50" height="36" fill="#0a84ff" stroke="#0a84ff" stroke-width="1"/>
<text x="155.0" y="97.4" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">w</text>
<text x="155" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">1</text>
<text x="155" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">2</text>
<rect x="180" y="74" width="50" height="36" fill="#0a84ff" stroke="#0a84ff" stroke-width="1"/>
<text x="205.0" y="97.4" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">x</text>
<text x="205" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">1</text>
<text x="205" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">1</text>
<text x="155" y="184" text-anchor="middle" font-size="13" fill="#0a84ff" font-weight="600">4+2+1 = 7</text>
<text x="325" y="62" text-anchor="middle" font-size="13" fill="#ff9f0a" font-weight="600">그룹 (g)</text>
<rect x="250" y="74" width="50" height="36" fill="#ff9f0a" stroke="#ff9f0a" stroke-width="1"/>
<text x="275.0" y="97.4" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">r</text>
<text x="275" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">1</text>
<text x="275" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">4</text>
<rect x="300" y="74" width="50" height="36" fill="#fff" stroke="#ff9f0a" stroke-width="1"/>
<text x="325.0" y="97.4" text-anchor="middle" font-size="15" fill="#6e6e73" font-weight="600">-</text>
<text x="325" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">0</text>
<text x="325" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">2</text>
<rect x="350" y="74" width="50" height="36" fill="#ff9f0a" stroke="#ff9f0a" stroke-width="1"/>
<text x="375.0" y="97.4" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">x</text>
<text x="375" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">1</text>
<text x="375" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">1</text>
<text x="325" y="184" text-anchor="middle" font-size="13" fill="#ff9f0a" font-weight="600">4+0+1 = 5</text>
<text x="495" y="62" text-anchor="middle" font-size="13" fill="#30d158" font-weight="600">기타 (o)</text>
<rect x="420" y="74" width="50" height="36" fill="#30d158" stroke="#30d158" stroke-width="1"/>
<text x="445.0" y="97.4" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">r</text>
<text x="445" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">1</text>
<text x="445" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">4</text>
<rect x="470" y="74" width="50" height="36" fill="#fff" stroke="#30d158" stroke-width="1"/>
<text x="495.0" y="97.4" text-anchor="middle" font-size="15" fill="#6e6e73" font-weight="600">-</text>
<text x="495" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">0</text>
<text x="495" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">2</text>
<rect x="520" y="74" width="50" height="36" fill="#fff" stroke="#30d158" stroke-width="1"/>
<text x="545.0" y="97.4" text-anchor="middle" font-size="15" fill="#6e6e73" font-weight="600">-</text>
<text x="545" y="130" text-anchor="middle" font-size="14" fill="#1d1d1f">0</text>
<text x="545" y="150" text-anchor="middle" font-size="11" fill="#6e6e73">1</text>
<text x="495" y="184" text-anchor="middle" font-size="13" fill="#30d158" font-weight="600">4+0+0 = 4</text>
<text x="40" y="130" text-anchor="start" font-size="12" fill="#6e6e73">비트</text>
<text x="40" y="150" text-anchor="start" font-size="11" fill="#6e6e73">가중치</text>
<text x="320" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">r(읽기)=4, w(쓰기)=2, x(실행)=1을 더한 값을 소유자·그룹·기타 순서로 쓴다</text></svg>
