<text x="493.1" y="272" font-size="10.5" fill="#be185d" text-anchor="middle">var(--radius-4)</text>
<text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#6b7280">한쪽이 규칙과 이름을 바꾸는 동안 다른 쪽이 그 이름을 새로 썼다. 린트가 잡은 것은 첫 번째뿐이다</text>
