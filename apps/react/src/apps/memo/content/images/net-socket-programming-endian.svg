<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="330" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">32비트 정수 0x0A0B0C0D의 두 가지 바이트 순서</text>
  <!-- 빅 엔디언 -->
  <text x="160" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">빅 엔디언</text>
  <text x="160" y="76" text-anchor="middle" font-size="11.5" fill="#6e6e73">네트워크 바이트 순서</text>
  <!-- 리틀 엔디언 -->
  <text x="480" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">리틀 엔디언</text>
  <text x="480" y="76" text-anchor="middle" font-size="11.5" fill="#6e6e73">x86, 대부분의 ARM</text>
  <!-- 값 상자 -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="middle" fill="#1d1d1f">
    <rect x="240" y="92" width="160" height="38" rx="6" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="280" y="117" fill="#0a84ff" font-weight="700">0A</text><text x="306" y="117">0B</text><text x="332" y="117">0C</text><text x="360" y="117" fill="#ff9f0a" font-weight="700">0D</text>
  </g>
  <text x="320" y="152" text-anchor="middle" font-size="11.5" fill="#6e6e73"><tspan fill="#0a84ff">0A</tspan>가 최상위 바이트, <tspan fill="#c46f00">0D</tspan>가 최하위 바이트</text>
  <!-- 메모리 열 -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="middle">
    <g fill="#fff" stroke="#1d1d1f">
      <rect x="130" y="170" width="60" height="34"/><rect x="130" y="204" width="60" height="34"/><rect x="130" y="238" width="60" height="34"/><rect x="130" y="272" width="60" height="34"/>
      <rect x="450" y="170" width="60" height="34"/><rect x="450" y="204" width="60" height="34"/><rect x="450" y="238" width="60" height="34"/><rect x="450" y="272" width="60" height="34"/>
    </g>
    <text x="160" y="193" fill="#0a84ff" font-weight="700">0A</text><text x="160" y="227">0B</text><text x="160" y="261">0C</text><text x="160" y="295" fill="#ff9f0a" font-weight="700">0D</text>
    <text x="480" y="193" fill="#ff9f0a" font-weight="700">0D</text><text x="480" y="227">0C</text><text x="480" y="261">0B</text><text x="480" y="295" fill="#0a84ff" font-weight="700">0A</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#1d1d1f" text-anchor="end">
    <text x="122" y="192">a</text><text x="122" y="226">a+1</text><text x="122" y="260">a+2</text><text x="122" y="294">a+3</text>
    <text x="442" y="192">a</text><text x="442" y="226">a+1</text><text x="442" y="260">a+2</text><text x="442" y="294">a+3</text>
  </g>
  <text x="320" y="192" text-anchor="middle" font-size="11.5" fill="#6e6e73">↑ 낮은 주소</text>
  <text x="320" y="294" text-anchor="middle" font-size="11.5" fill="#6e6e73">↓ 높은 주소</text>
</svg>
