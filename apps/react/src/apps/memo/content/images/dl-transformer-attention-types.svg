<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">트랜스포머의 세 MHA 층과 Q·K·V의 출처</text>

  <!-- 인코더 MHA -->
  <g>
    <rect x="20" y="52" width="190" height="200" rx="10" fill="#fff" stroke="#6e6e73"/>
    <text x="115" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">인코더 MHA</text>
    <text x="115" y="94" text-anchor="middle" font-size="11" fill="#6e6e73">셀프 어텐션</text>
    <rect x="45" y="112" width="140" height="34" rx="6" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff"/>
    <text x="115" y="134" text-anchor="middle" font-size="13" fill="#1d1d1f">Q = K = V</text>
    <path d="M115 186 L115 152" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <path d="M110 158 L115 150 L120 158" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <rect x="65" y="188" width="100" height="28" rx="6" fill="#f5f5f7" stroke="#6e6e73"/>
    <text x="115" y="207" text-anchor="middle" font-size="12" fill="#1d1d1f">X (인코더 입력)</text>
    <text x="115" y="238" text-anchor="middle" font-size="11" fill="#6e6e73">입력 문장 단어끼리 주목</text>
  </g>

  <!-- 디코더 Masked MHA -->
  <g>
    <rect x="225" y="52" width="190" height="200" rx="10" fill="#fff" stroke="#6e6e73"/>
    <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">디코더 Masked MHA</text>
    <text x="320" y="94" text-anchor="middle" font-size="11" fill="#6e6e73">셀프 어텐션 + 마스크</text>
    <rect x="250" y="112" width="140" height="34" rx="6" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff"/>
    <text x="320" y="134" text-anchor="middle" font-size="13" fill="#1d1d1f">Q = K = V</text>
    <path d="M320 186 L320 152" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <path d="M315 158 L320 150 L325 158" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <rect x="262" y="188" width="116" height="28" rx="6" fill="#f5f5f7" stroke="#6e6e73"/>
    <text x="320" y="207" text-anchor="middle" font-size="12" fill="#1d1d1f">X_dec (디코더 입력)</text>
    <text x="320" y="238" text-anchor="middle" font-size="11" fill="#6e6e73">i번째 단어는 1~i번째만 주목</text>
  </g>

  <!-- 디코더 MHA (인코더-디코더) -->
  <g>
    <rect x="430" y="52" width="190" height="200" rx="10" fill="#fff" stroke="#6e6e73"/>
    <text x="525" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">디코더 MHA</text>
    <text x="525" y="94" text-anchor="middle" font-size="11" fill="#6e6e73">인코더-디코더 어텐션</text>
    <rect x="445" y="112" width="70" height="34" rx="6" fill="#0a84ff" fill-opacity="0.12" stroke="#0a84ff"/>
    <text x="480" y="134" text-anchor="middle" font-size="13" fill="#1d1d1f">Q</text>
    <rect x="535" y="112" width="70" height="34" rx="6" fill="#f5f5f7" stroke="#1d1d1f"/>
    <text x="570" y="134" text-anchor="middle" font-size="13" fill="#1d1d1f">K = V</text>
    <path d="M480 186 L480 152" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <path d="M475 158 L480 150 L485 158" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <path d="M570 186 L570 152" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <path d="M565 158 L570 150 L575 158" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
    <rect x="442" y="188" width="76" height="28" rx="6" fill="#f5f5f7" stroke="#6e6e73"/>
    <text x="480" y="207" text-anchor="middle" font-size="12" fill="#1d1d1f">X_dec</text>
    <rect x="532" y="188" width="76" height="28" rx="6" fill="#f5f5f7" stroke="#6e6e73"/>
    <text x="570" y="207" text-anchor="middle" font-size="12" fill="#1d1d1f">X_enc</text>
    <text x="525" y="238" text-anchor="middle" font-size="11" fill="#6e6e73">출력 단어가 입력 단어에 주목</text>
  </g>

  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#6e6e73">세 층 모두 C = softmax(QKᵀ/√d_key)V를 계산하고, Q·K·V를 만드는 행렬만 다르다</text>
</svg>
