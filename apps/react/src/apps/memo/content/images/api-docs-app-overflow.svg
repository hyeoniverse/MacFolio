<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>overflow: hidden과 clip의 차이</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">overflow: hidden과 clip의 차이</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">hidden은 사용자만 못 굴린다. 브라우저가 포커스를 보이려고 밀면 scrollTop이 바뀐다</text>
<text x="32" y="76" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="start">overflow: hidden (전)</text>
<rect x="32" y="100" width="180" height="170" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
<rect x="32" y="90" width="180" height="26" rx="6" fill="#e5e7eb" stroke="#9ca3af" clip-path="inset(0)"/>
<rect x="30" y="86" width="184" height="14" fill="#ffffff"/>
<text x="232" y="104" font-size="11" fill="#b91c1c" text-anchor="start">↑ 제목 막대 10px이 잘림</text>
<text x="122" y="108" font-size="11" fill="#374151" text-anchor="middle">● ● ●  API 문서</text>
<rect x="44" y="130" width="156" height="110" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="122" y="190" font-size="11" fill="#6b7280" text-anchor="middle">iframe (Scalar)</text>
<text x="232" y="130" font-size="12" fill="#374151" text-anchor="start">iframe 안 포커스 이동</text>
<text x="232" y="152" font-size="12" fill="#374151" text-anchor="start">→ 브라우저가 바깥 틀까지 스크롤</text>
<text x="232" y="174" font-size="12" fill="#374151" text-anchor="start">→ .container scrollTop = 10</text>
<text x="232" y="196" font-size="12" fill="#374151" text-anchor="start">→ 제목 막대가 위로 잘림</text>
<text x="448" y="76" font-size="14" fill="#15803d" font-weight="700" text-anchor="start">overflow: clip (후)</text>
<rect x="448" y="100" width="180" height="170" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
<rect x="448" y="100" width="180" height="26" rx="6" fill="#e5e7eb" stroke="#9ca3af" clip-path="inset(0)"/>
<text x="538" y="118" font-size="11" fill="#374151" text-anchor="middle">● ● ●  API 문서</text>
<rect x="460" y="140" width="156" height="110" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="538" y="200" font-size="11" fill="#6b7280" text-anchor="middle">iframe (Scalar)</text>
<text x="648" y="130" font-size="12" fill="#374151" text-anchor="start">스크롤 영역이 없다</text>
<text x="648" y="152" font-size="12" fill="#374151" text-anchor="start">scrollTop은 늘 0</text>
<text x="648" y="174" font-size="12" fill="#374151" text-anchor="start">→ 포커스가 옮겨도 틀은 그대로</text>
<text x="648" y="196" font-size="12" fill="#374151" text-anchor="start">모든 창이 같은 틀이라 함께 고쳐짐</text>
<text x="32" y="310" font-size="11" fill="#6b7280" text-anchor="start">창 틀: apps/react/src/desktop/window/Window.css</text>
</svg>
