<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 222" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>postsInView, filterFor, listPosts, selectPost 순서로 목록과 고른 글이 정해진다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="860" height="222" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">목록에 보일 글이 정해지는 순서</text>
<text x="32" y="56" font-size="11" fill="#6b7280">packages/desktop-core/src/memo/noteView.ts</text>
<rect x="32.0" y="80" width="178.0" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="121.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">postsInView</text><text x="121.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">폴더면 그 폴더의 글</text><text x="121.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">태그로 보기면</text><text x="121.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">고른 태그에 맞는 글</text><line x1="212.0" y1="126.0" x2="236.0" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="238.0" y="80" width="178.0" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="327.0" y="102" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">filterFor</text><text x="327.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">임시 저장·예약 조건은</text><text x="327.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">관리자에게만</text><text x="327.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">(방문자는 null)</text><line x1="418.0" y1="126.0" x2="442.0" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="444.0" y="80" width="178.0" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="533.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">listPosts</text><text x="533.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">최근 삭제된 항목은</text><text x="533.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">검색어로만</text><text x="533.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">나머지는 거르고 정렬</text><line x1="624.0" y1="126.0" x2="648.0" y2="126.0" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="650.0" y="80" width="178.0" height="92" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="739.0" y="102" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">selectPost</text><text x="739.0" y="122" font-size="10.5" fill="#374151" text-anchor="middle">고른 글이 없으면</text><text x="739.0" y="138" font-size="10.5" fill="#374151" text-anchor="middle">맨 위의 글</text><text x="739.0" y="154" font-size="10.5" fill="#374151" text-anchor="middle">(고정된 글 먼저)</text><text x="32" y="202" font-size="11" fill="#6b7280">useNoteView(React)에는 상태·useMemo·주소 막대 effect만 남았다. folderPaths는 폴더 트리의 모든 경로</text>
</svg>
