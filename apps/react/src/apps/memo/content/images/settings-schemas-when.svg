<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>입력 { likes: true }의 검사 흐름. strictObject 단계에서 unrecognized_keys 오류가 나온다. when이 없으면 refine 검사도 실행되어 이유가 두 개가 되고, when을 붙이면 앞 단계에 오류가 있으므로 refine을 건너뛰어 이유가 하나만 남는다</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
</defs>
<rect width="800" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">SecurityUpdate 검사 순서와 when</text>
<rect x="32" y="62" width="170" height="64" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="117" y="88" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">입력</text>
<text x="117" y="108" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2937" text-anchor="middle">{ likes: true }</text>
<line x1="202" y1="94" x2="246" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="250" y="62" width="230" height="64" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="365" y="86" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">1단계 strictObject</text>
<text x="365" y="106" font-size="11.5" fill="#3730a3" text-anchor="middle">정의되지 않은 키 likes 발견</text>
<line x1="480" y1="94" x2="524" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="528" y="62" width="240" height="64" rx="10" fill="#ffe4e6" stroke="#fda4af"/>
<text x="648" y="86" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">오류 1: unrecognized_keys</text>
<text x="648" y="106" font-size="11.5" fill="#9f1239" text-anchor="middle">알 수 없는 설정입니다: likes</text>
<text x="32" y="162" font-size="13" font-weight="700" fill="#1f2937">2단계 refine("바꿀 설정이 없습니다.")</text>
<rect x="32" y="176" width="355" height="120" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="50" y="200" font-size="12.5" font-weight="700" fill="#9a3412">when 없음</text>
<text x="50" y="222" font-size="11.5" fill="#7c2d12">likes를 제외한 값에는 변경할 설정이 없다</text>
<text x="50" y="240" font-size="11.5" fill="#7c2d12">→ refine 실행, 오류 2 추가</text>
<text x="50" y="266" font-size="11.5" font-weight="600" fill="#7c2d12">이유 2개: 알 수 없는 설정입니다: likes,</text>
<text x="50" y="284" font-size="11.5" font-weight="600" fill="#7c2d12">바꿀 설정이 없습니다.</text>
<rect x="413" y="176" width="355" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="431" y="200" font-size="12.5" font-weight="700" fill="#065f46">when 추가 (채택)</text>
<text x="431" y="222" font-size="11.5" fill="#064e3b">조건: payload.issues.length === 0</text>
<text x="431" y="240" font-size="11.5" fill="#064e3b">오류 1이 있으므로 거짓 → refine 건너뜀</text>
<text x="431" y="266" font-size="11.5" font-weight="600" fill="#064e3b">이유 1개: 알 수 없는 설정입니다: likes</text>
<text x="431" y="284" font-size="11.5" font-weight="600" fill="#064e3b">(옛 if 문과 같은 결과)</text>
</svg>
