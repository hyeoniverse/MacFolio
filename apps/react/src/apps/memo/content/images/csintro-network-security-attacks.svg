<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>스니핑, 스푸핑, 서비스 거부 공격이 노리는 보안 속성</title>
<rect width="640" height="360" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">세 가지 공격과 깨지는 보안 속성</text>
<g font-size="13">
<rect x="20" y="55" width="190" height="200" rx="12" fill="#f2f2f7" stroke="#0a84ff" stroke-width="2"/>
<text x="115" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#0a84ff">스니핑</text>
<text x="115" y="108" text-anchor="middle" fill="#6e6e73">수동적 공격</text>
<text x="35" y="140" fill="#1d1d1f">· 남의 패킷을 엿듣는다</text>
<text x="35" y="162" fill="#1d1d1f">· 무차별 모드 NIC</text>
<text x="35" y="184" fill="#1d1d1f">· 평문 비밀번호 탈취</text>
<text x="115" y="235" text-anchor="middle" font-weight="600" fill="#1d1d1f">기밀성 침해</text>
<rect x="225" y="55" width="190" height="200" rx="12" fill="#f2f2f7" stroke="#ff9f0a" stroke-width="2"/>
<text x="320" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#ff9f0a">스푸핑</text>
<text x="320" y="108" text-anchor="middle" fill="#6e6e73">능동적 공격</text>
<text x="240" y="140" fill="#1d1d1f">· 주소·신원을 위조한다</text>
<text x="240" y="162" fill="#1d1d1f">· ARP·IP·DNS 스푸핑</text>
<text x="240" y="184" fill="#1d1d1f">· 중간자 공격의 발판</text>
<text x="320" y="235" text-anchor="middle" font-weight="600" fill="#1d1d1f">무결성·인증 침해</text>
<rect x="430" y="55" width="190" height="200" rx="12" fill="#f2f2f7" stroke="#ff3b30" stroke-width="2"/>
<text x="525" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#ff3b30">DoS·DDoS</text>
<text x="525" y="108" text-anchor="middle" fill="#6e6e73">능동적 공격</text>
<text x="445" y="140" fill="#1d1d1f">· 자원을 고갈시킨다</text>
<text x="445" y="162" fill="#1d1d1f">· SYN 플러딩, ICMP 플러딩</text>
<text x="445" y="184" fill="#1d1d1f">· 봇넷으로 분산 공격</text>
<text x="525" y="235" text-anchor="middle" font-weight="600" fill="#1d1d1f">가용성 침해</text>
<text x="320" y="295" text-anchor="middle" fill="#6e6e73">스니핑으로 얻은 정보와 스푸핑으로 가로챈 트래픽이 다음 공격의 준비 단계가 된다</text>
<path d="M210 155 H225 M415 155 H430" stroke="#6e6e73" stroke-width="2"/>
<text x="320" y="330" text-anchor="middle" fill="#6e6e73">기밀성(Confidentiality) · 무결성(Integrity) · 가용성(Availability)</text>
</g></svg>
