<text x="415" y="110" text-anchor="middle" font-size="12" fill="#0a84ff">서브넷 2²=4개</text><text x="520" y="110" text-anchor="middle" font-size="12" fill="#ff9f0a">주소 2⁶=64개</text>
<rect x="44" y="134" width="132" height="190" rx="6" fill="#f2f2f7"/>
<text x="110" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">서브넷 0 (00)</text>
<text x="110" y="182" text-anchor="middle" font-size="12" fill="#6e6e73">네트워크 주소</text><text x="110" y="200" text-anchor="middle" font-size="13" fill="#1d1d1f">.0</text>
<text x="110" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">호스트 범위</text><text x="110" y="244" text-anchor="middle" font-size="13" fill="#1d1d1f">.1 ~ .62</text>
<rect x="54" y="258" width="112" height="50" rx="4" fill="#fff4e5" stroke="#ff9f0a"/><text x="110" y="278" text-anchor="middle" font-size="12" fill="#6e6e73">브로드캐스트</text><text x="110" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">.63</text>
<rect x="184" y="134" width="132" height="190" rx="6" fill="#f2f2f7"/>
