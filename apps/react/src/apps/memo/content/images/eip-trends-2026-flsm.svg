<text x="250" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">호스트 범위</text><text x="250" y="244" text-anchor="middle" font-size="13" fill="#1d1d1f">.65 ~ .126</text>
<rect x="194" y="258" width="112" height="50" rx="4" fill="#fff4e5" stroke="#ff9f0a"/><text x="250" y="278" text-anchor="middle" font-size="12" fill="#6e6e73">브로드캐스트</text><text x="250" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">.127</text>
<rect x="324" y="134" width="132" height="190" rx="6" fill="#f2f2f7"/>
<text x="390" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">서브넷 2 (10)</text>
<text x="390" y="182" text-anchor="middle" font-size="12" fill="#6e6e73">네트워크 주소</text><text x="390" y="200" text-anchor="middle" font-size="13" fill="#1d1d1f">.128</text>
<text x="390" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">호스트 범위</text><text x="390" y="244" text-anchor="middle" font-size="13" fill="#1d1d1f">.129 ~ .190</text>
<rect x="334" y="258" width="112" height="50" rx="4" fill="#fff4e5" stroke="#ff9f0a"/><text x="390" y="278" text-anchor="middle" font-size="12" fill="#6e6e73">브로드캐스트</text><text x="390" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">.191</text>
<rect x="464" y="134" width="132" height="190" rx="6" fill="#f2f2f7"/>
