<text x="530" y="182" text-anchor="middle" font-size="12" fill="#6e6e73">네트워크 주소</text><text x="530" y="200" text-anchor="middle" font-size="13" fill="#1d1d1f">.192</text>
<text x="530" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">호스트 범위</text><text x="530" y="244" text-anchor="middle" font-size="13" fill="#1d1d1f">.193 ~ .254</text>
<rect x="474" y="258" width="112" height="50" rx="4" fill="#fff4e5" stroke="#ff9f0a"/><text x="530" y="278" text-anchor="middle" font-size="12" fill="#6e6e73">브로드캐스트</text><text x="530" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">.255</text>
<text x="320" y="346" text-anchor="middle" font-size="12" fill="#6e6e73">서브넷마다 사용 가능한 호스트 64 − 2 = 62개, 서브넷 마스크 255.255.255.192</text>
