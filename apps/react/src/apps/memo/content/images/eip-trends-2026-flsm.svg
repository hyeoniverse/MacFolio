<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>192.168.10.0/24를 /26 네 개로 나누는 FLSM 서브네팅</title><rect width="640" height="360" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">192.168.10.0/24를 같은 크기 /26 네 개로 나누기</text>
<rect x="40" y="56" width="350" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="215" y="78" text-anchor="middle" font-size="13" fill="#1d1d1f">네트워크 24비트 (192.168.10)</text>
<rect x="390" y="56" width="50" height="34" fill="#0a84ff"/><text x="415" y="78" text-anchor="middle" font-size="13" fill="#fff">2비트</text>
