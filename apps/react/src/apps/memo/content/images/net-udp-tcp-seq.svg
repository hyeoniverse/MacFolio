<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="380" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">ISN 100과 2000으로 시작하는 연결의 순서 번호</text>
  <text x="150" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">클라이언트</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">서버 (포트 80)</text>
  <line x1="150" y1="64" x2="150" y2="360" stroke="#6e6e73" stroke-width="2"/>
  <line x1="490" y1="64" x2="490" y2="360" stroke="#6e6e73" stroke-width="2"/>
  <g font-size="12">
    <line x1="150" y1="84" x2="490" y2="114" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="90" text-anchor="middle" fill="#1d1d1f">① SYN  Seq=100</text>
    <line x1="490" y1="136" x2="150" y2="166" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="142" text-anchor="middle" fill="#1d1d1f">② SYN+ACK  Seq=2000  Ack=101</text>
    <line x1="150" y1="188" x2="490" y2="218" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="194" text-anchor="middle" fill="#1d1d1f">③ ACK  Seq=101  Ack=2001</text>
    <line x1="150" y1="258" x2="490" y2="288" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="320" y="246" text-anchor="middle" fill="#0a84ff">④ PSH+ACK  Seq=101  Ack=2001  데이터 100바이트</text>
    <line x1="490" y1="302" x2="150" y2="332" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="320" y="308" text-anchor="middle" fill="#1d1d1f">⑤ ACK  Seq=2001  Ack=201</text>
  </g>
  <g font-size="11" fill="#6e6e73">
    <text x="20" y="100">SYN-SENT</text>
    <text x="20" y="190">ESTABLISHED</text>
    <text x="500" y="100">LISTEN</text>
    <text x="500" y="150">SYN-RCVD</text>
    <text x="500" y="232">ESTABLISHED</text>
  </g>
  <g font-size="11" fill="#ff9f0a">
    <text x="500" y="118">100 + 1(SYN)</text>
    <text x="20" y="170">2000 + 1(SYN)</text>
    <text x="500" y="296">101 + 100(데이터)</text>
  </g>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#6e6e73">확인 응답 번호(Ack)는 다음에 받기를 기대하는 바이트 번호다. 데이터 없는 ACK는 순서 번호를 소비하지 않는다.</text>
</svg>
