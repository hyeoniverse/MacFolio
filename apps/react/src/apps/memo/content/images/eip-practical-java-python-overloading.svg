<text x="580" y="271" font-size="14" fill="#30d158" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">6</text>
<text x="264" y="112" font-size="11" fill="#ff9f0a" text-anchor="middle">2 → 2.0 자동 변환</text>
<text x="320" y="320" font-size="12" fill="#6e6e73" text-anchor="middle">컴파일러가 인자의 개수와 타입으로 호출할 메서드를 고른다. 반환 타입만 다른 오버로딩은 허용되지 않는다</text>
