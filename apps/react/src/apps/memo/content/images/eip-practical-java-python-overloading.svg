<text x="115.0" y="146.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">c.add(1.0, 2)</text>
<rect x="330" y="122" width="230" height="40" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="445.0" y="146.7" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">double add(double, double)</text>
<path d="M202 142 H326" fill="none" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#m6e6e73)"/>
<text x="580" y="147" font-size="14" fill="#30d158" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">3.5</text>
