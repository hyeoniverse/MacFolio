<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">토큰 참조 방향: 컴포넌트 → 의미 → 원시값</text>

  <!-- layer 3 -->
  <rect x="20" y="50" width="340" height="70" rx="10" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="34" y="74" font-size="13" font-weight="700" fill="#1d1d1f">3층 컴포넌트 · components.css</text>
  <text x="34" y="100" font-size="13" fill="#1d1d1f" font-family="Menlo, monospace">--ui-danger: var(--color-system-red)</text>
  <!-- layer 2 -->
  <rect x="20" y="160" width="340" height="70" rx="10" fill="#f2f2f7" stroke="#0a84ff" stroke-width="2"/>
  <text x="34" y="184" font-size="13" font-weight="700" fill="#1d1d1f">2층 의미 · semantic.css</text>
  <text x="34" y="210" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">--color-system-red: var(--palette-red-light)</text>
  <!-- layer 1 -->
  <rect x="20" y="270" width="340" height="90" rx="10" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="34" y="294" font-size="13" font-weight="700" fill="#1d1d1f">1층 원시값 · primitives.css</text>
  <rect x="34" y="306" width="14" height="14" rx="3" fill="#ff3b30"/>
  <text x="56" y="318" font-size="13" fill="#1d1d1f" font-family="Menlo, monospace">--palette-red-light: #ff3b30</text>
  <rect x="34" y="330" width="14" height="14" rx="3" fill="#ff453a"/>
  <text x="56" y="342" font-size="13" fill="#1d1d1f" font-family="Menlo, monospace">--palette-red-dark: #ff453a</text>

  <line x1="185" y1="120" x2="185" y2="156" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="185" y1="230" x2="185" y2="300" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="194" y="142" font-size="12" fill="#6e6e73">var()로 참조</text>
  <text x="194" y="256" font-size="12" fill="#6e6e73">라이트 모드 값</text>

  <!-- app css -->
  <rect x="410" y="50" width="210" height="70" rx="10" fill="#ffffff" stroke="#1d1d1f"/>
  <text x="424" y="74" font-size="13" font-weight="700" fill="#1d1d1f">앱·공통 컴포넌트 CSS</text>
  <text x="424" y="100" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">color: var(--ui-danger)</text>
  <line x1="410" y1="85" x2="364" y2="85" stroke="#34c759" stroke-width="2" marker-end="url(#a)"/>
  <text x="372" y="78" font-size="12" fill="#34c759">허용</text>
  <path d="M410 112 L380 112 L380 320 L364 320" fill="none" stroke="#ff3b30" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="390" y="296" font-size="12" fill="#ff3b30">--palette-* 직접 사용</text>
  <text x="390" y="312" font-size="12" fill="#ff3b30">Stylelint가 차단</text>

  <!-- dark -->
  <rect x="410" y="150" width="210" height="96" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
  <text x="424" y="172" font-size="13" font-weight="700" fill="#0a84ff">다크 모드</text>
  <text x="424" y="192" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">:root[data-theme='dark']</text>
  <text x="424" y="210" font-size="12" fill="#1d1d1f">에서 2층 이름만 재정의</text>
  <text x="424" y="230" font-size="12" fill="#6e6e73">→ --palette-red-dark</text>
  <line x1="410" y1="196" x2="364" y2="196" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M600 246 L600 340 L364 340" fill="none" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#ab)"/>
</svg>
