<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fff"/>
  <text x="320" y="28" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">본문 네 줄에서 태그 두 개가 남는 과정</text>

  <!-- 입력 -->
  <text x="16" y="58" font-size="13" font-weight="700" fill="#1d1d1f">입력 본문</text>
  <rect x="16" y="66" width="608" height="94" rx="8" fill="#f2f2f7"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1d1d1f">
    <text x="28" y="88">## 색 바꾸기 #CSS</text>
    <text x="28" y="108">`color: #fff` 로 쓰고 [앞 절](#배경)을 참고한다</text>
    <text x="28" y="128">배경색 #edbb4d 는 노란색이다</text>
    <text x="28" y="148">#115의 API 변경은 #리팩터링 대상이다</text>
  </g>

  <!-- 1단계 -->
  <line x1="320" y1="162" x2="320" y2="180" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/>
  <text x="16" y="200" font-size="13" font-weight="700" fill="#0a84ff">① tagsOf: 코드·링크 주소·HTML 태그를 공백으로</text>
  <rect x="16" y="208" width="608" height="62" rx="8" fill="#fff" stroke="#0a84ff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1d1d1f">
    <text x="28" y="230">`color: #fff` → <tspan fill="#6e6e73">(공백)</tspan></text>
    <text x="28" y="252">](#배경)      → ]<tspan fill="#6e6e73">(공백)</tspan></text>
  </g>
  <text x="380" y="242" font-size="12" fill="#6e6e73">제목 기호 ##는 ②의 패턴이 걸러 낸다</text>

  <!-- 2단계 -->
  <line x1="320" y1="272" x2="320" y2="290" stroke="#0a84ff" stroke-width="2" marker-end="url(#b)"/>
  <text x="16" y="310" font-size="13" font-weight="700" fill="#0a84ff">② TAG_PATTERN 후보 → isTagName 검사</text>
  <rect x="16" y="318" width="146" height="40" rx="20" fill="#0a84ff"/>
  <text x="89" y="343" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">CSS</text>
  <rect x="170" y="318" width="146" height="40" rx="20" fill="#fff" stroke="#ff3b30"/>
  <text x="243" y="337" font-size="13" fill="#ff3b30" text-anchor="middle">edbb4d</text>
  <text x="243" y="352" font-size="11.5" fill="#6e6e73" text-anchor="middle">16진수 6자리 = 색</text>
  <rect x="324" y="318" width="146" height="40" rx="20" fill="#fff" stroke="#ff3b30"/>
  <text x="397" y="337" font-size="13" fill="#ff3b30" text-anchor="middle">115의</text>
  <text x="397" y="352" font-size="11.5" fill="#6e6e73" text-anchor="middle">숫자 + 조사 = 이슈</text>
  <rect x="478" y="318" width="146" height="40" rx="20" fill="#0a84ff"/>
  <text x="551" y="343" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">리팩터링</text>

  <!-- 결과 -->
  <rect x="16" y="374" width="608" height="44" rx="8" fill="#f2f2f7"/>
  <text x="320" y="401" font-size="13" fill="#1d1d1f" text-anchor="middle">결과: <tspan font-weight="700" fill="#0a84ff">#CSS</tspan>, <tspan font-weight="700" fill="#0a84ff">#리팩터링</tspan> (처음 나온 순서, 대소문자가 달라도 하나)</text>
</svg>
