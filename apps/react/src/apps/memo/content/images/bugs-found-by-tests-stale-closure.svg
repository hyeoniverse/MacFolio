<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>드래그한 위치가 되돌아간 까닭: 오래된 클로저</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="320" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">드래그한 위치가 되돌아간 까닭: 오래된 클로저</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">pointerup 핸들러가 드래그를 시작할 때의 rect를 기억했다</text>
<rect x="32" y="90" width="190" height="70" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="127.0" y="112.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">pointerdown</text>
<text x="127.0" y="129.0" font-size="11" fill="#374151" text-anchor="middle">핸들러 등록</text>
<text x="127.0" y="146.0" font-size="11" fill="#374151" text-anchor="middle">그때의 rect = A</text>
<line x1="222" y1="125" x2="262" y2="125" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="266" y="90" width="190" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="361.0" y="112.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">pointermove × N</text>
<text x="361.0" y="129.0" font-size="11" fill="#374151" text-anchor="middle">화면의 rect: A → B</text>
<text x="361.0" y="146.0" font-size="11" fill="#374151" text-anchor="middle">(상태는 바뀐다)</text>
<line x1="456" y1="125" x2="496" y2="125" stroke="#374151" stroke-width="1.8" marker-end="url(#a-gray)"/>
<rect x="500" y="90" width="150" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="575.0" y="120.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">pointerup</text>
<text x="575.0" y="137.5" font-size="11" fill="#374151" text-anchor="middle">save(rect)</text>
<line x1="650" y1="125" x2="690" y2="125" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a-red)"/>
<rect x="694" y="90" width="140" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="764.0" y="120.5" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">저장된 값 A</text>
<text x="764.0" y="137.5" font-size="11" fill="#374151" text-anchor="middle">새로고침 → A로</text>
<rect x="32" y="200" width="802" height="80" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="433.0" y="235.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">고친 뒤: 위치 계산을 순수 함수(moveRect)로 빼고, 끝날 때 시작 rect + 움직인 거리로 최종 위치를 계산해 그 값을 저장한다</text>
<text x="433.0" y="252.5" font-size="11" fill="#374151" text-anchor="middle">moveRect(start, dx, dy, viewport) → clampRect → save</text>
</svg>
