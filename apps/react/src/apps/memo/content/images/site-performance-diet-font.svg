<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="356" rx="16" fill="#f5f5f7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker></defs>
<text x="24" y="36" font-size="17" fill="#1d1d1f" font-weight="700">본문 글꼴을 두 조각으로: 브라우저가 선택하는 순서</text>
<rect x="24" y="56" width="330" height="96" rx="10" fill="#fff" stroke="#d1d1d6" stroke-width="1.5"/>
<text x="38" y="78" font-size="14" fill="#1d1d1f" font-weight="700">예전: AppleSDGothicNeoR.ttf</text>
<text x="38" y="98" font-size="13" fill="#3a3a3c">원본 3.8MB, 압축 전송 1.7MB</text>
<text x="38" y="118" font-size="13" fill="#3a3a3c">완성형 한글 11,172자 전부. 첫 화면 텍스트가</text>
<text x="38" y="138" font-size="13" fill="#3a3a3c">이 파일을 모두 수신할 때까지 기다린다</text>
<rect x="380" y="56" width="356" height="96" rx="10" fill="#fff7e8" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="394" y="78" font-size="14" fill="#1d1d1f" font-weight="700">지금: woff2 두 조각 (subset-font.py)</text>
<text x="394" y="98" font-size="13" fill="#3a3a3c">core 149KB: 라틴·문장 부호·자모·완성형 2,350자</text>
<text x="394" y="118" font-size="13" fill="#3a3a3c">ext 232KB: 나머지 한글 8,822자 (똠, 햏 …)</text>
<text x="394" y="138" font-size="13" fill="#3a3a3c">두 @font-face 모두 같은 이름 MacSystemFont</text>
<rect x="24" y="180" width="190" height="56" rx="10" fill="#fff" stroke="#d1d1d6" stroke-width="1.5"/>
<text x="38" y="202" font-size="13" fill="#1d1d1f" font-weight="700">렌더링할 글자 하나</text>
<text x="38" y="222" font-size="13" fill="#3a3a3c">예: "가" 또는 "똠"</text>
<path d="M214 208 H252" stroke="#8e8e93" stroke-width="2" marker-end="url(#a)"/>
<rect x="256" y="170" width="240" height="76" rx="10" fill="#fff7e8" stroke="#ff9f0a" stroke-width="1.5"/>
<text x="270" y="192" font-size="13" fill="#1d1d1f" font-weight="700">① 나중에 선언한 core부터 확인</text>
<text x="270" y="212" font-size="13" fill="#3a3a3c">unicode-range에 들고</text>
<text x="270" y="232" font-size="13" fill="#3a3a3c">core에 글자가 있나?</text>
<path d="M496 196 H540" stroke="#34c759" stroke-width="2" marker-end="url(#a)"/><text x="503" y="188" font-size="12" fill="#248a3d" font-weight="600">있다</text>
<rect x="544" y="170" width="192" height="40" rx="10" fill="#e9f7ec" stroke="#34c759" stroke-width="1.5"/>
<text x="558" y="192" font-size="13" fill="#1d1d1f" font-weight="700">core로 렌더링 (끝)</text>
<path d="M376 246 V276" stroke="#ff3b30" stroke-width="2" marker-end="url(#a)"/><text x="384" y="266" font-size="12" fill="#d70015" font-weight="600">없다</text>
<rect x="256" y="282" width="480" height="56" rx="10" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
<text x="270" y="304" font-size="13" fill="#1d1d1f" font-weight="700">② 범위가 맞는 다음 글꼴(ext)을 찾는다 → 이때 처음 ext 232KB를 수신</text>
<text x="270" y="324" font-size="13" fill="#3a3a3c">첫 방문 측정(진입 후 3초까지)에서 ext는 한 번도 수신하지 않았다</text>
</svg>
