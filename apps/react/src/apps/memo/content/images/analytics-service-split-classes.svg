<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>AnalyticsService 한 클래스를 저장 AnalyticsRecorder, 집계 AnalyticsRollup, 조회 AnalyticsStats 셋으로 나눴다. 컨트롤러는 Recorder와 Stats를 부르고, Stats는 모으기를 Rollup에 맡긴다</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="760" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">AnalyticsService를 셋으로</text>
<text x="32" y="56" font-size="11" fill="#6b7280">NestJS 서비스는 다른 서비스를 생성자로 받는다</text>
<rect x="32" y="128" width="160" height="52" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="112.0" y="147" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">AnalyticsController</text>
<text x="112.0" y="164" font-size="10.5" fill="#374151" text-anchor="middle">경로는 그대로</text>
<rect x="250" y="76" width="220" height="76" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="262" y="95" font-size="12" fill="#4f46e5" font-weight="600">AnalyticsRecorder · 68줄</text>
<text x="262" y="112" font-size="10.5" fill="#374151">저장: record</text>
<text x="262" y="127.0" font-size="10.5" fill="#374151">묶음 검사 · IP마다 1분 30번</text>
<text x="262" y="142.0" font-size="10.5" fill="#374151">로봇·관리자 빼기</text>
<rect x="250" y="172" width="220" height="76" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
<text x="262" y="191" font-size="12" fill="#4f46e5" font-weight="600">AnalyticsStats · 203줄</text>
<text x="262" y="208" font-size="10.5" fill="#374151">조회: today · summary</text>
<text x="262" y="223.0" font-size="10.5" fill="#374151">views · live</text>
<text x="262" y="238.0" font-size="10.5" fill="#374151">1분 캐시</text>
<rect x="540" y="172" width="188" height="76" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
<text x="552" y="191" font-size="12" fill="#15803d" font-weight="600">AnalyticsRollup · 80줄</text>
<text x="552" y="208" font-size="10.5" fill="#374151">집계: maintain · rowsBetween</text>
<text x="552" y="223.0" font-size="10.5" fill="#374151">한 시간마다 · 90일/7일 정리</text>
<text x="552" y="238.0" font-size="10.5" fill="#374151">마지막으로 모은 시각</text>
<path d="M192 145 C220 145 220 114 246 114" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<path d="M192 162 C220 162 220 210 246 210" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<path d="M470 210 H536" stroke="#15803d" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<text x="503" y="202" font-size="10" fill="#15803d" font-weight="600" text-anchor="middle">맡김</text>
<rect x="540" y="76" width="188" height="76" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="634.0" y="95" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">PostgreSQL</text>
<text x="634.0" y="112" font-size="10.5" fill="#374151" text-anchor="middle">AnalyticsEvent</text>
<text x="634.0" y="127.0" font-size="10.5" fill="#374151" text-anchor="middle">DailyStat</text>
<path d="M470 114 H536" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
<path d="M634 172 V156" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
<text x="380" y="280" font-size="11" fill="#6b7280" text-anchor="middle">경로·요청 제한·응답 모양·캐시 시간은 그대로 → API e2e 124개는 한 줄만 고치고 통과</text>
</svg>
