<rect x="10" y="220" width="140" height="40" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="80" y="245">"빅데이터 클라우드"</text>
<rect x="185" y="35" width="130" height="50" rx="6" fill="#0a84ff"/><text x="250" y="55" fill="#fff">(보안,1)</text><text x="250" y="72" fill="#fff">(클라우드,1)</text>
<rect x="185" y="120" width="130" height="60" rx="6" fill="#0a84ff"/><text x="250" y="139" fill="#fff">(클라우드,1)</text><text x="250" y="155" fill="#fff">(보안,1)</text><text x="250" y="171" fill="#fff">(보안,1)</text>
<rect x="185" y="215" width="130" height="50" rx="6" fill="#0a84ff"/><text x="250" y="235" fill="#fff">(빅데이터,1)</text><text x="250" y="252" fill="#fff">(클라우드,1)</text>
<rect x="350" y="45" width="140" height="40" rx="6" fill="#f2f2f7" stroke="#ff9f0a"/><text x="420" y="70">보안: [1, 1, 1]</text>
