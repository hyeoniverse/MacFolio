<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 300"><title>MapReduce 단어 세기: 문서를 나눠 각 서버가 단어마다 1을 붙이고, 같은 단어끼리 모아 합산</title><rect width="640" height="300" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs>
<g font-size="12" fill="#1d1d1f" text-anchor="middle">
