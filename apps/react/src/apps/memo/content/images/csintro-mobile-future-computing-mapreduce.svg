<rect x="525" y="130" width="110" height="40" rx="6" fill="#34c759"/><text x="580" y="155" fill="#fff">클라우드 3</text>
<rect x="525" y="215" width="110" height="40" rx="6" fill="#34c759"/><text x="580" y="240" fill="#fff">빅데이터 1</text>
<g stroke="#6e6e73" marker-end="url(#a)"><line x1="152" y1="60" x2="182" y2="60"/><line x1="152" y1="150" x2="182" y2="150"/><line x1="152" y1="240" x2="182" y2="240"/><line x1="492" y1="65" x2="522" y2="65"/><line x1="492" y1="150" x2="522" y2="150"/><line x1="492" y1="235" x2="522" y2="235"/>
<line x1="317" y1="55" x2="347" y2="62"/><line x1="317" y1="155" x2="347" y2="72"/><line x1="317" y1="72" x2="347" y2="145"/><line x1="317" y1="140" x2="347" y2="150"/><line x1="317" y1="252" x2="347" y2="158"/><line x1="317" y1="235" x2="347" y2="235"/></g>
<text x="320" y="290" fill="#6e6e73">Map과 Reduce는 각각 여러 서버에서 동시에 실행된다</text>
