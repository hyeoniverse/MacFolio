<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <rect width="820" height="420" rx="16" fill="#fff"/>
  <text x="410" y="30" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">정리 내용 저장 시점: 0.4초 지연 저장 → 즉시 저장 + 순차 전송</text>

  <text x="24" y="66" font-size="12" fill="#b91c1c" font-weight="600">처음 구현: 편집 후 0.4초 뒤 저장</text>
  <rect x="24" y="80" width="150" height="54" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="99" y="103" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">고정 버튼 클릭</text>
  <text x="99" y="119" font-size="10" fill="#4b5563" text-anchor="middle">화면 상태만 변경</text>
  <line x1="176" y1="107" x2="202" y2="107" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="204" y="80" width="150" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="279" y="103" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">0.4초 대기</text>
  <text x="279" y="119" font-size="10" fill="#4b5563" text-anchor="middle">이 사이에 새로고침</text>
  <line x1="356" y1="107" x2="382" y2="107" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="384" y="80" width="190" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="479" y="103" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">pagehide에서 keepalive PUT</text>
  <text x="479" y="119" font-size="10" fill="#4b5563" text-anchor="middle">CORS preflight가 필요해 전송 안 됨</text>
  <line x1="576" y1="107" x2="602" y2="107" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="604" y="80" width="192" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="700" y="103" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">편집 손실</text>
  <text x="700" y="119" font-size="10" fill="#4b5563" text-anchor="middle">서버에는 이전 정리 내용</text>

  <line x1="24" y1="164" x2="796" y2="164" stroke="#e5e7eb"/>

  <text x="24" y="196" font-size="12" fill="#047857" font-weight="600">변경 후: 편집마다 즉시 저장, 앞 요청이 끝난 뒤 다음 요청 전송 (saveQueue)</text>
  <rect x="24" y="210" width="150" height="54" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="99" y="233" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">편집 1 (폴더 생성)</text>
  <text x="99" y="249" font-size="10" fill="#4b5563" text-anchor="middle">스냅숏 1</text>
  <line x1="176" y1="237" x2="202" y2="237" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="204" y="210" width="190" height="54" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="299" y="233" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">PUT /memo/organization</text>
  <text x="299" y="249" font-size="10" fill="#4b5563" text-anchor="middle">스냅숏 1 저장 완료</text>

  <rect x="24" y="290" width="150" height="54" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="99" y="313" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">편집 2 (고정)</text>
  <text x="99" y="329" font-size="10" fill="#4b5563" text-anchor="middle">스냅숏 2, 대기열에 추가</text>
  <line x1="176" y1="317" x2="402" y2="317" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="299" y1="266" x2="410" y2="300" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="404" y="290" width="190" height="54" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="499" y="313" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">PUT /memo/organization</text>
  <text x="499" y="329" font-size="10" fill="#4b5563" text-anchor="middle">스냅숏 2 (1이 끝난 뒤 전송)</text>
  <line x1="596" y1="317" x2="622" y2="317" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="624" y="290" width="172" height="54" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="710" y="313" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="600">실패하면</text>
  <text x="710" y="329" font-size="10" fill="#4b5563" text-anchor="middle">알림 + GET으로 서버 내용 복원</text>

  <text x="410" y="392" font-size="11" fill="#6b7280" text-anchor="middle">요청 순서가 고정되므로 늦게 도착한 이전 스냅숏이 최신 편집을 덮어쓰지 않는다</text>
</svg>
