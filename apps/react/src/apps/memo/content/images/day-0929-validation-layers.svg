<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>글 필수 항목을 세 계층에서 검증</title>
  <rect width="640" height="320" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">제목이 빈 글을 저장하려는 세 가지 경로</text>
  <g font-size="12">
    <rect x="20" y="52" width="140" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/><text x="90" y="73" text-anchor="middle" fill="#1d1d1f">관리자가 편집 화면에서</text><text x="90" y="90" text-anchor="middle" fill="#1d1d1f">저장 버튼</text>
    <rect x="20" y="132" width="140" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/><text x="90" y="153" text-anchor="middle" fill="#1d1d1f">curl 등으로 API에</text><text x="90" y="170" text-anchor="middle" fill="#1d1d1f">직접 POST</text>
    <rect x="20" y="212" width="140" height="50" rx="8" fill="#f2f2f7" stroke="#6e6e73"/><text x="90" y="233" text-anchor="middle" fill="#1d1d1f">SQL 콘솔 등으로</text><text x="90" y="250" text-anchor="middle" fill="#1d1d1f">DB에 직접 INSERT</text>

    <rect x="200" y="44" width="130" height="226" rx="10" fill="#eaf3ff" stroke="#0a84ff"/><text x="265" y="66" text-anchor="middle" font-weight="600" fill="#1d1d1f">화면</text><text x="265" y="84" text-anchor="middle" fill="#6e6e73">저장 전 입력 검사</text>
    <rect x="350" y="44" width="130" height="226" rx="10" fill="#fff8ec" stroke="#ff9f0a"/><text x="415" y="66" text-anchor="middle" font-weight="600" fill="#1d1d1f">API</text><text x="415" y="84" text-anchor="middle" fill="#6e6e73">같은 규칙으로 400</text>
    <rect x="500" y="44" width="120" height="226" rx="10" fill="#effaf2" stroke="#34c759"/><text x="560" y="66" text-anchor="middle" font-weight="600" fill="#1d1d1f">DB</text><text x="560" y="84" text-anchor="middle" fill="#6e6e73">CHECK 제약</text>

    <line x1="160" y1="77" x2="236" y2="108" stroke="#6e6e73" marker-end="url(#a)"/>
    <text x="265" y="124" text-anchor="middle" font-weight="600" fill="#ff3b30">✕ 여기서 차단</text>
    <line x1="160" y1="157" x2="386" y2="174" stroke="#6e6e73" marker-end="url(#a)"/>
    <text x="415" y="196" text-anchor="middle" font-weight="600" fill="#ff3b30">✕ 400 응답</text>
    <line x1="160" y1="237" x2="532" y2="237" stroke="#6e6e73" marker-end="url(#a)"/>
    <text x="560" y="258" text-anchor="middle" font-weight="600" fill="#ff3b30">✕ 쓰기 거부</text>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="12" fill="#6e6e73">앞 계층을 거치지 않은 요청도 뒤 계층이 같은 규칙으로 거절한다</text>
</svg>
