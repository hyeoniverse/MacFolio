<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="680" height="260" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">#113~#182 중 main에 병합된 PR 64개의 first-parent 기록</text>
  <!-- row 1: actual -->
  <text x="20" y="76" font-size="12" font-weight="600" fill="#1f2937">실제</text>
  <text x="20" y="94" font-size="11" fill="#6b7280">방식이 섞임</text>
  <rect x="130" y="62" width="33" height="36" fill="#4f46e5"/>
  <rect x="163" y="62" width="453" height="36" fill="#f59e0b"/>
  <text x="146" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">11</text>
  <text x="389" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">151 (Rebase and merge로 들어온 PR 53개의 커밋)</text>
  <text x="626" y="85" font-size="12" font-weight="600" fill="#1f2937">162줄</text>
  <!-- row 2: all merge commits -->
  <text x="20" y="146" font-size="12" font-weight="600" fill="#1f2937">모두 Merge commit</text>
  <text x="20" y="164" font-size="11" fill="#6b7280">이었다면</text>
  <rect x="130" y="132" width="192" height="36" fill="#4f46e5"/>
  <text x="226" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">64 (PR 하나 = 한 줄)</text>
  <text x="332" y="155" font-size="12" font-weight="600" fill="#1f2937">64줄</text>
  <!-- legend -->
  <rect x="130" y="200" width="14" height="14" fill="#4f46e5"/>
  <text x="150" y="211" font-size="11" fill="#374151">Merge pull request #N (머지 커밋)</text>
  <rect x="370" y="200" width="14" height="14" fill="#f59e0b"/>
  <text x="390" y="211" font-size="11" fill="#374151">PR 번호가 없는 브랜치 커밋</text>
  <text x="340" y="244" text-anchor="middle" font-size="11" fill="#6b7280">막대 길이는 줄 수에 비례 (1줄 = 3px). 집계: #112와 #183의 머지 커밋 사이 git log --first-parent</text>
</svg>
