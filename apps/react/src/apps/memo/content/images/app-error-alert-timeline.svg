<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>배포 직후, 열어 둔 탭에서 메모를 처음 열면</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">배포 직후, 열어 둔 탭에서 메모를 처음 열면</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">탭은 옛 빌드의 파일 이름을 기억한다. 서버에는 새 이름만 있다</text>
<line x1="40" y1="120" x2="820" y2="120" stroke="#9ca3af" stroke-width="2"/>
<circle cx="90" cy="120" r="8" fill="#374151"/>
<text x="90" y="100" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">탭을 연다</text>
<text x="90" y="148" font-size="11" fill="#6b7280" text-anchor="middle">옛 빌드 · Memo-DJMDZtL5.js</text>
<circle cx="300" cy="120" r="8" fill="#b45309"/>
<text x="300" y="100" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">배포</text>
<text x="300" y="148" font-size="11" fill="#6b7280" text-anchor="middle">새 이름, 옛 파일 사라짐</text>
<circle cx="520" cy="120" r="8" fill="#b91c1c"/>
<text x="520" y="100" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">메모를 처음 연다</text>
<text x="520" y="148" font-size="11" fill="#6b7280" text-anchor="middle">import(옛 이름) 실패</text>
<circle cx="730" cy="120" r="8" fill="#15803d"/>
<text x="730" y="100" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">경고창</text>
<text x="730" y="148" font-size="11" fill="#6b7280" text-anchor="middle">새 버전이 있습니다</text>
<rect x="32" y="190" width="250" height="110" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="157.0" y="232.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">다시 import() (버린 방법)</text>
<text x="157.0" y="249.0" font-size="11" fill="#374151" text-anchor="middle">Chrome이 실패한 모듈 주소를 기억</text>
<text x="157.0" y="266.0" font-size="11" fill="#374151" text-anchor="middle">두 번째는 요청도 없이 실패</text>
<rect x="305" y="190" width="250" height="110" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="430.0" y="232.0" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">?retry= 붙여 새로 받기 (버린 방법)</text>
<text x="430.0" y="249.0" font-size="11" fill="#374151" text-anchor="middle">빌드된 파일은 줄인 이름(M)으로 내보냄</text>
<text x="430.0" y="266.0" font-size="11" fill="#374151" text-anchor="middle">어떤 이름을 꺼낼지 모른다</text>
<rect x="578" y="190" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="703.0" y="232.0" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">새로고침 권하기 (고른 방법)</text>
<text x="703.0" y="249.0" font-size="11" fill="#374151" text-anchor="middle">isChunkLoadError로 알아보고</text>
<text x="703.0" y="266.0" font-size="11" fill="#374151" text-anchor="middle">[닫기] [새로고침]</text>
</svg>
