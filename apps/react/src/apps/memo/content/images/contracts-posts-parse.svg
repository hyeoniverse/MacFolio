<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 418" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>요청 몸통이 requestBody, 칸별 text와 refine, parse를 차례로 거쳐 값이나 이유 목록이 된다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
<rect width="700" height="418" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">글 요청 몸통이 검사되는 길</text>
<text x="32" y="56" font-size="11" fill="#6b7280">packages/contracts/src/posts.ts의 postInput(today)</text>
<rect x="32" y="76" width="636" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="350.0" y="98" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">요청 몸통 (unknown)</text><text x="350.0" y="118" font-size="10.5" fill="#374151" text-anchor="middle">{ title: &quot;&quot;, date: &quot;2026-02-30&quot;, category: &quot;a/b/c/d&quot;, body: &quot; &quot; }</text><line x1="350.0" y1="130" x2="350.0" y2="150" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="152" width="636" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="350.0" y="174" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">requestBody(shape)</text><text x="350.0" y="194" font-size="10.5" fill="#374151" text-anchor="middle">객체가 아니면 {}로 본다 → zod 기본 문구가 새지 않는다</text><line x1="350.0" y1="206" x2="350.0" y2="226" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="228" width="636" height="68" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="350.0" y="250" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">칸마다 text() → refine  (키 순서: 제목 → 날짜 → 폴더 → 요약 → 본문)</text><text x="350.0" y="270" font-size="10.5" fill="#374151" text-anchor="middle">문자열이 아니면 &quot;&quot; · 앞뒤 공백 다듬기 · 날짜 비면 today</text><text x="350.0" y="286" font-size="10.5" fill="#374151" text-anchor="middle">POST_LIMITS · isCalendarDate · folderPathError (desktop-core)</text><line x1="350.0" y1="298" x2="350.0" y2="318" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/><rect x="32" y="320" width="636" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="350.0" y="342" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">parse(schema, input)</text><text x="350.0" y="362" font-size="10.5" fill="#374151" text-anchor="middle">성공 → { value: PostContent }   실패 → { errors: [제목…, 날짜…, 폴더…, 본문…] }</text><text x="32" y="398" font-size="11" fill="#6b7280">서버 parsePostInput은 parse(postInput(today), input) 한 줄. today는 요청마다 서울 시간으로 만든다</text>
</svg>
