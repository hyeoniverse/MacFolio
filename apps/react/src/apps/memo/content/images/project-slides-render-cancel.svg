<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<rect width="640" height="330" fill="#fff"/>
<text x="320" y="26" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">3쪽을 그리는 중에 →를 눌러 4쪽으로 넘긴 경우</text>
<text x="320" y="46" font-size="12" fill="#6e6e73" text-anchor="middle">두 렌더링 작업이 같은 canvas에 그린다. 막대는 각 작업이 실행되는 구간</text>
<line x1="130" y1="62" x2="130" y2="300" stroke="#0a84ff" stroke-dasharray="4 3"/>
<text x="134" y="76" font-size="12" fill="#0a84ff">→ 입력 (number 3 → 4)</text>
<text x="20" y="114" font-size="13" font-weight="600" fill="#1d1d1f">cancel 없음</text>
<rect x="60" y="126" width="300" height="22" rx="4" fill="#ff9f0a" opacity="0.8"/>
<text x="210" y="142" font-size="12" fill="#1d1d1f" text-anchor="middle">3쪽 RenderTask</text>
<rect x="130" y="156" width="170" height="22" rx="4" fill="#0a84ff" opacity="0.8"/>
<text x="215" y="172" font-size="12" fill="#fff" text-anchor="middle">4쪽 RenderTask</text>
<line x1="360" y1="120" x2="360" y2="186" stroke="#ff3b30" stroke-width="1.5"/>
<text x="370" y="142" font-size="12" font-weight="600" fill="#ff3b30">3쪽이 늦게 끝나 4쪽 위에 덮어씀</text>
<text x="370" y="160" font-size="12" fill="#ff3b30">화면 번호는 4, 그림은 3쪽</text>
<text x="20" y="232" font-size="13" font-weight="600" fill="#1d1d1f">cancel 적용</text>
<rect x="60" y="244" width="70" height="22" rx="4" fill="#ff9f0a" opacity="0.8"/>
<rect x="130" y="244" width="230" height="22" rx="4" fill="none" stroke="#ff9f0a" stroke-dasharray="4 3"/>
<text x="245" y="260" font-size="12" fill="#c46f00" text-anchor="middle">effect 정리 함수가 task.cancel()</text>
<rect x="130" y="274" width="170" height="22" rx="4" fill="#0a84ff" opacity="0.8"/>
<text x="215" y="290" font-size="12" fill="#fff" text-anchor="middle">4쪽 RenderTask</text>
<text x="370" y="284" font-size="12" font-weight="600" fill="#248a3d">화면에는 4쪽만 남는다</text>
</svg>
