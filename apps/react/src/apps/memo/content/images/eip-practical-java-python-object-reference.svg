<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>참조 변수 c1, c2가 같은 객체를, c3가 다른 객체를 가리키는 모습</title><rect width="640" height="330" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="320" y="28" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600">Counter c2 = c1; 은 객체를 복사하지 않고 주소(참조)만 복사한다</text>
<text x="120" y="66" font-size="13" fill="#6e6e73" text-anchor="middle" font-weight="600">스택: 참조 변수</text>
<text x="470" y="66" font-size="13" fill="#6e6e73" text-anchor="middle" font-weight="600">힙: 객체</text>
<rect x="40" y="76" width="160" height="210" fill="#f2f2f7"/>
<rect x="330" y="76" width="280" height="210" fill="#e8f2ff"/>
<rect x="70" y="96" width="100" height="40" fill="#fff" stroke="#ff9f0a" stroke-width="1"/>
<text x="120.0" y="121.4" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">c1</text>
<rect x="70" y="158" width="100" height="40" fill="#fff" stroke="#ff9f0a" stroke-width="1"/>
<text x="120.0" y="183.4" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">c2</text>
<rect x="70" y="220" width="100" height="40" fill="#fff" stroke="#30d158" stroke-width="1"/>
<text x="120.0" y="245.4" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">c3</text>
<rect x="380" y="100" width="190" height="64" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
<text x="475.0" y="128.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Counter 객체 #1</text>
<text x="475.0" y="146.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">count = 2</text>
<rect x="380" y="200" width="190" height="64" fill="#fff" stroke="#30d158" stroke-width="2"/>
<text x="475.0" y="228.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Counter 객체 #2</text>
<text x="475.0" y="246.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">count = 1</text>
<path d="M172 116 C260 116 300 122 376 128" fill="none" stroke="#ff9f0a" stroke-width="2" marker-end="url(#mff9f0a)"/>
<path d="M172 178 C260 178 300 150 376 142" fill="none" stroke="#ff9f0a" stroke-width="2" marker-end="url(#mff9f0a)"/>
<path d="M172 240 C260 240 300 232 376 232" fill="none" stroke="#30d158" stroke-width="2" marker-end="url(#m30d158)"/>
<text x="320" y="312" font-size="13" fill="#1d1d1f" text-anchor="middle">c1.up(), c2.up()이 같은 객체의 count를 두 번 올린다. c1 == c2 는 true, c1 == c3 은 false</text>
</svg>
