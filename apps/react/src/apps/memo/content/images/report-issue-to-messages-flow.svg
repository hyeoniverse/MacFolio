<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" fill="#ffffff"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#1f2937">고치기 전</text>
<rect x="24" y="44" width="220" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="134" y="68" font-size="12.5" font-weight="600" fill="#4b5563" text-anchor="middle">도움말 › 문제 알리기…</text>
<text x="134" y="88" font-size="10.5" fill="#6b7280" text-anchor="middle">openExternal(issues/new/choose)</text>
<line x1="246" y1="74" x2="318" y2="74" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="320" y="44" width="220" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="430" y="68" font-size="12.5" font-weight="600" fill="#4b5563" text-anchor="middle">GitHub 새 이슈 (새 탭)</text>
<text x="430" y="88" font-size="10.5" fill="#6b7280" text-anchor="middle">GitHub 계정이 있어야 남긴다</text>
<line x1="24" y1="128" x2="836" y2="128" stroke="#e5e7eb" stroke-width="1"/>
<text x="24" y="156" font-size="13" font-weight="600" fill="#1f2937">고친 뒤</text>
<rect x="24" y="172" width="220" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="134" y="196" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">도움말 › 문제 알리기…</text>
<text x="134" y="216" font-size="10.5" fill="#374151" text-anchor="middle">1. requestOpen(messages, report-issue)</text>
<text x="134" y="232" font-size="10.5" fill="#374151" text-anchor="middle">2. openApp(messages)</text>
<line x1="246" y1="209" x2="318" y2="209" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="320" y="172" width="236" height="74" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="438" y="196" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">메시지 앱</text>
<text x="438" y="216" font-size="10.5" fill="#374151" text-anchor="middle">useOpenRequest(messages)</text>
<text x="438" y="232" font-size="10.5" fill="#374151" text-anchor="middle">→ compose() (쓰기 버튼과 같다)</text>
<line x1="558" y1="209" x2="598" y2="209" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="160" width="248" height="98" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="724" y="184" font-size="12.5" font-weight="600" fill="#4f46e5" text-anchor="middle">새 피드백 화면</text>
<text x="724" y="204" font-size="10" fill="#374151" text-anchor="middle">'인사나 감상, 의견을 자유롭게 남겨 주세요.'</text>
<text x="724" y="220" font-size="10.5" fill="#374151" text-anchor="middle">입력 칸에 초점 (autoFocus)</text>
<text x="724" y="236" font-size="10.5" fill="#2563eb" text-anchor="middle">버그는 GitHub 이슈로 ↗ (새 탭)</text>
<text x="24" y="290" font-size="10.5" fill="#374151">요청은 openRequestStore에 남아 있다가 메시지 앱이 마운트되면 꺼낸다.</text>
<text x="24" y="308" font-size="10.5" fill="#374151">이미 열린 앱은 subscribe로 바로 받는다 (Finder → 메모, 사진 위젯 → 사진과 같은 구조)</text>
</svg>
