<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker></defs>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">팀의 작업 방식에 따라 보통 고르는 병합 방식</text>
  <!-- column 1 -->
  <rect x="20" y="56" width="190" height="96" rx="8" fill="#f3f4f6"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">오픈소스 · 큰 모노레포</text>
  <text x="115" y="102" text-anchor="middle" font-size="11" fill="#374151">기여자 커밋 습관을 통제 못 함</text>
  <text x="115" y="120" text-anchor="middle" font-size="11" fill="#374151">리뷰 반영 커밋이 많이 쌓임</text>
  <text x="115" y="138" text-anchor="middle" font-size="11" fill="#374151">PR 하나 = 되돌리기 한 번</text>
  <path d="M115 152 L115 192" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="200" width="190" height="56" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="115" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Squash and merge</text>
  <text x="115" y="243" text-anchor="middle" font-size="11" fill="#374151">PR 제목 규칙을 엄격히</text>
  <!-- column 2 -->
  <rect x="225" y="56" width="190" height="96" rx="8" fill="#f3f4f6"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">커밋을 정성껏 쪼개는 팀</text>
  <text x="320" y="102" text-anchor="middle" font-size="11" fill="#374151">커밋마다 빌드되고 뜻이 있음</text>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#374151">직선 기록, bisect에 유리</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#374151">브랜치는 rebase로 따라감</text>
  <path d="M320 152 L320 192" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="225" y="200" width="190" height="56" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="320" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Rebase and merge</text>
  <text x="320" y="243" text-anchor="middle" font-size="11" fill="#374151">브랜치 안에 머지 커밋 금지</text>
  <!-- column 3 -->
  <rect x="430" y="56" width="190" height="96" rx="8" fill="#f3f4f6"/>
  <text x="525" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">SHA · PR 경계에 의존하는 곳</text>
  <text x="525" y="102" text-anchor="middle" font-size="11" fill="#374151">배포 태그 = 머지 커밋 SHA</text>
  <text x="525" y="120" text-anchor="middle" font-size="11" fill="#374151">문서·PR 본문의 커밋 링크, 서명</text>
  <text x="525" y="138" text-anchor="middle" font-size="11" fill="#374151">충돌은 git merge main으로</text>
  <path d="M525 152 L525 192" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="430" y="200" width="190" height="56" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="525" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">Create a merge commit</text>
  <text x="525" y="243" text-anchor="middle" font-size="11" fill="#374151">log는 --first-parent로 읽기</text>
  <text x="320" y="284" text-anchor="middle" font-size="11" fill="#6b7280">한 저장소 안에서는 한 가지로 통일한다. 섞어 쓰면 first-parent도 bisect도 쓰기 어렵다</text>
</svg>
