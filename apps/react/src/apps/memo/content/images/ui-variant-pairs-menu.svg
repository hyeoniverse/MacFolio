<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>Menu에 variant &#x27;mac&#x27; | &#x27;ios&#x27;를 더했다. ios는 기존 CSS 클래스 touch를 붙인다. 다른 짝은 이미 맞는 모양이라 그대로 두었다</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs>
<rect width="760" height="250" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">바꾼 것은 Menu 하나</text>
<rect x="32" y="70" width="250" height="70" rx="8" fill="#fff1f2" stroke="#fda4af"/>
<text x="157.0" y="93.3" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">전</text>
<text x="157.0" y="108.8" font-size="10.5" fill="#374151" text-anchor="middle">className=&quot;touch&quot;</text>
<text x="157.0" y="124.3" font-size="10.5" fill="#6b7280" text-anchor="middle">· 잘못 적어도 타입이 못 막음</text>
<rect x="330" y="70" width="250" height="70" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="455.0" y="93.3" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle">후 (9파일)</text>
<text x="455.0" y="108.8" font-size="10.5" fill="#374151" text-anchor="middle">variant?: &#x27;mac&#x27; | &#x27;ios&#x27;</text>
<text x="455.0" y="124.3" font-size="10.5" fill="#6b7280" text-anchor="middle">· ios → class touch, 기본 mac</text>
<path d="M284 105 H328" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#an)"/>
<text x="600" y="92" font-size="10.5" fill="#374151">자동(useIsMobile)으로</text>
<text x="600" y="108" font-size="10.5" fill="#374151">고르지 않았다: 휴대폰 안에도</text>
<text x="600" y="124" font-size="10.5" fill="#374151">mac 메뉴를 쓰는 곳이 있다</text>
<rect x="32" y="168" width="166" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="115.0" y="189.1" font-size="10" fill="#374151" text-anchor="middle">Sheet · Modal</text>
<text x="115.0" y="204.1" font-size="10" fill="#6b7280" text-anchor="middle">· 방향·덮개·닫는 몸짓이 다름</text>
<rect x="208" y="168" width="166" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="291.0" y="189.1" font-size="10" fill="#374151" text-anchor="middle">SearchField</text>
<text x="291.0" y="204.1" font-size="10" fill="#6b7280" text-anchor="middle">· 두 화면이 같은 모양</text>
<rect x="384" y="168" width="166" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="467.0" y="189.1" font-size="10" fill="#374151" text-anchor="middle">*Mobile 화면</text>
<text x="467.0" y="204.1" font-size="10" fill="#6b7280" text-anchor="middle">· 화면 전체가 다름</text>
<rect x="560" y="168" width="166" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="643.0" y="189.1" font-size="10" fill="#374151" text-anchor="middle">Button · 목록 줄</text>
<text x="643.0" y="204.1" font-size="10" fill="#6b7280" text-anchor="middle">· 휴대폰 모양을 고를 곳 없음</text>
</svg>
