<text x="250.0" y="270.32" text-anchor="middle" font-size="12" fill="#1d1d1f">일반</text>
<text x="100.0" y="294.32" text-anchor="middle" font-size="12" fill="#1d1d1f">M02</text>
<text x="180.0" y="294.32" text-anchor="middle" font-size="12" fill="#1d1d1f">오세진</text>
<text x="250.0" y="294.32" text-anchor="middle" font-size="12" fill="#1d1d1f">우수</text>
<text x="100.0" y="318.32" text-anchor="middle" font-size="12" fill="#1d1d1f">M03</text>
<text x="180.0" y="318.32" text-anchor="middle" font-size="12" fill="#1d1d1f">한유나</text>
<text x="250.0" y="318.32" text-anchor="middle" font-size="12" fill="#1d1d1f">일반</text>
<rect x="60" y="230" width="220" height="96" fill="none" stroke="#c7c7cc"/>
<line x1="140" y1="230" x2="140" y2="326" stroke="#c7c7cc"/>
