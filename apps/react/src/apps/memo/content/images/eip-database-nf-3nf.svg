<text x="505.0" y="294.32" text-anchor="middle" font-size="12" fill="#1d1d1f">5</text>
<rect x="390" y="230" width="160" height="72" fill="none" stroke="#c7c7cc"/>
<line x1="460" y1="230" x2="460" y2="302" stroke="#c7c7cc"/>
<line x1="390" y1="254" x2="550" y2="254" stroke="#c7c7cc"/>
<line x1="390" y1="278" x2="550" y2="278" stroke="#c7c7cc"/>
<text x="470" y="318" text-anchor="middle" font-size="12" fill="#ff9f0a">일반 등급 한도 변경은 이제 1행만 고친다</text></svg>
