<text x="425.0" y="246.32" text-anchor="middle" font-size="12" fill="#1d1d1f" font-weight="600" text-decoration="underline">등급</text>
<text x="505.0" y="246.32" text-anchor="middle" font-size="12" fill="#1d1d1f" font-weight="600">대여한도</text>
