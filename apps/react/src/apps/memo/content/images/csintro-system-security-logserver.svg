<rect x="20" y="20" width="150" height="44" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="95" y="47">라우터·스위치</text>
<rect x="20" y="90" width="150" height="44" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="95" y="117">방화벽</text>
