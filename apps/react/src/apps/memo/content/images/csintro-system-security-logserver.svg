<rect x="420" y="80" width="200" height="64" rx="6" fill="#0a84ff"/><text x="520" y="106" fill="#fff">로그 서버</text><text x="520" y="126" font-size="12" fill="#fff">이미 받은 기록은 그대로</text>
<g stroke="#0a84ff" marker-end="url(#b)"><line x1="172" y1="42" x2="417" y2="98"/><line x1="172" y1="112" x2="417" y2="112"/><line x1="172" y1="182" x2="417" y2="128"/></g>
