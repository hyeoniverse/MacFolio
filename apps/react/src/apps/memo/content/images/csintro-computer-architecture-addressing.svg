<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>직접 주소 지정과 간접 주소 지정</title><rect width="640" height="330" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="160" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">직접 주소 지정</text><text x="480" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">간접 주소 지정</text>
<line x1="320" y1="45" x2="320" y2="310" stroke="#f2f2f7" stroke-width="2"/>
<g font-size="13">
<rect x="40" y="60" width="240" height="34" fill="#0a84ff"/><text x="160" y="82" text-anchor="middle" fill="#fff">LOAD 200</text>
<rect x="100" y="200" width="160" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="180" y="222" text-anchor="middle" fill="#1d1d1f">200번지: 7</text>
<path d="M160 94 V196" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="170" y="150" fill="#6e6e73">메모리 접근 1회</text>
<text x="160" y="270" text-anchor="middle" fill="#1d1d1f">AC ← 7</text>
<rect x="360" y="60" width="240" height="34" fill="#0a84ff"/><text x="480" y="82" text-anchor="middle" fill="#fff">LOAD @200</text>
<rect x="400" y="140" width="160" height="34" fill="#f2f2f7" stroke="#ff9f0a" stroke-width="2"/><text x="480" y="162" text-anchor="middle" fill="#1d1d1f">200번지: 500</text>
<rect x="400" y="220" width="160" height="34" fill="#f2f2f7" stroke="#6e6e73"/><text x="480" y="242" text-anchor="middle" fill="#1d1d1f">500번지: 9</text>
<path d="M480 94 V136" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><path d="M480 174 V216" stroke="#ff9f0a" stroke-width="2" marker-end="url(#a)"/><text x="490" y="200" fill="#ff9f0a">간접 사이클</text>
<text x="480" y="290" text-anchor="middle" fill="#1d1d1f">AC ← 9 (메모리 접근 2회)</text>
</g></svg>
