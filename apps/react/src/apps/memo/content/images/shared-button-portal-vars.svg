<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>앱 창에 정의한 CSS 변수가 body에 렌더링한 포털 팝오버로 상속되지 않는 구조</title>
  <rect width="640" height="370" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">CSS 변수는 DOM 트리를 따라 상속된다</text>
  <text x="24" y="56" font-size="12" fill="#6e6e73">React 컴포넌트 위치가 아니라 실제 DOM 위치가 기준이다</text>

  <g font-size="12">
    <rect x="24" y="76" width="592" height="270" rx="12" fill="#f2f2f7"/>
    <text x="40" y="100" font-weight="600" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">body</text>

    <!-- memo window -->
    <rect x="40" y="114" width="300" height="214" rx="10" fill="#ffffff" stroke="#ff9f0a" stroke-width="1.5"/>
    <text x="56" y="138" font-weight="600" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">[data-app='memo']</text>
    <text x="56" y="158" fill="#b25000" font-family="ui-monospace, Menlo, monospace">--ui-accent: var(--memo-accent)</text>
    <rect x="56" y="174" width="268" height="62" rx="8" fill="#f2f2f7"/>
    <text x="70" y="196" fill="#1d1d1f">댓글 '등록' 버튼 (창 안)</text>
    <rect x="70" y="206" width="64" height="22" rx="11" fill="#edbb4d"/>
    <text x="102" y="221" text-anchor="middle" fill="#2b2100">등록</text>
    <text x="146" y="221" fill="#248a3d">변수를 상속해 노란색</text>
    <text x="56" y="262" fill="#6e6e73">React에서는 이 창의 컴포넌트가</text>
    <text x="56" y="280" fill="#6e6e73">이미지 창을 연다 (createPortal)</text>
    <path d="M300 272 C 350 272, 360 200, 376 196" fill="none" stroke="#6e6e73" stroke-dasharray="4 3"/>

    <!-- portal -->
    <rect x="364" y="114" width="236" height="214" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="380" y="138" font-weight="600" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-format-panel</text>
    <text x="380" y="156" fill="#6e6e73">body의 직접 자식 (포털)</text>

    <text x="380" y="184" fill="#ff3b30">변수 없음 → 기본 강조색</text>
    <rect x="380" y="194" width="64" height="22" rx="6" fill="#0a84ff"/>
    <text x="412" y="209" text-anchor="middle" fill="#ffffff">넣기</text>

    <line x1="380" y1="232" x2="584" y2="232" stroke="#c7c7cc"/>
    <text x="380" y="254" fill="#0a84ff">수정: 패널에 변수를 다시 정의</text>
    <text x="380" y="272" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">--ui-accent: #edbb4d</text>
    <rect x="380" y="284" width="64" height="22" rx="11" fill="#edbb4d"/>
    <text x="412" y="299" text-anchor="middle" fill="#2b2100">넣기</text>
    <text x="456" y="299" fill="#248a3d">노란 알약 모양</text>
  </g>
</svg>
