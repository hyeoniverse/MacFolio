    <text x="45" y="366" text-anchor="middle" fill="#ff3b30" font-weight="600">3</text>
    <text x="145" y="366" text-anchor="middle" fill="#ff3b30" font-weight="600">00:01:12:23:34:45</text>
    <text x="45" y="388" text-anchor="middle">1</text>
    <text x="145" y="388" text-anchor="middle">00:01:02:03:04:05</text>
    <text x="45" y="410" text-anchor="middle">5</text>
    <text x="145" y="410" text-anchor="middle">00:01:02:03:04:06</text>
  </g>

  <g font-size="12" fill="#ff3b30" font-weight="600">
    <text x="345" y="350">ARP 응답</text>
    <text x="170" y="262">B의 MAC = 스니퍼 MAC</text>
