<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<rect width="780" height="540" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<text x="390.0" y="26.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">음량 창: 보이는 칸과 실제로 포인터를 받는 범위</text>
<text x="390.0" y="44.0" font-size="11" fill="#6b7280" text-anchor="middle">1rem = 16px, 실제 크기의 2.2배로 그림</text>
<text x="250.0" y="80.0" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="600">수정 전: 90도 돌린 투명 range</text>
<rect x="197.2" y="117.2" width="105.6" height="316.8" rx="52.8" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="5 4"/>
<rect x="214.8" y="170" width="70.4" height="211.2" rx="28.2" fill="#374151" fill-opacity="0.85" stroke="#1f2937"/>
<clipPath id="c1"><rect x="214.8" y="170" width="70.4" height="211.2" rx="28.2"/></clipPath>
<rect clip-path="url(#c1)" x="214.8" y="317.8" width="70.4" height="63.4" fill="#e5e7eb" fill-opacity="0.9"/>
<circle cx="250" cy="306.4" r="66.0" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
<line x1="158" y1="170.0" x2="158" y2="381.2" stroke="#1f2937" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="152.0" y="279.6" font-size="10.5" fill="#1f2937" text-anchor="end">보이는 칸 6rem = 96px</text>
<line x1="334" y1="117.2" x2="334" y2="434.0" stroke="#991b1b" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="340.0" y="279.6" font-size="10.5" fill="#991b1b" text-anchor="start">range 9rem = 144px</text>
<text x="340.0" y="129.2" font-size="10" fill="#991b1b" text-anchor="start">위 24px: 칸 밖(잘림)</text>
<text x="340.0" y="430.0" font-size="10" fill="#991b1b" text-anchor="start">아래 24px: 칸 밖(잘림)</text>
<text x="340.0" y="310.4" font-size="10" fill="#b91c1c" text-anchor="start">손잡이 지름 60px</text>
<text x="340.0" y="324.4" font-size="10" fill="#b91c1c" text-anchor="start">(칸 높이의 62%)</text>
<text x="250.0" y="460.0" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">맨 위를 눌러도 91% · 손잡이 위를 누르면 값 그대로</text>
<text x="620.0" y="80.0" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="600">수정 후: 칸 전체가 pointer 이벤트를 받는다</text>
<rect x="584.8" y="170" width="70.4" height="211.2" rx="28.2" fill="#374151" fill-opacity="0.85" stroke="#065f46" stroke-width="2"/>
<clipPath id="c2"><rect x="584.8" y="170" width="70.4" height="211.2" rx="28.2"/></clipPath>
<rect clip-path="url(#c2)" x="584.8" y="222.8" width="70.4" height="158.4" fill="#e5e7eb" fill-opacity="0.9"/>
<line x1="544.8" y1="222.8" x2="695.2" y2="222.8" stroke="#047857" stroke-dasharray="4 3"/>
<text x="538.8" y="226.8" font-size="10.5" fill="#047857" text-anchor="end">누른 높이 clientY</text>
<line x1="685.2" y1="381.2" x2="685.2" y2="224.8" stroke="#047857" marker-end="url(#g)"/>
<text x="691.2" y="296.7" font-size="10.5" fill="#047857" text-anchor="start">72px → 75%</text>
<text x="691.2" y="385.2" font-size="10" fill="#6b7280" text-anchor="start">맨 아래 0%</text>
<text x="691.2" y="178.0" font-size="10" fill="#6b7280" text-anchor="start">맨 위 100%</text>
<text x="620.0" y="404.0" font-size="11" fill="#065f46" text-anchor="middle" font-weight="600">volume = (rect.bottom − clientY) / rect.height</text>
<text x="620.0" y="422.0" font-size="10.5" fill="#4b5563" text-anchor="middle">pointerdown에서 setPointerCapture → 칸 밖으로 끌어도 추적</text>
<text x="620.0" y="440.0" font-size="10.5" fill="#4b5563" text-anchor="middle">range는 inset: 0, pointer-events: none (방향키·화면 읽기용)</text>
<line x1="470" y1="64" x2="470" y2="520" stroke="#e5e7eb"/>
</svg>
