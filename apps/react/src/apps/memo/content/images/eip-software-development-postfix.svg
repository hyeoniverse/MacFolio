<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>중위식을 후위식으로 바꾸는 스택 동작</title><rect width="640" height="460" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">중위식 (A+B)*C-D/E 를 후위식으로 바꾸는 스택 동작</text><text x="60" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#6e6e73">읽은 기호</text><text x="170" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#6e6e73">연산자 스택 (왼쪽이 바닥)</text><text x="345" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#6e6e73">출력</text><text x="520" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#6e6e73">설명</text><rect x="20" y="62" width="600" height="28" fill="#f9f9fb"/><text x="60" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">(</text><rect x="120" y="65" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="80.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(</text><text x="290" y="81" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff"></text><text x="430" y="81" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">여는 괄호는 스택에 보관</text><rect x="20" y="92" width="600" height="28" fill="#fff"/><text x="60" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">A</text><rect x="120" y="95" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="110.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(</text><text x="290" y="111" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">A</text><text x="430" y="111" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">피연산자는 바로 출력</text><rect x="20" y="122" width="600" height="28" fill="#f9f9fb"/><text x="60" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">+</text><rect x="120" y="125" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="140.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(</text><rect x="148" y="125" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="160.0" y="140.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">+</text><text x="290" y="141" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">A</text><text x="430" y="141" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">스택 위가 ( 라서 보관</text><rect x="20" y="152" width="600" height="28" fill="#fff"/><text x="60" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">B</text><rect x="120" y="155" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="170.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(</text><rect x="148" y="155" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="160.0" y="170.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">+</text><text x="290" y="171" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB</text><text x="430" y="171" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">피연산자는 바로 출력</text><rect x="20" y="182" width="600" height="28" fill="#f9f9fb"/><text x="60" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">)</text><text x="290" y="201" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+</text><text x="430" y="201" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">여는 괄호까지 꺼내 출력</text><rect x="20" y="212" width="600" height="28" fill="#fff"/><text x="60" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">*</text><rect x="120" y="215" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="230.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">*</text><text x="290" y="231" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+</text><text x="430" y="231" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">스택이 비어 있어 보관</text><rect x="20" y="242" width="600" height="28" fill="#f9f9fb"/><text x="60" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">C</text><rect x="120" y="245" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="260.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">*</text><text x="290" y="261" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+C</text><text x="430" y="261" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">피연산자는 바로 출력</text><rect x="20" y="272" width="600" height="28" fill="#fff"/><text x="60" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">-</text><rect x="120" y="275" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="290.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">-</text><text x="290" y="291" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+C*</text><text x="430" y="291" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">우선순위가 같거나 높은 * 를 먼저 출력</text><rect x="20" y="302" width="600" height="28" fill="#f9f9fb"/><text x="60" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">D</text><rect x="120" y="305" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="320.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">-</text><text x="290" y="321" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+C*D</text><text x="430" y="321" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">피연산자는 바로 출력</text><rect x="20" y="332" width="600" height="28" fill="#fff"/><text x="60" y="351" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">/</text><rect x="120" y="335" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="350.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">-</text><rect x="148" y="335" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="160.0" y="350.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">/</text><text x="290" y="351" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+C*D</text><text x="430" y="351" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">- 보다 높아 그대로 보관</text><rect x="20" y="362" width="600" height="28" fill="#f9f9fb"/><text x="60" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">E</text><rect x="120" y="365" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="132.0" y="380.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">-</text><rect x="148" y="365" width="24" height="22" rx="4" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="160.0" y="380.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">/</text><text x="290" y="381" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+C*DE</text><text x="430" y="381" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">피연산자는 바로 출력</text><rect x="20" y="392" width="600" height="28" fill="#e8f2ff"/><text x="60" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">끝</text><text x="290" y="411" text-anchor="start" font-size="14" font-weight="600" fill="#0a84ff">AB+C*DE/-</text><text x="430" y="411" text-anchor="start" font-size="12" font-weight="400" fill="#6e6e73">남은 연산자를 위에서부터 출력</text><text x="320" y="446" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">결과: AB+C*DE/-  (같은 식의 전위식은 -*+ABC/DE)</text></svg>
