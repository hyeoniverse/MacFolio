<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>숫자 배열이 SVG 선이 되기까지 (LineChart.tsx, 62줄)</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="860" height="330" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">숫자 배열이 SVG 선이 되기까지 (LineChart.tsx, 62줄)</text>
<text x="32" y="56" font-size="11" fill="#6b7280" text-anchor="start">viewBox 600×140에 그리고, 창 폭에 맞게 늘린다</text>
<rect x="32" y="90" width="180" height="100" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="122.0" y="127.0" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">days</text>
<text x="122.0" y="144.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">[{ day, visits,</text>
<text x="122.0" y="161.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">  visitors }]</text>
<line x1="212" y1="140" x2="252" y2="140" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="256" y="90" width="190" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="351.0" y="127.0" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="middle">좌표</text>
<text x="351.0" y="144.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">x = i/(n-1) × 600</text>
<text x="351.0" y="161.0" font-size="11" fill="#374151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">y = 140 − v/max × 128</text>
<line x1="446" y1="140" x2="486" y2="140" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="490" y="80" width="160" height="120" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="570.0" y="118.5" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">path 세 개</text>
<text x="570.0" y="135.5" font-size="11" fill="#374151" text-anchor="middle">area: 아래를 옅게</text>
<text x="570.0" y="152.5" font-size="11" fill="#374151" text-anchor="middle">visits: 초록 선</text>
<text x="570.0" y="169.5" font-size="11" fill="#374151" text-anchor="middle">visitors: 파란 점선</text>
<line x1="650" y1="140" x2="690" y2="140" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="694" y="90" width="140" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="764.0" y="127.0" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">화면</text>
<text x="764.0" y="144.0" font-size="11" fill="#374151" text-anchor="middle">preserveAspect</text>
<text x="764.0" y="161.0" font-size="11" fill="#374151" text-anchor="middle">Ratio=&quot;none&quot;</text>
<rect x="256" y="230" width="390" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="451.0" y="255.5" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">vector-effect: non-scaling-stroke</text>
<text x="451.0" y="272.5" font-size="11" fill="#374151" text-anchor="middle">가로로 늘려도 선 두께는 그대로</text>
<line x1="764" y1="190" x2="650" y2="250" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-amber)"/>
<rect x="32" y="230" width="180" height="60" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="122.0" y="255.5" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">aria-label</text>
<text x="122.0" y="272.5" font-size="11" fill="#374151" text-anchor="middle">날짜별 &quot;10/07 12회&quot;</text>
</svg>
