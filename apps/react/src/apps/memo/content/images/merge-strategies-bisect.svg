<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">git bisect가 원인을 좁힐 수 있는 단위</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#6e6e73">PR 하나(커밋 A·B·C) 안의 B가 버그를 만들었다고 가정</text>
  <g font-size="12">
    <text x="20" y="96" font-weight="600" fill="#1d1d1f">Merge commit</text>
    <rect x="150" y="78" width="60" height="28" rx="6" fill="#f2f2f7" stroke="#d1d1d6"/><text x="180" y="97" text-anchor="middle" fill="#1d1d1f">M3</text>
    <text x="222" y="97" fill="#6e6e73">→</text>
    <rect x="244" y="78" width="40" height="28" rx="6" fill="#f2f2f7" stroke="#d1d1d6"/><text x="264" y="97" text-anchor="middle" fill="#1d1d1f">A</text>
    <rect x="290" y="78" width="40" height="28" rx="6" fill="#e5f1ff" stroke="#0a84ff" stroke-width="2"/><text x="310" y="97" text-anchor="middle" fill="#0a84ff">B</text>
    <rect x="336" y="78" width="40" height="28" rx="6" fill="#f2f2f7" stroke="#d1d1d6"/><text x="356" y="97" text-anchor="middle" fill="#1d1d1f">C</text>
    <text x="390" y="90" fill="#1d1d1f">--first-parent로 PR(M3)을 찾고</text>
    <text x="390" y="106" fill="#1d1d1f">그 안에서 B까지 좁힌다</text>
    <text x="20" y="166" font-weight="600" fill="#1d1d1f">Squash and merge</text>
    <rect x="150" y="148" width="226" height="28" rx="6" fill="#ffecea" stroke="#ff3b30" stroke-width="2"/><text x="263" y="167" text-anchor="middle" fill="#1d1d1f">S (A+B+C의 diff 전체)</text>
    <text x="390" y="160" fill="#1d1d1f">"이 PR이 원인"까지만 좁힌다</text>
    <text x="390" y="176" fill="#1d1d1f">S의 diff 안은 직접 찾는다</text>
    <text x="20" y="236" font-weight="600" fill="#1d1d1f">Rebase and merge</text>
    <rect x="150" y="218" width="60" height="28" rx="6" fill="#f2f2f7" stroke="#d1d1d6"/><text x="180" y="237" text-anchor="middle" fill="#1d1d1f">A'</text>
    <rect x="232" y="218" width="60" height="28" rx="6" fill="#e5f1ff" stroke="#0a84ff" stroke-width="2"/><text x="262" y="237" text-anchor="middle" fill="#0a84ff">B'</text>
    <rect x="314" y="218" width="60" height="28" rx="6" fill="#f2f2f7" stroke="#d1d1d6"/><text x="344" y="237" text-anchor="middle" fill="#1d1d1f">C'</text>
    <text x="390" y="230" fill="#1d1d1f">직선 기록이라 바로 B'로</text>
    <text x="390" y="246" fill="#1d1d1f">좁힌다</text>
  </g>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#6e6e73">파란 테두리: bisect가 찾는 커밋, 빨간 테두리: 찾은 커밋의 diff가 PR 전체</text>
</svg>
