<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>Z 키 하나를 눌렀을 때 event.key와 event.code</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<rect x="20" y="110" width="84" height="84" rx="10" fill="#f2f2f7" stroke="#1d1d1f" stroke-width="1.5"/>
<text x="34" y="140" font-size="22" font-weight="700" fill="#1d1d1f">Z</text>
<text x="80" y="182" font-size="18" fill="#1d1d1f" text-anchor="middle">ㅋ</text>
<text x="62" y="214" font-size="12" fill="#6e6e73" text-anchor="middle">물리 키 하나</text>
<line x1="108" y1="152" x2="150" y2="152" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="154" y="20" width="240" height="120" rx="10" fill="#f2f2f7"/>
<text x="168" y="44" font-size="13" font-weight="700" fill="#1d1d1f">event.key: 입력된 문자</text>
<text x="168" y="70" font-size="12" fill="#1d1d1f">영문 입력 상태  →  'z'</text>
<text x="168" y="94" font-size="12" fill="#ff3b30">한글 입력 상태  →  'ㅋ'</text>
<text x="168" y="118" font-size="12" fill="#ff3b30">Chrome IME 조합 중  →  'Process'</text>
<rect x="154" y="164" width="240" height="96" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="1.5"/>
<text x="168" y="188" font-size="13" font-weight="700" fill="#0a84ff">event.code: 물리 키의 위치</text>
<text x="168" y="214" font-size="12" fill="#1d1d1f">영문 입력 상태  →  'KeyZ'</text>
<text x="168" y="238" font-size="12" fill="#1d1d1f">한글 입력 상태  →  'KeyZ'</text>
<line x1="394" y1="80" x2="440" y2="80" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="444" y="40" width="180" height="80" rx="10" fill="#fff1f0" stroke="#ff3b30"/>
<text x="534" y="66" font-size="12" fill="#1d1d1f" text-anchor="middle">수정 전: key로 판정</text>
<text x="534" y="88" font-size="12" fill="#1d1d1f" text-anchor="middle">'ㅋ' ≠ 'z'</text>
<text x="534" y="108" font-size="12" fill="#ff3b30" text-anchor="middle">한글 상태에서 반응 없음</text>
<line x1="394" y1="212" x2="440" y2="212" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="444" y="172" width="180" height="80" rx="10" fill="#ecfaef" stroke="#34c759"/>
<text x="534" y="198" font-size="12" fill="#1d1d1f" text-anchor="middle">수정 후: gameKey()</text>
<text x="534" y="220" font-size="12" fill="#1d1d1f" text-anchor="middle">CODE_KEYS['KeyZ'] = 'z'</text>
<text x="534" y="240" font-size="12" fill="#34c759" text-anchor="middle">입력 언어와 관계없이 동작</text>
<text x="20" y="300" font-size="12" fill="#6e6e73">게임의 Z·X·WASD는 글자가 아니라 키의 위치가 의미를 가진다. 그래서 code로 판정한다</text>
</svg>
