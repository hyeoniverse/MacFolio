<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">관계 타입의 사상 원소 수</text>

  <!-- 1:1 -->
  <g>
    <text x="85" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">1 : 1</text>
    <ellipse cx="50" cy="150" rx="30" ry="70" fill="#eef2ff" stroke="#4f46e5"/>
    <ellipse cx="120" cy="150" rx="30" ry="70" fill="#ecfdf5" stroke="#059669"/>
    <g fill="#1f2937"><circle cx="50" cy="110" r="4"/><circle cx="50" cy="150" r="4"/><circle cx="50" cy="190" r="4"/>
      <circle cx="120" cy="110" r="4"/><circle cx="120" cy="150" r="4"/><circle cx="120" cy="190" r="4"/></g>
    <g stroke="#6b7280" stroke-width="1.4"><line x1="50" y1="110" x2="120" y2="110"/><line x1="50" y1="150" x2="120" y2="150"/><line x1="50" y1="190" x2="120" y2="190"/></g>
    <text x="85" y="245" text-anchor="middle" font-size="11" fill="#374151">결혼</text>
    <text x="85" y="262" text-anchor="middle" font-size="11" fill="#6b7280">신랑 ↔ 신부</text>
  </g>

  <!-- 1:n -->
  <g>
    <text x="245" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">1 : n</text>
    <ellipse cx="210" cy="150" rx="30" ry="70" fill="#eef2ff" stroke="#4f46e5"/>
    <ellipse cx="280" cy="150" rx="30" ry="70" fill="#ecfdf5" stroke="#059669"/>
    <g fill="#1f2937"><circle cx="210" cy="125" r="4"/><circle cx="210" cy="180" r="4"/>
      <circle cx="280" cy="100" r="4"/><circle cx="280" cy="135" r="4"/><circle cx="280" cy="170" r="4"/><circle cx="280" cy="200" r="4"/></g>
    <g stroke="#6b7280" stroke-width="1.4"><line x1="210" y1="125" x2="280" y2="100"/><line x1="210" y1="125" x2="280" y2="135"/><line x1="210" y1="180" x2="280" y2="170"/><line x1="210" y1="180" x2="280" y2="200"/></g>
    <text x="245" y="245" text-anchor="middle" font-size="11" fill="#374151">모자 관계</text>
    <text x="245" y="262" text-anchor="middle" font-size="11" fill="#6b7280">어머니 → 자녀</text>
  </g>

  <!-- n:1 -->
  <g>
    <text x="405" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">n : 1</text>
    <ellipse cx="370" cy="150" rx="30" ry="70" fill="#eef2ff" stroke="#4f46e5"/>
    <ellipse cx="440" cy="150" rx="30" ry="70" fill="#ecfdf5" stroke="#059669"/>
    <g fill="#1f2937"><circle cx="370" cy="100" r="4"/><circle cx="370" cy="135" r="4"/><circle cx="370" cy="170" r="4"/><circle cx="370" cy="200" r="4"/>
      <circle cx="440" cy="125" r="4"/><circle cx="440" cy="180" r="4"/></g>
    <g stroke="#6b7280" stroke-width="1.4"><line x1="370" y1="100" x2="440" y2="125"/><line x1="370" y1="135" x2="440" y2="125"/><line x1="370" y1="170" x2="440" y2="180"/><line x1="370" y1="200" x2="440" y2="180"/></g>
    <text x="405" y="245" text-anchor="middle" font-size="11" fill="#374151">소속</text>
    <text x="405" y="262" text-anchor="middle" font-size="11" fill="#6b7280">교수 → 학과</text>
  </g>

  <!-- n:m -->
  <g>
    <text x="565" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#4f46e5">n : m</text>
    <ellipse cx="530" cy="150" rx="30" ry="70" fill="#eef2ff" stroke="#4f46e5"/>
    <ellipse cx="600" cy="150" rx="30" ry="70" fill="#ecfdf5" stroke="#059669"/>
    <g fill="#1f2937"><circle cx="530" cy="110" r="4"/><circle cx="530" cy="150" r="4"/><circle cx="530" cy="190" r="4"/>
      <circle cx="600" cy="110" r="4"/><circle cx="600" cy="150" r="4"/><circle cx="600" cy="190" r="4"/></g>
    <g stroke="#6b7280" stroke-width="1.4"><line x1="530" y1="110" x2="600" y2="110"/><line x1="530" y1="110" x2="600" y2="150"/><line x1="530" y1="150" x2="600" y2="110"/><line x1="530" y1="150" x2="600" y2="190"/><line x1="530" y1="190" x2="600" y2="150"/></g>
    <text x="565" y="245" text-anchor="middle" font-size="11" fill="#374151">등록</text>
    <text x="565" y="262" text-anchor="middle" font-size="11" fill="#6b7280">학생 ↔ 과목</text>
  </g>
  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#6b7280">왼쪽 타원과 오른쪽 타원은 두 개체 집합, 점은 개체 인스턴스, 선은 관계 인스턴스</text>
</svg>
