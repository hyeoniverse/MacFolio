<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>마스킹 규칙을 적용하기 전과 후의 로그 문자열. 비밀번호·토큰·쿠키 값·메일 주소의 앞부분만 별표로 바뀌고 statusCode=500은 그대로 남는다</title>
<rect width="640" height="420" fill="#ffffff"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#1d1d1f">redact() 적용 전후의 로그 문자열 (예시 값)</text>
<g font-size="12" fill="#6e6e73">
<text x="24" y="60">DB 주소의 비밀번호</text>
<text x="24" y="146">Authorization 헤더</text>
<text x="24" y="232">쿠키 값 (단어 경계 검사)</text>
<text x="24" y="318">메일 주소</text>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
<rect x="24" y="68" width="592" height="28" rx="5" fill="#fff0ef"/>
<text x="34" y="87" fill="#1d1d1f"><tspan fill="#ff3b30" font-weight="700">전 </tspan>postgresql://macfolio:<tspan fill="#ff3b30" font-weight="700">s3cret</tspan>@db:5432/macfolio</text>
<rect x="24" y="100" width="592" height="28" rx="5" fill="#eaf7ee"/>
<text x="34" y="119" fill="#1d1d1f"><tspan fill="#248a3d" font-weight="700">후 </tspan>postgresql://macfolio:<tspan fill="#248a3d" font-weight="700">***</tspan>@db:5432/macfolio</text>

<rect x="24" y="154" width="592" height="28" rx="5" fill="#fff0ef"/>
<text x="34" y="173" fill="#1d1d1f"><tspan fill="#ff3b30" font-weight="700">전 </tspan>Authorization: Bearer <tspan fill="#ff3b30" font-weight="700">re_abc123</tspan></text>
<rect x="24" y="186" width="592" height="28" rx="5" fill="#eaf7ee"/>
<text x="34" y="205" fill="#1d1d1f"><tspan fill="#248a3d" font-weight="700">후 </tspan>Authorization: Bearer <tspan fill="#248a3d" font-weight="700">***</tspan></text>

<rect x="24" y="240" width="592" height="28" rx="5" fill="#fff0ef"/>
<text x="34" y="259" fill="#1d1d1f"><tspan fill="#ff3b30" font-weight="700">전 </tspan>macfolio_session=<tspan fill="#ff3b30" font-weight="700">abc</tspan>; code=<tspan fill="#ff3b30" font-weight="700">xyz</tspan>; statusCode=500</text>
<rect x="24" y="272" width="592" height="28" rx="5" fill="#eaf7ee"/>
<text x="34" y="291" fill="#1d1d1f"><tspan fill="#248a3d" font-weight="700">후 </tspan>macfolio_session=<tspan fill="#248a3d" font-weight="700">***</tspan>; code=<tspan fill="#248a3d" font-weight="700">***</tspan>; statusCode=500</text>

<rect x="24" y="326" width="592" height="28" rx="5" fill="#fff0ef"/>
<text x="34" y="345" fill="#1d1d1f"><tspan fill="#ff3b30" font-weight="700">전 </tspan>to=<tspan fill="#ff3b30" font-weight="700">minsu</tspan>@example.com</text>
<rect x="24" y="358" width="592" height="28" rx="5" fill="#eaf7ee"/>
<text x="34" y="377" fill="#1d1d1f"><tspan fill="#248a3d" font-weight="700">후 </tspan>to=<tspan fill="#248a3d" font-weight="700">m***</tspan>@example.com</text>
</g>
<text x="24" y="408" font-size="12" fill="#6e6e73">statusCode=500의 code= 바로 앞은 영문자 s라서 (?&lt;![\w-]) 조건에 맞지 않아 그대로 남는다.</text>
</svg>
