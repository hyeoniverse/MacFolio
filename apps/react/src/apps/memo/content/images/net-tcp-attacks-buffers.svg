<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  </defs>

  <!-- 송신 측 -->
  <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">TCP 클라이언트 응용</text>
  <line x1="150" y1="38" x2="150" y2="78" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="160" y="62" font-size="12" fill="#6e6e73">write(), send() 등</text>
  <text x="40" y="94" font-size="13" font-weight="600" fill="#1d1d1f">송신 버퍼</text>
  <line x1="30" y1="100" x2="270" y2="100" stroke="#6e6e73"/>
  <line x1="30" y1="136" x2="270" y2="136" stroke="#6e6e73"/>
  <rect x="66" y="100" width="168" height="36" fill="#f2f2f7" stroke="#6e6e73"/>
  <line x1="122" y1="96" x2="122" y2="140" stroke="#6e6e73" stroke-dasharray="4 3"/>
  <line x1="178" y1="96" x2="178" y2="140" stroke="#6e6e73" stroke-dasharray="4 3"/>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle"><text x="94" y="123">1</text><text x="150" y="123">2</text><text x="206" y="123">3</text></g>
  <line x1="150" y1="136" x2="150" y2="158" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="100" y="160" width="100" height="30" rx="5" fill="#fff" stroke="#1d1d1f"/>
  <text x="150" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">TCP</text>
  <line x1="150" y1="190" x2="150" y2="210" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="100" y="212" width="100" height="30" rx="5" fill="#fff" stroke="#1d1d1f"/>
  <text x="150" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">IP</text>
  <line x1="150" y1="242" x2="150" y2="262" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <g fill="#f2f2f7" stroke="#6e6e73">
    <rect x="70" y="266" width="36" height="24" rx="3"/><rect x="130" y="266" width="40" height="24" rx="3"/><rect x="194" y="266" width="36" height="24" rx="3"/>
  </g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle"><text x="88" y="283">3</text><text x="150" y="283">2</text><text x="212" y="283">1</text></g>

  <!-- 네트워크 선 -->
  <line x1="20" y1="300" x2="620" y2="300" stroke="#6e6e73"/>
  <line x1="60" y1="318" x2="240" y2="318" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="150" y="342" text-anchor="middle" font-size="13" fill="#1d1d1f">패킷 송신 순서</text>
  <line x1="400" y1="318" x2="580" y2="318" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="490" y="342" text-anchor="middle" font-size="13" fill="#1d1d1f">패킷 도착 순서</text>

  <!-- 인터넷 -->
  <path d="M276,302 a22,22 0 0 1 30,-26 a26,26 0 0 1 46,-6 a22,22 0 0 1 34,14 a18,18 0 0 1 -6,34 h-96 a16,16 0 0 1 -8,-16 z" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="326" y="306" text-anchor="middle" font-size="13" fill="#1d1d1f">인터넷</text>
  <line x1="278" y1="170" x2="362" y2="170" stroke="#1d1d1f" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="#6e6e73">순서가 바뀌어 도착</text>

  <!-- 수신 측 -->
  <text x="490" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">TCP 서버 응용</text>
  <line x1="490" y1="78" x2="490" y2="40" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="480" y="62" text-anchor="end" font-size="12" fill="#6e6e73">read(), recv() 등</text>
  <text x="600" y="94" text-anchor="end" font-size="13" font-weight="600" fill="#1d1d1f">수신 버퍼</text>
  <line x1="370" y1="100" x2="610" y2="100" stroke="#6e6e73"/>
  <line x1="370" y1="136" x2="610" y2="136" stroke="#6e6e73"/>
  <g fill="#f2f2f7" stroke="#6e6e73"><rect x="406" y="100" width="44" height="36"/><rect x="450" y="100" width="80" height="36"/><rect x="530" y="100" width="44" height="36"/></g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle"><text x="428" y="123">1</text><text x="490" y="123">2</text><text x="552" y="123">3</text></g>
  <text x="500" y="154" font-size="12" fill="#0a84ff">시퀀스 번호로 재정렬</text>
  <line x1="490" y1="160" x2="490" y2="139" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="440" y="160" width="100" height="30" rx="5" fill="#fff" stroke="#1d1d1f"/>
  <text x="490" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">TCP</text>
  <line x1="490" y1="262" x2="490" y2="244" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="440" y="212" width="100" height="30" rx="5" fill="#fff" stroke="#1d1d1f"/>
  <text x="490" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">IP</text>
  <line x1="490" y1="212" x2="490" y2="192" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <g fill="#f2f2f7" stroke="#6e6e73">
    <rect x="410" y="266" width="36" height="24" rx="3"/><rect x="472" y="266" width="36" height="24" rx="3"/><rect x="532" y="266" width="40" height="24" rx="3"/>
  </g>
  <g font-size="13" fill="#1d1d1f" text-anchor="middle"><text x="428" y="283">3</text><text x="490" y="283">1</text><text x="552" y="283">2</text></g>
</svg>
