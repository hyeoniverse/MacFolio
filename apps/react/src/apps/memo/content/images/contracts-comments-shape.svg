<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>요청·응답 모양이 한 곳(contracts)에서 서버와 화면으로</title>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
</defs>
<rect width="640" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="38" font-size="17" font-weight="700" fill="#1f2937">전: 같은 모양을 두 번 적는다</text>
<text x="352" y="38" font-size="17" font-weight="700" fill="#1f2937">후: 스키마 하나에서 둘 다</text>
<!-- before -->
<rect x="32" y="60" width="130" height="78" rx="10" fill="#fff1f2" stroke="#fda4af"/>
<text x="97" y="80" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">apps/api</text>
<text x="97" y="98" font-size="10" fill="#374151" text-anchor="middle">interface CommentView</text>
<text x="97" y="112" font-size="10" fill="#374151" text-anchor="middle">parseBody(): if·if·if</text>
<text x="97" y="126" font-size="10" fill="#374151" text-anchor="middle">'내용을 입력해주세요.'</text>
<rect x="182" y="60" width="130" height="78" rx="10" fill="#fff1f2" stroke="#fda4af"/>
<text x="247" y="80" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">apps/react</text>
<text x="247" y="98" font-size="10" fill="#374151" text-anchor="middle">interface Comment</text>
<text x="247" y="112" font-size="10" fill="#374151" text-anchor="middle">(손으로 다시 적음)</text>
<text x="247" y="126" font-size="10" fill="#374151" text-anchor="middle">interface Likes</text>
<path d="M162 99 H180" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#red)"/>
<path d="M182 112 H164" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#red)"/>
<text x="172" y="156" font-size="10.5" fill="#6b7280" text-anchor="middle">서버가 필드를 바꿔도 화면 타입은 모른다</text>
<text x="172" y="172" font-size="10.5" fill="#6b7280" text-anchor="middle">검증 규칙과 문구는 서버에만, 화면은 그대로 믿는다</text>
<!-- after -->
<rect x="400" y="60" width="170" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="485" y="82" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">packages/contracts</text>
<text x="485" y="100" font-size="10.5" fill="#374151" text-anchor="middle">CommentInput · Comment · Likes</text>
<text x="485" y="116" font-size="10" fill="#6b7280" text-anchor="middle">zod 스키마 + 한국어 문구</text>
<path d="M440 130 L400 176" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<path d="M530 130 L570 176" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="340" y="180" width="120" height="60" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="400" y="200" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">apps/api</text>
<text x="400" y="216" font-size="10" fill="#374151" text-anchor="middle">parse(CommentInput, body)</text>
<text x="400" y="230" font-size="10" fill="#374151" text-anchor="middle">→ 400 + 문구</text>
<rect x="510" y="180" width="120" height="60" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="570" y="200" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">apps/react</text>
<text x="570" y="216" font-size="10" fill="#374151" text-anchor="middle">import type { Comment }</text>
<text x="570" y="230" font-size="10" fill="#374151" text-anchor="middle">(타입만, 런타임 0 B)</text>
<text x="485" y="268" font-size="11" fill="#374151" text-anchor="middle">스키마를 고치면 서버 검증과 화면 타입이 한 번에 바뀐다</text>
<text x="485" y="286" font-size="10.5" fill="#6b7280" text-anchor="middle">dist는 서버가, src는 화면이 (desktop-core와 같은 방식)</text>
</svg>
