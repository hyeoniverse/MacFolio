<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>삭제된 코드 파일 주소가 HTML로 1년 동안 캐시되는 과정</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker></defs>
<rect width="640" height="400" fill="#ffffff"/>
<rect x="40" y="20" width="140" height="40" rx="8" fill="#f2f2f7"/>
<text x="110" y="45" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">브라우저</text>
<rect x="460" y="20" width="140" height="40" rx="8" fill="#f2f2f7"/>
<text x="530" y="45" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">사이트</text>
<line x1="110" y1="60" x2="110" y2="390" stroke="#c7c7cc" stroke-dasharray="4 4"/>
<line x1="530" y1="60" x2="530" y2="390" stroke="#c7c7cc" stroke-dasharray="4 4"/>
<text x="20" y="88" font-size="12" fill="#6e6e73">배포 전에 연 페이지는 옛 파일 이름을 알고 있다. 새 배포에서 그 파일은 삭제되었다</text>
<line x1="110" y1="114" x2="526" y2="114" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
<text x="318" y="106" font-size="12" fill="#1d1d1f" text-anchor="middle">GET /assets/Memo-옛해시.js (이미 없는 파일)</text>
<text x="20" y="150" font-size="13" font-weight="700" fill="#ff3b30">수정 전</text>
<line x1="530" y1="174" x2="114" y2="174" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
<text x="322" y="166" font-size="12" fill="#1d1d1f" text-anchor="middle">200 OK · 내용은 index.html</text>
<rect x="150" y="186" width="340" height="44" rx="6" fill="#fff1f0" stroke="#ff3b30"/>
<text x="320" y="204" font-size="12" fill="#1d1d1f" text-anchor="middle">Cache-Control: public, max-age=31536000, immutable</text>
<text x="320" y="221" font-size="12" fill="#ff3b30" text-anchor="middle">HTML이 이 JS 주소로 1년 동안 캐시되고, 재요청도 하지 않는다</text>
<text x="20" y="262" font-size="12" fill="#6e6e73">결과: 본문이 text/html이라 브라우저가 실행을 거부하고, 이 응답이 캐시에 고정된다</text>
<line x1="20" y1="282" x2="620" y2="282" stroke="#e5e5ea"/>
<text x="20" y="308" font-size="13" font-weight="700" fill="#34c759">수정 후 (#103)</text>
<line x1="530" y1="334" x2="114" y2="334" stroke="#34c759" stroke-width="1.5" marker-end="url(#g)"/>
<text x="322" y="326" font-size="12" fill="#1d1d1f" text-anchor="middle">404 Not Found (1년 캐시 헤더 없음)</text>
<text x="20" y="364" font-size="12" fill="#6e6e73">앱 주소(/memo/글)만 index.html을 반환하고, 없는 /assets/* 는 404를 반환한다.</text>
<text x="20" y="382" font-size="12" fill="#6e6e73">브라우저는 404를 저장하지 않으므로 다음 요청에서 올바른 파일을 내려받는다</text>
</svg>
