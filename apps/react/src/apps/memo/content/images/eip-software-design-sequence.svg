<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>순차 다이어그램</title><rect width="640" height="390" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">로그인 요청의 순차(시퀀스) 다이어그램</text><rect x="20" y="44" width="120" height="32" rx="4" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="80.0" y="64.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">:사용자</text><line x1="80" y1="76" x2="80" y2="350" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="180" y="44" width="120" height="32" rx="4" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="240.0" y="64.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">:로그인 화면</text><line x1="240" y1="76" x2="240" y2="350" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="340" y="44" width="120" height="32" rx="4" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="400.0" y="64.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">:인증 서비스</text><line x1="400" y1="76" x2="400" y2="350" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="500" y="44" width="120" height="32" rx="4" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="560.0" y="64.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">:회원 DB</text><line x1="560" y1="76" x2="560" y2="350" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="234" y="100" width="12" height="220" fill="#0a84ff"/><rect x="394" y="140" width="12" height="150" fill="#0a84ff"/><rect x="554" y="170" width="12" height="60" fill="#0a84ff"/><line x1="86" y1="100" x2="232" y2="100" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/><text x="160.0" y="93" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">1: 아이디·비밀번호 입력</text><line x1="246" y1="140" x2="392" y2="140" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/><text x="320.0" y="133" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">2: login(id, pw)</text><line x1="406" y1="170" x2="552" y2="170" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/><text x="480.0" y="163" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">3: 회원 조회</text><line x1="554" y1="230" x2="408" y2="230" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="480.0" y="223" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">4: 해시값 반환</text><line x1="394" y1="290" x2="248" y2="290" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="320.0" y="283" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">5: 인증 결과</text><line x1="234" y1="320" x2="88" y2="320" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="160.0" y="313" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">6: 메인 화면 표시</text><path d="M406 245 H446 V268 H408" fill="none" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/><text x="452" y="262" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">비밀번호 해시 비교</text><text x="320" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">세로 점선은 생명선, 파란 막대는 실행 중인 구간(활성 박스), 점선 화살표는 응답 메시지</text></svg>
