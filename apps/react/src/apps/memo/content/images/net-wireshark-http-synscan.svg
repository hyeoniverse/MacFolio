<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="340" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Open 스캔과 SYN 스캔 (포트 열림)</text>
  <text x="160" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a84ff">Open 스캔</text>
  <text x="90" y="80" text-anchor="middle" font-size="11" fill="#6e6e73">공격자</text>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#6e6e73">대상</text>
  <line x1="90" y1="86" x2="90" y2="300" stroke="#6e6e73" stroke-width="1.5"/>
  <line x1="250" y1="86" x2="250" y2="300" stroke="#6e6e73" stroke-width="1.5"/>
  <g font-size="11">
    <line x1="90" y1="110" x2="250" y2="130" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="170" y="116" text-anchor="middle" fill="#1d1d1f">SYN</text>
    <line x1="250" y1="150" x2="90" y2="170" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="170" y="156" text-anchor="middle" fill="#1d1d1f">SYN+ACK</text>
    <line x1="90" y1="190" x2="250" y2="210" stroke="#0a84ff" stroke-width="2" marker-end="url(#a)"/>
    <text x="170" y="196" text-anchor="middle" fill="#0a84ff">ACK</text>
  </g>
  <text x="170" y="250" text-anchor="middle" font-size="11" fill="#1d1d1f">핸드셰이크 완성</text>
  <text x="170" y="268" text-anchor="middle" font-size="11" fill="#ff9f0a">→ 연결 로그 남음</text>
  <line x1="320" y1="50" x2="320" y2="310" stroke="#e5e5ea"/>
  <text x="480" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#ff9f0a">SYN 스캔 (반개방, half-open)</text>
  <text x="410" y="80" text-anchor="middle" font-size="11" fill="#6e6e73">공격자</text>
  <text x="570" y="80" text-anchor="middle" font-size="11" fill="#6e6e73">대상</text>
  <line x1="410" y1="86" x2="410" y2="300" stroke="#6e6e73" stroke-width="1.5"/>
  <line x1="570" y1="86" x2="570" y2="300" stroke="#6e6e73" stroke-width="1.5"/>
  <g font-size="11">
    <line x1="410" y1="110" x2="570" y2="130" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="490" y="116" text-anchor="middle" fill="#1d1d1f">SYN</text>
    <line x1="570" y1="150" x2="410" y2="170" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="490" y="156" text-anchor="middle" fill="#1d1d1f">SYN+ACK</text>
    <line x1="410" y1="190" x2="570" y2="210" stroke="#ff9f0a" stroke-width="2" marker-end="url(#a)"/>
    <text x="490" y="196" text-anchor="middle" fill="#ff9f0a">RST</text>
  </g>
  <text x="490" y="250" text-anchor="middle" font-size="11" fill="#1d1d1f">핸드셰이크 미완성</text>
  <text x="490" y="268" text-anchor="middle" font-size="11" fill="#ff9f0a">→ 로그 남지 않음</text>
  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#6e6e73">포트가 닫혀 있으면 두 경우 모두 대상이 RST+ACK를 돌려준다.</text>
</svg>
