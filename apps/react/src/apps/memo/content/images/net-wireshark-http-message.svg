<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="420" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>
  </defs>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">HTTP 메시지의 각 부분과 그 부분을 가리키는 표시 필터</text>

  <!-- 요청 -->
  <text x="16" y="56" font-size="13" font-weight="700" fill="#1d1d1f">요청 (클라이언트 → 서버)</text>
  <rect x="16" y="64" width="330" height="28" fill="#fff" stroke="#0a84ff" stroke-width="2"/>
  <text x="26" y="83" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace"><tspan font-weight="700" fill="#0a84ff">GET</tspan> /file-view/avatar/id/1 HTTP/1.1</text>
  <rect x="16" y="92" width="330" height="28" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="26" y="111" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">Host: <tspan font-weight="700" fill="#0a84ff">www.example.com</tspan></text>
  <rect x="16" y="120" width="330" height="28" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="26" y="139" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">User-Agent: Mozilla/5.0 ...</text>
  <rect x="16" y="148" width="330" height="22" fill="#fff" stroke="#6e6e73" stroke-dasharray="3 3"/>
  <text x="26" y="164" font-size="12" fill="#6e6e73">빈 줄(CRLF): 헤더의 끝</text>

  <line x1="350" y1="78" x2="412" y2="78" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="418" y="83" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">http.request.method</text>
  <line x1="350" y1="106" x2="412" y2="106" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="418" y="111" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">http.host</text>
  <text x="418" y="139" font-size="12" fill="#6e6e73" font-family="Menlo, monospace">http.user_agent</text>

  <!-- 응답 -->
  <text x="16" y="212" font-size="13" font-weight="700" fill="#1d1d1f">응답 (서버 → 클라이언트)</text>
  <rect x="16" y="220" width="330" height="28" fill="#fff" stroke="#ff9f0a" stroke-width="2"/>
  <text x="26" y="239" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">HTTP/1.1 <tspan font-weight="700" fill="#c26a00">200</tspan> OK</text>
  <rect x="16" y="248" width="330" height="28" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="26" y="267" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">Content-Type: image/png</text>
  <rect x="16" y="276" width="330" height="28" fill="#f2f2f7" stroke="#6e6e73"/>
  <text x="26" y="295" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">Content-Length: <tspan font-weight="700" fill="#c26a00">805</tspan></text>
  <rect x="16" y="304" width="330" height="22" fill="#fff" stroke="#6e6e73" stroke-dasharray="3 3"/>
  <text x="26" y="320" font-size="12" fill="#6e6e73">빈 줄(CRLF): 헤더의 끝</text>
  <rect x="16" y="326" width="330" height="40" fill="#f2f2f7" stroke="#1d1d1f"/>
  <text x="26" y="350" font-size="12" fill="#1d1d1f">본문: PNG 이미지 805바이트</text>

  <line x1="350" y1="234" x2="412" y2="234" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="418" y="239" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">http.response.code</text>
  <text x="418" y="267" font-size="12" fill="#6e6e73" font-family="Menlo, monospace">http.content_type</text>
  <line x1="350" y1="290" x2="412" y2="290" stroke="#ff9f0a" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="418" y="295" font-size="12" fill="#1d1d1f" font-family="Menlo, monospace">http.content_length</text>

  <text x="16" y="398" font-size="12" fill="#1d1d1f">평문 HTTP(80번 포트)에서는 이 텍스트가 TCP 페이로드에 그대로 실려 Wireshark가 필드로 분해한다.</text>
</svg>
