<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>본문 형식에 따른 CORS 요청 비교: application/json은 OPTIONS 사전 요청이 먼저 필요하고, text/plain 문자열은 POST 한 번으로 전송된다. 서버는 EventBatch의 preprocess에서 문자열을 JSON.parse한다</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="640" height="360" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937">본문 형식에 따라 달라지는 CORS 요청 수</text>
<text x="32" y="56" font-size="11" fill="#6b7280">사이트와 API(macfolio-api.hyeoniverse.com)는 출처(origin)가 달라 CORS 규칙이 적용된다</text>

<!-- left: application/json -->
<rect x="32" y="74" width="280" height="200" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="48" y="98" font-size="13" font-weight="600" fill="#6b7280">사용하지 않은 방식</text>
<text x="48" y="116" font-size="11" fill="#374151">Content-Type: application/json</text>
<text x="56" y="146" font-size="11" fill="#374151">브라우저</text>
<text x="256" y="146" font-size="11" fill="#374151" text-anchor="end">API</text>
<path d="M60 160 H252" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<text x="156" y="174" font-size="10.5" fill="#6b7280" text-anchor="middle">① OPTIONS (사전 요청)</text>
<path d="M252 188 H60" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<text x="156" y="202" font-size="10.5" fill="#6b7280" text-anchor="middle">② 허용 헤더 응답</text>
<path d="M60 216 H252" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<text x="156" y="230" font-size="10.5" fill="#6b7280" text-anchor="middle">③ POST 본문 = JSON 객체</text>
<text x="48" y="258" font-size="10.5" fill="#6b7280">왕복 2회: 사전 요청이 성공해야 본문을 전송한다</text>

<!-- right: text/plain -->
<rect x="328" y="74" width="280" height="200" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="344" y="98" font-size="13" font-weight="600" fill="#4f46e5">사용한 방식: sendBeacon(url, 문자열)</text>
<text x="344" y="116" font-size="11" fill="#374151">Content-Type: text/plain;charset=UTF-8</text>
<text x="352" y="146" font-size="11" fill="#374151">브라우저</text>
<text x="552" y="146" font-size="11" fill="#374151" text-anchor="end">API</text>
<path d="M356 160 H548" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
<text x="452" y="174" font-size="10.5" fill="#374151" text-anchor="middle">① POST 본문 = JSON 문자열</text>
<text x="344" y="210" font-size="10.5" fill="#374151">text/plain은 CORS 안전 목록에 있는 형식이라</text>
<text x="344" y="226" font-size="10.5" fill="#374151">사전 요청 없이 바로 전송된다</text>
<text x="344" y="258" font-size="10.5" fill="#4f46e5">요청 1회</text>

<!-- server side -->
<rect x="32" y="290" width="576" height="54" rx="10" fill="#f3f4f6"/>
<text x="48" y="311" font-size="11" font-weight="600" fill="#1f2937">서버: contracts의 EventBatch</text>
<text x="48" y="330" font-size="10.5" fill="#374151">z.preprocess에서 본문이 문자열이면 JSON.parse, 객체면 그대로 → { visitId, events[1..30] } 검증</text>
</svg>
