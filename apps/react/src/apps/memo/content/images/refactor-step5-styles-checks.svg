<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>5단계 PR을 세 갈래로 나눠, 토큰은 계산된 스타일, 파일 나누기는 빌드 CSS 해시, 중복 지우기는 요소마다 계산된 스타일을 네 조합에서 비교했다</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="840" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">"값은 그대로"를 확인한 세 가지 방법</text>
<rect x="32" y="62" width="244" height="54" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="154.0" y="85.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">이름 붙이기</text>
<text x="154.0" y="100.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">#231 #232 #234 · 그림자·간격·색</text>
<rect x="32" y="128" width="244" height="110" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="154" y="154" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">var()는 계산된 값에서</text>
<text x="154" y="174" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">원래 숫자로 풀린다</text>
<text x="154" y="194" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">→ 여러 앱 화면의 모든 요소</text>
<text x="154" y="214" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">계산된 스타일 전후 비교</text>
<rect x="300" y="62" width="244" height="54" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="422.0" y="85.5" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">파일 나누기</text>
<text x="422.0" y="100.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">#238 Memo.css → 열다섯 파일</text>
<rect x="300" y="128" width="244" height="110" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
<text x="422" y="154" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">주석은 빌드에서 빠진다</text>
<text x="422" y="174" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">→ 나누기 전후 빌드 CSS의</text>
<text x="422" y="194" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">md5 해시 비교</text>
<text x="422" y="214" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">(파일 이름 해시도 같음)</text>
<rect x="568" y="62" width="244" height="54" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="690.0" y="85.5" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">중복 지우기</text>
<text x="690.0" y="100.5" font-size="10.5" font-weight="400" fill="#374151" text-anchor="middle">#241 두 파일에 같은 규칙 103개</text>
<rect x="568" y="128" width="244" height="110" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
<text x="690" y="154" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">지운 규칙이 이기던 곳이</text>
<text x="690" y="174" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">있었는지 보려면</text>
<text x="690" y="194" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">→ 라이트·다크 × 데스크톱·휴대폰</text>
<text x="690" y="214" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">요소마다 계산된 스타일 비교</text>
<text x="32" y="272" font-size="10.5" font-weight="500" fill="#374151" text-anchor="start">세 방법 모두 "다르면 실패"인 기계 비교다. 화면을 눈으로 훑어 같다고 판단한 PR은 없다.</text>
</svg>
