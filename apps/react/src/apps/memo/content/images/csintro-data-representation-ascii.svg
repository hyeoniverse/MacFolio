<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>ASCII 7비트: 상위 3비트(열)와 하위 4비트(행)</title><rect width="640" height="340" fill="#fff"/><text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">ASCII 7비트: 상위 3비트(열)와 하위 4비트(행)</text>
<rect x="30" y="60" width="70" height="200" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="65" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">000</text><text x="65" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">0~15</text><text x="65" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">제어 문자</text>
<rect x="104" y="60" width="70" height="200" rx="6" fill="#f2f2f7" stroke="#6e6e73"/><text x="139" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">001</text><text x="139" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">16~31</text><text x="139" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">제어 문자</text>
<rect x="178" y="60" width="70" height="200" rx="6" fill="#fff4e5" stroke="#6e6e73"/><text x="213" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">010</text><text x="213" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">32~47</text><text x="213" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">공백·기호</text>
<rect x="252" y="60" width="70" height="200" rx="6" fill="#e8f8ec" stroke="#6e6e73"/><text x="287" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">011</text><text x="287" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">48~63</text><text x="287" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">숫자 0~9</text>
<text x="287" y="200" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0a84ff">5</text><text x="287" y="220" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0a84ff">0110101</text>
<rect x="326" y="60" width="70" height="200" rx="6" fill="#e5f1ff" stroke="#6e6e73"/><text x="361" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">100</text><text x="361" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">64~79</text><text x="361" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">@ A~O</text>
<text x="361" y="200" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0a84ff">A</text><text x="361" y="220" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0a84ff">1000001</text>
<rect x="400" y="60" width="70" height="200" rx="6" fill="#e5f1ff" stroke="#6e6e73"/><text x="435" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">101</text><text x="435" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">80~95</text><text x="435" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">P~Z</text>
<rect x="474" y="60" width="70" height="200" rx="6" fill="#e5f1ff" stroke="#6e6e73"/><text x="509" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">110</text><text x="509" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">96~111</text><text x="509" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">` a~o</text>
<text x="509" y="200" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0a84ff">a</text><text x="509" y="220" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0a84ff">1100001</text>
<rect x="548" y="60" width="70" height="200" rx="6" fill="#e5f1ff" stroke="#6e6e73"/><text x="583" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#1d1d1f">111</text><text x="583" y="104" text-anchor="middle" font-size="12" fill="#6e6e73">112~127</text><text x="583" y="160" text-anchor="middle" font-size="12" fill="#1d1d1f">p~z DEL</text>
<text x="320" y="290" text-anchor="middle" font-size="13" fill="#1d1d1f">대문자 A(100 0001)와 소문자 a(110 0001)는 0x20 비트 하나만 다르다</text><text x="320" y="315" text-anchor="middle" font-size="12" fill="#6e6e73">숫자 열(011)에서 하위 4비트는 숫자 값 그대로다</text></svg>
