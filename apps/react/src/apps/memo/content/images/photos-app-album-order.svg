<rect width="640" height="452" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#1d1d1f" text-anchor="start" font-weight="700">프로젝트 정보를 순회해 앨범을 만드는 순서 (가상의 프로젝트 예)</text>
<text x="20" y="50" font-size="12" fill="#6e6e73" text-anchor="start">페이지를 읽는 순서대로 그림을 모으고, 중복·소리 파일은 제외한다</text>
