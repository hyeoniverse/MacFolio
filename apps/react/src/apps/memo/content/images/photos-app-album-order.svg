<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 452" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>프로젝트 정보에서 앨범을 만드는 순서</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
