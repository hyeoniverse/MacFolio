<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" viewBox="0 0 640 300"><title>시스템에 접속하는 사용자가 거치는 순서로 본 시스템 보안 6개 관리 항목</title><rect width="640" height="300" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker></defs>
<g font-size="13" fill="#1d1d1f" text-anchor="middle">
<rect x="10" y="60" width="80" height="50" rx="6" fill="#1d1d1f"/><text x="50" y="90" fill="#fff">사용자</text>
<rect x="115" y="50" width="110" height="70" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="170" y="75" font-weight="600">접근 제어</text><text x="170" y="95" font-size="12" fill="#6e6e73">어디에서</text><text x="170" y="110" font-size="12" fill="#6e6e73">들어오는가</text>
<rect x="250" y="50" width="110" height="70" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="305" y="75" font-weight="600">계정 관리</text><text x="305" y="95" font-size="12" fill="#6e6e73">누구인가</text><text x="305" y="110" font-size="12" fill="#6e6e73">(인증)</text>
<rect x="385" y="50" width="110" height="70" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="440" y="75" font-weight="600">세션 관리</text><text x="440" y="95" font-size="12" fill="#6e6e73">계속 그 사람이</text><text x="440" y="110" font-size="12" fill="#6e6e73">쓰고 있는가</text>
<rect x="520" y="50" width="110" height="70" rx="6" fill="#f2f2f7" stroke="#0a84ff"/><text x="575" y="75" font-weight="600">권한 관리</text><text x="575" y="95" font-size="12" fill="#6e6e73">무엇을</text><text x="575" y="110" font-size="12" fill="#6e6e73">할 수 있는가</text>
<line x1="92" y1="85" x2="112" y2="85" stroke="#6e6e73" marker-end="url(#a)"/><line x1="227" y1="85" x2="247" y2="85" stroke="#6e6e73" marker-end="url(#a)"/><line x1="362" y1="85" x2="382" y2="85" stroke="#6e6e73" marker-end="url(#a)"/><line x1="497" y1="85" x2="517" y2="85" stroke="#6e6e73" marker-end="url(#a)"/>
<rect x="115" y="160" width="515" height="50" rx="6" fill="#ff9f0a"/><text x="372" y="182" fill="#fff" font-weight="600">로그 관리</text><text x="372" y="200" font-size="12" fill="#fff">위의 모든 단계에서 누가 언제 무엇을 했는지 기록</text>
<rect x="115" y="230" width="515" height="50" rx="6" fill="#34c759"/><text x="372" y="252" fill="#fff" font-weight="600">취약점 관리</text><text x="372" y="270" font-size="12" fill="#fff">시스템 자체의 결함을 패치해 위 통제를 우회하지 못하게 함</text>
<text x="50" y="140" font-size="12" fill="#6e6e73">공격자도</text><text x="50" y="156" font-size="12" fill="#6e6e73">같은 길로</text>
</g></svg>
