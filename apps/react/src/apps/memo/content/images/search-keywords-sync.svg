<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>Search Console 동기화 구간. 첫 실행은 어제부터 480일 전까지를 가져온다. 이후 실행은 저장된 마지막 날짜의 7일 전부터 어제까지를 하나의 트랜잭션에서 삭제한 뒤 다시 저장한다. 서버 시작 1분 뒤 첫 실행, 이후 6시간마다 실행한다</title>
<defs>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
</defs>
<rect width="860" height="380" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">Search Console 동기화 구간 (SearchQueryStat)</text>
<text x="32" y="56" font-size="11" fill="#6b7280">서버 시작 1분 뒤 첫 실행, 이후 6시간마다 실행. 오늘 자료는 받지 않고 어제까지만 받는다</text>

<line x1="60" y1="300" x2="800" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a-gray)"/>
<text x="806" y="304" font-size="11" fill="#374151">날짜</text>
<line x1="80" y1="294" x2="80" y2="306" stroke="#374151"/>
<text x="80" y="324" font-size="10.5" fill="#374151" text-anchor="middle">어제 − 480일</text>
<line x1="560" y1="294" x2="560" y2="306" stroke="#374151"/>
<text x="560" y="324" font-size="10.5" fill="#374151" text-anchor="middle">마지막 저장일 − 7일</text>
<line x1="680" y1="294" x2="680" y2="306" stroke="#374151"/>
<text x="680" y="324" font-size="10.5" fill="#374151" text-anchor="middle">마지막 저장일</text>
<line x1="740" y1="294" x2="740" y2="306" stroke="#374151"/>
<text x="740" y="342" font-size="10.5" fill="#374151" text-anchor="middle">어제</text>
<line x1="740" y1="306" x2="740" y2="330" stroke="#d1d5db" stroke-dasharray="3 3"/>

<text x="32" y="96" font-size="11.5" fill="#4f46e5" font-weight="700">① 첫 실행 (저장된 행이 없음)</text>
<rect x="80" y="108" width="660" height="44" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="410" y="128" font-size="12" fill="#4f46e5" font-weight="600" text-anchor="middle">480일(약 16개월) 전체를 가져온다</text>
<text x="410" y="144" font-size="10.5" fill="#374151" text-anchor="middle">25,000행 단위로 요청하고, 응답이 25,000행이면 startRow를 늘려 다음 페이지를 요청</text>

<text x="32" y="190" font-size="11.5" fill="#15803d" font-weight="700">② 이후 실행</text>
<rect x="80" y="202" width="480" height="44" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="320" y="222" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">기존 행 유지</text>
<text x="320" y="238" font-size="10.5" fill="#6b7280" text-anchor="middle">확정된 자료라 다시 받지 않는다</text>
<rect x="560" y="202" width="180" height="44" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="650" y="222" font-size="12" fill="#15803d" font-weight="600" text-anchor="middle">삭제 후 다시 저장</text>
<text x="650" y="238" font-size="10.5" fill="#374151" text-anchor="middle">한 트랜잭션 · dataState: all</text>

<text x="32" y="276" font-size="10.5" fill="#6b7280">가져오기에 실패하면 트랜잭션이 실행되지 않아 기존 행은 그대로 남고, 실패 이유만 화면에 표시한다</text>
</svg>
