<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>아키텍처 패턴</title><rect width="640" height="430" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">자주 출제되는 아키텍처 패턴 네 가지</text><text x="160" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">계층 (Layered)</text><rect x="70" y="62" width="180" height="28" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="160.0" y="80.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">프레젠테이션</text><rect x="70" y="96" width="180" height="28" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="160.0" y="114.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">비즈니스 로직</text><rect x="70" y="130" width="180" height="28" rx="8" fill="#e8f2ff" stroke="none" stroke-width="1.5"/><text x="160.0" y="148.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">데이터 접근</text><rect x="70" y="164" width="180" height="28" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="160.0" y="182.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1d1d1f">데이터베이스</text><text x="160" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">바로 아래 계층의 서비스만 호출</text><text x="480" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">클라이언트-서버</text><rect x="430" y="92" width="100" height="50" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="480.0" y="121.7" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">서버</text><rect x="350" y="166" width="80" height="30" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="390.0" y="185.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">클라이언트</text><line x1="390" y1="166" x2="480" y2="142" stroke="#6e6e73" stroke-width="1.5"/><rect x="450" y="166" width="80" height="30" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="490.0" y="185.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">클라이언트</text><line x1="490" y1="166" x2="480" y2="142" stroke="#6e6e73" stroke-width="1.5"/><rect x="550" y="166" width="80" height="30" rx="8" fill="#f2f2f7" stroke="none" stroke-width="1.5"/><text x="590.0" y="185.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1d1d1f">클라이언트</text><line x1="590" y1="166" x2="480" y2="142" stroke="#6e6e73" stroke-width="1.5"/><text x="480" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">요청은 클라이언트, 응답은 서버</text><line x1="20" y1="232" x2="620" y2="232" stroke="#f2f2f7" stroke-width="2"/><line x1="320" y1="40" x2="320" y2="420" stroke="#f2f2f7" stroke-width="2"/><text x="160" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">파이프-필터 (Pipe-Filter)</text><rect x="16" y="290" width="60" height="36" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="46.0" y="312.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">읽기</text><line x1="76" y1="308" x2="90" y2="308" stroke="#ff9f0a" stroke-width="2" marker-end="url(#a)"/><rect x="92" y="290" width="60" height="36" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="122.0" y="312.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">정제</text><line x1="152" y1="308" x2="166" y2="308" stroke="#ff9f0a" stroke-width="2" marker-end="url(#a)"/><rect x="168" y="290" width="60" height="36" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="198.0" y="312.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">변환</text><line x1="228" y1="308" x2="242" y2="308" stroke="#ff9f0a" stroke-width="2" marker-end="url(#a)"/><rect x="244" y="290" width="60" height="36" rx="8" fill="#fff4e5" stroke="none" stroke-width="1.5"/><text x="274.0" y="312.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">저장</text><text x="160" y="350" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">필터: 데이터를 처리하는 단계</text><text x="160" y="368" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">파이프: 필터 사이의 데이터 통로</text><text x="160" y="386" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">예: UNIX 셸의 cat a | grep x | sort</text><text x="480" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">모델-뷰-컨트롤러 (MVC)</text><rect x="420" y="276" width="120" height="32" rx="8" fill="#30d158" stroke="none" stroke-width="1.5"/><text x="480.0" y="296.3" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">컨트롤러</text><rect x="350" y="350" width="110" height="32" rx="8" fill="#0a84ff" stroke="none" stroke-width="1.5"/><text x="405.0" y="370.3" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">모델</text><rect x="500" y="350" width="110" height="32" rx="8" fill="#ff9f0a" stroke="none" stroke-width="1.5"/><text x="555.0" y="370.3" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">뷰</text><line x1="450" y1="308" x2="415" y2="346" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="400" y="330" text-anchor="end" font-size="11" font-weight="400" fill="#6e6e73">갱신</text><line x1="510" y1="308" x2="545" y2="346" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="562" y="330" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">뷰 선택</text><line x1="462" y1="366" x2="496" y2="366" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><text x="480" y="398" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">모델 변경을 뷰에 반영</text><text x="480" y="416" text-anchor="middle" font-size="11" font-weight="400" fill="#6e6e73">입력 처리·데이터·화면 표시를 분리</text></svg>
