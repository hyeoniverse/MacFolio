<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>시계 숫자 배치: rotate → translateY → 반대 rotate</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0369a1"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker></defs>
<rect width="860" height="380" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">시계 숫자 배치: rotate → translateY → 반대 rotate</text>
<text x="32" y="56" font-size="11" fill="#6b7280">12·3·6·9 네 숫자. θ = 숫자 × 30°, r = 판 중심에서 숫자까지 거리</text>
<circle cx="220" cy="200" r="96" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="220" cy="200" r="3" fill="#374151"/>
<text x="220.0" y="126.0" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" transform="rotate(360 220.0 126.0)">12</text>
<text x="294.0" y="200.0" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" transform="rotate(90 294.0 200.0)">3</text>
<text x="220.0" y="274.0" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" transform="rotate(180 220.0 274.0)">6</text>
<text x="146.0" y="200.0" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" transform="rotate(270 146.0 200.0)">9</text>
<text x="220" y="328" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="middle">rotate(θ) translateY(-r)만 적용: 글자도 회전</text>
<circle cx="640" cy="200" r="96" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="640" cy="200" r="3" fill="#374151"/>
<text x="640.0" y="126.0" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle" dominant-baseline="central" transform="rotate(0 640.0 126.0)">12</text>
<text x="714.0" y="200.0" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle" dominant-baseline="central" transform="rotate(0 714.0 200.0)">3</text>
<text x="640.0" y="274.0" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle" dominant-baseline="central" transform="rotate(0 640.0 274.0)">6</text>
<text x="566.0" y="200.0" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle" dominant-baseline="central" transform="rotate(0 566.0 200.0)">9</text>
<text x="640" y="328" font-size="12" fill="#15803d" font-weight="700" text-anchor="middle">rotate(θ) translateY(-r) rotate(-θ): 글자가 바로 선다</text>
<text x="220" y="98" font-size="11" fill="#6b7280" text-anchor="middle">6이 거꾸로, 3·9가 옆으로 눕는다</text>
<text x="640" y="98" font-size="11" fill="#6b7280" text-anchor="middle">r = 시계 판 폭의 38% (-38cqw)</text>
</svg>
