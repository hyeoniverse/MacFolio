<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>관리자가 Finder 프로젝트 폴더에 PDF를 넣으면 프로젝트 페이지에 발표 자료 보기 버튼이 생기고 미리보기에서 슬라이드쇼로 연다</title><defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="760" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">프로젝트 폴더의 PDF가 발표 화면이 되기까지</text>
<rect x="32" y="64" width="124" height="80" rx="10" fill="#f3f4f6"/>
<text x="94.0" y="94.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Finder</text>
<text x="94.0" y="112.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">프로젝트 › MacFolio</text>
<text x="94.0" y="126.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">PDF를 끌어다 놓기</text>
<rect x="176" y="64" width="124" height="80" rx="10" fill="#f3f4f6"/>
<text x="238.0" y="94.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">서버 파일</text>
<text x="238.0" y="112.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">폴더 project:&lt;id&gt;</text>
<text x="238.0" y="126.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">R2 projects/&lt;id&gt;/…</text>
<path d="M156 104 H174" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="320" y="64" width="124" height="80" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="382.0" y="94.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">프로젝트 페이지</text>
<text x="382.0" y="112.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">PDF가 있으면</text>
<text x="382.0" y="126.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">"발표 자료 보기"</text>
<path d="M300 104 H318" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="464" y="64" width="124" height="80" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="526.0" y="94.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">미리보기</text>
<text x="526.0" y="112.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">이름순 첫 PDF</text>
<text x="526.0" y="126.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">맨 앞으로 열기</text>
<path d="M444 104 H462" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<rect x="608" y="64" width="124" height="80" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="670.0" y="94.0" font-size="12" font-weight="600" fill="#4f46e5" text-anchor="middle">슬라이드쇼</text>
<text x="670.0" y="112.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">⇧⌘F</text>
<text x="670.0" y="126.0" font-size="9.5" font-weight="400" fill="#374151" text-anchor="middle">검은 화면, 한 쪽씩</text>
<path d="M588 104 H606" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#ok)"/>
<text x="32" y="182" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">슬라이드쇼 키 (창 전체에서 capture로 먼저 받는다)</text>
<rect x="32" y="196" width="230" height="30" rx="10" fill="#f3f4f6"/>
<text x="147.0" y="213.75" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">→ ↓ 스페이스 PageDown · 화면 누르기</text>
<text x="272" y="215" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="start">다음</text>
<rect x="392" y="196" width="230" height="30" rx="10" fill="#f3f4f6"/>
<text x="507.0" y="213.75" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">← ↑ PageUp</text>
<text x="632" y="215" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="start">이전</text>
<rect x="32" y="236" width="230" height="30" rx="10" fill="#f3f4f6"/>
<text x="147.0" y="253.75" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">Home · End</text>
<text x="272" y="255" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="start">처음 · 끝</text>
<rect x="392" y="236" width="230" height="30" rx="10" fill="#f3f4f6"/>
<text x="507.0" y="253.75" font-size="10" font-weight="400" fill="#374151" text-anchor="middle">Esc</text>
<text x="632" y="255" font-size="10.5" font-weight="500" fill="#4f46e5" text-anchor="start">끝내고 그 쪽으로 스크롤</text>
<text x="32" y="286" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">휴대폰에는 창이 없어 PDF를 새 탭으로 연다. 파일을 지우면 버튼도 사라진다 (따로 저장한 필드가 없다).</text>
</svg>
