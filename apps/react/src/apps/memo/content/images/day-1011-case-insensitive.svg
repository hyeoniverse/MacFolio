<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>대소문자를 구분하지 않는 파일 시스템에서 import가 다른 파일로 해석되는 과정</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1d1d1f">import './Slides' 가 가리키는 파일</text>
<rect x="20" y="48" width="600" height="36" rx="8" fill="#f2f2f7"/>
<text x="36" y="71" font-size="12" fill="#1d1d1f">같은 폴더: Slides.tsx (컴포넌트), slides.ts (슬라이드 목록) · 모듈 해석은 .ts를 .tsx보다 먼저 시도</text>
<rect x="20" y="104" width="290" height="180" rx="10" fill="#effaf2" stroke="#34c759"/>
<text x="36" y="130" font-size="13" font-weight="700" fill="#1f7a3a">Linux CI (ext4, 대소문자 구분)</text>
<text x="36" y="158" font-size="12" fill="#1d1d1f">1. ./Slides.ts 있는가? → 없음</text>
<text x="36" y="180" font-size="12" fill="#6e6e73">   (slides.ts와 다른 이름)</text>
<text x="36" y="202" font-size="12" fill="#1d1d1f">2. ./Slides.tsx 있는가? → 있음</text>
<text x="36" y="240" font-size="13" font-weight="600" fill="#1f7a3a">컴포넌트를 불러옴 → 통과</text>
<rect x="330" y="104" width="290" height="180" rx="10" fill="#fff1f0" stroke="#ff3b30"/>
<text x="346" y="130" font-size="13" font-weight="700" fill="#ff3b30">macOS (APFS 기본값, 구분 안 함)</text>
<text x="346" y="158" font-size="12" fill="#1d1d1f">1. ./Slides.ts 있는가?</text>
<text x="346" y="180" font-size="12" fill="#1d1d1f">   → slides.ts와 같은 이름으로 판단</text>
<text x="346" y="202" font-size="12" fill="#1d1d1f">   → 있음</text>
<text x="346" y="240" font-size="13" font-weight="600" fill="#ff3b30">목록 파일을 불러옴 → 타입 검사·빌드 실패</text>
<text x="346" y="262" font-size="12" fill="#6e6e73">수정: slides.ts → slideDeck.ts (#197)</text>
</svg>
