<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>"창이 있다"와 "실행 중이다"를 나눴다</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker></defs>
  <rect width="800" height="320" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">"창이 있다"와 "실행 중이다"를 나눴다</text>
  <text x="32" y="68" font-size="12" fill="#6b7280">Dock의 점은 isAppRunning 하나만 본다</text>
  <rect x="32" y="100" width="200" height="46" rx="8" fill="#f3f4f6"/>
  <text x="132.0" y="118.7" font-size="12" text-anchor="middle" fill="#374151" font-weight="600">Finder</text>
  <text x="132.0" y="135.7" font-size="11" text-anchor="middle" fill="#374151">끌 수 없는 앱</text>
  <rect x="32" y="156" width="200" height="46" rx="8" fill="#f3f4f6"/>
  <text x="132.0" y="174.7" font-size="12" text-anchor="middle" fill="#374151" font-weight="600">창이 있다</text>
  <text x="132.0" y="191.7" font-size="11" text-anchor="middle" fill="#374151">isRunning (창 store)</text>
  <rect x="32" y="212" width="200" height="46" rx="8" fill="#eef0ff"/>
  <text x="132.0" y="230.7" font-size="12" text-anchor="middle" fill="#3f46c7" font-weight="600">창 없이 실행 중</text>
  <text x="132.0" y="247.7" font-size="11" text-anchor="middle" fill="#3f46c7">alive ← keepAlive(name, on)</text>
  <line x1="234" y1="123" x2="320" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="234" y1="179" x2="320" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="234" y1="235" x2="320" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="324" y="150" width="160" height="58" rx="8" fill="#dcfce7"/>
  <text x="404.0" y="174.6" font-size="13" text-anchor="middle" fill="#15803d" font-weight="600">isAppRunning</text>
  <text x="404.0" y="192.6" font-size="12" text-anchor="middle" fill="#15803d">= 셋 중 하나</text>
  <line x1="486" y1="179" x2="540" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="544" y="156" width="110" height="46" rx="8" fill="#dcfce7"/>
  <text x="599.0" y="183.6" font-size="13" text-anchor="middle" fill="#15803d">Dock 점</text>
  <rect x="500" y="232" width="268" height="60" rx="8" fill="#fef3c7"/>
  <text x="634.0" y="249.8" font-size="11" text-anchor="middle" fill="#b45309">음악: audio의 playing 이벤트에서 켬</text>
  <text x="634.0" y="265.9" font-size="11" text-anchor="middle" fill="#b45309">자동 재생이 막히면 켜지지 않음</text>
  <text x="634.0" y="281.9" font-size="11" text-anchor="middle" fill="#b45309">닫기·종료 → 끔, 최소화 → 그대로</text>
  <line x1="500" y1="262" x2="236" y2="240" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>
</svg>
