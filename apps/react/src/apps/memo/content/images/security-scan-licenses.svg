<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>운영 의존성 717개의 라이선스 막대: MIT 598, ISC 50, Apache-2.0 43, BSD-3-Clause 13, 그 밖의 허용형 8, 확인이 필요한 것 5. GPL 계열은 없다</title><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
<marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
<marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
</defs>
<rect width="780" height="300" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">운영 의존성 717개의 라이선스 (pnpm licenses list --prod)</text>
<text x="202" y="77" font-size="11" font-weight="500" fill="#374151" text-anchor="end">MIT</text>
<rect x="212" y="62" width="418.6" height="20" rx="3" fill="#a5b4fc"/>
<text x="638.6" y="77" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">598개</text>
<text x="202" y="109" font-size="11" font-weight="500" fill="#374151" text-anchor="end">ISC</text>
<rect x="212" y="94" width="35.0" height="20" rx="3" fill="#a5b4fc"/>
<text x="255.0" y="109" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">50개</text>
<text x="202" y="141" font-size="11" font-weight="500" fill="#374151" text-anchor="end">Apache-2.0</text>
<rect x="212" y="126" width="30.1" height="20" rx="3" fill="#a5b4fc"/>
<text x="250.1" y="141" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">43개</text>
<text x="202" y="173" font-size="11" font-weight="500" fill="#374151" text-anchor="end">BSD-3-Clause</text>
<rect x="212" y="158" width="9.1" height="20" rx="3" fill="#a5b4fc"/>
<text x="229.1" y="173" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">13개</text>
<text x="202" y="205" font-size="11" font-weight="500" fill="#374151" text-anchor="end">그 밖의 허용형</text>
<rect x="212" y="190" width="5.6" height="20" rx="3" fill="#a5b4fc"/>
<text x="225.6" y="205" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">8개</text>
<text x="202" y="237" font-size="11" font-weight="500" fill="#374151" text-anchor="end">확인이 필요한 것</text>
<rect x="212" y="222" width="3.5" height="20" rx="3" fill="#fcd34d"/>
<text x="223.5" y="237" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">5개</text>
<text x="32" y="268" font-size="10" font-weight="400" fill="#374151" text-anchor="start">확인이 필요한 다섯: dompurify(MPL-2.0 OR Apache-2.0), elkjs(EPL-2.0), argparse(Python-2.0), Font Awesome(CC-BY·OFL·MIT), khroma(Unknown → 저장소는 MIT)</text>
<text x="32" y="286" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start">GPL·AGPL·LGPL은 운영 의존성에 없다.</text>
</svg>
