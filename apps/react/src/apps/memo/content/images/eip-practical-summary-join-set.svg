<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>조인과 집합 연산의 결과 행 수</title><rect width="640" height="416" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">A의 값 {1, 2, 3}, B의 값 {2, 3, 4}일 때 결과에 남는 값</text>
<g font-size="13" font-weight="600" fill="#6e6e73"><text x="40" y="62">연산 (A 연산 B)</text><text x="250" y="54" text-anchor="middle" fill="#1d1d1f">1</text><text x="250" y="70" text-anchor="middle" font-size="12" font-weight="400">A만</text><text x="330" y="54" text-anchor="middle" fill="#1d1d1f">2</text><text x="330" y="70" text-anchor="middle" font-size="12" font-weight="400">A·B</text><text x="410" y="54" text-anchor="middle" fill="#1d1d1f">3</text><text x="410" y="70" text-anchor="middle" font-size="12" font-weight="400">A·B</text><text x="490" y="54" text-anchor="middle" fill="#1d1d1f">4</text><text x="490" y="70" text-anchor="middle" font-size="12" font-weight="400">B만</text><text x="580" y="62" text-anchor="middle">행 수</text></g>
<g font-size="13">
<text x="40" y="104" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">INNER JOIN</text><rect x="220" y="86" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><rect x="300" y="86" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="330" y="104" text-anchor="middle" font-size="12" fill="#1d1d1f">2 · 2</text><rect x="380" y="86" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="410" y="104" text-anchor="middle" font-size="12" fill="#1d1d1f">3 · 3</text><rect x="460" y="86" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><text x="580" y="104" text-anchor="middle" fill="#0a84ff" font-weight="600">2행</text>
<text x="40" y="140" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">LEFT JOIN</text><rect x="220" y="122" width="60" height="26" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="250" y="140" text-anchor="middle" font-size="12" fill="#1d1d1f">1 · NULL</text><rect x="300" y="122" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="330" y="140" text-anchor="middle" font-size="12" fill="#1d1d1f">2 · 2</text><rect x="380" y="122" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="410" y="140" text-anchor="middle" font-size="12" fill="#1d1d1f">3 · 3</text><rect x="460" y="122" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><text x="580" y="140" text-anchor="middle" fill="#0a84ff" font-weight="600">3행</text>
<text x="40" y="176" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">RIGHT JOIN</text><rect x="220" y="158" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><rect x="300" y="158" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="330" y="176" text-anchor="middle" font-size="12" fill="#1d1d1f">2 · 2</text><rect x="380" y="158" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="410" y="176" text-anchor="middle" font-size="12" fill="#1d1d1f">3 · 3</text><rect x="460" y="158" width="60" height="26" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="490" y="176" text-anchor="middle" font-size="12" fill="#1d1d1f">NULL · 4</text><text x="580" y="176" text-anchor="middle" fill="#0a84ff" font-weight="600">3행</text>
<text x="40" y="212" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">FULL JOIN</text><rect x="220" y="194" width="60" height="26" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="250" y="212" text-anchor="middle" font-size="12" fill="#1d1d1f">1 · NULL</text><rect x="300" y="194" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="330" y="212" text-anchor="middle" font-size="12" fill="#1d1d1f">2 · 2</text><rect x="380" y="194" width="60" height="26" rx="6" fill="#e8f2ff" stroke="#0a84ff"/><text x="410" y="212" text-anchor="middle" font-size="12" fill="#1d1d1f">3 · 3</text><rect x="460" y="194" width="60" height="26" rx="6" fill="#fff4e5" stroke="#ff9f0a"/><text x="490" y="212" text-anchor="middle" font-size="12" fill="#1d1d1f">NULL · 4</text><text x="580" y="212" text-anchor="middle" fill="#0a84ff" font-weight="600">4행</text>
<line x1="20" y1="229" x2="620" y2="229" stroke="#c7c7cc" stroke-dasharray="4 3"/>
<text x="40" y="256" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">UNION</text><rect x="220" y="238" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="250" y="256" text-anchor="middle" font-size="12" fill="#1d1d1f">1</text><rect x="300" y="238" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="330" y="256" text-anchor="middle" font-size="12" fill="#1d1d1f">2</text><rect x="380" y="238" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="410" y="256" text-anchor="middle" font-size="12" fill="#1d1d1f">3</text><rect x="460" y="238" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="490" y="256" text-anchor="middle" font-size="12" fill="#1d1d1f">4</text><text x="580" y="256" text-anchor="middle" fill="#0a84ff" font-weight="600">4행</text>
<text x="40" y="292" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">UNION ALL</text><rect x="220" y="274" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="250" y="292" text-anchor="middle" font-size="12" fill="#1d1d1f">1</text><rect x="300" y="274" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="330" y="292" text-anchor="middle" font-size="12" fill="#1d1d1f">2 ×2</text><rect x="380" y="274" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="410" y="292" text-anchor="middle" font-size="12" fill="#1d1d1f">3 ×2</text><rect x="460" y="274" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="490" y="292" text-anchor="middle" font-size="12" fill="#1d1d1f">4</text><text x="580" y="292" text-anchor="middle" fill="#0a84ff" font-weight="600">6행</text>
<text x="40" y="328" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">INTERSECT</text><rect x="220" y="310" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><rect x="300" y="310" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="330" y="328" text-anchor="middle" font-size="12" fill="#1d1d1f">2</text><rect x="380" y="310" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="410" y="328" text-anchor="middle" font-size="12" fill="#1d1d1f">3</text><rect x="460" y="310" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><text x="580" y="328" text-anchor="middle" fill="#0a84ff" font-weight="600">2행</text>
<text x="40" y="364" fill="#1d1d1f" font-weight="600" font-family="ui-monospace, Menlo, monospace">EXCEPT</text><rect x="220" y="346" width="60" height="26" rx="6" fill="#e3f9e8" stroke="#30d158"/><text x="250" y="364" text-anchor="middle" font-size="12" fill="#1d1d1f">1</text><rect x="300" y="346" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><rect x="380" y="346" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><rect x="460" y="346" width="60" height="26" rx="6" fill="none" stroke="#e5e5ea"/><text x="580" y="364" text-anchor="middle" fill="#0a84ff" font-weight="600">1행</text>
</g>
<text x="320" y="400" text-anchor="middle" font-size="12" fill="#6e6e73">위 네 줄은 조인(짝이 없으면 NULL로 채움), 아래 네 줄은 집합 연산. CROSS JOIN은 3 × 3 = 9행</text>
</svg>
