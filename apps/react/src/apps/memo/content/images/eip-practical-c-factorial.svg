<text x="335.0" y="293.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fact(1): n &lt;= 1 이므로 1</text>
<text x="150" y="360" font-size="13" fill="#0a84ff" text-anchor="middle" font-weight="600">파랑: 호출(내려감)</text>
<text x="330" y="360" font-size="13" fill="#30d158" text-anchor="middle" font-weight="600">초록: 반환(올라옴)</text>
<text x="520" y="360" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">최종 결과 24</text>
