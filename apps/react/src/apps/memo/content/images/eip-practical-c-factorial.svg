<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>fact(4) 재귀 호출이 내려가고 반환값이 올라오는 순서</title><rect width="640" height="380" fill="#fff"/><defs><marker id="m6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="m0a84ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0a84ff"/></marker><marker id="mff9f0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f0a"/></marker><marker id="m30d158" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#30d158"/></marker><marker id="mff453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff453a"/></marker><marker id="m1d1d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker></defs>
<text x="320" y="28" font-size="15" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fact(n) = n × fact(n-1),  fact(1) = 1</text>
<rect x="60" y="56" width="250" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="185.0" y="83.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fact(4): 4 × fact(3)</text>
<path d="M100 102 V122" fill="none" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#m0a84ff)"/>
<path d="M360 148 C390 126 390 96 316 78" fill="none" stroke="#30d158" stroke-width="1.5" marker-end="url(#m30d158)"/>
<text x="394" y="118" font-size="12" fill="#30d158" font-weight="600">6 반환</text>
<rect x="110" y="126" width="250" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="235.0" y="153.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fact(3): 3 × fact(2)</text>
<path d="M150 172 V192" fill="none" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#m0a84ff)"/>
<path d="M410 218 C440 196 440 166 366 148" fill="none" stroke="#30d158" stroke-width="1.5" marker-end="url(#m30d158)"/>
<text x="444" y="188" font-size="12" fill="#30d158" font-weight="600">2 반환</text>
<rect x="160" y="196" width="250" height="44" fill="#e8f2ff" stroke="#0a84ff" stroke-width="1"/>
<text x="285.0" y="223.0" font-size="14" fill="#1d1d1f" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fact(2): 2 × fact(1)</text>
<path d="M200 242 V262" fill="none" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#m0a84ff)"/>
<path d="M460 288 C490 266 490 236 416 218" fill="none" stroke="#30d158" stroke-width="1.5" marker-end="url(#m30d158)"/>
<text x="494" y="258" font-size="12" fill="#30d158" font-weight="600">1 반환</text>
