<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>Vite가 VITE_ 접두사 변수만 브라우저 코드에 넣는 과정</title>
<rect width="640" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker></defs>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1d1d1f">빌드 시각에 환경 변수가 코드로 치환되는 규칙</text>
<rect x="24" y="56" width="236" height="120" rx="10" fill="#f2f2f7"/>
<text x="40" y="80" font-size="13" font-weight="700" fill="#1d1d1f">빌드 환경의 변수</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="12">
<text x="40" y="108" fill="#0a84ff">VITE_APP_IMAGE_URL=…</text>
<text x="40" y="132" fill="#6e6e73">REACT_APP_IMAGE_URL=…</text>
<text x="40" y="156" fill="#6e6e73">DB_PASSWORD=…</text>
</g>
<rect x="300" y="56" width="316" height="120" rx="10" fill="#e6f2ff" stroke="#0a84ff"/>
<text x="316" y="80" font-size="13" font-weight="700" fill="#1d1d1f">Vite 빌드</text>
<text x="316" y="106" font-size="12.5" fill="#1d1d1f">VITE_ 로 시작하는 변수만 import.meta.env에 넣고</text>
<text x="316" y="128" font-size="12.5" fill="#1d1d1f">코드의 import.meta.env.이름을 값으로 바꾼다.</text>
<text x="316" y="150" font-size="12.5" fill="#6e6e73">나머지는 서버 비밀 값일 수 있어 넣지 않는다.</text>
<path d="M262 116 H296" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a)"/>
<text x="24" y="214" font-size="14" font-weight="700" fill="#1d1d1f">코드와 빌드 결과</text>
<rect x="24" y="226" width="592" height="66" rx="10" fill="#eafaef" stroke="#34c759"/>
<g font-family="ui-monospace, Menlo, monospace" font-size="12">
<text x="40" y="250" fill="#1d1d1f">Dock.tsx    import.meta.env.VITE_APP_IMAGE_URL</text>
<text x="40" y="274" fill="#34c759">→ "https://…" 문자열이 들어가 그림이 보인다</text>
</g>
<rect x="24" y="304" width="592" height="66" rx="10" fill="#fff0ef" stroke="#ff3b30"/>
<g font-family="ui-monospace, Menlo, monospace" font-size="12">
<text x="40" y="328" fill="#1d1d1f">Github.tsx  import.meta.env.REACT_APP_IMAGE_URL</text>
<text x="40" y="352" fill="#ff3b30">→ undefined, 사진 주소가 "undefined/me.png"</text>
</g>
<text x="24" y="390" font-size="12" fill="#6e6e73">읽는 문법(import.meta.env)만 바꾸고 이름을 바꾸지 않으면 빌드는 오류 없이 끝난다.</text>
</svg>
