<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>@layer 전후의 우선순위 비교. 전에는 명시도가 높은 .memo button이 이기고, 후에는 레이어 밖의 .memo-copy-button이 이긴다</title>
<rect width="640" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1d1d1f">같은 버튼에 걸린 두 규칙의 우선순위</text>
<text x="20" y="50" font-size="12" fill="#6e6e73">명시도 (ID, 클래스, 태그) 개수. 앞 자리부터 비교한다</text>
<rect x="20" y="66" width="290" height="246" rx="12" fill="#f2f2f7"/>
<text x="36" y="92" font-size="14" font-weight="700" fill="#1d1d1f">전: 두 규칙 모두 레이어 밖</text>
<rect x="36" y="106" width="258" height="58" rx="8" fill="#ffffff" stroke="#34c759" stroke-width="2"/>
<text x="48" y="130" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo button</text>
<text x="48" y="151" font-size="12" fill="#6e6e73">앱 기본값, 명시도 (0,1,1)</text>
<text x="282" y="130" font-size="12" font-weight="700" fill="#34c759" text-anchor="end">적용</text>
<rect x="36" y="176" width="258" height="58" rx="8" fill="#ffffff" stroke="#ff3b30" stroke-width="2" stroke-dasharray="5 4"/>
<text x="48" y="200" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-copy-button</text>
<text x="48" y="221" font-size="12" fill="#6e6e73">버튼 클래스, 명시도 (0,1,0)</text>
<text x="282" y="200" font-size="12" font-weight="700" fill="#ff3b30" text-anchor="end">무시</text>
<text x="36" y="262" font-size="12" fill="#1d1d1f">태그 하나만큼 기본값이 강하다.</text>
<text x="36" y="282" font-size="12" fill="#ff3b30">버튼 색을 적용하려면 !important를 추가해야 했다</text>
<rect x="330" y="66" width="290" height="246" rx="12" fill="#f2f2f7"/>
<text x="346" y="92" font-size="14" font-weight="700" fill="#1d1d1f">후: 기본값을 @layer reset으로</text>
<rect x="346" y="106" width="258" height="58" rx="8" fill="#ffffff" stroke="#ff3b30" stroke-width="2" stroke-dasharray="5 4"/>
<text x="358" y="130" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">@layer reset {.memo button}</text>
<text x="358" y="151" font-size="12" fill="#6e6e73">명시도 (0,1,1), 레이어 안</text>
<text x="592" y="151" font-size="12" font-weight="700" fill="#ff3b30" text-anchor="end">무시</text>
<rect x="346" y="176" width="258" height="58" rx="8" fill="#ffffff" stroke="#34c759" stroke-width="2"/>
<text x="358" y="200" font-size="13" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">.memo-copy-button</text>
<text x="358" y="221" font-size="12" fill="#6e6e73">명시도 (0,1,0), 레이어 밖</text>
<text x="592" y="221" font-size="12" font-weight="700" fill="#34c759" text-anchor="end">적용</text>
<text x="346" y="262" font-size="12" fill="#1d1d1f">레이어 순서를 명시도보다 먼저 비교한다.</text>
<text x="346" y="282" font-size="12" fill="#0a84ff">레이어 밖 규칙이 이기므로 !important가 필요 없다</text>
</svg>
