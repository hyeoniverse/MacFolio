<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><title>UML 관계 표기법</title><rect width="640" height="370" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">UML 관계의 표기법</text><defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12z" fill="#fff" stroke="#1d1d1f" stroke-width="1.2"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#1d1d1f" stroke-width="1.5"/></marker><marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M0 5L8 0L16 5L8 10z" fill="#fff" stroke="#1d1d1f" stroke-width="1.2"/></marker><marker id="diaf" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M0 5L8 0L16 5L8 10z" fill="#1d1d1f"/></marker></defs><rect x="20" y="50" width="600" height="42" rx="6" fill="#f2f2f7"/><text x="30" y="76" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">연관 (Association)</text><line x1="214" y1="71" x2="320" y2="71" stroke="#1d1d1f" stroke-width="1.5"/><text x="340" y="69" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">실선</text><text x="340" y="85" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">예: 학생 ─ 강의</text><rect x="20" y="98" width="600" height="42" rx="6" fill="#fff"/><text x="30" y="124" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">집합 (Aggregation)</text><line x1="214" y1="119" x2="320" y2="119" stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#dia)"/><text x="340" y="117" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">빈 마름모가 전체 쪽</text><text x="340" y="133" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">예: 컴퓨터 ◇─ 프린터</text><rect x="20" y="146" width="600" height="42" rx="6" fill="#f2f2f7"/><text x="30" y="172" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">포함 (Composition)</text><line x1="214" y1="167" x2="320" y2="167" stroke="#1d1d1f" stroke-width="1.5" marker-start="url(#diaf)"/><text x="340" y="165" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">채운 마름모가 전체 쪽</text><text x="340" y="181" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">예: 주문 ◆─ 주문 항목</text><rect x="20" y="194" width="600" height="42" rx="6" fill="#fff"/><text x="30" y="220" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">일반화 (Generalization)</text><line x1="214" y1="215" x2="320" y2="215" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#tri)"/><text x="340" y="213" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">빈 삼각형이 부모 쪽</text><text x="340" y="229" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">예: 자동차 ─▷ 차량</text><rect x="20" y="242" width="600" height="42" rx="6" fill="#f2f2f7"/><text x="30" y="268" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">의존 (Dependency)</text><line x1="214" y1="263" x2="320" y2="263" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="340" y="261" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">점선 화살표가 사용되는 쪽</text><text x="340" y="277" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">예: 주문 ┄> 결제</text><rect x="20" y="290" width="600" height="42" rx="6" fill="#fff"/><text x="30" y="316" text-anchor="start" font-size="13" font-weight="600" fill="#1d1d1f">실체화 (Realization)</text><line x1="214" y1="311" x2="320" y2="311" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#tri)"/><text x="340" y="309" text-anchor="start" font-size="12" font-weight="400" fill="#1d1d1f">점선 + 빈 삼각형이 인터페이스 쪽</text><text x="340" y="325" text-anchor="start" font-size="11" font-weight="400" fill="#6e6e73">예: 새 ┄▷ 날 수 있음</text><text x="320" y="352" text-anchor="middle" font-size="12" font-weight="400" fill="#6e6e73">집합은 부분이 전체와 따로 존재할 수 있고, 포함은 전체가 사라지면 부분도 함께 사라진다</text></svg>
