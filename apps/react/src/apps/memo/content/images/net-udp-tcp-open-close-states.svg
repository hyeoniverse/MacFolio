    <text x="450" y="26">서버</text>
  </g>
  <g stroke="#6e6e73" stroke-width="2">
    <line x1="190" y1="36" x2="190" y2="210"/>
    <line x1="450" y1="36" x2="450" y2="210"/>
    <line x1="190" y1="240" x2="190" y2="450"/>
    <line x1="450" y1="240" x2="450" y2="450"/>
  </g>
  <g stroke="#6e6e73" stroke-width="1.5" fill="none">
    <path d="M182,214 L198,222 L182,232 L198,240"/>
    <path d="M442,214 L458,222 L442,232 L458,240"/>
  </g>
  <g stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="190" y1="60" x2="447" y2="90"/>
    <line x1="450" y1="112" x2="193" y2="148"/>
    <line x1="190" y1="160" x2="447" y2="186"/>
  </g>
  <g stroke="#0a84ff" stroke-width="1.5" marker-end="url(#b)">
