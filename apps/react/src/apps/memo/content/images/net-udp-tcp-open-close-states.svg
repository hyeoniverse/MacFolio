  <g font-size="12" fill="#1d1d1f">
    <text x="460" y="58">LISTEN</text>
    <text x="460" y="74" fill="#6e6e73">수동 개방(passive open)</text>
    <text x="460" y="94">SYN_RCVD</text>
    <text x="460" y="190">ESTABLISHED</text>
    <text x="460" y="296">CLOSE-WAIT</text>
