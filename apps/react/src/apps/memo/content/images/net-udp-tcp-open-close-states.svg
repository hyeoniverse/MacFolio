    <line x1="450" y1="306" x2="193" y2="340"/>
    <line x1="450" y1="350" x2="193" y2="388"/>
    <line x1="190" y1="400" x2="447" y2="432"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#1d1d1f">
    <text x="320" y="66">SYN J</text>
    <text x="320" y="120">SYN K, ack J+1</text>
    <text x="320" y="164">ack K+1</text>
    <text x="320" y="268" fill="#0a84ff">FIN M</text>
    <text x="320" y="312" fill="#0a84ff">ack M+1</text>
    <text x="320" y="360" fill="#0a84ff">FIN N</text>
    <text x="320" y="406" fill="#0a84ff">ack N+1</text>
  </g>
