<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <title>GitHubAvatar의 두 층 구조</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8b8be"/><stop offset="1" stop-color="#8e8e93"/></linearGradient>
  </defs>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">같은 원 안에 두 층을 겹친다</text>
  <!-- top layer -->
  <ellipse cx="170" cy="100" rx="90" ry="30" fill="#e3f0ff" stroke="#0a84ff" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="170" y="105" font-size="13" fill="#0a84ff" text-anchor="middle">&lt;img&gt; 사진</text>
  <!-- bottom layer -->
  <ellipse cx="170" cy="210" rx="90" ry="30" fill="url(#g)" stroke="#6e6e73"/>
  <circle cx="170" cy="203" r="7" fill="#ffffff"/>
  <path d="M156 222 q14 -16 28 0 z" fill="#ffffff"/>
  <line x1="80" y1="100" x2="80" y2="210" stroke="#6e6e73" stroke-dasharray="3 3"/>
  <line x1="260" y1="100" x2="260" y2="210" stroke="#6e6e73" stroke-dasharray="3 3"/>
  <text x="170" y="270" font-size="12" fill="#6e6e73" text-anchor="middle">.github-avatar (border-radius: 50%, overflow: hidden)</text>
  <!-- labels -->
  <g font-size="13" fill="#1d1d1f">
    <text x="300" y="86" font-weight="600" fill="#0a84ff">위 층: 사진</text>
    <text x="300" y="106" font-size="12">position: absolute; inset: 0 → 원 전체를 덮는다</text>
    <text x="300" y="124" font-size="12">처음 opacity: 0, data-loaded가 붙으면 1로 페이드인</text>
    <text x="300" y="196" font-weight="600">아래 층: 회색 원 + 사람 아이콘</text>
    <text x="300" y="216" font-size="12">로그인 전 화면에서 쓰던 모양 그대로</text>
    <text x="300" y="234" font-size="12">아이콘 크기 0.42em → 56px 원이면 약 23.5px</text>
  </g>
  <rect x="24" y="290" width="592" height="28" rx="6" fill="#f2f2f7"/>
  <text x="36" y="309" font-size="12" fill="#1d1d1f">사진을 받지 못하면 위 층이 투명한 채로 남아, 아래 층의 사람 아이콘이 계속 보인다</text>
</svg>
