<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker>
  </defs>
  <rect width="640" height="456" fill="#fff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1d1d1f">저장형 XSS: 저장된 글이 다른 사람의 브라우저에서 실행된다</text>

  <!-- lanes -->
  <rect x="24" y="52" width="160" height="34" rx="8" fill="#f2f2f7"/>
  <text x="104" y="74" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">공격자</text>
  <rect x="240" y="52" width="160" height="34" rx="8" fill="#f2f2f7"/>
  <text x="320" y="74" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">API 서버 · DB</text>
  <rect x="456" y="52" width="160" height="34" rx="8" fill="#f2f2f7"/>
  <text x="536" y="74" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">관리자 브라우저</text>
  <line x1="104" y1="86" x2="104" y2="380" stroke="#c7c7cc" stroke-dasharray="4 4"/>
  <line x1="320" y1="86" x2="320" y2="380" stroke="#c7c7cc" stroke-dasharray="4 4"/>
  <line x1="536" y1="86" x2="536" y2="380" stroke="#c7c7cc" stroke-dasharray="4 4"/>

  <!-- 1 -->
  <line x1="104" y1="118" x2="316" y2="118" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="112" y="110" font-size="12" fill="#1d1d1f">① 글 저장: 본문에 공격 문자열</text>
  <!-- 2 -->
  <rect x="250" y="134" width="140" height="44" rx="6" fill="#fff" stroke="#c7c7cc"/>
  <text x="320" y="153" font-size="12" fill="#1d1d1f" text-anchor="middle">② 문자열을</text>
  <text x="320" y="169" font-size="12" fill="#1d1d1f" text-anchor="middle">그대로 저장</text>
  <!-- 3 -->
  <line x1="536" y1="206" x2="324" y2="206" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="530" y="198" font-size="12" fill="#1d1d1f" text-anchor="end">③ 글 열기 (GET /posts/:slug)</text>
  <line x1="320" y1="232" x2="532" y2="232" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="328" y="250" font-size="12" fill="#6e6e73">본문 응답 (공격 문자열 포함)</text>
  <!-- 4 -->
  <rect x="440" y="262" width="184" height="52" rx="6" fill="#fff5f4" stroke="#ff3b30"/>
  <text x="532" y="283" font-size="12" fill="#1d1d1f" text-anchor="middle">④ 렌더링이 HTML을 그대로</text>
  <text x="532" y="301" font-size="12" fill="#1d1d1f" text-anchor="middle">DOM에 넣으면 onerror 실행</text>
  <!-- 5 -->
  <line x1="536" y1="346" x2="324" y2="346" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="530" y="338" font-size="12" fill="#ff3b30" text-anchor="end">⑤ 이 사이트 출처로 DELETE 요청</text>
  <text x="330" y="366" font-size="12" fill="#6e6e73">관리자 세션 쿠키로 처리된다</text>

  <!-- payload -->
  <rect x="24" y="392" width="592" height="52" rx="6" fill="#f2f2f7"/>
  <text x="36" y="412" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">&lt;img src="x" onerror="fetch(API + '/posts/a',</text>
  <text x="36" y="432" font-size="12" fill="#1d1d1f" font-family="ui-monospace, Menlo, monospace">    {method: 'DELETE', credentials: 'include'})"&gt;   ← ①의 공격 문자열 예</text>
</svg>
