<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<title>React 앱 타입 체크 시간. TS 7.0.2 tsc는 약 4.2초에서 5.2초, TS 6.0.3 tsc6은 약 22.7초에서 23.1초</title>
<rect width="760" height="220" rx="16" fill="#ffffff"/>
<text x="32" y="36" font-size="17" fill="#1f2937" font-weight="700">apps/react 타입 체크 (tsc --noEmit, 두 번씩, npx 포함)</text>
<text x="32" y="88" font-size="12" fill="#374151" font-weight="600">TS 7.0.2 (tsc)</text>
<rect x="190" y="72" width="104" height="26" rx="5" fill="#4f46e5"/>
<text x="302" y="90" font-size="12" fill="#1f2937">4.2 ~ 5.2초</text>
<text x="32" y="138" font-size="12" fill="#374151" font-weight="600">TS 6.0.3 (tsc6)</text>
<rect x="190" y="122" width="510" height="26" rx="5" fill="#9ca3af"/>
<text x="690" y="140" font-size="12" fill="#ffffff" text-anchor="end">22.7 ~ 23.1초</text>
<line x1="190" y1="166" x2="700" y2="166" stroke="#d1d5db"/>
<text x="190" y="184" font-size="10" fill="#6b7280">0</text>
<text x="412" y="184" font-size="10" fill="#6b7280" text-anchor="middle">10초</text>
<text x="634" y="184" font-size="10" fill="#6b7280" text-anchor="middle">20초</text>
<text x="32" y="206" font-size="10.5" fill="#6b7280">같은 tsconfig.json, 같은 컴퓨터. 약 4~5배 빠르다</text>
</svg>
