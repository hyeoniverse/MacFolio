<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>MacFolio 배포 구성</title>
  <rect width="640" height="400" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">배포 구성</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker></defs>

  <!-- 브라우저 -->
  <g font-size="13" text-anchor="middle" font-weight="600">
    <rect x="32" y="170" width="112" height="40" rx="8" fill="#f3f4f6"/><text x="88" y="195" fill="#1f2937">브라우저</text>
  </g>

  <!-- Cloudflare -->
  <rect x="184" y="68" width="180" height="252" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="200" y="92" font-size="13" font-weight="700" fill="#c2410c">Cloudflare</text>
  <g font-size="12" text-anchor="middle">
    <rect x="200" y="108" width="148" height="56" rx="8" fill="#ffffff" stroke="#fed7aa"/>
    <text x="274" y="131" font-weight="600" fill="#1f2937">Workers 정적 자산</text>
    <text x="274" y="151" fill="#6b7280">macfolio.hyeoniverse.com</text>
    <rect x="200" y="224" width="148" height="56" rx="8" fill="#ffffff" stroke="#fed7aa"/>
    <text x="274" y="247" font-weight="600" fill="#1f2937">Tunnel</text>
    <text x="274" y="267" fill="#6b7280">macfolio-api.hyeoniverse.com</text>
  </g>
  <text x="274" y="306" font-size="11" text-anchor="middle" fill="#9a3412">https 인증서, DNS</text>

  <!-- Oracle VM -->
  <rect x="404" y="68" width="204" height="252" rx="12" fill="#eef0ff" stroke="#c7cbff"/>
  <text x="420" y="92" font-size="13" font-weight="700" fill="#3f46c7">Oracle VM (Always Free)</text>
  <text x="420" y="110" font-size="11" fill="#6b7280">docker compose · 여는 포트는 SSH만</text>
  <g font-size="12" text-anchor="middle">
    <rect x="420" y="124" width="172" height="40" rx="8" fill="#ffffff" stroke="#c7cbff"/>
    <text x="506" y="149" font-weight="600" fill="#1f2937">cloudflared <tspan font-weight="400" fill="#3f46c7">(밖으로 연결)</tspan></text>
    <rect x="420" y="184" width="172" height="40" rx="8" fill="#ffffff" stroke="#c7cbff"/>
    <text x="506" y="209" font-weight="600" fill="#1f2937">api (NestJS) :4000</text>
    <rect x="420" y="244" width="172" height="40" rx="8" fill="#ffffff" stroke="#c7cbff"/>
    <text x="506" y="269" font-weight="600" fill="#1f2937">db (PostgreSQL)</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none">
    <path d="M144 182 L196 140" marker-end="url(#a)"/>
    <path d="M144 198 L196 246" marker-end="url(#a)"/>
    <path d="M420 144 L352 238" stroke="#646cff" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <path d="M506 164 V180" marker-end="url(#a)"/>
    <path d="M506 224 V240" marker-end="url(#a)"/>
  </g>

  <!-- GitHub -->
  <g font-size="12" text-anchor="middle">
    <rect x="32" y="336" width="112" height="36" rx="8" fill="#1f2937"/><text x="88" y="359" font-weight="600" fill="#ffffff">GitHub OAuth</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.4" fill="none" stroke-dasharray="3 3">
    <path d="M88 210 V332" marker-end="url(#a)"/>
    <path d="M144 354 H624 V204 H596" marker-end="url(#a)"/>
  </g>
  <text x="96" y="276" font-size="11" fill="#6b7280">로그인</text>
  <text x="330" y="348" font-size="11" fill="#6b7280">code → 토큰 → 사용자 (서버에서)</text>
</svg>
