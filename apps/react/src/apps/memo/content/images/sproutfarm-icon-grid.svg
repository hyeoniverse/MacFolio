<line x1="40" y1="304" x2="280" y2="304" stroke="#8cc265" stroke-width="0.6"/>
<rect x="80" y="144" width="160" height="160" fill="#fbecd0" stroke="#4f8a3a" stroke-width="2"/>
<text x="160" y="220" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1f">캐릭터</text>
<text x="160" y="238" font-size="12" text-anchor="middle" fill="#3a3a3c">32×32칸</text>
<text x="160" y="108" font-size="12" text-anchor="middle" fill="#2d5a1e">풀밭 (48×48칸)</text>
<line x1="34" y1="304" x2="286" y2="304" stroke="#ff3b30" stroke-width="2"/>
<text x="40" y="324" font-size="12" fill="#c4302b">캐릭터 그림의 잘린 아래 끝 = 아이콘 아래 끝</text>
<text x="330" y="84" font-size="14" font-weight="700" fill="#1d1d1f">배율</text>
<rect x="330" y="98" width="400" height="74" rx="10" fill="#e9f7ef" stroke="#a3d9b1"/>
<text x="346" y="122" font-size="13" font-weight="700" fill="#1d1d1f">정수 10배 → 480×480px (채택)</text>
<text x="346" y="144" font-size="12" fill="#3a3a3c">판 한 칸 = 정확히 10×10px</text>
<text x="346" y="162" font-size="12" fill="#3a3a3c">모든 선의 굵기가 같다</text>
<rect x="330" y="186" width="400" height="74" rx="10" fill="#fdecec" stroke="#f5b5b0"/>
<text x="346" y="210" font-size="13" font-weight="700" fill="#1d1d1f">10.67배 → 512×512px (폐기)</text>
<text x="346" y="232" font-size="12" fill="#3a3a3c">칸마다 10px 또는 11px로 반올림된다</text>
<text x="346" y="250" font-size="12" fill="#3a3a3c">같은 굵기의 선이 위치에 따라 다르게 보인다</text>
<text x="330" y="294" font-size="12" fill="#3a3a3c">10배</text>
<rect x="380" y="282" width="20" height="16" fill="#4f8a3a"/>
<rect x="400" y="282" width="20" height="16" fill="#b7e08a"/>
