<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
<rect width="760" height="380" rx="16" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#1d1d1f">48×48칸 판에 32×32칸 캐릭터를 배치하는 방식 (도식)</text>
<rect x="40" y="64" width="240" height="240" fill="#b7e08a"/>
