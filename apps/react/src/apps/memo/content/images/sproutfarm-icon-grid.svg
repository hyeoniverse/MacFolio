<text x="330" y="320" font-size="12" fill="#3a3a3c">10.67배</text>
<rect x="380" y="308" width="20" height="16" fill="#4f8a3a"/>
<rect x="400" y="308" width="22" height="16" fill="#b7e08a"/>
<rect x="422" y="308" width="20" height="16" fill="#4f8a3a"/>
<rect x="442" y="308" width="22" height="16" fill="#b7e08a"/>
<rect x="464" y="308" width="22" height="16" fill="#4f8a3a"/>
<rect x="486" y="308" width="20" height="16" fill="#b7e08a"/>
<rect x="506" y="308" width="22" height="16" fill="#4f8a3a"/>
<rect x="528" y="308" width="22" height="16" fill="#b7e08a"/>
<text x="560" y="320" font-size="11" fill="#3a3a3c">칸 폭이 10px·11px로 섞인다 (2배 확대)</text>
<text x="560" y="294" font-size="11" fill="#3a3a3c">칸 폭이 모두 10px (2배 확대)</text>
<text x="24" y="364" font-size="12" fill="#3a3a3c">왼쪽 판은 한 칸을 5px로 축소해 표시했다. 8칸마다 보조선을 그렸다</text>
</svg>
