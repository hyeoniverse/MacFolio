<!doctype html>
<html lang="ko" class="booting">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="macOS 데스크톱을 웹으로 구현한 김정현의 포트폴리오" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="manifest" href="/manifest.json" />
		<title>김정현의 Mac</title>
		<style>
			/*
			 * CSS 층 순서 (styles/layers.css와 같다). 층 순서는 처음 나온 곳에서 정해지는데, 빌드하면 공통 컴포넌트의 CSS가
			 * 든 파일이 main CSS보다 먼저 붙을 수 있다. 그러면 components가 reset보다 먼저 정해져 reset의 * { padding: 0 }이
			 * 공통 버튼의 여백을 이긴다. 모든 CSS보다 앞인 여기서 순서를 정한다
			 */
			@layer reset, components;

			/* 로딩 화면이 뜨기 전(스크립트를 받는 동안)에는 배경화면 대신 검은 화면 (LoadingScreen이 booting을 뗀다) */
			html.booting,
			html.booting body {
				background: #000 !important;
			}

			/*
			 * 검색엔진이 읽을 내용 (Worker가 #root 안에 넣는다: worker/seo.ts). 화면과 같은 내용이지만 스크립트를 받는 동안
			 * 글자가 비치지 않게 숨기고, 화면 읽기 프로그램에는 남긴다. 앱이 그리기 시작하면 React가 #root 안을 바꾼다
			 */
			.seo-content {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
				clip-path: inset(50%);
				white-space: nowrap;
			}
		</style>
		<!-- 첫 화면이 그려지기 전에 테마를 적용한다. CSP가 인라인 스크립트를 막아서 파일로 둔다 -->
		<script src="/theme-boot.js"></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
