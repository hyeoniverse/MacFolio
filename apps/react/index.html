<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="macOS 데스크톱을 웹으로 구현한 김정현의 포트폴리오" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="manifest" href="/manifest.json" />
		<title>김정현의 Mac</title>
		<script>
			// 첫 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다 (shared/settings/settingsStore.ts와 같은 키)
			try {
				var theme = (JSON.parse(localStorage.getItem('macfolio:settings')) || {}).theme || 'system';
				if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
