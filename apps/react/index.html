<!doctype html>
<html lang="ko" class="booting">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="macOS 데스크톱을 웹으로 구현한 김정현의 포트폴리오" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="alternate" type="application/rss+xml" title="김정현의 Mac" href="/rss.xml" />
		<title>김정현의 Mac</title>
		<style>
			/*
			 * CSS 층 순서 (styles/layers.css와 같다). 층 순서는 처음 나온 곳에서 정해지는데, 빌드하면 공통 컴포넌트의 CSS가
			 * 든 파일이 main CSS보다 먼저 붙을 수 있다. 그러면 components가 reset보다 먼저 정해져 reset의 * { padding: 0 }이
			 * 공통 버튼의 여백을 이긴다. 모든 CSS보다 앞인 여기서 순서를 정한다
			 */
			@layer reset, components;

			/*
			 * 로딩 화면을 누르기 전까지(스크립트를 받는 동안 포함) html·body는 배경화면 대신 검은색 (LoadingScreen이 누르는 시각에 booting을 뗀다).
			 * 휴대폰 도구 막대 뒤, 화면을 끌어 내린 영역처럼 로딩 화면 밖이 보여도 배경화면이 비치지 않는다
			 */
			html.booting,
			html.booting body {
				background: #000 !important;
			}

			/*
			 * 검색엔진이 읽을 내용 (Worker가 #root 안에 넣는다: worker/seo.ts). 화면과 같은 내용이지만 스크립트를 받는 동안
			 * 글자가 비치지 않게 숨기고, 화면 읽기 프로그램에는 남긴다. 앱이 그리기 시작하면 React가 #root 안을 바꾼다
			 */
			/*
			 * 첫 그림 (#boot-splash): 스크립트를 받는 동안에도 로딩 화면과 같은 자리에 사과·시작 안내·진행 막대를 바로 그린다.
			 * 스크립트가 오기 전에 누르면 theme-boot.js가 적어 두고, 로딩 화면이 뜨자마자 시작한다.
			 * 예전에는 스크립트(첫 묶음)를 다 받고 React가 그릴 때까지 검은 화면이라, 느린 휴대폰에서 첫 그림이 5초 넘게 늦었다.
			 * 앱이 처음 그리면(App.tsx) 지운다. 크기·자리는 desktop/loading/LoadingScreen.css와 같다
			 */
			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #000;
			}

			#boot-splash svg {
				width: 6rem;
				height: 8rem;
				margin-bottom: 2rem;
				color: #fff;
				filter: drop-shadow(0 0 0.3rem #fff);
			}

			/* 글꼴은 웹 글꼴을 기다리지 않는 시스템 글꼴. LoadingScreen.css의 .loading-text와 같아야 LCP가 다시 집계되지 않는다 */
			#boot-splash p {
				margin: 1rem;
				color: #fff;
				font:
					1rem -apple-system,
					'Apple SD Gothic Neo',
					'Malgun Gothic',
					sans-serif;
			}

			/* 안내는 로딩 화면처럼 휴대폰은 탭, 데스크톱은 클릭 (desktop/layout.ts의 isMobileViewport와 같은 조건) */
			#boot-splash .tap {
				display: none;
			}

			@media (max-width: 767px), (max-width: 1023px) and (max-height: 499px) {
				#boot-splash .tap {
					display: inline;
				}

				#boot-splash .click {
					display: none;
				}
			}

			#boot-splash .track {
				width: 11rem;
				height: 0.5rem;
				border-radius: 0.5rem;
				background: #333;
				filter: drop-shadow(0 0 0.3rem #fff);
			}

			.seo-content {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
				clip-path: inset(50%);
				white-space: nowrap;
			}
		</style>
		<!-- 첫 화면이 그려지기 전에 테마를 적용한다. CSP가 인라인 스크립트를 막아서 파일로 둔다 -->
		<script src="/theme-boot.js"></script>
	</head>
	<body>
		<div id="boot-splash" aria-hidden="true">
			<svg viewBox="0 0 384 512">
				<path
					fill="currentColor"
					d="M319.1 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7-55.8 .9-115.1 44.5-115.1 133.2 0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM262.5 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
				/>
			</svg>
			<p><span class="tap">탭</span><span class="click">클릭</span>하여 로딩을 시작하세요</p>
			<div class="track"></div>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
