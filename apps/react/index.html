<!doctype html>
<html lang="ko" class="booting">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="macOS 데스크톱을 웹으로 구현한 김정현의 포트폴리오" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="manifest" href="/manifest.json" />
		<title>김정현의 Mac</title>
		<style>
			/*
			 * CSS 층 순서 (styles/layers.css와 같다). 층 순서는 처음 나온 곳에서 정해지는데, 빌드하면 공통 컴포넌트의 CSS가
			 * 든 파일이 main CSS보다 먼저 붙을 수 있다. 그러면 components가 reset보다 먼저 정해져 reset의 * { padding: 0 }이
			 * 공통 단추의 여백을 이긴다. 모든 CSS보다 앞인 여기서 순서를 정한다
			 */
			@layer reset, components;

			/* 로딩 화면이 뜨기 전(스크립트를 받는 동안)에는 배경화면 대신 검은 화면 (LoadingScreen이 booting을 뗀다) */
			html.booting,
			html.booting body {
				background: #000 !important;
			}
		</style>
		<!-- 첫 화면이 그려지기 전에 테마를 적용한다. CSP가 인라인 스크립트를 막아서 파일로 둔다 -->
		<script src="/theme-boot.js"></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
