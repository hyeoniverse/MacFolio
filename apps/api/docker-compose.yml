# 로컬 개발: `docker compose up`이면 api와 PostgreSQL이 함께 뜬다.
# DB만 띄우고 api는 `pnpm dev`로 돌릴 때는 `docker compose up -d db`.
name: macfolio
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: macfolio
      POSTGRES_PASSWORD: macfolio
      POSTGRES_DB: macfolio
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macfolio']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # .env가 있으면 GitHub OAuth 값 등을 읽는다. 아래 environment가 우선한다 (DB 주소는 컨테이너 안의 db)
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://macfolio:macfolio@db:5432/macfolio
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
