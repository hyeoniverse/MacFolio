name: secrets

# 비밀 값 스캔 (리팩터링 계획 #150, 보안). API 키·토큰·개인 키 모양의 글자가 커밋에 들어왔는지 gitleaks로 본다.
# 지금 파일만이 아니라 저장소 기록 전체를 훑는다: 한 번 커밋했다 지운 값도 기록에 남아 있어 새어 나간 것과 같다.
# 예외는 .gitleaks.toml에 적는다. GitHub 자체의 secret scanning·push protection(공개 저장소 무료)은 저장소 설정에서 따로 켠다
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 매주 월요일 09:10 KST: 규칙이 늘어나면 예전 커밋에서 새로 걸리는 것이 있을 수 있다
    - cron: '10 0 * * 1'
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 기록 전체
          fetch-depth: 0

      - name: gitleaks 받기 (버전과 체크섬 고정)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: 기록 전체 훑기
        # 걸린 값 자체는 로그에 찍지 않는다 (--redact). 무엇이 어디에서 걸렸는지만
        run: ./gitleaks git --redact --verbose --exit-code 1 .
