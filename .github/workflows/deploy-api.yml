name: API 배포

# 서버(Oracle VM)의 api 컨테이너를 지정한 이미지 태그로 바꾼다 (#100). 서버 쪽은 ops/deploy.sh가 한다.
# - ci.yml이 main에 들어온 API 변경을 이미지로 만든 뒤 부른다 (workflow_call)
# - 손으로 부르면 그 태그로 배포한다. 예전 태그를 넣으면 되돌리기다 (Actions → API 배포 → Run workflow)
#
# 저장소 Secrets (docs/deployment.md '자동 배포'):
#   DEPLOY_HOST         서버 주소
#   DEPLOY_USER         SSH 사용자 (없으면 ubuntu)
#   DEPLOY_SSH_KEY      배포 전용 개인 키. 서버의 authorized_keys에서 command=로 ops/deploy.sh만 돌게 묶는다
#   DEPLOY_KNOWN_HOSTS  서버의 호스트 키 (ssh-keyscan 결과). 가짜 서버에 붙지 않게 고정한다
# DEPLOY_HOST가 없으면 건너뛴다 (서버 설정 전에도 CI가 깨지지 않게)
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 이미지 태그 (sha-1a2b3c4). 예전 태그를 넣으면 되돌리기'
        type: string
        required: true

# 배포는 하나씩, 도중에 취소하지 않는다
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-api
      url: https://macfolio-api.hyeoniverse.com/health
    env:
      TAG: ${{ inputs.tag }}
      API_HEALTH_URL: https://macfolio-api.hyeoniverse.com/health
    steps:
      - name: 서버 설정 확인
        id: ready
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::태그 모양이 아니다 ('sha-' + 커밋 7~40자리): $TAG"
            exit 1
          fi
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST가 없어 API 배포를 건너뜁니다 (docs/deployment.md '자동 배포')"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # 서버의 ops/deploy.sh가 백업 → 이미지 받기 → 교체 → healthy·버전 확인, 안 되면 이전 버전으로 되돌리고 1로 끝난다
      - name: 서버에서 배포
        if: steps.ready.outputs.ok == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 보내는 것은 태그 하나. 서버의 키 설정(command=)이 이것을 ops/deploy.sh에 넘긴다
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 "$DEPLOY_USER@$DEPLOY_HOST" "$TAG"

      # 터널까지 거친 진짜 주소로, 이번 태그가 떠 있는지 본다
      - name: 바깥에서 버전 확인
        if: steps.ready.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$API_HEALTH_URL" || true)"
            if echo "$body" | grep -q "\"version\":\"$TAG\""; then
              echo "확인: $body"
              exit 0
            fi
            sleep 6
          done
          echo "::error::바깥 /health의 버전이 $TAG가 아니다: $body"
          exit 1
