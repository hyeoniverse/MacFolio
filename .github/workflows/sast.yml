name: sast

# 코드 정적 분석 (#213). Semgrep 공개 규칙 묶음으로 apps/react·apps/api·packages를 훑는다.
# ERROR 심각도만 실패로 친다. WARNING·INFO는 패턴만 보고 값의 출처를 모르는 규칙(정규식 생성, 객체 키 반복 등)이라
# 판정이 필요하다. 결과 전체는 SARIF 아티팩트로 남기고, 판정은 docs/security-scan.md에 적는다.
# 오탐은 그 줄에 `// nosemgrep: 규칙 ID -- 사유`로 좁게 막는다
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 매주 월요일 09:20 KST: 규칙 묶음이 바뀌면 예전 코드에서 새로 걸리는 것이 있을 수 있다
    - cron: '20 0 * * 1'
  workflow_dispatch:

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

# 코드를 읽기만 한다. SARIF는 Code scanning이 아니라 아티팩트로 올려 security-events 권한이 필요 없다
permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep 설치 (버전 고정)
        run: |
          pipx install semgrep==1.181.0
          semgrep --version

      # 시험 파일·E2E·빌드 결과는 뺀다 (docs/security-scan.md '범위와 제외')
      - name: Semgrep 검사 (ERROR만 실패)
        run: |
          semgrep scan \
            --config p/owasp-top-ten --config p/typescript --config p/nodejs --config p/javascript \
            --metrics=off \
            --exclude node_modules --exclude dist --exclude coverage --exclude e2e --exclude test \
            --exclude '*.test.ts' --exclude '*.test.tsx' --exclude '*.spec.ts' \
            --json-output semgrep.json --sarif-output semgrep.sarif \
            apps/react apps/api packages
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          jq -r '.results[] | "::\(if .extra.severity == "ERROR" then "error" else "warning" end) file=\(.path),line=\(.start.line)::\(.check_id)"' semgrep.json
          echo "Semgrep: 전체 $(jq '.results | length' semgrep.json)건, ERROR ${errors}건" >> "$GITHUB_STEP_SUMMARY"
          [ "$errors" -eq 0 ]

      - name: SARIF 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14
