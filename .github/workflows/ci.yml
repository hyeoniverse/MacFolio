name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다 (배포도 가장 새 커밋만)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 프론트엔드 배포 (Cloudflare Workers). 빌드는 Cloudflare가 아니라 여기서 하고 결과물만 올린다.
# VITE_API_URL은 빌드할 때 코드에 들어가는 값이라 배포 빌드에만 넣는다 (e2e 작업은 가짜 API를 쓴다).
# 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID
env:
  VITE_API_URL: https://macfolio-api.hyeoniverse.com

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 시험 빌드에는 API 주소를 넣지 않는다 (E2E가 가짜 API 주소를 넣는다)
      VITE_API_URL: ''
    # 화면 E2E는 e2e 작업으로 나눠 이 작업은 검사·단위·빌드·API e2e만 한다
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # package.json의 packageManager에 적힌 pnpm 버전을 쓴다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Turborepo 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # 운영 의존성에 high 이상 취약점이 새로 생기면 막는다. 하위 의존성은 pnpm-workspace.yaml의 overrides로 올린다
      - name: 의존성 취약점 검사
        run: pnpm audit --prod --audit-level=high

      - name: 포맷 검사
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 순환 의존 (madge)
        run: pnpm cycles

      - name: 타입 체크
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      # 첫 방문 번들 성능 예산: boot 번들과 index.html이 처음부터 요청하는 번들의 brotli 크기가 상한을 넘으면 실패한다.
      # 상한·근거·넘었을 때의 대응은 docs/performance.md의 '성능 예산' (apps/react/scripts/perf/budget.mjs)
      - name: 성능 예산
        run: pnpm --filter @macfolio/react perf:budget

      # API e2e 테스트용 PostgreSQL (apps/api/docker-compose.yml과 같은 계정)
      # services 대신 단계로 띄운다. services는 이미지를 못 받으면 검사·시험을 하나도 돌리지 못하고 작업 전체가 멈췄다.
      # 받는 곳도 하나에 기대지 않는다. Docker Hub는 로그인하지 않은 받기를 IP마다 제한하고(10월 10일),
      # 그 대신 쓰던 ECR Public도 같은 한도(toomanyrequests: Data limit exceeded)에 자주 걸렸다(10월 13~17일).
      # 같은 공식 이미지의 사본을 ECR Public → Google의 Docker Hub 거울(mirror.gcr.io) → Docker Hub 차례로 받는다
      - name: PostgreSQL 띄우기
        run: |
          for image in \
            public.ecr.aws/docker/library/postgres:17-alpine \
            mirror.gcr.io/library/postgres:17-alpine \
            docker.io/library/postgres:17-alpine; do
            if docker pull -q "$image"; then pulled="$image"; break; fi
            echo "::warning::$image 를 받지 못해 다음 곳에서 받습니다."
          done
          if [ -z "${pulled:-}" ]; then echo "::error::PostgreSQL 이미지를 어디에서도 받지 못했습니다."; exit 1; fi
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=macfolio -e POSTGRES_PASSWORD=macfolio -e POSTGRES_DB=macfolio \
            --health-cmd "pg_isready -U macfolio" --health-interval 2s --health-timeout 3s --health-retries 20 \
            "$pulled"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL이 60초 안에 준비되지 않았습니다."
          exit 1

      - name: API e2e 테스트
        run: pnpm --filter @macfolio/api test:e2e
        env:
          DATABASE_URL: postgresql://macfolio:macfolio@localhost:5432/macfolio

  # 화면 E2E(Playwright): 시험이 500개를 넘어 한 작업에서 돌리면 check의 시간 한도에 걸린다. 세 조각으로 나눠 동시에 돌린다
  # main push: PR에서 이미 6칸 모두 통과한 코드와 트리가 같으면(PR 브랜치가 main 최신 위였으면 머지 결과가 같다) e2e를 다시 돌리지 않는다.
  # 트리가 다르거나(그사이 main이 바뀜) PR을 거치지 않은 push면 지금처럼 다 돌린다
  e2e-reuse:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          for shard in 1 2 3 4 5 6; do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-ok-$tree-$shard" --jq '[.artifacts[] | select(.expired | not)] | length')
            if [ "$found" -eq 0 ]; then
              echo "칸 $shard: 이 트리($tree)로 통과한 기록이 없다. e2e를 다시 돌린다"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "PR에서 같은 트리($tree)로 6칸 모두 통과했다. e2e를 건너뛴다"
          echo "reuse=true" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [e2e-reuse]
    # PR에서는 e2e-reuse가 건너뛰어지므로 !cancelled()로 늘 돈다
    if: ${{ !cancelled() && needs.e2e-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    env:
      # 시험 빌드에는 API 주소를 넣지 않는다 (E2E가 가짜 API 주소를 넣는다)
      VITE_API_URL: ''
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 시험이 많아 6칸으로 나눠 돌린다 (칸마다 준비가 1분쯤 붙지만 전체 시간은 반쯤으로 준다)
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Turborepo 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 빌드
        run: pnpm build

      - name: Playwright 브라우저 설치
        run: pnpm --filter @macfolio/react exec playwright install --with-deps chromium

      - name: E2E 테스트 (${{ matrix.shard }}/6)
        run: pnpm --filter @macfolio/react test:e2e --shard=${{ matrix.shard }}/6

      - name: 실패 시 Playwright 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/react/playwright-report
            apps/react/test-results
          retention-days: 7

      # 이 칸이 통과한 코드(트리)를 적어 둔다. main에 같은 코드가 들어오면 e2e-reuse가 이것을 보고 다시 돌리지 않는다
      - name: 통과한 트리 기록
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: 통과 표시 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ok-${{ steps.tree.outputs.tree }}-${{ matrix.shard }}
          path: .node-version
          retention-days: 7

  # 서버에 떠 있는 API와 이 커밋 사이에 API에 영향이 있는 파일이 바뀌었는지 (main push). 바뀌었으면 이미지를 만들어 배포한다 (#100).
  # 직전 push와 비교하지 않는다: API를 바꾼 push의 실행이 실패하면, 다음 push에 API 변경이 없다는 이유로 그 변경이 배포에서 빠진다
  api-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # 서버의 /health version (sha-커밋 7자리). 서버에 닿지 않거나 모르는 커밋이면 바뀐 것으로 친다
          deployed=$(curl -fsS --max-time 10 "$VITE_API_URL/health" | jq -r '.version // empty' || true)
          commit=${deployed#sha-}
          echo "서버의 API: ${deployed:-알 수 없음}"
          if [ -z "$commit" ] || ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$commit" "$GITHUB_SHA" -- apps/api packages/desktop-core packages/contracts packages/og-card apps/react/public/fonts apps/react/public/imgs/memo.png package.json pnpm-lock.yaml pnpm-workspace.yaml ops/deploy.sh; then
            echo "api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  # API 이미지: 서버(1GB)에서 빌드하지 않고 여기서 만들어 GHCR에 올린다. 서버가 amd64라 amd64만
  api-image:
    needs: [check, e2e-reuse, e2e, api-changes]
    if: >-
      !cancelled() && needs.api-changes.outputs.api == 'true' && needs.check.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e-reuse.outputs.reuse == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          # /health의 version. 배포가 끝나면 바깥에서 이 값으로 새 버전이 떴는지 본다
          build-args: APP_VERSION=${{ needs.api-changes.outputs.tag }}
          tags: |
            ghcr.io/hyeoniverse/macfolio-api:${{ needs.api-changes.outputs.tag }}
            ghcr.io/hyeoniverse/macfolio-api:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버에 배포 (DEPLOY_HOST가 없으면 건너뛴다). 실패하면 서버가 이전 버전으로 되돌리고, 프론트엔드도 배포하지 않는다
  api-deploy:
    needs: [api-changes, api-image]
    uses: ./.github/workflows/deploy-api.yml
    with:
      tag: ${{ needs.api-changes.outputs.tag }}
    secrets: inherit

  # main에 들어오면 시험(check)을 통과한 커밋만 실제 사이트에 배포한다.
  # API가 바뀐 커밋은 API 배포가 끝난 뒤에 (새 API를 쓰는 화면이 옛 API에 먼저 닿지 않게). API가 그대로면 api-deploy는 건너뛴다
  # (이미지 빌드가 실패하면 api-deploy는 skipped가 되므로 api-image도 함께 본다)
  deploy:
    needs: [check, e2e-reuse, e2e, api-image, api-deploy]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e-reuse.outputs.reuse == 'true') &&
      (needs.api-image.result == 'success' || needs.api-image.result == 'skipped') &&
      (needs.api-deploy.result == 'success' || needs.api-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://macfolio.hyeoniverse.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 글마다 마지막으로 고친 날(sitemap lastmod, dateModified)을 git 기록에서 읽는다 (vite.config.ts의 seoPlugin)
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.jsonc의 build.command로 프론트엔드를 빌드한 뒤 apps/react/dist를 올린다
      - name: Cloudflare Workers에 배포
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # PR마다 미리보기 버전을 올린다 (실제 사이트는 바뀌지 않는다). 주소는 브랜치 이름으로 고정되고 PR 댓글 하나에 적는다.
  # 건너뛰는 경우: 다른 저장소에서 온 PR(Secrets가 없다), Dependabot PR(화면이 바뀌지 않는다),
  # 프론트엔드와 무관한 파일만 바뀐 PR(API·문서·워크플로만). 올리는 것 자체는 무료지만 CI 시간과 댓글이 아깝다
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # base와 비교하려면 기록이 필요하다
          fetch-depth: 0
      - name: 프론트엔드가 바뀌었는지
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 사이트 결과물에 영향이 있는 경로만 본다 (apps/api는 서버라 미리보기와 무관)
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- apps/react packages package.json pnpm-lock.yaml pnpm-workspace.yaml wrangler.jsonc .node-version; then
            echo "::notice::프론트엔드 파일이 바뀌지 않아 미리보기를 건너뜁니다"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
      - name: 미리보기 버전 올리기
        if: steps.changes.outputs.frontend == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # 토큰을 아직 넣지 않았으면 미리보기만 건너뛴다 (배포 작업은 토큰이 없으면 실패한다)
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN이 없어 미리보기를 건너뜁니다 (docs/deployment.md 참고)"
            exit 0
          fi
          # 브랜치 이름을 주소에 쓸 수 있는 모양으로 (영문 소문자·숫자·-, 40자까지)
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          pnpm exec wrangler versions upload --preview-alias "$alias" | tee upload.log
          # 출력에는 버전마다 바뀌는 주소와 브랜치 별칭 주소가 있다. 별칭 주소를 쓴다 (커밋을 더 올려도 같다)
          url=$(grep -i 'alias url' upload.log | grep -oE 'https://[^ ]+' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "미리보기: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: PR에 미리보기 주소 적기
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- macfolio-preview -->';
            const body = `${marker}\n미리보기: ${process.env.PREVIEW_URL}\n\n커밋 ${context.payload.pull_request.head.sha.slice(0, 7)} 기준`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((comment) => comment.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
