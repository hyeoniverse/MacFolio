name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다 (배포도 가장 새 커밋만)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 프론트엔드 배포 (Cloudflare Workers). 빌드는 Cloudflare가 아니라 여기서 하고 결과물만 올린다.
# VITE_API_URL은 빌드할 때 코드에 들어가는 값이라 배포 빌드에만 넣는다 (check의 E2E는 가짜 API를 쓴다).
# 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID
env:
  VITE_API_URL: https://macfolio-api.hyeoniverse.com

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 시험 빌드에는 API 주소를 넣지 않는다 (E2E가 가짜 API 주소를 넣는다)
      VITE_API_URL: ''
    # Playwright 시스템 패키지 설치(4분 안팎)까지 넣으면 13~15분 걸려서, 15분이면 조금만 느려도 잘린다
    timeout-minutes: 25
    # API e2e 테스트용 PostgreSQL (apps/api/docker-compose.yml과 같은 계정)
    # 이미지는 Docker Hub가 아니라 AWS ECR Public의 공식 이미지 사본에서 받는다.
    # Docker Hub는 로그인하지 않으면 받는 횟수를 IP마다 제한해서, GitHub 러너가 그 한도에 걸려 CI가 시작도 못 하고 멈췄다
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: macfolio
          POSTGRES_PASSWORD: macfolio
          POSTGRES_DB: macfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macfolio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # package.json의 packageManager에 적힌 pnpm 버전을 쓴다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Turborepo 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # 운영 의존성에 high 이상 취약점이 새로 생기면 막는다. 하위 의존성은 pnpm-workspace.yaml의 overrides로 올린다
      - name: 의존성 취약점 검사
        run: pnpm audit --prod --audit-level=high

      - name: 포맷 검사
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 타입 체크
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: API e2e 테스트
        run: pnpm --filter @macfolio/api test:e2e
        env:
          DATABASE_URL: postgresql://macfolio:macfolio@localhost:5432/macfolio

      - name: Playwright 브라우저 설치
        run: pnpm --filter @macfolio/react exec playwright install --with-deps chromium

      - name: E2E 테스트
        run: pnpm --filter @macfolio/react test:e2e

      - name: 실패 시 Playwright 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/react/playwright-report
            apps/react/test-results
          retention-days: 7

  # 서버에 떠 있는 API와 이 커밋 사이에 API에 영향이 있는 파일이 바뀌었는지 (main push). 바뀌었으면 이미지를 만들어 배포한다 (#100).
  # 직전 push와 비교하지 않는다: API를 바꾼 push의 실행이 실패하면, 다음 push에 API 변경이 없다는 이유로 그 변경이 배포에서 빠진다
  api-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # 서버의 /health version (sha-커밋 7자리). 서버에 닿지 않거나 모르는 커밋이면 바뀐 것으로 친다
          deployed=$(curl -fsS --max-time 10 "$VITE_API_URL/health" | jq -r '.version // empty' || true)
          commit=${deployed#sha-}
          echo "서버의 API: ${deployed:-알 수 없음}"
          if [ -z "$commit" ] || ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$commit" "$GITHUB_SHA" -- apps/api packages/desktop-core package.json pnpm-lock.yaml pnpm-workspace.yaml ops/deploy.sh; then
            echo "api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  # API 이미지: 서버(1GB)에서 빌드하지 않고 여기서 만들어 GHCR에 올린다. 서버가 amd64라 amd64만
  api-image:
    needs: [check, api-changes]
    if: needs.api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          # /health의 version. 배포가 끝나면 바깥에서 이 값으로 새 버전이 떴는지 본다
          build-args: APP_VERSION=${{ needs.api-changes.outputs.tag }}
          tags: |
            ghcr.io/hyeoniverse/macfolio-api:${{ needs.api-changes.outputs.tag }}
            ghcr.io/hyeoniverse/macfolio-api:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버에 배포 (DEPLOY_HOST가 없으면 건너뛴다). 실패하면 서버가 이전 버전으로 되돌리고, 프론트엔드도 배포하지 않는다
  api-deploy:
    needs: [api-changes, api-image]
    uses: ./.github/workflows/deploy-api.yml
    with:
      tag: ${{ needs.api-changes.outputs.tag }}
    secrets: inherit

  # main에 들어오면 시험(check)을 통과한 커밋만 실제 사이트에 배포한다.
  # API가 바뀐 커밋은 API 배포가 끝난 뒤에 (새 API를 쓰는 화면이 옛 API에 먼저 닿지 않게). API가 그대로면 api-deploy는 건너뛴다
  # (이미지 빌드가 실패하면 api-deploy는 skipped가 되므로 api-image도 함께 본다)
  deploy:
    needs: [check, api-image, api-deploy]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' &&
      (needs.api-image.result == 'success' || needs.api-image.result == 'skipped') &&
      (needs.api-deploy.result == 'success' || needs.api-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://macfolio.hyeoniverse.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.jsonc의 build.command로 프론트엔드를 빌드한 뒤 apps/react/dist를 올린다
      - name: Cloudflare Workers에 배포
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # PR마다 미리보기 버전을 올린다 (실제 사이트는 바뀌지 않는다). 주소는 브랜치 이름으로 고정되고 PR 댓글 하나에 적는다.
  # 다른 저장소에서 온 PR에는 Secrets가 없으므로 건너뛴다
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 미리보기 버전 올리기
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # 토큰을 아직 넣지 않았으면 미리보기만 건너뛴다 (배포 작업은 토큰이 없으면 실패한다)
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN이 없어 미리보기를 건너뜁니다 (docs/deployment.md 참고)"
            exit 0
          fi
          # 브랜치 이름을 주소에 쓸 수 있는 모양으로 (영문 소문자·숫자·-, 40자까지)
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          pnpm exec wrangler versions upload --preview-alias "$alias" | tee upload.log
          # 출력에는 버전마다 바뀌는 주소와 브랜치 별칭 주소가 있다. 별칭 주소를 쓴다 (커밋을 더 올려도 같다)
          url=$(grep -i 'alias url' upload.log | grep -oE 'https://[^ ]+' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "미리보기: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: PR에 미리보기 주소 적기
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- macfolio-preview -->';
            const body = `${marker}\n미리보기: ${process.env.PREVIEW_URL}\n\n커밋 ${context.payload.pull_request.head.sha.slice(0, 7)} 기준`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((comment) => comment.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
