name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright 시스템 패키지 설치(4분 안팎)까지 넣으면 13~15분 걸려서, 15분이면 조금만 느려도 잘린다
    timeout-minutes: 25
    # API e2e 테스트용 PostgreSQL (apps/api/docker-compose.yml과 같은 계정)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: macfolio
          POSTGRES_PASSWORD: macfolio
          POSTGRES_DB: macfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macfolio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # package.json의 packageManager에 적힌 pnpm 버전을 쓴다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Turborepo 캐시
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 포맷 검사
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 타입 체크
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: API e2e 테스트
        run: pnpm --filter @macfolio/api test:e2e
        env:
          DATABASE_URL: postgresql://macfolio:macfolio@localhost:5432/macfolio

      - name: Playwright 브라우저 설치
        run: pnpm --filter @macfolio/react exec playwright install --with-deps chromium

      - name: E2E 테스트
        run: pnpm --filter @macfolio/react test:e2e

      - name: 실패 시 Playwright 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/react/playwright-report
            apps/react/test-results
          retention-days: 7
