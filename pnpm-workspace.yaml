packages:
  - apps/*
  - packages/*

# 설치 스크립트 실행을 허용할 패키지 (pnpm 10은 기본적으로 막는다)
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
  # api: 데코레이터를 컴파일하는 SWC(테스트), Prisma 엔진(마이그레이션)
  - '@swc/core'
  - '@prisma/engines'

ignoredBuiltDependencies:
  # 설치 통계만 보낸다
  - '@scarf/scarf'
  # Node 버전 확인뿐이다. 지원 범위(^20.19 || ^22.12 || >=24) 밖의 Node(예: 23)에서 설치를 통째로 막으므로 건너뛴다
  - prisma

# 하위 의존성 취약점 패치 (pnpm audit --prod). 위 패키지가 고친 버전을 받으면 지운다
overrides:
  # prisma > @prisma/config: 재귀 객체 병합 시 스택 소진 (GHSA, high)
  deepmerge-ts: '^8.0.0'
  # prisma: 인증 플러그인 다운그레이드·압축 해제 무제한 (high, moderate). 이 프로젝트는 PostgreSQL이라 실제로 쓰지 않는다
  mysql2: '^3.23.1'
  # milkdown > vue 컴파일러: 소스맵 해석 서비스 거부 (high)
  source-map-js: '^1.2.2'
  # milkdown 수식: 프로토타입 오염으로 trust 제한 우회 (low)
  katex: '^0.18.2'
  # scalar 문서 앱: 자원 소비 제한 없음 (low)
  '@ai-sdk/provider-utils': '^4.0.33'
  # nestjs > express: 압축된 요청 본문 뒤의 남은 바이트로 서비스 거부 (GHSA-27r3-jxmh-p828, high)
  body-parser: '^2.4.0'
  # og-card > satori(0.7.3 고정): unzipSync 무한 반복 (moderate). 같은 0.7 버전의 수정판으로 올린다
  'fflate@0.7.3': '0.7.5'
  # nestjs > multer(2.4.0 고정): 요청이 끊긴 뒤 비동기 fileFilter가 남아 서비스 거부 (GHSA-q7qp-rjg7-q26m, high)
  'multer@2.4.0': '2.5.0'
  # scalar 문서 앱 > undici(7.29.1 고정): EventSource 파서 메모리 무제한, SRI 우회 (moderate)
  'undici@7.29.1': '7.30.1'
  # prisma 개발 도구 > ajv > fast-uri: 스킴 위장·호스트 혼동 (moderate, low)
  fast-uri: '^3.1.9'
