<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
<title>위젯 구조</title>
<rect width="640" height="420" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
</defs>

<text x="20" y="30" font-size="15" font-weight="700" fill="#1f2937">위젯 구조</text>
<text x="20" y="48" font-size="11" fill="#6b7280">부품 하나를 데스크톱과 휴대폰이 같이 쓰고, 자료는 처음 한 번만 묻는다</text>

<!-- 자료 -->
<text x="20" y="80" font-size="11" font-weight="700" fill="#6b7280">자료</text>
<rect x="20" y="90" width="180" height="44" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
<text x="110" y="108" font-size="11" fill="#075985" text-anchor="middle" font-weight="600">Open-Meteo</text>
<text x="110" y="124" font-size="10" fill="#075985" text-anchor="middle">장소·단위마다 15분 한 번 (날씨 앱과 나눔)</text>
<rect x="20" y="142" width="180" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="110" y="160" font-size="11" fill="#92400e" text-anchor="middle" font-weight="600">recent-posts + GET /posts</text>
<text x="110" y="176" font-size="10" fill="#92400e" text-anchor="middle">빌드한 최근 6편 + 서버 글, 한 번</text>
<rect x="20" y="194" width="180" height="44" rx="8" fill="#dcfce7" stroke="#22c55e"/>
<text x="110" y="212" font-size="11" fill="#166534" text-anchor="middle" font-weight="600">GET /github/activity</text>
<text x="110" y="228" font-size="10" fill="#166534" text-anchor="middle">기여 기록 (GitHub 앱과 같은 저장소)</text>
<rect x="20" y="246" width="180" height="44" rx="8" fill="#fce7f3" stroke="#ec4899"/>
<text x="110" y="264" font-size="11" fill="#9d174d" text-anchor="middle" font-weight="600">ALBUMS · useMusic · 프로필</text>
<text x="110" y="280" font-size="10" fill="#9d174d" text-anchor="middle">사진 앨범, 재생 중인 곡, 이름</text>

<!-- 부품 -->
<text x="240" y="80" font-size="11" font-weight="700" fill="#6b7280">부품 (desktop/widgets)</text>
<rect x="240" y="90" width="160" height="200" rx="12" fill="#eef2ff" stroke="#818cf8"/>
<text x="320" y="114" font-size="13" fill="#3730a3" text-anchor="middle" font-weight="700">Widget</text>
<text x="320" y="132" font-size="10" fill="#4338ca" text-anchor="middle">종류 8 × 크기 2 (작게·중간)</text>
<g font-size="10.5" fill="#3730a3">
<text x="258" y="158">· 날씨 · 캘린더 · 시계</text>
<text x="258" y="176">· 음악 · 최근 글</text>
<text x="258" y="194">· 사진 (앨범 고르기)</text>
<text x="258" y="212">· GitHub 잔디 (20주·8주)</text>
<text x="258" y="230">· 소개</text>
</g>
<text x="320" y="262" font-size="10" fill="#6366f1" text-anchor="middle">catalog.ts: 종류·크기·저장 형식</text>
<text x="320" y="278" font-size="10" fill="#6366f1" text-anchor="middle">--widget-* 토큰으로 칠한다</text>

<path d="M200 112 L238 140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M200 164 L238 172" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M200 216 L238 206" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M200 268 L238 240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

<!-- 놓는 곳 -->
<text x="440" y="80" font-size="11" font-weight="700" fill="#6b7280">놓는 곳</text>
<rect x="440" y="90" width="180" height="95" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="452" y="110" font-size="12" fill="#111827" font-weight="700">DesktopWidgets</text>
<g font-size="10" fill="#374151">
<text x="452" y="128">180px 칸 격자, 왼쪽 위부터</text>
<text x="452" y="144">끌어 옮기기 · 오른쪽 클릭(크기·앨범)</text>
<text x="452" y="160">위젯 편집… 갤러리</text>
<text x="452" y="176">macfolio:desktop:widgets</text>
</g>
<rect x="440" y="195" width="180" height="95" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="452" y="215" font-size="12" fill="#111827" font-weight="700">MobileHome</text>
<g font-size="10" fill="#374151">
<text x="452" y="233">1~3쪽 위, 페이지마다 3줄까지</text>
<text x="452" y="249">줄 높이 = 앱 두 줄이 남게</text>
<text x="452" y="265">길게 눌러 편집 · + 갤러리 · 앨범</text>
<text x="452" y="281">macfolio:mobile:widgets</text>
</g>
<path d="M400 160 L438 140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M400 220 L438 240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

<!-- 아래: 층 -->
<text x="20" y="328" font-size="11" font-weight="700" fill="#6b7280">데스크톱의 층 (위에서 아래로)</text>
<g font-size="11">
<rect x="20" y="338" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="75" y="357" text-anchor="middle" fill="#374151">메뉴 막대 · Dock</text>
<rect x="140" y="338" width="80" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="180" y="357" text-anchor="middle" fill="#374151">창</text>
<rect x="230" y="338" width="110" height="30" rx="6" fill="#eef2ff" stroke="#818cf8"/><text x="285" y="357" text-anchor="middle" fill="#3730a3" font-weight="600">위젯</text>
<rect x="350" y="338" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="405" y="357" text-anchor="middle" fill="#374151">폴더 아이콘</text>
<rect x="470" y="338" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="525" y="357" text-anchor="middle" fill="#374151">배경화면</text>
</g>
<text x="20" y="396" font-size="10.5" fill="#6b7280">위젯 층은 화면을 덮지만 위젯만 포인터를 받는다: 빈 곳을 끌면 그 아래 아이콘 층이 사각형 고르기를 한다</text>
</svg>
