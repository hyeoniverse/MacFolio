<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>CRA dev 서버는 앱 전체를 번들링한 뒤 응답하고, Vite dev 서버는 브라우저가 요청한 모듈만 변환해 응답한다</title>
  <rect width="640" height="372" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">dev 서버가 첫 응답을 보내기까지</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker></defs>

  <!-- CRA -->
  <text x="32" y="82" font-size="14" font-weight="700" fill="#1f2937">CRA (webpack)</text>
  <text x="608" y="82" font-size="13" font-weight="700" text-anchor="end" fill="#b91c1c">5.05초</text>
  <g font-size="12" text-anchor="middle">
    <rect x="32" y="96" width="120" height="56" rx="8" fill="#f3f4f6"/>
    <text x="92" y="120" font-weight="600" fill="#1f2937">src/ 모든 모듈</text>
    <text x="92" y="138" fill="#6b7280">import 그래프 전체</text>
    <rect x="188" y="96" width="200" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="288" y="120" font-weight="600" fill="#1f2937">Babel 변환 + 번들링</text>
    <text x="288" y="138" fill="#6b7280">끝날 때까지 응답 대기</text>
    <rect x="424" y="96" width="184" height="56" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="516" y="120" font-weight="600" fill="#1f2937">/static/js/bundle.js</text>
    <text x="516" y="138" fill="#6b7280">파일 하나로 응답</text>
  </g>
  <line x1="154" y1="124" x2="186" y2="124" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="124" x2="422" y2="124" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Vite -->
  <text x="32" y="200" font-size="14" font-weight="700" fill="#1f2937">Vite (네이티브 ES 모듈)</text>
  <text x="608" y="200" font-size="13" font-weight="700" text-anchor="end" fill="#15803d">0.58초</text>
  <g font-size="12" text-anchor="middle">
    <rect x="32" y="214" width="120" height="56" rx="8" fill="#f3f4f6"/>
    <text x="92" y="238" font-weight="600" fill="#1f2937">브라우저</text>
    <text x="92" y="256" fill="#6b7280">import마다 요청</text>
    <rect x="188" y="214" width="200" height="56" rx="8" fill="#eef0ff" stroke="#c7cbff"/>
    <text x="288" y="238" font-weight="600" fill="#1f2937">요청받은 파일만 변환</text>
    <text x="288" y="256" fill="#6b7280">esbuild · 의존성은 사전 번들</text>
    <rect x="424" y="214" width="184" height="56" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="516" y="238" font-weight="600" fill="#1f2937">/src/App.tsx 등</text>
    <text x="516" y="256" fill="#6b7280">모듈 단위로 응답</text>
  </g>
  <line x1="154" y1="242" x2="186" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="242" x2="422" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M516 272 C516 300 92 300 92 274" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="304" y="314" font-size="11" text-anchor="middle" fill="#6b7280">응답한 모듈의 import를 브라우저가 다시 요청한다</text>

  <text x="32" y="350" font-size="11" fill="#6b7280">측정 시점: CRA는 bundle.js가 200을 응답한 시각, Vite는 / 와 /src/App.tsx가 200을 응답한 시각 (3회 평균, 캐시 삭제)</text>
</svg>
