<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <title>발견 항목을 실제 취약점, 오탐, 영향 없음으로 판정하는 순서</title>
  <rect width="640" height="352" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#1f2937">발견 항목 판정 순서</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/></marker></defs>

  <rect x="32" y="66" width="168" height="48" rx="8" fill="#f3f4f6"/>
  <text x="116" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">규칙이 가리킨 줄</text>
  <text x="116" y="105" font-size="11" text-anchor="middle" fill="#6b7280">값의 출처를 거슬러 추적</text>
  <line x1="116" y1="116" x2="116" y2="142" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 질문 1 -->
  <rect x="32" y="144" width="168" height="62" rx="8" fill="#eef0ff" stroke="#c7cbff"/>
  <text x="116" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">규칙이 말하는 약점이</text>
  <text x="116" y="186" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">이 코드에서 성립하는가?</text>
  <text x="116" y="200" font-size="10" text-anchor="middle" fill="#6b7280">상수 입력·이미 검증된 값이면 아니다</text>
  <line x1="116" y1="208" x2="116" y2="262" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="124" y="240" font-size="12" fill="#6b7280">아니다</text>
  <rect x="32" y="264" width="168" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="116" y="288" font-size="14" font-weight="700" text-anchor="middle" fill="#374151">오탐</text>
  <text x="116" y="307" font-size="11" text-anchor="middle" fill="#6b7280">1~4번 · nosemgrep + 사유</text>

  <!-- 질문 2 -->
  <line x1="202" y1="175" x2="246" y2="175" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="224" y="167" font-size="12" text-anchor="middle" fill="#6b7280">그렇다</text>
  <rect x="248" y="144" width="180" height="62" rx="8" fill="#eef0ff" stroke="#c7cbff"/>
  <text x="338" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">공격자가 정할 수 있는 입력이</text>
  <text x="338" y="186" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">위험한 동작까지 이어지는가?</text>
  <text x="338" y="200" font-size="10" text-anchor="middle" fill="#6b7280">요청·방문자 입력·외부 응답</text>
  <line x1="338" y1="208" x2="338" y2="262" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="346" y="240" font-size="12" fill="#6b7280">아니다</text>
  <rect x="248" y="264" width="180" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="338" y="288" font-size="14" font-weight="700" text-anchor="middle" fill="#b45309">영향 없음</text>
  <text x="338" y="307" font-size="11" text-anchor="middle" fill="#6b7280">5~7번 · 방어 코드와 시험 추가</text>

  <line x1="430" y1="175" x2="474" y2="175" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="452" y="167" font-size="12" text-anchor="middle" fill="#6b7280">그렇다</text>
  <rect x="476" y="144" width="132" height="62" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="542" y="172" font-size="14" font-weight="700" text-anchor="middle" fill="#b91c1c">실제 취약점</text>
  <text x="542" y="192" font-size="11" text-anchor="middle" fill="#6b7280">이번 점검 0건</text>
</svg>
